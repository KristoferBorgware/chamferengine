<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cells, chunks &amp; corners — flat view</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0e14; color:#e6e8ee; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px 6px; }
  h1 { font-size:16px; font-weight:650; }
  .cap { padding:2px 16px 10px; font-size:13.5px; line-height:1.55; color:#b9c0d0; min-height:66px; }
  .cap b { color:#fff; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:0 8px; }
  svg { width:100%; height:auto; max-height:100%; }
  .panel { padding:12px 14px 18px; border-top:1px solid #1b2130; background:#0e121b;
           display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; font-weight:550; padding:9px 14px; border-radius:9px;
           cursor:pointer; background:#1a2130; color:#dfe3ec; border:1px solid #2a3245; }
  button:active { transform:scale(.97); }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
  .spacer { flex:1; }
</style>
</head>
<body>

<header><h1>How the pieces fit — flat view</h1></header>
<div class="cap" id="cap"></div>

<div class="stage"><svg id="svg" viewBox="-70 -70 620 560" aria-label="diagram"></svg></div>

<div class="panel">
  <button data-step="1" class="on">1 · Triangles</button>
  <button data-step="2">2 · Cells</button>
  <button data-step="3">3 · Chunks</button>
  <button data-step="4">4 · Owners</button>
</div>

<script>
const U = 56, S = 8;                       // unit spacing, big triangle side
const SQ3 = Math.sqrt(3);
const pos = (i,j) => [ i*U + j*U/2, j*U*SQ3/2 ];   // barycentric lattice -> xy

// every lattice point of the big triangle
const pts = [];
for (let j=0;j<=S;j++) for (let i=0;i+j<=S;i++) pts.push({i,j,p:pos(i,j)});

// the four children of the big triangle
const inChild = (i,j,c) => {
  if (c===0) return i<=4 && j<=4 && i+j<=4;
  if (c===1) return i>=4 && j>=0 && i+j<=8;
  if (c===2) return i>=0 && j>=4 && i+j<=8;
  return i<=4 && j<=4 && i+j>=4;            // middle, upside down
};
const COL = ['#4f8ef7','#3fb8af','#e0913a','#a56cf0'];
const owners = pts.map(({i,j}) => {
  const in_ = [0,1,2,3].filter(c => inChild(i,j,c));
  return { list:in_, owner:in_[0] };         // lowest chunk id wins
});

// small triangle edges
const key = (a,b) => a<b ? a+'|'+b : b+'|'+a;
const idx = new Map(pts.map((v,k)=>[v.i+','+v.j,k]));
const edges = new Set();
pts.forEach(({i,j},k)=>{
  for (const [di,dj] of [[1,0],[0,1],[-1,1]]){
    const n = idx.get((i+di)+','+(j+dj));
    if (n!==undefined) edges.add(key(k,n));
  }
});

const hexPath = ([x,y]) => {
  const r = U/SQ3;
  return Array.from({length:6},(_,k)=>{
    const a = (30 + 60*k) * Math.PI/180;
    return (k?'L':'M') + (x+r*Math.cos(a)).toFixed(1) + ' ' + (y+r*Math.sin(a)).toFixed(1);
  }).join(' ') + ' Z';
};

const CAPS = [
  `The <b>scaffolding</b>. Twenty of these triangles make the ball; each one splits into four smaller ones, over and over. This is one triangle already split twice.`,
  `The <b>cells</b> — the hexagons you'd stand on. Notice they sit on the <b>corners</b>, not inside the triangles. Six triangles meet at a corner, so the shape around it has six sides.`,
  `A <b>chunk</b> is one triangle at whatever depth you stopped — the piece you load from disk. Here the big triangle's four children are four chunks.`,
  `Corners on a <b>chunk border</b> sit in two or three chunks at once. Rule: the lowest-numbered chunk keeps it (ringed below). Every cell now has exactly one home.`
];

let step = 1;
function draw(){
  const S_ = [];
  const push = s => S_.push(s);

  // chunk fills
  if (step>=3) for (let c=0;c<4;c++){
    const corners = [[[0,0],[4,0],[0,4]],[[4,0],[8,0],[4,4]],
                     [[0,4],[4,4],[0,8]],[[4,0],[0,4],[4,4]]][c]
      .map(([i,j])=>pos(i,j).map(n=>n.toFixed(1)).join(','));
    push(`<polygon points="${corners.join(' ')}" fill="${COL[c]}" opacity="${step>=4?.10:.20}"/>`);
  }

  // hexagons
  if (step>=2) for (let k=0;k<pts.length;k++){
    const o = owners[k];
    const fill = step>=4 ? COL[o.owner] : 'none';
    const op   = step>=4 ? (o.list.length>1 ? .62 : .34) : 0;
    push(`<path d="${hexPath(pts[k].p)}" fill="${fill}" fill-opacity="${op}"
           stroke="#7f8aa3" stroke-opacity="${step>=4?.5:.7}" stroke-width="1.4"/>`);
  }

  // triangle scaffolding
  for (const e of edges){
    const [a,b] = e.split('|').map(Number);
    const [x1,y1] = pts[a].p, [x2,y2] = pts[b].p;
    push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
           stroke="#5a6580" stroke-width="1" stroke-opacity="${step>=2?.45:1}"/>`);
  }

  // chunk borders
  if (step>=3){
    const seg = (a,b)=>{ const [x1,y1]=pos(...a), [x2,y2]=pos(...b);
      push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffd166" stroke-width="3.2" stroke-linecap="round"/>`); };
    seg([4,0],[0,4]); seg([4,0],[4,4]); seg([0,4],[4,4]);
    const outline = [[0,0],[8,0],[0,8]].map(a=>pos(...a).join(',')).join(' ');
    push(`<polygon points="${outline}" fill="none" stroke="#ffd166" stroke-width="3.2" stroke-linejoin="round"/>`);
  }

  // corner dots
  for (let k=0;k<pts.length;k++){
    const [x,y] = pts[k].p, shared = owners[k].list.length>1;
    if (step>=4 && shared)
      push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="none" stroke="#fff" stroke-width="1.6"/>`);
    push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"
           fill="${step>=4 ? COL[owners[k].owner] : '#c7ccd9'}"/>`);
  }

  // chunk labels
  if (step>=3){
    const mid = [[[1.2,1.2]],[[5.4,1.2]],[[1.2,5.4]],[[2.7,2.7]]];
    mid.forEach((m,c)=>{ const [x,y]=pos(...m[0]);
      push(`<text x="${x}" y="${y+5}" text-anchor="middle" font-size="19" font-weight="700"
             fill="${COL[c]}" font-family="ui-sans-serif,sans-serif">${c}</text>`); });
  }

  document.getElementById('svg').innerHTML = S_.join('');
  document.getElementById('cap').innerHTML = CAPS[step-1];
}

document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-step]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); step=+b.dataset.step; draw();
}));
draw();
</script>
</body>
</html>
