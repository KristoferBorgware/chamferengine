<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D planet from noise</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0e14; color:#e6e8ee; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px 8px; }
  h1 { font-size:16px; font-weight:650; }
  .sub { font-size:12px; color:#8b93a7; margin-top:3px; }
  .stage { position:relative; flex:1; min-height:46vh; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .hud { position:absolute; top:10px; left:12px; right:12px; pointer-events:none; font-size:12px; }
  .card { pointer-events:auto; background:rgba(11,14,20,.86); border:1px solid #222839;
          border-radius:9px; backdrop-filter:blur(8px); max-width:min(340px,90%); overflow:hidden; }
  .cardhead { display:flex; align-items:center; gap:8px; width:100%; background:none; border:none;
              padding:8px 11px; font:inherit; font-size:12px; color:#fff; font-weight:600;
              cursor:pointer; text-align:left; }
  .chev { margin-left:auto; color:#6d768c; font-size:10px; transition:transform .18s; transform:rotate(180deg); }
  .card.collapsed .chev { transform:rotate(0); }
  .cardbody { padding:0 11px 9px; color:#8b93a7; line-height:1.55; }
  .card.collapsed .cardbody { display:none; }
  .panel { padding:10px 14px 16px; border-top:1px solid #1b2130; background:#0e121b; }
  .field { margin-bottom:9px; }
  .flabel { display:flex; align-items:baseline; font-size:10.5px; color:#8b93a7;
            text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .fval { margin-left:auto; font-size:12.5px; color:#fff; font-weight:650;
          text-transform:none; letter-spacing:0; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; height:22px; background:none; -webkit-appearance:none; }
  input[type=range]::-webkit-slider-runnable-track { height:5px; background:#222a3a; border-radius:3px; }
  input[type=range]::-moz-range-track { height:5px; background:#222a3a; border-radius:3px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:19px; height:19px;
    border-radius:50%; background:#4f8ef7; margin-top:-7px; border:2px solid #0b0e14; }
  input[type=range]::-moz-range-thumb { width:19px; height:19px; border-radius:50%;
    background:#4f8ef7; border:2px solid #0b0e14; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:4px; }
  button { font:inherit; font-size:12.5px; font-weight:550; padding:7px 11px; border-radius:8px;
           cursor:pointer; background:#1a2130; color:#dfe3ec; border:1px solid #2a3245; }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
  button:active { transform:scale(.97); }
  .spacer { flex:1; }
</style>
</head>
<body>

<header>
  <h1>3D planet from noise</h1>
  <div class="sub">Same generator, on the real hex grid. Drag to rotate.</div>
</header>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud"><div class="card collapsed" id="card">
    <button class="cardhead" id="cardhead"><span id="hudTitle">—</span><span class="chev">▾</span></button>
    <div class="cardbody" id="hudBody"></div>
  </div></div>
</div>

<div class="panel">
  <div class="field">
    <div class="flabel">Mountain height <span class="fval" id="ampO">0.10</span></div>
    <input type="range" id="amp" min="0" max="0.3" step="0.005" value="0.10">
  </div>
  <div class="field">
    <div class="flabel">Terrain scale <span class="fval" id="freqO">2.5</span></div>
    <input type="range" id="freq" min="0.6" max="8" step="0.1" value="2.5">
  </div>
  <div class="field">
    <div class="flabel">Sea level <span class="fval" id="seaO">1.00</span></div>
    <input type="range" id="sea" min="0.88" max="1.12" step="0.005" value="1.00">
  </div>
  <div class="bar">
    <button data-l="2">642</button>
    <button data-l="3" class="on">2.5K</button>
    <button data-l="4">10K</button>
    <span class="spacer"></span>
    <button id="seed">New seed</button>
    <button id="spin" class="on">Spin</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3=THREE.Vector3;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x070a10);
const camera=new THREE.PerspectiveCamera(45,1,.1,200); camera.position.set(0,0,3.6);
scene.add(new THREE.AmbientLight(0xffffff,.5));
const k1=new THREE.DirectionalLight(0xffffff,.95); k1.position.set(4,4,6); scene.add(k1);
const k2=new THREE.DirectionalLight(0x7fa6ff,.35); k2.position.set(-5,-2,-4); scene.add(k2);
const root=new THREE.Group(); root.rotation.set(.35,.6,0); scene.add(root);

/* ---------- noise (identical to the 2D slice) ---------- */
let SEED=1337;
function hash(x,y,z){
  let n=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1442695041)^Math.imul(SEED,362437);
  n=Math.imul(n^(n>>>13),1274126177);
  return ((n^(n>>>16))>>>0)/4294967296;
}
const fade=t=>t*t*(3-2*t);
function noise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const u=fade(x-xi),v=fade(y-yi),w=fade(z-zi);
  const L=(a,b,t)=>a+(b-a)*t, c=(dx,dy,dz)=>hash(xi+dx,yi+dy,zi+dz);
  return L(L(L(c(0,0,0),c(1,0,0),u),L(c(0,1,0),c(1,1,0),u),v),
           L(L(c(0,0,1),c(1,0,1),u),L(c(0,1,1),c(1,1,1),u),v),w)*2-1;
}
function fbm(x,y,z,oct){ let s=0,a=.5,f=1,n=0;
  for(let i=0;i<oct;i++){ s+=a*noise3(x*f,y*f,z*f); n+=a; a*=.5; f*=2; } return s/n; }

/* ---------- Goldberg cells ---------- */
const PHI=(1+Math.sqrt(5))/2;
const IV=[[-1,PHI,0],[1,PHI,0],[-1,-PHI,0],[1,-PHI,0],[0,-1,PHI],[0,1,PHI],[0,-1,-PHI],[0,1,-PHI],
          [PHI,0,-1],[PHI,0,1],[-PHI,0,-1],[-PHI,0,1]].map(v=>new V3(...v).normalize());
const IF=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
          [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
function ringSort(p,n){
  const nn=n.clone().normalize(), h=Math.abs(nn.z)<.9?new V3(0,0,1):new V3(1,0,0);
  const t=h.clone().cross(nn).normalize(), b=nn.clone().cross(t);
  return p.map(q=>({q,a:Math.atan2(q.dot(b),q.dot(t))})).sort((x,y)=>x.a-y.a).map(o=>o.q);
}
const cellCache={};
function cells(level){
  if (cellCache[level]) return cellCache[level];
  let verts=IV.map(v=>v.clone()), faces=IF.map(f=>f.slice());
  for(let s=0;s<level;s++){
    const cache=new Map();
    const mid=(a,b)=>{ const k=a<b?a+'_'+b:b+'_'+a;
      if(cache.has(k))return cache.get(k);
      verts.push(verts[a].clone().add(verts[b]).normalize());
      cache.set(k,verts.length-1); return verts.length-1; };
    const nx=[];
    for(const [a,b,c] of faces){ const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      nx.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]); }
    faces=nx;
  }
  const cen=faces.map(([a,b,c])=>verts[a].clone().add(verts[b]).add(verts[c]).normalize());
  const inc=verts.map(()=>[]); faces.forEach((f,fi)=>f.forEach(vi=>inc[vi].push(fi)));
  return cellCache[level]=verts.map((v,vi)=>({ring:ringSort(inc[vi].map(fi=>cen[fi]),v), dir:v.clone()}));
}

/* ---------- generator ---------- */
let amp=.10, freq=2.5, sea=1.00, level=3, spin=true;
const COL={ grass:0x4a7c3f, sand:0xc9b07a, snow:0xe8eef5, stone:0x59616e, water:0x2a5c8a };

function build(){
  while(root.children.length){ const m=root.children.pop(); if(m.geometry)m.geometry.dispose(); }
  const cs=cells(level);
  const pos=[], col=[];
  const P=(v,c)=>{ pos.push(v.x,v.y,v.z); col.push(c.r,c.g,c.b); };
  const tmp=new THREE.Color();
  let land=0;

  for (const {ring,dir} of cs){
    const surf = 1 + amp*fbm(dir.x*freq, dir.y*freq, dir.z*freq, 5);
    const top = Math.max(surf, sea);
    let mat;
    if (surf <= sea) mat='water';
    else {
      land++;
      const temp = fbm(dir.x*1.7, dir.y*1.7, dir.z*1.7 + 9.1, 3);
      mat = (surf-sea) > amp*1.05 ? 'snow'
          : (surf-sea) < amp*0.16 ? 'sand'
          : (temp + (surf-1)*3.0 > .42) ? 'snow' : 'grass';
    }
    tmp.setHex(COL[mat]);
    if (mat!=='water'){ const s=0.86+0.28*(surf-1)/(amp||1); tmp.multiplyScalar(Math.max(.6,Math.min(1.25,s))); }

    const shrunk = ring.map(p=>p.clone().lerp(dir,0.02).normalize());
    const t = shrunk.map(p=>p.clone().multiplyScalar(top));
    const b = shrunk.map(p=>p.clone().multiplyScalar(0.80));
    const cT = dir.clone().multiplyScalar(top), cB = dir.clone().multiplyScalar(0.80);
    for(let i=0;i<t.length;i++){
      const j=(i+1)%t.length;
      P(cT,tmp); P(t[i],tmp); P(t[j],tmp);
      P(t[i],tmp); P(b[i],tmp); P(b[j],tmp);
      P(t[i],tmp); P(b[j],tmp); P(t[j],tmp);
      P(cB,tmp); P(b[j],tmp); P(b[i],tmp);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));
  g.computeVertexNormals();
  root.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({vertexColors:true,flatShading:true,
    shininess:12,side:THREE.DoubleSide})));

  document.getElementById('hudTitle').textContent =
    `${cs.length} cells · ${(100*land/cs.length).toFixed(0)}% land`;
  document.getElementById('hudBody').innerHTML =
    `Height comes from 3D noise sampled on each cell's <b style="color:#fff">direction vector</b> —
     not on its face coordinates. That's why no face seam or pentagon is visible anywhere in the
     terrain: the generator never sees them.`;
}

/* ---------- ui ---------- */
const card=document.getElementById('card');
document.getElementById('cardhead').addEventListener('click',()=>card.classList.toggle('collapsed'));
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('pointermove',e=>{ if(!drag)return;
  root.rotation.y+=(e.clientX-lx)*.006; root.rotation.x+=(e.clientY-ly)*.006;
  lx=e.clientX; ly=e.clientY; });
canvas.addEventListener('wheel',e=>{ e.preventDefault();
  camera.position.z=Math.min(9,Math.max(1.5,camera.position.z+e.deltaY*.002)); },{passive:false});

const bind=(id,out,set,fmt)=>{ const el=document.getElementById(id);
  el.addEventListener('input',()=>{ set(+el.value);
    document.getElementById(out).textContent=fmt(+el.value); build(); }); };
bind('amp','ampO',v=>amp=v,v=>v.toFixed(2));
bind('freq','freqO',v=>freq=v,v=>v.toFixed(1));
bind('sea','seaO',v=>sea=v,v=>v.toFixed(2));
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); level=+b.dataset.l; build(); }));
document.getElementById('seed').addEventListener('click',()=>{ SEED=Math.floor(Math.random()*1e6); build(); });
document.getElementById('spin').addEventListener('click',e=>{
  spin=!spin; e.target.classList.toggle('on',spin); });

function resize(){ const s=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(s.width,s.height,false);
  camera.aspect=s.width/s.height; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);
(function loop(){ requestAnimationFrame(loop);
  if(spin&&!drag) root.rotation.y+=.0018;
  renderer.render(scene,camera); })();
resize(); build();
</script>
</body>
</html>
