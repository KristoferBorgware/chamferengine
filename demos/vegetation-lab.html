			/** Every layer row by key, and the shape rows a species writes. */
			const LAYER_ROWS = new Map();
			for (const part of LAYER_SECTIONS)
				for (const row of part.rows) LAYER_ROWS.set(row.key, row);
			/** The rows a species writes when it is picked. */
			const SHAPE_KEYS = [
				"height", "trunk", "taper", "first", "children", "spread",
				"lengthRatio", "radiusRatio", "levels", "up", "droop", "bend",
				"bendFeature", "leafRadius", "leafRough", "leafFill", "leafTip",
			];

			/**
			 * Every world row: what it is called, what it may be, and what it
			 * opens at.
			 *
			 * **The world rows are the other labs' rows, spelled the same and
			 * defaulting to the same values**, so a seed and a depth mean one
			 * thing across the whole set of them. What differs is the level the
			 * hexagons are drawn at: the map is the terrain, so a landscape lab
			 * draws map cells, and a plant stands on **blocks** -- the patch
			 * here is the block grid at the full subdivision depth, with the
			 * coarse map read underneath it exactly as the engine reads it.
			 */
			const KNOBS = [
				{
					group: "World",
					open: true,
					rows: [
						{ key: "seed", label: "Seed", type: "text", value: "chamfer" },
						{
							// **The pictures are the whole planet or the patch,
							// and every one of them switches together.** A
							// vegetation field read at planet scale says which
							// continents a species is on; read over the patch it
							// says which side of one hill. Asking that question
							// once, for all the pictures at once, is what lets
							// the ground picture and a layer's own picture be
							// compared -- two pictures of different places are
							// not a comparison.
							key: "show",
							label: "Pictures show",
							type: "select",
							options: ["planet", "patch"],
							value: "planet",
							note: () =>
								knobs.show === "planet"
									? "click a picture to move the patch · right-click enlarges"
									: "click a picture to enlarge it",
						},
						{
							// **A layer's picture answers two questions and only
							// one of them at a time.** *Where does this grow* is
							// the field read through the curve, which is what the
							// world will actually do; *what does the field say*
							// is the reading itself, which is what a curve is
							// drawn against and the only picture that shows what
							// is happening either side of a curve's own ends. The
							// second is the default, because a reader arriving at
							// a layer is about to draw a curve and cannot draw
							// one against a picture the curve has already been
							// applied to.
							key: "layerPicture",
							label: "Layers show",
							type: "select",
							options: ["noise", "density"],
							value: "noise",
							note: () =>
								knobs.layerPicture === "noise"
									? "the reading itself, black at −1 and white at +1 · " +
										"the whole field, sea included, because a field has " +
										"a value everywhere and the ground picture above " +
										"says where the land is"
									: "the reading through the curve, in the layer's own " +
										"green · which is what the world will do, with the " +
										"sea left black because nothing grows in it",
						},
						{ key: "groundPicture", label: "", type: "picture", value: 0 },
						{
							key: "subdivisionDepth",
							label: "Subdivision depth",
							low: 4, high: 17, step: 1, value: 13, digits: 0,
							note: () =>
								field
									? `radius <b>${Math.round(field.k.radius).toLocaleString()} m</b>, ` +
										`block <b>${field.k.blockSize.toFixed(2)} m</b>, ` +
										`cell <b>${field.cellMetres.toFixed(2)} m</b> across`
									: "",
						},
						{
							key: "blockSize",
							label: "Block size",
							low: 0.25, high: 4, step: 0.25, value: 1, digits: 2, unit: "m",
							note: () =>
								"a plant is measured in metres and built in blocks, " +
								"so this is what decides whether a trunk can taper at all",
						},
						{
							// The coarse map is the terrain. It is far wider than
							// a block, so a patch this size sits on two or three
							// of its cells and the ground under a grove is a ramp.
							key: "coarseSpacing",
							label: "Map cell",
							low: 4, high: 128, step: 4, value: 16, digits: 0, unit: "m",
							note: () =>
								field
									? `level <b>${field.k.level}</b> = <b>${field.k.mapMetres.toFixed(1)} m</b>, ` +
										`<b>${(field.span / field.k.mapMetres).toFixed(1)}</b> map cells under the patch`
									: "",
						},
						{
							// **Level of detail is a subdivision depth.** The
							// same ground drawn at a shallower one, which is the
							// engine's rule -- levels do not nest, so a coarse
							// mesh re-evaluates the terrain rather than dropping
							// cells out of a fine one.
							key: "lod",
							label: "Level of detail",
							low: 0, high: 5, step: 1, value: 0, digits: 0,
							note: () =>
								field
									? `blocks <b>${field.block.toFixed(1)} m</b> · ` +
										`<b>${field.count.toLocaleString()}</b> hexagons drawn over ` +
										`<b>${field.roots.toLocaleString()}</b> planting cells — the ` +
										`ground gets cheaper with the level and the roots do not`
									: "",
						},
						{
							key: "cells",
							label: "Patch",
							low: 24, high: 256, step: 8, value: 96, digits: 0,
							unit: "blocks across",
							note: () =>
								field
									? `<b>${Math.round(field.span).toLocaleString()} m</b> of ground, ` +
										`<b>${field.count.toLocaleString()}</b> hexagons`
									: "",
						},
						// **Where the page opens is a place that has ground on
						// it**, chosen off the picture rather than left where a
						// one-stack world happened to put land: with a real
						// continent model most of the planet is ocean, and a lab
						// about plants that opens under water has nothing on
						// screen and nothing to say why.
						{ key: "latitude", label: "Latitude", low: -85, high: 85, step: 1, value: 20, digits: 0, unit: "°" },
						{ key: "longitude", label: "Longitude", low: -180, high: 180, step: 1, value: 10, digits: 0, unit: "°" },
					],
				},
				{
					group: "Plants",
					tint: "leaf",
					panel: "plants",
					rows: [
						{
							key: "leavesCollide",
							label: "Leaves are solid",
							type: "check",
							value: true,
							note: () =>
								field
									? `<b>${(100 * field.walkable).toFixed(1)}%</b> of the ground ` +
										`can be walked onto — the rest is blocked at knee height`
									: "",
						},
					],
				},
			];

			/**
			 * How the patch is cut into chunks, and how far past its own rim a
			 * chunk looks.
			 *
			 * **Not knobs, because per-chunk generation is not an option here.**
			 * A chunk gets an address and the seed and nothing else, so a plant
			 * whose canopy crosses a boundary is grown twice, identically, by
			 * two chunks that never speak -- that is the property this lab
			 * exists to hold, and a switch for it would suggest the other way
			 * were also on offer. The reach has to cover the widest canopy: at
			 * 24 m the same ground cut up and generated whole came out **0 cells
			 * different**, at 16 m 0, at 8 m 704 and at none 10,702.
			 */
			const CHUNK_CELLS = 48;
			const CHUNK_REACH = 24;

			/** Every world row by key, and the draft the panel is editing. */
			const ROWS = new Map();
			for (const group of KNOBS)
				for (const row of group.rows) ROWS.set(row.key, row);
			const knobs = {};
			for (const [key, row] of ROWS) knobs[key] = row.value;
			const rows = new Map();
			let field = null;
			let cost = 0;

			// ---------------------------------------------------------------
			// The layers.
			// ---------------------------------------------------------------

			/**
			 * Every vegetation layer, in the order they are offered a cell.
			 *
			 * **A cell holds one plant, so the order is the tie-break.** Each
			 * layer rolls its own hash against its own density at every root,
			 * and the first one that wants the cell takes it -- which makes a
			 * layer's density the share of what is *left*, not of the ground.
			 * Any other rule needs the layers to know about each other, and a
			 * layer that reads its neighbour is not a layer.
			 */
			const layers = [];
			let nextLayerId = 1;

			/**
			 * A layer's own salt, taken from its id rather than its position.
			 *
			 * **Deleting the first of three layers must not re-plant the other
			 * two.** An index would do exactly that: every hash under it would
			 * shift and the whole planet would be re-sown by an edit that said
			 * nothing about it. An id is handed out once and travels in the
			 * link, so a layer keeps its own forest for as long as it exists.
			 */
			function saltOf(layer) {
				return 909 + layer.id * 7919;
			}

			/** A new layer, starting from one species' numbers. */
			function makeLayer(species) {
				const preset = PRESETS[species] ?? CUSTOM;
				const values = {};
				for (const [key, row] of LAYER_ROWS) {
					if (row.type === "spline") continue;
					values[key] = row.value;
				}
				for (const key of SHAPE_KEYS) values[key] = preset[key];
				values.useLeaves = preset.leaves;
				return {
					id: nextLayerId++,
					species,
					values,
					curve: LAYER_ROWS.get("curve").value.map((point) => [...point]),
					wood: preset.wood,
					leaf: preset.leaf,
					on: true,
					open: true,
					// Filled by every rebuild, so the card can say what it grew.
					grown: 0,
				};
			}

			/** Write a species' numbers into a layer that already exists. */
			function applySpecies(layer, species) {
				const preset = PRESETS[species] ?? CUSTOM;
				layer.species = species;
				for (const key of SHAPE_KEYS) layer.values[key] = preset[key];
				layer.values.useLeaves = preset.leaves;
				layer.wood = preset.wood;
				layer.leaf = preset.leaf;
			}

			/** A layer's noise stack, read off its own rows. */
			function layerSettings(layer, radius) {
				const v = layer.values;
				return {
					frequency: radius / Math.max(1, v.feature * v.featureScale),
					octaves: Math.round(v.octaves),
					persistence: v.persistence,
					lacunarity: v.lacunarity,
					offsetX: 0,
					offsetY: 0,
					ridge: v.fold,
				};
			}

			/**
			 * How much of this layer one place will take, in `[0, 1]`.
			 *
			 * The field is read **in 3D world space from the direction vector**,
			 * never from a face's own `(i, j)` -- face coordinates are
			 * discontinuous at all thirty face edges, and a stand of trees that
			 * stopped dead along one would be the seam made visible.
			 */
			function layerShareAt(layer, x, y, z, seed, settings) {
				return splineAt(
					layer.curve,
					octaveNoise(x, y, z, seed + saltOf(layer), settings),
				);
			}

			/** A CSS colour out of one of a layer's two float triples. */
			function inkOf(rgb) {
				return `rgb(${rgb.map((c) => Math.round(c * 255)).join(",")})`;
			}

			/** What the knobs come to once the ones that imply others are read. */
			function derived() {
				const k = {};
				for (const key of ROWS.keys()) k[key] = knobs[key];
				k.radius =
					(knobs.blockSize * 2 ** knobs.subdivisionDepth) / CELL_CONSTANT;
				// The coarse map's level, chosen exactly as the engine chooses
				// it, and capped at 9 the same way.
				k.level = Math.max(
					2,
					Math.min(
						knobs.subdivisionDepth,
						9,
						Math.max(
							0,
							Math.round(
								Math.log2((CELL_CONSTANT * k.radius) / knobs.coarseSpacing),
							),
						),
					),
				);
				k.mapMetres = (CELL_CONSTANT * k.radius) / 2 ** k.level;
				k.blockMetres =
					(CELL_CONSTANT * k.radius) / 2 ** knobs.subdivisionDepth;
				return k;
			}

			/**
			 * A knob's own ends, narrowed by the rest of the draft.
			 *
			 * A slider that cannot reach a refusal beats a refusal that explains
			 * itself. Two bind here: the map cannot be finer than the block grid
			 * it is read on, and a patch of block cells has to stay small enough
			 * to build while a slider is moving.
			 */
			function liveRange(row) {
				if (row.key === "coarseSpacing") {
					const k = derived();
					return {
						...row,
						low: Math.max(row.low, Math.ceil(k.blockMetres * 4)),
					};
				}
				return row;
			}

			/** Pull every knob inside its own narrowed ends, inward only. */
			function settle() {
				for (const g of KNOBS)
					for (const r of g.rows) {
						if (r.digits === undefined || r.type) continue;
						const live = liveRange(r);
						knobs[r.key] = Math.min(live.high, Math.max(live.low, knobs[r.key]));
					}
			}

			/** A latitude and a longitude, as a unit direction. */
			function directionOf(latitude, longitude) {
				const lat = (latitude * Math.PI) / 180;
				const lon = (longitude * Math.PI) / 180;
				return [
					Math.cos(lat) * Math.cos(lon),
					Math.sin(lat),
					Math.cos(lat) * Math.sin(lon),
				];
			}

			function cross3(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],
				];
			}

			/**
			 * East, up and north at one place on the planet.
			 *
			 * Up is `normalize(position)` and there is no global north, so north
			 * is whatever is left after east is taken out of the polar axis.
			 */
			function frameOf(up) {
				const axis = [0, 1, 0];
				let east = cross3(axis, up);
				let len = Math.sqrt(east[0] ** 2 + east[1] ** 2 + east[2] ** 2);
				if (len < 1e-9) {
					east = cross3([1, 0, 0], up);
					len = Math.sqrt(east[0] ** 2 + east[1] ** 2 + east[2] ** 2);
				}
				east = east.map((v) => v / len);
				const north = cross3(up, east);
				return { east, up, north };
			}

			/**
			 * The coarse map cell a block cell reads its ground from.
			 *
			 * **Scale the barycentric weights and repair them, never shift
			 * `(i, j)`.** A cell is a Voronoi region and a shift is a floor, so
			 * shifting names the wrong cell for 43.9% of cells one level out and
			 * 79.3% four levels out. `hexRound` on the scaled weights is the
			 * engine's own answer.
			 */
			function coarseOf(face, n, i, j, m) {
				const s = n / m;
				const [, ci, cj] = hexRound((n - i - j) / s, i / s, j / s, m);
				return { face, i: ci, j: cj };
			}

			/**
			 * The three coarse lattice points a block cell stands between, and
			 * how much of each it takes.
			 *
			 * **A map cell is a straight ramp, not a plateau.** The map is the
			 * terrain and its cells are far wider than a block -- 16 m here
			 * against 1 m -- so reading one height per map cell and giving it to
			 * every block underneath builds a staircase of 16 m treads with a
			 * cliff at every edge. Interpolated instead, the same map draws a
			 * hillside: measured on the shipped world, a map cell's own ramp
			 * rises 4.0 m at the median of land cells, which is one block of
			 * climb every eight.
			 *
			 * Which three points, on a triangular lattice, is decided by what is
			 * left over when the three scaled weights are floored: one leftover
			 * is an upward triangle and two is a downward one.
			 */
			function coarseCorners(face, n, i, j, m) {
				const s = n / m;
				const u = (n - i - j) / s;
				const v = i / s;
				const w = j / s;
				const fu = Math.floor(u);
				const fv = Math.floor(v);
				const fw = Math.floor(w);
				const over = m - (fu + fv + fw);
				const du = u - fu;
				const dv = v - fv;
				const dw = w - fw;
				if (over <= 0)
					return [[fv, fw, 1], [fv, fw, 0], [fv, fw, 0]];
				if (over === 1)
					return [
						[fv, fw, du],
						[fv + 1, fw, dv],
						[fv, fw + 1, dw],
					];
				return [
					[fv + 1, fw + 1, 1 - du],
					[fv, fw + 1, 1 - dv],
					[fv + 1, fw, 1 - dw],
				];
			}

			// ---------------------------------------------------------------
			// The terrain.
			// ---------------------------------------------------------------

			/**
			 * A curve read at `at`, straight-line between the points it holds.
			 *
			 * `at` is a noise value in `[-1, 1]` and the answer is in `[0, 1]`.
			 * Outside the outermost points the curve holds its end value, so a
			 * field that reaches further than the curve was drawn for still has
			 * an answer and the answer is the one the edge of the curve gave.
			 */
			function splineAt(points, at) {
				if (points.length === 0) return 0;
				if (at <= points[0][0]) return points[0][1];
				const last = points[points.length - 1];
				if (at >= last[0]) return last[1];
				for (let n = 1; n < points.length; n++) {
					const [x1, y1] = points[n];
					if (at > x1) continue;
					const [x0, y0] = points[n - 1];
					const span = x1 - x0;
					if (span <= 1e-9) return y1;
					return y0 + ((y1 - y0) * (at - x0)) / span;
				}
				return last[1];
			}

			/** A curve as a query-string value, and back. */
			function splineToText(points) {
				return points
					.map(([x, y]) => `${+x.toFixed(3)}:${+y.toFixed(3)}`)
					.join(",");
			}
			function splineFromText(text) {
				const out = [];
				for (const pair of String(text).split(",")) {
					const [x, y] = pair.split(":").map(Number);
					if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
					out.push([
						Math.max(-1, Math.min(1, x)),
						Math.max(0, Math.min(1, y)),
					]);
				}
				out.sort((a, b) => a[0] - b[0]);
				return out.length >= 2 ? out : null;
			}

			/**
			 * **The terrain here is the multi-noise lab's, frozen.**
			 *
			 * This lab is about what grows on a hillside, not about the
			 * hillside, and the two want opposite things from a panel: a
			 * landscape lab earns its length by putting every term of the model
			 * on screen, and here every one of those rows is a row between a
			 * reader and the plants. So the model is the other lab's -- three
			 * fields read through three curves, continentalness setting the
			 * level, erosion deciding how much relief survives and peaks and
			 * valleys being the relief -- at that lab's own shipped numbers,
			 * with nothing exposed. **A seed is the whole of the input.**
			 *
			 * One stack of octaves was what stood here before, and it is what a
			 * planting field cannot be tuned against: fBm is homogeneous, so
			 * one statistic describes the whole planet and there is no shore,
			 * no plain and no range for a species to prefer. A vegetation layer
			 * that says *this kind grows on lowland near the coast* needs a
			 * world that has one.
			 */
			const TERRAIN = {
				relief: 800,
				seaDepth: 360,
				peakRelief: 220,
				seaLevel: 0,
				erosionBite: 0.55,
				cont: {
					metres: 6000,
					octaves: 3,
					persistence: 0.5,
					lacunarity: 2,
					ridge: 0,
					curve: [
						[-1, 0],
						[-0.34, 0.0967],
						[-0.06, 0.29],
						[0.06, 0.3222],
						[0.0876, 0.5],
						[0.1, 0.536],
						[0.26, 0.652],
						[0.46, 0.8405],
						[1, 1],
					],
				},
				ero: {
					metres: 7500,
					octaves: 4,
					persistence: 0.5,
					lacunarity: 2,
					ridge: 0,
					curve: [
						[-1, 0],
						[-0.3, 0.05],
						[-0.1, 0.45],
						[0.05, 0.82],
						[0.3, 0.94],
						[1, 0.98],
					],
				},
				pv: {
					metres: 600,
					octaves: 4,
					persistence: 0.5,
					lacunarity: 2,
					ridge: 0.85,
					curve: [
						[-1, 0.06],
						[-0.45, 0.24],
						[-0.05, 0.42],
						[0.25, 0.58],
						[0.55, 0.84],
						[1, 1],
					],
				},
			};

			/** Offsets from the world seed, so the three fields are three fields. */
			const TERRAIN_SEED = { cont: 101, ero: 211, pv: 337 };

			/**
			 * The level the histograms under the curves are counted over.
			 *
			 * **A curve governs the planet, so what sits under it has to be
			 * counted over the planet** -- a patch is a place, and a place can
			 * be entirely on one side of a curve while the world is spread
			 * across all of it. Level 5 is 10,242 cells, which is the engine's
			 * own grid at a level coarse enough to run on every knob move.
			 */
			const TALLY_LEVEL = 5;
			const TALLY_BINS = 48;

			/** Every cell of the planet at that level, as directions, built once. */
			const WORLD = (() => {
				const n = 1 << TALLY_LEVEL;
				const out = [];
				for (let face = 0; face < 20; face++)
					for (let i = 0; i <= n; i++)
						for (let j = 0; i + j <= n; j++) {
							// A cell on a face edge or an icosahedron vertex has
							// several names and must be counted once, so it is
							// taken only by the face that owns it.
							if (canonicalCell(face, n, i, j).face !== face) continue;
							out.push(latticePosition(face, n, i, j));
						}
				return out;
			})();

			/**
			 * Which of those cells are dry, worked out once per world.
			 *
			 * **A vegetation curve is read on land and nowhere else**, so the
			 * bars under it count land -- and the sea is most of a planet with
			 * a continent model on it, so counting the whole sphere would put
			 * two thirds of every bar under ground no plant will ever stand on.
			 * The mask is a function of the seed and the radius alone, and both
			 * layers and every knob move share one, so it is worked out when
			 * either of those changes and not again.
			 */
			const DRY = { seed: null, radius: 0, mask: null, count: 0 };
			function dryMask(seed, radius) {
				if (DRY.mask && DRY.seed === seed && DRY.radius === radius) return DRY;
				const s = terrainSettings(radius);
				const mask = new Uint8Array(WORLD.length);
				let count = 0;
				for (let n = 0; n < WORLD.length; n++)
					if (mapHeightAt(WORLD[n], seed, s) > TERRAIN.seaLevel) {
						mask[n] = 1;
						count++;
					}
				DRY.seed = seed;
				DRY.radius = radius;
				DRY.mask = mask;
				DRY.count = count;
				return DRY;
			}

			/** The three stacks at one radius, built once per rebuild. */
			function terrainSettings(radius) {
				const out = {};
				for (const which of ["cont", "ero", "pv"]) {
					const part = TERRAIN[which];
					out[which] = {
						// A layer is set in metres and the noise takes a
						// frequency: the sample point is a unit direction, so a
						// frequency counts how many times the widest octave
						// repeats across the whole planet. Metres divided by the
						// radius reach it, and the number then means the same
						// thing whatever size the planet is.
						frequency: radius / part.metres,
						octaves: part.octaves,
						persistence: part.persistence,
						lacunarity: part.lacunarity,
						offsetX: 0,
						offsetY: 0,
						ridge: part.ridge,
					};
				}
				return out;
			}

			/**
			 * The ground, in metres against sea level, at one coarse map cell.
			 *
			 * Continentalness sets the level and its curve's **middle is the
			 * waterline**, with the two halves scaling apart -- up to `relief`
			 * above it and down to `seaDepth` below -- so the coast is where the
			 * curve crosses the middle and no metre knob moves it. Erosion says
			 * how much of the relief is taken away and, in proportion to
			 * `erosionBite`, how much of the level goes with it, because water
			 * wears a range down as well as smoothing it. Peaks and valleys is
			 * the relief itself, signed about the level the continent set.
			 * Below sea level nothing is worn: the ocean floor is not what the
			 * rain is falling on.
			 */
			function mapHeightAt(p, seed, s) {
				const cont = octaveNoise(p[0], p[1], p[2], seed + TERRAIN_SEED.cont, s.cont);
				const ero = octaveNoise(p[0], p[1], p[2], seed + TERRAIN_SEED.ero, s.ero);
				const pv = octaveNoise(p[0], p[1], p[2], seed + TERRAIN_SEED.pv, s.pv);
				const level = splineAt(TERRAIN.cont.curve, cont);
				const base =
					level >= 0.5
						? ((level - 0.5) / 0.5) * TERRAIN.relief
						: -((0.5 - level) / 0.5) * TERRAIN.seaDepth;
				const cut = splineAt(TERRAIN.ero.curve, ero);
				const swing = splineAt(TERRAIN.pv.curve, pv) * 2 - 1;
				const over = base - TERRAIN.seaLevel;
				const worn = 1 - TERRAIN.erosionBite * cut;
				return (
					TERRAIN.seaLevel +
					(over > 0 ? over * worn : over) +
					(1 - cut) * swing * TERRAIN.peakRelief
				);
			}

			/** A layer's own numbers, in the shape the grower reads. */
			function shapeOf(layer) {
				return layer.values;
			}

			/** The noise the bend is read off, shared by every plant in a stand. */
			function bendSettings(spec) {
				return {
					frequency: 1 / Math.max(0.5, spec.bendFeature),
					octaves: 2,
					persistence: 0.5,
					lacunarity: 2,
					offsetX: 0,
					offsetY: 0,
					ridge: 0,
				};
			}

			/**
			 * One plant, as a list of tapered rods and a list of leaf clusters.
			 *
			 * **Nothing decides here whether a cell is wood.** The skeleton is
			 * geometry in the patch's own frame -- east, up, north, in metres --
			 * and turning it into cells is a separate step, because the two
			 * answer different questions and the second one has to go through
			 * the engine's own `positionToCell` to be true.
			 *
			 * **A branch is a direction in three dimensions, never a walk along
			 * the neighbour ring.** A heading carried along a path here does not
			 * close -- a loop round an odd number of pentagons comes back
			 * rotated one index at any radius -- and 46% of chunks are turned
			 * half a turn, so a branch that stepped by direction index would
			 * grow one shape in one chunk and its mirror image in the next. It
			 * also never asks for neighbour `k = 5`, which is what keeps the
			 * twelve pentagons from needing a case.
			 */
			function growPlant(base, stance, spec, scale, seed, out) {
				// **Off the trunk, leaves have nothing to hang from.** A
				// cluster sits at a branch tip or the top of a bare trunk, so
				// turning branches off has to take leaves with it -- otherwise
				// a plant with `Branches` unchecked still grows the one leaf
				// ball a bare trunk's tip would carry, which is not what the
				// switch says it does.
				//
				// **Read off the layer's own numbers, not the page's.** Every
				// switch here belongs to one kind of plant, so a bare-trunk
				// cactus and a full oak stand in the same patch.
				const leavesOn = spec.useLeaves && spec.useBranches;
				const noise = bendSettings(spec);
				// **The walk is in the plant's own frame and everything it
				// records is in the world's.** Working in a frame is what makes
				// a branch angle mean anything -- up is up and a spread is a
				// spread; recording in the world is what lets two chunks that
				// both hold this plant put its cells in the same places. The
				// bend is read in world coordinates for the same reason: read in
				// the plant's frame it would be a different field for every
				// plant, and a stand would not lean together.
				const world = [0, 0, 0];
				const out3 = (x, y, z) => {
					world[0] =
						base[0] + stance.east[0] * x + stance.up[0] * y + stance.north[0] * z;
					world[1] =
						base[1] + stance.east[1] * x + stance.up[1] * y + stance.north[1] * z;
					world[2] =
						base[2] + stance.east[2] * x + stance.up[2] * y + stance.north[2] * z;
					return world;
				};
				const step = Math.max(0.35, knobs.blockSize * 0.6);
				const grow = (
					px, py, pz, dx, dy, dz, len, rad, level, trunk, tag,
				) => {
					const steps = Math.max(2, Math.round(len / step));
					const run = len / steps;
					// **The bend is a displacement from the heading this limb
					// set out on, never a nudge added to the last step.**
					// Accumulated, it is a random walk in direction: an 86 m
					// trunk at a 0.4 m step is 215 steps, and a nudge of 0.075
					// each time wanders about a radian, which measured as a
					// canopy reaching 40.8 m sideways from a tree 20 m wide.
					// Read as a displacement it is bounded by the knob, and a
					// stand still leans together because the field is the same.
					const sx = dx, sy = dy, sz = dz;
					// Where children leave this limb: spread along the bare
					// fraction of a trunk, gathered at the tip of anything else.
					const from = trunk ? spec.first : 0.82;
					const kids = Math.max(1, Math.round(spec.children));
					const joints = [];
					// **Whorls are spread up the trunk, not taken as they come.**
					// Pushing a joint at every step past the bare fraction fills
					// the quota in the first few steps, so every branch leaves
					// within a metre or two of the same height: the tree comes
					// out as a low disc of branches with a bare pole standing
					// out of the top of it. The heights are worked out first and
					// the walk pushes a joint as it passes each one.
					const whorls = [];
					if (trunk)
						for (let w = 0; w < kids; w++)
							whorls.push(from + ((0.97 - from) * (w + 0.4)) / kids);
					let nextWhorl = 0;
					// Half way along, for the leaves a limb carries rather than
					// the ones at its end -- pushing those at the tip too puts
					// two clusters on one point and pays for both.
					let middle = null;
					for (let s = 0; s < steps; s++) {
						const ax = px, ay = py, az = pz;
						const at = (s + 1) / steps;
						dx = sx;
						dy = sy;
						dz = sz;
						if (spec.bend > 0) {
							const push = spec.bend * 0.8;
							const w = out3(px, py, pz);
							const wx = w[0], wy = w[1], wz = w[2];
							dx += push * octaveNoise(wx, wy, wz, seed + 11, noise);
							dy += push * 0.4 * octaveNoise(wx, wy, wz, seed + 23, noise);
							dz += push * octaveNoise(wx, wy, wz, seed + 37, noise);
						}
						// **The lean is a share of the way along, not a
						// per-step addition**, for the same reason: a limb
						// rises or droops by a fixed amount over its own
						// length whatever that length is. A trunk does
						// neither -- it is what up and droop are measured
						// against.
						if (!trunk) dy += spec.up * at * 0.9 - spec.droop * at * 1.2;
						const m = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
						dx /= m; dy /= m; dz /= m;
						px += dx * run; py += dy * run; pz += dz * run;
						const r0 = rad * (1 - (1 - spec.taper) * (s / steps));
						const r1 = rad * (1 - (1 - spec.taper) * at);
						const a3 = out3(ax, ay, az);
						const aw = [a3[0], a3[1], a3[2]];
						const b3 = out3(px, py, pz);
						out.rods.push([aw[0], aw[1], aw[2], b3[0], b3[1], b3[2], r0, r1]);
						if (s === steps >> 1) middle = [b3[0], b3[1], b3[2]];
						// **A trunk carries whorls and a limb forks.** Spreading
						// the children of every limb along its own length reads
						// as one child each, because a 1.6 m twig at a 0.6 m
						// step has one point past the four fifths mark -- the
						// tree then halves its branch count at every level and
						// comes out as a stick. A limb splits at its tip
						// instead, into as many as the row asks for.
						if (level > 0) {
							if (trunk) {
								if (nextWhorl < whorls.length && at >= whorls[nextWhorl]) {
									nextWhorl++;
									joints.push([px, py, pz, dx, dy, dz, at]);
								}
							} else if (s === steps - 1 && joints.length < 1)
								joints.push([px, py, pz, dx, dy, dz, at]);
						}
					}
					const perJoint = trunk ? 2 : kids;
					if (level > 0)
						for (let j = 0; j < joints.length; j++)
						for (let c = 0; c < perJoint; c++) {
							const [jx, jy, jz, jdx, jdy, jdz, at] = joints[j];
							// **Round the limb by a hashed angle, not a stored
							// one.** Every plant on the planet is a hash of its
							// own cell, so variety costs a multiply rather than
							// a table of authored shapes.
							const turn =
								2 *
								Math.PI *
								(c / perJoint + hash3(c, level * 31 + j, tag, seed));
							const side = frameOf([jdx, jdy, jdz]);
							const lean =
								spec.spread *
								(0.6 + 0.8 * hash3(c + j * 17, tag, level, seed + 5));
							let nx = jdx + (Math.cos(turn) * side.east[0] + Math.sin(turn) * side.north[0]) * lean;
							let ny = jdy + (Math.cos(turn) * side.east[1] + Math.sin(turn) * side.north[1]) * lean + spec.up * 0.3;
							let nz = jdz + (Math.cos(turn) * side.east[2] + Math.sin(turn) * side.north[2]) * lean;
							const m = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
							// **A trunk's branches are as long as the trunk left
							// above them, not as long as the trunk.** A fixed
							// share of the whole makes the lowest branch half the
							// tree's height, which is a candelabra; a share of
							// what is left gives a crown that closes at the top.
							const childLen = trunk
								? spec.height * scale * spec.lengthRatio * (1 - at) * 0.6
								: len * spec.lengthRatio;
							grow(
								jx, jy, jz,
								nx / m, ny / m, nz / m,
								childLen,
								rad * spec.radiusRatio,
								level - 1,
								false,
								tag * 7 + c + j * 13 + 1,
							);
						}
					else if (leavesOn) {
						const w = out3(px, py, pz);
						out.clusters.push([w[0], w[1], w[2], spec.leafRadius * scale]);
					}
					// Leaves along the limb as well as at its end, in the share
					// **Only at the tips** leaves to the limb.
					if (
						level <= 1 &&
						spec.leaves &&
						leavesOn &&
						spec.leafTip < 1 &&
						middle
					)
						out.clusters.push([
							middle[0], middle[1], middle[2],
							spec.leafRadius * scale * (1 - spec.leafTip) * 0.9,
						]);
				};
				grow(
					0, 0, 0,
					0, 1, 0,
					spec.height * scale,
					Math.max(knobs.blockSize * 0.45, spec.trunk * scale),
					spec.useBranches ? Math.round(spec.levels) : 0,
					true,
					1,
				);
			}

			/** What a cell holds above the ground. */
			const EMPTY = 0;
			const WOOD = 1;
			const LEAF = 2;
			/** Layers of headroom under a column's own ground, for a canopy that
			 * hangs out over a drop. */
			const SUNK = 8;

			/**
			 * The patch, its ground, and everything standing on it.
			 *
			 * **The hexagons are blocks, not map cells.** The other labs draw
			 * the coarse map, because the map is the terrain and a landscape is
			 * what they are about. A plant is metres tall and blocks wide, so
			 * this patch is the block grid at the full subdivision depth and the
			 * map is read underneath it -- through `hexRound` on scaled
			 * barycentric weights, which is how the engine finds a coarse cell
			 * from a fine one.
			 */
			function generate(cells = knobs.cells) {
				const k = derived();
				const seed = seedFromString(knobs.seed);
				const ground = terrainSettings(k.radius);
				// **The layers that are actually on**, with their own noise
				// stack worked out once. A layer that is off is not in the list
				// at all rather than tested and refused, so turning one off
				// costs nothing and the tie-break order is over the ones that
				// are left.
				const live = layers.filter((layer) => layer.on);
				const liveNoise = live.map((layer) => layerSettings(layer, k.radius));
				for (const layer of layers) layer.grown = 0;

				// **What the world lands on, under each layer's curve.** Noise
				// clusters around its own middle, so equal widths of a curve
				// cover wildly unequal amounts of planet: a drag near the middle
				// moves a fifth of the land and the same drag out at the end
				// reaches a couple of percent of it. Counted on every rebuild,
				// because every noise row moves it.
				const dry = dryMask(seed, k.radius);
				const bin = (v) =>
					Math.max(
						0,
						Math.min(TALLY_BINS - 1, Math.floor(((v + 1) / 2) * TALLY_BINS)),
					);
				for (const layer of layers) {
					if (!layer.on) {
						layer.tally = null;
						continue;
					}
					const settings = layerSettings(layer, k.radius);
					const counts = new Float32Array(TALLY_BINS);
					let tallest = 0;
					for (let c = 0; c < WORLD.length; c++) {
						if (!dry.mask[c]) continue;
						const p = WORLD[c];
						const at = bin(
							octaveNoise(
								p[0], p[1], p[2],
								seed + saltOf(layer),
								settings,
							),
						);
						if (++counts[at] > tallest) tallest = counts[at];
					}
					layer.tally = { counts, tallest, land: dry.count };
				}

				// **A level of detail is a subdivision depth, and nothing else.**
				// A coarse chunk here is drawn at a shallower depth over the same
				// ground, which is the engine's own rule: levels do not nest, so
				// a coarse mesh re-evaluates the terrain rather than dropping
				// cells from a fine one. Blocks are wider and taller by the same
				// factor, and a plant is rasterised into whatever lattice the
				// chunk is drawn at.
				const lod = Math.round(knobs.lod);
				const grain = 2 ** lod;
				const n = 2 ** Math.max(2, knobs.subdivisionDepth - lod);
				// **The planting lattice is the finest one, at every level.** A
				// root is a cell, and a coarse chunk's cells are not the fine
				// chunk's cells -- hashing its own would choose a different
				// forest for every level and a tree would come and go as the
				// player walked. So the roots are enumerated at full depth
				// whatever is being drawn, which is the one part of this that
				// does NOT get cheaper with distance.
				const rootN = 2 ** knobs.subdivisionDepth;
				const m = 2 ** k.level;
				const middle = directionOf(knobs.latitude, knobs.longitude);
				const drawn = Math.max(4, cells >> lod);
				const found = directionToCell(middle[0], middle[1], middle[2], n);
				const start = canonicalCell(found.face, n, found.i, found.j);
				const reach = Math.max(1, drawn >> 1);
				const keyOf = (c) => (c.face * (n + 1) + c.i) * (n + 1) + c.j;
				const at = new Map();
				const list = [];
				const add = (c) => {
					const key = keyOf(c);
					if (at.has(key)) return false;
					at.set(key, list.length);
					list.push(c);
					return true;
				};
				add(start);
				let frontier = [start];
				for (let r = 0; r < reach; r++) {
					const next = [];
					for (const c of frontier)
						for (let d = 0; d < 6; d++) {
							const nb = neighbour(c.face, n, c.i, c.j, d);
							if (!nb) continue;
							const cell = canonicalCell(nb.face, n, nb.i, nb.j);
							if (add(cell)) next.push(cell);
						}
					frontier = next;
				}

				const count = list.length;
				const centre = latticePosition(start.face, n, start.i, start.j);
				const frame = frameOf(centre);
				const radius = k.radius;
				// A layer is as thick as a cell is wide, and both grow with the
				// level -- the engine shifts the layer index by the level for
				// exactly this reason.
				const block = k.blockSize * grain;
				const height = new Float64Array(count);
				const localX = new Float64Array(count);
				const localZ = new Float64Array(count);
				const degree = new Uint8Array(count);
				// **The cell's own direction, kept.** Everything a plant does is
				// in world coordinates now, so this is read once per stamped
				// cell rather than recomputed from the lattice.
				const dirX = new Float64Array(count);
				const dirY = new Float64Array(count);
				const dirZ = new Float64Array(count);
				const corner = new Float64Array(count * 18);
				const ring = new Int32Array(count * 6).fill(-1);
				// **One height per map cell, and every block cell under it reads
				// the same one** -- so the ground is faceted at the map's own
				// resolution, which is what the engine builds.
				const mapHeight = new Map();
				/** One coarse lattice point's height, asked for once. */
				const mapAt = (face, ci, cj) => {
					const key = (face * (m + 1) + ci) * (m + 1) + cj;
					let h = mapHeight.get(key);
					if (h === undefined) {
						const q = latticePosition(face, m, ci, cj);
						h = mapHeightAt(q, seed, ground);
						mapHeight.set(key, h);
					}
					return h;
				};
				let lowest = Infinity;
				let highest = -Infinity;
				for (let c = 0; c < count; c++) {
					const cell = list[c];
					const p = latticePosition(cell.face, n, cell.i, cell.j);
					dirX[c] = p[0];
					dirY[c] = p[1];
					dirZ[c] = p[2];
					localX[c] =
						(p[0] - centre[0]) * radius * frame.east[0] +
						(p[1] - centre[1]) * radius * frame.east[1] +
						(p[2] - centre[2]) * radius * frame.east[2];
					localZ[c] =
						(p[0] - centre[0]) * radius * frame.north[0] +
						(p[1] - centre[1]) * radius * frame.north[1] +
						(p[2] - centre[2]) * radius * frame.north[2];
					let h = 0;
					for (const [ci, cj, weight] of coarseCorners(
						cell.face, n, cell.i, cell.j, m,
					)) {
						if (weight === 0) continue;
						h += weight * mapAt(cell.face, ci, cj);
					}
					height[c] = h;
					if (h < lowest) lowest = h;
					if (h > highest) highest = h;
					const corners = cellCorners(cell.face, n, cell.i, cell.j);
					degree[c] = corners.length;
					for (let v = 0; v < corners.length; v++) {
						corner[c * 18 + v * 3] = corners[v][0];
						corner[c * 18 + v * 3 + 1] = corners[v][1];
						corner[c * 18 + v * 3 + 2] = corners[v][2];
					}
					for (let d = 0; d < 6; d++) {
						const nb = neighbour(cell.face, n, cell.i, cell.j, d);
						if (!nb) continue;
						const hit = at.get(keyOf(canonicalCell(nb.face, n, nb.i, nb.j)));
						if (hit !== undefined) ring[c * 6 + d] = hit;
					}
				}

				// **A layer is a whole block, and the surface is where the
				// rounding puts it.** Two columns a metre apart in height stand
				// on the same layer boundary or on two, never half way between,
				// which is what a wall between them is drawn from.
				// **The datum is the world's, never the patch's.** Counting
				// layers from the lowest ground in view makes a column's height
				// depend on what else was drawn, which is the one thing a chunk
				// generating alone cannot know. Sea level is zero by
				// construction, so zero is the datum.
				const datum = 0;
				const groundLayer = new Int32Array(count);
				const top = new Float64Array(count);
				for (let c = 0; c < count; c++) {
					groundLayer[c] = Math.floor((height[c] - datum) / block);
					top[c] = datum + (groundLayer[c] + 1) * block;
				}

				// **The roots, at the finest lattice, whatever is being drawn.**
				// A coarse chunk covers four times the ground of the one a level
				// finer and holds the same number of cells, so its terrain costs
				// the same at every level -- that is what makes distance cheap.
				// The plants do not follow: they are chosen per fine cell, and
				// the same ground holds the same trees however coarsely it is
				// drawn, so this walk is the same size at every level. **It is
				// the one part of a chunk whose cost does not fall with
				// distance**, and the readout says so.
				const roots = [];
				{
					const fine = directionToCell(middle[0], middle[1], middle[2], rootN);
					const seedCell = canonicalCell(fine.face, rootN, fine.i, fine.j);
					const keyFine = (c) => (c.face * (rootN + 1) + c.i) * (rootN + 1) + c.j;
					const seen = new Set([keyFine(seedCell)]);
					roots.push(seedCell);
					let edge = [seedCell];
					const want = Math.max(1, cells >> 1);
					for (let r = 0; r < want; r++) {
						const next = [];
						for (const c of edge)
							for (let d = 0; d < 6; d++) {
								const nb = neighbour(c.face, rootN, c.i, c.j, d);
								if (!nb) continue;
								const cell = canonicalCell(nb.face, rootN, nb.i, nb.j);
								const key = keyFine(cell);
								if (seen.has(key)) continue;
								seen.add(key);
								roots.push(cell);
								next.push(cell);
							}
						edge = next;
					}
				}
				// Which drawn cell each root stands on, and where it stands.
				const rootSeat = new Int32Array(roots.length).fill(-1);
				const rootDir = new Float64Array(roots.length * 3);
				// **The ground at the root's own point, not at the cell it is
				// drawn on.** A coarse level resamples the surface, so a shore
				// read off the drawn cell moves a metre or two every level and a few
				// plants at the waterline come and go with the level. The map is
				// the terrain and a point's height on it does not depend on who
				// asks.
				const rootHeight = new Float64Array(roots.length);
				for (let r = 0; r < roots.length; r++) {
					const cell = roots[r];
					const p = latticePosition(cell.face, rootN, cell.i, cell.j);
					let h = 0;
					for (const [ci, cj, weight] of coarseCorners(
						cell.face, rootN, cell.i, cell.j, m,
					)) {
						if (weight === 0) continue;
						h += weight * mapAt(cell.face, ci, cj);
					}
					rootHeight[r] = h;
					rootDir[r * 3] = p[0];
					rootDir[r * 3 + 1] = p[1];
					rootDir[r * 3 + 2] = p[2];
					const coarse =
						rootN === n
							? cell
							: coarseOf(cell.face, rootN, cell.i, cell.j, n);
					const seat = at.get(keyOf(canonicalCell(coarse.face, n, coarse.i, coarse.j)));
					if (seat !== undefined) rootSeat[r] = seat;
				}

				// How tall the tallest thing that could stand here is, which is
				// what the voxel field has to have room for -- over every layer,
				// because any of them may put a plant on any cell.
				let reachUp = 0;
				let widestTrunk = 0;
				for (const layer of live) {
					const v = layer.values;
					reachUp = Math.max(
						reachUp,
						v.height * (1 + v.sizeSpread) + v.leafRadius * 1.6,
					);
					// The widest trunk any layer can grow, which is where a cell
					// stops being narrower than the wood in it.
					widestTrunk = Math.max(widestTrunk, v.trunk * (1 + v.sizeSpread));
				}
				const LAYERS = Math.min(
					320,
					SUNK + Math.ceil(reachUp / block) + 3,
				);
				const veg = new Uint8Array(count * LAYERS);
				// **Which layer put a cell there**, so a stand of two species is
				// not one colour. Nought means nothing grew there.
				const owner = new Uint8Array(count * LAYERS);
				const cellMetres = k.blockMetres * grain;

				// **A plant is grown in world coordinates, and that is what lets
				// a chunk grow it alone.** Every earlier version worked in the
				// patch's own east/up/north frame with the origin at the patch
				// centre, which is a frame no chunk has: two chunks holding one
				// tree would each grow it about their own middle and disagree
				// about every cell of it. Nothing below mentions the patch. A
				// point is three numbers in the planet's own space, the cell it
				// falls in comes from `directionToCell` on that point, and how
				// high it stands is its distance from the centre less the
				// radius -- all three of which any chunk can work out from an
				// address and the seed.
				const cellOf = (px, py, pz) => {
					const len = Math.sqrt(px * px + py * py + pz * pz) || 1;
					const c = directionToCell(px / len, py / len, pz / len, n);
					const hit = at.get(keyOf(canonicalCell(c.face, n, c.i, c.j)));
					return hit === undefined ? -1 : hit;
				};
				const metresOf = (px, py, pz) =>
					Math.sqrt(px * px + py * py + pz * pz) - radius;
				/** Which layer of a column a height in metres lands in. */
				const layerAt = (c, metres) =>
					SUNK + Math.floor((metres - top[c]) / block);

				// **A stamp's candidates are grown through its own test, never
				// gathered around it.** Both stamps used to ask for a hexagon
				// disc -- around every cell a rod's axis passed through, and
				// around the cell a leaf cluster sat in -- and a disc has no way
				// to name only the cells the shape reaches, because its ring
				// count is chosen before a single distance is worked out.
				// Measured over the shipped stand: **11,240,715** candidates
				// for **766,211** cells of wood, and **6,695,127** for the
				// **2,154,460** columns a cluster could put a leaf in.
				//
				// A flood asks the test instead. It starts at the cells the
				// shape is known to sit in and hands the question on from every
				// cell that passes to that cell's own six neighbours, so it
				// covers the shape and stops where the shape does. The one
				// thing it rests on is that the cells within reach of a rod or
				// a ball are connected through cells that are also within
				// reach; stepping past a failing cell `SLACK` times costs a
				// ring and buys that outright.
				//
				// `seen` and `slackAt` are the walk's own marks and `seenList`
				// is its queue, its answer, and the place a rod's walk leaves
				// the cells its axis sat in -- which are the first entries of
				// the queue and need no second array.
				const seen = new Int32Array(count);
				const seenList = new Int32Array(count);
				const slackAt = new Int8Array(count);
				let seenEra = 0;
				/** How many failing cells a flood may step past. */
				const SLACK = 1;

				// **Where a write goes, and which writes a chunk is allowed to
				// make.** A chunk may only write the cells it owns. It grows
				// plants rooted outside itself all the same -- that is the whole
				// point -- but what those plants put down beyond its own
				// territory is the neighbour's business, and dropping it on the
				// floor here is what proves the neighbour got it too.
				let target = veg;
				let tint = owner;
				let holds = null;
				let holder = 0;
				let painting = 0;
				// **A cell takes what most fills it, and past a certain cell
				// size that is the canopy.** A twig is centimetres thick and a
				// cluster is metres across, so wood beating leaf is right at the
				// block scale and exactly wrong once a block is wider than a
				// trunk: at level 3, an 8 m block, a forest drew 2,938 wood
				// cells against **62** leaf, because every cluster lands on the
				// same cell as the twig it hangs from and was refused there --
				// bare brown poles at exactly the distance a forest should read
				// as green.
				//
				// **The rule is a rank and not a permission**, and that
				// distinction is the whole of it. Letting a leaf overwrite wood
				// where it happens to arrive second makes the answer depend on
				// the order plants are grown in, and a chunk grows them in a
				// different order from its neighbour -- measured, that alone
				// took the chunk audit from 0 cells differing to 10. A rank
				// fixed before any plant is grown gives the same cell whatever
				// order it is written in.
				const canopyWins = cellMetres > widestTrunk;
				const rankOf = (what) =>
					what === EMPTY ? 0 : (what === LEAF) === canopyWins ? 2 : 1;
				// **A canopy is drawn hundreds of times over.** Clusters overlap
				// by design -- that is what makes a crown rather than a string
				// of balls -- so over the shipped stand the leaf stamp reaches
				// **8,311,898** cell-and-layer slots to leave **35,841** leaves,
				// which is every one of them decided **230 times**. All but the
				// first are refused by the rank, and refusing them at the top of
				// the slot walk rather than at the end of it skips the distance,
				// the square root and the noise lookup that were only ever going
				// to be thrown away. Which is the same answer either way: a
				// write that cannot beat what is already in the slot changes
				// nothing, and the ownership test it skips would have refused
				// it too.
				const RANK = new Uint8Array(3);
				RANK[EMPTY] = rankOf(EMPTY);
				RANK[WOOD] = rankOf(WOOD);
				RANK[LEAF] = rankOf(LEAF);
				const write = (c, slot, what) => {
					if (slot < 0 || slot >= LAYERS) return;
					if (holds !== null && holds[c] !== holder) return;
					const i = c * LAYERS + slot;
					if (rankOf(what) <= rankOf(target[i])) return;
					target[i] = what;
					if (tint !== null) tint[i] = painting;
				};

				/** One tapered rod of wood, between two points in world space. */
				const rod = (ax, ay, az, bx, by, bz, ra, rb) => {
					// **A rod thinner than a cell rasterises to a dotted line,
					// and a dotted branch is not connected to anything.**
					// Measured over one tree in a 64 m box: at radius 0.45 of a
					// cell it comes out as 66 separate pieces with 74.7% of the
					// wood rooted, and at 0.87 it is one piece and 100%. The
					// floor is what makes connectivity a property of the
					// construction rather than something to hope for.
					const thin = cellMetres * 0.5;
					ra = Math.max(ra, thin);
					rb = Math.max(rb, thin);
					const ux = bx - ax, uy = by - ay, uz = bz - az;
					const run = Math.sqrt(ux * ux + uy * uy + uz * uz);
					const wide = Math.max(ra, rb);
					const steps = Math.max(1, Math.ceil(run / (block * 0.4)));
					let wasCell = -1;
					let wasLayer = 0;
					seenEra++;
					let seats = 0;
					// **The walk steps 0.4 of a block, so a cell holds several
					// of them.** Only the distinct ones are worth keeping, and
					// they go straight into the queue the flood below reads.
					let runSeat = -1;
					for (let s = 0; s <= steps; s++) {
						const t = s / steps;
						const px = ax + ux * t, py = ay + uy * t, pz = az + uz * t;
						const seat = cellOf(px, py, pz);
						if (seat < 0) continue;
						const stands = metresOf(px, py, pz);
						// **The axis cell is always written, whatever the
						// radius**, so the rod is a walk rather than a string of
						// discs -- and where a step moves sideways and up at
						// once, the corner between the two is written too. The
						// ring is six neighbours and the column is two; a
						// diagonal is neither, and one missed corner is a branch
						// in two pieces.
						const here = layerAt(seat, stands);
						if (here >= 0 && here < LAYERS) {
							write(seat, here, WOOD);
							if (wasCell >= 0 && wasCell !== seat) {
								// A layer index is counted from the column's own
								// ground, so carrying one across to another
								// column means converting it rather than reusing
								// the number.
								const bridge =
									wasLayer + groundLayer[wasCell] - groundLayer[seat];
								if (bridge !== here) write(seat, bridge, WOOD);
							}
							wasCell = seat;
							wasLayer = here;
						}
						// **Noted, not tested.** The test below is against the
						// whole segment, so its answer does not depend on which
						// step happened to reach the cell.
						if (seat !== runSeat) {
							runSeat = seat;
							if (seen[seat] !== seenEra) {
								seen[seat] = seenEra;
								slackAt[seat] = SLACK;
								seenList[seats++] = seat;
							}
						}
					}
					// **How close a column ever comes to the rod, and it has
					// to be the rod's own length rather than the infinite line
					// through it.** A trunk points straight up, so the line
					// through it passes through the planet's centre -- which
					// every column's line also does, and two lines through one
					// point are never apart. A line test therefore measures
					// nought for every column of every trunk and refuses
					// nothing: measured, it let **76%** of a rod's candidates
					// through to be walked slot by slot for **6%** of the slots
					// written. Clamped to the rod's own ends it refuses 96% of
					// them and the slot walk falls **8x**.
					//
					// The squared distance from the column's line to the point
					// `s` along the rod is a quadratic in `s`, so its smallest
					// value over `[0, 1]` is one clamped division and one
					// evaluation, and past the rod's own thickness the column
					// holds nothing.
					//
					// **And projecting is never lengthening**, so where the rod
					// reaches along the column is bounded by where its two ends
					// project, widened by the thickness -- an exact bound on the
					// capsule, and it falls out of the two dot products the test
					// has already taken.
					const wide2 = wide * wide;
					const woodRank = RANK[WOOD];
					const homeA = ax * ax + ay * ay + az * az;
					const alongA = ax * ux + ay * uy + az * uz;
					const run2 = run * run;
					const overRun = run > 0 ? 1 / run2 : 0;
					// **The flood is the candidate list.** Every seat goes in,
					// and a cell that passes hands the test on to its own six
					// neighbours -- so the walk covers the tube around the rod
					// and stops where the rod does, rather than covering a
					// hexagon that was sized before any distance was known. A
					// failing cell is stepped past `SLACK` times, which costs a
					// ring and removes the one thing the argument for this rests
					// on: that the cells within reach of a rod are connected
					// through cells that are also within reach.
					let listed = seats;
					for (let q = 0; q < listed; q++) {
						const c = seenList[q];
						const dx0 = dirX[c], dy0 = dirY[c], dz0 = dirZ[c];
						const endA = ax * dx0 + ay * dy0 + az * dz0;
						const lean = ux * dx0 + uy * dy0 + uz * dz0;
						const bend = run2 - lean * lean;
						const tilt = alongA - endA * lean;

								}

						}

							const nb = ring[c * 6 + d];

							slackAt[nb] = SLACK;

						}

						const base = radius + top[c];

							0,
							SUNK +

						);
						const hi = Math.min(
							LAYERS - 1,

							// moves the last bit and with it the odd block on a

							const my = top[c] + (slot - SUNK + 0.5) * block;
							const reach2 = radius + my;
							const cx = dx0 * reach2;
							const cy = dy0 * reach2;
							const cz = dz0 * reach2;

							const ey = dy - uy * along;
							const ez = dz - uz * along;

					// at once: past the radius nothing on it can be inside.

					// handing the test on from each cell that passes to its own

					// 2,154,460 that could hold a leaf**. A failing cell is

						const c = seenList[q];

						const held = slackAt[c];

								for (let d = 0; d < 6; d++) {
									const nb = ring[c * 6 + d];
									if (nb < 0 || seen[nb] === seenEra) continue;
									seen[nb] = seenEra;
									slackAt[nb] = held - 1;
									seenList[listed++] = nb;
								}
							continue;
						}
						for (let d = 0; d < 6; d++) {
							const nb = ring[c * 6 + d];
							if (nb < 0 || seen[nb] === seenEra) continue;
							seen[nb] = seenEra;
							slackAt[nb] = SLACK;
							seenList[listed++] = nb;
						}

						// two roots of `|u d - P| = r`. Rounding a metre to a
						// slot already keeps a block of slack at each end, which
						// is the whole of what floating point could cost here,
						// so a second block on top of it was two slots a column
						// tested for nothing.

						const lo = Math.max(
							0,
							SUNK + Math.floor((along - hit - radius - top[c]) / block),
						);
						const hi = Math.min(
							LAYERS - 1,
							SUNK + Math.floor((along + hit - radius - top[c]) / block),
						);
						const seat0 = c * LAYERS;
						for (let slot = lo; slot <= hi; slot++) {
							if (RANK[target[seat0 + slot]] >= leafRank) continue;
							const my = top[c] + (slot - SUNK + 0.5) * block;
							const reach2 = radius + my;
							const cx = dirX[c] * reach2;
							const cy = dirY[c] * reach2;
							const cz = dirZ[c] * reach2;

									away +
									sway *
										valueNoise3(
											cx * noise.f + noise.ox,
											cy * noise.f + noise.oy,
											cz * noise.f + noise.oz,

										);

						}

				let trees = 0;
				let rejected = 0;
				let tallest = 0;
				let shortest = Infinity;
				let rootsTested = 0;
				let rootsOwned = 0;
				let chunkCount = 1;

				// skeleton off the bill, which is the only part of the plant

					// address.

								if (a2 < 0 || a2 >= LAYERS) continue;

				let blocked = 0;
				for (let c = 0; c < count; c++) {
