			];

			/** Every row by key, and the draft the panel is editing. */
			const ROWS = new Map();
			for (const group of KNOBS)
				for (const row of group.rows) ROWS.set(row.key, row);
			const knobs = {};
			for (const [key, row] of ROWS) knobs[key] = row.value;
			const rows = new Map();
			let field = null;
			let cost = 0;

			/** What the knobs come to once the ones that imply others are read. */
			function derived() {
				const k = {};
				for (const key of ROWS.keys()) k[key] = knobs[key];
				k.radius =
					(knobs.blockSize * 2 ** knobs.subdivisionDepth) / CELL_CONSTANT;
				// The coarse map's level, chosen exactly as the engine chooses
				// it, and capped at 9 the same way.
				k.level = Math.max(
					2,
					Math.min(
						knobs.subdivisionDepth,
						9,
						Math.max(
							0,
							Math.round(
								Math.log2((CELL_CONSTANT * k.radius) / knobs.coarseSpacing),
							),
						),
					),
				);
				k.mapMetres = (CELL_CONSTANT * k.radius) / 2 ** k.level;
				k.blockMetres =
					(CELL_CONSTANT * k.radius) / 2 ** knobs.subdivisionDepth;
				return k;
			}

			/**
			 * A knob's own ends, narrowed by the rest of the draft.
			 *
			 * A slider that cannot reach a refusal beats a refusal that explains
			 * itself. Two bind here: the map cannot be finer than the block grid
			 * it is read on, and a patch of block cells has to stay small enough
			 * to build while a slider is moving.
			 */
			function liveRange(row) {
				if (row.key === "coarseSpacing") {
					const k = derived();
					return {
						...row,
						low: Math.max(row.low, Math.ceil(k.blockMetres * 4)),
					};
				}
				if (row.key === "octaves") {
					// Each octave is half the last, and the map cannot carry one
					// narrower than two of its own cells.
					const k = derived();
					const room =
						1 +
						Math.floor(Math.log2(knobs.feature / (2 * k.mapMetres)));
					return { ...row, high: Math.max(row.low, Math.min(row.high, room)) };
				}
				return row;
			}

			/** Pull every knob inside its own narrowed ends, inward only. */
			function settle() {
				for (const g of KNOBS)
					for (const r of g.rows) {
						if (r.digits === undefined || r.type) continue;
						const live = liveRange(r);
						knobs[r.key] = Math.min(live.high, Math.max(live.low, knobs[r.key]));
					}
			}

			/** A latitude and a longitude, as a unit direction. */
			function directionOf(latitude, longitude) {
				const lat = (latitude * Math.PI) / 180;
				const lon = (longitude * Math.PI) / 180;
				return [
					Math.cos(lat) * Math.cos(lon),
					Math.sin(lat),
					Math.cos(lat) * Math.sin(lon),
				];
			}

			function cross3(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],
				];
			}

			/**
			 * East, up and north at one place on the planet.
			 *
			 * Up is `normalize(position)` and there is no global north, so north
			 * is whatever is left after east is taken out of the polar axis.
			 */
			function frameOf(up) {
				const axis = [0, 1, 0];
				let east = cross3(axis, up);
				let len = Math.sqrt(east[0] ** 2 + east[1] ** 2 + east[2] ** 2);
				if (len < 1e-9) {
					east = cross3([1, 0, 0], up);
					len = Math.sqrt(east[0] ** 2 + east[1] ** 2 + east[2] ** 2);
				}
				east = east.map((v) => v / len);
				const north = cross3(up, east);
				return { east, up, north };
			}

			/**
			 * The coarse map cell a block cell reads its ground from.
			 *
			 * **Scale the barycentric weights and repair them, never shift
			 * `(i, j)`.** A cell is a Voronoi region and a shift is a floor, so
			 * shifting names the wrong cell for 43.9% of cells one level out and
			 * 79.3% four levels out. `hexRound` on the scaled weights is the
			 * engine's own answer.
			 */
			function coarseOf(face, n, i, j, m) {
				const s = n / m;
				const [, ci, cj] = hexRound((n - i - j) / s, i / s, j / s, m);
				return { face, i: ci, j: cj };
			}

			/**
			 * The three coarse lattice points a block cell stands between, and
			 * how much of each it takes.
			 *
			 * **A map cell is a straight ramp, not a plateau.** The map is the
			 * terrain and its cells are far wider than a block -- 16 m here
			 * against 1 m -- so reading one height per map cell and giving it to
			 * every block underneath builds a staircase of 16 m treads with a
			 * cliff at every edge. Interpolated instead, the same map draws a
			 * hillside: measured on the shipped world, a map cell's own ramp
			 * rises 4.0 m at the median of land cells, which is one block of
			 * climb every eight.
			 *
			 * Which three points, on a triangular lattice, is decided by what is
			 * left over when the three scaled weights are floored: one leftover
			 * is an upward triangle and two is a downward one.
			 */
			function coarseCorners(face, n, i, j, m) {
				const s = n / m;
				const u = (n - i - j) / s;
				const v = i / s;
				const w = j / s;
				const fu = Math.floor(u);
				const fv = Math.floor(v);
				const fw = Math.floor(w);
				const over = m - (fu + fv + fw);
				const du = u - fu;
				const dv = v - fv;
				const dw = w - fw;
				if (over <= 0)
					return [[fv, fw, 1], [fv, fw, 0], [fv, fw, 0]];
				if (over === 1)
					return [
						[fv, fw, du],
						[fv + 1, fw, dv],
						[fv, fw + 1, dw],
					];
				return [
					[fv + 1, fw + 1, 1 - du],
					[fv, fw + 1, 1 - dv],
					[fv + 1, fw, 1 - dw],
				];
			}

			/**
			 * The ground, in metres against sea level, at one coarse map cell.
			 *
			 * One noise stack and one scale. The landscape is not what this lab
			 * is about -- it is a hillside for the plants to stand on -- so it
			 * carries a fraction of the multi-noise lab's model and none of its
			 * curves.
			 */
			function mapHeightAt(p, seed, s, relief) {
				return octaveNoise(p[0], p[1], p[2], seed, s) * relief;
			}

			/** The species table, with the selected one replaced by the panel. */
			function shapeOf(name) {
				const stored = SPECIES[name];
				if (name !== knobs.species) return stored;
				const live = { ...stored };
				for (const key of SHAPE_KEYS) live[key] = knobs[key];
				return live;
			}

			/** The noise the bend is read off, shared by every plant in a stand. */
			function bendSettings(spec) {
				return {
					frequency: 1 / Math.max(0.5, spec.bendFeature),
					octaves: 2,
					persistence: 0.5,
					lacunarity: 2,
					offsetX: 0,
					offsetY: 0,
					ridge: 0,
				};
			}

			/**
			 * One plant, as a list of tapered rods and a list of leaf clusters.
			 *
			 * **Nothing decides here whether a cell is wood.** The skeleton is
			 * geometry in the patch's own frame -- east, up, north, in metres --
			 * and turning it into cells is a separate step, because the two
			 * answer different questions and the second one has to go through
			 * the engine's own `positionToCell` to be true.
			 *
			 * **A branch is a direction in three dimensions, never a walk along
			 * the neighbour ring.** A heading carried along a path here does not
			 * close -- a loop round an odd number of pentagons comes back
			 * rotated one index at any radius -- and 46% of chunks are turned
			 * half a turn, so a branch that stepped by direction index would
			 * grow one shape in one chunk and its mirror image in the next. It
			 * also never asks for neighbour `k = 5`, which is what keeps the
			 * twelve pentagons from needing a case.
			 */
			function growPlant(base, stance, spec, scale, seed, out) {
				// **Off the trunk, leaves have nothing to hang from.** A
				// cluster sits at a branch tip or the top of a bare trunk, so
				// turning branches off has to take leaves with it -- otherwise
				// a plant with `Branches` unchecked still grows the one leaf
				// ball a bare trunk's tip would carry, which is not what the
				// switch says it does.
				const leavesOn = knobs.useLeaves && knobs.useBranches;
				const noise = bendSettings(spec);
				// **The walk is in the plant's own frame and everything it
				// records is in the world's.** Working in a frame is what makes
				// a branch angle mean anything -- up is up and a spread is a
				// spread; recording in the world is what lets two chunks that
				// both hold this plant put its cells in the same places. The
				// bend is read in world coordinates for the same reason: read in
				// the plant's frame it would be a different field for every
				// plant, and a stand would not lean together.
				const world = [0, 0, 0];
				const out3 = (x, y, z) => {
					world[0] =
						base[0] + stance.east[0] * x + stance.up[0] * y + stance.north[0] * z;
					world[1] =
						base[1] + stance.east[1] * x + stance.up[1] * y + stance.north[1] * z;
					world[2] =
						base[2] + stance.east[2] * x + stance.up[2] * y + stance.north[2] * z;
					return world;
				};
				const step = Math.max(0.35, knobs.blockSize * 0.6);
				const grow = (
					px, py, pz, dx, dy, dz, len, rad, level, trunk, tag,
				) => {
					const steps = Math.max(2, Math.round(len / step));
					const run = len / steps;
					// **The bend is a displacement from the heading this limb
					// set out on, never a nudge added to the last step.**
					// Accumulated, it is a random walk in direction: an 86 m
					// trunk at a 0.4 m step is 215 steps, and a nudge of 0.075
					// each time wanders about a radian, which measured as a
					// canopy reaching 40.8 m sideways from a tree 20 m wide.
					// Read as a displacement it is bounded by the knob, and a
					// stand still leans together because the field is the same.
					const sx = dx, sy = dy, sz = dz;
					// Where children leave this limb: spread along the bare
					// fraction of a trunk, gathered at the tip of anything else.
					const from = trunk ? spec.first : 0.82;
					const kids = Math.max(1, Math.round(spec.children));
					const joints = [];
					// **Whorls are spread up the trunk, not taken as they come.**
					// Pushing a joint at every step past the bare fraction fills
					// the quota in the first few steps, so every branch leaves
					// within a metre or two of the same height: the tree comes
					// out as a low disc of branches with a bare pole standing
					// out of the top of it. The heights are worked out first and
					// the walk pushes a joint as it passes each one.
					const whorls = [];
					if (trunk)
						for (let w = 0; w < kids; w++)
							whorls.push(from + ((0.97 - from) * (w + 0.4)) / kids);
					let nextWhorl = 0;
					// Half way along, for the leaves a limb carries rather than
					// the ones at its end -- pushing those at the tip too puts
					// two clusters on one point and pays for both.
					let middle = null;
					for (let s = 0; s < steps; s++) {
						const ax = px, ay = py, az = pz;
						const at = (s + 1) / steps;
						dx = sx;
						dy = sy;
						dz = sz;
						if (spec.bend > 0) {
							const push = spec.bend * 0.8;
							const w = out3(px, py, pz);
							const wx = w[0], wy = w[1], wz = w[2];
							dx += push * octaveNoise(wx, wy, wz, seed + 11, noise);
							dy += push * 0.4 * octaveNoise(wx, wy, wz, seed + 23, noise);
							dz += push * octaveNoise(wx, wy, wz, seed + 37, noise);
						}
						// **The lean is a share of the way along, not a
						// per-step addition**, for the same reason: a limb
						// rises or droops by a fixed amount over its own
						// length whatever that length is. A trunk does
						// neither -- it is what up and droop are measured
						// against.
						if (!trunk) dy += spec.up * at * 0.9 - spec.droop * at * 1.2;
						const m = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
						dx /= m; dy /= m; dz /= m;
						px += dx * run; py += dy * run; pz += dz * run;
						const r0 = rad * (1 - (1 - spec.taper) * (s / steps));
						const r1 = rad * (1 - (1 - spec.taper) * at);
						const a3 = out3(ax, ay, az);
						const aw = [a3[0], a3[1], a3[2]];
						const b3 = out3(px, py, pz);
						out.rods.push([aw[0], aw[1], aw[2], b3[0], b3[1], b3[2], r0, r1]);
						if (s === steps >> 1) middle = [b3[0], b3[1], b3[2]];
						// **A trunk carries whorls and a limb forks.** Spreading
						// the children of every limb along its own length reads
						// as one child each, because a 1.6 m twig at a 0.6 m
						// step has one point past the four fifths mark -- the
						// tree then halves its branch count at every level and
						// comes out as a stick. A limb splits at its tip
						// instead, into as many as the row asks for.
						if (level > 0) {
							if (trunk) {
								if (nextWhorl < whorls.length && at >= whorls[nextWhorl]) {
									nextWhorl++;
									joints.push([px, py, pz, dx, dy, dz, at]);
								}
							} else if (s === steps - 1 && joints.length < 1)
								joints.push([px, py, pz, dx, dy, dz, at]);
						}
					}
					const perJoint = trunk ? 2 : kids;
					if (level > 0)
						for (let j = 0; j < joints.length; j++)
						for (let c = 0; c < perJoint; c++) {
							const [jx, jy, jz, jdx, jdy, jdz, at] = joints[j];
							// **Round the limb by a hashed angle, not a stored
							// one.** Every plant on the planet is a hash of its
							// own cell, so variety costs a multiply rather than
							// a table of authored shapes.
							const turn =
								2 *
								Math.PI *
								(c / perJoint + hash3(c, level * 31 + j, tag, seed));
							const side = frameOf([jdx, jdy, jdz]);
							const lean =
								spec.spread *
								(0.6 + 0.8 * hash3(c + j * 17, tag, level, seed + 5));
							let nx = jdx + (Math.cos(turn) * side.east[0] + Math.sin(turn) * side.north[0]) * lean;
							let ny = jdy + (Math.cos(turn) * side.east[1] + Math.sin(turn) * side.north[1]) * lean + spec.up * 0.3;
							let nz = jdz + (Math.cos(turn) * side.east[2] + Math.sin(turn) * side.north[2]) * lean;
							const m = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
							// **A trunk's branches are as long as the trunk left
							// above them, not as long as the trunk.** A fixed
							// share of the whole makes the lowest branch half the
							// tree's height, which is a candelabra; a share of
							// what is left gives a crown that closes at the top.
							const childLen = trunk
								? spec.height * scale * spec.lengthRatio * (1 - at) * 0.6
								: len * spec.lengthRatio;
							grow(
								jx, jy, jz,
								nx / m, ny / m, nz / m,
								childLen,
								rad * spec.radiusRatio,
								level - 1,
								false,
								tag * 7 + c + j * 13 + 1,
							);
						}
					else if (spec.leaves && leavesOn) {
						const w = out3(px, py, pz);
						out.clusters.push([w[0], w[1], w[2], spec.leafRadius * scale]);
					}
					// Leaves along the limb as well as at its end, in the share
					// **Only at the tips** leaves to the limb.
					if (
						level <= 1 &&
						spec.leaves &&
						leavesOn &&
						spec.leafTip < 1 &&
						middle
					)
						out.clusters.push([
							middle[0], middle[1], middle[2],
							spec.leafRadius * scale * (1 - spec.leafTip) * 0.9,
						]);
				};
				grow(
					0, 0, 0,
					0, 1, 0,
					spec.height * scale,
					Math.max(knobs.blockSize * 0.45, spec.trunk * scale),
					knobs.useBranches ? Math.round(spec.levels) : 0,
					true,
					1,
				);
			}

			/** What a cell holds above the ground. */
			const EMPTY = 0;
			const WOOD = 1;
			const LEAF = 2;
			/** Layers of headroom under a column's own ground, for a canopy that
			 * hangs out over a drop. */
			const SUNK = 8;

			/**
			 * The patch, its ground, and everything standing on it.
			 *
			 * **The hexagons are blocks, not map cells.** The other labs draw
			 * the coarse map, because the map is the terrain and a landscape is
			 * what they are about. A plant is metres tall and blocks wide, so
			 * this patch is the block grid at the full subdivision depth and the
			 * map is read underneath it -- through `hexRound` on scaled
			 * barycentric weights, which is how the engine finds a coarse cell
			 * from a fine one.
			 */
			function generate(cells = knobs.cells) {
				// **One plant does not need a hundred metres of ground.** A
				// patch that wide puts a hillside fifty metres taller than the
				// plant in the way of every camera angle, and it costs the whole
				// patch to draw to look at one tree.
				if (knobs.plant === "one plant") cells = Math.min(cells, 40);
				const k = derived();
				const seed = seedFromString(knobs.seed);
				const ground = {
					// **A layer is set in metres and the noise takes a
					// frequency.** The sample point is a unit direction, so the
					// frequency counts how many times the widest octave repeats
					// across the whole planet -- metres divided by the radius
					// reach it, and the number a person sets then means the same
					// thing whatever size the planet is. The bend and the leaf
					// cut below are sampled in local metres instead, because a
					// plant is a metre-scale thing standing in one place.
					frequency: k.radius / knobs.feature,
					octaves: Math.round(knobs.octaves),
					persistence: 0.5,
					lacunarity: 2,
					offsetX: 0,
					offsetY: 0,
					ridge: 0,
				};

				// **A level of detail is a subdivision depth, and nothing else.**
				// A coarse chunk here is drawn at a shallower depth over the same
				// ground, which is the engine's own rule: levels do not nest, so
				// a coarse mesh re-evaluates the terrain rather than dropping
				// cells from a fine one. Blocks are wider and taller by the same
				// factor, and a plant is rasterised into whatever lattice the
				// chunk is drawn at.
				const lod = Math.round(knobs.lod);
				const grain = 2 ** lod;
				const n = 2 ** Math.max(2, knobs.subdivisionDepth - lod);
				// **The planting lattice is the finest one, at every level.** A
				// root is a cell, and a coarse chunk's cells are not the fine
				// chunk's cells -- hashing its own would choose a different
				// forest for every level and a tree would come and go as the
				// player walked. So the roots are enumerated at full depth
				// whatever is being drawn, which is the one part of this that
				// does NOT get cheaper with distance.
				const rootN = 2 ** knobs.subdivisionDepth;
				const m = 2 ** k.level;
				const middle = directionOf(knobs.latitude, knobs.longitude);
				const drawn = Math.max(4, cells >> lod);
				const found = directionToCell(middle[0], middle[1], middle[2], n);
				const start = canonicalCell(found.face, n, found.i, found.j);
				const reach = Math.max(1, drawn >> 1);
				const keyOf = (c) => (c.face * (n + 1) + c.i) * (n + 1) + c.j;
				const at = new Map();
				const list = [];
				const add = (c) => {
					const key = keyOf(c);
					if (at.has(key)) return false;
					at.set(key, list.length);
					list.push(c);
					return true;
				};
				add(start);
				let frontier = [start];
				for (let r = 0; r < reach; r++) {
					const next = [];
					for (const c of frontier)
						for (let d = 0; d < 6; d++) {
							const nb = neighbour(c.face, n, c.i, c.j, d);
							if (!nb) continue;
							const cell = canonicalCell(nb.face, n, nb.i, nb.j);
							if (add(cell)) next.push(cell);
						}
					frontier = next;
				}

				const count = list.length;
				const centre = latticePosition(start.face, n, start.i, start.j);
				const frame = frameOf(centre);
				const radius = k.radius;
				// A layer is as thick as a cell is wide, and both grow with the
				// level -- the engine shifts the layer index by the level for
				// exactly this reason.
				const block = k.blockSize * grain;
				const height = new Float64Array(count);
				const localX = new Float64Array(count);
				const localZ = new Float64Array(count);
				const degree = new Uint8Array(count);
				// **The cell's own direction, kept.** Everything a plant does is
				// in world coordinates now, so this is read once per stamped
				// cell rather than recomputed from the lattice.
				const dirX = new Float64Array(count);
				const dirY = new Float64Array(count);
				const dirZ = new Float64Array(count);
				const corner = new Float64Array(count * 18);
				const ring = new Int32Array(count * 6).fill(-1);
				// **One height per map cell, and every block cell under it reads
				// the same one** -- so the ground is faceted at the map's own
				// resolution, which is what the engine builds.
				const mapHeight = new Map();
				/** One coarse lattice point's height, asked for once. */
				const mapAt = (face, ci, cj) => {
					const key = (face * (m + 1) + ci) * (m + 1) + cj;
					let h = mapHeight.get(key);
					if (h === undefined) {
						const q = latticePosition(face, m, ci, cj);
						h = mapHeightAt(q, seed, ground, knobs.relief);
						mapHeight.set(key, h);
					}
					return h;
				};
				let lowest = Infinity;
				let highest = -Infinity;
				for (let c = 0; c < count; c++) {
					const cell = list[c];
					const p = latticePosition(cell.face, n, cell.i, cell.j);
					dirX[c] = p[0];
					dirY[c] = p[1];
					dirZ[c] = p[2];
					localX[c] =
						(p[0] - centre[0]) * radius * frame.east[0] +
						(p[1] - centre[1]) * radius * frame.east[1] +
						(p[2] - centre[2]) * radius * frame.east[2];
					localZ[c] =
						(p[0] - centre[0]) * radius * frame.north[0] +
						(p[1] - centre[1]) * radius * frame.north[1] +
						(p[2] - centre[2]) * radius * frame.north[2];
					let h = 0;
					for (const [ci, cj, weight] of coarseCorners(
						cell.face, n, cell.i, cell.j, m,
					)) {
						if (weight === 0) continue;
						h += weight * mapAt(cell.face, ci, cj);
					}
					height[c] = h;
					if (h < lowest) lowest = h;
					if (h > highest) highest = h;
					const corners = cellCorners(cell.face, n, cell.i, cell.j);
					degree[c] = corners.length;
					for (let v = 0; v < corners.length; v++) {
						corner[c * 18 + v * 3] = corners[v][0];
						corner[c * 18 + v * 3 + 1] = corners[v][1];
						corner[c * 18 + v * 3 + 2] = corners[v][2];
					}
					for (let d = 0; d < 6; d++) {
						const nb = neighbour(cell.face, n, cell.i, cell.j, d);
						if (!nb) continue;
						const hit = at.get(keyOf(canonicalCell(nb.face, n, nb.i, nb.j)));
						if (hit !== undefined) ring[c * 6 + d] = hit;
					}
				}

				// **A layer is a whole block, and the surface is where the
				// rounding puts it.** Two columns a metre apart in height stand
				// on the same layer boundary or on two, never half way between,
				// which is what a wall between them is drawn from.
				// **The datum is the world's, never the patch's.** Counting
				// layers from the lowest ground in view makes a column's height
				// depend on what else was drawn, which is the one thing a chunk
				// generating alone cannot know. Sea level is zero by
				// construction, so zero is the datum.
				const datum = 0;
				const groundLayer = new Int32Array(count);
				const top = new Float64Array(count);
				for (let c = 0; c < count; c++) {
					groundLayer[c] = Math.floor((height[c] - datum) / block);
					top[c] = datum + (groundLayer[c] + 1) * block;
				}

				// **The roots, at the finest lattice, whatever is being drawn.**
				// A coarse chunk covers four times the ground of the one a level
				// finer and holds the same number of cells, so its terrain costs
				// the same at every level -- that is what makes distance cheap.
				// The plants do not follow: they are chosen per fine cell, and
				// the same ground holds the same trees however coarsely it is
				// drawn, so this walk is the same size at every level. **It is
				// the one part of a chunk whose cost does not fall with
				// distance**, and the readout says so.
				const roots = [];
				{
					const fine = directionToCell(middle[0], middle[1], middle[2], rootN);
					const seedCell = canonicalCell(fine.face, rootN, fine.i, fine.j);
					const keyFine = (c) => (c.face * (rootN + 1) + c.i) * (rootN + 1) + c.j;
					const seen = new Set([keyFine(seedCell)]);
					roots.push(seedCell);
					let edge = [seedCell];
					const want = Math.max(1, cells >> 1);
					for (let r = 0; r < want; r++) {
						const next = [];
						for (const c of edge)
							for (let d = 0; d < 6; d++) {
								const nb = neighbour(c.face, rootN, c.i, c.j, d);
								if (!nb) continue;
								const cell = canonicalCell(nb.face, rootN, nb.i, nb.j);
								const key = keyFine(cell);
								if (seen.has(key)) continue;
								seen.add(key);
								roots.push(cell);
								next.push(cell);
							}
						edge = next;
					}
				}
				// Which drawn cell each root stands on, and where it stands.
				const rootSeat = new Int32Array(roots.length).fill(-1);
				const rootDir = new Float64Array(roots.length * 3);
				// **The ground at the root's own point, not at the cell it is
				// drawn on.** A coarse level resamples the surface, so a shore
				// read off the drawn cell moves a metre or two every level and a few
				// plants at the waterline come and go with the level. The map is
				// the terrain and a point's height on it does not depend on who
				// asks.
				const rootHeight = new Float64Array(roots.length);
				for (let r = 0; r < roots.length; r++) {
					const cell = roots[r];
					const p = latticePosition(cell.face, rootN, cell.i, cell.j);
					let h = 0;
					for (const [ci, cj, weight] of coarseCorners(
						cell.face, rootN, cell.i, cell.j, m,
					)) {
						if (weight === 0) continue;
						h += weight * mapAt(cell.face, ci, cj);
					}
					rootHeight[r] = h;
					rootDir[r * 3] = p[0];
					rootDir[r * 3 + 1] = p[1];
					rootDir[r * 3 + 2] = p[2];
					const coarse =
						rootN === n
							? cell
							: coarseOf(cell.face, rootN, cell.i, cell.j, n);
					const seat = at.get(keyOf(canonicalCell(coarse.face, n, coarse.i, coarse.j)));
					if (seat !== undefined) rootSeat[r] = seat;
				}

				// How tall the tallest thing that could stand here is, which is
				// what the voxel field has to have room for.
				let reachUp = 0;
				for (const name of SPECIES_NAMES) {
					const spec = shapeOf(name);
					const grows =
						knobs.plant === "grove"
							? knobs.mixed || name === knobs.species
							: name === knobs.species;
					if (!grows) continue;
					reachUp = Math.max(
						reachUp,
						spec.height * (1 + knobs.sizeSpread) + spec.leafRadius * 1.6,
					);
				}
				if (knobs.growth === NOISE_GROWTH)
					reachUp = Math.max(reachUp, knobs.height);
				const LAYERS = Math.min(
					320,
					SUNK + Math.ceil(reachUp / block) + 3,
				);
				// The widest trunk any species on the panel can grow, which is
				// where a cell stops being narrower than the wood in it.
				let widestTrunk = 0;
				for (const name of SPECIES_NAMES)
					widestTrunk = Math.max(
						widestTrunk,
						shapeOf(name).trunk * (1 + knobs.sizeSpread),
					);
				const veg = new Uint8Array(count * LAYERS);
				// **Which species put a cell there**, so a mixed stand is not
				// one colour. Nought means the field mode, which has no species.
				const owner = new Uint8Array(count * LAYERS);
				const cellMetres = k.blockMetres * grain;

				// **A plant is grown in world coordinates, and that is what lets
				// a chunk grow it alone.** Every earlier version worked in the
				// patch's own east/up/north frame with the origin at the patch
				// centre, which is a frame no chunk has: two chunks holding one
				// tree would each grow it about their own middle and disagree
				// about every cell of it. Nothing below mentions the patch. A
				// point is three numbers in the planet's own space, the cell it
				// falls in comes from `directionToCell` on that point, and how
				// high it stands is its distance from the centre less the
				// radius -- all three of which any chunk can work out from an
				// address and the seed.
				const cellOf = (px, py, pz) => {
					const len = Math.sqrt(px * px + py * py + pz * pz) || 1;
					const c = directionToCell(px / len, py / len, pz / len, n);
					const hit = at.get(keyOf(canonicalCell(c.face, n, c.i, c.j)));
					return hit === undefined ? -1 : hit;
				};
				const metresOf = (px, py, pz) =>
					Math.sqrt(px * px + py * py + pz * pz) - radius;
				/** Which layer of a column a height in metres lands in. */
				const layerAt = (c, metres) =>
					SUNK + Math.floor((metres - top[c]) / block);

				// A ring walk out from one cell, reused for every stamp. It
				// gathers cells and carries no heading, so the half turn and the
				// pentagons cost nothing.
				const mark = new Int32Array(count).fill(-1);
				const bag = new Int32Array(4096);
				let era = 0;
				const gather = (from, rings) => {
					era++;
					let used = 0;
					bag[used++] = from;
					mark[from] = era;
					let read = 0;
					for (let r = 0; r < rings; r++) {
						const stop = used;
						for (let q = read; q < stop; q++) {
							const c = bag[q];
							for (let d = 0; d < 6; d++) {
								const nb = ring[c * 6 + d];
								if (nb < 0 || mark[nb] === era) continue;
								if (used >= bag.length) return used;
								mark[nb] = era;
								bag[used++] = nb;
							}
						}
						read = stop;
					}
					return used;
				};

				// **Where a write goes, and which writes a chunk is allowed to
				// make.** A chunk may only write the cells it owns. It grows
				// plants rooted outside itself all the same -- that is the whole
				// point -- but what those plants put down beyond its own
				// territory is the neighbour's business, and dropping it on the
				// floor here is what proves the neighbour got it too.
				let target = veg;
				let tint = owner;
				let holds = null;
				let holder = 0;
				let painting = 0;
				// **A cell takes what most fills it, and past a certain cell
				// size that is the canopy.** A twig is centimetres thick and a
				// cluster is metres across, so wood beating leaf is right at the
				// block scale and exactly wrong once a block is wider than a
				// trunk: at level 3, an 8 m block, a forest drew 2,938 wood
				// cells against **62** leaf, because every cluster lands on the
				// same cell as the twig it hangs from and was refused there --
				// bare brown poles at exactly the distance a forest should read
				// as green.
				//
				// **The rule is a rank and not a permission**, and that
				// distinction is the whole of it. Letting a leaf overwrite wood
				// where it happens to arrive second makes the answer depend on
				// the order plants are grown in, and a chunk grows them in a
				// different order from its neighbour -- measured, that alone
				// took the chunk audit from 0 cells differing to 10. A rank
				// fixed before any plant is grown gives the same cell whatever
				// order it is written in.
				const canopyWins = cellMetres > widestTrunk;
				const rankOf = (what) =>
					what === EMPTY ? 0 : (what === LEAF) === canopyWins ? 2 : 1;
				const write = (c, slot, what) => {
					if (slot < 0 || slot >= LAYERS) return;
					if (holds !== null && holds[c] !== holder) return;
					const i = c * LAYERS + slot;
					if (rankOf(what) <= rankOf(target[i])) return;
					target[i] = what;
					if (tint !== null) tint[i] = painting;
				};

				/** One tapered rod of wood, between two points in world space. */
				const rod = (ax, ay, az, bx, by, bz, ra, rb) => {
					// **A rod thinner than a cell rasterises to a dotted line,
					// and a dotted branch is not connected to anything.**
					// Measured over one tree in a 64 m box: at radius 0.45 of a
					// cell it comes out as 66 separate pieces with 74.7% of the
					// wood rooted, and at 0.87 it is one piece and 100%. The
					// floor is what makes connectivity a property of the
					// construction rather than something to hope for.
					const thin = cellMetres * 0.5;
					ra = Math.max(ra, thin);
					rb = Math.max(rb, thin);
					const ux = bx - ax, uy = by - ay, uz = bz - az;
					const run = Math.sqrt(ux * ux + uy * uy + uz * uz);
					const wide = Math.max(ra, rb);
					const steps = Math.max(1, Math.ceil(run / (block * 0.4)));
					const rings = Math.min(9, Math.ceil((wide + block) / cellMetres) + 1);
					let wasCell = -1;
					let wasLayer = 0;
					for (let s = 0; s <= steps; s++) {
						const t = s / steps;
						const px = ax + ux * t, py = ay + uy * t, pz = az + uz * t;
						const seat = cellOf(px, py, pz);
						if (seat < 0) continue;
						const stands = metresOf(px, py, pz);
						// **The axis cell is always written, whatever the
						// radius**, so the rod is a walk rather than a string of
						// discs -- and where a step moves sideways and up at
						// once, the corner between the two is written too. The
						// ring is six neighbours and the column is two; a
						// diagonal is neither, and one missed corner is a branch
						// in two pieces.
						const here = layerAt(seat, stands);
						if (here >= 0 && here < LAYERS) {
							write(seat, here, WOOD);
							if (wasCell >= 0 && wasCell !== seat) {
								// A layer index is counted from the column's own
								// ground, so carrying one across to another
								// column means converting it rather than reusing
								// the number.
								const bridge =
									wasLayer + groundLayer[wasCell] - groundLayer[seat];
								if (bridge !== here) write(seat, bridge, WOOD);
							}
							wasCell = seat;
							wasLayer = here;
						}
						const used = gather(seat, rings);
						for (let q = 0; q < used; q++) {
							const c = bag[q];
							const lo = Math.max(0, layerAt(c, stands - wide - block));
							const hi = Math.min(
								LAYERS - 1,
								layerAt(c, stands + wide + block),
							);
							// The true distance from the block's own centre to
							// the rod's axis, so a rod is a rod and not a
							// staircase of discs.
							for (let slot = lo; slot <= hi; slot++) {
								const my = top[c] + (slot - SUNK + 0.5) * block;
								const reach2 = radius + my;
								const cx = dirX[c] * reach2;
								const cy = dirY[c] * reach2;
								const cz = dirZ[c] * reach2;
								const dx = cx - ax, dy = cy - ay, dz = cz - az;
								let along =
									run > 0 ? (dx * ux + dy * uy + dz * uz) / (run * run) : 0;
								along = Math.max(0, Math.min(1, along));
								const ex = dx - ux * along;
								const ey = dy - uy * along;
								const ez = dz - uz * along;
								const r = ra + (rb - ra) * along;
								if (ex * ex + ey * ey + ez * ez <= r * r)
									write(c, slot, WOOD);
							}
						}
					}
				};

				/**
				 * One cluster of leaves: a ball, cut by noise.
				 *
				 * **A ball is a ball and a canopy is not.** The cut is what
				 * makes a rim ragged and lets light through, and it is read at
				 * the cell's own place in the world -- so two clusters that
				 * overlap agree about the air between them, and so do two
				 * chunks that both draw one cluster.
				 *
				 * **One octave, because this is a cut and not a landscape.** A
				 * second costs eight more hashed lattice corners for every
				 * candidate cell of every cluster, and a canopy has hundreds of
				 * clusters -- it is the largest single bill on the page.
				 */
				const leafNoise = (spec) => ({
					frequency: 1 / Math.max(0.4, spec.leafRadius * 0.55),
					octaves: 1,
					persistence: 0.5,
					lacunarity: 2,
					offsetX: 0,
					offsetY: 0,
					ridge: 0,
				});
				const cluster = (x, y, z, r, spec, noise) => {
					if (r <= 0) return;
					const seat = cellOf(x, y, z);
					if (seat < 0) return;
					const stands = metresOf(x, y, z);
					// **A cluster narrower than a cell still has to land
					// somewhere.** A rod already has a floor on its radius, so
					// at a coarse level every twig is drawn as a whole block
					// while a canopy smaller than one cell passes no distance
					// test at all and disappears. Measured at level 3, an 8 m
					// block: 2,941 wood cells against **62** leaf, which is a
					// forest that reads as bare brown poles from exactly the
					// distance a forest should read as green. The floor is the
					// same one, for the same reason.
					if (r < cellMetres * 0.6) {
						write(seat, layerAt(seat, stands), LEAF);
						return;
					}
					const used = gather(seat, Math.min(12, Math.ceil(r / cellMetres) + 1));
					for (let q = 0; q < used; q++) {
						const c = bag[q];
						const lo = Math.max(0, layerAt(c, stands - r));
						const hi = Math.min(LAYERS - 1, layerAt(c, stands + r));
						for (let slot = lo; slot <= hi; slot++) {
							const my = top[c] + (slot - SUNK + 0.5) * block;
							const reach2 = radius + my;
							const cx = dirX[c] * reach2;
							const cy = dirY[c] * reach2;
							const cz = dirZ[c] * reach2;
							const dx = cx - x, dy = cy - y, dz = cz - z;
							const away = Math.sqrt(dx * dx + dy * dy + dz * dz) / r;
							if (away > 1) continue;
							const cut =
								1 -
								away +
								(spec.leafRough > 0
									? spec.leafRough *
										0.6 *
										octaveNoise(cx, cy, cz, seed + 71, noise)
									: 0);
							if (cut > 1 - spec.leafFill) write(c, slot, LEAF);
						}
					}
				};

				// **The map's own gradient, not the block ring's.** Inside one
				// map cell every block stands at the same height, so a block
				// ring reads a slope of zero everywhere except on a facet edge,
				// where it reads the whole step. The ground's real steepness is
				// a property of the map.
				const slopeAt = new Map();
				// **Per finest block, never per drawn block.** How steep the
				// ground is, is a property of the world; dividing by the cell
				// size of whatever level happens to be drawn makes the same
				// hillside four times steeper a level out, and measured that
				// refused **6,544 of 7,045** roots at level 2 against none at
				// level 0. Which plants exist has to be the same answer at every
				// level or a forest appears and disappears as a player walks.
				const perBlock = Math.max(1, k.mapMetres / k.blockMetres);
				const slopeOf = (coarse) => {
					const key = (coarse.face * (m + 1) + coarse.i) * (m + 1) + coarse.j;
					let s = slopeAt.get(key);
					if (s !== undefined) return s;
					const here = latticePosition(coarse.face, m, coarse.i, coarse.j);
					const mine = mapHeightAt(here, seed, ground, knobs.relief);
					s = 0;
					for (let d = 0; d < 6; d++) {
						const nb = neighbour(coarse.face, m, coarse.i, coarse.j, d);
						if (!nb) continue;
						const q = latticePosition(nb.face, m, nb.i, nb.j);
						s = Math.max(
							s,
							Math.abs(mapHeightAt(q, seed, ground, knobs.relief) - mine),
						);
					}
					s /= perBlock;
					slopeAt.set(key, s);
					return s;
				};

				let trees = 0;
				let rejected = 0;
				let tallest = 0;
				let shortest = Infinity;
				let differ = 0;
				let rootsTested = 0;
				let rootsOwned = 0;
				let chunkCount = 1;
				// **How far the widest plant actually reached**, measured rather
				// than assumed. It is what the reach past a chunk's rim has to
				// cover: anything wider and a neighbour never sees the root, so
				// it writes nothing where the canopy falls and the tree comes
				// apart at the boundary.
				let widest = 0;

				/**
				 * Does one cell hold a plant, and if so which one and how big?
				 *
				 * **Every answer here is a hash of the cell's own address and
				 * the seed.** That is the whole requirement: two chunks that
				 * both consider this root get the same plant, because neither
				 * of them is consulted.
				 */
				const plantAt = (r) => {
					const seat = rootSeat[r];
					if (seat < 0) return null;
					const cell = roots[r];
					if (knobs.plant === "one plant") return r === 0 ? cell : null;
					if (rootHeight[r] <= knobs.seaLevel) return null;
					// **The twelve pentagons are protected columns**, so nothing
					// is planted on one and no branch has to ask for a fifth
					// direction. A lattice point is one of the twelve exactly
					// when it is a corner of its own face triangle, which is
					// three integer comparisons rather than a polygon.
					if (
						(cell.i === 0 && cell.j === 0) ||
						(cell.i === rootN && cell.j === 0) ||
						(cell.i === 0 && cell.j === rootN)
					)
						return "no";
					if (
						slopeOf(coarseOf(cell.face, rootN, cell.i, cell.j, m)) >
						knobs.slopeLimit
					)
						return "no";
					if (hash3(cell.i, cell.j, cell.face, seed + 909) >= knobs.density / 100)
						return null;
					return cell;
				};

				// **A plant shorter than one block cannot be drawn, so it is not
				// grown.** Left in, a 0.9 m heather becomes a whole 8 m block of
				// wood at level 3 -- bigger than it is at level 0 and standing
				// where nothing should be. Skipping it also takes its whole
				// skeleton off the bill, which is the only part of the plant
				// cost that falls with distance.
				const tooSmall = (spec, scale) => spec.height * scale < block;

				/** Grow whatever stands on one cell, into whatever sink is set. */
				const raise = (r) => {
					const seat = rootSeat[r];
					const cell = roots[r];
					const roll = hash3(cell.j, cell.face, cell.i, seed + 55);
					const name =
						knobs.plant !== "one plant" && knobs.mixed
							? SPECIES_NAMES[
									Math.min(
										SPECIES_NAMES.length - 1,
										Math.floor(roll * SPECIES_NAMES.length),
									)
								]
							: knobs.species;
					const spec = shapeOf(name);
					painting = SPECIES_NAMES.indexOf(name) + 1;
					const scale =
						1 +
						knobs.sizeSpread *
							(2 * hash3(cell.face, cell.i, cell.j, seed + 77) - 1);
					if (tooSmall(spec, scale)) return 0;
					// **The plant's own frame, taken at its own root.** Up is
					// `normalize(position)` and there is no global north, so
					// every plant stands in a frame of its own -- which is the
					// second half of what makes it a pure function of its
					// address.
					// **The plant stands on the ground as it is DRAWN**, so its
					// foot moves to the layer the coarse chunk put the surface
					// on. Its direction is its own fine lattice point, which
					// never moves.
					const ux = rootDir[r * 3], uy = rootDir[r * 3 + 1], uz = rootDir[r * 3 + 2];
					const foot = radius + top[seat];
					const base = [ux * foot, uy * foot, uz * foot];
					const stance = frameOf([ux, uy, uz]);
					const out = { rods: [], clusters: [] };
					growPlant(base, stance, spec, scale, seed + Math.floor(roll * 100000), out);
					// **Sideways, not away.** Which chunks a plant reaches into
					// is a question about the ground it stands over, and a
					// straight distance from the foot is mostly the trunk's own
					// height -- a 85 m redwood reads 81 m by that measure and
					// covers twenty. The radial part comes out along the root's
					// own up.
					const far = (x, y, z, pad) => {
						const dx = x - base[0], dy = y - base[1], dz = z - base[2];
						const along =
							dx * stance.up[0] + dy * stance.up[1] + dz * stance.up[2];
						const ex = dx - stance.up[0] * along;
						const ey = dy - stance.up[1] * along;
						const ez = dz - stance.up[2] * along;
						const away = Math.sqrt(ex * ex + ey * ey + ez * ez) + pad;
						if (away > widest) widest = away;
					};
					for (const r of out.rods) {
						rod(r[0], r[1], r[2], r[3], r[4], r[5], r[6], r[7]);
						far(r[3], r[4], r[5], Math.max(r[6], r[7]));
					}
					const noise = leafNoise(spec);
					for (const b of out.clusters) {
						cluster(b[0], b[1], b[2], b[3], spec, noise);
						far(b[0], b[1], b[2], b[3]);
					}
					const tall = spec.height * scale;
					if (tall > tallest) tallest = tall;
					if (tall < shortest) shortest = tall;
					return tall;
				};

				if (knobs.growth === NOISE_GROWTH) {
					// **The comparison, run on the same grid.** Two fields
					// crossed give a curve in three dimensions rather than the
					// surface one field gives, which is the only reason a
					// threshold looks branchy at all -- and the gate that is
					// meant to clear the clutter near the ground takes the trunk
					// with it. The count of pieces below is the whole answer.
					const air = {
						frequency: 1 / Math.max(1, knobs.bendFeature),
						octaves: 3,
						persistence: 0.5,
						lacunarity: 2,
						offsetX: 0,
						offsetY: 0,
						ridge: 0,
					};
					const tall = Math.ceil(knobs.height / block);
					for (let c = 0; c < count; c++) {
						if (height[c] <= knobs.seaLevel) continue;
						for (let L = 0; L < tall && SUNK + L < LAYERS; L++) {
							const up = L / Math.max(1, tall);
							const gate =
								1 -
								knobs.fieldGate *
									(1 - Math.min(1, Math.max(0, (up - 0.02) / 0.3)));
							const my = top[c] + (L + 0.5) * block;
							const s2 = radius + my;
							const px = dirX[c] * s2, py = dirY[c] * s2, pz = dirZ[c] * s2;
							const f = octaveNoise(px, py, pz, seed + 5, air);
							const g = octaveNoise(px, py, pz, seed + 6, air);
							if (Math.sqrt(f * f + g * g) < knobs.fieldThickness * gate)
								veg[c * LAYERS + SUNK + L] = WOOD;
						}
					}
				} else {
					// Which roots stand on each drawn cell. At the finest level
					// that is one apiece; four levels out it is 256, and the
					// list is the same length either way.
					const under = new Array(count);
					for (let r = 0; r < roots.length; r++) {
						const seat = rootSeat[r];
						if (seat < 0) continue;
						(under[seat] ??= []).push(r);
					}

					/** Every root in the patch, into whatever is the target. */
					const whole = () => {
						for (let r = 0; r < roots.length && trees < 4000; r++) {
							const answer = plantAt(r);
							if (answer === null) continue;
							if (answer === "no") {
								rejected++;
								continue;
							}
							raise(r);
							trees++;
						}
					};
					if (!knobs.chunked) {
						whole();
						rootsTested = roots.length;
						rootsOwned = roots.length;
					} else {
					// **Cut into chunks, and every chunk generates alone.**
					// A chunk is the triangle a cell's scaled barycentric
					// weights floor into -- the same descent `coarseCorners`
					// makes, one level of the same hierarchy -- so this is the
					// engine's own cut and not a grid laid over it.
					const side = Math.max(1, knobs.chunkCells);
					const cn = 2 ** Math.max(0, Math.round(Math.log2(n / side)));
					const scale = n / cn;
					const chunkOf = (c) => {
						const cell = list[c];
						const u = (n - cell.i - cell.j) / scale;
						const v = cell.i / scale;
						const w = cell.j / scale;
						const fu = Math.floor(u), fv = Math.floor(v), fw = Math.floor(w);
						const over = cn - (fu + fv + fw);
						return ((cell.face * (cn + 1) + fv) * (cn + 1) + fw) * 2 + (over >= 2 ? 1 : 0);
					};
					const held = new Map();
					const keyAt = new Float64Array(count);
					for (let c = 0; c < count; c++) {
						const key = chunkOf(c);
						keyAt[c] = key;
						let own = held.get(key);
						if (own === undefined) {
							own = [];
							held.set(key, own);
						}
						own.push(c);
					}
					chunkCount = held.size;

					// **How far past its own rim a chunk has to look**, in
					// hops, which is the number F-086 is about. Too small and
					// the audit below stops reading zero: a tree rooted just
					// outside is grown by its owner and not by the neighbour
					// whose cells its canopy reaches.
					const hops = Math.max(0, Math.ceil(knobs.chunkReach / cellMetres));
					const mine = new Int32Array(count).fill(-1);
					const near = new Int32Array(count).fill(-1);
					const queue = new Int32Array(count);
					let round = 0;
					for (const [key, own] of held) {
						round++;
						// Its own cells, then everything within reach of them.
						let used = 0;
						for (const c of own) {
							mine[c] = round;
							near[c] = round;
							queue[used++] = c;
						}
						let read = 0;
						for (let h = 0; h < hops; h++) {
							const stop = used;
							for (let q = read; q < stop; q++) {
								const c = queue[q];
								for (let d = 0; d < 6; d++) {
									const nb = ring[c * 6 + d];
									if (nb < 0 || near[nb] === round) continue;
									near[nb] = round;
									queue[used++] = nb;
								}
							}
							read = stop;
						}
						holds = mine;
						holder = round;
						for (let q = 0; q < used; q++) {
							const c = queue[q];
							const here = under[c];
							if (here === undefined) continue;
							const owned = mine[c] === round;
							if (owned) rootsOwned += here.length;
							rootsTested += here.length;
							for (const r of here) {
								const answer = plantAt(r);
								if (answer === null) continue;
								if (answer === "no") {
									if (owned) rejected++;
									continue;
								}
								raise(r);
								if (owned) trees++;
							}
						}
					}
					holds = null;

					// **The audit is the whole patch against itself.** Asking
					// whether two chunks agree about a cell neither of them owns
					// is the wrong question -- a chunk is only answerable for
					// its own territory, and what a plant spills past that is
					// the neighbour's business. The question that matters is
					// whether cutting the patch up changed anything, so the
					// same ground is generated a second time in one piece and
					// the two are compared cell for cell. Zero is the only
					// passing answer, and turning the reach down is what makes
					// it climb.
					// Not while a slider is moving: a draft covers the same
					// ground with fewer cells to answer inside a frame, and a
					// second full pass is the opposite of that.
					if (knobs.audit && cells === knobs.cells) {
						const check = new Uint8Array(count * LAYERS);
						target = check;
						tint = null;
						trees = 0;
						rejected = 0;
						whole();
						for (let i = 0; i < check.length; i++)
							if (check[i] !== veg[i]) differ++;
						target = veg;
						tint = owner;
					}
					}
				}
				if (shortest === Infinity) shortest = 0;

				// **The measurement the whole approach turns on, run live.**
				// Wood that is not connected to the ground is debris hanging in
				// the air. A skeleton is one piece standing on the ground
				// because it was grown that way; a threshold on noise is
				// hundreds of pieces with almost none of them touching down,
				// and no filter can repair that here -- a flood fill is a global
				// query, and a chunk has to decide its own contents alone.
				let woodCells = 0;
				let leafCells = 0;
				for (let i = 0; i < veg.length; i++) {
					if (veg[i] === WOOD) woodCells++;
					else if (veg[i] === LEAF) leafCells++;
				}
				let pieces = 0;
				let rooted = 0;
				if (woodCells > 0) {
					const seen = new Uint8Array(veg.length);
					const stack = new Int32Array(Math.min(veg.length, 1 << 22));
					for (let s = 0; s < veg.length; s++) {
						if (veg[s] !== WOOD || seen[s]) continue;
						pieces++;
						let deep = 0;
						let size = 0;
						let down = false;
						stack[deep++] = s;
						seen[s] = 1;
						while (deep > 0) {
							const p = stack[--deep];
							size++;
							const c = (p / LAYERS) | 0;
							const a = p - c * LAYERS;
							if (a === SUNK) down = true;
							const push = (q) => {
								if (q < 0 || q >= veg.length) return;
								if (veg[q] !== WOOD || seen[q]) return;
								if (deep >= stack.length) return;
								seen[q] = 1;
								stack[deep++] = q;
							};
							if (a + 1 < LAYERS) push(p + 1);
							if (a > 0) push(p - 1);
							for (let d = 0; d < 6; d++) {
								const nb = ring[c * 6 + d];
								if (nb < 0) continue;
								const a2 = a + groundLayer[c] - groundLayer[nb];
								if (a2 < 0 || a2 >= LAYERS) continue;
								push(nb * LAYERS + a2);
							}
						}
						if (down) rooted += size;
					}
					rooted /= woodCells;
				}

				// **Collision is not a second system.** A plant is blocks, so
				// what a player walks into is the block test the world already
				// runs -- and whether a leaf stops them is a property of the
				// block type, the way water's is. This counts what that comes
				// to: how much of the ground you could still step onto.
				const knee = Math.max(1, Math.round(1 / block));
				let landCells = 0;
				let blocked = 0;
				for (let c = 0; c < count; c++) {
					if (height[c] <= knobs.seaLevel) continue;
					landCells++;
					for (let L = 0; L < knee; L++) {
						const what = veg[c * LAYERS + SUNK + L];
						if (what === WOOD || (what === LEAF && knobs.leavesCollide)) {
							blocked++;
							break;
						}
					}
				}

				field = {
					k, seed, n, m, list, at, keyOf, count, height, degree, corner,
					ring, centre, frame, localX, localZ, groundLayer, top, veg, owner,
					dirX, dirY, dirZ, chunkCount, rootsTested,
					rootsOwned, widest, differ, lod, block, roots: roots.length,
					LAYERS, datum, lowest, highest, cellMetres,
					span: drawn * cellMetres,
					trees, rejected, tallest, shortest, woodCells, leafCells,
					pieces, rooted,
					walkable: landCells ? 1 - blocked / landCells : 1,
					draft: cells !== knobs.cells,
				};
			}

			// ---------------------------------------------------------------
			// The patch, as hexagon columns.
			// ---------------------------------------------------------------

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in vec3 tint;
			layout(location = 2) in vec3 normal;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out vec3 vTint;
			void main() {
				vNormal = normal;
				vTint = tint;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in vec3 vTint;
			uniform vec3 sun;
			uniform int water;
			out vec4 color;
			void main() {
				// **The normal is stored, and it is stored as three bytes.**
				// Taking it from the change of position across a pixel averages
				// a cap and a wall into a normal belonging to neither wherever a
				// block is a few pixels wide, and a canopy is nothing but such
				// edges. A face normal quantised to one part in 127 is far finer
				// than any shading here can show.
				vec3 n = normalize(vNormal);
				if (!gl_FrontFacing) n = -n;
				float lit = 0.32 + 0.68 * max(0.0, dot(n, normalize(sun)));
				if (water == 1) {
					color = vec4(pow(vec3(0.12, 0.32, 0.55) * lit, vec3(1.0 / 2.2)), 0.7);
					return;
				}
				color = vec4(pow(vTint * lit, vec3(1.0 / 2.2)), 1.0);
			}`;

			function compile(kind, source) {
				const shader = gl.createShader(kind);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);
				if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
					throw new Error(gl.getShaderInfoLog(shader) ?? "shader");
				return shader;
			}

			const program = gl.createProgram();
			gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SOURCE));
			gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SOURCE));
			gl.linkProgram(program);
			if (!gl.getProgramParameter(program, gl.LINK_STATUS))
				throw new Error(gl.getProgramInfoLog(program) ?? "link");
			const uViewProj = gl.getUniformLocation(program, "viewProj");
			const uSun = gl.getUniformLocation(program, "sun");
			const uWater = gl.getUniformLocation(program, "water");

			const vao = gl.createVertexArray();
			gl.bindVertexArray(vao);
			const positionBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
			gl.enableVertexAttribArray(0);
			gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
			const tintBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, tintBuffer);
			gl.enableVertexAttribArray(1);
			gl.vertexAttribPointer(1, 3, gl.UNSIGNED_BYTE, true, 0, 0);
			const normalBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
			gl.enableVertexAttribArray(2);
			gl.vertexAttribPointer(2, 3, gl.BYTE, true, 0, 0);

			let groundCount = 0;
			let plantFrom = 0;
			let plantCount = 0;
			let waterFrom = 0;
			let waterCount = 0;
			let bounds = { x: 0, y: 0, z: 0, reach: 1 };
			let faces = { ground: 0, wood: 0, leaf: 0 };

			/** The band a height falls in, as the engine's own colour. */
			function groundTint(metres) {
				const over = metres - knobs.seaLevel;
				if (over <= 0) return BAND_COLORS[0];
				if (over < GROUND_LINES.rock) return BAND_COLORS[1];
				if (over < GROUND_LINES.snow) return BAND_COLORS[2];
				return BAND_COLORS[3];
			}

			function buildMesh() {
				if (!field) return;
				const {
					k, count, degree, corner, ring, centre, frame, top, veg, owner,
					LAYERS, height, groundLayer,
				} = field;
				const radius = k.radius;
				const block = field.block;

				let room = count * 24 * 3;
				let position = new Float32Array(room * 3);
				let tint = new Uint8Array(room * 3);
				let normal = new Int8Array(room * 3);
				let vertices = 0;
				let loX = Infinity, hiX = -Infinity;
				let loY = Infinity, hiY = -Infinity;
				let loZ = Infinity, hiZ = -Infinity;
				const roomFor = () => {
					if (vertices + 3 <= room) return;
					room = Math.max(room * 2, vertices + 3);
					const a = new Float32Array(room * 3); a.set(position); position = a;
					const b = new Uint8Array(room * 3); b.set(tint); tint = b;
					const c = new Int8Array(room * 3); c.set(normal); normal = c;
				};

				const ringX = new Float64Array(6);
				const ringY = new Float64Array(6);
				const ringZ = new Float64Array(6);
				const localP = new Float64Array(3);
				const local = (dx, dy, dz, metres) => {
					const s = radius + metres;
					const rx = dx * s - centre[0] * radius;
					const ry = dy * s - centre[1] * radius;
					const rz = dz * s - centre[2] * radius;
					localP[0] = rx * frame.east[0] + ry * frame.east[1] + rz * frame.east[2];
					localP[1] = rx * frame.up[0] + ry * frame.up[1] + rz * frame.up[2];
					localP[2] = rx * frame.north[0] + ry * frame.north[1] + rz * frame.north[2];
					return localP;
				};

				let paint = [0, 0, 0];
				// **One plant in a 96 m patch is a speck if the camera frames
				// the patch.** The box round what is growing is tracked apart
				// from the box round everything drawn, so a single tree fills
				// the view and a grove is still seen whole.
				let pLoX = Infinity, pHiX = -Infinity;
				let pLoY = Infinity, pHiY = -Infinity;
				let pLoZ = Infinity, pHiZ = -Infinity;
				let watchPlant = false;
				const triangle = (ax, ay, az, bx, by, bz, cx, cy, cz) => {
					const ux = bx - ax, uy = by - ay, uz = bz - az;
					const vx = cx - ax, vy = cy - ay, vz = cz - az;
					const nx = uy * vz - uz * vy;
					const ny = uz * vx - ux * vz;
					const nz = ux * vy - uy * vx;
					// `sqrt(x*x + y*y + z*z)`, never `Math.hypot`, which is a
					// library routine rather than an IEEE operation.
					const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
					const n8 = [
						Math.round((nx / len) * 127),
						Math.round((ny / len) * 127),
						Math.round((nz / len) * 127),
					];
					roomFor();
					const at = vertices * 3;
					for (let v = 0; v < 3; v++)
						for (let x = 0; x < 3; x++) {
							normal[at + v * 3 + x] = n8[x];
							tint[at + v * 3 + x] = Math.max(
								0,
								Math.min(255, Math.round(paint[x] * 255)),
							);
						}
					position[at] = ax; position[at + 1] = ay; position[at + 2] = az;
					position[at + 3] = bx; position[at + 4] = by; position[at + 5] = bz;
					position[at + 6] = cx; position[at + 7] = cy; position[at + 8] = cz;
					vertices += 3;
					if (watchPlant) {
						for (const [x, y, z] of [[ax, ay, az], [bx, by, bz], [cx, cy, cz]]) {
							if (x < pLoX) pLoX = x;
							if (x > pHiX) pHiX = x;
							if (y < pLoY) pLoY = y;
							if (y > pHiY) pHiY = y;
							if (z < pLoZ) pLoZ = z;
							if (z > pHiZ) pHiZ = z;
						}
					}
					if (ax < loX) loX = ax; if (ax > hiX) hiX = ax;
					if (bx < loX) loX = bx; if (bx > hiX) hiX = bx;
					if (cx < loX) loX = cx; if (cx > hiX) hiX = cx;
					if (ay < loY) loY = ay; if (ay > hiY) hiY = ay;
					if (by < loY) loY = by; if (by > hiY) hiY = by;
					if (cy < loY) loY = cy; if (cy > hiY) hiY = cy;
					if (az < loZ) loZ = az; if (az > hiZ) hiZ = az;
					if (bz < loZ) loZ = bz; if (bz > hiZ) hiZ = bz;
					if (cz < loZ) loZ = cz; if (cz > hiZ) hiZ = cz;
				};

				const cap = (c, metres) => {
					const deg = degree[c];
					let mx = 0, my = 0, mz = 0;
					for (let v = 0; v < deg; v++) {
						const p = local(
							corner[c * 18 + v * 3],
							corner[c * 18 + v * 3 + 1],
							corner[c * 18 + v * 3 + 2],
							metres,
						);
						ringX[v] = p[0]; ringY[v] = p[1]; ringZ[v] = p[2];
						mx += p[0] / deg; my += p[1] / deg; mz += p[2] / deg;
					}
					for (let v = 0; v < deg; v++) {
						const b = (v + 1) % deg;
						triangle(mx, my, mz, ringX[v], ringY[v], ringZ[v], ringX[b], ringY[b], ringZ[b]);
					}
				};

				/** One side of a cell, between two heights. */
				const side = (c, edge, high, low) => {
					const deg = degree[c];
					const a = ((edge - 1 + deg) % deg) * 3 + c * 18;
					const b = edge * 3 + c * 18;
					const t1 = local(corner[a], corner[a + 1], corner[a + 2], high);
					const ax = t1[0], ay = t1[1], az = t1[2];
					const t2 = local(corner[b], corner[b + 1], corner[b + 2], high);
					const bx = t2[0], by = t2[1], bz = t2[2];
					const t3 = local(corner[b], corner[b + 1], corner[b + 2], low);
					const cx = t3[0], cy = t3[1], cz = t3[2];
					const t4 = local(corner[a], corner[a + 1], corner[a + 2], low);
					triangle(ax, ay, az, bx, by, bz, cx, cy, cz);
					triangle(ax, ay, az, cx, cy, cz, t4[0], t4[1], t4[2]);
				};

				// ---- the ground ----
				const lip = field.span * 0.05;
				for (let c = 0; c < count; c++) {
					paint = groundTint(height[c]);
					cap(c, top[c]);
					const deg = degree[c];
					for (let e = 0; e < deg; e++) {
						const nb = ring[c * 6 + e];
						const rim = nb < 0;
						const below = rim ? top[c] - lip : top[nb];
						if (below >= top[c] && !(rim && height[c] < knobs.seaLevel)) continue;
						side(c, e, rim && height[c] < knobs.seaLevel ? knobs.seaLevel : top[c], below);
					}
				}
				faces.ground = vertices / 3;
				plantFrom = vertices;
				watchPlant = true;

				// ---- everything standing on it ----
				let woodFaces = 0;
				for (let c = 0; c < count; c++) {
					const deg = degree[c];
					const base = c * LAYERS;
					for (let a = 0; a < LAYERS; a++) {
						const what = veg[base + a];
						if (what === EMPTY) continue;
						const from = top[c] + (a - SUNK) * block;
						const to = from + block;
						const kind = owner[base + a];
						const spec = kind > 0 ? SPECIES[SPECIES_NAMES[kind - 1]] : null;
						// **A canopy is darker than the grass under it, and it
						// has to be or you cannot see it.** The ground here is
						// the engine's own grass, `0.26, 0.44, 0.19`, and a leaf
						// green sits within a few hundredths of it -- side by
						// side the two read as one surface and a tree disappears
						// into the hillside. Leaves are in their own shade
						// anyway: a cluster is a shell, and almost every cell of
						// it has other leaves over it.
						const shade = what === LEAF ? 0.66 : 1;
						const raw = spec
							? what === WOOD
								? spec.wood
								: spec.leaf
							: [0.36, 0.26, 0.18];
						// A speckle off the cell's own address, so a canopy is
						// not one flat colour and nothing has to be stored.
						const grain =
							0.86 +
							0.28 * hash3(c, a, what, field.seed + 3);
						paint = [
							raw[0] * grain * shade,
							raw[1] * grain * shade,
							raw[2] * grain * shade,
						];
						const before = vertices;
						if (a + 1 >= LAYERS || veg[base + a + 1] === EMPTY) cap(c, to);
						if (a > SUNK && veg[base + a - 1] === EMPTY) cap(c, from);
						for (let e = 0; e < deg; e++) {
							const nb = ring[c * 6 + e];
							if (nb < 0) {
								side(c, e, to, from);
								continue;
							}
							const a2 = a + groundLayer[c] - groundLayer[nb];
							// Under the neighbour's own surface is rock, which
							// the ground pass already drew.
							if (a2 < SUNK) continue;
							if (a2 < LAYERS && veg[nb * LAYERS + a2] !== EMPTY) continue;
							side(c, e, to, from);
						}
						if (what === WOOD) woodFaces += (vertices - before) / 6;
					}
				}
				watchPlant = false;
				plantCount = vertices - plantFrom;
				faces.wood = woodFaces;
				faces.leaf = plantCount / 6 - woodFaces;

				// ---- the sea, last, so it blends over what is behind it ----
				waterFrom = vertices;
				paint = SEA_COLOR;
				const sea = field.datum + Math.ceil((knobs.seaLevel - field.datum) / block) * block;
				for (let c = 0; c < count; c++) {
					if (height[c] >= knobs.seaLevel) continue;
					cap(c, sea);
					const deg = degree[c];
					for (let e = 0; e < deg; e++)
						if (ring[c * 6 + e] < 0) side(c, e, sea, top[c]);
				}
				waterCount = vertices - waterFrom;

				groundCount = faces.ground * 3;
				const one = knobs.plant === "one plant" && pHiX > pLoX;
				const brow = hiY;
				if (one) {
					loX = pLoX; hiX = pHiX;
					loY = pLoY; hiY = pHiY;
					loZ = pLoZ; hiZ = pHiZ;
				}
				bounds = {
					// **The highest ground drawn, so an eye framing one plant
					// does not end up inside the hill behind it.** A plant is
					// ten metres and the patch it stands in is a hundred, so the
					// camera pulled in close enough to see the plant sits well
					// below the skyline.
					floor: brow,
					x: (loX + hiX) / 2,
					y: (loY + hiY) / 2,
					z: (loZ + hiZ) / 2,
					reach: Math.sqrt(
						(hiX - loX) ** 2 + (hiY - loY) ** 2 + (hiZ - loZ) ** 2,
					) / 2 || field.span,
				};

				gl.bindVertexArray(vao);
				for (const [buffer, data, wide] of [
					[positionBuffer, position, 3],
					[tintBuffer, tint, 3],
					[normalBuffer, normal, 3],
				]) {
					gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
					gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, vertices * wide), gl.DYNAMIC_DRAW);
				}
				field.vertices = vertices;
			}

			function multiply(a, b) {
				const out = new Float32Array(16);
				for (let c = 0; c < 4; c++)
					for (let r = 0; r < 4; r++) {
						let s = 0;
						for (let i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
						out[c * 4 + r] = s;
					}
				return out;
			}

			function perspective(fov, aspect, near, far) {
				const f = 1 / Math.tan(fov / 2);
				const out = new Float32Array(16);
				out[0] = f / aspect;
				out[5] = f;
				out[10] = (far + near) / (near - far);
				out[11] = -1;
				out[14] = (2 * far * near) / (near - far);
				return out;
			}

			function lookAt(eye, to, upHint) {
				const f = [to[0] - eye[0], to[1] - eye[1], to[2] - eye[2]];
				const fl = Math.sqrt(f[0] ** 2 + f[1] ** 2 + f[2] ** 2) || 1;
				const z = f.map((v) => v / fl);
				let x = cross3(z, upHint);
				const xl = Math.sqrt(x[0] ** 2 + x[1] ** 2 + x[2] ** 2) || 1;
				x = x.map((v) => v / xl);
				const y = cross3(x, z);
				const out = new Float32Array(16);
				out[0] = x[0]; out[4] = x[1]; out[8] = x[2];
				out[1] = y[0]; out[5] = y[1]; out[9] = y[2];
				out[2] = -z[0]; out[6] = -z[1]; out[10] = -z[2];
				out[12] = -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]);
				out[13] = -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]);
				out[14] = z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2];
				out[15] = 1;
				return out;
			}

			const camera = { yaw: -0.7, pitch: 0.35, distance: 1.05, lift: 0 };

			function render() {
				const wide = view.clientWidth;
				const tall = view.clientHeight;
				const dpr = Math.min(2, window.devicePixelRatio || 1);
				view.width = Math.max(1, Math.round(wide * dpr));
				view.height = Math.max(1, Math.round(tall * dpr));
				gl.viewport(0, 0, view.width, view.height);
				gl.clearColor(0.027, 0.039, 0.055, 1);
				gl.enable(gl.DEPTH_TEST);
				gl.disable(gl.CULL_FACE);
				gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
				if (!field) return;
				const reach = bounds.reach;
				const away = reach * 2.4 * camera.distance;
				const eye = [
					bounds.x + Math.cos(camera.pitch) * Math.sin(camera.yaw) * away,
					Math.max(
						bounds.y + Math.sin(camera.pitch) * away + camera.lift * reach,
						bounds.floor + reach * 0.5,
					),
					bounds.z + Math.cos(camera.pitch) * Math.cos(camera.yaw) * away,
				];
				const proj = perspective(
					0.9,
					view.width / Math.max(1, view.height),
					Math.max(0.05, reach * 0.005),
					away + reach * 6,
				);
				const viewProj = multiply(
					proj,
					lookAt(eye, [bounds.x, bounds.y, bounds.z], [0, 1, 0]),
				);
				gl.useProgram(program);
				gl.bindVertexArray(vao);
				gl.uniformMatrix4fv(uViewProj, false, viewProj);
				gl.uniform3f(uSun, 0.42, 0.78, 0.46);
				gl.uniform1i(uWater, 0);
				gl.disable(gl.BLEND);
				gl.depthMask(true);
				gl.drawArrays(gl.TRIANGLES, 0, groundCount + plantCount);
				if (waterCount > 0) {
					gl.uniform1i(uWater, 1);
					gl.enable(gl.BLEND);
					gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
					gl.depthMask(false);
					gl.drawArrays(gl.TRIANGLES, waterFrom, waterCount);
					gl.depthMask(true);
					gl.disable(gl.BLEND);
				}
			}

			// ---------------------------------------------------------------
			// The panel.
			// ---------------------------------------------------------------

			function toParams() {
				const p = new URLSearchParams();
				for (const [key, row] of ROWS) {
					if (row.summary || row.type === "check") {
						if (knobs[key] !== row.value) p.set(key, knobs[key] ? "1" : "0");
						continue;
					}
					if (knobs[key] !== row.value) p.set(key, String(knobs[key]));
				}
				return p;
			}

			function fromParams(params) {
				// **A species is read first, because reading it writes the rows
				// under it.** Named after them, it would overwrite the very
				// numbers the link was written to carry; named before, an
				// explicit row still wins.
				const named = params.get("species");
				if (named && SPECIES[named]) {
					knobs.species = named;
					applySpecies(named);
				}
				for (const [key, row] of ROWS) {
					const raw = params.get(key);
					if (raw === null) continue;
					if (row.summary || row.type === "check") knobs[key] = raw === "1";
					else if (row.type === "text" || row.type === "select") knobs[key] = raw;
					else if (Number.isFinite(Number(raw))) knobs[key] = Number(raw);
				}
				// **A link could otherwise build what a slider cannot reach**, so
				// the draft settles here as well as after every move.
				settle();
			}

			function writeUrl() {
				const p = toParams();
				const url = p.toString()
					? location.pathname + "?" + p.toString()
					: location.pathname;
				history.replaceState(null, "", url);
			}

			/** Write a species' numbers into the rows that describe a shape. */
			function applySpecies(name) {
				const spec = SPECIES[name];
				for (const key of SHAPE_KEYS) knobs[key] = spec[key];
				knobs.useLeaves = spec.leaves;
			}

			function buildPanel() {
				const hostRight = document.getElementById("knobs");
				const hostLeft = document.getElementById("knobsLeft");
				for (const group of KNOBS) {
					const set = document.createElement("details");
					set.className = "group" + (group.tint ? " " + group.tint : "");
					set.open = group.open !== false;
					const legend = document.createElement("summary");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						if (row.summary) {
							const box = document.createElement("input");
							box.type = "checkbox";
							box.className = "switch";
							box.checked = knobs[row.key];
							box.title = row.title ?? "";
							box.addEventListener("click", (e) => e.stopPropagation());
							box.addEventListener("input", () => {
								knobs[row.key] = box.checked;
								askForRedraw(false);
							});
							legend.prepend(box);
							rows.set(row.key, { row, wrap: set, input: box });
							continue;
						}
						const wrap = document.createElement("div");
						const label = document.createElement("label");
						label.textContent = row.label;
						let input;
						wrap.className = "knob";
						if (row.type === "select") {
							input = document.createElement("select");
							for (const option of row.options) {
								const o = document.createElement("option");
								o.value = option;
								o.textContent = option;
								input.append(o);
							}
							input.value = knobs[row.key];
						} else if (row.type === "text") {
							input = document.createElement("input");
							input.type = "text";
							input.value = knobs[row.key];
						} else if (row.type === "check") {
							wrap.className = "knob check";
							input = document.createElement("input");
							input.type = "checkbox";
							input.checked = knobs[row.key];
						} else {
							input = document.createElement("input");
							input.type = "range";
							input.min = row.low;
							input.max = row.high;
							input.step = row.step;
							input.value = knobs[row.key];
						}
						const readout = document.createElement("output");
						if (row.type === "check") wrap.append(input, label);
						else wrap.append(label, readout, input);
						let note = null;
						if (row.note) {
							note = document.createElement("p");
							note.className = "knob-note";
							wrap.append(note);
						}
						set.append(wrap);
						rows.set(row.key, { row, wrap, input, readout, note });
						input.addEventListener("input", () => {
							if (row.type === "check") knobs[row.key] = input.checked;
							else if (row.type === "select" || row.type === "text")
								knobs[row.key] = input.value;
							else knobs[row.key] = Number(input.value);
							// **Picking a species writes its numbers into the
							// rows below**, which is what makes the list a set of
							// starting points rather than a menu of results.
							if (row.key === "species") applySpecies(input.value);
							askForRedraw();
						});
					}
					(group.panel === "left" ? hostLeft : hostRight).append(set);
				}
			}

			function refreshPanel() {
				for (const { row, wrap, readout, input, note } of rows.values()) {
					if (row.summary) {
						input.checked = knobs[row.key];
						// **Branches decide whether leaves can grow, so the row
						// is disabled rather than just dimmed** -- unlike a row
						// that has nothing to say at the current settings, this
						// one still means something, it is only unreachable
						// while there are no branches for a leaf to hang off.
						input.disabled = row.disabledWhen ? row.disabledWhen() : false;
						wrap.classList.toggle("off", !knobs[row.key] || input.disabled);
						continue;
					}
					// **A row with no meaning comes off the panel, it is not
					// greyed out** -- a disabled row is a question the reader has
					// to answer before dismissing.
					if (row.shownWhen) wrap.hidden = !row.shownWhen();
					if (row.type === "check") {
						input.checked = knobs[row.key];
						readout.textContent = "";
					} else if (row.type === "select" || row.type === "text") {
						input.value = knobs[row.key];
						readout.textContent = "";
					} else {
						const live = liveRange(row);
						input.min = live.low;
						input.max = live.high;
						input.value = knobs[row.key];
						readout.textContent =
							Number(knobs[row.key]).toFixed(row.digits ?? 2) +
							(row.unit ? " " + row.unit : "");
					}
					if (note) note.innerHTML = row.note();
				}
				if (!field) return;
				const solid =
					field.woodCells + (knobs.leavesCollide ? field.leafCells : 0);
				document.getElementById("recipe").innerHTML =
					`<i class="c">${field.trees.toLocaleString()}</i> plants · ` +
					`<i class="c">${field.woodCells.toLocaleString()}</i> wood + ` +
					`<i class="e">${field.leafCells.toLocaleString()}</i> leaf cells · ` +
					`<i class="p">${field.pieces.toLocaleString()}</i> pieces, ` +
					`<i class="p">${(100 * field.rooted).toFixed(1)}%</i> rooted`;
				document.getElementById("facts").innerHTML =
					`patch <b>${Math.round(field.span).toLocaleString()} m</b> across, ` +
					`<b>${field.count.toLocaleString()}</b> hexagons · ` +
					`ground <b>${Math.round(field.lowest)}</b> to ` +
					`<b>${Math.round(field.highest)} m</b> · ` +
					`<b>${solid.toLocaleString()}</b> cells you would walk into · ` +
					`<b>${Math.round(cost)} ms</b>`;
			}

			// ---------------------------------------------------------------
			// Boot.
			// ---------------------------------------------------------------

			let pending = false;
			let settleTimer = 0;
			function askForRedraw(draft = true) {
				clearTimeout(settleTimer);
				if (draft) settleTimer = setTimeout(() => askForRedraw(false), 220);
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					settle();
					generate(draft ? Math.max(24, knobs.cells >> 1) : knobs.cells);
					buildMesh();
					cost = performance.now() - started;
					refreshPanel();
					if (!draft) writeUrl();
					render();
				});
			}

			// The knobs open and shut on a phone; on a desktop the buttons are
			// not on the page at all and this never runs. Two drawers, two
			// buttons, each answering for its own -- opening one never closes
			// the other.
			const drawer = (buttonId, bodyClass, label) => {
				const button = document.getElementById(buttonId);
				button.addEventListener("click", () => {
					const open = document.body.classList.toggle(bodyClass);
					button.setAttribute("aria-expanded", String(open));
					button.textContent = open ? "Close" : label;
				});
			};
			drawer("toggle", "knobs", "World");
			drawer("toggleLeft", "plants", "Plants");

			let dragging = null;
			view.addEventListener("pointerdown", (e) => {
				dragging = { x: e.clientX, y: e.clientY, shift: e.shiftKey };
				view.setPointerCapture(e.pointerId);
			});
			view.addEventListener("pointermove", (e) => {
				if (!dragging) return;
				const dx = e.clientX - dragging.x;
				const dy = e.clientY - dragging.y;
				dragging.x = e.clientX;
				dragging.y = e.clientY;
				if (dragging.shift) camera.lift += dy * 0.002;
				else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(-0.2, Math.min(1.5, camera.pitch + dy * 0.005));
				}
				render();
			});
			const stop = () => {
				dragging = null;
			};
			view.addEventListener("pointerup", stop);
			view.addEventListener("pointercancel", stop);
			view.addEventListener(
				"wheel",
				(e) => {
					e.preventDefault();
					camera.distance = Math.max(
						0.05,
						Math.min(6, camera.distance * Math.exp(e.deltaY * 0.001)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", render);

			fromParams(new URLSearchParams(location.search));
			buildPanel();
			const booted = performance.now();
			settle();
			generate();
			buildMesh();
			cost = performance.now() - booted;
			refreshPanel();
			render();
		</script>
	</body>
</html>
