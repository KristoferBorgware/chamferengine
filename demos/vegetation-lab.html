						if (what === WOOD || (what === LEAF && knobs.leavesCollide)) {
							blocked++;
							break;
						}
					}
				}

				field = {
					k, seed, n, m, list, at, keyOf, count, height, degree, corner,
					ring, centre, frame, localX, localZ, groundLayer, top, veg, owner,
					dirX, dirY, dirZ, chunkCount, rootsTested,
					rootsOwned, widest, lod, block, roots: roots.length,
					LAYERS, datum, lowest, highest, cellMetres,
					// **The colour of every layer that grew, by the number the
					// owner array holds.** A mesh is built after the fact and a
					// layer may have been deleted by then, so the palette is
					// taken with the rest of the field rather than read back off
					// the panel.
					paints: live.map((layer) => ({ wood: layer.wood, leaf: layer.leaf })),
					layerCounts: live.map((layer) => ({ id: layer.id, grown: layer.grown })),
					span: drawn * cellMetres,
					trees, rejected, tallest, shortest, woodCells, leafCells,
					pieces, rooted,
					walkable: landCells ? 1 - blocked / landCells : 1,
					draft: cells !== knobs.cells,
				};
			}

			// ---------------------------------------------------------------
			// The patch, as hexagon columns.
			// ---------------------------------------------------------------

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in vec3 tint;
			layout(location = 2) in vec3 normal;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out vec3 vTint;
			void main() {
				vNormal = normal;
				vTint = tint;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in vec3 vTint;
			uniform vec3 sun;
			uniform int water;
			out vec4 color;
			void main() {
				// **The normal is stored, and it is stored as three bytes.**
				// Taking it from the change of position across a pixel averages
				// a cap and a wall into a normal belonging to neither wherever a
				// block is a few pixels wide, and a canopy is nothing but such
				// edges. A face normal quantised to one part in 127 is far finer
				// than any shading here can show.
				vec3 n = normalize(vNormal);
				if (!gl_FrontFacing) n = -n;
				float lit = 0.32 + 0.68 * max(0.0, dot(n, normalize(sun)));
				if (water == 1) {
					color = vec4(pow(vec3(0.12, 0.32, 0.55) * lit, vec3(1.0 / 2.2)), 0.7);
					return;
				}
				color = vec4(pow(vTint * lit, vec3(1.0 / 2.2)), 1.0);
			}`;

			function compile(kind, source) {
				const shader = gl.createShader(kind);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);
				if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
					throw new Error(gl.getShaderInfoLog(shader) ?? "shader");
				return shader;
			}

			const program = gl.createProgram();
			gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SOURCE));
			gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SOURCE));
			gl.linkProgram(program);
			if (!gl.getProgramParameter(program, gl.LINK_STATUS))
				throw new Error(gl.getProgramInfoLog(program) ?? "link");
			const uViewProj = gl.getUniformLocation(program, "viewProj");
			const uSun = gl.getUniformLocation(program, "sun");
			const uWater = gl.getUniformLocation(program, "water");

			const vao = gl.createVertexArray();
			gl.bindVertexArray(vao);
			const positionBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
			gl.enableVertexAttribArray(0);
			gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
			const tintBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, tintBuffer);
			gl.enableVertexAttribArray(1);
			gl.vertexAttribPointer(1, 3, gl.UNSIGNED_BYTE, true, 0, 0);
			const normalBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
			gl.enableVertexAttribArray(2);
			gl.vertexAttribPointer(2, 3, gl.BYTE, true, 0, 0);

			let groundCount = 0;
			let plantFrom = 0;
			let plantCount = 0;
			let waterFrom = 0;
			let waterCount = 0;
			let bounds = { x: 0, y: 0, z: 0, reach: 1 };
			let faces = { ground: 0, wood: 0, leaf: 0 };

			/** The band a height falls in, as the engine's own colour. */
			function groundTint(metres) {
				const over = metres - TERRAIN.seaLevel;
				if (over <= 0) return BAND_COLORS[0];
				if (over < GROUND_LINES.rock) return BAND_COLORS[1];
				if (over < GROUND_LINES.snow) return BAND_COLORS[2];
				return BAND_COLORS[3];
			}

			function buildMesh() {
				if (!field) return;
				const {
					k, count, degree, corner, ring, centre, frame, top, veg, owner,
					LAYERS, height, groundLayer,
				} = field;
				const radius = k.radius;
				const block = field.block;

				let room = count * 24 * 3;
				let position = new Float32Array(room * 3);
				let tint = new Uint8Array(room * 3);
				let normal = new Int8Array(room * 3);
				let vertices = 0;
				let loX = Infinity, hiX = -Infinity;
				let loY = Infinity, hiY = -Infinity;
				let loZ = Infinity, hiZ = -Infinity;
				const roomFor = () => {
					if (vertices + 3 <= room) return;
					room = Math.max(room * 2, vertices + 3);
					const a = new Float32Array(room * 3); a.set(position); position = a;
					const b = new Uint8Array(room * 3); b.set(tint); tint = b;
					const c = new Int8Array(room * 3); c.set(normal); normal = c;
				};

				const ringX = new Float64Array(6);
				const ringY = new Float64Array(6);
				const ringZ = new Float64Array(6);
				/**
				 * A direction and a height, as metres in the patch's own frame.
				 *
				 * **The third axis is south, and it has to be.** East, up and
				 * north in that order is a **left-handed** triple -- measured,
				 * `cross(east, up) . north` is `-1` -- and handing a left-handed
				 * basis to a right-handed renderer draws the mirror image of the
				 * ground. From overhead the frame's east then lands on the right
				 * of the screen where the map puts it and its north lands at the
				 * **bottom**, so the view is the map flipped top to bottom.
				 * Negating one axis rights it, and negating this one is what
				 * makes the default view agree with the map: at yaw zero the
				 * camera stands south of the patch looking north, so north is
				 * away from the eye and east is on the right, exactly as the
				 * picture draws them.
				 */
				const localP = new Float64Array(3);
				const local = (dx, dy, dz, metres) => {
					const s = radius + metres;
					const rx = dx * s - centre[0] * radius;
					const ry = dy * s - centre[1] * radius;
					const rz = dz * s - centre[2] * radius;
					localP[0] = rx * frame.east[0] + ry * frame.east[1] + rz * frame.east[2];
					localP[1] = rx * frame.up[0] + ry * frame.up[1] + rz * frame.up[2];
					localP[2] = -(
						rx * frame.north[0] +
						ry * frame.north[1] +
						rz * frame.north[2]
					);
					return localP;
				};

				/** The colour every vertex of the next triangle is written in. */
				let paint = [0, 0, 0];
				const triangle = (ax, ay, az, bx, by, bz, cx, cy, cz) => {
					const ux = bx - ax, uy = by - ay, uz = bz - az;
					const vx = cx - ax, vy = cy - ay, vz = cz - az;
					const nx = uy * vz - uz * vy;
					const ny = uz * vx - ux * vz;
					const nz = ux * vy - uy * vx;
					// `sqrt(x*x + y*y + z*z)`, never `Math.hypot`, which is a
					// library routine rather than an IEEE operation.
					const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
					const n8 = [
						Math.round((nx / len) * 127),
						Math.round((ny / len) * 127),
						Math.round((nz / len) * 127),
					];
					roomFor();
					const at = vertices * 3;
					for (let v = 0; v < 3; v++)
						for (let x = 0; x < 3; x++) {
							normal[at + v * 3 + x] = n8[x];
							tint[at + v * 3 + x] = Math.max(
								0,
								Math.min(255, Math.round(paint[x] * 255)),
							);
						}
					position[at] = ax; position[at + 1] = ay; position[at + 2] = az;
					position[at + 3] = bx; position[at + 4] = by; position[at + 5] = bz;
					position[at + 6] = cx; position[at + 7] = cy; position[at + 8] = cz;
					vertices += 3;
					if (ax < loX) loX = ax; if (ax > hiX) hiX = ax;
					if (bx < loX) loX = bx; if (bx > hiX) hiX = bx;
					if (cx < loX) loX = cx; if (cx > hiX) hiX = cx;
					if (ay < loY) loY = ay; if (ay > hiY) hiY = ay;
					if (by < loY) loY = by; if (by > hiY) hiY = by;
					if (cy < loY) loY = cy; if (cy > hiY) hiY = cy;
					if (az < loZ) loZ = az; if (az > hiZ) hiZ = az;
					if (bz < loZ) loZ = bz; if (bz > hiZ) hiZ = bz;
					if (cz < loZ) loZ = cz; if (cz > hiZ) hiZ = cz;
				};

				const cap = (c, metres) => {
					const deg = degree[c];
					let mx = 0, my = 0, mz = 0;
					for (let v = 0; v < deg; v++) {
						const p = local(
							corner[c * 18 + v * 3],
							corner[c * 18 + v * 3 + 1],
							corner[c * 18 + v * 3 + 2],
							metres,
						);
						ringX[v] = p[0]; ringY[v] = p[1]; ringZ[v] = p[2];
						mx += p[0] / deg; my += p[1] / deg; mz += p[2] / deg;
					}
					for (let v = 0; v < deg; v++) {
						const b = (v + 1) % deg;
						triangle(mx, my, mz, ringX[v], ringY[v], ringZ[v], ringX[b], ringY[b], ringZ[b]);
					}
				};

				/** One side of a cell, between two heights. */
				const side = (c, edge, high, low) => {
					const deg = degree[c];
					const a = ((edge - 1 + deg) % deg) * 3 + c * 18;
					const b = edge * 3 + c * 18;
					const t1 = local(corner[a], corner[a + 1], corner[a + 2], high);
					const ax = t1[0], ay = t1[1], az = t1[2];
					const t2 = local(corner[b], corner[b + 1], corner[b + 2], high);
					const bx = t2[0], by = t2[1], bz = t2[2];
					const t3 = local(corner[b], corner[b + 1], corner[b + 2], low);
					const cx = t3[0], cy = t3[1], cz = t3[2];
					const t4 = local(corner[a], corner[a + 1], corner[a + 2], low);
					triangle(ax, ay, az, bx, by, bz, cx, cy, cz);
					triangle(ax, ay, az, cx, cy, cz, t4[0], t4[1], t4[2]);
				};

				// ---- the ground ----
				const lip = field.span * 0.05;
				for (let c = 0; c < count; c++) {
					paint = groundTint(height[c]);
					cap(c, top[c]);
					const deg = degree[c];
					for (let e = 0; e < deg; e++) {
						const nb = ring[c * 6 + e];
						const rim = nb < 0;
						const below = rim ? top[c] - lip : top[nb];
						if (below >= top[c] && !(rim && height[c] < TERRAIN.seaLevel)) continue;
						side(c, e, rim && height[c] < TERRAIN.seaLevel ? TERRAIN.seaLevel : top[c], below);
					}
				}
				faces.ground = vertices / 3;
				plantFrom = vertices;

				// ---- everything standing on it ----
				let woodFaces = 0;
				for (let c = 0; c < count; c++) {
					const deg = degree[c];
					const base = c * LAYERS;
					for (let a = 0; a < LAYERS; a++) {
						const what = veg[base + a];
						if (what === EMPTY) continue;
						const from = top[c] + (a - SUNK) * block;
						const to = from + block;
						const kind = owner[base + a];
						const spec = kind > 0 ? field.paints[kind - 1] : null;
						// **A canopy is darker than the grass under it, and it
						// has to be or you cannot see it.** The ground here is
						// the engine's own grass, `0.26, 0.44, 0.19`, and a leaf
						// green sits within a few hundredths of it -- side by
						// side the two read as one surface and a tree disappears
						// into the hillside. Leaves are in their own shade
						// anyway: a cluster is a shell, and almost every cell of
						// it has other leaves over it.
						const shade = what === LEAF ? 0.66 : 1;
						const raw = spec
							? what === WOOD
								? spec.wood
								: spec.leaf
							: [0.36, 0.26, 0.18];
						// A speckle off the cell's own address, so a canopy is
						// not one flat colour and nothing has to be stored.
						const grain =
							0.86 +
							0.28 * hash3(c, a, what, field.seed + 3);
						paint = [
							raw[0] * grain * shade,
							raw[1] * grain * shade,
							raw[2] * grain * shade,
						];
						const before = vertices;
						if (a + 1 >= LAYERS || veg[base + a + 1] === EMPTY) cap(c, to);
						if (a > SUNK && veg[base + a - 1] === EMPTY) cap(c, from);
						for (let e = 0; e < deg; e++) {
							const nb = ring[c * 6 + e];
							if (nb < 0) {
								side(c, e, to, from);
								continue;
							}
							const a2 = a + groundLayer[c] - groundLayer[nb];
							// Under the neighbour's own surface is rock, which
							// the ground pass already drew.
							if (a2 < SUNK) continue;
							if (a2 < LAYERS && veg[nb * LAYERS + a2] !== EMPTY) continue;
							side(c, e, to, from);
						}
						if (what === WOOD) woodFaces += (vertices - before) / 6;
					}
				}
				plantCount = vertices - plantFrom;
				faces.wood = woodFaces;
				faces.leaf = plantCount / 6 - woodFaces;

				// ---- the sea, last, so it blends over what is behind it ----
				waterFrom = vertices;
				paint = SEA_COLOR;
				const sea = field.datum + Math.ceil((TERRAIN.seaLevel - field.datum) / block) * block;
				for (let c = 0; c < count; c++) {
					if (height[c] >= TERRAIN.seaLevel) continue;
					cap(c, sea);
					const deg = degree[c];
					for (let e = 0; e < deg; e++)
						if (ring[c * 6 + e] < 0) side(c, e, sea, top[c]);
				}
				waterCount = vertices - waterFrom;

				groundCount = faces.ground * 3;
				const brow = hiY;
				bounds = {
					// **The highest ground drawn, so an eye framing one plant
					// does not end up inside the hill behind it.** A plant is
					// ten metres and the patch it stands in is a hundred, so the
					// camera pulled in close enough to see the plant sits well
					// below the skyline.
					floor: brow,
					x: (loX + hiX) / 2,
					y: (loY + hiY) / 2,
					z: (loZ + hiZ) / 2,
					reach: Math.sqrt(
						(hiX - loX) ** 2 + (hiY - loY) ** 2 + (hiZ - loZ) ** 2,
					) / 2 || field.span,
				};

				gl.bindVertexArray(vao);
				for (const [buffer, data, wide] of [
					[positionBuffer, position, 3],
					[tintBuffer, tint, 3],
					[normalBuffer, normal, 3],
				]) {
					gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
					gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, vertices * wide), gl.DYNAMIC_DRAW);
				}
				field.vertices = vertices;
			}

			function multiply(a, b) {
				const out = new Float32Array(16);
				for (let c = 0; c < 4; c++)
					for (let r = 0; r < 4; r++) {
						let s = 0;
						for (let i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
						out[c * 4 + r] = s;
					}
				return out;
			}

			function perspective(fov, aspect, near, far) {
				const f = 1 / Math.tan(fov / 2);
				const out = new Float32Array(16);
				out[0] = f / aspect;
				out[5] = f;
				out[10] = (far + near) / (near - far);
				out[11] = -1;
				out[14] = (2 * far * near) / (near - far);
				return out;
			}

			function lookAt(eye, to, upHint) {
				const f = [to[0] - eye[0], to[1] - eye[1], to[2] - eye[2]];
				const fl = Math.sqrt(f[0] ** 2 + f[1] ** 2 + f[2] ** 2) || 1;
				const z = f.map((v) => v / fl);
				let x = cross3(z, upHint);
				const xl = Math.sqrt(x[0] ** 2 + x[1] ** 2 + x[2] ** 2) || 1;
				x = x.map((v) => v / xl);
				const y = cross3(x, z);
				const out = new Float32Array(16);
				out[0] = x[0]; out[4] = x[1]; out[8] = x[2];
				out[1] = y[0]; out[5] = y[1]; out[9] = y[2];
				out[2] = -z[0]; out[6] = -z[1]; out[10] = -z[2];
				out[12] = -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]);
				out[13] = -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]);
				out[14] = z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2];
				out[15] = 1;
				return out;
			}

			const camera = { yaw: -0.7, pitch: 0.35, distance: 1.05, lift: 0 };

			function render() {
				const wide = view.clientWidth;
				const tall = view.clientHeight;
				const dpr = Math.min(2, window.devicePixelRatio || 1);
				view.width = Math.max(1, Math.round(wide * dpr));
				view.height = Math.max(1, Math.round(tall * dpr));
				gl.viewport(0, 0, view.width, view.height);
				gl.clearColor(0.027, 0.039, 0.055, 1);
				gl.enable(gl.DEPTH_TEST);
				gl.disable(gl.CULL_FACE);
				gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
				if (!field) return;
				const reach = bounds.reach;
				const away = reach * 2.4 * camera.distance;
				const eye = [
					bounds.x + Math.cos(camera.pitch) * Math.sin(camera.yaw) * away,
					Math.max(
						bounds.y + Math.sin(camera.pitch) * away + camera.lift * reach,
						bounds.floor + reach * 0.5,
					),
					bounds.z + Math.cos(camera.pitch) * Math.cos(camera.yaw) * away,
				];
				const proj = perspective(
					0.9,
					view.width / Math.max(1, view.height),
					Math.max(0.05, reach * 0.005),
					away + reach * 6,
				);
				const viewProj = multiply(
					proj,
					lookAt(eye, [bounds.x, bounds.y, bounds.z], [0, 1, 0]),
				);
				gl.useProgram(program);
				gl.bindVertexArray(vao);
				gl.uniformMatrix4fv(uViewProj, false, viewProj);
				gl.uniform3f(uSun, 0.42, 0.78, 0.46);
				gl.uniform1i(uWater, 0);
				gl.disable(gl.BLEND);
				gl.depthMask(true);
				gl.drawArrays(gl.TRIANGLES, 0, groundCount + plantCount);
				if (waterCount > 0) {
					gl.uniform1i(uWater, 1);
					gl.enable(gl.BLEND);
					gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
					gl.depthMask(false);
					gl.drawArrays(gl.TRIANGLES, waterFrom, waterCount);
					gl.depthMask(true);
					gl.disable(gl.BLEND);
				}
			}

			// ---------------------------------------------------------------
			// The pictures.
			// ---------------------------------------------------------------

			/**
			 * Every picture on the panel: the ground, and one per layer.
			 *
			 * A shot is a canvas and what to paint into it. The ground shot is
			 * built once with the World section; a layer's is built and thrown
			 * away with its card, so the list is rebuilt whenever the cards
			 * are.
			 */
			const SHOTS = [];

			/** The ground's own colour at one height, banded the way the engine bands. */
			function groundColor(metres) {
				if (metres <= TERRAIN.seaLevel) {
					// How far a look reaches into the water, so a shelf reads as
					// shallow and a trench as deep.
					const deep = Math.min(1, (TERRAIN.seaLevel - metres) / 45);
					return SEA_COLOR.map((c, n) => c * (1 - 0.55 * deep) + 0.03 * n * deep);
				}
				const band =
					metres < GROUND_LINES.rock ? 1 : metres < GROUND_LINES.snow ? 2 : 3;
				// A contour every hundred metres, so a slope reads as a slope
				// rather than as one flat sheet of the block that stands on it.
				const into = ((metres / 100) % 1) * 100;
				const edge = into < 6 ? 0.78 : 1;
				return BAND_COLORS[band].map((c) => c * edge);
			}

			/**
			 * The direction a pixel of a picture is looking at.
			 *
			 * Over the planet it is longitude across and latitude down, the one
			 * projection where a direction is two cosines and no case analysis.
			 * Over the patch it is the exponential map out of the patch's own
			 * frame, so metres out from the middle become radians of arc and the
			 * picture keeps its scale to the corners.
			 */
			function pictureDirection(q, r, wide, tall, frame, half, radius) {
				if (!frame) {
					const lat = (0.5 - (r + 0.5) / tall) * Math.PI;
					const lon = ((q + 0.5) / wide) * 2 * Math.PI - Math.PI;
					const ring = Math.cos(lat);
					return [ring * Math.cos(lon), Math.sin(lat), ring * Math.sin(lon)];
				}
				const u = (((q + 0.5) / wide) * 2 - 1) * (half / radius);
				const v = (1 - ((r + 0.5) / tall) * 2) * (half / radius);
				const a = Math.sqrt(u * u + v * v);
				if (a < 1e-12) return frame.up;
				const c = Math.cos(a);
				const sn = Math.sin(a) / a;
				return normalize3([
					frame.up[0] * c + (frame.east[0] * u + frame.north[0] * v) * sn,
					frame.up[1] * c + (frame.east[1] * u + frame.north[1] * v) * sn,
					frame.up[2] * c + (frame.east[2] * u + frame.north[2] * v) * sn,
				]);
			}

			/**
			 * Paint some or all of the pictures.
			 *
			 * **One sampling pass, however many are wanted.** Every picture is a
			 * function of the same direction, so drawing the ground and four
			 * layers costs one walk over the pixels plus the writing. `only`
			 * narrows it to a single picture at a size of its own, which is what
			 * the enlarged view asks for.
			 */
			function paintShots(shots, wide, tall, canvas = null) {
				if (!field || shots.length === 0) return;
				const planet = knobs.show === "planet";
				const k = field.k;
				const ground = terrainSettings(k.radius);
				const noiseOf = shots.map((shot) =>
					shot.layer ? layerSettings(shot.layer, k.radius) : null,
				);
				const raw = knobs.layerPicture === "noise";
				const g0 = canvas ? bigCtx : shots[0].ctx;
				const images = shots.map(() => g0.createImageData(wide, tall));
				const frame = planet ? null : field.frame;
				const half = field.span / 2;
				for (let r = 0; r < tall; r++)
					for (let q = 0; q < wide; q++) {
						const p = pictureDirection(q, r, wide, tall, frame, half, k.radius);
						const at = (r * wide + q) * 4;
						for (let n = 0; n < shots.length; n++) {
							const shot = shots[n];
							let c;
							if (!shot.layer) {
								c = groundColor(mapHeightAt(p, field.seed, ground));
							} else if (raw) {
								// **The reading itself, in grey.** A curve is
								// drawn against a field and cannot be drawn
								// against a picture the curve has already been
								// applied to: past the ends of a curve every
								// value is one colour, which is exactly where a
								// reader needs to see whether there is anything
								// out there. No sea mask, because the field has a
								// value everywhere and mixing two signals into
								// one grey ramp would make neither readable.
								const said = octaveNoise(
									p[0], p[1], p[2],
									field.seed + saltOf(shot.layer),
									noiseOf[n],
								);
								const lit = 0.5 + said * 0.5;
								c = [lit, lit, lit];
							} else {
								// **What it would plant**, which is the field read
								// through the curve: black where nothing grows and
								// the layer's own leaf colour where it is
								// densest, with the sea left black because
								// nothing grows in it.
								const share = layerShareAt(
									shot.layer,
									p[0], p[1], p[2],
									field.seed,
									noiseOf[n],
								);
								const dry =
									mapHeightAt(p, field.seed, ground) <= TERRAIN.seaLevel;
								const lit = dry ? 0 : share;
								c = shot.layer.leaf.map((v) => 0.045 + v * lit * 1.6);
							}
							const px = images[n].data;
							px[at] = Math.min(255, c[0] * 255);
							px[at + 1] = Math.min(255, c[1] * 255);
							px[at + 2] = Math.min(255, c[2] * 255);
							px[at + 3] = 255;
						}
					}
				for (let n = 0; n < shots.length; n++) {
					const g = canvas ? bigCtx : shots[n].ctx;
					g.putImageData(images[n], 0, 0);
					if (planet) outlinePatch(g, wide, tall);
				}
			}

			/** Where the patch is standing, drawn on a picture of the planet. */
			function outlinePatch(g, wide, tall) {
				const k = field.k;
				const lat = (knobs.latitude * Math.PI) / 180;
				const across = field.span / k.radius / Math.max(0.15, Math.cos(lat));
				const down = field.span / k.radius;
				const box = {
					x:
						((knobs.longitude + 180) / 360) * wide -
						(across / (4 * Math.PI)) * wide,
					y: (0.5 - knobs.latitude / 180) * tall - (down / (2 * Math.PI)) * tall,
					w: Math.max(3, (across / (2 * Math.PI)) * wide),
					h: Math.max(3, (down / Math.PI) * tall),
				};
				g.strokeStyle = "rgba(255, 90, 90, 0.95)";
				g.lineWidth = 1;
				g.strokeRect(box.x - 0.5, box.y - 0.5, box.w + 1, box.h + 1);
			}

			function drawPictures() {
				if (!field) return;
				const ready = SHOTS.filter((shot) => shot.ctx);
				if (ready.length === 0) return;
				for (const shot of ready)
					if (shot.badge)
						shot.badge.textContent = `${shot.layer.species} · ${knobs.layerPicture}`;
				// Half the samples while a knob is moving, for the same reason
				// the patch draws fewer cells: a picture that arrives after the
				// finger has stopped is not a picture of the knob.
				const wide = field.draft ? 156 : 312;
				paintShots(ready, wide, knobs.show === "planet" ? wide / 2 : wide);
				if (!field.draft && !big.hidden && bigShown) drawBig(bigShown);
			}

			// ---------------------------------------------------------------
			// The enlarged picture.
			// ---------------------------------------------------------------

			const big = document.getElementById("big");
			const bigCanvas = document.getElementById("bigShot");
			const bigCtx = bigCanvas.getContext("2d");
			const bigName = document.getElementById("bigName");
			let bigShown = null;

			/**
			 * One picture, large.
			 *
			 * **A field at panel width says where its features are; at this size
			 * it says what they look like.** Whether a stand of pine reads as a
			 * belt along a coast or as noise is a question 312 pixels cannot
			 * answer.
			 */
			function drawBig(shot) {
				if (!field) return;
				bigShown = shot;
				const planet = knobs.show === "planet";
				const wide = planet ? 1024 : 720;
				const tall = planet ? wide / 2 : wide;
				bigCanvas.width = wide;
				bigCanvas.height = tall;
				bigName.textContent = `${shot.name}${
					shot.layer ? ` · ${knobs.layerPicture}` : ""
				} · ${
					planet
						? "the whole planet"
						: `${Math.round(field.span).toLocaleString()} m of ground`
				}`;
				big.hidden = false;
				paintShots([shot], wide, tall, bigCanvas);
			}

			function closeBig() {
				big.hidden = true;
				bigShown = null;
			}
			big.addEventListener("click", closeBig);
			window.addEventListener("keydown", (e) => {
				if (e.key === "Escape") {
					closeBig();
					pick.hidden = true;
				}
			});

			/**
			 * **A latitude and a longitude are a place, and two sliders are not
			 * a way to look for one.** Clicking a picture of the planet puts the
			 * patch where the finger went: the projection is longitude across
			 * and latitude down, so it inverts to two divisions. Over the patch
			 * there is nowhere to jump to, so a click enlarges instead.
			 */
			function watchShot(shot) {
				shot.canvas.addEventListener("click", (e) => {
					if (knobs.show !== "planet") return drawBig(shot);
					const box = shot.canvas.getBoundingClientRect();
					const across = (e.clientX - box.left) / box.width;
					const down = (e.clientY - box.top) / box.height;
					const row = ROWS.get("latitude");
					knobs.longitude = Math.round(across * 360 - 180);
					knobs.latitude = Math.max(
						row.low,
						Math.min(row.high, Math.round((0.5 - down) * 180)),
					);
					askForRedraw(false);
				});
				// Over the planet a click already means "go there", so the large
				// view is on a second button rather than fighting it.
				shot.canvas.addEventListener("contextmenu", (e) => {
					e.preventDefault();
					drawBig(shot);
				});
				shot.canvas.title =
					"click to enlarge, or to move the patch while the pictures show " +
					"the planet (right-click always enlarges)";
			}

			// ---------------------------------------------------------------
			// The curve.
			// ---------------------------------------------------------------

			/**
			 * A draggable curve over one layer's own points.
			 *
			 * The points come from a getter rather than a key, because a layer
			 * is a thing that can be deleted while its canvas is still on
			 * screen -- a key into a global draft could not say which layer.
			 */
			function makeCurve(canvas, layer, onChange) {
				const g = canvas.getContext("2d");
				const pad = 6;
				const toX = (v) => pad + ((v + 1) / 2) * (canvas.width - pad * 2);
				const toY = (v) => canvas.height - pad - v * (canvas.height - pad * 2);
				const fromX = (px) => ((px - pad) / (canvas.width - pad * 2)) * 2 - 1;
				const fromY = (py) =>
					(canvas.height - pad - py) / (canvas.height - pad * 2);

				function draw() {
					const points = layer.curve;
					g.fillStyle = "#0b0e13";
					g.fillRect(0, 0, canvas.width, canvas.height);
					// **The bars are what makes x mean anything.** A field's
					// range is -1 to +1 and it reaches nowhere near either end,
					// so where the bars pile up is the part of the curve that
					// governs most of the land -- and a stretch of curve with no
					// bars under it is a rule for ground nobody will ever stand
					// on. Behind the curve rather than under it, so the two
					// share an x axis exactly and a reader never has to line up
					// two pictures by eye.
					const tally = layer.tally;
					if (tally && tally.tallest > 0) {
						g.fillStyle = "rgba(255, 255, 255, 0.13)";
						const wide = (canvas.width - pad * 2) / TALLY_BINS;
						for (let n = 0; n < TALLY_BINS; n++) {
							const tall =
								(tally.counts[n] / tally.tallest) * (canvas.height - pad * 2);
							if (tall <= 0) continue;
							g.fillRect(
								pad + n * wide,
								canvas.height - pad - tall,
								Math.max(1, wide - 0.5),
								tall,
							);
						}
					}
					g.strokeStyle = "#232b36";
					g.beginPath();
					g.moveTo(toX(0), pad);
					g.lineTo(toX(0), canvas.height - pad);
					g.stroke();
					g.strokeStyle = inkOf(layer.leaf);
					g.lineWidth = 1.5;
					g.beginPath();
					for (let px = pad; px <= canvas.width - pad; px++) {
						const y = toY(splineAt(points, fromX(px)));
						if (px === pad) g.moveTo(px, y);
						else g.lineTo(px, y);
					}
					g.stroke();
					g.fillStyle = "#e8ecf2";
					for (const [x, y] of points) {
						g.beginPath();
						g.arc(toX(x), toY(y), 3, 0, Math.PI * 2);
						g.fill();
					}
				}

				let dragging = -1;
				const spot = (e) => {
					const box = canvas.getBoundingClientRect();
					return [
						((e.clientX - box.left) / box.width) * canvas.width,
						((e.clientY - box.top) / box.height) * canvas.height,
					];
				};
				const nearest = (px, py) => {
					const points = layer.curve;
					let best = -1;
					let far = 12;
					for (let n = 0; n < points.length; n++) {
						const dx = toX(points[n][0]) - px;
						const dy = toY(points[n][1]) - py;
						const d = Math.sqrt(dx * dx + dy * dy);
						if (d < far) {
							far = d;
							best = n;
						}
					}
					return best;
				};
				canvas.addEventListener("pointerdown", (e) => {
					e.preventDefault();
					const [px, py] = spot(e);
					const at = nearest(px, py);
					const points = layer.curve;
					if (at >= 0 && e.shiftKey) {
						// Never below two, or the curve stops being a curve.
						if (points.length > 2 && at > 0 && at < points.length - 1) {
							points.splice(at, 1);
							draw();
							onChange();
						}
						return;
					}
					if (at >= 0) {
						dragging = at;
					} else {
						const x = Math.max(-1, Math.min(1, fromX(px)));
						const y = Math.max(0, Math.min(1, fromY(py)));
						points.push([x, y]);
						points.sort((a, b) => a[0] - b[0]);
						dragging = points.findIndex((p) => p[0] === x && p[1] === y);
						draw();
						onChange();
					}
					canvas.setPointerCapture(e.pointerId);
				});
				canvas.addEventListener("pointermove", (e) => {
					if (dragging < 0) return;
					const points = layer.curve;
					const [px, py] = spot(e);
					const first = dragging === 0;
					const last = dragging === points.length - 1;
					// The ends hold their x, so the curve always covers the whole
					// range and nothing has to guess what happens past it.
					if (!first && !last)
						points[dragging][0] = Math.max(
							points[dragging - 1][0] + 0.01,
							Math.min(points[dragging + 1][0] - 0.01, fromX(px)),
						);
					points[dragging][1] = Math.max(0, Math.min(1, fromY(py)));
					draw();
					onChange();
				});
				const drop = () => {
					dragging = -1;
				};
				canvas.addEventListener("pointerup", drop);
				canvas.addEventListener("pointercancel", drop);
				return draw;
			}

			// ---------------------------------------------------------------
			// The panel.
			// ---------------------------------------------------------------

			/**
			 * The whole draft as a query string.
			 *
			 * **A layer travels as one parameter.** Named `v1`, `v2` and so on,
			 * holding the species, then every row that has moved off its
			 * default, then the curve -- so a link carries a stand of three
			 * species and a reader can still see which is which.
			 */
			function toParams() {
				const p = new URLSearchParams();
				for (const [key, row] of ROWS) {
					if (row.type === "picture") continue;
					if (row.type === "check") {
						if (knobs[key] !== row.value) p.set(key, knobs[key] ? "1" : "0");
						continue;
					}
					if (knobs[key] !== row.value) p.set(key, String(knobs[key]));
				}
				// **How many layers there are is written even when there are
				// none.** Without it a link that says nothing about layers and
				// a link that says *there are no layers* are the same string,
				// so deleting the last one and reloading brings both openers
				// back -- an edit the page forgets is worse than one it
				// refuses.
				p.set("nv", String(layers.length));
				layers.forEach((layer, n) => {
					const parts = [layer.species];
					if (!layer.on) parts.push("off");
					const preset = PRESETS[layer.species] ?? CUSTOM;
					for (const [key, row] of LAYER_ROWS) {
						if (row.type === "spline" || row.type === "picture") continue;
						const start = SHAPE_KEYS.includes(key)
							? preset[key]
							: key === "useLeaves"
								? preset.leaves
								: row.value;
						if (layer.values[key] === start) continue;
						parts.push(
							`${key}=${
								typeof layer.values[key] === "boolean"
									? layer.values[key] ? 1 : 0
									: layer.values[key]
							}`,
						);
					}
					parts.push(`curve=${splineToText(layer.curve)}`);
					p.set(`v${n + 1}`, parts.join("|"));
				});
				return p;
			}

			function fromParams(params) {
				for (const [key, row] of ROWS) {
					const raw = params.get(key);
					if (raw === null) continue;
					if (row.type === "check") knobs[key] = raw === "1";
					else if (row.type === "text" || row.type === "select") knobs[key] = raw;
					else if (Number.isFinite(Number(raw))) knobs[key] = Number(raw);
				}
				const said = params.get("nv");
				const wanted = said === null ? -1 : Number(said);
				const found = [];
				for (let n = 1; ; n++) {
					const raw = params.get(`v${n}`);
					if (raw === null) break;
					const parts = raw.split("|");
					const layer = makeLayer(
						PRESETS[parts[0]] ? parts[0] : "Custom",
					);
					for (const part of parts.slice(1)) {
						if (part === "off") {
							layer.on = false;
							continue;
						}
						const cut = part.indexOf("=");
						if (cut < 0) continue;
						const key = part.slice(0, cut);
						const text = part.slice(cut + 1);
						if (key === "curve") {
							const points = splineFromText(text);
							if (points) layer.curve = points;
							continue;
						}
						const row = LAYER_ROWS.get(key);
						if (!row) continue;
						if (row.switch) layer.values[key] = text === "1";
						else if (Number.isFinite(Number(text)))
							// **A link could otherwise build what a slider cannot
							// reach.** The world rows have `settle` for this; a
							// layer's ends do not move with the draft, so
							// clamping them here is the whole of it.
							layer.values[key] = Math.max(
								row.low,
								Math.min(row.high, Number(text)),
							);
					}
					found.push(layer);
				}
				if (wanted >= 0 || found.length) {
					layers.length = 0;
					layers.push(...found);
				}
				// **A link could otherwise build what a slider cannot reach**, so
				// the draft settles here as well as after every move.
				settle();
			}

			function writeUrl() {
				const p = toParams();
				const url = p.toString()
					? location.pathname + "?" + p.toString()
					: location.pathname;
				history.replaceState(null, "", url);
			}

			/** One slider, checkbox, dropdown or text field, over any draft. */
			function makeRow(row, read, write, host, context) {
				const wrap = document.createElement("div");
				const label = document.createElement("label");
				label.textContent = row.label;
				let input;
				wrap.className = "knob";
				if (row.type === "select") {
					input = document.createElement("select");
					for (const option of row.options) {
						const o = document.createElement("option");
						o.value = option;
						o.textContent = option;
						input.append(o);
					}
					input.value = read();
				} else if (row.type === "text") {
					input = document.createElement("input");
					input.type = "text";
					input.value = read();
				} else if (row.type === "check") {
					wrap.className = "knob check";
					input = document.createElement("input");
					input.type = "checkbox";
					input.checked = read();
				} else {
					input = document.createElement("input");
					input.type = "range";
					input.min = row.low;
					input.max = row.high;
					input.step = row.step;
					input.value = read();
				}
				const readout = document.createElement("output");
				if (row.type === "check") wrap.append(input, label);
				else wrap.append(label, readout, input);
				let note = null;
				if (row.note) {
					note = document.createElement("p");
					note.className = "knob-note";
					wrap.append(note);
				}
				host.append(wrap);
				input.addEventListener("input", () => {
					if (row.type === "check") write(input.checked);
					else if (row.type === "select" || row.type === "text")
						write(input.value);
					else write(Number(input.value));
					askForRedraw();
				});
				return { row, wrap, input, readout, note, read, context };
			}

			function buildPanel() {
				const hostWorld = document.getElementById("knobsWorld");
				const hostPlants = document.getElementById("knobsPlants");
				for (const group of KNOBS) {
					const set = document.createElement("details");
					set.className = "group" + (group.tint ? " " + group.tint : "");
					set.open = group.open !== false;
					const legend = document.createElement("summary");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						if (row.type === "picture") {
							const wrap = document.createElement("div");
							wrap.className = "knob pictured";
							const holder = document.createElement("div");
							holder.className = "shot out";
							const shot = {
								key: row.key,
								name: "Ground",
								layer: null,
								canvas: document.createElement("canvas"),
							};
							shot.ctx = shot.canvas.getContext("2d");
							const name = document.createElement("b");
							name.textContent = shot.name;
							holder.append(shot.canvas, name);
							wrap.append(holder);
							set.append(wrap);
							SHOTS.push(shot);
							watchShot(shot);
							continue;
						}
						const made = makeRow(
							row,
							() => knobs[row.key],
							(value) => {
								knobs[row.key] = value;
							},
							set,
							null,
						);
						rows.set(row.key, made);
					}
					(group.panel === "plants" ? hostPlants : hostWorld).append(set);
				}
				buildLayers();
			}

			/** Every row of every layer card, rebuilt whenever the cards are. */
			const layerRowsShown = [];

			/**
			 * The layer cards, from scratch.
			 *
			 * **Rebuilt whole rather than patched.** A card holds a canvas, a
			 * curve editor with a pointer capture on it and four sections; the
			 * list changes only when a person adds or drops a layer, which is
			 * rare and never inside a frame, so there is nothing to be gained
			 * by working out which card moved.
			 */
			function buildLayers() {
				const host = document.getElementById("layers");
				host.textContent = "";
				layerRowsShown.length = 0;
				// The ground shot stays; every layer's goes with its card.
				for (let n = SHOTS.length - 1; n >= 0; n--)
					if (SHOTS[n].layer) SHOTS.splice(n, 1);
				for (const layer of layers) {
					const card = document.createElement("details");
					card.className = "layer";
					card.open = layer.open;
					card.addEventListener("toggle", () => {
						layer.open = card.open;
					});
					const head = document.createElement("summary");
					const chip = document.createElement("span");
					chip.className = "chip";
					// The card wears the leaf over the wood, which is what a
					// plant shows most of.
					chip.style.background = inkOf(layer.leaf);
					chip.style.boxShadow = `inset 0 0 0 2px ${inkOf(layer.wood)}`;
					const title = document.createElement("span");
					title.textContent = layer.species;
					const grown = document.createElement("span");
					grown.className = "grown";
					const off = document.createElement("input");
					off.type = "checkbox";
					off.className = "switch";
					off.checked = layer.on;
					off.title = "grow this layer";
					off.addEventListener("click", (e) => e.stopPropagation());
					off.addEventListener("input", () => {
						layer.on = off.checked;
						card.classList.toggle("off", !layer.on);
						askForRedraw(false);
					});
					const drop = document.createElement("button");
					drop.type = "button";
					drop.className = "drop";
					drop.textContent = "✕";
					drop.title = "remove this layer";
					drop.addEventListener("click", (e) => {
						e.stopPropagation();
						e.preventDefault();
						layers.splice(layers.indexOf(layer), 1);
						buildLayers();
						askForRedraw(false);
					});
					head.append(off, chip, title, grown, drop);
					card.classList.toggle("off", !layer.on);
					card.append(head);
					const body = document.createElement("div");
					body.className = "body";
					card.append(body);

					// **The species dropdown is a template, not an identity.**
					// Picking one writes its numbers into the rows below and
					// they stay editable, so two layers of `Oak` that have been
					// dragged apart are two different trees.
					const speciesRow = makeRow(
						{
							key: "species",
							label: "Species",
							type: "select",
							options: PRESET_NAMES,
							note: () =>
								"a template for the rows below · they stay editable, so " +
								"two layers of one species can be two different plants",
						},
						() => layer.species,
						(value) => {
							applySpecies(layer, value);
							buildLayers();
						},
						body,
						layer,
					);
					layerRowsShown.push(speciesRow);

					for (const part of LAYER_SECTIONS) {
						const set = document.createElement("details");
						set.className = "sub";
						set.open = part.open !== false;
						const legend = document.createElement("summary");
						legend.append(document.createTextNode(part.name));
						set.append(legend);
						for (const row of part.rows) {
							if (row.switch) {
								const box = document.createElement("input");
								box.type = "checkbox";
								box.className = "switch";
								box.checked = layer.values[row.key];
								box.title = row.title ?? "";
								box.addEventListener("click", (e) => e.stopPropagation());
								box.addEventListener("input", () => {
									layer.values[row.key] = box.checked;
									askForRedraw(false);
								});
								legend.prepend(box);
								layerRowsShown.push({
									row, wrap: set, input: box, context: layer, switchOf: true,
								});
								continue;
							}
							if (row.type === "picture") {
								const wrap = document.createElement("div");
								wrap.className = "knob pictured";
								const holder = document.createElement("div");
								holder.className = "shot leaf";
								const shot = {
									key: `layer${layer.id}`,
									name: layer.species,
									layer,
									canvas: document.createElement("canvas"),
								};
								shot.ctx = shot.canvas.getContext("2d");
								const name = document.createElement("b");
								name.textContent = layer.species;
								name.style.background = inkOf(layer.leaf);
								shot.badge = name;
								holder.append(shot.canvas, name);
								wrap.append(holder);
								set.append(wrap);
								SHOTS.push(shot);
								watchShot(shot);
								continue;
							}
							if (row.type === "spline") {
								const wrap = document.createElement("div");
								wrap.className = "knob curved";
								const label = document.createElement("label");
								label.textContent = row.label;
								const canvas = document.createElement("canvas");
								canvas.width = 300;
								canvas.height = 96;
								canvas.className = "curve";
								const axis = document.createElement("div");
								axis.className = "axis";
								const line = document.createElement("div");
								line.textContent =
									"x: the layer's own noise, −1 to +1 · " +
									"y: how much of Density this place takes";
								const bars = document.createElement("div");
								axis.append(line, bars);
								const help = document.createElement("p");
								help.className = "curve-help";
								help.textContent =
									"drag a point · click the curve to add one · " +
									"shift-click a point to remove it";
								wrap.append(label, canvas, axis, help);
								set.append(wrap);
								const redraw = makeCurve(canvas, layer, () => askForRedraw());
								layerRowsShown.push({ row, wrap, redraw, bars, context: layer });
								continue;
							}
							layerRowsShown.push(
								makeRow(
									row,
									() => layer.values[row.key],
									(value) => {
										layer.values[row.key] = value;
									},
									set,
									layer,
								),
							);
						}
						body.append(set);
						layer.sections ??= {};
						if (part.on) layer.sections[part.on] = set;
					}
					layer.head = { grown, card };
					host.append(card);
				}
			}

			// ---------------------------------------------------------------
			// Adding a layer.
			// ---------------------------------------------------------------

			const pick = document.getElementById("pick");
			const pickList = document.getElementById("pickList");
			for (const name of PRESET_NAMES) {
				const button = document.createElement("button");
				button.type = "button";
				const chip = document.createElement("span");
				chip.className = "chip";
				chip.style.background = inkOf(PRESETS[name].leaf);
				chip.style.boxShadow = `inset 0 0 0 2px ${inkOf(PRESETS[name].wood)}`;
				button.append(chip, document.createTextNode(name));
				button.addEventListener("click", () => {
					pick.hidden = true;
					layers.push(makeLayer(name));
					buildLayers();
					askForRedraw(false);
				});
				pickList.append(button);
			}
			pick.addEventListener("click", (e) => {
				if (e.target === pick) pick.hidden = true;
			});
			document.getElementById("addLayer").addEventListener("click", () => {
				pick.hidden = false;
			});

			// ---------------------------------------------------------------
			// Keeping the panel in step.
			// ---------------------------------------------------------------

			/** One built row brought back in line with the draft it edits. */
			function freshen(made) {
				const { row, wrap, readout, input, note, context, redraw } = made;
				if (made.switchOf) {
					input.checked = context.values[row.key];
					input.disabled = row.disabledWhen ? row.disabledWhen(context) : false;
					wrap.classList.toggle(
						"off",
						!context.values[row.key] || input.disabled,
					);
					return;
				}
				if (redraw) {
					redraw();
					// **An unlabelled histogram is a shape, not a
					// measurement.** How much land it counts is what says
					// whether a hump at the left is a continent's worth of
					// ground or a rounding error.
					const tally = context.tally;
					made.bars.textContent = tally
						? `bars: how much of the planet's ${tally.land.toLocaleString()} ` +
							`land cells read each value`
						: "bars: the layer is off, so nothing is counted";
					return;
				}
				// **A row with no meaning comes off the panel, it is not greyed
				// out** -- a disabled row is a question the reader has to answer
				// before dismissing.
				if (row.shownWhen) wrap.hidden = !row.shownWhen(context);
				if (row.type === "check") {
					input.checked = made.read();
					readout.textContent = "";
				} else if (row.type === "select" || row.type === "text") {
					input.value = made.read();
					readout.textContent = "";
				} else {
					const live = liveRange(row);
					input.min = live.low;
					input.max = live.high;
					input.value = made.read();
					readout.textContent =
						Number(made.read()).toFixed(row.digits ?? 2) +
						(row.unit ? " " + row.unit : "");
				}
				if (note) note.innerHTML = row.note(context);
			}

			function refreshPanel() {
				for (const made of rows.values()) freshen(made);
				for (const made of layerRowsShown) freshen(made);
				for (const layer of layers)
					if (layer.head)
						layer.head.grown.textContent = layer.grown
							? `${layer.grown.toLocaleString()} plants`
							: "none";
				drawPictures();
				if (!field) return;
				const solid =
					field.woodCells + (knobs.leavesCollide ? field.leafCells : 0);
				document.getElementById("recipe").innerHTML =
					`<i class="c">${field.trees.toLocaleString()}</i> plants · ` +
					`<i class="c">${field.woodCells.toLocaleString()}</i> wood + ` +
					`<i class="e">${field.leafCells.toLocaleString()}</i> leaf cells · ` +
					`<i class="p">${field.pieces.toLocaleString()}</i> pieces, ` +
					`<i class="p">${(100 * field.rooted).toFixed(1)}%</i> rooted`;
				document.getElementById("facts").innerHTML =
					`patch <b>${Math.round(field.span).toLocaleString()} m</b> across, ` +
					`<b>${field.count.toLocaleString()}</b> hexagons · ` +
					`ground <b>${Math.round(field.lowest)}</b> to ` +
					`<b>${Math.round(field.highest)} m</b> · ` +
					`<b>${solid.toLocaleString()}</b> cells you would walk into · ` +
					`<b>${field.chunkCount.toLocaleString()}</b> chunks · ` +
					`<b>${Math.round(cost)} ms</b>`;
			}

			// ---------------------------------------------------------------
			// Boot.
			// ---------------------------------------------------------------

			let pending = false;
			let settleTimer = 0;
			function askForRedraw(draft = true) {
				clearTimeout(settleTimer);
				if (draft) settleTimer = setTimeout(() => askForRedraw(false), 220);
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					settle();
					generate(draft ? Math.max(24, knobs.cells >> 1) : knobs.cells);
					buildMesh();
					cost = performance.now() - started;
					refreshPanel();
					if (!draft) writeUrl();
					render();
				});
			}

			// The knobs open and shut on a phone; on a desktop the buttons are
			// not on the page at all and this never runs. Two drawers, two
			// buttons, each answering for its own -- opening one never closes
			// the other.
			const drawer = (buttonId, bodyClass, label) => {
				const button = document.getElementById(buttonId);
				button.addEventListener("click", () => {
					const open = document.body.classList.toggle(bodyClass);
					button.setAttribute("aria-expanded", String(open));
					button.textContent = open ? "Close" : label;
				});
			};
			drawer("toggleWorld", "knobs", "World");
			drawer("togglePlants", "plants", "Plants");

			let dragging = null;
			view.addEventListener("pointerdown", (e) => {
				dragging = { x: e.clientX, y: e.clientY, shift: e.shiftKey };
				view.setPointerCapture(e.pointerId);
			});
			view.addEventListener("pointermove", (e) => {
				if (!dragging) return;
				const dx = e.clientX - dragging.x;
				const dy = e.clientY - dragging.y;
				dragging.x = e.clientX;
				dragging.y = e.clientY;
				if (dragging.shift) camera.lift += dy * 0.002;
				else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(-0.2, Math.min(1.5, camera.pitch + dy * 0.005));
				}
				render();
			});
			const stop = () => {
				dragging = null;
			};
			view.addEventListener("pointerup", stop);
			view.addEventListener("pointercancel", stop);
			view.addEventListener(
				"wheel",
				(e) => {
					e.preventDefault();
					camera.distance = Math.max(
						0.05,
						Math.min(6, camera.distance * Math.exp(e.deltaY * 0.001)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", render);

			/**
			 * What a page with no link in it opens with.
			 *
			 * **Two layers, because one proves nothing.** A single layer is a
			 * density with a curve on it and could as well have been a slider;
			 * two say what the arrangement is for -- a pine belt and an oak
			 * wood, each with its own field, its own curve and its own shape,
			 * meeting wherever their curves both allow. The curves are drawn to
			 * put them in different places rather than left flat, or the opening
			 * view is two species evenly mixed over the whole planet, which is
			 * the one picture that makes layers look like a longer way of
			 * writing `Mixed stand`.
			 */
			function openingLayers() {
				const pine = makeLayer("Pine");
				pine.values.density = 2.5;
				pine.values.feature = 260;
				pine.values.featureScale = 5;
				// High ground and the far side of the field: a belt rather than
				// a scatter.
				pine.curve = [
					[-1, 0],
					[-0.05, 0],
					[0.35, 1],
					[1, 1],
				];
				const oak = makeLayer("Oak");
				oak.values.density = 1.6;
				oak.values.feature = 380;
				oak.values.featureScale = 4;
				oak.curve = [
					[-1, 1],
					[-0.2, 0.85],
					[0.2, 0],
					[1, 0],
				];
				layers.push(pine, oak);
			}
			openingLayers();
			fromParams(new URLSearchParams(location.search));
			buildPanel();
			const booted = performance.now();
			settle();
			generate();
			buildMesh();
			cost = performance.now() - booted;
			refreshPanel();
			render();
		</script>
	</body>
</html>
