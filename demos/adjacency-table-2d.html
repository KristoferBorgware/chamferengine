<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The adjacency table, unfolded</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0e14; color:#e6e8ee; min-height:100vh; padding:16px 15px 30px; }
  h1 { font-size:17px; font-weight:650; }
  .sub { font-size:12.5px; color:#8b93a7; margin:3px 0 12px; line-height:1.5; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; }
  .bar { display:flex; gap:6px; align-items:center; margin:12px 0 4px; flex-wrap:wrap; }
  button { font:inherit; font-size:12.5px; font-weight:550; padding:8px 12px; border-radius:8px;
           cursor:pointer; background:#1a2130; color:#dfe3ec; border:1px solid #2a3245; }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
  button:active { transform:scale(.97); }
  .fnum { font-size:15px; font-weight:700; color:#4f8ef7; font-variant-numeric:tabular-nums;
          min-width:78px; text-align:center; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:12px;
          font-variant-numeric:tabular-nums; }
  th { text-align:left; font-size:10px; color:#6d768c; text-transform:uppercase;
       letter-spacing:.05em; font-weight:600; padding-bottom:6px; }
  td { padding:7px 0; border-top:1px solid #182032; color:#c2c9d8; }
  tr.sel td { color:#fff; font-weight:650; background:#131b2a; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px; vertical-align:-1px; }
  .msg { font-size:12.5px; color:#a9b2c6; line-height:1.6; margin-top:13px;
         background:#101725; border:1px solid #223049; border-radius:10px; padding:12px 13px; }
  .msg b { color:#fff; } .msg .hi { color:#ffd166; }
  mono { font-family:ui-monospace,Menlo,monospace; }
</style>
</head>
<body>

<h1>The adjacency table, unfolded</h1>
<div class="sub">One face flat, with its three neighbours folded out. Tap an edge.</div>

<svg id="svg" viewBox="-15 -15 390 350"></svg>

<div class="bar">
  <button id="prev">‹</button>
  <div class="fnum" id="fnum">face 0</div>
  <button id="next">›</button>
  <button id="rand" style="margin-left:auto">Random</button>
</div>

<table>
  <thead><tr><th>Edge</th><th>Leads to</th><th>Arrives on</th><th>Winding</th></tr></thead>
  <tbody id="tbl"></tbody>
</table>

<div class="msg" id="msg"></div>

<script>
const F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
         [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
const TABLE = F.map((f,fi)=>[0,1,2].map(e=>{
  const a=f[e], b=f[(e+1)%3];
  for (let g=0; g<20; g++){ if (g===fi) continue;
    for (let e2=0; e2<3; e2++){
      const c=F[g][e2], d=F[g][(e2+1)%3];
      if ((a===c&&b===d)||(a===d&&b===c)) return {face:g, edge:e2, rev:(a===d&&b===c)?1:0};
    }}
}));

const COL = ['#4f8ef7','#3fb8af','#e0913a','#a56cf0'];
const S = 168, HH = Math.sqrt(3)/2, N = 4;
let face = 0, sel = 0;

const sub=(a,b)=>[a[0]-b[0], a[1]-b[1]];
const add=(a,b)=>[a[0]+b[0], a[1]+b[1]];
const mul=(a,s)=>[a[0]*s, a[1]*s];
function reflect(P, A, B){
  const d = sub(B,A), L = d[0]*d[0]+d[1]*d[1];
  const t = ((P[0]-A[0])*d[0] + (P[1]-A[1])*d[1]) / L;
  const foot = add(A, mul(d,t));
  return [2*foot[0]-P[0], 2*foot[1]-P[1]];
}
// solve P = P0 + (P1-P0)*i/N + (P2-P0)*j/N
function localIJ(P, T){
  const u = sub(T[1],T[0]), v = sub(T[2],T[0]), w = sub(P,T[0]);
  const det = u[0]*v[1] - u[1]*v[0];
  const a = (w[0]*v[1] - w[1]*v[0]) / det;
  const b = (u[0]*w[1] - u[1]*w[0]) / det;
  return [Math.round(a*N), Math.round(b*N)];
}
const lat = (T,i,j) => add(T[0], add(mul(sub(T[1],T[0]), i/N), mul(sub(T[2],T[0]), j/N)));
const pts = p => p.map(q=>q.map(n=>n.toFixed(1)).join(',')).join(' ');

function draw(){
  // centre triangle: v0,v1,v2 in the face's own order
  const A=[92,S*HH+8], B=[92+S, S*HH+8], Cc=[92+S/2, 8];
  const T0=[A,B,Cc];

  let s = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5"
    markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>`;

  const flaps = [0,1,2].map(e=>{
    const a=T0[e], b=T0[(e+1)%3], apex=T0[(e+2)%3];
    const R = reflect(apex, a, b);
    const link = TABLE[face][e];
    const Nv = [null,null,null];
    Nv[link.edge] = b; Nv[(link.edge+1)%3] = a; Nv[(link.edge+2)%3] = R;
    return {e, link, T:Nv, a, b};
  });

  // flap fills + lattices
  flaps.forEach(({e,T,link})=>{
    const col = COL[e+1], on = sel===e;
    s += `<polygon points="${pts(T)}" fill="${col}" fill-opacity="${on?.20:.07}"
           stroke="${col}" stroke-opacity="${on?1:.45}" stroke-width="${on?2.4:1.4}"/>`;
    for(let j=0;j<=N;j++) for(let i=0;i+j<=N;i++){
      const p=lat(T,i,j);
      s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="${col}" opacity="${on?.75:.3}"/>`;
    }
    const c = mul(add(add(T[0],T[1]),T[2]), 1/3);
    s += `<text x="${c[0].toFixed(1)}" y="${(c[1]+4).toFixed(1)}" fill="${col}" font-size="15"
           font-weight="700" text-anchor="middle" opacity="${on?1:.6}">${link.face}</text>`;
    // its local frame
    if (on){
      s += `<line x1="${T[0][0]}" y1="${T[0][1]}" x2="${lat(T,1.3,0)[0]}" y2="${lat(T,1.3,0)[1]}"
             stroke="${col}" stroke-width="2.4" marker-end="url(#ar)"/>`;
      s += `<line x1="${T[0][0]}" y1="${T[0][1]}" x2="${lat(T,0,1.3)[0]}" y2="${lat(T,0,1.3)[1]}"
             stroke="${col}" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>`;
      s += `<circle cx="${T[0][0]}" cy="${T[0][1]}" r="5.5" fill="none" stroke="${col}" stroke-width="2.2"/>`;
    }
  });

  // centre
  s += `<polygon points="${pts(T0)}" fill="${COL[0]}" fill-opacity=".14" stroke="${COL[0]}" stroke-width="2.4"/>`;
  for(let j=0;j<=N;j++) for(let i=0;i+j<=N;i++){
    const p=lat(T0,i,j);
    s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2" fill="${COL[0]}" opacity=".8"/>`;
  }
  const c0 = mul(add(add(T0[0],T0[1]),T0[2]), 1/3);
  s += `<text x="${c0[0].toFixed(1)}" y="${(c0[1]+5).toFixed(1)}" fill="${COL[0]}" font-size="17"
         font-weight="700" text-anchor="middle">${face}</text>`;
  s += `<line x1="${T0[0][0]}" y1="${T0[0][1]}" x2="${lat(T0,1.3,0)[0]}" y2="${lat(T0,1.3,0)[1]}"
         stroke="${COL[0]}" stroke-width="2.4" marker-end="url(#ar)"/>`;
  s += `<line x1="${T0[0][0]}" y1="${T0[0][1]}" x2="${lat(T0,0,1.3)[0]}" y2="${lat(T0,0,1.3)[1]}"
         stroke="${COL[0]}" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>`;
  s += `<circle cx="${T0[0][0]}" cy="${T0[0][1]}" r="5.5" fill="none" stroke="${COL[0]}" stroke-width="2.2"/>`;
  s += `<text x="${(lat(T0,1.55,0)[0]).toFixed(1)}" y="${(lat(T0,1.55,0)[1]+4).toFixed(1)}"
         fill="${COL[0]}" font-size="12" font-weight="700" text-anchor="middle">i</text>`;
  s += `<text x="${(lat(T0,0,1.55)[0]).toFixed(1)}" y="${(lat(T0,0,1.55)[1]+4).toFixed(1)}"
         fill="${COL[0]}" font-size="12" font-weight="700" text-anchor="middle">j</text>`;

  // tappable edges + the shared sample cell
  flaps.forEach(({e,a,b,T})=>{
    s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"
           stroke="${sel===e?'#ffd166':'transparent'}" stroke-width="3.5"/>`;
    s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent"
           stroke-width="30" data-edge="${e}" style="cursor:pointer"/>`;
  });
  const f = flaps[sel];
  const P = add(f.a, mul(sub(f.b,f.a), 0.5));
  s += `<circle cx="${P[0].toFixed(1)}" cy="${P[1].toFixed(1)}" r="6.5" fill="#ffd166"/>`;

  document.getElementById('svg').innerHTML = s;
  document.getElementById('svg').querySelectorAll('[data-edge]').forEach(el =>
    el.addEventListener('click', () => { sel = +el.dataset.edge; draw(); }));

  document.getElementById('fnum').textContent = 'face ' + face;
  document.getElementById('tbl').innerHTML = [0,1,2].map(e=>{
    const l = TABLE[face][e];
    return `<tr class="${sel===e?'sel':''}"><td><span class="swatch" style="background:${COL[e+1]}"></span>edge ${e}</td>
            <td>face ${l.face}</td><td>edge ${l.edge}</td><td>${l.rev?'reversed':'same'}</td></tr>`;
  }).join('');

  const l = TABLE[face][sel];
  const mine = localIJ(P, T0), theirs = localIJ(P, f.T);
  document.getElementById('msg').innerHTML =
    `The gold dot is <b>one physical cell</b> sitting on the seam. In face ${face} its address is
     <b class="hi">i=${mine[0]}, j=${mine[1]}</b>. The very same cell, in face ${l.face}, is
     <b class="hi">i=${theirs[0]}, j=${theirs[1]}</b>.
     <br><br>Nothing moved — the neighbour just picked a different corner as its origin. Compare the two
     ringed origins and their <mono>i</mono>/<mono>j</mono> arrows. That mismatch is the whole reason
     the table stores <b>${l.rev?'reversed':'same'}</b> winding alongside the face number: it's the correction
     you apply when a step walks off the edge.`;
}

document.getElementById('prev').addEventListener('click',()=>{ face=(face+19)%20; draw(); });
document.getElementById('next').addEventListener('click',()=>{ face=(face+1)%20; draw(); });
document.getElementById('rand').addEventListener('click',()=>{
  face=Math.floor(Math.random()*20); sel=Math.floor(Math.random()*3); draw(); });
draw();
</script>
</body>
</html>
