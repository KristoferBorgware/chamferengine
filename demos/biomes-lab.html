					],
				},
			];

			const knobs = {};
			for (const g of KNOBS) for (const r of g.rows) knobs[r.key] = r.value;

			const ROWS = new Map();
			for (const g of KNOBS) for (const r of g.rows) ROWS.set(r.key, r);
			const rows = new Map();

			/** What the knobs come to once the ones that imply others are read. */
			function derived() {
				const k = {};
				for (const key of ROWS.keys()) k[key] = knobs[key];
				k.radius =
					(knobs.blockSize * 2 ** knobs.subdivisionDepth) / CELL_CONSTANT;
				// The coarse map's level, chosen exactly as the engine chooses
				// it, and capped at 9 the same way.
				k.level = Math.max(
					2,
					Math.min(
						knobs.subdivisionDepth,
						9,
						Math.max(
							0,
							Math.round(
								Math.log2((CELL_CONSTANT * k.radius) / knobs.coarseSpacing),
							),
						),
					),
				);
				k.mapMetres = (CELL_CONSTANT * k.radius) / 2 ** k.level;
				k.blockMetres =
					(CELL_CONSTANT * k.radius) / 2 ** knobs.subdivisionDepth;
				return k;
			}

			/** How wide the narrowest octave of one climate field is, in metres. */
			function narrowestOf(which) {
				return (
					knobs[which + "Feature"] /
					2 ** (Math.round(knobs[which + "Octaves"]) - 1)
				);
			}

			/**
			 * A knob's own ends, narrowed by the rest of the draft.
			 *
			 * A slider that cannot reach a refusal beats a refusal that explains
			 * itself. Three bind here: the map cannot be finer than the block
			 * grid it is read on, a climate field cannot carry an octave the map
			 * is too coarse to draw, and the patch walk has to finish while a
			 * slider is moving.
			 */
			function liveRange(row) {
				if (row.key === "coarseSpacing") {
					const k = derived();
					return { ...row, low: Math.max(row.low, Math.ceil(k.blockMetres * 4)) };
				}
				if (row.key === "cells") {
					// `3r(r+1) + 1` cells inside radius `r`, and the walk starts
					// at half the width.
					const reach = Math.floor((Math.sqrt(1 + (4 * PATCH_CELLS) / 3) - 1) / 2);
					return {
						...row,
						high: Math.max(
							row.low,
							Math.min(row.high, Math.floor((2 * reach) / row.step) * row.step),
						),
					};
				}
				const climate = ["temp", "hum", "warp"].find(
					(which) => row.key === which + "Octaves",
				);
				if (climate) {
					// Each octave is half the last, and the map cannot carry one
					// narrower than two of its own cells.
					const k = derived();
					const room =
						1 +
						Math.floor(Math.log2(knobs[climate + "Feature"] / (2 * k.mapMetres)));
					return { ...row, high: Math.max(row.low, Math.min(row.high, room)) };
				}
				return row;
			}

			/** Pull every knob inside its own narrowed ends, inward only. */
			function settle() {
				for (const g of KNOBS)
					for (const r of g.rows) {
						if (r.digits === undefined || r.type) continue;
						const live = liveRange(r);
						knobs[r.key] = Math.min(live.high, Math.max(live.low, knobs[r.key]));
					}
			}

			/** The whole table as one query-string value, and back. */
			function biomesToText(list) {
				return list
					.map(
						(b) =>
							`${b.name.replace(/[~|]/g, " ")}~${b.hex}~${+b.t.toFixed(
								3,
							)}~${+b.h.toFixed(3)}~${b.landform ?? ANY}`,
					)
					.join("|");
			}

			function biomesFromText(text) {
				const out = [];
				const keys = [ANY, ...LANDFORMS.map((form) => form.key)];
				for (const piece of text.split("|")) {
					const [name, hex, t, h, landform] = piece.split("~");
					if (!name || !/^[0-9a-fA-F]{6}$/.test(hex ?? "")) continue;
					if (!Number.isFinite(Number(t)) || !Number.isFinite(Number(h))) continue;
					out.push({
						name,
						hex: hex.toLowerCase(),
						t: Math.max(0, Math.min(1, Number(t))),
						h: Math.max(0, Math.min(1, Number(h))),
						// A link written before a biome carried its ground names
						// no landform, and everywhere is where it used to be.
						landform: keys.includes(landform) ? landform : ANY,
					});
				}
				return out.length > 0 ? out : null;
			}

			/** The grid as a run of digits, and back. */
			function gridFromText(text) {
				if (!/^[0-5]{75}$/.test(text)) return null;
				return text.split("").map(Number);
			}

			function toParams() {
				const p = new URLSearchParams();
				for (const [key, row] of ROWS) {
					if (row.type === "picture") continue;
					if (row.type === "check") {
						if (knobs[key] !== row.value) p.set(key, knobs[key] ? "1" : "0");
						continue;
					}
					if (knobs[key] !== row.value) p.set(key, String(knobs[key]));
				}
				const now = biomesToText(biomes);
				if (now !== biomesToText(PRESETS[knobs.preset] ?? DEFAULT_BIOMES))
					p.set("biomes", now);
				const sheet = grid.join("");
				if (sheet !== DEFAULT_GRID) p.set("grid", sheet);
				return p;
			}

			function fromParams(params) {
				for (const [key, row] of ROWS) {
					const raw = params.get(key);
					if (raw === null || row.type === "picture") continue;
					if (row.type === "check") knobs[key] = raw === "1";
					else if (row.type === "text" || row.type === "select") knobs[key] = raw;
					else if (Number.isFinite(Number(raw))) knobs[key] = Number(raw);
				}
				const table = params.get("biomes");
				if (table) {
					const read = biomesFromText(table);
					if (read) {
						biomes = read;
						picked = 0;
					}
				}
				const sheet = params.get("grid");
				if (sheet) {
					const read = gridFromText(sheet);
					if (read) grid = read;
				}
				// **A link could otherwise build what a slider cannot reach**, so
				// the draft settles here as well as after every move.
				settle();
			}

			function writeUrl() {
				const p = toParams();
				const url = p.toString()
					? location.pathname + "?" + p.toString()
					: location.pathname;
				history.replaceState(null, "", url);
			}

			// ---------------------------------------------------------------
			// The world, and the patch cut out of it.
			// ---------------------------------------------------------------

			/** A latitude and a longitude, as a unit direction. */
			function directionOf(latitude, longitude) {
				const lat = (latitude * Math.PI) / 180;
				const lon = (longitude * Math.PI) / 180;
				const ring = Math.cos(lat);
				return [ring * Math.cos(lon), Math.sin(lat), ring * Math.sin(lon)];
			}

			function cross3(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],
				];
			}

			/**
			 * East, up and north at one place on the planet.
			 *
			 * Up is `normalize(position)` and there is no global north, so north
			 * is whatever is left after east is taken out of the polar axis.
			 */
			function frameOf(up) {
				let east = cross3(POLE, up);
				let len = Math.sqrt(east[0] ** 2 + east[1] ** 2 + east[2] ** 2);
				if (len < 1e-9) {
					east = cross3([1, 0, 0], up);
					len = Math.sqrt(east[0] ** 2 + east[1] ** 2 + east[2] ** 2);
				}
				east = east.map((v) => v / len);
				return { east, up, north: cross3(up, east) };
			}

			/**
			 * The level the planet-wide shares are counted over.
			 *
			 * **A diagram governs the planet, so what sits under it has to be
			 * counted over the planet** -- a patch is a place, and a place can
			 * be entirely inside one biome while the world holds twelve. Level 5
			 * is 10,242 cells, which is the engine's own grid at a level coarse
			 * enough to run on every knob move.
			 */
			const TALLY_LEVEL = 5;

			/** Every cell of the planet at one level, as directions, built once. */
			const WORLD = (() => {
				const n = 1 << TALLY_LEVEL;
				const out = [];
				for (let face = 0; face < 20; face++)
					for (let i = 0; i <= n; i++)
						for (let j = 0; i + j <= n; j++) {
							// A cell on a face edge or an icosahedron vertex has
							// several names and must be counted once, so it is
							// taken only by the face that owns it.
							if (canonicalCell(face, n, i, j).face !== face) continue;
							out.push(latticePosition(face, n, i, j));
						}
				return out;
			})();

			/**
			 * What every reading depends on, as one string.
			 *
			 * **Moving a dot on the diagram changes no field.** Temperature,
			 * humidity, the push and the ground are all functions of the seed
			 * and the rows above; the diagram only decides which name the
			 * finished pair of numbers is given. So the readings are held, and
			 * dragging a biome across the square recolours a planet already
			 * sampled instead of sampling it again.
			 */
			function sampleKey() {
				const out = [];
				for (const key of ROWS.keys()) {
					const row = ROWS.get(key);
					if (
						row.type === "picture" ||
						key === "paint" ||
						key === "chartDots" ||
						key === "preset" ||
						key === "shoreHeight"
					)
						continue;
					out.push(key + "=" + knobs[key]);
				}
				return out.join(",");
			}

			/**
			 * The planet's own climate and ground at the tally level, held
			 * between edits.
			 *
			 * The three curves' answers are held alongside the two climate
			 * ones, because the grid is read off them and the grid is edited far
			 * more often than the fields are resampled.
			 */
			const world = {
				key: null,
				t: null,
				h: null,
				land: null,
				metres: null,
				level: null,
				cut: null,
				swing: null,
				fit: null,
			};

			/** One share of a sorted list, which is what the square is fitted to. */
			function percentile(sorted, at) {
				if (sorted.length === 0) return 0;
				return sorted[
					Math.max(0, Math.min(sorted.length - 1, Math.round(at * (sorted.length - 1))))
				];
			}

			/**
			 * Where the diagram's square starts and stops, in the fields' own
			 * units.
			 *
			 * **Over land, because the diagram is about land.** Half the planet
			 * is ocean and the ocean sits at one end of the humidity field by
			 * construction, so fitting over everything would spend a third of
			 * the square on water nobody puts a biome on.
			 *
			 * The 2nd and 98th percentiles rather than the ends: a fit to the
			 * extremes hands the whole middle of the square to the middle of the
			 * field, and the outer 4% saturating is what makes a desert a region
			 * rather than a rim.
			 */
			const FIT_TAIL = 0.02;

			function fitTo(rawT, rawH, land) {
				if (!knobs.fit)
					return { tLo: -1, tSpan: 2, hLo: -1, hSpan: 2, fitted: false };
				const t = [];
				const h = [];
				for (let n = 0; n < land.length; n++) {
					if (!land[n]) continue;
					t.push(rawT[n]);
					h.push(rawH[n]);
				}
				if (t.length < 16)
					return { tLo: -1, tSpan: 2, hLo: -1, hSpan: 2, fitted: false };
				t.sort((a, b) => a - b);
				h.sort((a, b) => a - b);
				const tLo = percentile(t, FIT_TAIL);
				const hLo = percentile(h, FIT_TAIL);
				const tSpan = Math.max(1e-6, percentile(t, 1 - FIT_TAIL) - tLo);
				const hSpan = Math.max(1e-6, percentile(h, 1 - FIT_TAIL) - hLo);
				return { tLo, tSpan, hLo, hSpan, fitted: true, raw: { tSpan, hSpan } };
			}

			function tallyWorld(seed, s, k) {
				const key = sampleKey();
				if (world.key === key) return;
				const said = [0, 0, 0];
				const climate = [0, 0];
				const warp = [0, 0];
				const square = [0, 0];
				const count = WORLD.length;
				const rawT = new Float32Array(count);
				const rawH = new Float32Array(count);
				const pushT = new Float32Array(count);
				const pushH = new Float32Array(count);
				const t = new Float32Array(count);
				const h = new Float32Array(count);
				const land = new Uint8Array(count);
				const metresAt = new Float32Array(count);
				const level = new Float32Array(count);
				const cut = new Float32Array(count);
				const swing = new Float32Array(count);
				for (let n = 0; n < count; n++) {
					const p = WORLD[n];
					fieldsAt(p[0], p[1], p[2], seed, s, said);
					const metres = heightFrom(said);
					climateAt(p[0], p[1], p[2], said, metres, seed, s, k, climate);
					warpAt(p[0], p[1], p[2], seed, s, warp);
					rawT[n] = climate[0];
					rawH[n] = climate[1];
					pushT[n] = warp[0];
					pushH[n] = warp[1];
					metresAt[n] = metres;
					level[n] = splineAt(TERRAIN.cont.spline, said[0]);
					cut[n] = splineAt(TERRAIN.ero.spline, said[1]);
					swing[n] = splineAt(TERRAIN.pv.spline, said[2]);
					land[n] = metres > TERRAIN.seaLevel ? 1 : 0;
				}
				world.fit = fitTo(rawT, rawH, land);
				for (let n = 0; n < count; n++) {
					climate[0] = rawT[n];
					climate[1] = rawH[n];
					warp[0] = pushT[n];
					warp[1] = pushH[n];
					squareOf(climate, warp, square);
					t[n] = square[0];
					h[n] = square[1];
				}
				world.key = key;
				world.t = t;
				world.h = h;
				world.land = land;
				world.metres = metresAt;
				world.level = level;
				world.cut = cut;
				world.swing = swing;
			}

			/**
			 * How much of the planet's land each biome covers.
			 *
			 * Read back rather than set: a dot is placed in the climate square
			 * and what that comes to on the ground is a measurement, because how
			 * much planet sits under one patch of the square depends on where
			 * the two fields actually go.
			 */
			function shares() {
				const out = new Float64Array(biomes.length);
				const byForm = new Float64Array(LANDFORMS.length);
				const inCell = new Float64Array(grid.length);
				let land = 0;
				for (let n = 0; n < world.t.length; n++) {
					if (!world.land[n]) continue;
					land++;
					const form = landformAt(
						world.level[n],
						world.cut[n],
						world.swing[n],
						world.metres[n],
					);
					byForm[form]++;
					if (form !== SHORE)
						inCell[
							gridAt(
								bucket(world.level[n], CONT_EDGES),
								bucket(world.cut[n], ERO_EDGES),
								bucket(world.swing[n], PV_EDGES),
							)
						]++;
					const which = biomeOf(world.t[n], world.h[n], form);
					if (which >= 0) out[which]++;
				}
				const over = Math.max(1, land);
				for (let n = 0; n < out.length; n++) out[n] /= over;
				for (let n = 0; n < byForm.length; n++) byForm[n] /= over;
				for (let n = 0; n < inCell.length; n++) inCell[n] /= over;
				return {
					share: out,
					byForm,
					inCell,
					land: land / world.t.length,
				};
			}

			/**
			 * The patch: the engine's own map cells, walked out from the one the
			 * camera stands over.
			 *
			 * **Hexagons are map cells here.** The map is the terrain, and a
			 * biome is decided by fields whose narrowest octave is hundreds of
			 * metres wide -- drawn on the block grid the same colours would be
			 * repeated across a thousand blocks to say what one map cell says.
			 *
			 * `neighbour` is what walks, so a patch that reaches a face edge
			 * crosses it the way the engine does and a patch that reaches a
			 * pentagon gets a five-sided cell.
			 */
			function generate(cells = knobs.cells) {
				const k = derived();
				const seed = seedFromString(knobs.seed);
				const s = settingsFor(k);
				tallyWorld(seed, s, k);

				const n = 2 ** k.level;
				const middle = directionOf(knobs.latitude, knobs.longitude);
				const found = directionToCell(middle[0], middle[1], middle[2], n);
				const start = canonicalCell(found.face, n, found.i, found.j);
				const reach = Math.max(1, cells >> 1);
				const keyOf = (c) => (c.face * (n + 1) + c.i) * (n + 1) + c.j;
				const at = new Map();
				const list = [];
				const add = (c) => {
					const key = keyOf(c);
					if (at.has(key)) return false;
					at.set(key, list.length);
					list.push(c);
					return true;
				};
				add(start);
				let frontier = [start];
				for (let r = 0; r < reach; r++) {
					const next = [];
					for (const c of frontier)
						for (let d = 0; d < 6; d++) {
							const nb = neighbour(c.face, n, c.i, c.j, d);
							if (!nb) continue;
							const cell = canonicalCell(nb.face, n, nb.i, nb.j);
							if (add(cell)) next.push(cell);
						}
					frontier = next;
				}

				const count = list.length;
				const centre = latticePosition(start.face, n, start.i, start.j);
				const frame = frameOf(centre);
				const height = new Float64Array(count);
				const climT = new Float32Array(count);
				const climH = new Float32Array(count);
				// The three curves' answers, held so that editing the grid
				// re-reads them rather than resampling the noise under them.
				const level = new Float32Array(count);
				const cut = new Float32Array(count);
				const swing = new Float32Array(count);
				const degree = new Uint8Array(count);
				const corner = new Float64Array(count * 18);
				const ring = new Int32Array(count * 6).fill(-1);
				const said = [0, 0, 0];
				const climate = [0, 0];
				const warp = [0, 0];
				const square = [0, 0];
				let lowest = Infinity;
				let highest = -Infinity;
				for (let c = 0; c < count; c++) {
					const cell = list[c];
					const p = latticePosition(cell.face, n, cell.i, cell.j);
					fieldsAt(p[0], p[1], p[2], seed, s, said);
					const metres = heightFrom(said);
					climateAt(p[0], p[1], p[2], said, metres, seed, s, k, climate);
					warpAt(p[0], p[1], p[2], seed, s, warp);
					height[c] = metres;
					level[c] = splineAt(TERRAIN.cont.spline, said[0]);
					cut[c] = splineAt(TERRAIN.ero.spline, said[1]);
					swing[c] = splineAt(TERRAIN.pv.spline, said[2]);
					squareOf(climate, warp, square);
					climT[c] = square[0];
					climH[c] = square[1];
					if (metres < lowest) lowest = metres;
					if (metres > highest) highest = metres;
					const corners = cellCorners(cell.face, n, cell.i, cell.j);
					degree[c] = corners.length;
					for (let v = 0; v < corners.length; v++) {
						corner[c * 18 + v * 3] = corners[v][0];
						corner[c * 18 + v * 3 + 1] = corners[v][1];
						corner[c * 18 + v * 3 + 2] = corners[v][2];
					}
					for (let d = 0; d < 6; d++) {
						const nb = neighbour(cell.face, n, cell.i, cell.j, d);
						if (!nb) continue;
						const hit = at.get(keyOf(canonicalCell(nb.face, n, nb.i, nb.j)));
						if (hit !== undefined) ring[c * 6 + d] = hit;
					}
				}

				field = {
					k,
					seed,
					s,
					count,
					centre,
					frame,
					degree,
					corner,
					ring,
					height,
					climT,
					climH,
					level,
					cut,
					swing,
					biome: new Int16Array(count),
					form: new Int8Array(count),
					lowest,
					highest,
					arc: Math.min(cells * k.mapMetres, Math.PI * k.radius),
					span: cells * k.mapMetres,
					cellsAsked: cells,
					sampleKey: sampleKey(),
					draft: cells < knobs.cells,
				};
				assign();
			}

			/**
			 * Which biome every hexagon of the patch is in.
			 *
			 * Split out from the sampling because it is the only part a drag on
			 * the diagram changes.
			 */
			function assign() {
				if (!field) return;
				regroup();
				const { count, height, climT, climH, level, cut, swing, biome, form } =
					field;
				const counts = new Int32Array(biomes.length);
				let land = 0;
				for (let c = 0; c < count; c++) {
					const kind = landformAt(level[c], cut[c], swing[c], height[c]);
					form[c] = kind;
					if (kind < 0) {
						biome[c] = -1;
						continue;
					}
					const which = biomeOf(climT[c], climH[c], kind);
					biome[c] = which;
					if (which >= 0) counts[which]++;
					land++;
				}
				field.counts = counts;
				field.land = land;
				field.here = land > 0 ? counts.indexOf(Math.max(...counts)) : -1;
			}

			// ---------------------------------------------------------------
			// The pictures.
			// ---------------------------------------------------------------

			/**
			 * The five pictures, and which canvas each one lands in.
			 *
			 * The finished map is in the panel's head; every field picture sits
			 * in the section of the panel that tunes it, so the thing being
			 * judged never scrolls away from the knob being turned.
			 */
			const SHOTS = [
				{ key: "biome", id: "shotBiome", name: "Biomes" },
				{ key: "ground", id: "shotGround", name: "Terrain" },
				{ key: "form", id: "shotForm", name: "Landform" },
				{ key: "temp", id: "shotTemp", name: "Temperature" },
				{ key: "hum", id: "shotHum", name: "Humidity" },
				{ key: "warp", id: "shotWarp", name: "Biome noise" },
			];
			const SHOT_OF = new Map(SHOTS.map((shot) => [shot.key, shot]));

			/** How many steps a field picture is cut into. */
			const PICTURE_BANDS = 9;

			/** Cold to hot, and dry to wet, as the two ramps the fields read on. */
			const HEAT_RAMP = [
				[0.62, 0.79, 0.92],
				[0.93, 0.93, 0.88],
				[0.85, 0.35, 0.26],
			];
			const GREY_RAMP = [
				[0.09, 0.1, 0.12],
				[0.55, 0.56, 0.6],
				[0.95, 0.96, 0.98],
			];
			const WET_RAMP = [
				[0.86, 0.78, 0.5],
				[0.92, 0.92, 0.9],
				[0.16, 0.4, 0.7],
			];

			/**
			 * One reading in `[-1, 1]` as a step along a ramp, with a line at
			 * the edge of each step.
			 *
			 * **Bands, not a wash.** A smooth gradient of a noise field shows
			 * its brightness and hides its shape; cutting it into steps draws
			 * the contour lines, and the contours are what say whether a field
			 * is broad and rolling or narrow and folded.
			 */
			function bandRamp(v, ramp) {
				const t = Math.max(0, Math.min(0.9999, (v + 1) / 2));
				const step = Math.floor(t * PICTURE_BANDS);
				const along = (step / (PICTURE_BANDS - 1)) * (ramp.length - 1);
				const lo = Math.min(ramp.length - 1, Math.floor(along));
				const hi = Math.min(ramp.length - 1, lo + 1);
				const mix = along - lo;
				const into = t * PICTURE_BANDS - step;
				const edge = into < 0.06 ? 0.5 : 1;
				return [
					(ramp[lo][0] + (ramp[hi][0] - ramp[lo][0]) * mix) * edge,
					(ramp[lo][1] + (ramp[hi][1] - ramp[lo][1]) * mix) * edge,
					(ramp[lo][2] + (ramp[hi][2] - ramp[lo][2]) * mix) * edge,
				];
			}

			/**
			 * One height, as the colour the ground would be.
			 *
			 * Sea is one colour deepening with how much water a look passes
			 * through, because the ocean is a surface and holds no blocks; land
			 * is banded every hundred metres so a slope reads as a slope.
			 */
			function groundColor(metres) {
				const over = metres - TERRAIN.seaLevel;
				if (over <= 0) {
					const through = 1 - Math.exp(over / SEA_CLARITY);
					return BAND_COLORS[0].map((c, n) => c + (SEA_COLOR[n] - c) * through);
				}
				const band =
					over < GROUND_LINES.rock ? 1 : over < GROUND_LINES.snow ? 2 : 3;
				const into = ((over / 100) % 1) * 100;
				const edge = into < 6 ? 0.78 : 1;
				return BAND_COLORS[band].map((c) => c * edge);
			}

			/**
			 * The direction a pixel of a picture is looking at.
			 *
			 * Over the planet it is longitude across and latitude down, the one
			 * projection where a direction is two cosines and no case analysis.
			 * Over the patch it is the exponential map out of the patch's own
			 * frame, so metres out from the middle become radians of arc.
			 */
			function pictureDirection(q, r, wide, tall, frame, half, radius) {
				if (!frame) {
					const lat = (0.5 - (r + 0.5) / tall) * Math.PI;
					const lon = ((q + 0.5) / wide) * 2 * Math.PI - Math.PI;
					const ring = Math.cos(lat);
					return [ring * Math.cos(lon), Math.sin(lat), ring * Math.sin(lon)];
				}
				const u = (((q + 0.5) / wide) * 2 - 1) * (half / radius);
				const v = (1 - ((r + 0.5) / tall) * 2) * (half / radius);
				const a = Math.sqrt(u * u + v * v);
				if (a < 1e-12) return frame.up;
				const c = Math.cos(a);
				const sn = Math.sin(a) / a;
				return normalize3([
					frame.up[0] * c + (frame.east[0] * u + frame.north[0] * v) * sn,
					frame.up[1] * c + (frame.east[1] * u + frame.north[1] * v) * sn,
					frame.up[2] * c + (frame.east[2] * u + frame.north[2] * v) * sn,
				]);
			}

			/**
			 * Every reading behind the pictures, sampled once and held.
			 *
			 * Five pictures come out of one pass, because the fields they draw
			 * are read at one point together and the ground is made of three of
			 * them. Held across a drag on the diagram, which changes none of
			 * them.
			 */
			const sampled = { key: null, wide: 0, tall: 0 };

			function sampleShots(wide, tall) {
				const key = sampleKey() + "|" + wide + "x" + tall;
				if (sampled.key === key) return;
				const planet = knobs.show === "planet";
				const frame = planet ? null : field.frame;
				const half = field.arc / 2;
				const k = field.k;
				const seed = field.seed;
				const s = field.s;
				const said = [0, 0, 0];
				const climate = [0, 0];
				const warp = [0, 0];
				const square = [0, 0];
				const room = wide * tall;
				const t = new Float32Array(room);
				const h = new Float32Array(room);
				const pushT = new Float32Array(room);
				const pushH = new Float32Array(room);
				const ground = new Float32Array(room * 3);
				const land = new Uint8Array(room);
				const metresAt = new Float32Array(room);
				const level = new Float32Array(room);
				const cut = new Float32Array(room);
				const swing = new Float32Array(room);
				for (let r = 0; r < tall; r++)
					for (let q = 0; q < wide; q++) {
						const p = pictureDirection(q, r, wide, tall, frame, half, k.radius);
						fieldsAt(p[0], p[1], p[2], seed, s, said);
						const metres = heightFrom(said);
						climateAt(p[0], p[1], p[2], said, metres, seed, s, k, climate);
						warpAt(p[0], p[1], p[2], seed, s, warp);
						const at = r * wide + q;
						squareOf(climate, warp, square);
						t[at] = square[0];
						h[at] = square[1];
						pushT[at] = warp[0];
						pushH[at] = warp[1];
						metresAt[at] = metres;
						level[at] = splineAt(TERRAIN.cont.spline, said[0]);
						cut[at] = splineAt(TERRAIN.ero.spline, said[1]);
						swing[at] = splineAt(TERRAIN.pv.spline, said[2]);
						land[at] = metres > TERRAIN.seaLevel ? 1 : 0;
						const c = groundColor(metres);
						ground[at * 3] = c[0];
						ground[at * 3 + 1] = c[1];
						ground[at * 3 + 2] = c[2];
					}
				sampled.key = key;
				sampled.wide = wide;
				sampled.tall = tall;
				sampled.t = t;
				sampled.h = h;
				sampled.pushT = pushT;
				sampled.pushH = pushH;
				sampled.ground = ground;
				sampled.land = land;
				sampled.metres = metresAt;
				sampled.level = level;
				sampled.cut = cut;
				sampled.swing = swing;
			}

			/**
			 * One picture, painted out of the held readings.
			 *
			 * **The coastline is drawn on every field picture.** A climate map
			 * on its own is a set of blobs with nothing to place them against; a
			 * line where the ground crosses sea level says which blob is over a
			 * continent and which is over an ocean, which is the whole question
			 * a humidity field is being read for.
			 */
			function paintShot(shot, ctx, target) {
				const wide = sampled.wide;
				const tall = sampled.tall;
				if (target.width !== wide || target.height !== tall) {
					target.width = wide;
					target.height = tall;
				}
				const image = ctx.createImageData(wide, tall);
				const px = image.data;
				const { t, h, pushT, pushH, ground, land, metres, level, cut, swing } =
					sampled;
				for (let n = 0; n < wide * tall; n++) {
					let c;
					if (shot.key === "ground") {
						c = [ground[n * 3], ground[n * 3 + 1], ground[n * 3 + 2]];
					} else if (shot.key === "temp") {
						c = bandRamp(2 * t[n] - 1, HEAT_RAMP);
					} else if (shot.key === "hum") {
						c = bandRamp(2 * h[n] - 1, WET_RAMP);
					} else if (shot.key === "warp") {
						// **Two fields, so a grey one and a line one.** A biome
						// is chosen by a point in two dimensions, and a single
						// field could only ever slide every place along one
						// diagonal of the diagram -- which frays the borders
						// crossing that diagonal and leaves the ones running
						// along it perfectly straight. The push toward hot is
						// the grey; the push toward wet is drawn as its own
						// contour over the top, because two washes of colour in
						// one picture read as neither.
						c = bandRamp(pushT[n], GREY_RAMP);
						const along = Math.max(0, Math.min(0.9999, (pushH[n] + 1) / 2));
						const into = along * PICTURE_BANDS - Math.floor(along * PICTURE_BANDS);
						if (into < 0.06) c = [c[0] * 0.4, c[1] * 0.45, c[2] * 0.55];
					} else if (shot.key === "form") {
						const form = landformAt(level[n], cut[n], swing[n], metres[n]);
						c =
							form < 0
								? SEA_COLOR
								: rgbOf(LANDFORMS[form].hex);
					} else {
						const form = landformAt(level[n], cut[n], swing[n], metres[n]);
						const which = form < 0 ? -1 : biomeOf(t[n], h[n], form);
						c =
							which < 0
								? [ground[n * 3], ground[n * 3 + 1], ground[n * 3 + 2]]
								: rgbOf(biomes[which].hex);
					}
					const at = n * 4;
					px[at] = c[0] * 255;
					px[at + 1] = c[1] * 255;
					px[at + 2] = c[2] * 255;
					px[at + 3] = 255;
				}
				if (shot.key !== "ground" && shot.key !== "biome" && shot.key !== "form")
					for (let r = 0; r < tall; r++)
						for (let q = 0; q < wide; q++) {
							const n = r * wide + q;
							const right = q + 1 < wide && land[n] !== land[n + 1];
							const under = r + 1 < tall && land[n] !== land[n + wide];
							if (!right && !under) continue;
							const at = n * 4;
							px[at] = 12;
							px[at + 1] = 14;
							px[at + 2] = 18;
						}
				ctx.putImageData(image, 0, 0);
				if (knobs.show === "planet") outlinePatch(ctx, wide, tall);
			}

			/** Where the patch is standing, drawn on a picture of the planet. */
			function outlinePatch(g, wide, tall) {
				const k = field.k;
				const lat = (knobs.latitude * Math.PI) / 180;
				const across = field.arc / k.radius / Math.max(0.15, Math.cos(lat));
				const down = field.arc / k.radius;
				const box = {
					x:
						((knobs.longitude + 180) / 360) * wide -
						(across / (4 * Math.PI)) * wide,
					y: (0.5 - knobs.latitude / 180) * tall - (down / (2 * Math.PI)) * tall,
					w: Math.max(3, (across / (2 * Math.PI)) * wide),
					h: Math.max(3, (down / Math.PI) * tall),
				};
				g.strokeStyle = "rgba(255, 90, 90, 0.95)";
				g.lineWidth = 1;
				g.strokeRect(box.x - 0.5, box.y - 0.5, box.w + 1, box.h + 1);
			}

			function drawPictures() {
				if (!field) return;
				const ready = SHOTS.filter((shot) => shot.ctx);
				if (ready.length === 0) return;
				// Half the samples while a knob is moving, for the same reason
				// the patch draws fewer cells: a picture that arrives after the
				// finger has stopped is not a picture of the knob.
				const wide = field.draft ? 156 : 312;
				sampleShots(wide, knobs.show === "planet" ? wide / 2 : wide);
				for (const shot of ready) paintShot(shot, shot.ctx, shot.canvas);
				if (!field.draft && !big.hidden && bigShown) drawBig(bigShown);
			}

			// ---------------------------------------------------------------
			// The enlarged picture.
			// ---------------------------------------------------------------

			const big = document.getElementById("big");
			const bigCanvas = document.getElementById("bigShot");
			const bigCtx = bigCanvas.getContext("2d");
			const bigName = document.getElementById("bigName");
			let bigShown = null;

			/**
			 * One picture, large.
			 *
			 * **A field at panel width says where its features are; at this size
			 * it says what they look like.** The narrow octaves of a climate
			 * field are a grain at 312 pixels and a pattern at 1,024, and which
			 * of those a border is being dragged against is the whole question.
			 */
			function drawBig(shot) {
				if (!field) return;
				bigShown = shot;
				const planet = knobs.show === "planet";
				const wide = planet ? 1024 : 720;
				bigName.textContent = `${shot.name} · ${
					planet
						? "the whole planet"
						: `${Math.round(field.span).toLocaleString()} m of ground`
				}`;
				big.hidden = false;
				const held = sampled.key;
				sampleShots(wide, planet ? wide / 2 : wide);
				paintShot(shot, bigCtx, bigCanvas);
				// The panel's pictures are a different size, so the held
				// readings have to be dropped rather than left claiming to
				// answer for them.
				if (held !== sampled.key) sampled.key = null;
			}

			function closeBig() {
				big.hidden = true;
				bigShown = null;
			}
			big.addEventListener("click", closeBig);
			window.addEventListener("keydown", (e) => {
				if (e.key === "Escape") closeBig();
			});

			/**
			 * **A latitude and a longitude are a place, and two sliders are not
			 * a way to look for one.** Clicking a picture of the planet puts the
			 * patch where the finger went: the projection is longitude across
			 * and latitude down, so it inverts to two divisions. Over the patch
			 * there is nowhere to jump to, so a click enlarges instead.
			 */
			function watchShot(shot) {
				shot.canvas.addEventListener("click", (e) => {
					if (knobs.show !== "planet") return drawBig(shot);
					const box = shot.canvas.getBoundingClientRect();
					const across = (e.clientX - box.left) / box.width;
					const down = (e.clientY - box.top) / box.height;
					const row = ROWS.get("latitude");
					knobs.longitude = Math.round(across * 360 - 180);
					knobs.latitude = Math.max(
						row.low,
						Math.min(row.high, Math.round((0.5 - down) * 180)),
					);
					askForRedraw(false);
				});
				shot.canvas.addEventListener("contextmenu", (e) => {
					e.preventDefault();
					drawBig(shot);
				});
				shot.canvas.title =
					"click to enlarge, or to move the patch when the pictures show " +
					"the planet (right-click always enlarges)";
			}

			// ---------------------------------------------------------------
			// The diagram.
			// ---------------------------------------------------------------

			const chart = document.getElementById("chart");
			const chartCtx = chart.getContext("2d");
			const chartSays = document.getElementById("chartsays");

			/** How wide the diagram is drawn, and the room its two labels take. */
			const CHART_SIDE = 300;
			const CHART_LEFT = 20;
			const CHART_FOOT = 18;

			/**
			 * The diagram: every climate the planet could reach, coloured by the
			 * biome that would be built there.
			 *
			 * **Humidity across and temperature up**, both `0` to `1`, and every
			 * point of the square belongs to whichever dot is nearest. So there
			 * is no climate without a biome and no biome without a border --
			 * what a dot decides is where its own borders fall against its
			 * neighbours', and dragging one moves several at once.
			 *
			 * **The borders are drawn dithered by exactly what the biome noise
			 * pushes.** The lookup on the planet is moved off its true climate
			 * before it is taken, so a strip either side of every line here can
			 * come out as either biome; drawing it as a check of the two is the
			 * diagram saying how ragged that border will be on the ground.
			 */
			function drawChart() {
				const side = CHART_SIDE;
				if (chart.width !== side) {
					chart.width = side;
					chart.height = side;
				}
				const wide = side - CHART_LEFT;
				const tall = side - CHART_FOOT;
				chartCtx.clearRect(0, 0, side, side);
				const image = chartCtx.createImageData(wide, tall);
				const px = image.data;
				const push = knobs.warpStrength;
				// **One landform's own partition**, because that is the set a
				// place on that kind of ground is chosen from. A biome filed
				// under the lowlands is not in this picture at all when the
				// peaks are shown, which is the whole of what stops a desert
				// appearing on a summit.
				const set = allowed[shown] ?? [];
				for (let r = 0; r < tall; r++) {
					const t = 1 - (r + 0.5) / tall;
					for (let q = 0; q < wide; q++) {
						const h = (q + 0.5) / wide;
						let first = set[0] ?? 0;
						let other = first;
						let near = Infinity;
						let second = Infinity;
						for (let i = 0; i < set.length; i++) {
							const n = set[i];
							const dt = t - biomes[n].t;
							const dh = h - biomes[n].h;
							const d = dt * dt + dh * dh;
							if (d < near) {
								second = near;
								other = first;
								near = d;
								first = n;
							} else if (d < second) {
								second = d;
								other = n;
							}
						}
						if (set.length === 0) {
							const at = (r * wide + q) * 4;
							px[at] = 24;
							px[at + 1] = 26;
							px[at + 2] = 32;
							px[at + 3] = 255;
							continue;
						}
						// Half the gap between the two nearest dots is how far
						// this point stands from the line between them.
						const gap = (Math.sqrt(second) - Math.sqrt(near)) / 2;
						const which =
							gap < push && ((q >> 1) + (r >> 1)) % 2 === 1 ? other : first;
						const c = rgbOf(biomes[which].hex);
						const at = (r * wide + q) * 4;
						px[at] = c[0] * 255;
						px[at + 1] = c[1] * 255;
						px[at + 2] = c[2] * 255;
						px[at + 3] = 255;
					}
				}
				chartCtx.putImageData(image, CHART_LEFT, 0);

				// **What the world actually reaches, over the diagram that
				// names it.** A square has a climate in every corner and a
				// planet does not: a region with no dots over it is a biome this
				// world never builds, and one packed with them is a biome most
				// of the ground is in. The patch is the same reading over one
				// place, which is where the camera is standing.
				// **Only the ground this tab is about.** A cloud of every
				// climate on the planet says nothing about where a peak's
				// biomes should sit; the peaks' own climates do, and on this
				// world they are cold, because the temperature field loses
				// height as the ground gains it.
				const cloud =
					knobs.chartDots === "the planet" && world.t
						? {
								t: world.t,
								h: world.h,
								form: null,
								count: world.t.length,
								world: true,
							}
						: knobs.chartDots === "the patch" && field
							? {
									t: field.climT,
									h: field.climH,
									form: field.form,
									count: field.count,
									world: false,
								}
							: null;
				if (cloud) {
					chartCtx.fillStyle = "rgba(10, 12, 16, 0.42)";
					for (let n = 0; n < cloud.count; n++) {
						const form = cloud.world
							? landformAt(
									world.level[n],
									world.cut[n],
									world.swing[n],
									world.metres[n],
								)
							: cloud.form[n];
						if (form !== shown) continue;
						const x = CHART_LEFT + cloud.h[n] * wide;
						const y = (1 - cloud.t[n]) * tall;
						chartCtx.fillRect(x - 0.5, y - 0.5, 1.6, 1.6);
					}
				}

				// **A label is drawn only where one fits.** A set of two dozen
				// zones has more names than a 300 pixel square has room for, and
				// a pile of overlapping text says less than the dots alone. The
				// one being edited is placed first and never dropped.
				const taken = [];
				const order = set.includes(picked)
					? [picked, ...set.filter((n) => n !== picked)]
					: [...set];
				chartCtx.textAlign = "center";
				for (const n of order) {
					const b = biomes[n];
					if (!b) continue;
					const x = CHART_LEFT + b.h * wide;
					const y = (1 - b.t) * tall;
					const mine = n === picked;
					chartCtx.font = (mine ? "600 " : "") + "10px system-ui, sans-serif";
					const room = chartCtx.measureText(b.name).width;
					const lx = Math.max(
						CHART_LEFT + room / 2 + 2,
						Math.min(side - room / 2 - 2, x),
					);
					// A dot near the top has no room over it, so its name goes
					// under it instead of off the edge.
					const box = {
						x: lx - room / 2 - 2,
						y: y - 18 < 0 ? y + 6 : y - 18,
						w: room + 4,
						h: 12,
					};
					const clash = taken.some(
						(o) =>
							box.x < o.x + o.w &&
							o.x < box.x + box.w &&
							box.y < o.y + o.h &&
							o.y < box.y + box.h,
					);
					if (!clash) {
						taken.push(box);
						chartCtx.fillStyle = "rgba(12, 14, 18, 0.75)";
						chartCtx.fillRect(box.x, box.y, box.w, box.h);
						chartCtx.fillStyle = mine ? "#6fd0ff" : "#e8ecf2";
						chartCtx.fillText(b.name, lx, box.y + 9);
					}
					chartCtx.beginPath();
					chartCtx.arc(x, y, mine ? 5 : 3.5, 0, Math.PI * 2);
					chartCtx.fillStyle = "rgba(12, 14, 18, 0.85)";
					chartCtx.fill();
					chartCtx.lineWidth = mine ? 2 : 1;
					chartCtx.strokeStyle = mine ? "#6fd0ff" : "rgba(232, 236, 242, 0.8)";
					chartCtx.stroke();
				}

				chartCtx.font = "9.5px system-ui, sans-serif";
				chartCtx.fillStyle = "#8b95a4";
				chartCtx.fillText("humidity", CHART_LEFT + wide / 2, side - 5);
				chartCtx.save();
				chartCtx.translate(9, tall / 2);
				chartCtx.rotate(-Math.PI / 2);
				chartCtx.fillText("temperature", 0, 0);
				chartCtx.restore();
			}

			/**
			 * Which biome is being edited, what it comes to on the planet, and
			 * which ground it may stand on.
			 *
			 * **Where it stands is edited here rather than in the list**,
			 * because changing it moves the biome out of the list this panel is
			 * showing -- the control has to outlive the row it would sit in.
			 */
			function sayChart() {
				const b = biomes[picked];
				chartSays.textContent = "";
				if (!b) {
					chartSays.innerHTML =
						`<b>${LANDFORMS[shown].name}</b> has no biome, so nothing can be ` +
						`built on it — add one, or move one here`;
					return;
				}
				const share = field && field.worldShare ? field.worldShare[picked] : 0;
				const says = document.createElement("span");
				says.innerHTML =
					`<b>${b.name}</b> at temperature <b>${b.t.toFixed(
						2,
					)}</b>, humidity <b>${b.h.toFixed(2)}</b> — ` +
					`<b>${(share * 100).toFixed(1)}%</b> of the planet's land · stands on `;
				const pickForm = document.createElement("select");
				for (const [value, label] of [
					[ANY, "any ground"],
					...LANDFORMS.map((form) => [form.key, form.name.toLowerCase()]),
				]) {
					const o = document.createElement("option");
					o.value = value;
					o.textContent = label;
					pickForm.append(o);
				}
				pickForm.value = b.landform ?? ANY;
				pickForm.addEventListener("input", () => {
					b.landform = pickForm.value;
					if (b.landform !== ANY) shown = LANDFORMS.findIndex((f) => f.key === b.landform);
					askForRecolor();
					writeUrl();
				});
				chartSays.append(says, pickForm);
			}

			/**
			 * Dragging a dot, which is the whole edit.
			 *
			 * A click away from every dot selects the biome whose region was
			 * clicked and moves nothing: a diagram where clicking anywhere
			 * dragged something would have no way to look at a border without
			 * changing it.
			 */
			let holding = -1;

			function chartPoint(e) {
				const box = chart.getBoundingClientRect();
				const wide = CHART_SIDE - CHART_LEFT;
				const tall = CHART_SIDE - CHART_FOOT;
				const x = ((e.clientX - box.left) / box.width) * CHART_SIDE;
				const y = ((e.clientY - box.top) / box.height) * CHART_SIDE;
				return {
					x,
					y,
					h: Math.max(0, Math.min(1, (x - CHART_LEFT) / wide)),
					t: Math.max(0, Math.min(1, 1 - y / tall)),
					wide,
					tall,
				};
			}

			chart.addEventListener("pointerdown", (e) => {
				const p = chartPoint(e);
				let near = Infinity;
				let found = -1;
				for (const n of allowed[shown] ?? []) {
					const dx = CHART_LEFT + biomes[n].h * p.wide - p.x;
					const dy = (1 - biomes[n].t) * p.tall - p.y;
					const d = dx * dx + dy * dy;
					if (d < near) {
						near = d;
						found = n;
					}
				}
				const grabbed = found >= 0 && near <= 16 * 16;
				const under = biomeOf(p.t, p.h, shown);
				picked = grabbed ? found : under >= 0 ? under : picked;
				holding = grabbed ? found : -1;
				if (grabbed) chart.setPointerCapture(e.pointerId);
				refreshList();
				drawChart();
				sayChart();
			});

			chart.addEventListener("pointermove", (e) => {
				if (holding < 0) return;
				const p = chartPoint(e);
				biomes[holding].t = p.t;
				biomes[holding].h = p.h;
				askForRecolor();
			});

			const dropDot = () => {
				if (holding < 0) return;
				holding = -1;
				writeUrl();
			};
			chart.addEventListener("pointerup", dropDot);
			chart.addEventListener("pointercancel", dropDot);

			// ---------------------------------------------------------------
			// The patch, as hexagon columns.
			// ---------------------------------------------------------------

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in vec3 tint;
			layout(location = 2) in vec3 normal;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out vec3 vTint;
			void main() {
				vNormal = normal;
				vTint = tint;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in vec3 vTint;
			uniform vec3 sun;
			uniform int water;
			out vec4 color;
			void main() {
				vec3 n = normalize(vNormal);
				if (!gl_FrontFacing) n = -n;
				float lit = 0.32 + 0.68 * max(0.0, dot(n, normalize(sun)));
				if (water == 1) {
					color = vec4(pow(vec3(0.12, 0.32, 0.55) * lit, vec3(1.0 / 2.2)), 0.7);
					return;
				}
				color = vec4(pow(vTint * lit, vec3(1.0 / 2.2)), 1.0);
			}`;

			function compile(kind, source) {
				const shader = gl.createShader(kind);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);
				if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
					throw new Error(gl.getShaderInfoLog(shader) ?? "shader");
				return shader;
			}

			const program = gl.createProgram();
			gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SOURCE));
			gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SOURCE));
			gl.linkProgram(program);
			if (!gl.getProgramParameter(program, gl.LINK_STATUS))
				throw new Error(gl.getProgramInfoLog(program) ?? "link");
			const uViewProj = gl.getUniformLocation(program, "viewProj");
			const uSun = gl.getUniformLocation(program, "sun");
			const uWater = gl.getUniformLocation(program, "water");

			const vao = gl.createVertexArray();
			gl.bindVertexArray(vao);
			const positionBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
			gl.enableVertexAttribArray(0);
			gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
			const tintBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, tintBuffer);
			gl.enableVertexAttribArray(1);
			gl.vertexAttribPointer(1, 3, gl.UNSIGNED_BYTE, true, 0, 0);
			const normalBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
			gl.enableVertexAttribArray(2);
			gl.vertexAttribPointer(2, 3, gl.BYTE, true, 0, 0);

			let groundCount = 0;
			let waterFrom = 0;
			let waterCount = 0;
			let bounds = { x: 0, y: 0, z: 0, reach: 1, floor: 0 };

			/**
			 * What one hexagon is painted.
			 *
			 * **A hexagon takes the colour of the biome its climate lands in**,
			 * which is the whole page in one line. Under the water it takes the
			 * sea instead: there is no land there for a biome to be, and the
			 * diagram is about land.
			 */
			function cellTint(c) {
				const metres = field.height[c];
				if (metres <= TERRAIN.seaLevel) return BAND_COLORS[0];
				if (knobs.paint === "landform")
					return field.form[c] < 0
						? BAND_COLORS[0]
						: rgbOf(LANDFORMS[field.form[c]].hex);
				if (knobs.paint === "ground") {
					const over = metres - TERRAIN.seaLevel;
					if (over < GROUND_LINES.rock) return BAND_COLORS[1];
					if (over < GROUND_LINES.snow) return BAND_COLORS[2];
					return BAND_COLORS[3];
				}
				const which = field.biome[c];
				return which < 0 ? BAND_COLORS[0] : rgbOf(biomes[which].hex);
			}

			function buildMesh() {
				if (!field) return;
				const { count, degree, corner, ring, centre, frame, height, k } = field;
				const radius = k.radius;

				let room = count * 24 * 3;
				let position = new Float32Array(room * 3);
				let tint = new Uint8Array(room * 3);
				let normal = new Int8Array(room * 3);
				let vertices = 0;
				let loX = Infinity, hiX = -Infinity;
				let loY = Infinity, hiY = -Infinity;
				let loZ = Infinity, hiZ = -Infinity;
				const roomFor = () => {
					if (vertices + 3 <= room) return;
					room = Math.max(room * 2, vertices + 3);
					const a = new Float32Array(room * 3); a.set(position); position = a;
					const b = new Uint8Array(room * 3); b.set(tint); tint = b;
					const c = new Int8Array(room * 3); c.set(normal); normal = c;
				};

				const ringX = new Float64Array(6);
				const ringY = new Float64Array(6);
				const ringZ = new Float64Array(6);
				const localP = new Float64Array(3);
				const local = (dx, dy, dz, metres) => {
					const s = radius + metres;
					const rx = dx * s - centre[0] * radius;
					const ry = dy * s - centre[1] * radius;
					const rz = dz * s - centre[2] * radius;
					localP[0] = rx * frame.east[0] + ry * frame.east[1] + rz * frame.east[2];
					localP[1] = rx * frame.up[0] + ry * frame.up[1] + rz * frame.up[2];
					localP[2] = rx * frame.north[0] + ry * frame.north[1] + rz * frame.north[2];
					return localP;
				};

				let paint = [0, 0, 0];
				const triangle = (ax, ay, az, bx, by, bz, cx, cy, cz) => {
					const ux = bx - ax, uy = by - ay, uz = bz - az;
					const vx = cx - ax, vy = cy - ay, vz = cz - az;
					const nx = uy * vz - uz * vy;
					const ny = uz * vx - ux * vz;
					const nz = ux * vy - uy * vx;
					// `sqrt(x*x + y*y + z*z)`, never `Math.hypot`, which is a
					// library routine rather than an IEEE operation.
					const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
					const n8 = [
						Math.round((nx / len) * 127),
						Math.round((ny / len) * 127),
						Math.round((nz / len) * 127),
					];
					roomFor();
					const at = vertices * 3;
					for (let v = 0; v < 3; v++)
						for (let x = 0; x < 3; x++) {
							normal[at + v * 3 + x] = n8[x];
							tint[at + v * 3 + x] = Math.max(
								0,
								Math.min(255, Math.round(paint[x] * 255)),
							);
						}
					position[at] = ax; position[at + 1] = ay; position[at + 2] = az;
					position[at + 3] = bx; position[at + 4] = by; position[at + 5] = bz;
					position[at + 6] = cx; position[at + 7] = cy; position[at + 8] = cz;
					vertices += 3;
					if (ax < loX) loX = ax; if (ax > hiX) hiX = ax;
					if (bx < loX) loX = bx; if (bx > hiX) hiX = bx;
					if (cx < loX) loX = cx; if (cx > hiX) hiX = cx;
					if (ay < loY) loY = ay; if (ay > hiY) hiY = ay;
					if (by < loY) loY = by; if (by > hiY) hiY = by;
					if (cy < loY) loY = cy; if (cy > hiY) hiY = cy;
					if (az < loZ) loZ = az; if (az > hiZ) hiZ = az;
					if (bz < loZ) loZ = bz; if (bz > hiZ) hiZ = bz;
					if (cz < loZ) loZ = cz; if (cz > hiZ) hiZ = cz;
				};

				const cap = (c, metres) => {
					const deg = degree[c];
					let mx = 0, my = 0, mz = 0;
					for (let v = 0; v < deg; v++) {
						const p = local(
							corner[c * 18 + v * 3],
							corner[c * 18 + v * 3 + 1],
							corner[c * 18 + v * 3 + 2],
							metres,
						);
						ringX[v] = p[0]; ringY[v] = p[1]; ringZ[v] = p[2];
						mx += p[0] / deg; my += p[1] / deg; mz += p[2] / deg;
					}
					for (let v = 0; v < deg; v++) {
						const b = (v + 1) % deg;
						triangle(mx, my, mz, ringX[v], ringY[v], ringZ[v], ringX[b], ringY[b], ringZ[b]);
					}
				};

				/** One side of a cell, between two heights. */
				const side = (c, edge, high, low) => {
					const deg = degree[c];
					const a = ((edge - 1 + deg) % deg) * 3 + c * 18;
					const b = edge * 3 + c * 18;
					const t1 = local(corner[a], corner[a + 1], corner[a + 2], high);
					const ax = t1[0], ay = t1[1], az = t1[2];
					const t2 = local(corner[b], corner[b + 1], corner[b + 2], high);
					const bx = t2[0], by = t2[1], bz = t2[2];
					const t3 = local(corner[b], corner[b + 1], corner[b + 2], low);
					const cx = t3[0], cy = t3[1], cz = t3[2];
					const t4 = local(corner[a], corner[a + 1], corner[a + 2], low);
					triangle(ax, ay, az, bx, by, bz, cx, cy, cz);
					triangle(ax, ay, az, cx, cy, cz, t4[0], t4[1], t4[2]);
				};

				// ---- the ground ----
				const lip = field.span * 0.05;
				const sea = TERRAIN.seaLevel;
				for (let c = 0; c < count; c++) {
					const raw = cellTint(c);
					// A speckle off the cell's own address, so a band of one
					// biome reads as hexagons rather than as one flat sheet, and
					// nothing has to be stored to get it.
					const grain = 0.94 + 0.12 * hash3(c, field.biome[c], 7, field.seed + 3);
					paint = [raw[0] * grain, raw[1] * grain, raw[2] * grain];
					cap(c, height[c]);
					const deg = degree[c];
					for (let e = 0; e < deg; e++) {
						const nb = ring[c * 6 + e];
						const rim = nb < 0;
						const below = rim ? height[c] - lip : height[nb];
						if (below >= height[c]) continue;
						side(c, e, height[c], below);
					}
				}
				groundCount = vertices;

				// ---- the sea, last, so it blends over what is behind it ----
				waterFrom = vertices;
				paint = SEA_COLOR;
				for (let c = 0; c < count; c++) {
					if (height[c] >= sea) continue;
					cap(c, sea);
					const deg = degree[c];
					for (let e = 0; e < deg; e++)
						if (ring[c * 6 + e] < 0) side(c, e, sea, height[c]);
				}
				waterCount = vertices - waterFrom;

				bounds = {
					floor: hiY,
					x: (loX + hiX) / 2,
					y: (loY + hiY) / 2,
					z: (loZ + hiZ) / 2,
					reach:
						Math.sqrt((hiX - loX) ** 2 + (hiY - loY) ** 2 + (hiZ - loZ) ** 2) /
							2 || field.span,
				};

				gl.bindVertexArray(vao);
				for (const [buffer, data, wide] of [
					[positionBuffer, position, 3],
					[tintBuffer, tint, 3],
					[normalBuffer, normal, 3],
				]) {
					gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
					gl.bufferData(
						gl.ARRAY_BUFFER,
						data.subarray(0, vertices * wide),
						gl.DYNAMIC_DRAW,
					);
				}
				field.vertices = vertices;
			}

			function multiply(a, b) {
				const out = new Float32Array(16);
				for (let c = 0; c < 4; c++)
					for (let r = 0; r < 4; r++) {
						let s = 0;
						for (let i = 0; i < 4; i++) s += a[i * 4 + r] * b[c * 4 + i];
						out[c * 4 + r] = s;
					}
				return out;
			}

			function perspective(fov, aspect, near, far) {
				const f = 1 / Math.tan(fov / 2);
				const out = new Float32Array(16);
				out[0] = f / aspect;
				out[5] = f;
				out[10] = (far + near) / (near - far);
				out[11] = -1;
				out[14] = (2 * far * near) / (near - far);
				return out;
			}

			function lookAt(eye, to, upHint) {
				const f = [to[0] - eye[0], to[1] - eye[1], to[2] - eye[2]];
				const fl = Math.sqrt(f[0] ** 2 + f[1] ** 2 + f[2] ** 2) || 1;
				const z = f.map((v) => v / fl);
				let x = cross3(z, upHint);
				const xl = Math.sqrt(x[0] ** 2 + x[1] ** 2 + x[2] ** 2) || 1;
				x = x.map((v) => v / xl);
				const y = cross3(x, z);
				const out = new Float32Array(16);
				out[0] = x[0]; out[4] = x[1]; out[8] = x[2];
				out[1] = y[0]; out[5] = y[1]; out[9] = y[2];
				out[2] = -z[0]; out[6] = -z[1]; out[10] = -z[2];
				out[12] = -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]);
				out[13] = -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]);
				out[14] = z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2];
				out[15] = 1;
				return out;
			}

			const camera = { yaw: -0.7, pitch: 0.42, distance: 1.05, lift: 0 };

			function render() {
				const wide = view.clientWidth;
				const tall = view.clientHeight;
				const dpr = Math.min(2, window.devicePixelRatio || 1);
				view.width = Math.max(1, Math.round(wide * dpr));
				view.height = Math.max(1, Math.round(tall * dpr));
				gl.viewport(0, 0, view.width, view.height);
				gl.clearColor(0.027, 0.039, 0.055, 1);
				gl.enable(gl.DEPTH_TEST);
				gl.disable(gl.CULL_FACE);
				gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
				if (!field) return;
				const reach = bounds.reach;
				const away = reach * 2.4 * camera.distance;
				const eye = [
					bounds.x + Math.cos(camera.pitch) * Math.sin(camera.yaw) * away,
					Math.max(
						bounds.y + Math.sin(camera.pitch) * away + camera.lift * reach,
						bounds.floor + reach * 0.15,
					),
					bounds.z + Math.cos(camera.pitch) * Math.cos(camera.yaw) * away,
				];
				const proj = perspective(
					0.9,
					view.width / Math.max(1, view.height),
					Math.max(0.05, reach * 0.005),
					away + reach * 6,
				);
				const viewProj = multiply(
					proj,
					lookAt(eye, [bounds.x, bounds.y, bounds.z], [0, 1, 0]),
				);
				gl.useProgram(program);
				gl.bindVertexArray(vao);
				gl.uniformMatrix4fv(uViewProj, false, viewProj);
				gl.uniform3f(uSun, 0.42, 0.78, 0.46);
				gl.uniform1i(uWater, 0);
				gl.disable(gl.BLEND);
				gl.depthMask(true);
				gl.drawArrays(gl.TRIANGLES, 0, groundCount);
				if (waterCount > 0) {
					gl.uniform1i(uWater, 1);
					gl.enable(gl.BLEND);
					gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
					gl.depthMask(false);
					gl.drawArrays(gl.TRIANGLES, waterFrom, waterCount);
					gl.depthMask(true);
					gl.disable(gl.BLEND);
				}
			}

			// ---------------------------------------------------------------
			// The panel.
			// ---------------------------------------------------------------

			/** Write a preset's dots into the table, keeping them draggable. */
			function applyPreset(name) {
				const set = PRESETS[name];
				if (!set) return;
				biomes = set.map((b) => ({ landform: ANY, ...b }));
				regroup();
				picked = (allowed[shown] ?? [])[0] ?? 0;
			}

			function buildPanel() {
				const hostWorld = document.getElementById("knobsWorld");
				const hostBiomes = document.getElementById("knobsBiomes");
				for (const group of KNOBS) {
					const set = document.createElement("details");
					set.className = "group" + (group.tint ? " " + group.tint : "");
					set.open = group.open !== false;
					const legend = document.createElement("summary");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						const wrap = document.createElement("div");
						let input = null;
						let readout = null;
						if (row.type === "picture") {
							// A picture sits where the thing it shows is tuned,
							// so it is a row of the panel like any other.
							wrap.className = "knob pictured";
							const shot = SHOT_OF.get(row.shot);
							const holder = document.createElement("div");
							holder.className = "shot" + (group.tint ? " " + group.tint : "");
							const canvas = document.createElement("canvas");
							canvas.id = shot.id;
							const tag = document.createElement("b");
							tag.textContent = shot.name;
							holder.append(canvas, tag);
							wrap.append(holder);
							shot.canvas = canvas;
							shot.ctx = canvas.getContext("2d");
							watchShot(shot);
						} else {
							wrap.className = "knob";
							const label = document.createElement("label");
							label.textContent = row.label;
							if (row.type === "select") {
								input = document.createElement("select");
								for (const option of row.options) {
									const o = document.createElement("option");
									o.value = option;
									o.textContent = option;
									input.append(o);
								}
								input.value = knobs[row.key];
							} else if (row.type === "text") {
								input = document.createElement("input");
								input.type = "text";
								input.value = knobs[row.key];
							} else if (row.type === "check") {
								wrap.className = "knob check";
								input = document.createElement("input");
								input.type = "checkbox";
								input.checked = knobs[row.key];
							} else {
								input = document.createElement("input");
								input.type = "range";
								input.min = row.low;
								input.max = row.high;
								input.step = row.step;
								input.value = knobs[row.key];
							}
							readout = document.createElement("output");
							if (row.type === "check") wrap.append(input, label);
							else wrap.append(label, readout, input);
						}
						let note = null;
						if (row.note) {
							note = document.createElement("p");
							note.className = "knob-note";
							wrap.append(note);
						}
						set.append(wrap);
						rows.set(row.key, { row, wrap, input, readout, note });
						if (!input) continue;
						input.addEventListener("input", () => {
							if (row.type === "check") knobs[row.key] = input.checked;
							else if (row.type === "select" || row.type === "text")
								knobs[row.key] = input.value;
							else knobs[row.key] = Number(input.value);
							// **Picking a set writes its dots into the diagram**,
							// which is what makes the list a set of starting
							// points rather than a menu of results.
							if (row.key === "preset") {
								applyPreset(input.value);
								askForRecolor();
								writeUrl();
								return;
							}
							if (row.key === "paint" || row.key === "chartDots") {
								askForRecolor();
								writeUrl();
								return;
							}
							askForRedraw();
						});
					}
					(group.panel === "biomes" ? hostBiomes : hostWorld).append(set);
				}
			}

			function refreshPanel() {
				for (const { row, wrap, readout, input, note } of rows.values()) {
					if (row.type === "picture") {
						if (note) note.innerHTML = row.note();
						continue;
					}
					if (row.type === "check") {
						input.checked = knobs[row.key];
						readout.textContent = "";
					} else if (row.type === "select" || row.type === "text") {
						input.value = knobs[row.key];
						readout.textContent = "";
					} else {
						const live = liveRange(row);
						input.min = live.low;
						input.max = live.high;
						input.value = knobs[row.key];
						readout.textContent =
							Number(knobs[row.key]).toFixed(row.digits ?? 2) +
							(row.unit ? " " + row.unit : "");
					}
					if (note) note.innerHTML = row.note();
				}
				if (!field) return;
				const here = field.here >= 0 ? biomes[field.here] : null;
				let widest = 0;
				for (let n = 1; n < LANDFORMS.length; n++)
					if (field.byForm[n] > field.byForm[widest]) widest = n;
				document.getElementById("recipe").innerHTML =
					`<i class="b">${biomes.length}</i> biomes over ` +
					`<i class="b">${LANDFORMS.length}</i> landforms · ` +
					`<i class="b">${(field.landShare * 100).toFixed(1)}%</i> of the ` +
					`planet is land, most of it <i class="w">${LANDFORMS[widest].name}</i> · ` +
					`<i class="b">${field.reached}</i> biomes are ever built` +
					(here
						? ` · here it is mostly <i class="h">${here.name}</i>`
						: " · the patch is all sea");
				document.getElementById("facts").innerHTML =
					`patch <b>${Math.round(field.span).toLocaleString()} m</b> across, ` +
					`<b>${field.count.toLocaleString()}</b> hexagons · ` +
					`ground <b>${Math.round(field.lowest)}</b> to ` +
					`<b>${Math.round(field.highest)} m</b> · ` +
					`<b>${Math.round(cost)} ms</b>`;
			}

			// ---------------------------------------------------------------
			// The list.
			// ---------------------------------------------------------------

			const list = document.getElementById("list");

			/**
			 * The table as rows, which is where a biome is named and coloured.
			 *
			 * The share beside each one is read back off the planet rather than
			 * set: a dot is placed in the climate square, and how much ground
			 * that comes to depends on where the two fields actually go.
			 */
			function refreshList() {
				list.textContent = "";
				const share = field && field.worldShare ? field.worldShare : null;
				for (const n of allowed[shown] ?? []) {
					const b = biomes[n];
					const row = document.createElement("div");
					row.className = "biome" + (n === picked ? " picked" : "");
					const color = document.createElement("input");
					color.type = "color";
					color.value = "#" + b.hex;
					color.addEventListener("input", () => {
						b.hex = color.value.slice(1).toLowerCase();
						askForRecolor();
					});
					color.addEventListener("change", writeUrl);
					const name = document.createElement("input");
					name.type = "text";
					name.value = b.name;
					name.addEventListener("input", () => {
						b.name = name.value.replace(/[~|]/g, " ");
						drawChart();
						sayChart();
					});
					name.addEventListener("change", writeUrl);
					const says = document.createElement("span");
					says.className = "share";
					says.textContent = share ? (share[n] * 100).toFixed(1) + "%" : "";
					const drop = document.createElement("button");
					drop.className = "drop";
					drop.type = "button";
					drop.textContent = "×";
					drop.title = "remove this biome";
					drop.addEventListener("click", (e) => {
						e.stopPropagation();
						// **This ground must always have an answer**, so its last
						// biome cannot be removed: with no dots there is no
						// nearest one and every climate on it would name nothing.
						if ((allowed[shown] ?? []).length <= 1) return;
						biomes.splice(n, 1);
						picked = Math.min(picked, biomes.length - 1);
						askForRecolor();
						writeUrl();
					});
					row.addEventListener("click", () => {
						picked = n;
						refreshList();
						drawChart();
						sayChart();
					});
					row.append(color, name, says, drop);
					list.append(row);
				}
			}

			document.getElementById("add").addEventListener("click", () => {
				// A new dot lands in the middle of the square, where it is
				// visible and where dragging it somewhere useful is one move.
				// It belongs to the ground whose diagram is open, because that
				// is the one being edited.
				biomes.push({
					name: "New biome",
					hex: "b06fd0",
					t: 0.5,
					h: 0.5,
					landform: LANDFORMS[shown].key,
				});
				picked = biomes.length - 1;
				askForRecolor();
				writeUrl();
			});

			// ---------------------------------------------------------------
			// The tabs, and the grid that fills them.
			// ---------------------------------------------------------------

			const tabs = document.getElementById("tabs");
			const gridHost = document.getElementById("gridHost");

			/** One button per kind of ground, carrying its share of the land. */
			function refreshTabs() {
				tabs.textContent = "";
				for (let n = 0; n < LANDFORMS.length; n++) {
					const form = LANDFORMS[n];
					const button = document.createElement("button");
					button.type = "button";
					const set = allowed[n] ?? [];
					button.className =
						(n === shown ? "picked" : "") + (set.length === 0 ? " empty" : "");
					const swatch = document.createElement("span");
					swatch.className = "swatch";
					swatch.style.background = "#" + form.hex;
					const share =
						field && field.byForm ? (field.byForm[n] * 100).toFixed(1) + "%" : "";
					button.append(swatch, document.createTextNode(form.name + " " + share));
					button.title =
						set.length === 0
							? "no biome stands on this ground"
							: set.length + " biomes";
					button.addEventListener("click", () => {
						shown = n;
						const set2 = allowed[n] ?? [];
						if (!set2.includes(picked) && set2.length > 0) picked = set2[0];
						refreshTabs();
						refreshList();
						drawChart();
						sayChart();
					});
					tabs.append(button);
				}
			}

			/**
			 * The grid: which landform each combination of the three terrain
			 * indices is.
			 *
			 * One sheet per continentalness band, erosion down and peaks and
			 * valleys across, and the share of the planet's land in each cell
			 * written on it -- so a cell nothing falls in is visible rather than
			 * argued about. Clicking a cell opens that landform's diagram and
			 * points the select below at the cell, which is what changes it.
			 */
			let sheetShown = 1;

			function refreshGrid() {
				gridHost.textContent = "";
				const set = document.createElement("details");
				set.className = "group";
				set.open = true;
				const legend = document.createElement("summary");
				legend.textContent = "The landform grid";
				set.append(legend);

				const band = document.createElement("div");
				band.id = "tabs";
				for (let c = 0; c < 3; c++) {
					const button = document.createElement("button");
					button.type = "button";
					button.textContent = CONT_NAMES[c];
					button.className = c === sheetShown ? "picked" : "";
					button.addEventListener("click", () => {
						sheetShown = c;
						refreshGrid();
					});
					band.append(button);
				}
				set.append(band);

				const sheet = document.createElement("div");
				sheet.className = "sheet";
				const corner = document.createElement("div");
				corner.className = "corner";
				sheet.append(corner);
				for (let p = 0; p < 5; p++) {
					const head = document.createElement("div");
					head.className = "corner";
					head.textContent = PV_NAMES[p];
					sheet.append(head);
				}
				for (let e = 0; e < 5; e++) {
					const edge = document.createElement("div");
					edge.className = "edge";
					edge.textContent = ERO_NAMES[e];
					sheet.append(edge);
					for (let p = 0; p < 5; p++) {
						const at = gridAt(sheetShown, e, p);
						const form = LANDFORMS[grid[at]];
						const button = document.createElement("button");
						button.type = "button";
						button.style.background = "#" + form.hex;
						button.className = at === cellPicked ? "picked" : "";
						const share =
							field && field.inCell
								? (field.inCell[at] * 100).toFixed(1) + "%"
								: "";
						button.innerHTML = form.short + "<small>" + share + "</small>";
						button.title = `${CONT_NAMES[sheetShown]}, ${
							["sharpest", "sharp", "middling", "worn", "worn flat"][e]
						}, ${["valley", "low", "middling", "high", "peak"][p]} → ${form.name}`;
						button.addEventListener("click", () => {
							cellPicked = at;
							shown = grid[at];
							const set2 = allowed[shown] ?? [];
							if (!set2.includes(picked) && set2.length > 0) picked = set2[0];
							refreshTabs();
							refreshGrid();
							refreshList();
							drawChart();
							sayChart();
						});
						sheet.append(button);
					}
				}
				set.append(sheet);

				const foot = document.createElement("div");
				foot.className = "sheet-foot";
				foot.innerHTML = "<span>valley</span><span>peaks &amp; valleys</span><span>peak</span>";
				set.append(foot);

				const wrap = document.createElement("div");
				wrap.className = "knob";
				const label = document.createElement("label");
				label.textContent = "That cell is";
				const pick = document.createElement("select");
				for (let n = 0; n < LANDFORMS.length; n++) {
					const o = document.createElement("option");
					o.value = String(n);
					o.textContent = LANDFORMS[n].name;
					pick.append(o);
				}
				pick.value = String(grid[cellPicked]);
				pick.addEventListener("input", () => {
					grid[cellPicked] = Number(pick.value);
					shown = grid[cellPicked];
					askForRecolor();
					writeUrl();
				});
				wrap.append(label, document.createElement("output"), pick);
				const note = document.createElement("p");
				note.className = "knob-note";
				note.innerHTML =
					"the three curves' answers, cut into indices — <b>Shore</b> is not " +
					"in the grid, because it is a height rather than a combination of " +
					"the three";
				wrap.append(note);
				set.append(wrap);
				gridHost.append(set);
			}

			// ---------------------------------------------------------------
			// Boot.
			// ---------------------------------------------------------------

			/** What the planet-wide count comes to, held on the patch. */
			function measure() {
				const read = shares();
				field.worldShare = read.share;
				field.byForm = read.byForm;
				field.inCell = read.inCell;
				field.landShare = read.land;
				let reached = 0;
				for (const v of read.share) if (v > 0) reached++;
				field.reached = reached;
			}

			let pending = false;
			let settleTimer = 0;

			/** Everything, because a row that samples the world moved. */
			function askForRedraw(draft = true) {
				clearTimeout(settleTimer);
				if (draft) settleTimer = setTimeout(() => askForRedraw(false), 220);
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					settle();
					generate(draft ? Math.max(16, knobs.cells >> 1) : knobs.cells);
					measure();
					buildMesh();
					drawPictures();
					drawChart();
					cost = performance.now() - started;
					refreshPanel();
					refreshTabs();
					refreshList();
					refreshGrid();
					sayChart();
					if (!draft) writeUrl();
					render();
				});
			}

			/**
			 * Everything a dot on the diagram touches, which is not the fields.
			 *
			 * Temperature, humidity and the push are functions of the seed and
			 * the rows on the other panel; a dot only decides which name the
			 * finished pair of numbers is given. So dragging one recolours a
			 * planet already sampled, and the map keeps up with the finger.
			 */
			function askForRecolor() {
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					assign();
					measure();
					buildMesh();
					drawPictures();
					drawChart();
					cost = performance.now() - started;
					refreshPanel();
					refreshTabs();
					refreshList();
					refreshGrid();
					sayChart();
					render();
				});
			}

			// The knobs open and shut on a phone; on a desktop the buttons are
			// not on the page at all and this never runs.
			const drawer = (buttonId, bodyClass, label) => {
				const button = document.getElementById(buttonId);
				button.addEventListener("click", () => {
					const open = document.body.classList.toggle(bodyClass);
					button.setAttribute("aria-expanded", String(open));
					button.textContent = open ? "Close" : label;
				});
			};
			drawer("toggleWorld", "knobs", "World");
			drawer("toggleBiomes", "biomes", "Biomes");

			let dragging = null;
			view.addEventListener("pointerdown", (e) => {
				dragging = { x: e.clientX, y: e.clientY, shift: e.shiftKey };
				view.setPointerCapture(e.pointerId);
			});
			view.addEventListener("pointermove", (e) => {
				if (!dragging) return;
				const dx = e.clientX - dragging.x;
				const dy = e.clientY - dragging.y;
				dragging.x = e.clientX;
				dragging.y = e.clientY;
				if (dragging.shift) camera.lift += dy * 0.002;
				else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(-0.2, Math.min(1.5, camera.pitch + dy * 0.005));
				}
				render();
			});
			const stop = () => {
				dragging = null;
			};
			view.addEventListener("pointerup", stop);
			view.addEventListener("pointercancel", stop);
			view.addEventListener(
				"wheel",
				(e) => {
					e.preventDefault();
					camera.distance = Math.max(
						0.05,
						Math.min(6, camera.distance * Math.exp(e.deltaY * 0.001)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", render);

			{
				// **A preset is read before the rows under it**, because reading
				// one writes the very dots a link was written to carry.
				const params = new URLSearchParams(location.search);
				const named = params.get("preset");
				if (named && PRESETS[named]) {
					knobs.preset = named;
					applyPreset(named);
				}
				fromParams(params);
			}
			// The finished map is in the panel's head rather than in a row, so
			// it is wired up here rather than by the row that draws a picture.
			SHOTS[0].canvas = document.getElementById("shotBiome");
			SHOTS[0].ctx = SHOTS[0].canvas.getContext("2d");
			watchShot(SHOTS[0]);
			buildPanel();
			const booted = performance.now();
			regroup();
			// The panel opens on one kind of ground, so the biome it says it is
			// editing has to be one of that ground's own.
			if (!(allowed[shown] ?? []).includes(picked))
				picked = (allowed[shown] ?? [])[0] ?? 0;
			settle();
			generate();
			measure();
			buildMesh();
			drawPictures();
			drawChart();
			cost = performance.now() - booted;
			refreshPanel();
			refreshTabs();
			refreshList();
			refreshGrid();
			sayChart();
			render();
		</script>
	</body>
</html>
