<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Biomes lab — climate, and the diagram that reads it</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #e8ecf2;
				--dim: #8b95a4;
				--panel: #12161d;
				--edge: #232b36;
				--live: #6fd0ff;
				--heat: #ff9d6b;
				--wet: #6fe0c0;
				--wild: #c79dff;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #070a0e;
				color: var(--ink);
				font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#view {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				touch-action: none;
				cursor: grab;
			}
			#view:active {
				cursor: grabbing;
			}
			/* **Two panels, one on each side of the view.** The left one is the
			   planet -- where the patch is standing, what the ground does, and
			   the two climate fields read off it -- and carries the finished
			   map, which is what everything else is judged against. The right
			   one is the diagram: where each biome sits in temperature and
			   humidity, and nothing else. */
			#panelWorld,
			#panelBiomes {
				position: fixed;
				top: 0;
				bottom: 0;
				width: 340px;
				display: flex;
				flex-direction: column;
				background: rgba(18, 22, 29, 0.94);
				backdrop-filter: blur(6px);
			}
			#panelWorld {
				left: 0;
				border-right: 1px solid var(--edge);
			}
			#panelBiomes {
				right: 0;
				border-left: 1px solid var(--edge);
			}
			.head {
				flex: 0 0 auto;
				padding: 10px 14px 8px;
				border-bottom: 1px solid var(--edge);
			}
			.scroller {
				flex: 1 1 auto;
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 0 14px 24px;
			}
			.head h1 {
				font-size: 14px;
				margin: 0 0 6px;
				letter-spacing: 0.01em;
			}
			/* A picture sits where the thing it shows is tuned. */
			.shot {
				position: relative;
				line-height: 0;
				margin: 6px 0 0;
			}
			.shot canvas {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 3px;
				image-rendering: pixelated;
				background: #0b0e13;
				cursor: crosshair;
			}
			.shot b {
				position: absolute;
				left: 4px;
				top: 4px;
				font: 600 9.5px/1.4 system-ui, sans-serif;
				letter-spacing: 0.02em;
				padding: 1px 4px;
				border-radius: 2px;
				color: #12161d;
				background: var(--live);
				pointer-events: none;
			}
			.shot.heat b {
				background: var(--heat);
			}
			.shot.wet b {
				background: var(--wet);
			}
			.shot.wild b {
				background: var(--wild);
			}
			.group > summary > .switch {
				accent-color: var(--live);
				margin: 0 6px 0 0;
				vertical-align: -1px;
			}
			/* The enlarged picture. A field at panel width shows where its
			   features are; at this size it shows what they look like. */
			#big {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(4, 6, 9, 0.88);
				backdrop-filter: blur(3px);
				cursor: zoom-out;
			}
			#big[hidden] {
				display: none;
			}
			#big figure {
				margin: 0;
				max-width: 94vw;
				max-height: 94vh;
			}
			#big canvas {
				display: block;
				max-width: 94vw;
				max-height: 86vh;
				border: 1px solid var(--edge);
				border-radius: 4px;
				image-rendering: pixelated;
				background: #0b0e13;
			}
			#big figcaption {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 16px;
				margin-top: 8px;
				font-size: 12px;
				color: var(--dim);
			}
			#big figcaption b {
				color: var(--ink);
				font-size: 13px;
				letter-spacing: 0.02em;
			}
			#facts {
				color: var(--dim);
				font-size: 11px;
				margin: 7px 0 0;
			}
			#facts b {
				color: var(--ink);
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			#recipe {
				margin: 6px 0 0;
				padding: 5px 6px;
				border: 1px solid var(--edge);
				border-radius: 3px;
				background: #0b0e13;
				color: var(--dim);
				font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
			}
			#recipe i {
				font-style: normal;
				font-weight: 600;
			}
			#recipe .h {
				color: var(--heat);
			}
			#recipe .w {
				color: var(--wet);
			}
			#recipe .b {
				color: var(--live);
			}
			.group {
				border-top: 1px solid var(--edge);
				margin: 10px 0 0;
				padding: 0 0 6px;
			}
			.group > summary {
				padding: 8px 0 4px;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				cursor: pointer;
				list-style: none;
				user-select: none;
			}
			.group > summary::-webkit-details-marker {
				display: none;
			}
			.group > summary::before {
				content: "▸ ";
				color: var(--edge);
			}
			.group[open] > summary::before {
				content: "▾ ";
			}
			.group > summary:hover {
				color: var(--live);
			}
			.group.heat > summary {
				color: var(--heat);
			}
			.group.wet > summary {
				color: var(--wet);
			}
			.group.wild > summary {
				color: var(--wild);
			}
			.knob[hidden] {
				display: none;
			}
			.knob {
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: center;
				gap: 2px 8px;
				margin: 7px 0;
			}
			.knob label {
				font-size: 12px;
			}
			.knob output {
				font-variant-numeric: tabular-nums;
				color: var(--live);
				font-size: 11.5px;
			}
			.knob-note {
				grid-column: 1 / -1;
				font-size: 10.5px;
				color: var(--dim);
				margin: 1px 0 0;
			}
			.knob-note b {
				color: var(--live);
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			.knob input[type="range"],
			.knob select,
			.knob input[type="text"] {
				grid-column: 1 / -1;
				width: 100%;
				accent-color: var(--live);
			}
			.knob select,
			.knob input[type="text"] {
				background: #0b0e13;
				color: var(--ink);
				border: 1px solid var(--edge);
				border-radius: 3px;
				padding: 3px 5px;
				font: inherit;
			}
			.knob.pictured {
				grid-template-columns: 1fr;
				margin: 9px 0 4px;
			}
			.knob.check {
				grid-template-columns: auto 1fr;
			}
			.knob.check input {
				grid-column: auto;
				width: auto;
			}
			/* **The diagram is the tool, so it is the first thing in its own
			   panel and it does not scroll away.** Every biome is a dot on it
			   and dragging one is the edit; the list underneath names them. */
			#chart {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 3px;
				touch-action: none;
				cursor: crosshair;
			}
			.axis {
				display: flex;
				justify-content: space-between;
				font-size: 9.5px;
				line-height: 1.4;
				color: var(--dim);
				margin: 3px 0 0;
				font-variant-numeric: tabular-nums;
			}
			#chartsays {
				font-size: 10.5px;
				color: var(--dim);
				margin: 4px 0 0;
			}
			#chartsays b {
				color: var(--live);
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			.list {
				margin: 10px 0 0;
			}
			.biome {
				display: grid;
				grid-template-columns: auto 1fr auto auto;
				align-items: center;
				gap: 6px;
				padding: 3px 4px;
				border: 1px solid transparent;
				border-radius: 3px;
				cursor: pointer;
			}
			.biome.picked {
				border-color: var(--live);
				background: rgba(111, 208, 255, 0.08);
			}
			.biome input[type="color"] {
				width: 22px;
				height: 18px;
				padding: 0;
				border: 1px solid var(--edge);
				border-radius: 2px;
				background: none;
			}
			.biome input[type="text"] {
				background: none;
				border: 0;
				color: var(--ink);
				font: inherit;
				padding: 1px 2px;
				min-width: 0;
			}
			.biome input[type="text"]:focus {
				background: #0b0e13;
				outline: 1px solid var(--edge);
			}
			.biome .share {
				font-variant-numeric: tabular-nums;
				font-size: 10.5px;
				color: var(--dim);
			}
			.biome .drop {
				background: none;
				border: 0;
				color: var(--dim);
				cursor: pointer;
				font: 13px/1 system-ui, sans-serif;
				padding: 0 2px;
			}
			.biome .drop:hover {
				color: #ff7a7a;
			}
			#add {
				margin: 8px 0 0;
				width: 100%;
				padding: 5px;
				border: 1px dashed var(--edge);
				border-radius: 3px;
				background: none;
				color: var(--dim);
				font: inherit;
				cursor: pointer;
			}
			#add:hover {
				color: var(--live);
				border-color: var(--live);
			}
			#tabs {
				display: flex;
				flex-wrap: wrap;
				gap: 3px;
				margin: 0 0 6px;
			}
			#tabs button {
				flex: 1 1 auto;
				padding: 3px 5px;
				border: 1px solid var(--edge);
				border-radius: 3px;
				background: #0b0e13;
				color: var(--dim);
				font: 10.5px/1.3 system-ui, sans-serif;
				cursor: pointer;
				white-space: nowrap;
			}
			#tabs button .swatch {
				display: inline-block;
				width: 7px;
				height: 7px;
				border-radius: 1px;
				margin-right: 4px;
				vertical-align: 0;
			}
			#tabs button.picked {
				border-color: var(--live);
				color: var(--ink);
				background: rgba(111, 208, 255, 0.1);
			}
			#tabs button.empty {
				color: #ff7a7a;
			}
			.sheet {
				display: grid;
				grid-template-columns: 16px repeat(5, 1fr);
				gap: 2px;
				margin: 4px 0 0;
			}
			.sheet button {
				padding: 6px 0 4px;
				border: 1px solid var(--edge);
				border-radius: 2px;
				color: #12161d;
				font: 600 9px/1.2 system-ui, sans-serif;
				cursor: pointer;
				overflow: hidden;
			}
			.sheet button.picked {
				outline: 2px solid var(--live);
				outline-offset: -2px;
			}
			.sheet button small {
				display: block;
				font-weight: 400;
				font-size: 8px;
				opacity: 0.75;
			}
			.sheet .edge {
				font-size: 8px;
				color: var(--dim);
				display: flex;
				align-items: center;
				justify-content: center;
				writing-mode: vertical-rl;
				transform: rotate(180deg);
			}
			.sheet .corner {
				font-size: 8px;
				color: var(--dim);
			}
			.sheet-foot {
				display: flex;
				justify-content: space-between;
				font-size: 8.5px;
				color: var(--dim);
				margin: 2px 0 0 18px;
			}
			#hint {
				position: fixed;
				left: 12px;
				bottom: 10px;
				color: var(--dim);
				font-size: 11.5px;
				pointer-events: none;
			}
			/* **On a phone each panel is shut and there is a button to open
			   it.** Each panel is 340 px of knobs and a phone is 390 px wide, so
			   left open one is the page and the view is a strip above it. */
			#toggleWorld,
			#toggleBiomes {
				display: none;
			}
			@media (max-width: 760px) {
				#panelWorld,
				#panelBiomes {
					width: 100%;
					top: auto;
					height: 68%;
					border-left: 0;
					border-right: 0;
					border-top: 1px solid var(--edge);
					transform: translateY(100%);
					transition: transform 0.22s ease;
				}
				body.knobs #panelWorld,
				body.biomes #panelBiomes {
					transform: none;
				}
				#toggleWorld,
				#toggleBiomes {
					display: block;
					position: fixed;
					bottom: 12px;
					z-index: 12;
					padding: 9px 15px;
					border: 1px solid var(--edge);
					border-radius: 999px;
					background: rgba(18, 22, 29, 0.94);
					backdrop-filter: blur(6px);
					color: var(--live);
					font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
					letter-spacing: 0.02em;
					transition: bottom 0.22s ease;
				}
				#toggleWorld {
					left: 12px;
				}
				#toggleBiomes {
					right: 12px;
				}
				body.knobs #toggleWorld {
					bottom: calc(68% + 12px);
				}
				body.biomes #toggleBiomes {
					bottom: calc(68% + 12px);
				}
				#hint {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="view"></canvas>
		<div id="hint">drag to turn · wheel to zoom · shift-drag to raise the eye</div>
		<button
			id="toggleWorld"
			type="button"
			aria-controls="panelWorld"
			aria-expanded="false"
		>
			World
		</button>
		<button
			id="toggleBiomes"
			type="button"
			aria-controls="panelBiomes"
			aria-expanded="false"
		>
			Biomes
		</button>
		<!-- **The finished map is in the head of the world panel**, because it
		     is what the diagram on the other side is being judged against and it
		     must not scroll away from either. -->
		<div id="panelWorld">
			<div class="head">
				<h1>Biomes lab</h1>
				<div class="shot"><canvas id="shotBiome"></canvas><b>Biomes</b></div>
				<div id="recipe"></div>
				<div id="facts"></div>
			</div>
			<div class="scroller">
				<div id="knobsWorld"></div>
			</div>
		</div>
		<div id="panelBiomes">
			<div class="head">
				<h1>Biomes</h1>
				<!-- **The terrain decides the landform, and the diagram only
				     names it.** One tab per kind of ground, each with its own
				     partition of the same square, so a biome placed here can
				     only ever be built on this kind of ground. -->
				<div id="tabs"></div>
				<canvas id="chart" width="300" height="300"></canvas>
				<div class="axis"><span>dry</span><span>wet</span></div>
				<div id="chartsays"></div>
			</div>
			<div class="scroller">
				<div class="list" id="list"></div>
				<button id="add" type="button">add a biome</button>
				<div id="gridHost"></div>
				<div id="knobsBiomes"></div>
			</div>
		</div>
		<div id="big" hidden>
			<figure>
				<canvas id="bigShot"></canvas>
				<figcaption>
					<b id="bigName"></b>
					<span>click anywhere, or press Escape, to close</span>
				</figcaption>
			</figure>
		</div>

		<script>
			"use strict";

			// ===== BEGIN engine noise kernel =====
			// A hand port of packages/engine/src/generation/noise. A demo here
			// carries no imports and no build step, so this is a copy -- and a
			// copy that has drifted from the engine is a lab that teaches the
			// wrong lesson, which is why
			// packages/engine/tests/demos/multiNoiseLab.test.ts digests this
			// block against the real functions.
			/** `2^32`, the divisor that turns a `uint32` into a fraction of one. */
			const U32 = 4294967296;

			/** Three integer coordinates and a seed, mixed into `[0, 1)`. */
			function hash3(x, y, z, seed) {
				let h =
					(Math.imul(x | 0, 374761393) +
						Math.imul(y | 0, 668265263) +
						Math.imul(z | 0, 1274126177) +
						Math.imul(seed | 0, 1013904223)) >>>
					0;
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				h = (h ^ (h >>> 16)) >>> 0;
				return h / U32;
			}

			/** A seed someone typed, reduced to the `uint32` the hash takes. */
			function seedFromString(text) {
				let h = 2166136261 >>> 0;
				for (let i = 0; i < text.length; i++) {
					h = (h ^ text.charCodeAt(i)) >>> 0;
					h = Math.imul(h, 16777619) >>> 0;
				}
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				return (h ^ (h >>> 16)) >>> 0;
			}

			/**
			 * The quintic curve, `6t^5 - 15t^4 + 10t^3`.
			 *
			 * Zero in the first and second derivative at both ends, so a normal
			 * has no crease where one lattice cell meets the next. Smoothstep is
			 * flat in the first derivative only and leaves a curvature jump at
			 * every lattice plane, which shading draws as a grid.
			 */
			function fade(t) {
				return t * t * t * (t * (t * 6 - 15) + 10);
			}

			/** Trilinear value noise, in `[-1, 1]`. */
			function valueNoise3(px, py, pz, seed) {
				const xi = Math.floor(px);
				const yi = Math.floor(py);
				const zi = Math.floor(pz);
				const u = fade(px - xi);
				const v = fade(py - yi);
				const w = fade(pz - zi);
				let s = 0;
				for (let c = 0; c < 8; c++) {
					const dx = c & 1;
					const dy = (c >> 1) & 1;
					const dz = (c >> 2) & 1;
					const wx = dx ? u : 1 - u;
					const wy = dy ? v : 1 - v;
					const wz = dz ? w : 1 - w;
					s += wx * wy * wz * hash3(xi + dx, yi + dy, zi + dz, seed);
				}
				return s * 2 - 1;
			}

			const OCTAVE_SPREAD = 1000;
			const RIDGE_GAIN = 2.2;

			/**
			 * Every octave's own offset, worked out once per seed instead of per
			 * sample.
			 *
			 * **An octave's offset is a property of the octave and the seed, and
			 * of nothing else** -- it never depended on the point being sampled,
			 * and computing it inside the sampling loop meant three hashes a
			 * sample thrown away. Bit for bit the same number: the stored value
			 * is exactly the `(2 * hash - 1) * OCTAVE_SPREAD` the loop used to
			 * compute, and the settings' own offset is still added at the point
			 * of use.
			 */
			const OCTAVE_OFFSETS = new Map();

			function offsetsFor(seed, octaves) {
				const held = OCTAVE_OFFSETS.get(seed);
				if (held && held.length >= octaves * 3) return held;
				const made = new Float64Array(octaves * 3);
				for (let o = 0; o < octaves; o++) {
					made[o * 3] = (2 * hash3(o, 0, 0, seed) - 1) * OCTAVE_SPREAD;
					made[o * 3 + 1] = (2 * hash3(o, 1, 0, seed) - 1) * OCTAVE_SPREAD;
					made[o * 3 + 2] = (2 * hash3(o, 2, 0, seed) - 1) * OCTAVE_SPREAD;
				}
				OCTAVE_OFFSETS.set(seed, made);
				return made;
			}

			/**
			 * Octaves of value noise with the panel's own parameters, in
			 * `[-1, 1]`.
			 *
			 * Every octave gets its own hashed offset, or two octaves of one
			 * seeded lattice share zero crossings wherever their frequencies land
			 * near a whole multiple and the ground grows a repeating grain.
			 * Octaves accumulate low frequency first, because floating-point
			 * addition is not associative -- the other order moves the result by
			 * `1.4e-17` at four and five octaves and by nothing at six and
			 * eight, which is the kind of error testing never finds. And the sum
			 * is divided by the total amplitude, so adding an octave adds detail
			 * without making the world taller.
			 *
			 * **`ridge` folds each octave at its own zero crossing**, and that
			 * fold is the only place a crease can come from: every octave of a
			 * plain sum is smooth in its first and second derivative, so every
			 * summit a plain sum builds is a dome. At `0` the sum is returned
			 * bit for bit.
			 *
			 * **It creases a whole layer at once**, moving the character of
			 * every place in that layer together, so it belongs to a layer that
			 * already says *where* -- fold the layer that decides a coastline
			 * and every coastline on the planet is creased.
			 */
			function octaveNoise(x, y, z, seed, s) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = s.frequency;
				let weight = 1;
				const ridge = s.ridge;
				const spread = offsetsFor(seed, s.octaves);
				for (let o = 0; o < s.octaves; o++) {
					const ox = spread[o * 3] + s.offsetX;
					const oy = spread[o * 3 + 1] + s.offsetY;
					const oz = spread[o * 3 + 2];
					const n = valueNoise3(x * f + ox, y * f + oy, z * f + oz, seed);
					let signal = n;
					if (ridge > 0) {
						// **The fold's crest moves; the two shapes are never
						// mixed.** Folding at the zero crossing and blending
						// that against the plain octave adds an even function to
						// an odd one, and the two disagree about which end is
						// high -- plain noise peaks at `n = 1` and a fold peaks
						// at `n = 0` -- so on the positive side they cancel.
						// Measured over the planet, the spread of the top tenth
						// against the bottom tenth ran `1 : 3.34` at a fold of
						// 0.35 and the maximum fell to 0.338 against the plain
						// sum's 0.807. One shape whose crest slides instead: the
						// field reaches +1 at the crest and -1 at the far end at
						// every setting, and both ends are the arithmetic they
						// always were.
						const pivot = 1 - ridge;
						const away = Math.abs(n - pivot) / (1 + pivot);
						const crease = (1 - away) * (1 - ridge * away);
						signal = crease * 2 - 1;
						signal *= weight;
						weight = Math.min(
							1,
							Math.max(0, 1 - ridge + ridge * crease * RIDGE_GAIN),
						);
					}
					sum += amplitude * signal;
					total += amplitude;
					amplitude *= s.persistence;
					f *= s.lacunarity;
				}
				if (s.normalise === false) return sum;
				return total > 0 ? sum / total : 0;
			}
			// ===== END engine noise kernel =====

			// ===== BEGIN engine coarse grid =====
			// A hand port of packages/engine/src/addressing. Same reason the
			// noise above is a copy: a demo here carries no imports and no build
			// step, and packages/engine/tests/demos/multiNoiseLab.test.ts runs
			// this block against the real functions, so a copy that has drifted
			// fails a test rather than drawing a world the engine does not build.
			//
			// **The patch is the engine's own lattice**, not a hex grid that
			// looks like one: the cells come from `positionToCell`, the ring
			// from `neighbour`, and the hexagons from `cellCorners`. Porting the
			// lab into the engine is deleting this block and importing the six
			// names it defines.

			/** The golden ratio, which is what puts the twelve vertices where they are. */
			const PHI = (1 + Math.sqrt(5)) / 2;

			/** Three components divided by their own length. */
			function normalize3(v) {
				const l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
				return [v[0] / l, v[1] / l, v[2] / l];
			}

			/**
			 * The twelve icosahedron vertices, as unit directions.
			 *
			 * A cell sits on a vertex of the subdivided icosahedron, so these
			 * twelve are the twelve pentagons at every depth and in every world.
			 * The order is fixed: vertices 0 and 3 carry the coordinate poles and
			 * vertex 11 carries the prime meridian.
			 */
			const VERTICES = [
				[-1, PHI, 0],
				[1, PHI, 0],
				[-1, -PHI, 0],
				[1, -PHI, 0],
				[0, -1, PHI],
				[0, 1, PHI],
				[0, -1, -PHI],
				[0, 1, -PHI],
				[PHI, 0, -1],
				[PHI, 0, 1],
				[-PHI, 0, -1],
				[-PHI, 0, 1],
			].map(normalize3);

			/**
			 * The twenty faces, each three indices into the vertex table.
			 *
			 * Every triple runs counter-clockwise seen from outside the sphere,
			 * so a direction table written in one face's frame means the same
			 * turn on all twenty.
			 */
			const FACES = [
				[0, 11, 5],
				[0, 5, 1],
				[0, 1, 7],
				[0, 7, 10],
				[0, 10, 11],
				[1, 5, 9],
				[5, 11, 4],
				[11, 10, 2],
				[10, 7, 6],
				[7, 1, 8],
				[3, 9, 4],
				[3, 4, 2],
				[3, 2, 6],
				[3, 6, 8],
				[3, 8, 9],
				[4, 9, 5],
				[2, 4, 11],
				[6, 2, 10],
				[8, 6, 7],
				[9, 8, 1],
			];

			/**
			 * The direction of each face's centroid.
			 *
			 * The perpendicular bisector between two adjacent centroids contains
			 * the edge those faces share, so the nearest centroid to a direction
			 * names the face that direction falls in, exactly.
			 */
			const FACE_CENTROIDS = FACES.map(([a, b, c]) =>
				normalize3([
					VERTICES[a][0] + VERTICES[b][0] + VERTICES[c][0],
					VERTICES[a][1] + VERTICES[b][1] + VERTICES[c][1],
					VERTICES[a][2] + VERTICES[b][2] + VERTICES[c][2],
				]),
			);

			/**
			 * The six lattice steps, counter-clockwise seen from outside.
			 *
			 * Index 0 is the step from the face's vertex `A` toward `B`, the
			 * offset `(+1, 0)`. That anchor is a property of the cell's own face,
			 * so it never depends on how the cell was reached.
			 */
			const DIRECTIONS = [
				[1, 0],
				[0, 1],
				[-1, 1],
				[-1, 0],
				[0, -1],
				[1, -1],
			];

			/**
			 * For each face, where each of its three edges leads.
			 *
			 * Twenty faces times three edges is sixty entries, each a face number
			 * and an edge number: 180 bytes for every seam on the planet. Edge
			 * `e` runs from vertex `e` to vertex `(e + 1) % 3`. Every matched
			 * pair is traversed in opposite directions by its two faces, which is
			 * the signature of consistent outward winding, so no orientation flag
			 * is stored.
			 */
			const FACE_ADJACENCY = FACES.map((f, at) =>
				[0, 1, 2].map((e) => {
					const a = f[e];
					const b = f[(e + 1) % 3];
					for (let g = 0; g < 20; g++) {
						if (g === at) continue;
						for (let other = 0; other < 3; other++) {
							const c = FACES[g][other];
							const d = FACES[g][(other + 1) % 3];
							if ((a === c && b === d) || (a === d && b === c))
								return { face: g, edge: other };
						}
					}
					throw new Error(`face ${at} edge ${e} has no neighbour`);
				}),
			);

			/**
			 * Turn a set of weights on global vertex numbers into an offset on
			 * `face`.
			 *
			 * The weights need not be whole. A lattice point carries integers and
			 * a droplet standing between cells carries the fractions between
			 * them, and both are the same three numbers attached to the same
			 * three vertices.
			 */
			function offsetOn(face, weights) {
				const ids = FACES[face];
				let total = 0;
				const w = ids.map((v) => {
					const x = weights.get(v) ?? 0;
					total += x;
					return x;
				});
				if (total === 0) return null;
				for (const v of weights.keys()) if (!ids.includes(v)) return null;
				return { face, i: w[1], j: w[2] };
			}

			/**
			 * The barycentric weights of a lattice point on its face's vertices.
			 *
			 * Written this way a lattice point is a set of integer weights
			 * attached to global vertex numbers, and that description never
			 * mentions a face.
			 */
			function latticeWeights(n, i, j) {
				return [n - i - j, i, j];
			}

			/**
			 * The direction of lattice point `(i, j)` on `face`, at `n = 2^level`.
			 *
			 * One barycentric blend evaluated once at full depth, then one
			 * normalize. Building the same point by repeated arc-midpoint
			 * subdivision lands on a different sphere, 38.97 m out on a 1,700 m
			 * planet, and the error is fixed in metres rather than shrinking with
			 * depth.
			 */
			function latticePosition(face, n, i, j) {
				const [ia, ib, ic] = FACES[face];
				const [wa, wb, wc] = latticeWeights(n, i, j);
				const a = VERTICES[ia];
				const b = VERTICES[ib];
				const c = VERTICES[ic];
				return normalize3([
					a[0] * wa + b[0] * wb + c[0] * wc,
					a[1] * wa + b[1] * wb + c[1] * wc,
					a[2] * wa + b[2] * wb + c[2] * wc,
				]);
			}

			/**
			 * Every face-and-offset pair that names the same lattice point.
			 *
			 * A point strictly inside a face has one. A point on a face edge has
			 * two, and a point at an icosahedron vertex has five, since five
			 * faces meet there. The point is found by matching weights against
			 * global vertex numbers, so no geometry is involved.
			 */
			function cellRepresentations(face, n, i, j) {
				const w = latticeWeights(n, i, j);
				const ids = FACES[face];
				const carried = new Map();
				for (let x = 0; x < 3; x++) if (w[x] > 0) carried.set(ids[x], w[x]);
				const out = [];
				for (let g = 0; g < 20; g++) {
					const gv = FACES[g];
					let ok = true;
					for (const v of carried.keys()) if (!gv.includes(v)) ok = false;
					if (!ok) continue;
					out.push({
						face: g,
						i: carried.get(gv[1]) ?? 0,
						j: carried.get(gv[2]) ?? 0,
					});
				}
				return out;
			}

			/**
			 * The one representation a cell is numbered from: the lowest face.
			 *
			 * The same rule that awards a border cell to the lowest chunk
			 * containing it, applied one level up.
			 *
			 * **A cell has a second name only on a face edge, and that is three
			 * comparisons rather than a search.** A weight of zero is what puts
			 * the point on the edge opposite that vertex; two zeros put it on an
			 * icosahedron vertex. With no zero the point is strictly inside its
			 * own face, which names it and nothing else does -- and without the
			 * guard, better than 97% of calls walk all twenty faces to hand back
			 * the cell they were given. **This lab is the caller that made it
			 * worth guarding**: it canonicalises every cell of a patch that can
			 * be the whole planet, where the engine's own bulk caller already
			 * carried the same test at its call site.
			 */
			function canonicalCell(face, n, i, j) {
				if (i > 0 && j > 0 && i + j < n) return { face, i, j };
				const all = cellRepresentations(face, n, i, j);
				let best = all[0];
				for (const c of all) if (c.face < best.face) best = c;
				return best;
			}

			/**
			 * Move a set of weights across the edge opposite vertex `leaving`.
			 *
			 * A point on a face is three weights on that face's three **global**
			 * vertex numbers, and that description never mentions a face. Sending
			 * `(alpha, beta, gamma)` to `(alpha + gamma, beta + gamma, -gamma)` --
			 * `gamma` being the weight on the vertex left behind, and the third
			 * vertex the one the face over the edge carries instead -- writes the
			 * same point under the other face's name. At a `gamma` of zero, which
			 * is a point standing exactly on the edge, it moves nothing at all.
			 *
			 * The map is linear, so it carries a **direction** as readily as a
			 * position: hand it the three components of a step and it hands back
			 * that step continuing onto the other face. That is what lets a
			 * droplet walk off one face and keep going.
			 */
			function acrossEdge(face, weights, leaving) {
				const here = FACES[face];
				const link = FACE_ADJACENCY[face][(leaving + 1) % 3];
				const gamma = weights[leaving];
				const u = here[(leaving + 1) % 3];
				const v = here[(leaving + 2) % 3];
				const third = FACES[link.face].find((x) => x !== u && x !== v);
				return offsetOn(
					link.face,
					new Map([
						[u, weights[(leaving + 1) % 3] + gamma],
						[v, weights[(leaving + 2) % 3] + gamma],
						[third, -gamma],
					]),
				);
			}


			/**
			 * Which of the twenty faces a direction falls in.
			 *
			 * Twenty dot products, take the largest. Exact rather than an
			 * approximation: the perpendicular bisector plane between two
			 * adjacent face centroids contains the two vertices of the edge they
			 * share, so the face boundaries are the Voronoi boundaries of the
			 * centroids.
			 */
			function faceOf(x, y, z) {
				let best = 0;
				let bestDot = -Infinity;
				for (let f = 0; f < 20; f++) {
					const c = FACE_CENTROIDS[f];
					const d = x * c[0] + y * c[1] + z * c[2];
					if (d > bestDot) {
						bestDot = d;
						best = f;
					}
				}
				return best;
			}

			/**
			 * Where a direction sits inside a face, as three weights summing to 1.
			 *
			 * Cramer's rule on `[A B C] w = dir`, rescaled, which is the same
			 * blend `latticePosition` runs forwards. A negative weight means the
			 * direction is outside this face.
			 */
			function barycentricOf(face, x, y, z) {
				const [ia, ib, ic] = FACES[face];
				const a = VERTICES[ia];
				const b = VERTICES[ib];
				const c = VERTICES[ic];
				const bc = [
					b[1] * c[2] - b[2] * c[1],
					b[2] * c[0] - b[0] * c[2],
					b[0] * c[1] - b[1] * c[0],
				];
				const dc = [
					y * c[2] - z * c[1],
					z * c[0] - x * c[2],
					x * c[1] - y * c[0],
				];
				const bd = [
					b[1] * z - b[2] * y,
					b[2] * x - b[0] * z,
					b[0] * y - b[1] * x,
				];
				const det = a[0] * bc[0] + a[1] * bc[1] + a[2] * bc[2];
				const wa = (x * bc[0] + y * bc[1] + z * bc[2]) / det;
				const wb = (a[0] * dc[0] + a[1] * dc[1] + a[2] * dc[2]) / det;
				const wc = (a[0] * bd[0] + a[1] * bd[1] + a[2] * bd[2]) / det;
				const s = wa + wb + wc;
				return [wa / s, wb / s, wc / s];
			}

			/**
			 * The icosahedron vertex a cell sits on, or `-1` when it sits on none.
			 *
			 * A cell is a vertex when two of its three weights are zero, which
			 * puts all of its weight on one corner. Those twelve cells are the
			 * pentagons.
			 */
			function pentagonVertex(face, n, i, j) {
				const w = latticeWeights(n, i, j);
				let full = -1;
				let zeros = 0;
				for (let x = 0; x < 3; x++) {
					if (w[x] === 0) zeros++;
					else full = x;
				}
				return zeros === 2 ? FACES[face][full] : -1;
			}

			/**
			 * The five neighbours of the pentagon on icosahedron vertex `p`, in
			 * order around it, starting from the step `startFace` takes toward
			 * its own next vertex.
			 *
			 * The ring is built by rotating face to face around the vertex rather
			 * than by reflecting across one edge. Two of the five faces meeting
			 * at a vertex touch the starting face only at that vertex, so a
			 * single reflection cannot reach them.
			 */
			function pentagonRing(p, n, startFace) {
				let g = startFace;
				const ring = [];
				for (let s = 0; s < 5; s++) {
					const e = FACES[g].indexOf(p);
					// Faces wind A -> B -> C counter-clockwise from outside, so
					// at vertex p the next cell round is the one toward the
					// following vertex, and the next face round is the one across
					// the edge that arrives back at p.
					const x = FACES[g][(e + 1) % 3];
					const cell = offsetOn(
						g,
						new Map([
							[p, n - 1],
							[x, 1],
						]),
					);
					if (cell) ring.push(cell);
					g = FACE_ADJACENCY[g][(e + 2) % 3].face;
				}
				return ring;
			}

			/**
			 * The neighbour of `(face, i, j)` in direction `k`, at subdivision `n`.
			 *
			 * Returns `null` only for `k = 5` on one of the twelve pentagons,
			 * whose ring is five long. That is a direction which does not exist
			 * rather than a gap: the ring is short, never holed and never
			 * doubled.
			 *
			 * Away from those twelve, stepping off the face is a reflection and
			 * the whole of it is three additions. A lattice point is integer
			 * weights on global vertex numbers; step outside and exactly one
			 * weight goes negative. Reflecting across the shared edge sends
			 * `(alpha, beta, gamma)` to `(alpha + gamma, beta + gamma, -gamma)`,
			 * where `gamma` is the negative one. The point itself does not move
			 * -- only the name it is written under.
			 */
			function neighbour(face, n, i, j, k) {
				const p = pentagonVertex(face, n, i, j);
				if (p >= 0) return pentagonRing(p, n, face)[k] ?? null;

				const [di, dj] = DIRECTIONS[k];
				const ni = i + di;
				const nj = j + dj;
				const w = latticeWeights(n, ni, nj);

				let negative = -1;
				for (let x = 0; x < 3; x++) if (w[x] < 0) negative = x;
				if (negative < 0) return { face, i: ni, j: nj };

				// The edge opposite the vertex whose weight went negative is the
				// one crossed, and the reflection over it is the whole of the step.
				return acrossEdge(face, w, negative);
			}

			/**
			 * The corners of a cell's polygon, counter-clockwise seen from
			 * outside.
			 *
			 * A corner sits at the centroid of one of the triangles meeting at
			 * the cell, so corner `k` comes from the cell together with its
			 * neighbours in directions `k` and `k + 1`. Six of them on a hexagon,
			 * five on a pentagon.
			 *
			 * The three lattice points are averaged as **integer weights on
			 * global vertex numbers**, and only then blended and projected.
			 * Averaging first and projecting second is what keeps the 30 face
			 * edges seamless: the sum never mentions a face, so two faces sharing
			 * a corner compute the same number rather than two numbers that
			 * nearly agree. Projecting each point and then averaging the results
			 * gives a different curve.
			 */
			function cellCorners(face, n, i, j) {
				const ring = [];
				for (let k = 0; k < 6; k++) {
					const nb = neighbour(face, n, i, j, k);
					if (nb) ring.push(nb);
				}
				const degree = ring.length;
				const total = new Float64Array(12);
				const out = [];
				for (let k = 0; k < degree; k++) {
					const b = (k + 1) % degree;
					total.fill(0);
					addWeights(total, face, n, i, j);
					addWeights(total, ring[k].face, n, ring[k].i, ring[k].j);
					addWeights(total, ring[b].face, n, ring[b].i, ring[b].j);
					let x = 0;
					let y = 0;
					let z = 0;
					for (let v = 0; v < 12; v++) {
						const w = total[v];
						if (w === 0) continue;
						const p = VERTICES[v];
						x += p[0] * w;
						y += p[1] * w;
						z += p[2] * w;
					}
					const length = Math.sqrt(x * x + y * y + z * z);
					out.push([x / length, y / length, z / length]);
				}
				return out;
			}

			/** Add one lattice point's weights into the running total over the twelve vertices. */
			function addWeights(total, face, n, i, j) {
				const ids = FACES[face];
				total[ids[0]] += n - i - j;
				total[ids[1]] += i;
				total[ids[2]] += j;
			}

			/**
			 * Round three continuous barycentric coordinates to a lattice point.
			 *
			 * Rounding each one on its own breaks the sum: `(4.7, 8.6, 2.7)` sums
			 * to 16 and rounds to `(5, 9, 3)`, which sums to 17 and names no
			 * lattice point at all. The repair recomputes whichever coordinate
			 * moved furthest from the other two, because that is the one the
			 * measurement knows least about.
			 *
			 * The third coordinate exists for this. Two cannot detect the error.
			 */
			function hexRound(ka, kb, kc, n) {
				let ra = Math.round(ka);
				let rb = Math.round(kb);
				let rc = Math.round(kc);
				const da = Math.abs(ra - ka);
				const db = Math.abs(rb - kb);
				const dc = Math.abs(rc - kc);
				if (da > db && da > dc) ra = n - rb - rc;
				else if (db > dc) rb = n - ra - rc;
				else rc = n - ra - rb;
				return [ra, rb, rc];
			}

			/**
			 * Which lattice point a direction belongs to, at subdivision `n`.
			 *
			 * Three steps, all arithmetic: nearest face centroid, then where
			 * inside that face, then round to a lattice point. A cell is by
			 * definition the set of directions this maps to it -- never a
			 * nearest-centre search, which disagrees with the rounding on about
			 * 1% of the sphere.
			 *
			 * **It does not canonicalise, and that is deliberate.** A cell on a
			 * face edge has two names and a cell on an icosahedron vertex has
			 * five, and which one comes back here is whichever face the direction
			 * fell in. Picking one of them is the caller's job, at the moment it
			 * uses the cell as a key -- which is what `generate` does.
			 */
			function directionToCell(x, y, z, n) {
				const face = faceOf(x, y, z);
				const [a, b, c] = barycentricOf(face, x, y, z);
				const [, i, j] = hexRound(a * n, b * n, c * n, n);
				return { face, i, j };
			}
			// ===== END engine coarse grid =====

			// ---------------------------------------------------------------
			// The ground the climate is read over.
			// ---------------------------------------------------------------

			/**
			 * `blockSize = K * radius / 2^depth`, which ties the three together
			 * so any two fix the third.
			 */
			const CELL_CONSTANT = Math.sqrt((8 * Math.PI) / (10 * Math.sqrt(3)));

			/**
			 * The two elevations that cut the land into three bands, and the
			 * colour of each -- the engine's own numbers, so a colour here names
			 * the block the world would build there.
			 */
			const GROUND_LINES = { rock: 300, snow: 400 };
			const BAND_COLORS = [
				[0.76, 0.7, 0.5],
				[0.26, 0.44, 0.19],
				[0.42, 0.42, 0.45],
				[0.92, 0.94, 0.97],
			];
			/** What the sea is, and how far a look reaches into it. */
			const SEA_COLOR = [0.12, 0.32, 0.55];
			const SEA_CLARITY = 45;

			/**
			 * The three terrain layers at the multi-noise lab's shipped
			 * settings, held as constants rather than as rows.
			 *
			 * **The landscape is the input here, not the subject.** A biome is
			 * decided by climate, and climate needs a coastline to be measured
			 * from and a mountain to be cooled by -- so the ground is one fixed
			 * world that every reading is taken against. Continentalness sets
			 * the level, erosion decides how much relief survives there, and
			 * peaks and valleys is the relief itself; the curves are read at a
			 * noise value in `[-1, 1]` and answer in `[0, 1]`.
			 */
			const TERRAIN = {
				cont: {
					metres: 600,
					scale: 10,
					octaves: 3,
					fold: 0,
					spline: [
						[-1, 0],
						[-0.34, 0.0967],
						[-0.06, 0.29],
						[0.06, 0.3222],
						// The shore, pinned on the waterline: everything left of
						// it is under water and everything right of it is land.
						[0.0876, 0.5],
						[0.1, 0.536],
						[0.26, 0.652],
						[0.46, 0.8405],
						[1, 1],
					],
				},
				ero: {
					metres: 750,
					scale: 10,
					octaves: 4,
					fold: 0,
					spline: [
						[-1, 0],
						[-0.3, 0.05],
						[-0.1, 0.45],
						[0.05, 0.82],
						[0.3, 0.94],
						[1, 0.98],
					],
				},
				pv: {
					metres: 600,
					scale: 1,
					octaves: 4,
					fold: 0.85,
					spline: [
						[-1, 0.06],
						[-0.45, 0.24],
						[-0.05, 0.42],
						[0.25, 0.58],
						[0.55, 0.84],
						[1, 1],
					],
				},
				relief: 800,
				seaDepth: 360,
				peakRelief: 220,
				seaLevel: 0,
				erosionBite: 0.55,
			};

			/** The three layers, in the order they are read. */
			const LAYERS = ["cont", "ero", "pv"];

			/**
			 * Offsets from the world seed, so every field is a different field.
			 *
			 * The three terrain offsets are the multi-noise lab's, so one seed
			 * builds one planet across both pages. The climate fields take
			 * offsets of their own.
			 */
			const SEED_OFFSET = {
				cont: 101,
				ero: 211,
				pv: 337,
				temp: 449,
				hum: 557,
				warpT: 613,
				warpH: 811,
			};

			/**
			 * A curve read at `at`, straight-line between the points it holds.
			 *
			 * Outside the outermost points the curve holds its end value, so a
			 * field that reaches further than the curve was drawn for still has
			 * an answer.
			 */
			function splineAt(points, at) {
				if (points.length === 0) return 0;
				if (at <= points[0][0]) return points[0][1];
				const last = points[points.length - 1];
				if (at >= last[0]) return last[1];
				for (let n = 1; n < points.length; n++) {
					const [x1, y1] = points[n];
					if (at > x1) continue;
					const [x0, y0] = points[n - 1];
					const span = x1 - x0;
					if (span <= 1e-9) return y1;
					return y0 + ((y1 - y0) * (at - x0)) / span;
				}
				return last[1];
			}

			/**
			 * One noise stack, described in metres and read as a frequency.
			 *
			 * The sample point is a unit direction, so a frequency counts how
			 * many times the widest octave repeats across the whole planet:
			 * metres divided by the radius reach it, and the number a person
			 * sets means the same thing whatever size the planet is.
			 */
			function stackOf(radius, metres, octaves, fold) {
				return {
					frequency: radius / metres,
					octaves: Math.round(octaves),
					persistence: 0.5,
					lacunarity: 2,
					offsetX: 0,
					offsetY: 0,
					ridge: fold ?? 0,
					normalise: true,
				};
			}

			/** Every stack this page reads, built once per rebuild. */
			function settingsFor(k) {
				const out = {};
				for (const which of LAYERS)
					out[which] = stackOf(
						k.radius,
						TERRAIN[which].metres * TERRAIN[which].scale,
						TERRAIN[which].octaves,
						TERRAIN[which].fold,
					);
				out.temp = stackOf(k.radius, k.tempFeature, k.tempOctaves, 0);
				out.hum = stackOf(k.radius, k.humFeature, k.humOctaves, 0);
				out.warp = stackOf(k.radius, k.warpFeature, k.warpOctaves, 0);
				return out;
			}

			/**
			 * What the three terrain fields say at one direction, each in
			 * `[-1, 1]`.
			 *
			 * **Sampled from the direction vector, in 3D world space** -- never
			 * from a face's own `(i, j)`, which is discontinuous at all thirty
			 * face edges and shows the discontinuity as a seam in the ground.
			 */
			function fieldsAt(x, y, z, seed, s, out) {
				out[0] = octaveNoise(x, y, z, seed + SEED_OFFSET.cont, s.cont);
				out[1] = octaveNoise(x, y, z, seed + SEED_OFFSET.ero, s.ero);
				out[2] = octaveNoise(x, y, z, seed + SEED_OFFSET.pv, s.pv);
			}

			/** How much erosion takes away here: `0` leaves the ground alone. */
			function erosionCut(said) {
				return splineAt(TERRAIN.ero.spline, said[1]);
			}

			/** The three fields as one height, in metres above sea level. */
			function heightFrom(said) {
				const level = splineAt(TERRAIN.cont.spline, said[0]);
				// Land and the sea floor scale apart, each to its own number.
				// The curve's middle is the waterline, so above it Relief alone
				// says how tall land gets and below it Sea depth alone says how
				// deep the floor goes.
				const base =
					level >= 0.5
						? ((level - 0.5) / 0.5) * TERRAIN.relief
						: -((0.5 - level) / 0.5) * TERRAIN.seaDepth;
				const cut = erosionCut(said);
				const swing = splineAt(TERRAIN.pv.spline, said[2]) * 2 - 1;
				const over = base - TERRAIN.seaLevel;
				const worn = 1 - TERRAIN.erosionBite * cut;
				return (
					TERRAIN.seaLevel +
					(over > 0 ? over * worn : over) +
					(1 - cut) * swing * TERRAIN.peakRelief
				);
			}

			// ---------------------------------------------------------------
			// The climate.
			// ---------------------------------------------------------------

			/**
			 * The axis latitude is measured from.
			 *
			 * The engine's own polar axis runs through icosahedron vertices 0
			 * and 3; this page measures from `+Y`, which is the axis its
			 * latitude and longitude rows already name and the axis its pictures
			 * are projected on. Climate read about any other axis would draw
			 * bands that lean across every picture on the panel.
			 */
			const POLE = [0, 1, 0];

			/**
			 * How high the ground has to stand to lose one full unit of
			 * temperature, in metres.
			 *
			 * The temperature scale runs `-1` at a pole to `+1` at the equator,
			 * so this is the altitude that moves a place a whole hemisphere's
			 * worth of climate. A thousand metres makes the number on the panel
			 * readable as *units per kilometre*.
			 */
			const LAPSE_METRES = 1000;

			/**
			 * Temperature and humidity at one place, each in `[-1, 1]`.
			 *
			 * **Three terms decide temperature and none of them is a biome.**
			 * Latitude is one dot product against the axis, `+1` on the equator
			 * and `-1` at either pole. Altitude cools what stands up out of the
			 * ground, which is the term that puts snow on a mountain standing in
			 * a warm band. Noise is what stops the planet reading as a set of
			 * stripes.
			 *
			 * **Humidity is read off continentalness, because continentalness
			 * IS the distance from the coast.** A true distance to the nearest
			 * ocean is a flood fill over the map, and a flood fill is a global
			 * query: whether a cell is wet would depend on a chain of cells
			 * running three chunks away, which terrain generated a chunk at a
			 * time cannot answer. The field that already says *how far inland
			 * am I* costs one lookup that was taken anyway.
			 */
			function climateAt(x, y, z, said, metres, seed, s, k, out) {
				const away = Math.abs(x * POLE[0] + y * POLE[1] + z * POLE[2]);
				const lapse = metres > 0 ? (k.tempLapse * metres) / LAPSE_METRES : 0;
				out[0] =
					k.tempEquator * (1 - 2 * away) +
					k.tempNoise * octaveNoise(x, y, z, seed + SEED_OFFSET.temp, s.temp) -
					lapse;
				out[1] =
					-k.humOcean * said[0] +
					k.humNoise * octaveNoise(x, y, z, seed + SEED_OFFSET.hum, s.hum);
			}

			/**
			 * The two readings as a point in the diagram's own square.
			 *
			 * **The square is the range the planet reaches, not the range the
			 * arithmetic could reach.** Every term above is a noise stack or a
			 * weighted sum of them, and an octave stack normalised to its own
			 * peak has a standard deviation of about a quarter of it -- so the
			 * raw readings cluster in the middle and the corners of the diagram
			 * name climates no ground on the planet is in. Measured on the
			 * shipped world before this was fitted, land humidity ran
			 * **0.27 to 0.54** of the square between its 5th and 95th
			 * percentiles, **27%** of the width, and **6 of 13** biomes were
			 * never built anywhere.
			 *
			 * So the ends are measured over the planet's own land and the
			 * square is stretched onto them, exactly as the ground's own metre
			 * scale divides by the height field's own peak. What it costs is
			 * that the two numbers are a property of the whole world rather
			 * than of the place, so they are found once and then held -- the
			 * same shape as the relief fit, and the same reason.
			 */
			function squareOf(climate, warp, out) {
				const fit = world.fit;
				const push = knobs.warpStrength;
				out[0] = Math.max(
					0,
					Math.min(1, (climate[0] - fit.tLo) / fit.tSpan + push * warp[0]),
				);
				out[1] = Math.max(
					0,
					Math.min(1, (climate[1] - fit.hLo) / fit.hSpan + push * warp[1]),
				);
			}

			/**
			 * How far the biome lookup is pushed off the climate it was handed,
			 * as a displacement in the diagram's own `0..1` square.
			 *
			 * **Two stacks, sharing every setting and differing only in seed.**
			 * A biome is chosen by a point in two dimensions, so what jitters
			 * that choice has to be a vector: one field could only ever slide
			 * every place along one diagonal, which draws stripes across the
			 * planet rather than a ragged edge. The picture of it carries the
			 * temperature push in red and the humidity push in blue for that
			 * reason -- it is two fields, and it is drawn as two.
			 */
			function warpAt(x, y, z, seed, s, out) {
				out[0] = octaveNoise(x, y, z, seed + SEED_OFFSET.warpT, s.warp);
				out[1] = octaveNoise(x, y, z, seed + SEED_OFFSET.warpH, s.warp);
			}

			// ---------------------------------------------------------------
			// The landform.
			// ---------------------------------------------------------------

			/**
			 * What kind of ground a place is, before anything asks what grows
			 * on it.
			 *
			 * **Two stages, and the terrain goes first.** Temperature and
			 * humidity alone cannot say that a place is a mountain, so a
			 * diagram read on them alone will put a desert on a summit. The
			 * three terrain layers decide the landform, and the climate then
			 * only chooses which kind of that landform this one is: a cold
			 * peak and a hot peak are both peaks.
			 *
			 * The sea is not one of these -- there is no land there for a
			 * biome to stand on, and the ocean is a surface rather than
			 * ground.
			 */
			const LANDFORMS = [
				{ key: "shore", name: "Shore", short: "shr", hex: "e0d3a8" },
				{ key: "valleys", name: "Valleys", short: "val", hex: "4e7a4a" },
				{ key: "lowlands", name: "Lowlands", short: "low", hex: "9ab06a" },
				{ key: "slopes", name: "Slopes", short: "slp", hex: "7f8a72" },
				{ key: "plateau", name: "Plateau", short: "plt", hex: "c0a878" },
				{ key: "peaks", name: "Peaks", short: "pk", hex: "e4ebf2" },
			];
			const SHORE = 0;
			/** The one a biome carries when the landform does not decide it. */
			const ANY = "any";

			/**
			 * Where each transformed field is cut into indices.
			 *
			 * **The values cut here are the curves' answers, not the raw
			 * noise.** A layer is a stack of octaves read through a curve, and
			 * the curve is what gives the reading a meaning -- how high the
			 * continent stands, how much erosion takes away, how far the relief
			 * swings. The raw noise underneath is the same shape for all three.
			 *
			 * The edges are fixed numbers rather than shares of the world, so a
			 * grid means the same thing on every planet, and the grid draws the
			 * measured share of land in each cell instead. On the shipped world
			 * they cut land into roughly even parts: continentalness runs
			 * **0.46 to 0.89** between its 2nd and 98th percentiles, erosion
			 * **0.04 to 0.95**, and peaks and valleys **0.24 to 0.91**.
			 */
			const CONT_EDGES = [0.62, 0.78];
			const ERO_EDGES = [0.13, 0.35, 0.56, 0.82];
			const PV_EDGES = [0.36, 0.46, 0.58, 0.71];
			const CONT_NAMES = ["near the sea", "inland", "far inland"];
			const ERO_NAMES = ["sharp", "", "", "", "worn"];
			const PV_NAMES = ["valley", "", "", "", "peak"];

			/** Which bucket a value falls in, given the edges between them. */
			function bucket(v, edges) {
				let n = 0;
				while (n < edges.length && v >= edges[n]) n++;
				return n;
			}

			/**
			 * The grid: a landform for every combination of the three indices.
			 *
			 * Three sheets, one per continentalness band; five erosion rows,
			 * sharp at the top; five peaks-and-valleys columns, valley on the
			 * left. **Sharp and high is a peak, worn and high is a plateau**,
			 * and low relief is a valley wherever it is -- which is the whole
			 * of the rule, written where it can be read and changed rather than
			 * buried in a condition.
			 */
			const DEFAULT_GRID = [
				// near the sea: no room for a mountain range
				"11233" + "12233" + "12223" + "12222" + "12222",
				// inland
				"13355" + "12355" + "12334" + "12224" + "12222",
				// far inland
				"13555" + "13355" + "12344" + "12244" + "12224",
			].join("");

			let grid = DEFAULT_GRID.split("").map(Number);

			/** Where one sheet's cell sits in the flat grid. */
			function gridAt(c, e, p) {
				return (c * 5 + e) * 5 + p;
			}

			/**
			 * The landform at one place: `-1` in the sea, `SHORE` on the first
			 * few metres of land, and whatever the grid says everywhere else.
			 *
			 * **The shore is a height, not a bucket of continentalness.** Sea
			 * level here is a radius and every height is measured from it, so
			 * *the ground has barely come out of the water* is one comparison,
			 * and it cannot be true on a mountain however close to the coast it
			 * stands. On the shipped world **1.1%** of land is under 8 m and
			 * **3.4%** under 20 m, which is a beach rather than a region.
			 */
			function landformAt(level, cut, swing, metres) {
				if (metres <= TERRAIN.seaLevel) return -1;
				if (metres <= knobs.shoreHeight) return SHORE;
				return grid[
					gridAt(
						bucket(level, CONT_EDGES),
						bucket(cut, ERO_EDGES),
						bucket(swing, PV_EDGES),
					)
				];
			}

			// ---------------------------------------------------------------
			// The diagram.
			// ---------------------------------------------------------------

			/**
			 * The biomes, as points in the climate square.
			 *
			 * `t` is temperature and `h` is humidity, both `0` to `1`, and
			 * `landform` is which kind of ground this one may stand on -- one
			 * of the six, or `any`.
			 *
			 * **A biome is a name, a colour, two numbers and a landform.**
			 * Nothing here decides a height, a block or a tree: the diagram
			 * partitions the square by nearest dot **among the biomes that
			 * landform allows**, so every climate has exactly one answer on
			 * every kind of ground, and a desert placed in the lowlands cannot
			 * appear on a summit however hot and dry the summit is.
			 */
			const PRESETS = {
				plain: [
					{ name: "Icy shore", hex: "d8e4ec", t: 0.12, h: 0.5, landform: "shore" },
					{ name: "Stony shore", hex: "8e9298", t: 0.4, h: 0.3, landform: "shore" },

					{ name: "Meadow", hex: "86ad5c", t: 0.6, h: 0.6, landform: "valleys" },

				],
				// **Holdridge's life zones, which are the climate square

					{ name: "Boreal desert", hex: "b9a878", t: 0.4, h: 0.06 },
					{ name: "Dry scrub", hex: "9aa46a", t: 0.4, h: 0.24 },
					{ name: "Boreal moist forest", hex: "7fae7a", t: 0.4, h: 0.48 },
					{ name: "Boreal wet forest", hex: "57a89a", t: 0.4, h: 0.68 },
					{ name: "Boreal rain forest", hex: "35a2b8", t: 0.4, h: 0.88 },

					{ name: "Wet forest", hex: "5fbf94", t: 0.58, h: 0.75 },
					{ name: "Temperate rain forest", hex: "46c2ae", t: 0.58, h: 0.93 },
					{ name: "Subtropical desert", hex: "e8dc7a", t: 0.78, h: 0.05 },
					{ name: "Thorn woodland", hex: "cfd96f", t: 0.78, h: 0.25 },
					{ name: "Dry forest", hex: "a5d772", t: 0.78, h: 0.45 },
					{ name: "Subtropical moist forest", hex: "78d67f", t: 0.78, h: 0.68 },
					{ name: "Tropical desert", hex: "f4ef7a", t: 0.95, h: 0.04 },
					{ name: "Tropical dry forest", hex: "c9ee72", t: 0.95, h: 0.35 },
					{ name: "Tropical wet forest", hex: "63ec8e", t: 0.95, h: 0.66 },
					{ name: "Tropical rain forest", hex: "3aecb0", t: 0.95, h: 0.9 },

			};

			/** The set the page opens with, and the one the URL is measured against. */
			const DEFAULT_BIOMES = PRESETS.plain;

			/** The live table, which the diagram edits and the URL carries. */
			let biomes = DEFAULT_BIOMES.map((b) => ({ landform: ANY, ...b }));
			let picked = 0;
			/** Which landform's diagram is on screen, and which grid cell was last touched. */
			let shown = 2;
			let cellPicked = gridAt(1, 2, 2);

			const RGB_OF = new Map();

			/** A six-digit hex colour as three fractions, looked up once. */
			function rgbOf(hex) {
				let held = RGB_OF.get(hex);
				if (held) return held;
				const n = parseInt(hex, 16);
				held = [
					((n >> 16) & 255) / 255,
					((n >> 8) & 255) / 255,
					(n & 255) / 255,
				];
				RGB_OF.set(hex, held);
				return held;
			}

			/**
			 * The biomes one landform may build, as indices into the table.
			 *
			 * Rebuilt whenever the table changes rather than filtered at every
			 * lookup: a picture asks this per pixel.
			 */
			let allowed = [];

			function regroup() {
				allowed = LANDFORMS.map((form, n) => {
					const out = [];
					for (let b = 0; b < biomes.length; b++)
						if (biomes[b].landform === form.key || biomes[b].landform === ANY)
							out.push(b);
					return out;
				});
			}

			/**
			 * Which biome a climate lands in on one kind of ground: the nearest
			 * dot among the ones that ground allows, and nothing else.
			 *
			 * **Nearest point, not a table of ranges.** A range table has to
			 * name a biome for every cell of a grid and a cell nobody filled in
			 * is a hole; a Voronoi diagram has no holes by construction, and
			 * every edge in it is the perpendicular bisector between two dots,
			 * so a border moves when either of the two biomes it separates
			 * moves.
			 *
			 * A landform with no biome at all has no answer, which is the one
			 * state the panel refuses to leave: removing the last one is
			 * declined rather than allowed to draw a hole in the world.
			 */
			function biomeOf(t, h, form) {
				const set = allowed[form];
				if (!set || set.length === 0) return -1;
				let best = set[0];
				let near = Infinity;
				for (let n = 0; n < set.length; n++) {
					const b = biomes[set[n]];
					const dt = t - b.t;
					const dh = h - b.h;
					const d = dt * dt + dh * dh;
					if (d < near) {
						near = d;
						best = set[n];
					}
				}
				return best;
			}


			// ---------------------------------------------------------------
			// The knobs.

							value: "plain",
							note: () =>
								knobs.preset === "Holdridge"
									? "Leslie Holdridge's life zones, which are a real " +
										"classification of exactly this shape: a name for every " +

							value: "the patch",
							note: () =>
								knobs.chartDots === "the planet"
									? "one dot per cell of the planet at a coarse level, so a " +

										"this world never builds"

										? "one dot per hexagon in view, so the diagram says which " +
											"part of itself the camera is standing in"
										: "",
