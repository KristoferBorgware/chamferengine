<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subdivision Explorer</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#0b0e14; color:#e6e8ee;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header { padding:14px 16px 10px; }
  h1 { font-size:17px; font-weight:650; letter-spacing:-0.01em; }
  .sub { font-size:12.5px; color:#8b93a7; margin-top:3px; }

  .stage { position:relative; flex:1; min-height:56vh; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  .hud, .card {
    position:absolute; font-size:12px; line-height:1.55; color:#c7ccd9;
    background:rgba(11,14,20,.78); border:1px solid #222839;
    padding:9px 11px; border-radius:8px; backdrop-filter:blur(6px);
  }
  .hud { top:10px; left:12px; max-width:290px; }
  .card { top:10px; right:12px; width:322px; max-width:calc(100% - 24px); }
  .hud b, .card b { color:#fff; font-weight:600; }
  .muted { color:#8b93a7; }
  .warn { color:#f0b429; }
  .row { display:flex; justify-content:space-between; gap:10px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px; }
  .digits { word-break:break-all; color:#7fd1ae; }

  .bits { display:flex; height:22px; margin:7px 0 3px; border-radius:4px; overflow:hidden; }
  .bits div { display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; color:#0b0e14; min-width:0; }
  .b-planet { background:#5b6b8c; }
  .b-face   { background:#4f8ef7; }
  .b-path   { background:#7fd1ae; }
  .b-corner { background:#f2c14e; }
  .b-layer  { background:#c78bf0; }
  .b-spare  { background:#1b2130; color:#6b7488; box-shadow:inset 0 0 0 1px #2a3245; }
  .key { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:10.5px; color:#8b93a7; }
  .key span::before { content:''; display:inline-block; width:8px; height:8px;
    border-radius:2px; margin-right:4px; vertical-align:middle; }
  .k-planet::before { background:#5b6b8c; } .k-face::before { background:#4f8ef7; }
  .k-path::before { background:#7fd1ae; } .k-corner::before { background:#f2c14e; }
  .k-layer::before { background:#c78bf0; } .k-spare::before { background:#2a3245; }

  .panel {
    padding:12px 16px 16px; border-top:1px solid #1b2130; background:#0e121b;
    display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-start;
  }
  .knob { display:flex; flex-direction:column; gap:3px; min-width:186px; }
  .knob label { font-size:11.5px; color:#8b93a7; display:flex; justify-content:space-between; gap:8px; }
  .knob label b { color:#e6e8ee; font-weight:600; }
  .knob input[type=range] { width:100%; accent-color:#4f8ef7; }
  .knob .given { font-size:10.5px; color:#6b7488; min-height:13px; }
  .toggles { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button {
    font:inherit; font-size:12.5px; font-weight:550;
    padding:7px 11px; border-radius:8px; cursor:pointer;
    background:#1a2130; color:#dfe3ec; border:1px solid #2a3245;
  }
  button:active { transform:scale(.97); }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
</style>
</head>
<body>

<header>
  <h1>Subdivision explorer — twenty triangles down to one cell</h1>
  <div class="sub">Drag to turn · left click a cell · right click to stand there · wheel to zoom. The surface layer only.</div>
</header>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="card" id="card"></div>
</div>

<div class="panel">
  <div class="knob">
    <label>Depth <b id="vDepth">4</b></label>
    <input type="range" id="kDepth" min="1" max="17" step="1" value="4">
    <div class="given" id="gDepth"></div>
  </div>
  <div class="knob">
    <label>Cell size <b id="vCell">1.00 m</b></label>
    <input type="range" id="kCell" min="0" max="40" step="1" value="12">
    <div class="given" id="gCell"></div>
  </div>
  <div class="knob">
    <label>Radius <b id="vRadius">— m</b></label>
    <input type="range" id="kRadius" min="0" max="400" step="1" value="200">
    <div class="given" id="gRadius"></div>
  </div>
  <div class="knob">
    <label>Show splits to <b id="vSplit">2</b></label>
    <input type="range" id="kSplit" min="0" max="5" step="1" value="2">
    <div class="given" id="gSplit"></div>
  </div>
  <div class="toggles">
    <button id="tCells" class="on">Cells</button>
    <button id="tSplits" class="on">Splits</button>
    <button id="tFaces" class="on">Faces</button>
    <button id="tShade" class="on">Shade</button>
    <button id="tSpin">Spin</button>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// The constant tying a block size, a radius and a depth together.
// blockSize = K * radius / 2^depth, from equal-area hexagons on a sphere.
const K = Math.sqrt((8 * Math.PI) / (10 * Math.sqrt(3)));

// Field widths of the stored word, most significant first.
const FIELDS = [
  { name: 'planet', bits: 12, cls: 'b-planet' },
  { name: 'face',   bits: 5,  cls: 'b-face'   },
  { name: 'path',   bits: 0,  cls: 'b-path'   },  // 2 per level of depth
  { name: 'corner', bits: 2,  cls: 'b-corner' },
  { name: 'layer',  bits: 11, cls: 'b-layer'  },
];
const WORD = 64;

// ---------------------------------------------------------------------------
// vectors
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [
  a[1] * b[2] - a[2] * b[1],
  a[2] * b[0] - a[0] * b[2],
  a[0] * b[1] - a[1] * b[0],
];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function norm(v) {
  const l = Math.sqrt(dot(v, v));
  return [v[0] / l, v[1] / l, v[2] / l];
}

// ---------------------------------------------------------------------------
// The icosahedron, built rather than transcribed: twelve vertices from the
// golden ratio, then every triple of them that is a face is the one whose three
// edges are all the shortest distance there is. Each is wound counter-clockwise
// seen from outside, which is what makes a face's own normal point outward.
const PHI = (1 + Math.sqrt(5)) / 2;
const VERTS = [];
for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
  VERTS.push(norm([0, s1 * 1, s2 * PHI]));
  VERTS.push(norm([s1 * 1, s2 * PHI, 0]));
  VERTS.push(norm([s1 * PHI, 0, s2 * 1]));
}
const FACES = (() => {
  let shortest = Infinity;
  for (let a = 0; a < 12; a++) for (let b = a + 1; b < 12; b++) {
    const d = dot(sub(VERTS[a], VERTS[b]), sub(VERTS[a], VERTS[b]));
    if (d < shortest) shortest = d;
  }
  const near = (a, b) =>
    Math.abs(dot(sub(VERTS[a], VERTS[b]), sub(VERTS[a], VERTS[b])) - shortest) < 1e-9;
  const out = [];
  for (let a = 0; a < 12; a++)
    for (let b = a + 1; b < 12; b++)
      for (let c = b + 1; c < 12; c++)
        if (near(a, b) && near(b, c) && near(a, c)) {
          const n = cross(sub(VERTS[b], VERTS[a]), sub(VERTS[c], VERTS[a]));
          out.push(dot(n, VERTS[a]) > 0 ? [a, b, c] : [a, c, b]);
        }
  return out;
})();
const CENTROIDS = FACES.map(([a, b, c]) =>
  norm([
    VERTS[a][0] + VERTS[b][0] + VERTS[c][0],
    VERTS[a][1] + VERTS[b][1] + VERTS[c][1],
    VERTS[a][2] + VERTS[b][2] + VERTS[c][2],
  ]),
);

/**
 * Where lattice point (i, j) on a face sits on the ball.
 *
 * One barycentric blend of the face's own three corners, evaluated once and
 * normalised once -- never a chain of arc midpoints, which lands on a
 * different sphere.
 */
function latticeDir(face, n, i, j) {
  const [a, b, c] = FACES[face];
  const wa = n - i - j;
  return norm([
    VERTS[a][0] * wa + VERTS[b][0] * i + VERTS[c][0] * j,
    VERTS[a][1] * wa + VERTS[b][1] * i + VERTS[c][1] * j,
    VERTS[a][2] * wa + VERTS[b][2] * i + VERTS[c][2] * j,
  ]);
}

/** Which face a direction is over: the nearest centroid, exactly. */
function faceOf(d) {
  let best = 0, bestDot = -2;
  for (let f = 0; f < 20; f++) {
    const v = dot(d, CENTROIDS[f]);
    if (v > bestDot) { bestDot = v; best = f; }
  }
  return best;
}

/** A direction as weights on one face's three corners, summing to one. */
function baryOf(d, face) {
  const [ia, ib, ic] = FACES[face];
  const A = VERTS[ia], B = VERTS[ib], C = VERTS[ic];
  const det = dot(A, cross(B, C));
  const wa = dot(d, cross(B, C)) / det;
  const wb = dot(A, cross(d, C)) / det;
  const wc = dot(A, cross(B, d)) / det;
  const s = wa + wb + wc;
  return [wa / s, wb / s, wc / s];
}

/**
 * The lattice point a direction belongs to: cube rounding on the three
 * barycentric weights, with the one that moved furthest corrected so the three
 * still sum to n.
 *
 * A cell IS the set of directions this maps to it -- the flat Voronoi hexagon
 * projected outward -- rather than "the nearest centre measured on the ball".
 * The two disagree on about 1% of the sphere, always with an edge neighbour.
 */
function hexRound(d, face, n) {
  const w = baryOf(d, face);
  const x = w[0] * n, y = w[1] * n, z = w[2] * n;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = n - ry - rz;
  else if (dy > dz) ry = n - rx - rz;
  else rz = n - rx - ry;
  return [Math.max(0, ry), Math.max(0, rz)];
}

/**
 * The route down the splits to one lattice point, and which corner of the last
 * triangle it is.
 *
 * Four children each level: the three at the corners keep the frame, and the
 * middle one is turned half a turn -- which is a rotation and not a mirror, so
 * handedness never changes anywhere on the planet.
 */
function pathOf(i, j, depth) {
  const digits = [];
  let n = 1 << depth;
  for (let level = 0; level < depth; level++) {
    const m = n >> 1;
    if (i >= m) { digits.push(1); i -= m; }
    else if (j >= m) { digits.push(2); j -= m; }
    else if (i + j <= m) { digits.push(0); }
    else { digits.push(3); i = m - i; j = m - j; }
    n = m;
  }
  const corner = i === 1 ? 1 : j === 1 ? 2 : 0;
  return { digits, corner };
}

/** How many of the twelve icosahedron vertices this lattice point is. */
function isPentagon(n, i, j) {
  return (i === 0 && j === 0) || (i === n && j === 0) || (i === 0 && j === n);
}

// ---------------------------------------------------------------------------
// The drawable mesh.
//
// A cell on a face edge has two names and one place, and one at an icosahedron
// vertex has five. Keying a cell by its integer weights on the twelve GLOBAL
// vertices settles that exactly -- no rounding, no distance test -- so the
// hexagons close across all thirty face edges and the twelve pentagons come out
// with five corners rather than a hole.
function buildMesh(level) {
  const n = 1 << level;
  const cells = new Map();
  const keyOf = (face, i, j) => {
    const [a, b, c] = FACES[face];
    const parts = [[a, n - i - j], [b, i], [c, j]].filter((p) => p[1] > 0);
    parts.sort((p, q) => p[0] - q[0]);
    return parts.map((p) => p[0] + ':' + p[1]).join('|');
  };
  const take = (face, i, j, centre) => {
    const key = keyOf(face, i, j);
    let cell = cells.get(key);
    if (!cell) {
      cell = { dir: latticeDir(face, n, i, j), corners: [], face, i, j,
               pent: isPentagon(n, i, j) };
      cells.set(key, cell);
    }
    cell.corners.push(centre);
  };
  // Every triangle hands its own middle to each of its three corners. Two cells
  // sharing a triangle therefore share that corner exactly, so no seam can open
  // between them however the arithmetic rounds.
  const middle = (face, p, q, r) =>
    norm([
      latticeDir(face, n, p[0], p[1])[0] + latticeDir(face, n, q[0], q[1])[0] + latticeDir(face, n, r[0], r[1])[0],
      latticeDir(face, n, p[0], p[1])[1] + latticeDir(face, n, q[0], q[1])[1] + latticeDir(face, n, r[0], r[1])[1],
      latticeDir(face, n, p[0], p[1])[2] + latticeDir(face, n, q[0], q[1])[2] + latticeDir(face, n, r[0], r[1])[2],
    ]);
  for (let face = 0; face < 20; face++)
    for (let i = 0; i < n; i++)
      for (let j = 0; i + j < n; j++) {
        const up = middle(face, [i, j], [i + 1, j], [i, j + 1]);
        take(face, i, j, up); take(face, i + 1, j, up); take(face, i, j + 1, up);
        if (i + j < n - 1) {
          const down = middle(face, [i + 1, j], [i, j + 1], [i + 1, j + 1]);
          take(face, i + 1, j, down); take(face, i, j + 1, down); take(face, i + 1, j + 1, down);
        }
      }
  // Put each ring in order around its own cell, so the polygon is convex on
  // screen rather than a star.
  for (const cell of cells.values()) {
    const up = cell.dir;
    let ref = Math.abs(up[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
    const east = norm(cross(up, ref));
    const north = cross(up, east);
    cell.corners.sort(
      (p, q) =>
        Math.atan2(dot(p, north), dot(p, east)) -
        Math.atan2(dot(q, north), dot(q, east)),
    );
  }
  return [...cells.values()];
}

/**
 * Every triangle edge from the first cut down to `maxLevel`, each tagged with
 * the level that introduced it.
 *
 * A cut made early is still there at every level under it, so an edge is
 * recorded once at its coarsest level and drawn at that weight. Coarse lines
 * are drawn last and heaviest, which is what makes the order of the splits
 * readable rather than a uniform mesh.
 */
function buildSplitEdges(maxLevel) {
  const fine = 1 << maxLevel;
  const seen = new Set();
  const out = [];
  for (let level = 1; level <= maxLevel; level++) {
    const n = 1 << level;
    const up = fine / n;
    for (let face = 0; face < 20; face++)
      for (let i = 0; i < n; i++)
        for (let j = 0; i + j < n; j++)
          for (const [p, q] of [
            [[i, j], [i + 1, j]],
            [[i, j], [i, j + 1]],
            [[i + 1, j], [i, j + 1]],
          ]) {
            const a = [p[0] * up, p[1] * up], b = [q[0] * up, q[1] * up];
            const key = face + ':' + Math.min(a[0], b[0]) + ',' + Math.min(a[1], b[1]) +
              ':' + Math.max(a[0], b[0]) + ',' + Math.max(a[1], b[1]);
            if (seen.has(key)) continue;
            seen.add(key);
            out.push({ face, a, b, level });
          }
  }
  return { n: fine, list: out };
}

// ---------------------------------------------------------------------------
// state
const state = {
  depth: 4,
  blockSize: 1,
  split: 2,
  cells: true, splits: true, faces: true, shade: true, spin: false,
  yaw: 0.6, pitch: 0.35, zoom: 1,
  selected: null,   // { face, i, j }
  player: null,     // unit direction
};

/** The cell level actually drawn, which is not always the one asked for. */
const DRAW_CAP = 6;
const drawLevel = () => Math.min(state.depth, DRAW_CAP);
const radius = () => (state.blockSize * 2 ** state.depth) / K;

let mesh = buildMesh(drawLevel());
let meshLevel = drawLevel();
let edges = buildSplitEdges(Math.max(1, Math.min(state.split, drawLevel())));
let edgeLevel = Math.min(state.split, drawLevel());

function remesh() {
  if (drawLevel() !== meshLevel) { meshLevel = drawLevel(); mesh = buildMesh(meshLevel); }
  const want = Math.min(state.split, drawLevel());
  if (want !== edgeLevel) { edgeLevel = want; edges = buildSplitEdges(Math.max(1, want)); }
}

// ---------------------------------------------------------------------------
// camera: the model turns, the eye does not
function rotate(v) {
  const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const x = v[0] * cy + v[2] * sy;
  const z = -v[0] * sy + v[2] * cy;
  const y = v[1] * cp - z * sp;
  return [x, y, z * cp + v[1] * sp];
}
function unrotate(v) {
  const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const y = v[1] * cp + v[2] * sp;
  const z = -v[1] * sp + v[2] * cp;
  return [v[0] * cy - z * sy, y, v[0] * sy + z * cy];
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, cx = 0, cy = 0, scale = 1, EYE = 3.4;

function resize() {
  const box = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(box.width)); H = Math.max(1, Math.round(box.height));
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  scale = Math.min(W, H) * 0.42 * state.zoom;
  draw();
}

/** Project a rotated unit direction. Behind the limb it returns nothing. */
function project(v) {
  if (v[2] < 1 / EYE) return null;           // over the horizon from this eye
  const k = (scale * EYE) / (EYE - v[2]);
  return [cx + v[0] * k, cy - v[1] * k];
}

/**
 * The same, with a point just past the limb held on it rather than dropped.
 *
 * A cell whose middle is in view can have a corner a few metres over the
 * horizon, and dropping the whole cell for it takes a ring of them off the
 * edge of the ball. Held on the limb the shape is a sliver short and the
 * tiling stays closed, which is what the picture is about.
 */
function projectHeld(v) {
  const p = project(v);
  if (p) return p;
  const len = Math.sqrt(v[0] * v[0] + v[1] * v[1]) || 1;
  const rim = (scale * EYE) / Math.sqrt(EYE * EYE - 1);
  return [cx + (v[0] / len) * rim, cy - (v[1] / len) * rim];
}

/** The direction under a screen point, or nothing if the click missed the ball. */
function pick(sx, sy) {
  const px = (sx - cx) / scale, py = -(sy - cy) / scale;
  // A ray from the eye at (0, 0, EYE) through the image plane at z = EYE - 1.
  const dir = norm([px / EYE, py / EYE, -1]);
  const o = [0, 0, EYE];
  const b = dot(o, dir), c = dot(o, o) - 1;
  const disc = b * b - c;
  if (disc < 0) return null;
  const t = -b - Math.sqrt(disc);
  return unrotate(norm([o[0] + dir[0] * t, o[1] + dir[1] * t, o[2] + dir[2] * t]));
}

const FACE_HUE = (f) => `hsl(${(f * 47) % 360} 42% ${44}%)`;
const LIGHT = norm([0.5, 0.7, 0.9]);

function draw() {
  ctx.clearRect(0, 0, W, H);

  // the ball behind everything, so a gap in the tiling shows as a hole
  const back = project([0, 0, 1]);
  if (back) {
    const rim = (scale * EYE) / Math.sqrt(EYE * EYE - 1);
    const g = ctx.createRadialGradient(cx - rim * 0.3, cy - rim * 0.3, rim * 0.1, cx, cy, rim);
    g.addColorStop(0, '#1b2333'); g.addColorStop(1, '#0d1119');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rim, 0, 2 * Math.PI); ctx.fill();
  }

  if (state.cells) {
    for (const cell of mesh) {
      const up = rotate(cell.dir);
      if (up[2] < 1 / EYE) continue;
      const path = new Path2D();
      for (let k = 0; k < cell.corners.length; k++) {
        const p = projectHeld(rotate(cell.corners[k]));
        if (k === 0) path.moveTo(p[0], p[1]); else path.lineTo(p[0], p[1]);
      }
      path.closePath();
      const lit = state.shade ? 0.45 + 0.55 * Math.max(0, dot(up, LIGHT)) : 1;
      if (cell.pent) ctx.fillStyle = `rgba(242,84,61,${0.55 + 0.45 * lit})`;
      else {
        const base = FACE_HUE(cell.face);
        ctx.fillStyle = base;
        ctx.globalAlpha = lit;
      }
      ctx.fill(path);
      ctx.globalAlpha = 1;
      if (meshLevel <= 5) {
        ctx.strokeStyle = 'rgba(11,14,20,.55)'; ctx.lineWidth = 0.6; ctx.stroke(path);
      }
    }
  }

  // The splits, finest first so the coarse cuts are drawn over them. The first
  // cut is the heaviest line and the last is a hairline, so the order the
  // triangles were made in is the order they read in.
  if (state.splits && edgeLevel > 0) {
    const n = edges.n;
    for (let level = edgeLevel; level >= 1; level--) {
      const age = edgeLevel - level;
      ctx.strokeStyle = `rgba(127,209,174,${(0.45 + 0.13 * age).toFixed(3)})`;
      ctx.lineWidth = 0.55 + 0.55 * age;
      ctx.beginPath();
      for (const e of edges.list) {
        if (e.level !== level) continue;
        const a = project(rotate(latticeDir(e.face, n, e.a[0], e.a[1])));
        const b = project(rotate(latticeDir(e.face, n, e.b[0], e.b[1])));
        if (!a || !b) continue;
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      }
      ctx.stroke();
    }
  }

  // The twenty faces themselves, thick, over everything.
  if (state.faces) {
    ctx.strokeStyle = '#4f8ef7'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let face = 0; face < 20; face++) {
      const [a, b, c] = FACES[face];
      for (const [u, v] of [[a, b], [b, c], [c, a]]) arc(VERTS[u], VERTS[v]);
    }
    ctx.stroke();
  }

  if (state.selected) outline(state.selected, '#f2c14e', 2.4);
  if (state.player) marker(state.player);
  readout();
}

/** A great-circle segment, in enough pieces that the limb stays curved. */
function arc(u, v) {
  const STEPS = 24;
  let first = true;
  for (let s = 0; s <= STEPS; s++) {
    const t = s / STEPS;
    const p = project(rotate(norm([
      u[0] + (v[0] - u[0]) * t, u[1] + (v[1] - u[1]) * t, u[2] + (v[2] - u[2]) * t,
    ])));
    if (!p) { first = true; continue; }
    if (first) { ctx.moveTo(p[0], p[1]); first = false; } else ctx.lineTo(p[0], p[1]);
  }
}

/**
 * Outline one cell at the drawn level.
 *
 * At a depth past what can be drawn this is the triangle the cell sits in
 * rather than the cell, because a cell there is smaller than a pixel -- which
 * is the point the readout makes in numbers.
 */
function outline(sel, color, width) {
  const n = 1 << meshLevel;
  const shift = state.depth - meshLevel;
  const i = sel.i >> shift, j = sel.j >> shift;
  const key = mesh.find((c) => c.face === sel.face && c.i === i && c.j === j)
    || mesh.find((c) => {
      const d = rotate(c.dir); return d[2] > 1 / EYE && near(c.dir, sel.dir, 1 / n);
    });
  if (!key) return;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round';
  ctx.beginPath();
  let first = true;
  for (const corner of key.corners) {
    const p = projectHeld(rotate(corner));
    if (first) { ctx.moveTo(p[0], p[1]); first = false; } else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath(); ctx.stroke();
}
const near = (a, b, r) => dot(sub(a, b), sub(a, b)) < r * r;

function marker(dir) {
  const p = project(rotate(dir));
  if (!p) return;
  ctx.lineWidth = 3; ctx.strokeStyle = '#000';
  for (const [w, col] of [[3.4, '#000'], [1.6, '#fff']]) {
    ctx.lineWidth = w; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath();
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      ctx.moveTo(p[0] + dx * 10, p[1] + dy * 10);
      ctx.lineTo(p[0] + dx * 6.5, p[1] + dy * 6.5);
    }
    ctx.stroke();
  }
}

// ---------------------------------------------------------------------------
// the numbers
const fmt = (x) => x.toLocaleString('en-US');
function metres(m) {
  if (m >= 1000) return (m / 1000).toFixed(m >= 10000 ? 0 : 2) + ' km';
  if (m >= 1) return m.toFixed(m >= 100 ? 0 : 2) + ' m';
  return (m * 100).toFixed(1) + ' cm';
}

function readout() {
  const D = state.depth, n = 1 << D;
  const cells = 10 * 4 ** D + 2;
  const drawn = 10 * 4 ** meshLevel + 2;
  const perDrawn = 4 ** (D - meshLevel);

  document.getElementById('hud').innerHTML =
    `<div class="row"><span>Depth</span><b>${D}</b></div>` +
    `<div class="row"><span>Cells on the planet</span><b>${fmt(cells)}</b></div>` +
    `<div class="row"><span>Cell across</span><b>${metres(state.blockSize)}</b></div>` +
    `<div class="row"><span>Radius</span><b>${metres(radius())}</b></div>` +
    `<div class="row"><span>Pentagons</span><b>12</b></div>` +
    (meshLevel < D
      ? `<div class="warn" style="margin-top:5px">Drawing level ${meshLevel} — ` +
        `${fmt(drawn)} of them. Each one you see stands for <b>${fmt(perDrawn)}</b> real cells.</div>`
      : `<div class="muted" style="margin-top:5px">Every cell on screen is a real one.</div>`);

  const card = document.getElementById('card');
  if (!state.selected) {
    card.innerHTML =
      `<div class="muted">Left click a cell for its address.<br>` +
      `Right click to stand somewhere.</div>` + bitsBar(null);
    return;
  }
  const s = state.selected;
  const { digits, corner } = pathOf(s.i, s.j, D);
  const pent = isPentagon(n, s.i, s.j);
  card.innerHTML =
    `<div class="row"><span>Face</span><b>${s.face} of 20</b></div>` +
    `<div class="row"><span>Lattice (i, j)</span><b>${s.i}, ${s.j} of ${n}</b></div>` +
    `<div class="row"><span>Corner of the last split</span><b>${corner}</b></div>` +
    `<div class="row"><span>Neighbours</span><b>${pent ? '5 — a pentagon' : '6'}</b></div>` +
    `<div style="margin-top:6px" class="muted">Route down the splits</div>` +
    `<div class="mono digits">${digits.join('') || '(the face itself)'}</div>` +
    (meshLevel < D
      ? `<div class="warn" style="margin-top:5px">The ring on the ball is the ` +
        `level ${meshLevel} cell this one sits inside. The address is the real ` +
        `one, at depth ${D}.</div>`
      : '') +
    bitsBar(D);
}

function bitsBar(D) {
  const parts = FIELDS.map((f) =>
    f.name === 'path' ? { ...f, bits: 2 * (D === null ? state.depth : D) } : f);
  const used = parts.reduce((t, f) => t + f.bits, 0);
  const spare = WORD - used;
  const cell = (f) =>
    `<div class="${f.cls}" style="flex:${f.bits}" title="${f.name} ${f.bits} bits">${f.bits}</div>`;
  return (
    `<div style="margin-top:8px" class="row"><span>Word</span>` +
    `<b>${used} of ${WORD} bits${spare < 0 ? ' — over' : `, ${spare} spare`}</b></div>` +
    `<div class="bits">${parts.map(cell).join('')}` +
    (spare > 0 ? `<div class="b-spare" style="flex:${spare}">${spare}</div>` : '') +
    `</div>` +
    `<div class="key">` +
    parts.map((f) => `<span class="k-${f.name}">${f.name}</span>`).join('') +
    (spare > 0 ? `<span class="k-spare">spare</span>` : '') +
    `</div>`
  );
}

// ---------------------------------------------------------------------------
// knobs. Depth, cell size and radius are one quantity written three ways, so
// two of them fix the third and the panel shows which one just moved.
const CELL_STEPS = [];
for (let e = -8; e <= 32; e++) CELL_STEPS.push(2 ** (e / 4));

const el = (id) => document.getElementById(id);

function syncKnobs(moved) {
  el('kDepth').value = String(state.depth);
  el('vDepth').textContent = String(state.depth);
  let step = 0, bestOff = Infinity;
  CELL_STEPS.forEach((v, k) => {
    const off = Math.abs(Math.log(v / state.blockSize));
    if (off < bestOff) { bestOff = off; step = k; }
  });
  el('kCell').value = String(step);
  el('vCell').textContent = metres(state.blockSize);
  el('vRadius').textContent = metres(radius());
  el('kRadius').value = String(Math.round((Math.log2(radius()) - 4) * 20));
  el('vSplit').textContent = String(Math.min(state.split, drawLevel()));
  el('gDepth').textContent = `${fmt(10 * 4 ** state.depth + 2)} cells a layer`;
  el('gCell').textContent = `radius = cell x 2^depth / ${K.toFixed(5)}`;
  el('gRadius').textContent =
    moved === 'radius'
      ? `snapped to depth ${state.depth} — a radius is quantised to powers of two`
      : 'follows from the other two';
  el('gSplit').textContent =
    state.split > drawLevel()
      ? `held at ${drawLevel()} — deeper than this is drawn`
      : `${fmt(20 * 4 ** Math.min(state.split, drawLevel()))} triangles`;
}

el('kDepth').oninput = (e) => {
  state.depth = +e.target.value; remesh(); syncKnobs('depth'); draw();
};
el('kCell').oninput = (e) => {
  state.blockSize = CELL_STEPS[+e.target.value]; syncKnobs('cell'); draw();
};
el('kRadius').oninput = (e) => {
  const asked = 2 ** (+e.target.value / 20 + 4);
  state.depth = Math.max(1, Math.min(17, Math.round(Math.log2((K * asked) / state.blockSize))));
  remesh(); syncKnobs('radius'); draw();
};
el('kSplit').oninput = (e) => {
  state.split = +e.target.value; remesh(); syncKnobs('split'); draw();
};
for (const [id, key] of [['tCells', 'cells'], ['tSplits', 'splits'],
                         ['tFaces', 'faces'], ['tShade', 'shade'], ['tSpin', 'spin']])
  el(id).onclick = () => {
    state[key] = !state[key];
    el(id).classList.toggle('on', state[key]);
    draw();
  };

// ---------------------------------------------------------------------------
// mouse: a drag turns the ball, a click picks, the right button stands
let down = null, dragged = false;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  down = { x: e.clientX, y: e.clientY, button: e.button }; dragged = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
  if (!dragged || down.button !== 0) return;
  state.yaw += dx * 0.006;
  state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch + dy * 0.006));
  down.x = e.clientX; down.y = e.clientY;
  draw();
});
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  if (!dragged) {
    const box = canvas.getBoundingClientRect();
    const hit = pick(e.clientX - box.left, e.clientY - box.top);
    if (hit) {
      if (down.button === 2) state.player = hit;
      else {
        const face = faceOf(hit);
        const [i, j] = hexRound(hit, face, 1 << state.depth);
        state.selected = { face, i, j, dir: hit };
      }
      draw();
    }
  }
  down = null;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.zoom = Math.max(0.6, Math.min(3, state.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  resize();
}, { passive: false });

let last = 0;
function frame(t) {
  if (state.spin && t - last > 16) {
    state.yaw += (t - last) * 0.00012; last = t; draw();
  } else if (!state.spin) last = t;
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
syncKnobs();
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
