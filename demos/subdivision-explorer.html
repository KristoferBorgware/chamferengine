<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subdivision and Level of Detail</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#0b0e14; color:#e6e8ee;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header { padding:14px 16px 10px; }
  h1 { font-size:17px; font-weight:650; letter-spacing:-0.01em; }
  .sub { font-size:12.5px; color:#8b93a7; margin-top:3px; }

  .stage { position:relative; flex:1; min-height:58vh; }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  .hud, .card {
    position:absolute; font-size:12px; line-height:1.55; color:#c7ccd9;
    background:rgba(11,14,20,.78); border:1px solid #222839;
    padding:9px 11px; border-radius:8px; backdrop-filter:blur(6px);
  }
  .hud { top:10px; left:12px; width:292px; max-width:calc(100% - 24px); }
  .card { top:10px; right:12px; width:326px; max-width:calc(100% - 24px); }
  .hud b, .card b { color:#fff; font-weight:600; }
  .muted { color:#8b93a7; }
  .warn { color:#f0b429; }
  .row { display:flex; justify-content:space-between; gap:10px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11.5px; }
  .digits { word-break:break-all; color:#7fd1ae; }
  .ramp { display:flex; height:9px; margin:6px 0 3px; border-radius:3px; overflow:hidden; }
  .ramp div { flex:1; }
  .rampkey { display:flex; justify-content:space-between; font-size:10.5px; color:#8b93a7; }

  .bits { display:flex; height:22px; margin:7px 0 3px; border-radius:4px; overflow:hidden; }
  .bits div { display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; color:#0b0e14; min-width:0; }
  .b-planet { background:#5b6b8c; } .b-face { background:#4f8ef7; }
  .b-path { background:#7fd1ae; } .b-corner { background:#f2c14e; }
  .b-layer { background:#c78bf0; }
  .b-spare { background:#1b2130; color:#6b7488; box-shadow:inset 0 0 0 1px #2a3245; }
  .key { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:10.5px; color:#8b93a7; }
  .key span::before { content:''; display:inline-block; width:8px; height:8px;
    border-radius:2px; margin-right:4px; vertical-align:middle; }
  .k-planet::before { background:#5b6b8c; } .k-face::before { background:#4f8ef7; }
  .k-path::before { background:#7fd1ae; } .k-corner::before { background:#f2c14e; }
  .k-layer::before { background:#c78bf0; } .k-spare::before { background:#2a3245; }

  .panel {
    padding:12px 16px 16px; border-top:1px solid #1b2130; background:#0e121b;
    display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-start;
  }
  .knob { display:flex; flex-direction:column; gap:3px; min-width:184px; }
  .knob label { font-size:11.5px; color:#8b93a7; display:flex; justify-content:space-between; gap:8px; }
  .knob label b { color:#e6e8ee; font-weight:600; }
  .knob input[type=range] { width:100%; accent-color:#4f8ef7; }
  .knob .given { font-size:10.5px; color:#6b7488; min-height:13px; }
  .toggles { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  button {
    font:inherit; font-size:12.5px; font-weight:550;
    padding:7px 11px; border-radius:8px; cursor:pointer;
    background:#1a2130; color:#dfe3ec; border:1px solid #2a3245;
  }
  button:active { transform:scale(.97); }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
</style>
</head>
<body>

<header>
  <h1>Subdivision and level of detail — twenty triangles down to one cell</h1>
  <div class="sub">The splits go deep only where the player stands. Right click to stand somewhere · left click a cell · drag to turn · wheel to zoom. The surface layer only.</div>
</header>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud" id="hud"></div>
  <div class="card" id="card"></div>
</div>

<div class="panel">
  <div class="knob">
    <label>Depth <b id="vDepth">13</b></label>
    <input type="range" id="kDepth" min="3" max="17" step="1" value="13">
    <div class="given" id="gDepth"></div>
  </div>
  <div class="knob">
    <label>Radius <b id="vRadius">—</b></label>
    <input type="range" id="kRadius" min="0" max="1000" step="1" value="500">
    <div class="given" id="gRadius"></div>
  </div>
  <div class="knob">
    <label>Cell size <b id="vCell">—</b></label>
    <input type="range" id="kCell" min="0" max="1000" step="1" value="500">
    <div class="given" id="gCell"></div>
  </div>
  <div class="knob">
    <label>Chunk <b id="vChunk">32</b></label>
    <input type="range" id="kChunk" min="3" max="6" step="1" value="5">
    <div class="given" id="gChunk"></div>
  </div>
  <div class="knob">
    <label>Full detail to <b id="vDetail">2.0</b></label>
    <input type="range" id="kDetail" min="5" max="40" step="1" value="20">
    <div class="given" id="gDetail"></div>
  </div>
  <div class="toggles">
    <button id="tSplits" class="on">Splits</button>
    <button id="tChunks" class="on">Chunks</button>
    <button id="tCells" class="on">Cells</button>
    <button id="tFaces" class="on">Faces</button>
    <button id="tSpin">Spin</button>
  </div>
</div>

<script>
"use strict";

// The constant tying a cell size, a radius and a depth together, from equal-area
// hexagons on a sphere: cellSize = K * radius / 2^depth.
const K = Math.sqrt((8 * Math.PI) / (10 * Math.sqrt(3)));
const CELL_MIN = 0.5, CELL_MAX = 4;   // metres across one cell
const WORD = 64;
const FIELDS = [
  { name: 'planet', bits: 12, cls: 'b-planet' },
  { name: 'face',   bits: 5,  cls: 'b-face'   },
  { name: 'path',   bits: 0,  cls: 'b-path'   },   // 2 per level of depth
  { name: 'corner', bits: 2,  cls: 'b-corner' },
  { name: 'layer',  bits: 11, cls: 'b-layer'  },
];

// ---------------------------------------------------------------------------
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const add3 = (a, b, c) => [a[0] + b[0] + c[0], a[1] + b[1] + c[1], a[2] + b[2] + c[2]];
const cross = (a, b) => [
  a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0],
];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function norm(v) { const l = Math.sqrt(dot(v, v)); return [v[0] / l, v[1] / l, v[2] / l]; }

// ---------------------------------------------------------------------------
// The icosahedron, built rather than transcribed: twelve vertices from the
// golden ratio, then every triple whose three edges are all the shortest
// distance there is, wound counter-clockwise seen from outside.
const PHI = (1 + Math.sqrt(5)) / 2;
const VERTS = [];
for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
  VERTS.push(norm([0, s1, s2 * PHI]));
  VERTS.push(norm([s1, s2 * PHI, 0]));
  VERTS.push(norm([s1 * PHI, 0, s2]));
}
const FACES = (() => {
  let shortest = Infinity;
  for (let a = 0; a < 12; a++) for (let b = a + 1; b < 12; b++) {
    const d = dot(sub(VERTS[a], VERTS[b]), sub(VERTS[a], VERTS[b]));
    if (d < shortest) shortest = d;
  }
  const near = (a, b) =>
    Math.abs(dot(sub(VERTS[a], VERTS[b]), sub(VERTS[a], VERTS[b])) - shortest) < 1e-9;
  const out = [];
  for (let a = 0; a < 12; a++) for (let b = a + 1; b < 12; b++) for (let c = b + 1; c < 12; c++)
    if (near(a, b) && near(b, c) && near(a, c)) {
      const n = cross(sub(VERTS[b], VERTS[a]), sub(VERTS[c], VERTS[a]));
      out.push(dot(n, VERTS[a]) > 0 ? [a, b, c] : [a, c, b]);
    }
  return out;
})();
const CENTROIDS = FACES.map(([a, b, c]) => norm(add3(VERTS[a], VERTS[b], VERTS[c])));

/**
 * Where lattice point (i, j) on a face sits on the ball.
 *
 * One barycentric blend of the face's own three corners, evaluated once and
 * normalised once -- never a chain of arc midpoints, which lands on a
 * different sphere.
 */
function latticeDir(face, n, i, j) {
  const [a, b, c] = FACES[face];
  const w = n - i - j;
  return norm([
    VERTS[a][0] * w + VERTS[b][0] * i + VERTS[c][0] * j,
    VERTS[a][1] * w + VERTS[b][1] * i + VERTS[c][1] * j,
    VERTS[a][2] * w + VERTS[b][2] * i + VERTS[c][2] * j,
  ]);
}

/** Which face a direction is over: the nearest centroid, exactly. */
function faceOf(d) {
  let best = 0, bestDot = -2;
  for (let f = 0; f < 20; f++) { const v = dot(d, CENTROIDS[f]); if (v > bestDot) { bestDot = v; best = f; } }
  return best;
}

/** A direction as weights on one face's three corners, summing to one. */
function baryOf(d, face) {
  const [ia, ib, ic] = FACES[face];
  const A = VERTS[ia], B = VERTS[ib], C = VERTS[ic];
  const det = dot(A, cross(B, C));
  const wa = dot(d, cross(B, C)) / det;
  const wb = dot(A, cross(d, C)) / det;
  const wc = dot(A, cross(B, d)) / det;
  const s = wa + wb + wc;
  return [wa / s, wb / s, wc / s];
}

/**
 * The lattice point a direction belongs to: cube rounding on the three
 * barycentric weights, with the one that moved furthest corrected so they still
 * sum to n.
 *
 * A cell IS the set of directions this maps to it -- the flat Voronoi hexagon
 * projected outward -- rather than "the nearest centre measured on the ball".
 */
function hexRound(d, face, n) {
  const w = baryOf(d, face);
  const x = w[0] * n, y = w[1] * n, z = w[2] * n;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx - x), dy = Math.abs(ry - y), dz = Math.abs(rz - z);
  if (dx > dy && dx > dz) rx = n - ry - rz;
  else if (dy > dz) ry = n - rx - rz;
  else rz = n - rx - ry;
  return [Math.max(0, ry), Math.max(0, rz)];
}

/**
 * The route down the splits to one lattice point, and which corner of the last
 * triangle it is.
 *
 * Four children a level: the three at the corners keep the frame and the middle
 * one is turned half a turn, which is a rotation and not a mirror -- so
 * handedness never changes anywhere on the planet.
 */
function pathOf(i, j, depth) {
  const digits = [];
  let n = 1 << depth;
  for (let level = 0; level < depth; level++) {
    const m = n >> 1;
    if (i >= m) { digits.push(1); i -= m; }
    else if (j >= m) { digits.push(2); j -= m; }
    else if (i + j <= m) { digits.push(0); }
    else { digits.push(3); i = m - i; j = m - j; }
    n = m;
  }
  return { digits, corner: i === 1 ? 1 : j === 1 ? 2 : 0 };
}

const isPentagon = (n, i, j) =>
  (i === 0 && j === 0) || (i === n && j === 0) || (i === 0 && j === n);

// ---------------------------------------------------------------------------
// A triangle in the hierarchy: a level, a lattice cell in that level's grid,
// and whether it points the same way as its face or the other way.
//
// Splitting one gives four. Three keep the parent's own orientation and sit at
// its corners; the fourth is the middle, and it is the one turned half a turn.
function triCorners(t) {
  const n = 1 << t.level;
  return t.up
    ? [[t.i, t.j], [t.i + 1, t.j], [t.i, t.j + 1]]
    : [[t.i + 1, t.j], [t.i, t.j + 1], [t.i + 1, t.j + 1]];
}
function triDirs(t) {
  const n = 1 << t.level;
  return triCorners(t).map(([i, j]) => latticeDir(t.face, n, i, j));
}
function children(t) {
  const i = t.i * 2, j = t.j * 2, L = t.level + 1;
  return t.up
    ? [{ face: t.face, level: L, i, j, up: true },
       { face: t.face, level: L, i: i + 1, j, up: true },
       { face: t.face, level: L, i, j: j + 1, up: true },
       { face: t.face, level: L, i, j, up: false }]
    : [{ face: t.face, level: L, i: i + 1, j, up: false },
       { face: t.face, level: L, i, j: j + 1, up: false },
       { face: t.face, level: L, i: i + 1, j: j + 1, up: false },
       { face: t.face, level: L, i: i + 1, j: j + 1, up: true }];
}

/**
 * Which triangles a viewer sees, each at the level to draw it.
 *
 * The walk starts at the twenty faces, which is what the hierarchy is for. A
 * triangle far enough away for its own width is kept; one closer is split into
 * its four children and each asked again. Children tile their parent exactly,
 * so the surface is covered once, with no gap and no overlap, however the
 * levels fall.
 *
 * `finest` stops it: that is the chunk level, and a triangle there is a chunk.
 * Everything coarser is the same chunk drawn with fewer cells in it -- level of
 * detail is re-sampling the ground at a wider spacing, never dropping cells out
 * of a fine mesh.
 */
function selectTriangles(player, finest, detail, radius) {
  const out = [];
  const walk = (t) => {
    const dirs = triDirs(t);
    const centre = norm(add3(dirs[0], dirs[1], dirs[2]));
    // Half the triangle's own angular reach, and the surface distance to it.
    const spread = Math.acos(Math.min(1, Math.max(-1, dot(centre, dirs[0]))));
    const away = Math.acos(Math.min(1, Math.max(-1, dot(centre, player)))) * radius;
    const width = 2 * spread * radius;
    if (t.level < finest && away < detail * width) {
      for (const child of children(t)) walk(child);
      return;
    }
    out.push({ ...t, centre, dirs, lod: finest - t.level, away, width });
  };
  for (let face = 0; face < 20; face++) walk({ face, level: 0, i: 0, j: 0, up: true });
  return out;
}

// ---------------------------------------------------------------------------
/**
 * The real cells inside a handful of chunks, at the world's own full depth.
 *
 * Only the chunks nearest the player are built, which is the whole point: at
 * depth 13 the planet holds 671 million cells and one chunk holds 561 of them.
 *
 * Every triangle hands its own middle to each of its three corners, so two
 * cells sharing a triangle share that corner exactly and no seam can open
 * between them. A cell that did not collect a full ring sits on the edge of
 * what was built and is left undrawn rather than drawn as a fragment.
 */
function buildPatch(chunks, depth) {
  const n = 1 << depth;
  const points = new Map();      // "i,j" -> [i, j], per face
  const faces = new Map();       // face -> point map
  const room = (face) => {
    if (!faces.has(face)) faces.set(face, new Map());
    return faces.get(face);
  };
  for (const chunk of chunks) {
    const m = 1 << (depth - chunk.level);
    const [p, q, r] = triCorners(chunk).map(([i, j]) => [i * m, j * m]);
    const loI = Math.min(p[0], q[0], r[0]) - 2, hiI = Math.max(p[0], q[0], r[0]) + 2;
    const loJ = Math.min(p[1], q[1], r[1]) - 2, hiJ = Math.max(p[1], q[1], r[1]) + 2;
    const inside = (i, j) => {
      // Barycentric sign test in the lattice, so a down-triangle works too.
      const s = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
      const w = s(p, q, r), pt = [i, j];
      const s1 = s(p, q, pt) / w, s2 = s(q, r, pt) / w, s3 = s(r, p, pt) / w;
      return s1 >= -0.35 && s2 >= -0.35 && s3 >= -0.35;
    };
    const at = room(chunk.face);
    for (let i = Math.max(0, loI); i <= Math.min(n, hiI); i++)
      for (let j = Math.max(0, loJ); j <= Math.min(n - i, hiJ); j++)
        if (inside(i, j)) at.set(i + ',' + j, [i, j]);
  }

  const cells = new Map();
  const dirCache = new Map();
  const dirAt = (face, i, j) => {
    const key = face + ':' + i + ',' + j;
    let d = dirCache.get(key);
    if (!d) { d = latticeDir(face, n, i, j); dirCache.set(key, d); }
    return d;
  };
  const keyOf = (face, i, j) => {
    const [a, b, c] = FACES[face];
    const parts = [[a, n - i - j], [b, i], [c, j]].filter((x) => x[1] > 0);
    parts.sort((x, y) => x[0] - y[0]);
    return parts.map((x) => x[0] + ':' + x[1]).join('|');
  };
  const take = (face, i, j, middle) => {
    const key = keyOf(face, i, j);
    let cell = cells.get(key);
    if (!cell) {
      cell = { dir: dirAt(face, i, j), corners: [], face, i, j, pent: isPentagon(n, i, j) };
      cells.set(key, cell);
    }
    cell.corners.push(middle);
  };
  for (const [face, at] of faces) {
    const has = (i, j) => at.has(i + ',' + j);
    for (const [, [i, j]] of at) {
      if (has(i + 1, j) && has(i, j + 1)) {
        const up = norm(add3(dirAt(face, i, j), dirAt(face, i + 1, j), dirAt(face, i, j + 1)));
        take(face, i, j, up); take(face, i + 1, j, up); take(face, i, j + 1, up);
      }
      if (has(i + 1, j) && has(i, j + 1) && has(i + 1, j + 1)) {
        const down = norm(add3(dirAt(face, i + 1, j), dirAt(face, i, j + 1), dirAt(face, i + 1, j + 1)));
        take(face, i + 1, j, down); take(face, i, j + 1, down); take(face, i + 1, j + 1, down);
      }
    }
  }
  const out = [];
  for (const cell of cells.values()) {
    const want = cell.pent ? 5 : 6;
    if (cell.corners.length !== want) continue;      // on the rim of what was built
    const up = cell.dir;
    const ref = Math.abs(up[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
    const east = norm(cross(up, ref));
    const north = cross(up, east);
    cell.corners.sort((p, q) =>
      Math.atan2(dot(p, north), dot(p, east)) - Math.atan2(dot(q, north), dot(q, east)));
    // Which chunk owns it: the first `chunkLevel` digits of its own route down
    // the splits, which is the same truncation the address makes.
    const route = pathOf(cell.i, cell.j, depth).digits.slice(0, chunkLevel());
    let h = cell.face * 7;
    for (const d of route) h = (h * 4 + d) % 360;
    cell.hue = (h * 61) % 360;
    out.push(cell);
  }
  return out;
}

// ---------------------------------------------------------------------------
const state = {
  depth: 13,
  cellSize: 1,
  chunkBits: 5,          // cells along a chunk edge = 2^chunkBits
  detail: 2,
  splits: true, chunks: true, cells: true, faces: true, spin: false,
  yaw: 0.6, pitch: 0.35, zoom: 1,
  player: [0, 0, 1],   // put under the eye once the camera is known
  selected: null,
};
const radius = () => (state.cellSize * 2 ** state.depth) / K;
const radiusRange = () => [
  (CELL_MIN * 2 ** state.depth) / K, (CELL_MAX * 2 ** state.depth) / K,
];
const chunkCells = () => 1 << state.chunkBits;
const chunkLevel = () => Math.max(0, state.depth - state.chunkBits);

/** How many chunks around the player get their real cells drawn. */
const PATCH_CHUNKS = 12;

let tris = [], patch = [], patchChunks = 0;
function rebuild() {
  tris = selectTriangles(state.player, chunkLevel(), state.detail, radius());
  const full = tris
    .filter((t) => t.level === chunkLevel())
    .sort((a, b) => a.away - b.away)
    .slice(0, PATCH_CHUNKS);
  patchChunks = full.length;
  patch = state.cells && full.length ? buildPatch(full, state.depth) : [];
}

// ---------------------------------------------------------------------------
// camera: the model turns, the eye does not
function rotate(v) {
  const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const x = v[0] * cy + v[2] * sy;
  const z = -v[0] * sy + v[2] * cy;
  return [x, v[1] * cp - z * sp, z * cp + v[1] * sp];
}
function unrotate(v) {
  const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const y = v[1] * cp + v[2] * sp;
  const z = -v[1] * sp + v[2] * cp;
  return [v[0] * cy - z * sy, y, v[0] * sy + z * cy];
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, cx = 0, cy = 0, scale = 1;
const EYE = 3.4;

/**
 * How big the ball is drawn.
 *
 * The radius runs from a couple of metres to hundreds of kilometres across the
 * knobs, which is four orders of magnitude and cannot be drawn to scale beside
 * itself. The drawn size follows the logarithm of it, so the knob is visibly
 * alive and the order is right, and the readout carries the metres.
 */
function ballScale() {
  const span = Math.log2(radius() / 1.4) / 18;
  return (0.28 + 0.20 * Math.max(0, Math.min(1, span)));
}

function resize() {
  const box = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, Math.round(box.width)); H = Math.max(1, Math.round(box.height));
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  scale = Math.min(W, H) * ballScale() * state.zoom;
  draw();
}

/** Project a rotated unit direction. Behind the limb it returns nothing. */
function project(v) {
  if (v[2] < 1 / EYE) return null;
  const k = (scale * EYE) / (EYE - v[2]);
  return [cx + v[0] * k, cy - v[1] * k];
}
const rimRadius = () => (scale * EYE) / Math.sqrt(EYE * EYE - 1);

/**
 * The same, with a point just past the limb held on it rather than dropped.
 *
 * A cell whose middle is in view can have a corner a few metres over the
 * horizon, and dropping the whole cell for it takes a ring of them off the edge
 * of the ball.
 */
function projectHeld(v) {
  const p = project(v);
  if (p) return p;
  const len = Math.sqrt(v[0] * v[0] + v[1] * v[1]) || 1;
  const rim = rimRadius();
  return [cx + (v[0] / len) * rim, cy - (v[1] / len) * rim];
}

/** The direction under a screen point, or nothing if it missed the ball. */
function pick(sx, sy) {
  const px = (sx - cx) / scale, py = -(sy - cy) / scale;
  const dir = norm([px / EYE, py / EYE, -1]);
  const o = [0, 0, EYE];
  const b = dot(o, dir), c = dot(o, o) - 1;
  const disc = b * b - c;
  if (disc < 0) return null;
  const t = -b - Math.sqrt(disc);
  return unrotate(norm([o[0] + dir[0] * t, o[1] + dir[1] * t, o[2] + dir[2] * t]));
}

// ---------------------------------------------------------------------------
/** Coarse is cold and fine is warm, so the bands read at a glance. */
function lodColor(lod, maxLod, alpha) {
  const t = maxLod > 0 ? Math.min(1, lod / maxLod) : 0;
  return `hsl(${(150 + 110 * t).toFixed(0)} ${(70 - 25 * t).toFixed(0)}% ${(62 - 18 * t).toFixed(0)}% / ${alpha})`;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const rim = rimRadius();
  const g = ctx.createRadialGradient(cx - rim * 0.3, cy - rim * 0.3, rim * 0.1, cx, cy, rim);
  g.addColorStop(0, '#161d2b'); g.addColorStop(1, '#0c1017');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, rim, 0, 2 * Math.PI); ctx.fill();

  const maxLod = tris.reduce((m, t) => Math.max(m, t.lod), 0);

  // The selection, coarse triangles first so the fine ones sit over them. Every
  // edge here is a split that was made; where they crowd is where the player is.
  if (state.splits) {
    const order = [...tris].sort((a, b) => a.level - b.level);
    for (const t of order) {
      // Drawn if any part of it is on this side of the limb, so a face-sized
      // triangle straddling the edge is not dropped whole.
      if (!t.dirs.some((d) => rotate(d)[2] >= 1 / EYE)
          && rotate(t.centre)[2] < 1 / EYE) continue;
      const dirs = t.dirs;
      ctx.strokeStyle = lodColor(t.lod, maxLod, 0.85);
      ctx.lineWidth = t.level === chunkLevel() ? 1.5 : 0.7 + 0.5 * (chunkLevel() - t.level) / Math.max(1, chunkLevel()) * 3;
      ctx.beginPath();
      arc(dirs[0], dirs[1]); arc(dirs[1], dirs[2]); arc(dirs[2], dirs[0]);
      ctx.stroke();
    }
  }

  // The real cells, at the world's own depth, in the chunks nearest the player.
  if (state.cells) {
    for (const cell of patch) {
      const up = rotate(cell.dir);
      if (up[2] < 1 / EYE) continue;
      const path = new Path2D();
      for (let k = 0; k < cell.corners.length; k++) {
        const p = projectHeld(rotate(cell.corners[k]));
        if (k === 0) path.moveTo(p[0], p[1]); else path.lineTo(p[0], p[1]);
      }
      path.closePath();
      ctx.fillStyle = cell.pent
        ? 'rgba(242,84,61,.92)'
        : `hsl(${cell.hue} 38% 52% / 0.62)`;
      ctx.fill(path);
      ctx.strokeStyle = 'rgba(11,14,20,.7)'; ctx.lineWidth = 0.6; ctx.stroke(path);
    }
  }

  // The chunks that reached full detail: the ones whose cells are drawn.
  if (state.chunks) {
    for (const t of tris) {
      if (t.level !== chunkLevel()) continue;
      if (rotate(t.centre)[2] < 1 / EYE) continue;
      // Outlined rather than filled, so the cells inside stay visible.
      ctx.strokeStyle = '#4f8ef7'; ctx.lineWidth = 2;
      ctx.beginPath();
      arc(t.dirs[0], t.dirs[1]); arc(t.dirs[1], t.dirs[2]); arc(t.dirs[2], t.dirs[0]);
      ctx.stroke();
    }
  }


  if (state.faces) {
    ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let face = 0; face < 20; face++) {
      const [a, b, c] = FACES[face];
      arc(VERTS[a], VERTS[b]); arc(VERTS[b], VERTS[c]); arc(VERTS[c], VERTS[a]);
    }
    ctx.stroke();
  }

  if (state.selected) outlineSelected();
  marker(state.player);
  readout();
}

/** A great-circle segment, in enough pieces that the limb stays curved. */
function arc(u, v) {
  const STEPS = 16;
  let first = true;
  for (let s = 0; s <= STEPS; s++) {
    const t = s / STEPS;
    const p = project(rotate(norm([
      u[0] + (v[0] - u[0]) * t, u[1] + (v[1] - u[1]) * t, u[2] + (v[2] - u[2]) * t,
    ])));
    if (!p) { first = true; continue; }
    if (first) { ctx.moveTo(p[0], p[1]); first = false; } else ctx.lineTo(p[0], p[1]);
  }
}

function outlineSelected() {
  const s = state.selected;
  const cell = patch.find((c) => c.face === s.face && c.i === s.i && c.j === s.j);
  if (!cell) return;
  ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
  ctx.beginPath();
  cell.corners.forEach((corner, k) => {
    const p = projectHeld(rotate(corner));
    if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  });
  ctx.closePath(); ctx.stroke();
}

function marker(dir) {
  const p = project(rotate(dir));
  if (!p) return;
  for (const [w, col] of [[3.6, '#000'], [1.7, '#fff']]) {
    ctx.lineWidth = w; ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(p[0], p[1], 5.5, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath();
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      ctx.moveTo(p[0] + dx * 11, p[1] + dy * 11);
      ctx.lineTo(p[0] + dx * 7, p[1] + dy * 7);
    }
    ctx.stroke();
  }
}

// ---------------------------------------------------------------------------
const fmt = (x) => x.toLocaleString('en-US');
function metres(m) {
  if (m >= 1000) return (m / 1000).toFixed(m >= 10000 ? 0 : 2) + ' km';
  if (m >= 1) return m.toFixed(m >= 100 ? 0 : 2) + ' m';
  return (m * 100).toFixed(1) + ' cm';
}

function readout() {
  const D = state.depth;
  const C = chunkLevel();
  const maxLod = tris.reduce((m, t) => Math.max(m, t.lod), 0);
  const chunkSpan = chunkCells() * state.cellSize;
  const ramp = [];
  for (let lod = 0; lod <= maxLod; lod++)
    ramp.push(`<div style="background:${lodColor(lod, maxLod, 1)}"></div>`);

  document.getElementById('hud').innerHTML =
    `<div class="row"><span>Cells on the planet</span><b>${fmt(10 * 4 ** D + 2)}</b></div>` +
    `<div class="row"><span>Chunks on the planet</span><b>${fmt(20 * 4 ** C)}</b></div>` +
    `<div class="row"><span>Chunk across</span><b>${metres(chunkSpan)}, ${fmt(chunkCells())} cells</b></div>` +
    `<div class="row"><span>Chunk level</span><b>${C} of ${D}</b></div>` +
    `<div style="margin-top:6px" class="row"><span>Triangles drawn</span><b>${fmt(tris.length)}</b></div>` +
    `<div class="row"><span>At full detail</span><b>${fmt(tris.filter((t) => t.level === C).length)}</b></div>` +
    `<div class="row"><span>Real cells drawn</span><b>${fmt(patch.length)}</b></div>` +
    `<div class="row"><span>Chunks with cells built</span><b>${fmt(patchChunks)}</b></div>` +
    `<div class="ramp">${ramp.join('')}</div>` +
    `<div class="rampkey"><span>full detail</span><span>${maxLod} levels coarser</span></div>` +
    `<div class="muted" style="margin-top:5px">` +
    `${fmt(tris.length)} triangles cover the whole planet, against ` +
    `<b>${fmt(20 * 4 ** C)}</b> if every chunk were drawn at full detail.</div>`;

  const card = document.getElementById('card');
  if (!state.selected) {
    card.innerHTML =
      `<div class="muted">Left click a cell in the blue chunks for its address.<br>` +
      `Right click anywhere to stand there.</div>` + bitsBar(D);
    return;
  }
  const s = state.selected, n = 1 << D;
  const { digits, corner } = pathOf(s.i, s.j, D);
  const pent = isPentagon(n, s.i, s.j);
  card.innerHTML =
    `<div class="row"><span>Face</span><b>${s.face} of 20</b></div>` +
    `<div class="row"><span>Lattice (i, j)</span><b>${fmt(s.i)}, ${fmt(s.j)} of ${fmt(n)}</b></div>` +
    `<div class="row"><span>Corner of the last split</span><b>${corner}</b></div>` +
    `<div class="row"><span>Neighbours</span><b>${pent ? '5 — a pentagon' : '6'}</b></div>` +
    `<div style="margin-top:6px" class="muted">Route down the splits — the first ` +
    `${C} digits name the chunk</div>` +
    `<div class="mono digits"><b style="color:#4f8ef7">${digits.slice(0, C).join('')}</b>` +
    `${digits.slice(C).join('')}</div>` +
    bitsBar(D);
}

function bitsBar(D) {
  const parts = FIELDS.map((f) => (f.name === 'path' ? { ...f, bits: 2 * D } : f));
  const used = parts.reduce((t, f) => t + f.bits, 0);
  const spare = WORD - used;
  return (
    `<div style="margin-top:8px" class="row"><span>Word</span>` +
    `<b>${used} of ${WORD} bits${spare < 0 ? ' — over' : `, ${spare} spare`}</b></div>` +
    `<div class="bits">` +
    parts.map((f) => `<div class="${f.cls}" style="flex:${f.bits}" title="${f.name} ${f.bits} bits">${f.bits}</div>`).join('') +
    (spare > 0 ? `<div class="b-spare" style="flex:${spare}">${spare}</div>` : '') +
    `</div><div class="key">` +
    parts.map((f) => `<span class="k-${f.name}">${f.name}</span>`).join('') +
    (spare > 0 ? `<span class="k-spare">spare</span>` : '') + `</div>`
  );
}

// ---------------------------------------------------------------------------
// Depth, radius and cell size are one quantity written three ways, so two of
// them fix the third. Depth is a whole number; inside one depth the radius
// still has an eightfold range, because that is the range of cell sizes.
const el = (id) => document.getElementById(id);
const lerpLog = (t, lo, hi) => lo * (hi / lo) ** t;
const invLog = (v, lo, hi) => Math.log(v / lo) / Math.log(hi / lo);

function syncKnobs(moved) {
  const [rLo, rHi] = radiusRange();
  el('kDepth').value = String(state.depth);
  el('vDepth').textContent = String(state.depth);
  el('kRadius').value = String(Math.round(1000 * invLog(radius(), rLo, rHi)));
  el('vRadius').textContent = metres(radius());
  el('kCell').value = String(Math.round(1000 * invLog(state.cellSize, CELL_MIN, CELL_MAX)));
  el('vCell').textContent = metres(state.cellSize);
  el('vChunk').textContent = String(chunkCells());
  el('vDetail').textContent = state.detail.toFixed(1);
  el('gDepth').textContent = `${fmt(10 * 4 ** state.depth + 2)} cells a layer`;
  el('gRadius').textContent =
    `${metres(rLo)} to ${metres(rHi)} at this depth`;
  el('gCell').textContent = `radius = cell x 2^depth / ${K.toFixed(5)}`;
  el('gChunk').textContent = `chunk level ${chunkLevel()}, ${fmt(20 * 4 ** chunkLevel())} on the planet`;
  el('gDetail').textContent = 'chunk widths from the player';
}

el('kDepth').oninput = (e) => {
  state.depth = +e.target.value;
  state.selected = null;
  rebuild(); syncKnobs(); resize();
};
el('kRadius').oninput = (e) => {
  const [lo, hi] = radiusRange();
  state.cellSize = (lerpLog(+e.target.value / 1000, lo, hi) * K) / 2 ** state.depth;
  rebuild(); syncKnobs(); resize();
};
el('kCell').oninput = (e) => {
  state.cellSize = lerpLog(+e.target.value / 1000, CELL_MIN, CELL_MAX);
  rebuild(); syncKnobs(); resize();
};
el('kChunk').oninput = (e) => {
  state.chunkBits = +e.target.value; rebuild(); syncKnobs(); draw();
};
el('kDetail').oninput = (e) => {
  state.detail = +e.target.value / 10; rebuild(); syncKnobs(); draw();
};
for (const [id, key] of [['tSplits', 'splits'], ['tChunks', 'chunks'],
                         ['tCells', 'cells'], ['tFaces', 'faces'], ['tSpin', 'spin']])
  el(id).onclick = () => {
    state[key] = !state[key];
    el(id).classList.toggle('on', state[key]);
    if (key === 'cells') rebuild();
    draw();
  };

// ---------------------------------------------------------------------------
let down = null, dragged = false;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  down = { x: e.clientX, y: e.clientY, button: e.button }; dragged = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
  if (!dragged || down.button !== 0) return;
  state.yaw += dx * 0.006;
  state.pitch = Math.max(-1.4, Math.min(1.4, state.pitch + dy * 0.006));
  down.x = e.clientX; down.y = e.clientY;
  draw();
});
canvas.addEventListener('pointerup', (e) => {
  if (down && !dragged) {
    const box = canvas.getBoundingClientRect();
    const hit = pick(e.clientX - box.left, e.clientY - box.top);
    if (hit) {
      if (down.button === 2) { state.player = hit; state.selected = null; rebuild(); }
      else {
        const face = faceOf(hit);
        const [i, j] = hexRound(hit, face, 1 << state.depth);
        state.selected = { face, i, j };
      }
      draw();
    }
  }
  down = null;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.zoom = Math.max(0.6, Math.min(4000, state.zoom * (e.deltaY < 0 ? 1.18 : 1 / 1.18)));
  resize();
}, { passive: false });

let last = 0;
function frame(t) {
  if (state.spin && t - last > 16) { state.yaw += (t - last) * 0.00012; last = t; draw(); }
  else if (!state.spin) last = t;
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
state.player = unrotate([0, 0, 1]);   // start facing the eye
rebuild(); syncKnobs(); resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
