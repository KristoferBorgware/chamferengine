<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why a flat lake stops a river</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0e14; color:#e6e8ee; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px 4px; }
  h1 { font-size:16px; font-weight:650; }
  .sub { font-size:13px; color:#8d97ab; padding:2px 16px 8px; }
  .cap { padding:4px 16px 10px; font-size:13.5px; line-height:1.55; color:#b9c0d0; min-height:76px; }
  .cap b { color:#fff; }
  .cap .bad { color:#f2545b; font-weight:650; }
  .cap .ok  { color:#3fb8af; font-weight:650; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:0 8px; }
  svg { width:100%; height:auto; max-height:100%; }
  .panel { padding:12px 14px 18px; border-top:1px solid #1b2130; background:#0e121b;
           display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; font-weight:550; padding:9px 14px; border-radius:9px;
           cursor:pointer; background:#1a2130; color:#dfe3ec; border:1px solid #2a3245; }
  button:active { transform:scale(.97); }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
  .spacer { flex:1; }
  .stat { font-size:13px; font-weight:650; padding:7px 12px; border-radius:8px;
          font-variant-numeric:tabular-nums; background:#232a3a; color:#b9c0d0; }
  .stat.bad { background:#3a1518; color:#ff8f96; }
  .stat.ok  { background:#123330; color:#5fd8cd; }
  .busy { padding:4px 16px 10px; font-size:13px; color:#8d97ab; }
</style>
</head>
<body>

<header><h1>Why a flat lake stops a river</h1></header>
<div class="sub">Rivers run downhill. A perfectly flat lake has no downhill.</div>
<div class="cap" id="cap">Building the world…</div>

<div class="stage"><svg id="svg" viewBox="-320 -320 640 640" aria-label="rivers and lakes"></svg></div>

<div class="panel">
  <button data-fill="flat" class="on">Fill lakes flat</button>
  <button data-fill="slope">Fill with a slope</button>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
</div>

<script>
// ---------------------------------------------------------------------------
// The same grid and the same routing as verification/rivers.js, at one level
// coarser so it builds in a browser. Cells are the vertices of a subdivided
// icosahedron; a cell's neighbours are the cells it shares an edge with.
// ---------------------------------------------------------------------------
const T = (1 + Math.sqrt(5)) / 2;
const norm  = v => { const l = Math.hypot(...v); return v.map(x => x/l); };
const sub   = (a,b) => a.map((x,i) => x - b[i]);
const dot   = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

const V0 = [[-1,T,0],[1,T,0],[-1,-T,0],[1,-T,0],[0,-1,T],[0,1,T],[0,-1,-T],[0,1,-T],
            [T,0,-1],[T,0,1],[-T,0,-1],[-T,0,1]].map(norm);
const F0 = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
            [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];

function grid(L){
  const n = 1 << L, idx = new Map(), pts = [], nb = [];
  const put = p => { const k = p.map(x => Math.round(x*1e7)).join(',');
    if (!idx.has(k)){ idx.set(k, pts.length); pts.push(p); nb.push(new Set()); } return idx.get(k); };
  const link = (a,b) => { nb[a].add(b); nb[b].add(a); };
  for (const f of F0){
    const [A,B,C] = f.map(i => V0[i]), P = [];
    for (let i=0;i<=n;i++){ const row=[];
      for (let j=0;j<=i;j++){ const a=(n-i)/n, b=(i-j)/n, c=j/n;
        row.push(put(norm([A[0]*a+B[0]*b+C[0]*c, A[1]*a+B[1]*b+C[1]*c, A[2]*a+B[2]*b+C[2]*c]))); }
      P.push(row); }
    for (let i=0;i<n;i++) for (let j=0;j<=i;j++){
      link(P[i][j],P[i+1][j]); link(P[i][j],P[i+1][j+1]); link(P[i+1][j],P[i+1][j+1]); }
  }
  const ring = pts.map((p,v) => {
    const e1 = norm(sub(pts[[...nb[v]][0]], p)), e2 = cross(p, e1);
    return [...nb[v]].sort((a,b) => {
      const A2 = sub(pts[a],p), B2 = sub(pts[b],p);
      return Math.atan2(dot(A2,e2),dot(A2,e1)) - Math.atan2(dot(B2,e2),dot(B2,e1));
    });
  });
  return { pts, ring };
}

// integer-hashed value noise -- no Math.sin, so it is the same on every machine
function hash3(x,y,z){
  let h = x*374761393 + y*668265263 + z*1274126177;
  h = (h ^ (h >>> 13)) >>> 0; h = Math.imul(h, 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(p){
  const x=Math.floor(p[0]), y=Math.floor(p[1]), z=Math.floor(p[2]);
  const fx=p[0]-x, fy=p[1]-y, fz=p[2]-z;
  const s=t=>t*t*(3-2*t), sx=s(fx), sy=s(fy), sz=s(fz);
  let v=0;
  for (let dz=0;dz<2;dz++) for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++)
    v += (dx?sx:1-sx)*(dy?sy:1-sy)*(dz?sz:1-sz) * hash3(x+dx,y+dy,z+dz);
  return v*2-1;
}
const fbm = (p,f,oct) => { let v=0,a=1,tot=0,ff=f;
  for (let o=0;o<oct;o++){ v += a*vnoise([p[0]*ff,p[1]*ff,p[2]*ff]); tot+=a; a*=0.5; ff*=2; }
  return v/tot; };

const { pts, ring } = grid(6);
const N = pts.length;

// ---- terrain, and where the sea is ----------------------------------------
const RELIEF = 60;
const ground = new Float64Array(N);
for (let v=0;v<N;v++) ground[v] = fbm(pts[v], 2.2, 6) * RELIEF;
const SEA = Float64Array.from(ground).sort()[Math.floor(N*0.62)];
const isSea = v => ground[v] <= SEA;

// ---- priority-flood pit filling -------------------------------------------
// Water cannot flow out of a hollow, so the hollow fills up until it can. EPS is
// the whole question: fill perfectly flat and the lake has no downhill anywhere
// inside it, so nothing that arrives can leave.
function fill(EPS){
  const filled = Float64Array.from(ground), done = new Uint8Array(N), hq = [];
  const push = (k,v) => { hq.push([k,v]); let i=hq.length-1;
    while (i>0){ const p=(i-1)>>1; if (hq[p][0] <= hq[i][0]) break; [hq[p],hq[i]]=[hq[i],hq[p]]; i=p; } };
  const pop = () => { const top=hq[0], last=hq.pop();
    if (hq.length){ hq[0]=last; let i=0;
      for(;;){ const l=2*i+1, r=l+1; let m=i;
        if (l<hq.length && hq[l][0]<hq[m][0]) m=l;
        if (r<hq.length && hq[r][0]<hq[m][0]) m=r;
        if (m===i) break; [hq[m],hq[i]]=[hq[i],hq[m]]; i=m; } }
    return top; };
  for (let v=0;v<N;v++) if (isSea(v)){ done[v]=1; push(ground[v], v); }
  while (hq.length){ const [k,v] = pop();
    for (const w of ring[v]){ if (done[w]) continue; done[w]=1;
      if (filled[w] <= k) filled[w] = k + EPS;
      push(filled[w], w); } }
  return filled;
}

// ---- flow routing, and what fails to reach the sea -------------------------
function route(filled){
  const down = new Int32Array(N).fill(-1);
  let stuck = 0, lake = 0;
  for (let v=0;v<N;v++){
    if (isSea(v)) continue;
    if (filled[v] > ground[v] + 1e-12) lake++;
    let best = -1, bh = filled[v];
    for (const w of ring[v]) if (filled[w] < bh){ bh = filled[w]; best = w; }
    down[v] = best;
    if (best < 0) stuck++;                    // nowhere downhill: the river stops
  }
  // accumulation: every land cell sends one unit down the chain
  const order = [...Array(N).keys()].filter(v => !isSea(v))
    .sort((a,b) => filled[b] - filled[a]);
  const acc = new Float64Array(N).fill(1);
  for (const v of order) if (down[v] >= 0) acc[down[v]] += acc[v];
  return { down, acc, stuck, lake };
}

const RESULT = { flat: null, slope: null };
RESULT.flat  = (() => { const f = fill(0);    return { filled:f, ...route(f) }; })();
RESULT.slope = (() => { const f = fill(1e-4); return { filled:f, ...route(f) }; })();

// ---- pick somewhere worth looking at --------------------------------------
// the cell with the most lake around it, so the picture contains the argument
const dist = src => { const d = new Int32Array(N).fill(-1); d[src]=0; const q=[src];
  for (let i=0;i<q.length;i++) for (const w of ring[q[i]]) if (d[w]<0){ d[w]=d[q[i]]+1; q.push(w); }
  return d; };
let focus = 0, bestScore = -1;
for (let v=0; v<N; v+=7){
  if (isSea(v)) continue;
  let s = 0;
  for (const w of ring[v]) if (RESULT.flat.filled[w] > ground[w] + 1e-12) s++;
  s += RESULT.flat.acc[v] * 0.02;
  if (s > bestScore){ bestScore = s; focus = v; }
}
const dFocus = dist(focus);
const view = []; for (let v=0;v<N;v++) if (dFocus[v] <= 17) view.push(v);
const inView = new Set(view);

const C = pts[focus];
let e1 = norm(sub(pts[ring[focus][0]], C));
e1 = norm(sub(e1, C.map(x => x*dot(e1,C))));
const e2 = cross(C, e1);
const gn = v => { const q = pts[v], s = dot(q,C), t = q.map(x => x/s); return [dot(t,e1), dot(t,e2)]; };
const SCALE = 300 / Math.max(...view.map(v => Math.hypot(...gn(v))));
const XY = new Map(view.map(v => { const [a,b] = gn(v); return [v, [a*SCALE, -b*SCALE]]; }));
const PX = Math.hypot(...sub(XY.get(ring[focus][0]), XY.get(focus)));

// ---------------------------------------------------------------------------
// Draw
// ---------------------------------------------------------------------------
let mode = 'flat';
const lerp = (a,b,t) => a.map((x,i) => Math.round(x + (b[i]-x)*t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function draw(){
  const R = RESULT[mode];
  const S = [];
  // land and water
  const lo = Math.min(...view.map(v => ground[v])), hi = Math.max(...view.map(v => ground[v]));
  for (const v of view){
    const [x,y] = XY.get(v);
    let col;
    if (isSea(v)) col = '#16324f';
    else if (R.filled[v] > ground[v] + 1e-12) col = '#2f6fd0';           // lake
    else {
      const t = (ground[v]-lo)/(hi-lo+1e-9);
      col = rgb(lerp([46,74,52],[122,116,88], t));                        // low to high land
    }
    S.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(PX*0.60).toFixed(1)}" fill="${col}"/>`);
  }
  // rivers: width by how much land drains through
  for (const v of view){
    if (isSea(v) || R.down[v] < 0 || !inView.has(R.down[v])) continue;
    const a = R.acc[v];
    if (a < 6) continue;
    const [x1,y1] = XY.get(v), [x2,y2] = XY.get(R.down[v]);
    const w = Math.min(PX*0.55, PX*0.10*Math.sqrt(a/6));
    S.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
             stroke="#7fd4ff" stroke-width="${w.toFixed(2)}" stroke-linecap="round" opacity="0.95"/>`);
  }
  // where the water gives up
  let shown = 0;
  for (const v of view){
    if (isSea(v) || R.down[v] >= 0) continue;
    if (R.acc[v] < 3) continue;
    shown++;
    const [x,y] = XY.get(v);
    S.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(PX*0.62).toFixed(1)}"
             fill="none" stroke="#f2545b" stroke-width="${(PX*0.20).toFixed(1)}"/>`);
  }
  document.getElementById('svg').innerHTML = S.join('');

  const st = document.getElementById('stat');
  st.textContent = `${R.stuck.toLocaleString('en-US')} dead ends on the planet`;
  st.className = 'stat ' + (R.stuck ? 'bad' : 'ok');
  document.getElementById('cap').innerHTML = mode === 'flat'
    ? `Lakes filled <b>perfectly flat</b>. Every cell in a lake is exactly the height of every other, so no cell has a lower neighbour and the water has nowhere to go. Rivers run downhill into the lake and <span class="bad">stop dead</span> — ringed in red. There are <b>${R.stuck.toLocaleString('en-US')}</b> of these across the planet, and the sea is right there.`
    : `Same terrain, same routing. The fill now adds <b>a ten-thousandth of a metre</b> of slope per cell as it spreads — enough to order the lake, far too little to see. Every river now runs through its lake and out to the sea: <span class="ok">${R.stuck.toLocaleString('en-US')} dead ends</span>. The lake is still flat to look at; it just is not flat to sort by.`;
}

document.querySelectorAll('[data-fill]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-fill]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); mode = b.dataset.fill; draw();
}));
draw();
</script>
</body>
</html>
