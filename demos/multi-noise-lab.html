			}

			const ROWS = new Map();
			for (const g of KNOBS) for (const r of g.rows) ROWS.set(r.key, r);

			function value(key) {
				return knobs[key];
			}

			/** Metres across a layer's widest octave, which is what its two rows set. */
			function featureMetres(which) {
				return Math.max(
					1,
					knobs[which + "Feature"] * knobs[which + "FeatureScale"],
				);
			}

			/**
			 * Metres across a layer's narrowest octave.
			 *
			 * Each octave is `Step between octaves` times narrower than the one
			 * above it, so the last is the widest divided by that step to the
			 * power of one less than the count. **This is the number the map has
			 * to be fine enough to draw**: ground the map cannot carry is ground
			 * the world does not have.
			 */
			function narrowestOf(which) {
				return (
					featureMetres(which) /
					knobs[which + "Lacunarity"] ** (knobs[which + "Octaves"] - 1)
				);
			}

			/**
			 * What the knobs come to, in the units the engine states them in.
			 *
			 * **Depth and block size fix the radius**, and the map cell picks the
			 * level nearest the spacing asked for -- then the cell is whatever
			 * that level actually gives, because a level is a whole number and a
			 * spacing is not.
			 */
			function derived() {
				const k = {};
				for (const key of ROWS.keys()) k[key] = knobs[key];
				k.radius =
					(knobs.blockSize * 2 ** knobs.subdivisionDepth) / CELL_CONSTANT;
				k.level = Math.max(
					2,
					Math.min(
						knobs.subdivisionDepth,
						9,
						Math.max(
							0,
							Math.round(
								Math.log2((CELL_CONSTANT * k.radius) / knobs.coarseSpacing),
							),
						),
					),
				);
				k.cellMetres = (CELL_CONSTANT * k.radius) / 2 ** k.level;
				// **The block grid, which is what the world is actually built
				// out of.** The map is the terrain and a map cell is coarse, so
				// the ground between two map readings is a ramp; the engine
				// builds that ramp out of blocks, and a block is a hexagon one
				// layer tall at the *subdivision* level rather than the map's.
				// Drawn at the map's own level a hillside is one hexagon per
				// reading and there is nowhere for a cliff to stand.
				k.blockLevel = Math.min(17, k.level + k.blockDetail);
				k.blockMetres = (CELL_CONSTANT * k.radius) / 2 ** k.blockLevel;
				for (const which of LAYERS) k[which + "Metres"] = featureMetres(which);
				return k;
			}

			/**
			 * A knob's own ends, narrowed by the rest of the draft.
			 *
			 * **A slider that cannot be moved into a refusal beats a refusal that
			 * explains itself.** The world is the map, so an octave narrower than
			 * a map cell is ground the map cannot carry and the world would not
			 * build. Rather than let a slider reach that and then complain, the
			 * slider's own end moves. The narrowing only ever moves an end
			 * inward.
			 */
			function liveRange(row) {
				// The sea can be drained and no further: below the bottom of the
				// continentalness curve there is no ocean left to take away.
				if (row.key === "seaLevel")
					return { ...row, low: Math.max(row.low, -knobs.seaDepth) };
				// **A block grid four levels under the map is sixteen times the
				// columns across and two hundred and fifty-six times as many of
				// them.** The patch is set in map cells, so the two knobs
				// multiply, and this end moves rather than letting the pair of
				// them ask for a patch nothing can build.
				if (row.key === "blockDetail")
					return {
						...row,
						high: Math.max(
							row.low,
							Math.min(
								row.high,
								Math.floor(Math.log2(PATCH_COLUMNS / knobs.cells)),
							),
						),
					};
				// **The carve is walked block by block, and the reach is how
				// many.** Everything further from the surface than the reach is
				// settled without a reading -- rock below, air above -- so this
				// end moves with the block size rather than letting a reach of
				// kilometres be asked for at a four-metre block.
				const layer = LAYERS.find((l) => row.key.startsWith(l));
				if (!layer) return row;
				const what = row.key.slice(layer.length);
				if (what !== "Octaves" && what !== "FeatureScale") return row;
				// **The cliff layer is read at every block and the other three
				// once a map cell**, so what it must not be finer than is the
				// block. Held to the map cell it could not carry an overhang the
				// grid has room to draw.
				const derivedK = derived();
				const cell =
					layer === "cliff" ? derivedK.blockMetres : derivedK.cellMetres;
				if (what === "FeatureScale") {
					// Even one octave has to be two map cells wide, and the fine
					// slider reaches its own bottom, so the coarse one starts
					// where their product does.
					const least = (2 * cell) / knobs[layer + "Feature"];
					return {
						...row,
						low: Math.min(row.high, Math.max(row.low, Math.ceil(least))),
					};
				}
				// Each octave is narrower by the step, so the count stops where
				// the narrowest one is still two map cells across.
				const room =
					1 +
					Math.floor(
						Math.log(featureMetres(layer) / (2 * cell)) /
							Math.log(knobs[layer + "Lacunarity"]),
					);
				return { ...row, high: Math.max(row.low, Math.min(row.high, room)) };
			}

			/** Pull every knob inside its own narrowed ends, inward only. */
			function settle() {
				for (const g of KNOBS)
					for (const r of g.rows) {
						if (r.digits === undefined || r.type) continue;
						const live = liveRange(r);
						knobs[r.key] = Math.min(
							live.high,
							Math.max(live.low, knobs[r.key]),
						);
					}
			}

			/** A latitude and a longitude, as a unit direction. */
			function directionOf(latitude, longitude) {
				const lat = (latitude * Math.PI) / 180;
				const lon = (longitude * Math.PI) / 180;
				const ring = Math.cos(lat);
				return [ring * Math.cos(lon), Math.sin(lat), ring * Math.sin(lon)];
			}

			// ---------------------------------------------------------------
			// The world, and the patch cut out of it.
			// ---------------------------------------------------------------

			/**
			 * The level the three histograms are counted over.
			 *
			 * **A curve governs the planet, so what sits under it has to be
			 * counted over the planet** -- a patch is a place, and a place can be
			 * entirely on one side of a curve while the world is spread across
			 * all of it. Level 5 is 10,242 cells, which is the engine's own grid
			 * at a level coarse enough to run on every knob move.
			 */
			const TALLY_LEVEL = 5;
			const TALLY_BINS = 48;

			/** Every cell of the planet at one level, as directions, built once. */
			const WORLD = (() => {
				const n = 1 << TALLY_LEVEL;
				const out = [];
				for (let face = 0; face < 20; face++)
					for (let i = 0; i <= n; i++)
						for (let j = 0; i + j <= n; j++) {
							// A cell on a face edge or an icosahedron vertex has
							// several names and must be counted once, so it is
							// taken only by the face that owns it.
							if (canonicalCell(face, n, i, j).face !== face) continue;
							out.push(latticePosition(face, n, i, j));
						}
				return out;
			})();

			let field = null;

			/** Generate the patch, the world tally, and the numbers on the panel. */
			function generate(cells = knobs.cells) {
				const k = derived();
				const seed = seedFromString(knobs.seed);
				const s = settingsFor(k);
				const said = [0, 0, 0, 0];

				// **What the world lands on, under each curve.** Noise clusters
				// around its own middle, so equal widths of a curve cover wildly
				// unequal amounts of planet: a drag near the middle repaints a
				// fifth of the world and the same drag out at the end reaches a
				// couple of percent of it.
				const tally = {
					contSpline: new Float32Array(TALLY_BINS),
					eroSpline: new Float32Array(TALLY_BINS),
					pvSpline: new Float32Array(TALLY_BINS),
					cliffSpline: new Float32Array(TALLY_BINS),
				};
				const keys = ["contSpline", "eroSpline", "pvSpline", "cliffSpline"];
				const bin = (v) =>
					Math.max(
						0,
						Math.min(TALLY_BINS - 1, Math.floor(((v + 1) / 2) * TALLY_BINS)),
					);
				let land = 0;
				for (const p of WORLD) {
					fieldsAt(p[0], p[1], p[2], seed, s, said);
					for (let x = 0; x < 4; x++) tally[keys[x]][bin(said[x])]++;
					if (heightFrom(said, k) > k.seaLevel) land++;
				}
				let tallest = 0;
				for (const counts of Object.values(tally))
					for (const v of counts) if (v > tallest) tallest = v;

				// The patch: the engine's own cells, walked out from the one the
				// camera is standing over. `neighbour` is what walks, so a patch
				// that reaches a face edge crosses it the way the engine does and
				// a patch that reaches a pentagon gets a five-sided cell.
				//
				// **At the block's level, not the map's.** The map is the
				// terrain and says how high the ground is; what the ground is
				// *made of* is blocks, and a cliff, an overhang and a floating
				// island are all shapes in that grid rather than in the map's.
				// Drawn a hexagon per map reading there is nowhere for any of
				// them to stand -- which is what `Block detail` sets, and at 0
				// this is the map's own level again.
				const n = 2 ** k.blockLevel;
				const middle = directionOf(k.latitude, k.longitude);
				// Canonicalised, because the walk keys every cell it reaches and
				// a cell on a face edge has more than one name.
				const found = directionToCell(middle[0], middle[1], middle[2], n);
				const start = canonicalCell(found.face, n, found.i, found.j);
				const radius = Math.max(1, (cells << k.blockDetail) >> 1);
				const keyOf = (c) => (c.face * (n + 1) + c.i) * (n + 1) + c.j;
				const at = new Map();
				const list = [];
				const add = (c) => {
					const key = keyOf(c);
					if (at.has(key)) return false;
					at.set(key, list.length);
					list.push(c);
					return true;
				};
				add(start);
				let frontier = [start];
				for (let ring = 0; ring < radius; ring++) {
					const next = [];
					for (const c of frontier)
						for (let d = 0; d < 6; d++) {
							const nb = neighbour(c.face, n, c.i, c.j, d);
							if (!nb) continue;
							const cell = canonicalCell(nb.face, n, nb.i, nb.j);
							if (add(cell)) next.push(cell);
						}
					frontier = next;
				}

				const count = list.length;
				const arc = Math.min(cells * k.cellMetres, Math.PI * k.radius);
				const height = new Float64Array(count);
				const layer = new Float32Array(count * 4);
				// **A column is a list of heights where rock starts and stops,
				// not one height.** With the cliff layer off every column holds
				// exactly one pair and the mesh is the height field it always
				// was; with it on a column can hold three or five, and rock over
				// air over rock is a shape the old array could not hold at all.
				// Kept flat: `spanAt[c]` to `spanAt[c + 1]` indexes `span`.
				const spanAt = new Int32Array(count + 1);
				const runs2 = [];
				const runs = [];
				// **The polygon and the ring are asked for once, here, and read
				// from typed arrays afterwards.** Both are pure functions of the
				// address, so a mesh that recomputed them would be doing the same
				// arithmetic a second time to get the same answer -- and it is
				// the mesh that runs while a slider is moving.
				const degree = new Uint8Array(count);
				const corner = new Float64Array(count * 18);
				const ring = new Int32Array(count * 6).fill(-1);
				const centre = latticePosition(start.face, n, start.i, start.j);
				let lowest = Infinity;
				let highest = -Infinity;
				let stacked = 0;
				let deepest = 1;
				for (let c = 0; c < count; c++) {
					const cell = list[c];
					const p = latticePosition(cell.face, n, cell.i, cell.j);
					fieldsAt(p[0], p[1], p[2], seed, s, said);
					for (let x = 0; x < 4; x++) layer[c * 4 + x] = said[x];
					const base = heightFrom(said, k);
					spanAt[c] = runs2.length;
					let m = base;
					const reach = carveReach(erosionCut(said, k), k);
					if (k.useCliff && reach >= k.blockMetres) {
						carveColumn(p[0], p[1], p[2], base, reach, k, seed, s, runs);
						for (const y of runs) runs2.push(y);
						// **The height a colour and a coastline read is the top
						// of the topmost rock**, which under an overhang is not
						// the surface the three fields drew, and under a column
						// carved away entirely is nothing at all.
						m = runs.length > 0 ? runs[runs.length - 1] : base;
						if (runs.length > 2) stacked++;
						if (runs.length / 2 > deepest) deepest = runs.length / 2;
					} else {
						// **The same block grid with the layer off**, because the
						// grid is the world's and not the layer's: the ground is
						// the height field rounded to the nearest layer boundary,
						// which is the terracing the engine builds and the shape
						// a carve is cut out of.
						m = Math.round(base / k.blockMetres) * k.blockMetres;
						runs2.push(m - k.blockMetres, m);
					}
					height[c] = m;
					if (m < lowest) lowest = m;
					if (m > highest) highest = m;

					const corners = cellCorners(cell.face, n, cell.i, cell.j);
					degree[c] = corners.length;
					for (let m2 = 0; m2 < corners.length; m2++) {
						corner[c * 18 + m2 * 3] = corners[m2][0];
						corner[c * 18 + m2 * 3 + 1] = corners[m2][1];
						corner[c * 18 + m2 * 3 + 2] = corners[m2][2];
					}
					for (let d = 0; d < 6; d++) {
						const nb = neighbour(cell.face, n, cell.i, cell.j, d);
						if (!nb) continue;
						const found = at.get(
							keyOf(canonicalCell(nb.face, n, nb.i, nb.j)),
						);
						// A cell on the rim of the patch has neighbours nobody
						// generated. `-1` says so, and the mesh draws no wall
						// there rather than a cliff the world does not have.
						if (found !== undefined) ring[c * 6 + d] = found;
					}
				}
				spanAt[count] = runs2.length;

				// **A floating island is a question a column cannot answer.**
				// How many spans a column holds says there is air under some
				// rock; whether that rock is *attached to anything* is a fact
				// about the patch, so it takes a walk over the whole of it.
				// Every column's lowest span reaches the bedrock under the
				// carve -- below one reach nothing is ever dug -- so those are
				// the ground, and any run of rock that never joins one is
				// hanging in the air.
				const spans = Float64Array.from(runs2);
				const pieces = spans.length / 2;
				const owner = new Int32Array(pieces);
				for (let i = 0; i < pieces; i++) owner[i] = i;
				const rootOf = (i) => {
					let r = i;
					while (owner[r] !== r) r = owner[r];
					// Flatten on the way back, or a patch this size walks the
					// same chain thousands of times.
					while (owner[i] !== r) {
						const up = owner[i];
						owner[i] = r;
						i = up;
					}
					return r;
				};
				const join = (a, b) => {
					const ra = rootOf(a);
					const rb = rootOf(b);
					if (ra !== rb) owner[ra < rb ? rb : ra] = ra < rb ? ra : rb;
				};
				// Two spans in neighbouring columns are one piece of rock when
				// they share a block layer. Half a block of overlap is the test,
				// because the spans are already on the grid and a touch of
				// exactly zero is two floors meeting rather than rock joining.
				const touch = k.blockMetres * 0.5;
				for (let c = 0; c < count; c++)
					for (let d = 0; d < 6; d++) {
						const found = ring[c * 6 + d];
						if (found <= c) continue;
						for (let a = spanAt[c]; a < spanAt[c + 1]; a += 2)
							for (let b = spanAt[found]; b < spanAt[found + 1]; b += 2)
								if (
									Math.min(spans[a + 1], spans[b + 1]) -
										Math.max(spans[a], spans[b]) >
									touch
								)
									join(a / 2, b / 2);
					}
				const grounded = new Uint8Array(pieces);
				for (let c = 0; c < count; c++) grounded[rootOf(spanAt[c] / 2)] = 1;
				let floating = 0;
				let floatingSpans = 0;
				for (let i = 0; i < pieces; i++) {
					if (grounded[rootOf(i)]) continue;
					floatingSpans++;
					if (rootOf(i) === i) floating++;
				}

				field = {
					k,
					s,
					seed,
					n,
					list,
					at,
					keyOf,
					count,
					height,
					layer,
					// **Not `span`.** That name is already the patch's own width
					// in metres, a few lines down, and a duplicate key in an
					// object literal is not an error -- the later one simply
					// wins. The column heights became a number, every `top` came
					// back `undefined`, and the ground drew as garbage.
					spanAt,
					spans,
					// Masses of rock touching nothing that reaches the bedrock,
					// and how many column-spans they are made of.
					floating,
					floatingSpans,
					// How much of the patch the density actually lifted off the
					// height field: a column with one pair is a surface, and a
					// column with two or more is an overhang.
					stacked,
					deepest,
					degree,
					corner,
					ring,
					centre,
					cellMetres: k.cellMetres,
					blockMetres: k.blockMetres,
					// **What was asked for, what is covered, and how wide that
					// is in a straight line -- three different numbers once the
					// patch is a fair share of the planet.** A patch is an arc,
					// so it stops growing at the antipode however many cells are
					// asked for, and what a camera has to frame is the chord
					// under that arc rather than the arc itself. At the antipode
					// the chord is the planet's diameter and the walk has
					// enumerated every cell there is.
					span: cells * k.cellMetres,
					arc,
					across: 2 * k.radius * Math.sin(arc / (2 * k.radius)),
					whole: count === 10 * 4 ** k.blockLevel + 2,
					tally,
					tallest,
					landShare: land / WORLD.length,
					lowest,
					highest,
					draft: cells !== knobs.cells,
				};
			}

			// ---------------------------------------------------------------
			// The four pictures.
			// ---------------------------------------------------------------

			function cross3(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],
				];
			}

			/**
			 * An east-and-north frame around a direction.
			 *
			 * Up is `normalize(position)` and there is no global north -- the
			 * hairy ball theorem forbids one -- so the sideways axes are picked
			 * against the coordinate pole and swapped for another when the
			 * direction is the pole itself.
			 */
			function frameOf(up) {
				const pole = Math.abs(up[1]) > 0.98 ? [1, 0, 0] : [0, 1, 0];
				const east = normalize3(cross3(pole, up));
				return { up, east, north: cross3(up, east) };
			}

			/**
			 * The four pictures: one per field, and the ground they make.
			 *
			 * `layer` is which of the three readings a picture draws, or `-1` for
			 * the ground. The three field pictures live in their own layer's
			 * section of the panel and the ground stays in the head, so the thing
			 * being judged never scrolls away from the knob being turned.
			 */
			const SHOTS = [
				{ id: "shotOut", key: "out", layer: -1, name: "Terrain" },
				{ id: "shotCont", key: "cont", layer: 0, name: "Continentalness" },
				{ id: "shotEro", key: "ero", layer: 1, name: "Erosion" },
				{ id: "shotPv", key: "pv", layer: 2, name: "Peaks & valleys" },
				{ id: "shotCliff", key: "cliff", layer: 3, name: "Density at the surface" },
			];
			const SHOT_OF = new Map(SHOTS.map((shot) => [shot.key, shot]));
			SHOTS[0].canvas = document.getElementById("shotOut");
			SHOTS[0].ctx = SHOTS[0].canvas.getContext("2d");

			/** How many grey steps a layer picture is cut into. */
			const PICTURE_BANDS = 9;

			/**
			 * One reading of a layer, as a banded grey.
			 *
			 * **Bands, not a gradient.** A smooth grey wash of a noise field
			 * shows its brightness and hides its shape; cutting it into steps
			 * draws the contour lines, and the contours are what say whether a
			 * field is broad and rolling or narrow and folded. It is a picture of
			 * a field, so the bands mean nothing on the ground -- only the fourth
			 * picture does.
			 */
			function bandGrey(v) {
				const t = Math.max(0, Math.min(0.9999, (v + 1) / 2));
				const step = Math.floor(t * PICTURE_BANDS);
				const g = 0.06 + (step / (PICTURE_BANDS - 1)) * 0.92;
				// A dark line at the edge of each band, which is the contour.
				const into = t * PICTURE_BANDS - step;
				const edge = into < 0.06 ? 0.45 : 1;
				return [g * edge, g * edge, g * edge];
			}

			/**
			 * One height, as the colour the ground would be.
			 *
			 * Sea is one colour deepening with how much water a look passes
			 * through, because the ocean is a surface and holds no blocks; land
			 * is banded every hundred metres so a slope reads as a slope.
			 */
			function groundColor(metres, k) {
				const over = metres - k.seaLevel;
				// Bare sand seen through water, because the ocean is a surface
				// and holds no blocks: what makes a deep blue is how much water
				// a look passes through to reach the floor.
				if (over <= 0) {
					const through = 1 - Math.exp(over / SEA_CLARITY);
					return BAND_COLORS[0].map(
						(c, n) => c + (SEA_COLOR[n] - c) * through,
					);
				}
				const band =
					over < GROUND_LINES.rock ? 1 : over < GROUND_LINES.snow ? 2 : 3;
				// A contour every hundred metres, so a slope reads as a slope
				// rather than as one flat sheet of the block that stands on it.
				const into = ((over / 100) % 1) * 100;
				const edge = into < 6 ? 0.78 : 1;
				return BAND_COLORS[band].map((c) => c * edge);
			}

			/**
			 * The direction a pixel of a picture is looking at.
			 *
			 * Over the planet it is longitude across and latitude down, the one
			 * projection where a direction is two cosines and no case analysis.
			 * Over the patch it is the exponential map out of the patch's own
			 * frame, so metres out from the middle become radians of arc and the
			 * picture keeps its scale to the corners.
			 */
			function pictureDirection(q, r, wide, tall, frame, half, radius) {
				if (!frame) {
					const lat = (0.5 - (r + 0.5) / tall) * Math.PI;
					const lon = ((q + 0.5) / wide) * 2 * Math.PI - Math.PI;
					const ring = Math.cos(lat);
					return [ring * Math.cos(lon), Math.sin(lat), ring * Math.sin(lon)];
				}
				const u = (((q + 0.5) / wide) * 2 - 1) * (half / radius);
				const v = (1 - ((r + 0.5) / tall) * 2) * (half / radius);
				const a = Math.hypot(u, v);
				if (a < 1e-12) return frame.up;
				const c = Math.cos(a);
				const sn = Math.sin(a) / a;
				return normalize3([
					frame.up[0] * c + (frame.east[0] * u + frame.north[0] * v) * sn,
					frame.up[1] * c + (frame.east[1] * u + frame.north[1] * v) * sn,
					frame.up[2] * c + (frame.east[2] * u + frame.north[2] * v) * sn,
				]);
			}

			/**
			 * Paint some or all of the pictures into their own canvases.
			 *
			 * **One sampling pass, however many are wanted.** The three fields
			 * come out of one call at each point and the ground is made of the
			 * same three, so drawing four pictures costs what drawing one costs
			 * plus the writing. `only` narrows it to a single picture at a size
			 * of its own, which is what the enlarged view asks for.
			 */
			function paintShots(shots, wide, tall, only = null) {
				const planet = knobs.show === "planet";
				const frame = planet ? null : frameOf(field.centre);
				const half = field.arc / 2;
				const k = field.k;
				const said = [0, 0, 0, 0];
				const runs = [];
				const images = shots.map((shot) => {
					const target = only ?? shot.canvas;
					if (target.width !== wide || target.height !== tall) {
						target.width = wide;
						target.height = tall;
					}
					return (only ? bigCtx : shot.ctx).createImageData(wide, tall);
				});
				const wantsAll = shots.some((shot) => shot.layer < 0);
				for (let r = 0; r < tall; r++)
					for (let q = 0; q < wide; q++) {
						const p = pictureDirection(q, r, wide, tall, frame, half, k.radius);
						// A single field picture reads one stack rather than
						// three, which is three times less work for the
						// enlarged view of a layer.
						if (wantsAll || shots.length > 1)
							fieldsAt(p[0], p[1], p[2], field.seed, field.s, said);
						else
							said[shots[0].layer] = octaveNoise(
								p[0],
								p[1],
								p[2],
								field.seed + SEED_OFFSET[shots[0].key],
								field.s[shots[0].key],
							);
						const at = (r * wide + q) * 4;
						for (let n = 0; n < shots.length; n++) {
							const shot = shots[n];
							const c =
								shot.layer < 0
									? groundColor(
											surfaceAt(p[0], p[1], p[2], said, k, field.seed, field.s, runs),
											k,
										)
									: bandGrey(said[shot.layer]);
							const px = images[n].data;
							px[at] = c[0] * 255;
							px[at + 1] = c[1] * 255;
							px[at + 2] = c[2] * 255;
							px[at + 3] = 255;
						}
					}
				for (let n = 0; n < shots.length; n++) {
					const g = only ? bigCtx : shots[n].ctx;
					g.putImageData(images[n], 0, 0);
					if (planet) outlinePatch(g, wide, tall);
				}
			}

			/** Where the plane is standing, drawn on a picture of the planet. */
			function outlinePatch(g, wide, tall) {
				const k = field.k;
				const lat = (knobs.latitude * Math.PI) / 180;
				const across = field.arc / k.radius / Math.max(0.15, Math.cos(lat));
				const down = field.arc / k.radius;
				const box = {
					x:
						((knobs.longitude + 180) / 360) * wide -
						(across / (4 * Math.PI)) * wide,
					y: (0.5 - knobs.latitude / 180) * tall - (down / (2 * Math.PI)) * tall,
					w: Math.max(3, (across / (2 * Math.PI)) * wide),
					h: Math.max(3, (down / Math.PI) * tall),
				};
				g.strokeStyle = "rgba(255, 90, 90, 0.95)";
				g.lineWidth = 1;
				g.strokeRect(box.x - 0.5, box.y - 0.5, box.w + 1, box.h + 1);
			}

			function drawPictures() {
				if (!field) return;
				const ready = SHOTS.filter((shot) => shot.ctx);
				if (ready.length === 0) return;
				// Half the samples while a knob is moving, for the same reason
				// the plane draws fewer cells: a picture that arrives after the
				// finger has stopped is not a picture of the knob.
				const wide = field.draft ? 156 : 312;
				paintShots(ready, wide, knobs.show === "planet" ? wide / 2 : wide);
				// The large one is a thousand pixels across and follows the
				// knobs, but only once they have settled -- redrawing it every
				// frame of a drag would cost more than everything else here put
				// together.
				if (!field.draft && !big.hidden && bigShown) drawBig(bigShown);
			}

			// ---------------------------------------------------------------
			// The enlarged picture.
			// ---------------------------------------------------------------

			const big = document.getElementById("big");
			const bigCanvas = document.getElementById("bigShot");
			const bigCtx = bigCanvas.getContext("2d");
			const bigName = document.getElementById("bigName");
			let bigShown = null;

			/**
			 * One picture, large.
			 *
			 * **A field at panel width says where its features are; at this size
			 * it says what they look like.** The narrow octaves of a folded field
			 * are a grain at 312 pixels and ridges at 1,024, and which of those a
			 * curve is being dragged against is the whole question.
			 */
			function drawBig(shot) {
				if (!field) return;
				bigShown = shot;
				const planet = knobs.show === "planet";
				const wide = planet ? 1024 : 720;
				bigName.textContent = `${shot.name} · ${
					planet
						? "the whole planet"
						: `${Math.round(field.span).toLocaleString()} m of ground`
				}`;
				big.hidden = false;
				paintShots([shot], wide, planet ? wide / 2 : wide, bigCanvas);
			}

			function closeBig() {
				big.hidden = true;
				bigShown = null;
			}
			big.addEventListener("click", closeBig);
			window.addEventListener("keydown", (e) => {
				if (e.key === "Escape") closeBig();
			});

			/**
			 * **A latitude and a longitude are a place, and two sliders are not a
			 * way to look for one.** Clicking a picture of the planet puts the
			 * patch where the finger went: the projection is longitude across and
			 * latitude down, so it inverts to two divisions. Over the patch there
			 * is nowhere to jump to, so a click enlarges instead.
			 */
			function watchShot(shot) {
				shot.canvas.addEventListener("click", (e) => {
					if (knobs.show !== "planet") return drawBig(shot);
					const box = shot.canvas.getBoundingClientRect();
					const across = (e.clientX - box.left) / box.width;
					const down = (e.clientY - box.top) / box.height;
					const row = ROWS.get("latitude");
					knobs.longitude = Math.round(across * 360 - 180);
					knobs.latitude = Math.max(
						row.low,
						Math.min(row.high, Math.round((0.5 - down) * 180)),
					);
					askForRedraw(false);
				});
				// Over the planet a click already means "go there", so the large
				// view is on a second button rather than fighting it.
				shot.canvas.addEventListener("contextmenu", (e) => {
					e.preventDefault();
					drawBig(shot);
				});
				shot.canvas.title =
					"click to enlarge, or to move the patch when the pictures show the planet " +
					"(right-click always enlarges)";
			}
			watchShot(SHOTS[0]);

			// ---------------------------------------------------------------
			// The contour: every line of the patch, over one another.
			// ---------------------------------------------------------------

			const graphCanvas = document.getElementById("graph");
			const graphCtx = graphCanvas.getContext("2d");
			const graphSays = document.getElementById("graphsays");

			/** How many sections are drawn, and how many points each carries. */
			const GRAPH_LINES = 80;
			const GRAPH_ALONG = 120;

			/**
			 * The patch in section, every line of it at once.
			 *
			 * **One section says what one line of ground does; all of them
			 * together draw the silhouette** -- how high the patch stands, where
			 * its ridges are, and how much of it sits at any height, because
			 * where the lines bunch is where most of the ground is. Read against
			 * the two elevations that decide what the ground is made of, it is
			 * the one picture that says whether a world reaches the snow line at
			 * all.
			 *
			 * **The lines are the height function, not the mesh.** A patch here
			 * is a disc of hexagons rather than a grid, and there is no row to
			 * walk; sampled through the patch's own frame instead, these are
			 * parallel cuts across exactly the ground the plane is drawing.
			 */
			function drawGraph() {
				if (!field) return;
				// Drawn in a fixed logical box and scaled up to whatever the
				// canvas is, so the text keeps its size on screen rather than
				// shrinking with the panel.
				const scale = graphCanvas.width / 320;
				const width = 320;
				const height = graphCanvas.height / scale;
				const g = graphCtx;
				g.setTransform(1, 0, 0, 1, 0, 0);
				g.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
				g.setTransform(scale, 0, 0, scale, 0, 0);
				const pad = { left: 40, right: 8, top: 10, bottom: 24 };
				const plotW = width - pad.left - pad.right;
				const plotH = height - pad.top - pad.bottom;
				g.fillStyle = "#0b0e13";
				g.fillRect(0, 0, width, height);

				const k = field.k;
				const frame = frameOf(field.centre);
				const half = field.arc / 2;
				const said = [0, 0, 0, 0];
				const lines = [];
				let lowest = Infinity;
				let highest = -Infinity;
				for (let r = 0; r < GRAPH_LINES; r++) {
					const line = new Float64Array(GRAPH_ALONG);
					for (let q = 0; q < GRAPH_ALONG; q++) {
						const p = pictureDirection(
							q,
							r,
							GRAPH_ALONG,
							GRAPH_LINES,
							frame,
							half,
							k.radius,
						);
						fieldsAt(p[0], p[1], p[2], field.seed, field.s, said);
						const h = heightFrom(said, k);
						line[q] = h;
						if (h < lowest) lowest = h;
						if (h > highest) highest = h;
					}
					lines.push(line);
				}

				let yLow = Math.min(lowest, k.seaLevel);
				let yHigh = Math.max(highest, k.seaLevel + 1);
				const room = (yHigh - yLow) * 0.06 || 1;
				yLow -= room;
				yHigh += room;
				const toX = (at) => pad.left + (at / (GRAPH_ALONG - 1)) * plotW;
				const toY = (v) =>
					pad.top + plotH - ((v - yLow) / (yHigh - yLow)) * plotH;

				// Sea level and the two material lines, so a section can be read
				// against the elevations that decide what the ground is made of.
				const marks = [
					[k.seaLevel, "#3b6ea8", "sea"],
					[k.seaLevel + GROUND_LINES.rock, "#5a5a62", "rock"],
					[k.seaLevel + GROUND_LINES.snow, "#8a8f98", "snow"],
				];
				g.font = "9.5px system-ui, sans-serif";
				for (const [metres, color, name] of marks) {
					if (metres < yLow || metres > yHigh) continue;
					const y = toY(metres);
					g.strokeStyle = color;
					g.setLineDash(metres === k.seaLevel ? [] : [3, 3]);
					g.beginPath();
					g.moveTo(pad.left, y);
					g.lineTo(width - pad.right, y);
					g.stroke();
					g.setLineDash([]);
					g.fillStyle = color;
					g.fillText(name, 4, y + 3);
				}

				g.strokeStyle = "#2b3542";
				g.beginPath();
				g.moveTo(pad.left, pad.top);
				g.lineTo(pad.left, pad.top + plotH);
				g.lineTo(width - pad.right, pad.top + plotH);
				g.stroke();
				g.fillStyle = "#8b95a4";
				g.fillText(`${Math.round(yHigh)} m`, 4, pad.top + 8);
				g.fillText(`${Math.round(yLow)} m`, 4, pad.top + plotH - 1);
				g.textAlign = "center";
				g.fillText(
					`${Math.round(field.arc).toLocaleString()} m across the patch, every line of it`,
					pad.left + plotW / 2,
					height - 6,
				);
				g.textAlign = "left";

				// Faint, and many: where the lines bunch is where most of the
				// ground stands, so the silhouette carries the distribution as
				// well as the shape.
				g.lineWidth = 0.4;
				g.strokeStyle = "rgba(111, 208, 255, 0.15)";
				for (const line of lines) {
					g.beginPath();
					for (let at = 0; at < GRAPH_ALONG; at++) {
						const x = toX(at);
						const y = toY(line[at]);
						if (at === 0) g.moveTo(x, y);
						else g.lineTo(x, y);
					}
					g.stroke();
				}
				// The middle line solid, so there is one section to read against
				// the elevations rather than only a mass.
				g.lineWidth = 1.1;
				g.strokeStyle = "#6fd0ff";
				g.beginPath();
				const mid = lines[GRAPH_LINES >> 1];
				for (let at = 0; at < GRAPH_ALONG; at++) {
					const x = toX(at);
					const y = toY(mid[at]);
					if (at === 0) g.moveTo(x, y);
					else g.lineTo(x, y);
				}
				g.stroke();
				g.lineWidth = 1;

				const off = LAYERS.filter(
					(l) => !knobs["use" + l[0].toUpperCase() + l.slice(1)],
				);
				graphSays.textContent =
					`${GRAPH_LINES} lines · ground ${Math.round(lowest)} to ` +
					`${Math.round(highest)} m` +
					(off.length ? ` · ${off.length} layer off` : "");
			}

			// ---------------------------------------------------------------
			// The plane: the patch as hexagon columns.
			// ---------------------------------------------------------------

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in float metres;
			layout(location = 2) in vec3 normal;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out float vMetres;
			void main() {
				vNormal = normal;
				vMetres = metres;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in float vMetres;
			uniform vec3 sun;
			uniform float seaLevel;
			uniform float rockLine;
			uniform float snowLine;
			uniform int water;
			out vec4 color;
			void main() {
				// **The normal is stored, and it is stored as three bytes.**
				// Taking it from the change of position across a pixel is what
				// the engine's terrain shader does and it is wrong here: a
				// derivative is a difference over a two-by-two block of pixels,
				// and a map cell at this scale is a few pixels across, so most
				// pixels straddle the line where a cap meets a wall and average
				// the two into a normal belonging to neither. The whole patch
				// then shades as one tone. A face normal quantised to one part in
				// 127 is
				// far finer than any shading can show, so the attribute costs a
				// quarter of what a float one would.
				//
				// Nothing here is culled, because a hexagon column's walls are
				// emitted without a winding rule and a wall seen from inside a
				// valley is a wall seen from its back.
				vec3 n = normalize(vNormal);
				if (!gl_FrontFacing) n = -n;
				// **Three terms, because the badly lit part of a patch and the
				// badly lit part of a globe are not the same surfaces.**
				//
				// A patch's dark faces are the walls turned away from the light
				// -- cliff faces, block sides, the cut rim -- and their normals
				// point the opposite way, so a second light opposite the first
				// is exactly what reaches them. Rendered on its own that fill
				// lights the anti-sun walls and nothing else: every cap in the
				// picture comes out black.
				//
				// **A globe's dark part is the terminator, and a light opposite
				// the key cannot reach it**, because those normals are square to

				if (waterCount === 0) return;
				// **The sea writes depth.** It is one surface at one radius, so
				// on a sphere the near water stands in front of the far water
				// and the far water has to be thrown away rather than blended
				// through -- two blends of a translucent sheet on one pixel is a
				// dark band along the horizon, which is where a shoreline is
				// most looked at.
				gl.uniform1i(uWater, 1);
				gl.drawArrays(gl.TRIANGLES, waterFrom, waterCount);
			}

			// ---------------------------------------------------------------
			// The panel, and the loop that keeps it live.
			// ---------------------------------------------------------------

			const facts = document.getElementById("facts");
			const recipe = document.getElementById("recipe");
			const rows = new Map();

			/** The tint each curve is drawn in, so a curve and its group match. */
			const CURVE_TINT = {
				contSpline: "#ffd166",
				eroSpline: "#8ce99a",
				pvSpline: "#ff9db1",
				cliffSpline: "#c9a7ff",
			};

			/**
			 * One editable curve, over the histogram of what the world lands on.
			 *
			 * X is that layer's own noise value, y is what it controls. The
			 * four points it opens with are a starting shape and not the shape:
			 * click the empty curve to add a point, shift-click one to take it
			 * away, and only the two ends are pinned, in x alone, so the curve
			 * always covers the whole range.
			 */
			function makeCurve(canvas, key, onChange) {
				const g = canvas.getContext("2d");
				const pad = 6;
				const toX = (v) => pad + ((v + 1) / 2) * (canvas.width - pad * 2);
				const toY = (v) => canvas.height - pad - v * (canvas.height - pad * 2);
				const fromX = (px) => ((px - pad) / (canvas.width - pad * 2)) * 2 - 1;
				const fromY = (py) =>
					(canvas.height - pad - py) / (canvas.height - pad * 2);

				function draw() {
					const points = knobs[key];
					g.fillStyle = "#0b0e13";
					g.fillRect(0, 0, canvas.width, canvas.height);
					// The world's own distribution, behind everything: how much
					// planet sits under each slice of this curve. Dim, because it
					// is context for the curve rather than the thing being edited.
					const counts = field && field.tally ? field.tally[key] : null;
					if (counts && field.tallest > 0) {
						g.fillStyle = "rgba(255, 255, 255, 0.13)";
						const wide = (canvas.width - pad * 2) / TALLY_BINS;
						for (let n = 0; n < TALLY_BINS; n++) {
							const tall =
								(counts[n] / field.tallest) * (canvas.height - pad * 2);
							if (tall <= 0) continue;
							g.fillRect(
								pad + n * wide,
								canvas.height - pad - tall,
								Math.max(1, wide - 0.5),
								tall,
							);
						}
					}
					g.strokeStyle = "#232b36";
					g.beginPath();
					g.moveTo(toX(0), pad);
					g.lineTo(toX(0), canvas.height - pad);
					g.stroke();
					// **The line every curve is read against, drawn on the curve
					// itself and named there.** On continentalness it is sea
					// level: the curve gives a height, and where it crosses this
					// line is the coast. On peaks and valleys it is the level the
					// continent already set, so above the line is a peak and
					// below it a valley. Saying either as a number somewhere else
					// would make the reader hold two pictures at once.
					const mark = markOn(key);
					if (mark) {
						const y = toY(mark.at);
						g.strokeStyle = "rgba(111, 208, 255, 0.5)";
						g.setLineDash([3, 3]);
						g.beginPath();
						g.moveTo(pad, y);
						g.lineTo(canvas.width - pad, y);
						g.stroke();
						g.setLineDash([]);
						// **An unlabelled line is a line nobody can read.** The
						// contour graph names its own; so does this one.
						g.fillStyle = "rgba(111, 208, 255, 0.8)";
						g.font = "9px system-ui, sans-serif";
						g.fillText(mark.name, pad + 2, y - 3);
					}
					g.strokeStyle = CURVE_TINT[key] ?? "#6fd0ff";
					g.lineWidth = 1.5;
					g.beginPath();
					for (let px = pad; px <= canvas.width - pad; px++) {
						const y = toY(splineAt(points, fromX(px)));
						if (px === pad) g.moveTo(px, y);
						else g.lineTo(px, y);
					}
					g.stroke();
					g.fillStyle = "#e8ecf2";
					for (const [x, y] of points) {
						g.beginPath();
						g.arc(toX(x), toY(y), 3, 0, Math.PI * 2);
						g.fill();
					}
				}

				let dragging = -1;
				const spot = (e) => {
					const box = canvas.getBoundingClientRect();
					return [
						((e.clientX - box.left) / box.width) * canvas.width,
						((e.clientY - box.top) / box.height) * canvas.height,
					];
				};
				const nearest = (px, py) => {
					const points = knobs[key];
					let best = -1;
					let far = 12;
					for (let n = 0; n < points.length; n++) {
						const d = Math.hypot(
							toX(points[n][0]) - px,
							toY(points[n][1]) - py,
						);
						if (d < far) {
							far = d;
							best = n;
						}
					}
					return best;
				};
				canvas.addEventListener("pointerdown", (e) => {
					e.preventDefault();
					const [px, py] = spot(e);
					const at = nearest(px, py);
					const points = knobs[key];
					if (at >= 0 && e.shiftKey) {
						// Never below two, or the curve stops being a curve.
						if (points.length > 2 && at > 0 && at < points.length - 1) {
							points.splice(at, 1);
							draw();
							onChange();
						}
						return;
					}
					if (at >= 0) {
						dragging = at;
					} else {
						const x = Math.max(-1, Math.min(1, fromX(px)));
						const y = Math.max(0, Math.min(1, fromY(py)));
						points.push([x, y]);
						points.sort((a, b) => a[0] - b[0]);
						dragging = points.findIndex((p) => p[0] === x && p[1] === y);
						draw();
						onChange();
					}
					canvas.setPointerCapture(e.pointerId);
				});
				canvas.addEventListener("pointermove", (e) => {
					if (dragging < 0) return;
					const points = knobs[key];
					const [px, py] = spot(e);
					const first = dragging === 0;
					const last = dragging === points.length - 1;
					// The ends hold their x, so the curve always covers the whole
					// range and nothing has to guess what happens past it.
					if (!first && !last)
						points[dragging][0] = Math.max(
							points[dragging - 1][0] + 0.01,
							Math.min(points[dragging + 1][0] - 0.01, fromX(px)),
						);
					points[dragging][1] = Math.max(0, Math.min(1, fromY(py)));
					draw();
					onChange();
				});
				const drop = () => {
					dragging = -1;
				};
				canvas.addEventListener("pointerup", drop);
				canvas.addEventListener("pointercancel", drop);
				return draw;
			}

			/** Where the dashed line sits on a curve, in the curve's own units. */
			function markOn(key) {
				if (key === "pvSpline") return { at: 0.5, name: "level" };
				// Half way up leaves the column where the three fields put it:
				// the density is zero there, so it neither carves in nor builds
				// out.
				// **No line on the density curve.** The other three curves are
				// read against something -- sea level, the continent's own level
				// -- and this one is a depth measured from the top of its own
				// axis, so a line across it would have to be drawn at the top
				// edge and would say only what the axis label already does.
				if (key === "cliffSpline") return null;
				if (key !== "contSpline") return null;
				// The middle of the curve is the waterline, and draining moves
				// the water down the sea half -- so the line stays what the curve
				// is read against: cross it and you are on land.
				if (knobs.seaDepth <= 0) return { at: 0.5, name: "sea" };
				const at = 0.5 * (1 + knobs.seaLevel / knobs.seaDepth);
				return { at: Math.max(0, Math.min(0.5, at)), name: "sea" };
			}

			/**
			 * What a curve's two axes are, written under it as two statements.
			 *
			 * **A label says what an axis is, and never what a knob already
			 * says.** Reprinting Relief, Sea depth and Peaks as the ends of
			 * the axis puts the same three numbers on screen twice, a few
			 * centimetres apart, and they are the numbers a reader came from
			 * rather than the ones they came for.
			 *
			 * **And it points at the line rather than naming where it sits.**
			 * Sea level is the middle of the continentalness axis only while
			 * the sea is undrained -- move Sea level or Sea depth and the
			 * dashed line moves down the sea half, so a label saying "in the
			 * middle" is true at the shipped knobs and a lie one drag later.
			 * The graph already draws the line and names it; the axis says
			 * which line to look at and lets it stand where it stands.
			 *
			 * **X is the field and y is the consequence, and only y may claim
			 * one.** Naming the ends of x "untouched" and "most eroded" reads
			 * as a fact about the ground, and it is not: the field is a raw
			 * reading and the curve is the only thing that says what a reading
			 * costs. Drag the curve flat and nothing is eroded anywhere, while
			 * an end labelled that way still says otherwise. So x names the
			 * field and its range, and nothing else.
			 */
			function axisOf(key) {
				const layer = key.slice(0, -6);
				const field = {
					cont: "continentalness",
					ero: "erosion",
					pv: "peaks & valleys",
					cliff: "density",
				}[layer];
				if (key === "contSpline")
					return {
						x: `x · the ${field} field, -1 to +1`,
						y: "y · the height · the blue line is sea level",
					};
				if (key === "eroSpline")
					return {
						x: `x · the ${field} field, -1 to +1`,
						y: "y · how much of the relief it cuts away, none to all of it",
					};
				if (key === "cliffSpline")
					return {
						x: "x · the density read at this point, -1 to +1",
						y: "y · how deep this reading digs · at the top it digs nothing and the ground is exactly what the other three drew, at the bottom it digs the whole depth Squash allows out from under it",
					};
				return {
					x: `x · the ${field} field, -1 to +1`,
					y: "y · the relief · the blue line is the continent's own level",
				};
			}

			function buildPanel() {
				const host = document.getElementById("knobs");
				for (const group of KNOBS) {
					// **A section folds, because three whole noise layers do not
					// fit on one screen.** Each carries its own frequency, octave
					// count, falloff, step and fold, so the panel is long by
					// construction rather than by neglect.
					const set = document.createElement("details");
					set.className = "group" + (group.tint ? " " + group.tint : "");
					set.open = group.open !== false;
					const legend = document.createElement("summary");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						if (row.summary) {
							// A checkbox inside a summary would open and shut the
							// section as well as answer its own question, so the
							// click is stopped before it reaches the details.
							const box = document.createElement("input");
							box.type = "checkbox";
							box.className = "switch";
							box.checked = knobs[row.key];
							box.title = `turn this layer off`;
							box.addEventListener("click", (e) => e.stopPropagation());
							box.addEventListener("input", () => {
								knobs[row.key] = box.checked;
								askForRedraw(false);
							});
							legend.prepend(box);
							rows.set(row.key, { row, wrap: set, input: box });
							continue;
						}
						const wrap = document.createElement("div");
						const label = document.createElement("label");
						label.textContent = row.label;
						let input;
						if (row.type === "picture") {
							// The layer's own field, in the layer's own section.
							const shot = SHOT_OF.get(row.key.replace("Picture", ""));
							wrap.className = "knob pictured";
							const holder = document.createElement("div");
							holder.className = "shot " + shot.key;
							shot.canvas = document.createElement("canvas");
							shot.ctx = shot.canvas.getContext("2d");
							const name = document.createElement("b");
							name.textContent = shot.name;
							holder.append(shot.canvas, name);
							wrap.append(holder);
							set.append(wrap);
							watchShot(shot);
							continue;
						}
						if (row.type === "spline") {
							wrap.className = "knob curved";
							input = document.createElement("canvas");
							input.width = 300;
							input.height = 96;
							input.className = "curve";
							const axis = document.createElement("div");
							axis.className = "axis";
							const help = document.createElement("p");
							help.className = "curve-help";
							// **The bars are what makes x mean anything.** A
							// field's range is -1 to +1 and it reaches nowhere near
							// either end, so where the bars pile up is the part of
							// the curve that governs most of the planet -- and a
							// stretch of curve with no bars under it is a shape
							// nobody will ever stand on.
							help.textContent =
								"the bars are how much of the planet reads each value · " +
								"drag a point · click the curve to add one · " +
								"shift-click a point to remove it";
							wrap.append(label, input, axis, help);
							set.append(wrap);
							const redraw = makeCurve(input, row.key, () => askForRedraw());
							rows.set(row.key, { row, wrap, redraw, axis });
							continue;
						}
						wrap.className = "knob";
						if (row.type === "select") {
							input = document.createElement("select");
							for (const option of row.options) {
								const o = document.createElement("option");
								o.value = option;
								o.textContent = option;
								input.append(o);
							}
							input.value = knobs[row.key];
						} else if (row.type === "text") {
							input = document.createElement("input");
							input.type = "text";
							input.value = knobs[row.key];
						} else {
							input = document.createElement("input");
							input.type = "range";
							input.min = row.low;
							input.max = row.high;
							input.step = row.step;
							input.value = knobs[row.key];
						}
						const readout = document.createElement("output");
						wrap.append(label, readout, input);
						let note = null;
						if (row.note) {
							note = document.createElement("p");
							note.className = "knob-note";
							wrap.append(note);
						}
						set.append(wrap);
						rows.set(row.key, { row, wrap, input, readout, note });
						// **Every move redraws.** `input` rather than `change`, so
						// the ground answers while the slider is still moving --
						// which is the only way to feel what a knob does.
						input.addEventListener("input", () => {
							knobs[row.key] =
								row.type === "select" || row.type === "text"
									? input.value
									: Number(input.value);
							askForRedraw();
						});
					}
					host.append(set);
				}
			}

			function refreshPanel() {
				for (const { row, wrap, readout, input, note, redraw, axis } of rows.values()) {
					if (row.summary) {
						input.checked = knobs[row.key];
						// **A layer that is off still draws its own picture and
						// its own histogram**, because what it would put back is
						// the thing being decided. The section dims to say the
						// world is not reading it.
						wrap.classList.toggle("off", !knobs[row.key]);
						continue;
					}
					if (row.type === "picture") continue;
					if (redraw) {
						redraw();
						axis.textContent = "";
						const said = axisOf(row.key);
						for (const text of [said.x, said.y]) {
							const line = document.createElement("div");
							line.textContent = text;
							axis.append(line);
						}
						continue;
					}
					if (row.type === "select" || row.type === "text") {
						input.value = knobs[row.key];
						readout.textContent = "";
					} else {
						// The ends move with the rest of the draft, so a slider
						// cannot be dragged into a world the map could not carry.
						const live = liveRange(row);
						input.min = live.low;
						input.max = live.high;
						input.value = knobs[row.key];
						readout.textContent =
							Number(knobs[row.key]).toFixed(row.digits ?? 2) +
							(row.unit ? " " + row.unit : "");
					}
					if (note) note.innerHTML = row.note();
				}
				if (!field) return;
				// **The one line the whole page is about**, written out with the
				// numbers the knobs are currently set to.
				// **The one line the whole page is about**, with the terms a
				// switch has taken out shown as what they became rather than
				// removed -- a reader has to see that erosion off is a 1 and
				// peaks off is a 0, or "off" is just a gap.
				const k = field.k;
				const term = (on, live, dead, tint) =>
					on
						? `<i class="${tint}">${live}</i>`
						: `<i class="gone">${dead}</i>`;
				// **Both terms are one minus a share of the same cut**, which is
				// the whole of what erosion does here and is worth showing rather
				// than hiding behind two symbols.
				const lowers = k.useEro && k.erosionBite > 0;
				recipe.innerHTML =
					`height = sea + (${term(k.useCont, "level(C)", "level(0)", "c")} − sea) × ` +
					`${term(lowers, "worn(E)", "1", "e")}<br />` +
					"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ " +
					`${term(k.useEro, "(1 − cut(E))", "1", "e")} × ` +
					`${term(k.usePv, "relief(P)", "0", "p")} × ` +
					`${Math.round(k.peakRelief).toLocaleString()} m` +
					// **A second line, because the fourth layer is not a term in
					// the first.** The three fields sum to one height; the
					// density then asks, at every point of the column that height
					// placed, whether to take that point away.
					(k.useCliff && carveReach(0, k) >= k.blockMetres
						? "<br />rock under height, except where " +
							"<i class=\"f\">dig(D)</i> &gt; height − y · dig up to " +
							`${Math.round(CARVE_SHARE * k.relief * k.cliffSquash).toLocaleString()} m` +
							(k.cliffWear > 0 && k.useEro
								? ` × ${term(true, "(1 − " + k.cliffWear.toFixed(2) + " × cut(E))", "1", "e")}`
								: "")
						: "<br /><i class=\"gone\">rock below height, air above</i>");
				facts.innerHTML =
					(field.whole
						? "patch is <b>the whole planet</b>, "
						: `patch <b>${Math.round(field.arc).toLocaleString()} m</b> across, `) +
					`<b>${field.count.toLocaleString()}</b> columns of ` +
					`<b>${field.blockMetres.toFixed(1)} m</b> blocks · ` +
					`ground <b>${Math.round(field.lowest).toLocaleString()}</b> to ` +
					`<b>${Math.round(field.highest).toLocaleString()} m</b> · ` +
					`<b>${(field.landShare * 100).toFixed(1)}%</b> of the planet is land · ` +
					(knobs.useCliff && carveReach(0, field.k) >= field.k.blockMetres
						? `<b>${((100 * field.stacked) / Math.max(1, field.count)).toFixed(
								1,
							)}%</b> of columns overhang, deepest <b>${field.deepest}</b> ` +
							`layers of rock, <b>${field.floating.toLocaleString()}</b> ` +
							`floating masses · `
						: "") +
					`<b>${cost.toFixed(0)} ms</b>`;
			}

			let pending = false;
			let settleTimer = 0;
			let cost = 0;
			function askForRedraw(draft = true) {
				clearTimeout(settleTimer);
				if (draft) settleTimer = setTimeout(() => askForRedraw(false), 200);
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					settle();
					// A draft covers the same ground with fewer cells, so the
					// hexagons grow as the count falls and the patch keeps its
					// width -- a picture that arrives after the finger has
					// stopped is not a picture of the knob.
					generate(draft ? Math.max(16, knobs.cells >> 1) : knobs.cells);
					buildMesh();
					drawPictures();
					drawGraph();
					cost = performance.now() - started;
					refreshPanel();
					if (!draft) writeUrl();
					render();
				});
			}

			// ---- turning and zooming ----
			let dragging = null;
			view.addEventListener("pointerdown", (e) => {
				dragging = { x: e.clientX, y: e.clientY, shift: e.shiftKey };
				view.setPointerCapture(e.pointerId);
			});
			view.addEventListener("pointermove", (e) => {
				if (!dragging) return;
				const dx = e.clientX - dragging.x;
				const dy = e.clientY - dragging.y;
				dragging.x = e.clientX;
				dragging.y = e.clientY;
				if (dragging.shift) camera.lift += dy * 0.002;
				else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(
						0.03,
						Math.min(1.5, camera.pitch + dy * 0.005),
					);
				}
				render();
			});
			const stop = () => {
				dragging = null;
			};
			view.addEventListener("pointerup", stop);
			view.addEventListener("pointercancel", stop);
			view.addEventListener(
				"wheel",
				(e) => {
					e.preventDefault();
					camera.distance = Math.max(
						0.15,
						Math.min(6, camera.distance * Math.exp(e.deltaY * 0.001)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", render);

			fromParams(new URLSearchParams(location.search));
			buildPanel();
			// The first draw goes through the same timed path every later one
			// does, so the cost on screen is a real number from the start.
			const booted = performance.now();
			settle();
			generate();
			buildMesh();
			drawPictures();
			drawGraph();
			cost = performance.now() - booted;
			refreshPanel();
			render();
		</script>
	</body>
</html>
