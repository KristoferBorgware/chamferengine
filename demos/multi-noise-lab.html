<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Multi-noise lab — three fields, three curves, one landscape</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #e8ecf2;
				--dim: #8b95a4;
				--panel: #12161d;
				--edge: #232b36;
				--live: #6fd0ff;
				--cont: #ffd166;
				--ero: #8ce99a;
				--pv: #ff9db1;
				--cliff: #c9a7ff;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #070a0e;
				color: var(--ink);
				font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#view {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				touch-action: none;
				cursor: grab;
			}
			#view:active {
				cursor: grabbing;
			}
			/* **The four pictures are the reference; the knobs are the work.**
			   Scrolling to reach a knob must not carry the thing being judged
			   off the top of the panel, so there are two sections and only the
			   lower one moves. */
			#panel {
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				width: 340px;
				display: flex;
				flex-direction: column;
				background: rgba(18, 22, 29, 0.94);
				border-left: 1px solid var(--edge);
				backdrop-filter: blur(6px);
			}
			#head {
				flex: 0 0 auto;
				padding: 10px 14px 8px;
				border-bottom: 1px solid var(--edge);
			}
			#scroller {
				flex: 1 1 auto;
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 0 14px 24px;
			}
			#panel h1 {
				font-size: 14px;
				margin: 0 0 6px;
				letter-spacing: 0.01em;
			}
			/* **A picture of a field sits where that field is tuned.** The
			   ground they make together is the thing being judged, so it stays
			   at the top where scrolling to reach a knob cannot carry it off;
			   each layer's own field goes in that layer's section, directly
			   above the curve it is read through. */
			.shot {
				position: relative;
				line-height: 0;
			}
			.shot canvas {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 3px;
				image-rendering: pixelated;
				background: #0b0e13;
				cursor: crosshair;
			}
			.shot b {
				position: absolute;
				left: 4px;
				top: 4px;
				font: 600 9.5px/1.4 system-ui, sans-serif;
				letter-spacing: 0.02em;
				padding: 1px 4px;
				border-radius: 2px;
				color: #12161d;
				background: var(--cont);
				pointer-events: none;
			}
			.shot.ero b {
				background: var(--ero);
			}
			.shot.pv b {
				background: var(--pv);
			}
			.shot.cliff b {
				background: var(--cliff);
			}
			.shot.out b {
				background: var(--live);
			}
			.group > summary > .switch {
				accent-color: var(--live);
				margin: 0 6px 0 0;
				vertical-align: -1px;
			}
			.group.off > *:not(summary) {
				opacity: 0.4;
			}
			.group.off > summary {
				color: var(--dim);
			}
			#recipe .gone {
				color: #5a6470;
			}
			.knob.pictured {
				grid-template-columns: 1fr;
				margin: 9px 0 4px;
			}
			/* The enlarged picture. A field at panel width shows where its
			   features are; at this size it shows what they look like. */
			#big {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(4, 6, 9, 0.88);
				backdrop-filter: blur(3px);
				cursor: zoom-out;
			}
			#big[hidden] {
				display: none;
			}
			#big figure {
				margin: 0;
				max-width: 94vw;
				max-height: 94vh;
			}
			#big canvas {
				display: block;
				max-width: 94vw;
				max-height: 86vh;
				border: 1px solid var(--edge);
				border-radius: 4px;
				image-rendering: pixelated;
				background: #0b0e13;
			}
			#big figcaption {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 16px;
				margin-top: 8px;
				font-size: 12px;
				color: var(--dim);
			}
			#big figcaption b {
				color: var(--ink);
				font-size: 13px;
				letter-spacing: 0.02em;
			}
			#facts {
				color: var(--dim);
				font-size: 11px;
				margin: 7px 0 0;
			}
			#facts b {
				color: var(--ink);
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			#recipe {
				margin: 6px 0 0;
				padding: 5px 6px;
				border: 1px solid var(--edge);
				border-radius: 3px;
				background: #0b0e13;
				color: var(--dim);
				font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
			}
			#recipe i {
				font-style: normal;
				font-weight: 600;
			}
			#recipe .c {
				color: var(--cont);
			}
			#recipe .e {
				color: var(--ero);
			}
			#recipe .p {
				color: var(--pv);
			}
			#recipe .f {
				color: var(--cliff);
			}
			#profile {
				margin-top: 12px;
				border-top: 1px solid var(--edge);
				padding-top: 8px;
			}
			#profile > summary {
				cursor: pointer;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				list-style: none;
			}
			#profile > summary::-webkit-details-marker {
				display: none;
			}
			#profile > summary::before {
				content: "▾ ";
			}
			#profile:not([open]) > summary::before {
				content: "▸ ";
			}
			#graph {
				width: 100%;
				height: auto;
				display: block;
				margin-top: 8px;
				border: 1px solid var(--edge);
				border-radius: 4px;
				background: #0b0e13;
			}
			#graphsays {
				color: var(--dim);
				font-size: 10.5px;
				margin: 3px 0 0;
			}
			.group {
				border-top: 1px solid var(--edge);
				margin: 10px 0 0;
				padding: 0 0 6px;
			}
			.group > summary {
				padding: 8px 0 4px;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				cursor: pointer;
				list-style: none;
				user-select: none;
			}
			.group > summary::-webkit-details-marker {
				display: none;
			}
			.group > summary::before {
				content: "▸ ";
				color: var(--edge);
			}
			.group[open] > summary::before {
				content: "▾ ";
			}
			.group > summary:hover {
				color: var(--live);
			}
			.group.cont > summary {
				color: var(--cont);
			}
			.group.ero > summary {
				color: var(--ero);
			}
			.group.pv > summary {
				color: var(--pv);
			}
			.group.cliff > summary {
				color: var(--cliff);
			}
			.knob {
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: center;
				gap: 2px 8px;
				margin: 7px 0;
			}
			.knob label {
				font-size: 12px;
			}
			.knob output {
				font-variant-numeric: tabular-nums;
				color: var(--live);
				font-size: 11.5px;
			}
			.knob-note {
				grid-column: 1 / -1;
				font-size: 10.5px;
				color: var(--dim);
				margin: 1px 0 0;
			}
			.knob-note b {
				color: var(--live);
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			.knob input[type="range"],
			.knob select,
			.knob input[type="text"] {
				grid-column: 1 / -1;
				width: 100%;
				accent-color: var(--live);
			}
			.knob select,
			.knob input[type="text"] {
				background: #0b0e13;
				color: var(--ink);
				border: 1px solid var(--edge);
				border-radius: 3px;
				padding: 3px 5px;
				font: inherit;
			}
			.knob.curved {
				grid-template-columns: 1fr;
			}
			.curve {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 3px;
				touch-action: none;
				cursor: crosshair;
			}
			.curve-help {
				font-size: 10px;
				color: var(--dim);
				margin: 2px 0 0;
				line-height: 1.35;
			}
			.axis {
				font-size: 9.5px;
				line-height: 1.4;
				color: var(--dim);
				margin: 2px 0 0;
				font-variant-numeric: tabular-nums;
			}
			.knob.check {
				grid-template-columns: auto 1fr;
			}
			.knob.check input {
				grid-column: auto;
				width: auto;
			}
			#hint {
				position: fixed;
				left: 12px;
				bottom: 10px;
				color: var(--dim);
				font-size: 11.5px;
				pointer-events: none;
			}
			@media (max-width: 760px) {
				#panel {
					width: 100%;
					top: auto;
					height: 56%;
					border-left: 0;
					border-top: 1px solid var(--edge);
				}
				#hint {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="view"></canvas>
		<div id="hint">drag to turn · wheel to zoom · shift-drag to raise the eye</div>
		<div id="panel">
			<div id="head">
				<h1>Multi-noise lab</h1>
				<div class="shot out"><canvas id="shotOut"></canvas><b>Terrain</b></div>
				<div id="recipe"></div>
				<div id="facts"></div>
			</div>
			<div id="scroller">
				<div id="knobs"></div>
				<details id="profile" open>
					<summary>Contour</summary>
					<canvas id="graph" width="640" height="300"></canvas>
					<div id="graphsays"></div>
				</details>
			</div>
		</div>

		<div id="big" hidden>
			<figure>
				<canvas id="bigShot"></canvas>
				<figcaption><b id="bigName"></b><span>click anywhere, or press Escape, to close</span></figcaption>
			</figure>
		</div>

		<script>
			"use strict";

			// ===== BEGIN engine noise kernel =====
			// A hand port of packages/engine/src/generation/noise. A demo here
			// carries no imports and no build step, so this is a copy -- and a
			// copy that has drifted from the engine is a lab that teaches the
			// wrong lesson, which is why
			// packages/engine/tests/demos/multiNoiseLab.test.ts digests this
			// block against the real functions.
			/** `2^32`, the divisor that turns a `uint32` into a fraction of one. */
			const U32 = 4294967296;

			/** Three integer coordinates and a seed, mixed into `[0, 1)`. */
			function hash3(x, y, z, seed) {
				let h =
					(Math.imul(x | 0, 374761393) +
						Math.imul(y | 0, 668265263) +
						Math.imul(z | 0, 1274126177) +
						Math.imul(seed | 0, 1013904223)) >>>
					0;
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				h = (h ^ (h >>> 16)) >>> 0;
				return h / U32;
			}

			/** A seed someone typed, reduced to the `uint32` the hash takes. */
			function seedFromString(text) {
				let h = 2166136261 >>> 0;
				for (let i = 0; i < text.length; i++) {
					h = (h ^ text.charCodeAt(i)) >>> 0;
					h = Math.imul(h, 16777619) >>> 0;
				}
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				return (h ^ (h >>> 16)) >>> 0;
			}

			/**
			 * The quintic curve, `6t^5 - 15t^4 + 10t^3`.
			 *
			 * Zero in the first and second derivative at both ends, so a normal
			 * has no crease where one lattice cell meets the next. Smoothstep is
			 * flat in the first derivative only and leaves a curvature jump at
			 * every lattice plane, which shading draws as a grid.
			 */
			function fade(t) {
				return t * t * t * (t * (t * 6 - 15) + 10);
			}

			/** Trilinear value noise, in `[-1, 1]`. */
			function valueNoise3(px, py, pz, seed) {
				const xi = Math.floor(px);
				const yi = Math.floor(py);
				const zi = Math.floor(pz);
				const u = fade(px - xi);
				const v = fade(py - yi);
				const w = fade(pz - zi);
				let s = 0;
				for (let c = 0; c < 8; c++) {
					const dx = c & 1;
					const dy = (c >> 1) & 1;
					const dz = (c >> 2) & 1;
					const wx = dx ? u : 1 - u;
					const wy = dy ? v : 1 - v;
					const wz = dz ? w : 1 - w;
					s += wx * wy * wz * hash3(xi + dx, yi + dy, zi + dz, seed);
				}
				return s * 2 - 1;
			}

			const OCTAVE_SPREAD = 1000;
			const RIDGE_GAIN = 2.2;

			/**
			 * Octaves of value noise with the panel's own parameters, in
			 * `[-1, 1]`.
			 *
			 * Every octave gets its own hashed offset, or two octaves of one
			 * seeded lattice share zero crossings wherever their frequencies land
			 * near a whole multiple and the ground grows a repeating grain.
			 * Octaves accumulate low frequency first, because floating-point
			 * addition is not associative -- the other order moves the result by
			 * `1.4e-17` at four and five octaves and by nothing at six and
			 * eight, which is the kind of error testing never finds. And the sum
			 * is divided by the total amplitude, so adding an octave adds detail
			 * without making the world taller.
			 *
			 * **`ridge` folds each octave at its own zero crossing**, and that
			 * fold is the only place a crease can come from: every octave of a
			 * plain sum is smooth in its first and second derivative, so every
			 * summit a plain sum builds is a dome. At `0` the sum is returned
			 * bit for bit.
			 *
			 * **It creases a whole layer at once**, moving the character of
			 * every place in that layer together, so it belongs to a layer that
			 * already says *where* -- fold the layer that decides a coastline
			 * and every coastline on the planet is creased.
			 */
			function octaveNoise(x, y, z, seed, s) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = s.frequency;
				let weight = 1;
				const ridge = s.ridge;
				for (let o = 0; o < s.octaves; o++) {
					const ox =
						(2 * hash3(o, 0, 0, seed) - 1) * OCTAVE_SPREAD + s.offsetX;
					const oy =
						(2 * hash3(o, 1, 0, seed) - 1) * OCTAVE_SPREAD + s.offsetY;
					const oz = (2 * hash3(o, 2, 0, seed) - 1) * OCTAVE_SPREAD;
					const n = valueNoise3(x * f + ox, y * f + oy, z * f + oz, seed);
					let signal = n;
					if (ridge > 0) {
						// **The fold's crest moves; the two shapes are never
						// mixed.** Folding at the zero crossing and blending
						// that against the plain octave adds an even function to
						// an odd one, and the two disagree about which end is
						// high -- plain noise peaks at `n = 1` and a fold peaks
						// at `n = 0` -- so on the positive side they cancel.
						// Measured over the planet, the spread of the top tenth
						// against the bottom tenth ran `1 : 3.34` at a fold of
						// 0.35 and the maximum fell to 0.338 against the plain
						// sum's 0.807. One shape whose crest slides instead: the
						// field reaches +1 at the crest and -1 at the far end at
						// every setting, and both ends are the arithmetic they
						// always were.
						const pivot = 1 - ridge;
						const away = Math.abs(n - pivot) / (1 + pivot);
						const crease = (1 - away) * (1 - ridge * away);
						signal = crease * 2 - 1;
						signal *= weight;
						weight = Math.min(
							1,
							Math.max(0, 1 - ridge + ridge * crease * RIDGE_GAIN),
						);
					}
					sum += amplitude * signal;
					total += amplitude;
					amplitude *= s.persistence;
					f *= s.lacunarity;
				}
				if (s.normalise === false) return sum;
				return total > 0 ? sum / total : 0;
			}
			// ===== END engine noise kernel =====

			// ===== BEGIN engine coarse grid =====
			// A hand port of packages/engine/src/addressing. Same reason the
			// noise above is a copy: a demo here carries no imports and no build
			// step, and packages/engine/tests/demos/multiNoiseLab.test.ts runs
			// this block against the real functions, so a copy that has drifted
			// fails a test rather than drawing a world the engine does not build.
			//
			// **The patch is the engine's own lattice**, not a hex grid that
			// looks like one: the cells come from `positionToCell`, the ring
			// from `neighbour`, and the hexagons from `cellCorners`. Porting the
			// lab into the engine is deleting this block and importing the six
			// names it defines.

			/** The golden ratio, which is what puts the twelve vertices where they are. */
			const PHI = (1 + Math.sqrt(5)) / 2;

			/** Three components divided by their own length. */
			function normalize3(v) {
				const l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
				return [v[0] / l, v[1] / l, v[2] / l];
			}

			/**
			 * The twelve icosahedron vertices, as unit directions.
			 *
			 * A cell sits on a vertex of the subdivided icosahedron, so these
			 * twelve are the twelve pentagons at every depth and in every world.
			 * The order is fixed: vertices 0 and 3 carry the coordinate poles and
			 * vertex 11 carries the prime meridian.
			 */
			const VERTICES = [
				[-1, PHI, 0],
				[1, PHI, 0],
				[-1, -PHI, 0],
				[1, -PHI, 0],
				[0, -1, PHI],
				[0, 1, PHI],
				[0, -1, -PHI],
				[0, 1, -PHI],
				[PHI, 0, -1],
				[PHI, 0, 1],
				[-PHI, 0, -1],
				[-PHI, 0, 1],
			].map(normalize3);

			/**
			 * The twenty faces, each three indices into the vertex table.
			 *
			 * Every triple runs counter-clockwise seen from outside the sphere,
			 * so a direction table written in one face's frame means the same
			 * turn on all twenty.
			 */
			const FACES = [
				[0, 11, 5],
				[0, 5, 1],
				[0, 1, 7],
				[0, 7, 10],
				[0, 10, 11],
				[1, 5, 9],
				[5, 11, 4],
				[11, 10, 2],
				[10, 7, 6],
				[7, 1, 8],
				[3, 9, 4],
				[3, 4, 2],
				[3, 2, 6],
				[3, 6, 8],
				[3, 8, 9],
				[4, 9, 5],
				[2, 4, 11],
				[6, 2, 10],
				[8, 6, 7],
				[9, 8, 1],
			];

			/**
			 * The direction of each face's centroid.
			 *
			 * The perpendicular bisector between two adjacent centroids contains
			 * the edge those faces share, so the nearest centroid to a direction
			 * names the face that direction falls in, exactly.
			 */
			const FACE_CENTROIDS = FACES.map(([a, b, c]) =>
				normalize3([
					VERTICES[a][0] + VERTICES[b][0] + VERTICES[c][0],
					VERTICES[a][1] + VERTICES[b][1] + VERTICES[c][1],
					VERTICES[a][2] + VERTICES[b][2] + VERTICES[c][2],
				]),
			);

			/**
			 * The six lattice steps, counter-clockwise seen from outside.
			 *
			 * Index 0 is the step from the face's vertex `A` toward `B`, the
			 * offset `(+1, 0)`. That anchor is a property of the cell's own face,
			 * so it never depends on how the cell was reached.
			 */
			const DIRECTIONS = [
				[1, 0],
				[0, 1],
				[-1, 1],
				[-1, 0],
				[0, -1],
				[1, -1],
			];

			/**
			 * For each face, where each of its three edges leads.
			 *
			 * Twenty faces times three edges is sixty entries, each a face number
			 * and an edge number: 180 bytes for every seam on the planet. Edge
			 * `e` runs from vertex `e` to vertex `(e + 1) % 3`. Every matched
			 * pair is traversed in opposite directions by its two faces, which is
			 * the signature of consistent outward winding, so no orientation flag
			 * is stored.
			 */
			const FACE_ADJACENCY = FACES.map((f, at) =>
				[0, 1, 2].map((e) => {
					const a = f[e];
					const b = f[(e + 1) % 3];
					for (let g = 0; g < 20; g++) {
						if (g === at) continue;
						for (let other = 0; other < 3; other++) {
							const c = FACES[g][other];
							const d = FACES[g][(other + 1) % 3];
							if ((a === c && b === d) || (a === d && b === c))
								return { face: g, edge: other };
						}
					}
					throw new Error(`face ${at} edge ${e} has no neighbour`);
				}),
			);

			/**
			 * Turn a set of weights on global vertex numbers into an offset on
			 * `face`.
			 *
			 * The weights need not be whole. A lattice point carries integers and
			 * a droplet standing between cells carries the fractions between
			 * them, and both are the same three numbers attached to the same
			 * three vertices.
			 */
			function offsetOn(face, weights) {
				const ids = FACES[face];
				let total = 0;
				const w = ids.map((v) => {
					const x = weights.get(v) ?? 0;
					total += x;
					return x;
				});
				if (total === 0) return null;
				for (const v of weights.keys()) if (!ids.includes(v)) return null;
				return { face, i: w[1], j: w[2] };
			}

			/**
			 * The barycentric weights of a lattice point on its face's vertices.
			 *
			 * Written this way a lattice point is a set of integer weights
			 * attached to global vertex numbers, and that description never
			 * mentions a face.
			 */
			function latticeWeights(n, i, j) {
				return [n - i - j, i, j];
			}

			/**
			 * The direction of lattice point `(i, j)` on `face`, at `n = 2^level`.
			 *
			 * One barycentric blend evaluated once at full depth, then one
			 * normalize. Building the same point by repeated arc-midpoint
			 * subdivision lands on a different sphere, 38.97 m out on a 1,700 m
			 * planet, and the error is fixed in metres rather than shrinking with
			 * depth.
			 */
			function latticePosition(face, n, i, j) {
				const [ia, ib, ic] = FACES[face];
				const [wa, wb, wc] = latticeWeights(n, i, j);
				const a = VERTICES[ia];
				const b = VERTICES[ib];
				const c = VERTICES[ic];
				return normalize3([
					a[0] * wa + b[0] * wb + c[0] * wc,
					a[1] * wa + b[1] * wb + c[1] * wc,
					a[2] * wa + b[2] * wb + c[2] * wc,
				]);
			}

			/**
			 * Every face-and-offset pair that names the same lattice point.
			 *
			 * A point strictly inside a face has one. A point on a face edge has
			 * two, and a point at an icosahedron vertex has five, since five
			 * faces meet there. The point is found by matching weights against
			 * global vertex numbers, so no geometry is involved.
			 */
			function cellRepresentations(face, n, i, j) {
				const w = latticeWeights(n, i, j);
				const ids = FACES[face];
				const carried = new Map();
				for (let x = 0; x < 3; x++) if (w[x] > 0) carried.set(ids[x], w[x]);
				const out = [];
				for (let g = 0; g < 20; g++) {
					const gv = FACES[g];
					let ok = true;
					for (const v of carried.keys()) if (!gv.includes(v)) ok = false;
					if (!ok) continue;
					out.push({
						face: g,
						i: carried.get(gv[1]) ?? 0,
						j: carried.get(gv[2]) ?? 0,
					});
				}
				return out;
			}

			/**
			 * The one representation a cell is numbered from: the lowest face.
			 *
			 * The same rule that awards a border cell to the lowest chunk
			 * containing it, applied one level up.
			 *
			 * **A cell has a second name only on a face edge, and that is three
			 * comparisons rather than a search.** A weight of zero is what puts
			 * the point on the edge opposite that vertex; two zeros put it on an
			 * icosahedron vertex. With no zero the point is strictly inside its
			 * own face, which names it and nothing else does -- and without the
			 * guard, better than 97% of calls walk all twenty faces to hand back
			 * the cell they were given. **This lab is the caller that made it
			 * worth guarding**: it canonicalises every cell of a patch that can
			 * be the whole planet, where the engine's own bulk caller already
			 * carried the same test at its call site.
			 */
			function canonicalCell(face, n, i, j) {
				if (i > 0 && j > 0 && i + j < n) return { face, i, j };
				const all = cellRepresentations(face, n, i, j);
				let best = all[0];
				for (const c of all) if (c.face < best.face) best = c;
				return best;
			}

			/**
			 * Move a set of weights across the edge opposite vertex `leaving`.
			 *
			 * A point on a face is three weights on that face's three **global**
			 * vertex numbers, and that description never mentions a face. Sending
			 * `(alpha, beta, gamma)` to `(alpha + gamma, beta + gamma, -gamma)` --
			 * `gamma` being the weight on the vertex left behind, and the third
			 * vertex the one the face over the edge carries instead -- writes the
			 * same point under the other face's name. At a `gamma` of zero, which
			 * is a point standing exactly on the edge, it moves nothing at all.
			 *
			 * The map is linear, so it carries a **direction** as readily as a
			 * position: hand it the three components of a step and it hands back
			 * that step continuing onto the other face. That is what lets a
			 * droplet walk off one face and keep going.
			 */
			function acrossEdge(face, weights, leaving) {
				const here = FACES[face];
				const link = FACE_ADJACENCY[face][(leaving + 1) % 3];
				const gamma = weights[leaving];
				const u = here[(leaving + 1) % 3];
				const v = here[(leaving + 2) % 3];
				const third = FACES[link.face].find((x) => x !== u && x !== v);
				return offsetOn(
					link.face,
					new Map([
						[u, weights[(leaving + 1) % 3] + gamma],
						[v, weights[(leaving + 2) % 3] + gamma],
						[third, -gamma],
					]),
				);
			}


			/**
			 * Which of the twenty faces a direction falls in.
			 *
			 * Twenty dot products, take the largest. Exact rather than an
			 * approximation: the perpendicular bisector plane between two
			 * adjacent face centroids contains the two vertices of the edge they
			 * share, so the face boundaries are the Voronoi boundaries of the
			 * centroids.
			 */
			function faceOf(x, y, z) {
				let best = 0;
				let bestDot = -Infinity;
				for (let f = 0; f < 20; f++) {
					const c = FACE_CENTROIDS[f];
					const d = x * c[0] + y * c[1] + z * c[2];
					if (d > bestDot) {
						bestDot = d;
						best = f;
					}
				}
				return best;
			}

			/**
			 * Where a direction sits inside a face, as three weights summing to 1.
			 *
			 * Cramer's rule on `[A B C] w = dir`, rescaled, which is the same
			 * blend `latticePosition` runs forwards. A negative weight means the
			 * direction is outside this face.
			 */
			function barycentricOf(face, x, y, z) {
				const [ia, ib, ic] = FACES[face];
				const a = VERTICES[ia];
				const b = VERTICES[ib];
				const c = VERTICES[ic];
				const bc = [
					b[1] * c[2] - b[2] * c[1],
					b[2] * c[0] - b[0] * c[2],
					b[0] * c[1] - b[1] * c[0],
				];
				const dc = [
					y * c[2] - z * c[1],
					z * c[0] - x * c[2],
					x * c[1] - y * c[0],
				];
				const bd = [
					b[1] * z - b[2] * y,
					b[2] * x - b[0] * z,
					b[0] * y - b[1] * x,
				];
				const det = a[0] * bc[0] + a[1] * bc[1] + a[2] * bc[2];
				const wa = (x * bc[0] + y * bc[1] + z * bc[2]) / det;
				const wb = (a[0] * dc[0] + a[1] * dc[1] + a[2] * dc[2]) / det;
				const wc = (a[0] * bd[0] + a[1] * bd[1] + a[2] * bd[2]) / det;
				const s = wa + wb + wc;
				return [wa / s, wb / s, wc / s];
			}

			/**
			 * The icosahedron vertex a cell sits on, or `-1` when it sits on none.
			 *
			 * A cell is a vertex when two of its three weights are zero, which
			 * puts all of its weight on one corner. Those twelve cells are the
			 * pentagons.
			 */
			function pentagonVertex(face, n, i, j) {
				const w = latticeWeights(n, i, j);
				let full = -1;
				let zeros = 0;
				for (let x = 0; x < 3; x++) {
					if (w[x] === 0) zeros++;
					else full = x;
				}
				return zeros === 2 ? FACES[face][full] : -1;
			}

			/**
			 * The five neighbours of the pentagon on icosahedron vertex `p`, in
			 * order around it, starting from the step `startFace` takes toward
			 * its own next vertex.
			 *
			 * The ring is built by rotating face to face around the vertex rather
			 * than by reflecting across one edge. Two of the five faces meeting
			 * at a vertex touch the starting face only at that vertex, so a
			 * single reflection cannot reach them.
			 */
			function pentagonRing(p, n, startFace) {
				let g = startFace;
				const ring = [];
				for (let s = 0; s < 5; s++) {
					const e = FACES[g].indexOf(p);
					// Faces wind A -> B -> C counter-clockwise from outside, so
					// at vertex p the next cell round is the one toward the
					// following vertex, and the next face round is the one across
					// the edge that arrives back at p.
					const x = FACES[g][(e + 1) % 3];
					const cell = offsetOn(
						g,
						new Map([
							[p, n - 1],
							[x, 1],
						]),
					);
					if (cell) ring.push(cell);
					g = FACE_ADJACENCY[g][(e + 2) % 3].face;
				}
				return ring;
			}

			/**
			 * The neighbour of `(face, i, j)` in direction `k`, at subdivision `n`.
			 *
			 * Returns `null` only for `k = 5` on one of the twelve pentagons,
			 * whose ring is five long. That is a direction which does not exist
			 * rather than a gap: the ring is short, never holed and never
			 * doubled.
			 *
			 * Away from those twelve, stepping off the face is a reflection and
			 * the whole of it is three additions. A lattice point is integer
			 * weights on global vertex numbers; step outside and exactly one
			 * weight goes negative. Reflecting across the shared edge sends
			 * `(alpha, beta, gamma)` to `(alpha + gamma, beta + gamma, -gamma)`,
			 * where `gamma` is the negative one. The point itself does not move
			 * -- only the name it is written under.
			 */
			function neighbour(face, n, i, j, k) {
				const p = pentagonVertex(face, n, i, j);
				if (p >= 0) return pentagonRing(p, n, face)[k] ?? null;

				const [di, dj] = DIRECTIONS[k];
				const ni = i + di;
				const nj = j + dj;
				const w = latticeWeights(n, ni, nj);

				let negative = -1;
				for (let x = 0; x < 3; x++) if (w[x] < 0) negative = x;
				if (negative < 0) return { face, i: ni, j: nj };

				// The edge opposite the vertex whose weight went negative is the
				// one crossed, and the reflection over it is the whole of the step.
				return acrossEdge(face, w, negative);
			}

			/**
			 * The corners of a cell's polygon, counter-clockwise seen from
			 * outside.
			 *
			 * A corner sits at the centroid of one of the triangles meeting at
			 * the cell, so corner `k` comes from the cell together with its
			 * neighbours in directions `k` and `k + 1`. Six of them on a hexagon,
			 * five on a pentagon.
			 *
			 * The three lattice points are averaged as **integer weights on
			 * global vertex numbers**, and only then blended and projected.
			 * Averaging first and projecting second is what keeps the 30 face
			 * edges seamless: the sum never mentions a face, so two faces sharing
			 * a corner compute the same number rather than two numbers that
			 * nearly agree. Projecting each point and then averaging the results
			 * gives a different curve.
			 */
			function cellCorners(face, n, i, j) {
				const ring = [];
				for (let k = 0; k < 6; k++) {
					const nb = neighbour(face, n, i, j, k);
					if (nb) ring.push(nb);
				}
				const degree = ring.length;
				const total = new Float64Array(12);
				const out = [];
				for (let k = 0; k < degree; k++) {
					const b = (k + 1) % degree;
					total.fill(0);
					addWeights(total, face, n, i, j);
					addWeights(total, ring[k].face, n, ring[k].i, ring[k].j);
					addWeights(total, ring[b].face, n, ring[b].i, ring[b].j);
					let x = 0;
					let y = 0;
					let z = 0;
					for (let v = 0; v < 12; v++) {
						const w = total[v];
						if (w === 0) continue;
						const p = VERTICES[v];
						x += p[0] * w;
						y += p[1] * w;
						z += p[2] * w;
					}
					const length = Math.sqrt(x * x + y * y + z * z);
					out.push([x / length, y / length, z / length]);
				}
				return out;
			}

			/** Add one lattice point's weights into the running total over the twelve vertices. */
			function addWeights(total, face, n, i, j) {
				const ids = FACES[face];
				total[ids[0]] += n - i - j;
				total[ids[1]] += i;
				total[ids[2]] += j;
			}

			/**
			 * Round three continuous barycentric coordinates to a lattice point.
			 *
			 * Rounding each one on its own breaks the sum: `(4.7, 8.6, 2.7)` sums
			 * to 16 and rounds to `(5, 9, 3)`, which sums to 17 and names no
			 * lattice point at all. The repair recomputes whichever coordinate
			 * moved furthest from the other two, because that is the one the
			 * measurement knows least about.
			 *
			 * The third coordinate exists for this. Two cannot detect the error.
			 */
			function hexRound(ka, kb, kc, n) {
				let ra = Math.round(ka);
				let rb = Math.round(kb);
				let rc = Math.round(kc);
				const da = Math.abs(ra - ka);
				const db = Math.abs(rb - kb);
				const dc = Math.abs(rc - kc);
				if (da > db && da > dc) ra = n - rb - rc;
				else if (db > dc) rb = n - ra - rc;
				else rc = n - ra - rb;
				return [ra, rb, rc];
			}

			/**
			 * Which lattice point a direction belongs to, at subdivision `n`.
			 *
			 * Three steps, all arithmetic: nearest face centroid, then where
			 * inside that face, then round to a lattice point. A cell is by
			 * definition the set of directions this maps to it -- never a
			 * nearest-centre search, which disagrees with the rounding on about
			 * 1% of the sphere.
			 *
			 * **It does not canonicalise, and that is deliberate.** A cell on a
			 * face edge has two names and a cell on an icosahedron vertex has
			 * five, and which one comes back here is whichever face the direction
			 * fell in. Picking one of them is the caller's job, at the moment it
			 * uses the cell as a key -- which is what `generate` does.
			 */
			function directionToCell(x, y, z, n) {
				const face = faceOf(x, y, z);
				const [a, b, c] = barycentricOf(face, x, y, z);
				const [, i, j] = hexRound(a * n, b * n, c * n, n);
				return { face, i, j };
			}
			// ===== END engine coarse grid =====
			// ---------------------------------------------------------------
			// The curves.
			// ---------------------------------------------------------------

			/**
			 * A curve read at `at`, straight-line between the points it holds.
			 *
			 * `at` is a noise value in `[-1, 1]` and the answer is in `[0, 1]`.
			 * Outside the outermost points the curve holds its end value, so a
			 * field that reaches further than the curve was drawn for still has
			 * an answer and the answer is the one the edge of the curve gave.
			 */
			function splineAt(points, at) {
				if (points.length === 0) return 0;
				if (at <= points[0][0]) return points[0][1];
				const last = points[points.length - 1];
				if (at >= last[0]) return last[1];
				for (let n = 1; n < points.length; n++) {
					const [x1, y1] = points[n];
					if (at > x1) continue;
					const [x0, y0] = points[n - 1];
					const span = x1 - x0;
					if (span <= 1e-9) return y1;
					return y0 + ((y1 - y0) * (at - x0)) / span;
				}
				return last[1];
			}

			/** A curve as a query-string value, and back. */
			function splineToText(points) {
				return points
					.map(([x, y]) => `${+x.toFixed(3)}:${+y.toFixed(3)}`)
					.join(",");
			}
			function splineFromText(text) {
				const out = [];
				for (const pair of text.split(",")) {
					const [x, y] = pair.split(":").map(Number);
					if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
					out.push([
						Math.max(-1, Math.min(1, x)),
						Math.max(0, Math.min(1, y)),
					]);
				}
				out.sort((a, b) => a[0] - b[0]);
				return out.length >= 2 ? out : null;
			}

			// ---------------------------------------------------------------
			// The three fields, and the one line that combines them.
			// ---------------------------------------------------------------

			/**
			 * The three layers, in the order they are read.
			 *
			 * The order is the whole construction. **Continentalness sets the
			 * level, erosion decides how much relief survives there, and peaks
			 * and valleys is the relief itself.** Reading them the other way --
			 * relief first, then a continent under it -- gives a mountain range
			 * that starts in the sea, because nothing in the range's own field
			 * knows where it is.
			 */
			const LAYERS = ["cont", "ero", "pv", "cliff"];

			/**
			 * The two elevations that cut the land into three bands, and the
			 * colour of each.
			 *
			 * **Absolute metres, because the map is.** A fraction of relief
			 * agrees at one relief and drifts at every other, so the engine
			 * bands on fixed heights: water under sea level, grass to 300 m,
			 * bare stone to 400 m, snow over it. These are the engine's own
			 * numbers and the engine's own colours, so a colour here names the
			 * block the world would build there.
			 */
			const GROUND_LINES = { rock: 300, snow: 400 };
			const BAND_COLORS = [
				[0.76, 0.7, 0.5],
				[0.26, 0.44, 0.19],
				[0.42, 0.42, 0.45],
				[0.92, 0.94, 0.97],
			];
			/** What the sea is, and how far a look reaches into it. */
			const SEA_COLOR = [0.12, 0.32, 0.55];
			const SEA_CLARITY = 45;

			/**
			 * How wide the patch may be in *blocks*, which is what bounds both
			 * the walk that enumerates it and the walk down every column.
			 * `Patch` is set in map cells and `Block detail` multiplies it, so
			 * the pair of them is what has to be held rather than either alone.
			 */
			const PATCH_COLUMNS = 256;
			/**
			 * How many blocks of one column the carve may read. Everything
			 * outside the band is settled without a reading, so this bounds the
			 * band and `Squash` is the end that moves to keep it.
			 */
			const MAX_CARVE_LAYERS = 512;
			/**
			 * How much of `Relief` the carve may dig through at a full squash.
			 *
			 * **The crust is a share of the world's own height, not a distance.**
			 * A quarter of the tallest mountain is the same slice off the top of
			 * a gentle world and a savage one, so the layer keeps its character
			 * when Relief moves rather than needing to be re-tuned after it.
			 */
			const CARVE_SHARE = 0.25;

			/** Offsets from the world seed, so the three layers are three fields. */
			const SEED_OFFSET = { cont: 101, ero: 211, pv: 337, cliff: 613 };

			/**
			 * `blockSize = K * radius / 2^depth`, which ties the three together
			 * so any two fix the third.
			 */
			const CELL_CONSTANT = Math.sqrt((8 * Math.PI) / (10 * Math.sqrt(3)));

			/**
			 * One layer's noise stack, read off that layer's own rows.
			 *
			 * **A layer is a whole stack, not a frequency.** A layer that
			 * borrowed its neighbour's octave count and falloff could only say
			 * the same thing at a different size, and the reason there are three
			 * is to say three different things: where the land is, how worn it
			 * is, and what stands on it.
			 *
			 * **The size is in metres and the frequency is derived.** A
			 * frequency counts features from pole to pole, so one setting draws
			 * hills on a small planet and continents on a large one; metres mean
			 * the same on every world, and moving the radius then moves the
			 * horizon and leaves the landforms where they were.
			 */
			function layerSettings(k, which) {
				return {
					// **A layer is set in metres and the noise takes a
					// frequency.** The sample point is a unit direction, so a
					// frequency counts how many times the widest octave repeats
					// across the whole planet: the same number is hills on one
					// world and continents on another. Metres divided by the
					// radius reach the frequency, and the number a person sets
					// then means the same thing whatever size the planet is.
					frequency: k.radius / k[which + "Metres"],
					octaves: k[which + "Octaves"],
					persistence: k[which + "Persistence"],
					lacunarity: k[which + "Lacunarity"],
					offsetX: 0,
					offsetY: 0,
					// **The fold is what makes a ridge.** Every octave of a plain
					// sum is smooth in its first and second derivative, so every
					// summit it can build is a dome; `1 - |n|` creases an octave
					// at its own zero crossing and the crease is the ridge line.
					// It belongs on peaks and valleys and nowhere else -- folding
					// continentalness creases the coast of every continent at
					// once.
					ridge: k[which + "Fold"],
					normalise: true,
				};
			}

			/** The three stacks, built once and read everywhere. */
			function settingsFor(k) {
				const out = {};
				for (const which of LAYERS) out[which] = layerSettings(k, which);
				return out;
			}

			/**
			 * What the three fields say at one direction, each in `[-1, 1]`.
			 *
			 * **Sampled from the direction vector, in 3D world space** -- never
			 * from a face's own `(i, j)`. Face coordinates are discontinuous at
			 * all thirty face edges and the discontinuity is visible as a seam in
			 * the ground.
			 */
			function fieldsAt(x, y, z, seed, s, out) {
				out[0] = octaveNoise(x, y, z, seed + SEED_OFFSET.cont, s.cont);
				out[1] = octaveNoise(x, y, z, seed + SEED_OFFSET.ero, s.ero);
				out[2] = octaveNoise(x, y, z, seed + SEED_OFFSET.pv, s.pv);
				// **The fourth is read at the surface here and everywhere else
				// in the column.** The other three are fields over a sphere and
				// have one value per place; this one has a value per *point*, so
				// what a picture and a histogram can show is the slice of it the
				// ground happens to pass through. The terrain reads it again at
				// every block of `carveColumn`.
				out[3] = octaveNoise(x, y, z, seed + SEED_OFFSET.cliff, s.cliff);
				return out;
			}

			/**
			 * The density at one point of the column, rather than at the surface.
			 *
			 * **Three inputs and one output, which is what a cliff needs.** A
			 * height field answers one height per place, so no place can have
			 * ground over air over ground -- an overhang is not a value it can
			 * hold. A density field answers *is this point rock*, and the ground
			 * is wherever the answer changes, which can happen more than once
			 * down a column.
			 *
			 * **It is 3D noise, and on a sphere that costs nothing extra.** The
			 * other three layers sample a unit direction, which the settings
			 * scale by `radius / metres`; the point `metres` above the surface is
			 * the same direction scaled by `1 + metres / radius`, so one call
			 * reads one field at any altitude. That scaling is also exactly
			 * **isotropic** -- a metre straight up moves the sample point as far
			 * as a metre sideways does -- so a feature set to 150 m is 150 m tall
			 * as well as 150 m wide, and a blob of it is a blob rather than a
			 * sheet.
			 */
			function densityAt(dx, dy, dz, metres, radius, seed, s) {
				const out = 1 + metres / radius;
				return octaveNoise(
					dx * out,
					dy * out,
					dz * out,
					seed + SEED_OFFSET.cliff,
					s.cliff,
				);
			}

			/**
			 * The three readings turned into one height, in metres above sea
			 * level.
			 *
			 * **This is the whole model.**
			 *
			 * - The continentalness curve **is a height, not a land-or-sea
			 *   switch**. Its **middle is the waterline**, and the two halves
			 *   scale apart: up to `relief` above it, down to `seaDepth` below,
			 *   so its answer is already in metres -- an ocean floor at one end,
			 *   the top of a plateau at the other. Which of those is coast falls
			 *   out of it rather than being decided by it, and **only the curve
			 *   decides it**: sea level is drawn across the curve, and where the
			 *   curve crosses that line is the shore. It is the level the other
			 *   two layers then work on, so it is where the ground would stand
			 *   before erosion wears it and before peaks and valleys is added.
			 * - The erosion curve answers **how much erosion takes away here**,
			 *   from none of it to all of it -- up is more cut away, because the
			 *   layer is called erosion and erosion is removal. What is left of
			 *   the relief is `1 - cut(E)`, so a region the curve sends to `1` is
			 *   flat whatever the third field is doing, which is the one thing a
			 *   single stack of octaves can never say.
			 * - The peaks-and-valleys curve is the relief, signed: its `0.5` is
			 *   the level the continent set, below it cuts a valley and above it
			 *   raises a peak.
			 *
			 * **Erosion does two things: it flattens, and it lowers.** It takes
			 * the relief outright -- what survives is `1 - cut(E)` -- and it
			 * takes the level in proportion to `Wears the level down`, because
			 * water wears a range down as well as smoothing it, and in a nested
			 * spline, where the height is one function of all three fields,
			 * erosion changes the level by construction.
			 *
			 * So both are one minus a share of the same cut: the relief keeps
			 * `1 - cut(E)`, and the level keeps that same cut scaled by whatever
			 * `Wears the level down` is set to. Turn that knob all the way up and
			 * the two are the same number, so land the curve fully cuts is
			 * flattened and lowered together and ends at sea level; turn it off
			 * and the level keeps all of its height while only the bumps go.
			 *
			 * **Below sea level nothing is worn**: the ocean floor is not what
			 * the rain is falling on, and wearing it would lift the sea bed
			 * toward the surface.
			 *
			 * So high continentalness with low erosion and high peaks is a steep
			 * ridge; the same continentalness and the same peaks under high
			 * erosion is a plain, and a lower one than the continent asked for.
			 */
			/**
			 * How much erosion takes away here: `0` leaves the ground alone, `1`
			 * takes all of the relief.
			 *
			 * **Pulled out because two things read it.** The height uses it to
			 * flatten the relief and lower the level; the carve uses it to
			 * shorten its own reach, so a worn place gets no cliffs for the same
			 * reason it gets no peaks -- one field, one meaning, two readers.
			 */
			function erosionCut(said, k) {
				return k.useEro ? splineAt(k.eroSpline, said[1]) : 0;
			}

			function heightFrom(said, k) {
				// **Each layer's off is an exact statement about what it
				// contributes, not a hidden default.** Erosion off keeps all of
				// the relief, which is the multiply's own neutral; peaks off adds
				// none, which is the sum's. Continentalness has no neutral --
				// something has to set the level -- so off reads its curve at the
				// middle of the field, which is the one level a field with
				// nothing to say would give: a flat plain, and whatever the other
				// two do on top of it.
				const level = k.useCont
					? splineAt(k.contSpline, said[0])
					: splineAt(k.contSpline, 0);
				// **Land and the sea floor scale apart, each to its own knob.**
				// The curve's middle is the waterline, so above it `Relief` alone
				// says how tall land gets and below it `Sea depth` alone says how
				// deep the floor goes. One scale for the whole axis looks obvious
				// and is what makes `Sea depth` flood the world: it rescales the
				// metres a curve point is worth, which drags sea level across the
				// curve and moves the coast. Split, neither knob moves the coast
				// -- the coast is where the curve crosses the middle, and only
				// the curve puts it there.
				const base =
					level >= 0.5
						? ((level - 0.5) / 0.5) * k.relief
						: -((0.5 - level) / 0.5) * k.seaDepth;
				const cut = erosionCut(said, k);
				const swing = k.usePv ? splineAt(k.pvSpline, said[2]) * 2 - 1 : 0;
				const over = base - k.seaLevel;
				const worn = 1 - k.erosionBite * cut;
				return (
					k.seaLevel +
					(over > 0 ? over * worn : over) +
					(1 - cut) * swing * k.peakRelief
				);
			}

			// ---------------------------------------------------------------
			// The knobs.
			// ---------------------------------------------------------------

			/**
			 * How far under the ground the density may decide, in metres.
			 *
			 * **It is not a knob, and that is the point.** A depth slider is a
			 * digging slider: turn it up and the layer stops carving a crust and
			 * starts sinking shafts, which is a cave system's job and not this
			 * one's. It is a fixed share of **`Relief`** instead -- a quarter of
			 * how tall the tallest mountain in the world is -- so the carve is
			 * always the same slice off the top of the world however that world
			 * is set. Make the mountains taller and the crust it works in gets
			 * taller with them; nothing else moves it.
			 *
			 * **Not the density's own feature size, which was tried.** Tying the
			 * depth to the shapes being cut reads well and drowns the world: at
			 * the shipped knobs, widening `Feature` from 100 m to 800 m took the
			 * lowest ground from `-248 m` to `-1,280 m` and the highest from
			 * `344 m` to `-200 m` -- every column dug under the sea. That is the
			 * same digging slider wearing a different label.
			 *
			 * **What the feature size decides instead is whether anything
			 * overhangs.** A block is kept while one below it is dug only if the
			 * field swings between the two, so the depth has to be worth more
			 * than one feature: at a 200 m depth, a 100 m feature gives 22.5% of
			 * columns overhanging and a 400 m feature gives a lowered surface
			 * and almost nothing else.
			 *
			 * **Erosion shortens it.** A worn place has had its peaks flattened
			 * and its level dragged toward the sea, and a cliff standing in the
			 * middle of that is the same contradiction a mountain there would be
			 * -- so the same `cut` that takes the relief away takes the carve
			 * with it, in proportion to `Erosion smooths it`. At `0` the
			 * carve ignores erosion and cuts a plain as hard as a range; at `1`
			 * a fully worn place gets no carve at all.
			 */
			function carveReach(cut, k) {
				return Math.min(
					CARVE_SHARE * k.relief * k.cliffSquash * (1 - k.cliffWear * cut),
					// The walk is one block a step, so this is what stops a
					// kilometre-wide density feature asking for a column walked
					// for kilometres. It binds only at the widest settings, and
					// the row says so when it does.
					k.blockMetres * MAX_CARVE_LAYERS,
				);
			}

			/**
			 * One column of ground, as the heights where rock starts and stops.
			 *
			 * **It takes rock away and never puts any back.** The three 2D layers
			 * give one height per place, which is what makes a coastline, a
			 * continent and a mountain range tractable and what no density field
			 * can be asked for. This layer starts from the solid column that
			 * height describes and **digs**: a block is rock unless the density
			 * says to remove it. Nothing above the surface is ever kept, so
			 * **the ground can only ever end up lower than the three fields drew
			 * it**, and a mountain is something the carve left standing rather
			 * than something it built.
			 *
			 * **The curve says how deep, and the reach says what its bottom is
			 * worth.** A reading is turned into a distance -- the top of the
			 * curve digs nothing, the bottom digs a whole reach -- and a block at
			 * depth `d` under the surface is removed when the reading at *that
			 * block* is willing to dig past it. So the same field read at two
			 * heights in one column can dig at one and not at the other, which is
			 * what leaves rock over air over rock. Below one reach nothing is
			 * ever touched, and the walk covers exactly that.
			 *
			 * **There is no separate strength knob, because there cannot be
			 * one.** How much is dug is the curve's shape and how far is the
			 * reach; a third knob multiplying both would move nothing the two of
			 * them are holding still.
			 *
			 * Returns pairs of heights, low to high, snapped to the block grid.
			 */
			function carveColumn(dx, dy, dz, surface, reach, k, seed, s, out) {
				out.length = 0;
				const block = k.blockMetres;
				// Layer indices, so two neighbouring columns cut their blocks on
				// the same planes -- a grid one column rounded for itself would
				// draw a step between every pair of columns and nowhere else.
				const first = Math.floor((surface - reach) / block);
				const last = Math.floor(surface / block);
				let from = first * block;
				let rock = true;
				for (let L = first; L <= last; L++) {
					const y = (L + 0.5) * block;
					// Above the ground the three fields drew, there is nothing to
					// carve and nothing to keep.
					let solid = y < surface;
					if (solid) {
						const read = densityAt(dx, dy, dz, y, k.radius, seed, s);
						const dig = (1 - splineAt(k.cliffSpline, read)) * reach;
						solid = surface - y >= dig;
					}
					if (solid === rock) continue;
					// A block is rock or air whole, so the face is the plane
					// between two layers rather than the point the density
					// crossed its own threshold.
					if (rock) out.push(from, L * block);
					else from = L * block;
					rock = solid;
				}
				if (rock) out.push(from, (last + 1) * block);
				return out;
			}

			/**
			 * The top of the topmost rock at one place, which is what a picture
			 * of the ground has to draw.
			 *
			 * **A carve moves the surface, so a map that skips it is a map of a
			 * world nobody is standing on** -- the plane shows a spire and the
			 * picture beside it shows the hillside the spire was cut out of.
			 * Under an overhang the two are not even close.
			 */
			function surfaceAt(dx, dy, dz, said, k, seed, s, out) {
				const base = heightFrom(said, k);
				if (!k.useCliff) return base;
				const reach = carveReach(erosionCut(said, k), k);
				if (reach < k.blockMetres) return base;
				carveColumn(dx, dy, dz, base, reach, k, seed, s, out);
				return out.length > 0 ? out[out.length - 1] : base - reach;
			}

			/**
			 * The four rows every noise layer carries, plus the fold.
			 *
			 * Written once and stamped out three times, because the whole claim
			 * is that the three layers differ in what they *say* rather than in
			 * what they *are*. A layer given a row its neighbours do not have
			 * would be a fourth idea smuggled into a comparison of three.
			 */
			function layerRows(which, feature, scale, octaves, fold, extra = []) {
				return [
					{
						// **A size in metres, because a frequency is a number
						// about a sphere and a landform is a thing on the

										narrowestOf(which),

						unit: "x",

					{
						key: which + "Fold",

						low: 0,

						value: fold,
						digits: 2,
						note: () =>

			/**
			 * A layer's section: the switch, then the graph, then the picture,
			 * then the knobs.

			 * **The curve is what the layer is for, so it goes first.** A layer
			 * is a stack of octaves read through a curve, and the stack's own
			 * rows only say how coarse or fine the reading is -- they are the
			 * setup, and the curve is the decision. The picture sits between
			 * them because it is what both are being judged against.

			function layerGroup(
				group,

						{
							key: "use" + which[0].toUpperCase() + which.slice(1),
							label: "on",

							value: true,

						spline,
						// The layer's own field, drawn where it is being tuned
						// rather than at the top of the panel. Click it for a
						// large one.
						{ key: which + "Picture", label: "", type: "picture", value: 0 },
						...layerRows(which, feature, scale, octaves, fold, extra),

				{
					group: "The pictures",
					open: false,
					rows: [

							value: "planet",

			const knobs = {};
			for (const g of KNOBS)
				for (const r of g.rows)
					knobs[r.key] =
						r.type === "spline" ? r.value.map((p) => [...p]) : r.value;

			/**
			 * The whole draft, as a query string, and back again.
			 *
			 * **A link is how a setting travels.** Every knob is a parameter, so
			 * a world found by dragging can be handed to somebody else rather
			 * than described. The address bar is rewritten as the knobs move.
			 */
			function toParams() {
				const out = new URLSearchParams();
				for (const g of KNOBS)
					for (const r of g.rows) {
						const v = knobs[r.key];
						if (r.type === "spline") {
							const now = splineToText(v);
							if (now !== splineToText(r.value)) out.set(r.key, now);
							continue;
						}
						if (v === r.value) continue;
						out.set(r.key, r.type === "check" ? (v ? "1" : "0") : String(v));
					}
				// The eye, and only when it has been moved -- a link to the
				// opening view should read as the opening view.
				for (const [key, at] of [
					["eyeYaw", "yaw"],
					["eyePitch", "pitch"],
					["eyeZoom", "distance"],
					["eyeLift", "lift"],
				])
					if (camera[at] !== EYE[at]) out.set(key, camera[at].toFixed(3));
				return out;
			}

			function fromParams(params) {
				for (const g of KNOBS)
					for (const r of g.rows) {
						const raw = params.get(r.key);
						if (raw === null) continue;
						if (r.type === "spline") {
							const points = splineFromText(raw);
							if (points) knobs[r.key] = points;
						} else if (r.type === "check") knobs[r.key] = raw !== "0";
						else if (r.type === "select")
							knobs[r.key] = r.options.includes(raw) ? raw : r.value;
						else if (r.type === "text") knobs[r.key] = raw;
						else {
							const v = Number(raw);
							// A hand-edited link can name anything, so a slider's
							// own ends are what the value is held inside.
							knobs[r.key] = Number.isFinite(v)
								? Math.min(r.high, Math.max(r.low, v))
								: r.value;
						}
					}
				// **The eye is part of what a link shows.** A cliff seen from
				// overhead is a colour and seen from beside it is a cliff, so a
				// link that carries the world and not the angle it was found at
				// hands over half of what was found.
				for (const [key, at, low, high] of [
					["eyeYaw", "yaw", -Math.PI * 2, Math.PI * 2],
					["eyePitch", "pitch", -0.2, 1.5],
					["eyeZoom", "distance", 0.2, 6],
					["eyeLift", "lift", -2, 2],

					if (params.get(key) !== null && Number.isFinite(v))

			}

			function writeUrl() {
				const query = toParams().toString();
