<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chunk hierarchy &amp; cell ownership</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0e14; color:#e6e8ee; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:13px 16px 8px; }
  h1 { font-size:16px; font-weight:650; letter-spacing:-.01em; }
  .sub { font-size:12px; color:#8b93a7; margin-top:3px; }
  .stage { position:relative; flex:1; min-height:52vh; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .hud { position:absolute; top:10px; left:12px; right:12px; pointer-events:none; font-size:12px; line-height:1.5; }
  .card { pointer-events:auto; background:rgba(11,14,20,.86); border:1px solid #222839;
          border-radius:9px; backdrop-filter:blur(8px); max-width:min(360px,90%); overflow:hidden; }
  .cardhead { display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none;
              border:none; padding:8px 11px; font:inherit; font-size:12px; color:#fff; font-weight:600; cursor:pointer; }
  .chev { margin-left:auto; color:#6d768c; font-size:10px; transition:transform .18s; transform:rotate(180deg); }
  .card.collapsed .chev { transform:rotate(0deg); }
  .cardbody { padding:0 11px 9px; }
  .card.collapsed .cardbody { display:none; }
  .note { color:#8b93a7; margin-top:5px; }
  .metric { color:#ffd166; font-variant-numeric:tabular-nums; margin-top:3px; }
  code { background:#161c28; padding:1px 5px; border-radius:4px; font-size:11px; color:#c6d4f0; }
  .panel { padding:11px 14px 15px; border-top:1px solid #1b2130; background:#0e121b;
           display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .lbl { font-size:11px; color:#6d768c; text-transform:uppercase; letter-spacing:.06em; width:100%; margin-bottom:1px; }
  button { font:inherit; font-size:12.5px; font-weight:550; padding:7px 11px; border-radius:8px;
           cursor:pointer; background:#1a2130; color:#dfe3ec; border:1px solid #2a3245; }
  button:active { transform:scale(.97); }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
  button:disabled { opacity:.3; cursor:default; }
  .spacer { flex:1; }
</style>
</head>
<body>

<header>
  <h1>Chunk hierarchy &amp; cell ownership</h1>
  <div class="sub">Triangles carry the hierarchy · hexes sit on their vertices</div>
</header>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="card" id="card">
      <button class="cardhead" id="cardhead"><span id="hudTitle">—</span><span class="chev">▾</span></button>
      <div class="cardbody" id="hudBody"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <span class="lbl">Show</span>
    <button data-view="tri" class="on">Triangles</button>
    <button data-view="hex">Hex cells</button>
    <span class="spacer"></span>
    <button id="iso">Isolate 1 chunk</button>
  </div>
  <div class="row">
    <span class="lbl">Subdivision depth</span>
    <button data-depth="1">1</button>
    <button data-depth="2">2</button>
    <button data-depth="3" class="on">3</button>
    <button data-depth="4">4</button>
  </div>
  <div class="row">
    <span class="lbl">Chunk level (ID truncated here)</span>
    <button data-chunk="0" class="on">0 · 20</button>
    <button data-chunk="1">1 · 80</button>
    <button data-chunk="2">2 · 320</button>
    <span class="spacer"></span>
    <button id="curve">Order</button>
    <button id="spin" class="on">Spin</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3 = THREE.Vector3;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0e14);
const camera = new THREE.PerspectiveCamera(45,1,.1,200); camera.position.set(0,0,4.3);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const k1=new THREE.DirectionalLight(0xffffff,.8); k1.position.set(4,5,6); scene.add(k1);
const k2=new THREE.DirectionalLight(0x9ab6ff,.35); k2.position.set(-5,-2,-4); scene.add(k2);
const root=new THREE.Group(); root.rotation.set(.35,.6,0); scene.add(root);

/* ---------- icosahedron ---------- */
const PHI=(1+Math.sqrt(5))/2;
const ICO_V=[[-1,PHI,0],[1,PHI,0],[-1,-PHI,0],[1,-PHI,0],[0,-1,PHI],[0,1,PHI],[0,-1,-PHI],
             [0,1,-PHI],[PHI,0,-1],[PHI,0,1],[-PHI,0,-1],[-PHI,0,1]].map(v=>new V3(...v).normalize());
const ICO_F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
             [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];

/* child order: corner, middle, corner, corner — 2 of 3 steps share an edge, the max possible */
const CHILD_ORDER=[0,3,1,2];

/* ---------- subdivide, carrying each face's path ---------- */
function build(depth){
  let verts=ICO_V.map(v=>v.clone());
  let faces=ICO_F.map((f,i)=>({v:f.slice(), base:i, path:[]}));
  for (let s=0;s<depth;s++){
    const cache=new Map();
    const mid=(a,b)=>{ const k=a<b?a+'_'+b:b+'_'+a;
      if(cache.has(k))return cache.get(k);
      verts.push(verts[a].clone().add(verts[b]).normalize());
      cache.set(k,verts.length-1); return verts.length-1; };
    const next=[];
    for (const f of faces){
      const [a,b,c]=f.v, ab=mid(a,b), bc=mid(b,c), ca=mid(c,a);
      const kids=[[a,ab,ca],[ab,b,bc],[ca,bc,c],[ab,bc,ca]];
      for (const d of CHILD_ORDER)
        next.push({v:kids[d], base:f.base, path:[...f.path,d]});
    }
    faces=next;
  }
  return {verts,faces};
}
const chunkOf=(f,level)=>f.base+':'+f.path.slice(0,level).join('');

/* ---------- colors ---------- */
const colCache=new Map();
function chunkColor(id){
  if(colCache.has(id))return colCache.get(id);
  let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0;
  const c=new THREE.Color().setHSL((h*0.61803398875)%1, .58, .56);
  colCache.set(id,c); return c;
}
const GREY=new THREE.Color(0x2a3140);

/* ---------- geometry ---------- */
function shell(cells, inset, rOut, rIn){
  const pos=[], col=[];
  const P=(v,c)=>{ pos.push(v.x,v.y,v.z); col.push(c.r,c.g,c.b); };
  for (const {ring,center,color} of cells){
    const s=ring.map(p=>p.clone().lerp(center,inset).normalize());
    const top=s.map(p=>p.clone().multiplyScalar(rOut)), bot=s.map(p=>p.clone().multiplyScalar(rIn));
    const cT=center.clone().multiplyScalar(rOut), cB=center.clone().multiplyScalar(rIn);
    for(let i=0;i<s.length;i++){ const j=(i+1)%s.length;
      P(cT,color);P(top[i],color);P(top[j],color);
      P(cB,color);P(bot[j],color);P(bot[i],color);
      P(top[i],color);P(bot[i],color);P(bot[j],color);
      P(top[i],color);P(bot[j],color);P(top[j],color); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));
  g.computeVertexNormals(); return g;
}
const MAT=new THREE.MeshPhongMaterial({vertexColors:true,shininess:18,flatShading:true,side:THREE.DoubleSide});
const LINE=new THREE.LineBasicMaterial({color:0xffd166});

function ringSort(pts,n){
  const nn=n.clone().normalize();
  const h=Math.abs(nn.z)<.9?new V3(0,0,1):new V3(1,0,0);
  const t=h.clone().cross(nn).normalize(), b=nn.clone().cross(t);
  return pts.map(p=>({p,a:Math.atan2(p.dot(b),p.dot(t))})).sort((x,y)=>x.a-y.a).map(o=>o.p);
}

/* ---------- state ---------- */
let view='tri', depth=3, chunkLvl=0, showCurve=false, iso=false, spin=true;

const card=document.getElementById('card');
if (innerWidth<700) card.classList.add('collapsed');
document.getElementById('cardhead').addEventListener('click',()=>card.classList.toggle('collapsed'));
const setHud=(t,b)=>{ document.getElementById('hudTitle').textContent=t;
                      document.getElementById('hudBody').innerHTML=b; };

function rebuild(){
  while(root.children.length){ const m=root.children.pop(); if(m.geometry)m.geometry.dispose(); }
  const {verts,faces}=build(depth);
  const ids=faces.map(f=>chunkOf(f,chunkLvl));
  const chunks=[...new Set(ids)];
  const target=chunks[0];

  let cells, boundary=0, cellCount;

  if (view==='tri'){
    cells=faces.map((f,i)=>{
      const ring=f.v.map(k=>verts[k].clone());
      const center=ring.reduce((a,p)=>a.add(p.clone()),new V3()).normalize();
      const on=!iso||ids[i]===target;
      return {ring,center,color:on?chunkColor(ids[i]):GREY};
    });
    cellCount=faces.length;
  } else {
    // dual: one hex/pentagon per geodesic vertex
    const cen=faces.map(f=>f.v.reduce((a,k)=>a.add(verts[k]),new V3()).normalize());
    const inc=verts.map(()=>[]);
    faces.forEach((f,fi)=>f.v.forEach(vi=>inc[vi].push(fi)));
    cells=verts.map((v,vi)=>{
      const around=[...new Set(inc[vi].map(fi=>ids[fi]))];
      if (around.length>1) boundary++;
      // ownership: lowest chunk id wins, so every cell has exactly one home
      const owner=around.sort()[0];
      const on=!iso||owner===target;
      return {ring:ringSort(inc[vi].map(fi=>cen[fi]),v), center:v.clone(),
              color:on?chunkColor(owner):GREY};
    });
    cellCount=verts.length;
  }

  root.add(new THREE.Mesh(shell(cells, view==='tri'?.055:.09, 1, .85), MAT));

  if (showCurve){
    const pts=faces.map(f=>f.v.reduce((a,k)=>a.add(verts[k]),new V3()).normalize().multiplyScalar(1.06));
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),LINE));
  }

  const pathBits=2*chunkLvl;
  if (view==='tri'){
    setHud(`${cellCount} triangles · ${chunks.length} chunks`,
      `<div class="note">Each triangle's ID is <code>base:${'d'.repeat(chunkLvl)||'—'}…</code> — 5 bits of base face
       plus 2 bits per level. Color = the ID truncated to level ${chunkLvl}
       (${pathBits} path bits), which is exactly what masking off the low digits gives you.</div>
       <div class="note">Raise the depth and the colors don't move: children never leave their parent.
       That's the exactness you don't get from hex-in-hex nesting.</div>`);
  } else {
    setHud(`${cellCount} cells · ${boundary} on a chunk border`,
      `<div class="note">Every cell sits on a triangle <i>vertex</i>. Interior cells touch one chunk;
       the <b>${boundary}</b> border cells touch two or three, and are assigned by lowest chunk ID —
       so each has exactly one owner and no cell is stored twice.</div>
       <div class="metric">${(100*boundary/cellCount).toFixed(1)}% of cells need the ownership rule</div>
       <div class="note">Twelve cells are pentagons, on the icosahedron vertices. Those are the ones
       where a neighbour direction simply doesn't exist.</div>`);
  }
}

/* ---------- ui ---------- */
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('pointermove',e=>{ if(!drag)return;
  root.rotation.y+=(e.clientX-lx)*.006; root.rotation.x+=(e.clientY-ly)*.006;
  lx=e.clientX; ly=e.clientY; });
canvas.addEventListener('wheel',e=>{ e.preventDefault();
  camera.position.z=Math.min(11,Math.max(1.7,camera.position.z+e.deltaY*.0022)); },{passive:false});

const grp=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll(sel).forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); fn(b); sync(); rebuild(); }));
grp('[data-view]',  b=>view=b.dataset.view);
grp('[data-depth]', b=>depth=+b.dataset.depth);
grp('[data-chunk]', b=>chunkLvl=+b.dataset.chunk);
function sync(){
  document.querySelectorAll('[data-chunk]').forEach(b=>b.disabled=(+b.dataset.chunk>depth));
  if (chunkLvl>depth){ chunkLvl=depth;
    document.querySelectorAll('[data-chunk]').forEach(b=>b.classList.toggle('on',+b.dataset.chunk===chunkLvl)); }
}
document.getElementById('curve').addEventListener('click',e=>{
  showCurve=!showCurve; e.target.classList.toggle('on',showCurve); rebuild(); });
document.getElementById('iso').addEventListener('click',e=>{
  iso=!iso; e.target.classList.toggle('on',iso); rebuild(); });
document.getElementById('spin').addEventListener('click',e=>{
  spin=!spin; e.target.classList.toggle('on',spin); });

function resize(){ const s=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(s.width,s.height,false);
  camera.aspect=s.width/s.height; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);
(function loop(){ requestAnimationFrame(loop);
  if(spin&&!drag) root.rotation.y+=.002;
  renderer.render(scene,camera); })();
resize(); sync(); rebuild();
</script>
</body>
</html>
