<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex + Pentagon Voxel Sphere</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#0b0e14; color:#e6e8ee;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header { padding:14px 16px 10px; }
  h1 { font-size:17px; font-weight:650; letter-spacing:-0.01em; }
  .sub { font-size:12.5px; color:#8b93a7; margin-top:3px; }

  .stage { position:relative; flex:1; min-height:60vh; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  .hud {
    position:absolute; top:10px; left:12px;
    font-size:12px; line-height:1.55; color:#c7ccd9;
    background:rgba(11,14,20,.72); border:1px solid #222839;
    padding:8px 11px; border-radius:8px; backdrop-filter:blur(6px);
  }
  .hud b { color:#fff; font-weight:600; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .d-hex { background:#4f8ef7; }
  .d-pent { background:#f2543d; }

  .panel {
    padding:12px 16px 16px; border-top:1px solid #1b2130; background:#0e121b;
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  button {
    font:inherit; font-size:13px; font-weight:550;
    padding:8px 13px; border-radius:8px; cursor:pointer;
    background:#1a2130; color:#dfe3ec; border:1px solid #2a3245;
  }
  button:active { transform:scale(.97); }
  button.on { background:#4f8ef7; border-color:#4f8ef7; color:#fff; }
  .lbl { font-size:12px; color:#8b93a7; margin-right:2px; }
  .grp { display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>

<header>
  <h1>Hex + 12 Pentagon Sphere (Goldberg polyhedron)</h1>
  <div class="sub">Built algorithmically as the dual of a subdivided icosahedron — every cell is a real prism.</div>
</header>

<div class="stage">
  <canvas id="c"></canvas>
  <div class="hud">
    <div><span class="dot d-hex"></span><b id="nhex">—</b> hexagons</div>
    <div><span class="dot d-pent"></span><b id="npent">12</b> pentagons</div>
    <div style="margin-top:5px;color:#8b93a7">frequency <b id="freq">—</b> · drag to rotate</div>
  </div>
</div>

<div class="panel">
  <span class="lbl">Resolution</span>
  <div class="grp">
    <button data-lvl="0">12</button>
    <button data-lvl="1">42</button>
    <button data-lvl="2" class="on">162</button>
    <button data-lvl="3">642</button>
    <button data-lvl="4">2562</button>
  </div>
  <div class="grp" style="margin-left:auto">
    <button id="gap" class="on">Gaps</button>
    <button id="spin" class="on">Spin</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 4.2);

scene.add(new THREE.AmbientLight(0xffffff, 0.42));
const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(4,5,6); scene.add(key);
const rim = new THREE.DirectionalLight(0x86a8ff, 0.45); rim.position.set(-5,-2,-4); scene.add(rim);

const root = new THREE.Group();
root.rotation.set(0.35, 0.6, 0);
scene.add(root);

/* ---------- 1. icosahedron ---------- */
const T = (1 + Math.sqrt(5)) / 2;
const BASE_V = [
  [-1,T,0],[1,T,0],[-1,-T,0],[1,-T,0],
  [0,-1,T],[0,1,T],[0,-1,-T],[0,1,-T],
  [T,0,-1],[T,0,1],[-T,0,-1],[-T,0,1]
].map(v => new THREE.Vector3(...v).normalize());
const BASE_F = [
  [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
  [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
  [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
  [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
];

/* ---------- 2. subdivide (geodesic sphere) ---------- */
function geodesic(level){
  let verts = BASE_V.map(v => v.clone());
  let faces = BASE_F.map(f => f.slice());
  for (let s = 0; s < level; s++){
    const cache = new Map();
    const mid = (a,b) => {
      const k = a < b ? a+'_'+b : b+'_'+a;
      if (cache.has(k)) return cache.get(k);
      const m = verts[a].clone().add(verts[b]).normalize();
      verts.push(m);
      const i = verts.length - 1;
      cache.set(k, i);
      return i;
    };
    const next = [];
    for (const [a,b,c] of faces){
      const ab = mid(a,b), bc = mid(b,c), ca = mid(c,a);
      next.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);
    }
    faces = next;
  }
  return {verts, faces};
}

/* ---------- 3. dual -> hex/pent cells ---------- */
function goldbergCells(level){
  const {verts, faces} = geodesic(level);

  // face centroids on the sphere = corners of the dual cells
  const centroids = faces.map(([a,b,c]) =>
    verts[a].clone().add(verts[b]).add(verts[c]).normalize());

  // which faces touch each vertex
  const incident = verts.map(() => []);
  faces.forEach((f, fi) => f.forEach(vi => incident[vi].push(fi)));

  const cells = [];
  verts.forEach((v, vi) => {
    const n = v.clone();
    // tangent frame at v
    const helper = Math.abs(n.z) < 0.9 ? new THREE.Vector3(0,0,1) : new THREE.Vector3(1,0,0);
    const t = helper.clone().cross(n).normalize();
    const b = n.clone().cross(t);

    const ring = incident[vi]
      .map(fi => centroids[fi])
      .map(p => ({p, a: Math.atan2(p.dot(b), p.dot(t))}))
      .sort((x, y) => x.a - y.a)
      .map(o => o.p);

    cells.push({ring, center: n});
  });
  return cells;
}

/* ---------- 4. cells -> prism geometry ---------- */
function buildGeometry(cells, inset, rOut, rIn){
  const pos = [];
  const push = (v) => pos.push(v.x, v.y, v.z);

  for (const {ring, center} of cells){
    const shrunk = ring.map(p => p.clone().lerp(center, inset).normalize());
    const top = shrunk.map(p => p.clone().multiplyScalar(rOut));
    const bot = shrunk.map(p => p.clone().multiplyScalar(rIn));
    const cT = center.clone().multiplyScalar(rOut);
    const cB = center.clone().multiplyScalar(rIn);
    const N = top.length;

    for (let i = 0; i < N; i++){
      const j = (i+1) % N;
      push(cT); push(top[i]); push(top[j]);            // top fan
      push(cB); push(bot[j]); push(bot[i]);            // bottom fan
      push(top[i]); push(bot[i]); push(bot[j]);        // side
      push(top[i]); push(bot[j]); push(top[j]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.computeVertexNormals();
  return g;
}

const matHex  = new THREE.MeshPhongMaterial({color:0x4f8ef7, shininess:26, flatShading:true, side:THREE.DoubleSide});
const matPent = new THREE.MeshPhongMaterial({color:0xf2543d, shininess:26, flatShading:true, side:THREE.DoubleSide});

let level = 2, gaps = true, spin = true;

function rebuild(){
  while (root.children.length) {
    const m = root.children.pop();
    m.geometry.dispose();
  }
  const cells = goldbergCells(level);
  const pent = cells.filter(c => c.ring.length === 5);
  const hex  = cells.filter(c => c.ring.length === 6);

  const inset = gaps ? 0.10 : 0.005;
  const rOut = 1.0, rIn = 0.80;

  root.add(new THREE.Mesh(buildGeometry(hex,  inset, rOut, rIn), matHex));
  root.add(new THREE.Mesh(buildGeometry(pent, inset, rOut, rIn), matPent));

  document.getElementById('nhex').textContent = hex.length;
  document.getElementById('npent').textContent = pent.length;
  document.getElementById('freq').textContent = Math.pow(2, level);
}

/* ---------- interaction ---------- */
let drag = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup',   e => { drag = false; });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  root.rotation.y += (e.clientX - lx) * 0.006;
  root.rotation.x += (e.clientY - ly) * 0.006;
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.position.z = Math.min(9, Math.max(1.6, camera.position.z + e.deltaY * 0.0022));
}, {passive:false});

document.querySelectorAll('[data-lvl]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-lvl]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    level = +btn.dataset.lvl;
    rebuild();
  });
});
document.getElementById('gap').addEventListener('click', e => {
  gaps = !gaps; e.target.classList.toggle('on', gaps); rebuild();
});
document.getElementById('spin').addEventListener('click', e => {
  spin = !spin; e.target.classList.toggle('on', spin);
});

function resize(){
  const s = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(s.width, s.height, false);
  camera.aspect = s.width / s.height;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function loop(){
  requestAnimationFrame(loop);
  if (spin && !drag) root.rotation.y += 0.0022;
  renderer.render(scene, camera);
}
resize(); rebuild(); loop();
</script>
</body>
</html>
