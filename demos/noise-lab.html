<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Noise lab — a patch of the planet, and the knobs that shape it</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #e8ecf2;
				--dim: #8b95a4;
				--panel: #12161d;
				--edge: #232b36;
				--live: #6fd0ff;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #070a0e;
				color: var(--ink);
				font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#view {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				touch-action: none;
				cursor: grab;
			}
			#view:active {
				cursor: grabbing;
			}
			/* **The picture is the reference; the knobs are the work.** Scrolling
			   to reach a knob used to carry the map off the top of the panel,
			   so the thing being judged left the screen exactly when it was
			   being changed. Two sections, and only the lower one moves. */
			#panel {
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				width: 320px;
				display: flex;
				flex-direction: column;
				background: rgba(18, 22, 29, 0.94);
				border-left: 1px solid var(--edge);
				backdrop-filter: blur(6px);
			}
			#head {
				flex: 0 0 auto;
				padding: 10px 14px 6px;
				border-bottom: 1px solid var(--edge);
			}
			#scroller {
				flex: 1 1 auto;
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 0 14px 24px;
			}
			#panel h1 {
				font-size: 14px;
				margin: 0 0 2px;
				letter-spacing: 0.01em;
			}
			#panel p.blurb {
				margin: 0 0 10px;
				color: var(--dim);
				font-size: 11.5px;
			}
			#map {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 4px;
				image-rendering: pixelated;
				background: #0b0e13;
			}
			#profile {
				margin-top: 12px;
				border-top: 1px solid var(--edge);
				padding-top: 8px;
			}
			#profile > summary {
				cursor: pointer;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				list-style: none;
			}
			#profile > summary::before {
				content: "▾ ";
			}
			#profile:not([open]) > summary::before {
				content: "▸ ";
			}
			#graph {
				width: 100%;
				height: auto;
				display: block;
				margin-top: 8px;
				border: 1px solid var(--edge);
				border-radius: 4px;
				background: #0b0e13;
			}
			#graphsays {
				color: var(--dim);
				font-size: 10.5px;
				margin: 3px 0 0;
			}
			#legend {
				display: flex;
				gap: 2px;
				margin: 6px 0 4px;
				font-size: 10px;
				color: var(--dim);
			}
			#legend span {
				flex: 1;
				text-align: center;
				padding: 2px 0;
				border-radius: 2px;
				color: #0b0e13;
				font-weight: 600;
			}
			#facts {
				color: var(--dim);
				font-size: 11px;
				margin: 4px 0 2px;
			}
			#facts b {
				color: var(--ink);
				font-weight: 600;
			}
			fieldset {
				border: 0;
				border-top: 1px solid var(--edge);
				margin: 10px 0 0;
				padding: 8px 0 0;
			}
			legend {
				padding: 0;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
			}
			.knob {
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: center;
				gap: 2px 8px;
				margin: 7px 0;
			}
			.knob label {
				font-size: 12px;
			}
			.knob output {
				font-variant-numeric: tabular-nums;
				color: var(--live);
				font-size: 11.5px;
			}
			.knob input[type="range"],
			.knob select,
			.knob input[type="text"] {
				grid-column: 1 / -1;
				width: 100%;
				accent-color: var(--live);
			}
			.knob select,
			.knob input[type="text"] {
				background: #0b0e13;
				color: var(--ink);
				border: 1px solid var(--edge);
				border-radius: 3px;
				padding: 3px 5px;
				font: inherit;
			}
			.knob.switched {
				grid-template-columns: auto 1fr auto;
			}
			.knob.switched > input[type="checkbox"] {
				grid-column: auto;
				width: auto;
				margin: 0;
			}
			.knob input:disabled {
				opacity: 0.35;
			}
			.knob.curved {
				grid-template-columns: 1fr;
			}
			.curve {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 3px;
				touch-action: none;
				cursor: crosshair;
			}
			.knob.check {
				grid-template-columns: auto 1fr;
			}
			.knob.check input {
				grid-column: auto;
				width: auto;
			}
			.hidden {
				display: none;
			}
			#hint {
				position: fixed;
				left: 12px;
				bottom: 10px;
				color: var(--dim);
				font-size: 11.5px;
				pointer-events: none;
			}
			@media (max-width: 720px) {
				#panel {
					width: 100%;
					top: auto;
					height: 52%;
					border-left: 0;
					border-top: 1px solid var(--edge);
				}
				#hint {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="view"></canvas>
		<div id="hint">drag to turn · wheel to zoom · shift-drag to raise the eye</div>
		<div id="panel">
			<div id="head">
				<h1>Noise lab</h1>
				<canvas id="map" width="192" height="192"></canvas>
				<div id="legend">
					<span style="background: #2c5f96">sea over sand</span>
					<span style="background: #6b9553">grass</span>
					<span style="background: #a3a3ac">rock</span>
					<span style="background: #f3f6fa">snow</span>
				</div>
				<div id="facts"></div>
			</div>
			<div id="scroller">
				<div id="knobs"></div>
				<details id="profile" open>
					<summary>Contour</summary>
					<canvas id="graph" width="640" height="300"></canvas>
					<div id="graphsays"></div>
				</details>
			</div>
		</div>

		<script>
			"use strict";

			// ===== BEGIN engine noise kernel =====
			// A hand port of packages/engine/src/generation/noise and the height
			// chain above it. A demo here carries no imports and no build step,
			// so this is a copy -- and a copy that has drifted from the engine is
			// a lab that teaches the wrong lesson, which is why
			// packages/engine/tests/demos/noiseLab.test.ts digests this block
			// against the real functions over every basis.

			/** `2^32`, the divisor that turns a `uint32` into a fraction of one. */
			const U32 = 4294967296;

			/** Three integer coordinates and a seed, mixed into `[0, 1)`. */
			function hash3(x, y, z, seed) {
				let h =
					(Math.imul(x | 0, 374761393) +
						Math.imul(y | 0, 668265263) +
						Math.imul(z | 0, 1274126177) +
						Math.imul(seed | 0, 1013904223)) >>>
					0;
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				h = (h ^ (h >>> 16)) >>> 0;
				return h / U32;
			}

			/** A seed someone typed, reduced to the `uint32` the hash takes. */
			function seedFromString(text) {
				let h = 2166136261 >>> 0;
				for (let i = 0; i < text.length; i++) {
					h = (h ^ text.charCodeAt(i)) >>> 0;
					h = Math.imul(h, 16777619) >>> 0;
				}
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				return (h ^ (h >>> 16)) >>> 0;
			}

			/**
			 * The quintic curve, `6t^5 - 15t^4 + 10t^3`.
			 *
			 * Zero in the first and second derivative at both ends, so a normal
			 * has no crease where one lattice cell meets the next. Smoothstep is
			 * flat in the first derivative only and leaves a curvature jump at
			 * every lattice plane, which shading draws as a grid.
			 */
			function fade(t) {
				return t * t * t * (t * (t * 6 - 15) + 10);
			}

			/** Trilinear value noise, in `[-1, 1]`. */
			function valueNoise3(px, py, pz, seed) {
				const xi = Math.floor(px);
				const yi = Math.floor(py);
				const zi = Math.floor(pz);
				const u = fade(px - xi);
				const v = fade(py - yi);
				const w = fade(pz - zi);
				let s = 0;
				for (let c = 0; c < 8; c++) {
					const dx = c & 1;
					const dy = (c >> 1) & 1;
					const dz = (c >> 2) & 1;
					const wx = dx ? u : 1 - u;
					const wy = dy ? v : 1 - v;
					const wz = dz ? w : 1 - w;
					s += wx * wy * wz * hash3(xi + dx, yi + dy, zi + dz, seed);
				}
				return s * 2 - 1;
			}

			/**
			 * Fractional Brownian motion: the original stack, in `[-1, 1]`.
			 *
			 * Octaves of value noise, each one `lacunarity` times finer and
			 * `persistence` times quieter than the last, divided by the total
			 * amplitude. **The engine's own copy pins those two at 2 and a
			 * half**, which is what the defaults here are, so calling this with
			 * six arguments is exactly the engine's function -- the last two are
			 * the lab letting you move what the engine fixed.
			 *
			 * What it does not have, and the octave stack does, is a hashed
			 * offset per octave and the ridge fold. That is the whole difference
			 * between the two, which makes this the plain sum: the field with
			 * nothing done to it.
			 *
			 * Two details are fixed rather than incidental. **Octaves accumulate
			 * low frequency first**, because floating-point addition is not
			 * associative -- the other order moves the result by `1.4e-17` at
			 * four and five octaves and by nothing at six and eight, which is
			 * the kind of error testing never finds. And **the sum is divided by
			 * the total amplitude**, so adding an octave adds detail without
			 * making the world taller.
			 */
			function fbm(
				x,
				y,
				z,
				frequency,
				octaves,
				seed,
				persistence = 0.5,
				lacunarity = 2,
				normalise = true,
			) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = frequency;
				for (let o = 0; o < octaves; o++) {
					sum += amplitude * valueNoise3(x * f, y * f, z * f, seed);
					total += amplitude;
					amplitude *= persistence;
					f *= lacunarity;
				}
				// **The reference implementations disagree here.** Musgrave's
				// original returns the sum, and so does libnoise -- fBm is a
				// fractal sum and being bounded is no part of its definition, so
				// its reach grows toward `1 / (1 - gain)` as octaves are added.
				// FastNoiseLite divides by the summed amplitude, which is this.
				// Both are ordinary; what the choice decides is whether the
				// octave count is a control over shape or over height.
				return normalise ? sum / total : sum;
			}

			const OCTAVE_SPREAD = 1000;
			const RIDGE_GAIN = 2.2;

			/**
			 * Octaves of value noise with the panel's own parameters, in
			 * `[-1, 1]`.
			 *
			 * Every octave gets its own hashed offset, or two octaves of one
			 * seeded lattice share zero crossings wherever their frequencies land
			 * near a whole multiple and the ground grows a repeating grain.
			 * Octaves accumulate low frequency first, because floating-point
			 * addition is not associative. And `ridge` folds each octave at its
			 * own zero crossing: a sum of smooth things is smooth, so plain
			 * octaves give hills at any steepness, and the only place a crease
			 * comes from is an absolute value.
			 */
			function octaveNoise(x, y, z, seed, s) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = s.frequency;
				let weight = 1;
				const ridge = s.ridge;
				for (let o = 0; o < s.octaves; o++) {
					const ox =
						(2 * hash3(o, 0, 0, seed) - 1) * OCTAVE_SPREAD + s.offsetX;
					const oy =
						(2 * hash3(o, 1, 0, seed) - 1) * OCTAVE_SPREAD + s.offsetY;
					const oz = (2 * hash3(o, 2, 0, seed) - 1) * OCTAVE_SPREAD;
					const n = valueNoise3(x * f + ox, y * f + oy, z * f + oz, seed);
					let signal = n;
					if (ridge > 0) {
						const fold = 1 - Math.abs(n);
						const crease = fold * fold;
						signal = n * (1 - ridge) + (crease * 2 - 1) * ridge;
						signal *= weight;
						weight = Math.min(
							1,
							Math.max(0, 1 - ridge + ridge * crease * RIDGE_GAIN),
						);
					}
					sum += amplitude * signal;
					total += amplitude;
					amplitude *= s.persistence;
					f *= s.lacunarity;
				}
				if (s.normalise === false) return sum;
				return total > 0 ? sum / total : 0;
			}

			/** Offset from the noise seed, so the push is not the field it pushes. */
			const WARP_SEED_OFFSET = 11;
			const WARP_OCTAVES = 3;

			/** Build the two settings objects one field needs. */
			function settingsFor(k) {
				const surface = {
					frequency: k.frequency,
					octaves: k.octaves,
					persistence: k.persistence,
					lacunarity: k.lacunarity,
					offsetX: k.offsetX,
					offsetY: k.offsetY,
					ridge: k.ridge,
					normalise: k.normalise,
				};
				// The warp does not read the surface's octave settings: pushing
				// a field by a copy of itself folds it along its own features
				// and leaves the coast where it was.
				const warp = {
					...surface,
					normalise: true,
					frequency: k.warpFrequency,
					octaves: WARP_OCTAVES,
					persistence: 0.5,
					lacunarity: 2,
					offsetX: 0,
					offsetY: 0,
					ridge: 0,
				};
				return { surface, warp, stack: k.stack };
			}

			/**
			 * One sample of whichever stack is selected.
			 *
			 * **fBm is the plain sum**: octaves of one field, each finer and
			 * quieter than the last, and nothing else. No ridge, no offsets, no
			 * per-octave hash. That is the point of having it -- it is the field
			 * with nothing done to it, and the two stacks differ by exactly
			 * those three things rather than by their parameters.
			 */
			function stackAt(x, y, z, seed, s, which) {
				if (which === "fbm")
					return fbm(
						x,
						y,
						z,
						s.frequency,
						s.octaves,
						seed,
						s.persistence,
						s.lacunarity,
						s.normalise,
					);
				return octaveNoise(x, y, z, seed, s);
			}

			/**
			 * The unitless surface field at one direction.
			 *
			 * Sampled in 3D world space and never from a face's own coordinates,
			 * which is what makes the thirty face edges invisible.
			 */
			function surfaceAt(x, y, z, seed, k, s) {
				const which = s.stack;
				if (k.warpAmplitude === 0)
					return stackAt(x, y, z, seed, s.surface, which);
				const w = (seed + WARP_SEED_OFFSET) | 0;
				const a = k.warpAmplitude;
				// The warp is always the plain stack: it displaces the point the
				// field is read at, so a step anywhere in it tears the field
				// into two pieces that do not meet.
				return stackAt(
					x + a * fbm(x, y, z, s.warp.frequency, WARP_OCTAVES, w),
					y + a * fbm(x, y, z, s.warp.frequency, WARP_OCTAVES, w + 1),
					z + a * fbm(x, y, z, s.warp.frequency, WARP_OCTAVES, w + 2),
					// Six arguments, so gain and lacunarity stay where the
					// engine pins them however the panel is set.
					seed,
					s.surface,
					which,
				);
			}

			/**
			 * The height that leaves `landFraction` of the surface above it.
			 *
			 * Rounded to a value `float32` holds exactly, because the engine's
			 * map is stored that way and "is this cell land" is asked of the
			 * stored height.
			 */
			function seaLevelFor(height, landFraction) {
				const sorted = Float64Array.from(height).sort();
				const at = Math.floor(sorted.length * (1 - landFraction));
				return Math.fround(sorted[Math.min(at, sorted.length - 1)]);
			}
			// ===== END engine noise kernel =====

			// ---------------------------------------------------------------
			// Layers: fields whose job is to control other fields.
			//
			// **A single octave stack can only make one kind of landscape.**
			// fBm is homogeneous -- every octave applies everywhere at the same
			// amplitude -- so one statistic describes the whole planet and there
			// is no term that can say "be different here". Measured as the
			// spread of local roughness, calmest tenth against roughest tenth,
			// one stack gives 1.3x. Ridge does not help: it folds every octave
			// everywhere, moving the character globally rather than carving
			// regions out of it.
			//
			// What does help is a second kind of field. A **control** is never
			// added to the height; it decides how the terrain behaves where it
			// is read. It has to be slow -- much lower frequency than the ground
			// -- because a kind of place that changed as fast as the ground
			// would not read as a place at all.
			// ---------------------------------------------------------------

			/**
			 * A control field's value, bent through a curve of the reader's own.
			 *
			 * **The curve is what puts an edge on a region.** A control read
			 * straight is linear and mushy: half of it gives half of whatever it
			 * governs, everywhere, gradually. A curve can say "nothing at all
			 * until two thirds, then flatten hard", which is what makes a
			 * mountain front, a plateau rim and a coastal shelf rather than one
			 * long fade.
			 *
			 * Piecewise linear between the points, held flat past the ends.
			 * Straight segments rather than a smooth spline because a person
			 * dragging a point should be able to predict what happens, and
			 * because a curve that overshoots its own control points can send a
			 * quantity outside the range it was promised.
			 */
			function splineAt(points, at) {
				if (points.length === 0) return 0;
				if (at <= points[0][0]) return points[0][1];
				const last = points[points.length - 1];
				if (at >= last[0]) return last[1];
				for (let n = 1; n < points.length; n++) {
					const [x1, y1] = points[n];
					if (at > x1) continue;
					const [x0, y0] = points[n - 1];
					const span = x1 - x0;
					if (span <= 1e-9) return y1;
					return y0 + ((y1 - y0) * (at - x0)) / span;
				}
				return last[1];
			}

			/** A spline as a query-string value, and back. */
			function splineToText(points) {
				return points.map(([x, y]) => `${+x.toFixed(3)}:${+y.toFixed(3)}`).join(",");
			}
			function splineFromText(text) {
				const out = [];
				for (const pair of text.split(",")) {
					const [x, y] = pair.split(":").map(Number);
					if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
					out.push([Math.max(-1, Math.min(1, x)), Math.max(0, Math.min(1, y))]);
				}
				out.sort((a, b) => a[0] - b[0]);
				return out.length >= 2 ? out : null;
			}

			/** Offsets from the world seed, so the controls are their own fields. */
			const CONTINENT_SEED_OFFSET = 101;
			const MOUNTAIN_SEED_OFFSET = 211;

			/**
			 * The surface with the control layers applied.
			 *
			 * Three merge rules, because which one is right is the whole
			 * question and the answer is easier to see than to argue:
			 *
			 * **multiply** is the rule as it is usually written down --
			 * continent times erosion times mountains. It gives the widest
			 * spread of character and it reaches that by collapsing most of the
			 * map toward flat, because multiplying toward zero pulls the ground
			 * toward sea level. Under it, flat and low are the same thing and a
			 * high plateau cannot exist.
			 *
			 * **amplitude** adds the base elevation and scales only the detail,
			 * so how high a place is and how rough it is come apart. A high flat
			 * plateau and a low rough badland are both reachable.
			 *
			 * **blend** does that and also chooses the SHAPE: a smooth stack
			 * where the control is low, a creased one where it is high. This is
			 * the one that gives hills in one place and a range in another,
			 * rather than more or less of one thing everywhere.
			 */
			function layeredAt(x, y, z, seed, k, s, report) {
				const plain = surfaceAt(x, y, z, seed, k, s);
				// **Each layer switched off means the value that removes it, not
				// zero.** A continent of nothing is flat ground, so its neutral
				// is the middle of the range; a mountain layer of nothing is
				// full detail everywhere, which is what the world looks like
				// with no regions in it at all.
				// Both controls are read whether or not they are switched on,
				// because the histogram under each curve counts what the field
				// said and a switched-off layer still has a curve to look at.
				const contRaw = fbm(
					x,
					y,
					z,
					k.continentFrequency,
					k.continentOctaves,
					(seed + CONTINENT_SEED_OFFSET) | 0,
				);
				const mountRaw = fbm(
					x,
					y,
					z,
					k.mountainFrequency,
					k.mountainOctaves,
					(seed + MOUNTAIN_SEED_OFFSET) | 0,
				);
				const cont = k.useContinent
					? splineAt(k.continentSpline, contRaw)
					: 0.5;
				const mount = k.useMountain ? splineAt(k.mountainSpline, mountRaw) : 1;
				if (report) {
					report[0] = cont;
					report[1] = mount;
					report[2] = contRaw;
					report[3] = mountRaw;
				}
				const base = cont * 2 - 1;
				if (k.merge === "multiply") return base * mount * ((plain + 1) / 2);
				if (k.merge === "amplitude") return base + plain * mount * k.detail;
				// The creased twin of the same ground: same seed and the same
				// frequency, so it lies over the plain one rather than beside
				// it, and only the fold differs.
				const creased = stackAt(
					x,
					y,
					z,
					seed,
					{ ...s.surface, ridge: 0.85 },
					"octaves",
				);
				const shape = plain * (1 - mount) + creased * mount;
				return base + shape * mount * k.detail;
			}

			/** The field the world is built from, layered or not. */

			const knobs = {};
			/**
			 * Whether a knob is being applied at all.
			 *
			 * **A knob's off has to remove its effect without removing the
			 * world.** For most of them that is the arithmetic neutral -- ridge
			 * 0 is bit-for-bit the plain sum, warp 0 reads the point where it
			 * stands, persistence 0 leaves one octave. Relief and Sea depth are
			 * the exception: their neutral is 0, which multiplies every height
			 * by nothing and leaves a full field of noise with no ground at all,
			 * a world the sliders cannot otherwise build and one that reads as a
			 * broken generator. Theirs is the slider's own bottom instead, which
			 * is as near to nothing as the panel goes and still a world.
			 *
			 * Either way the switch says which value it uses, so there is
			 * nothing to infer. A knob is off when
			 * it is set to the value that removes its own effect -- ridge 0 is
			 * bit-for-bit the plain sum, warp 0 reads the point where it stands,
			 * persistence 0 leaves one octave -- and for those, turning it off is
			 * an exact statement about what it contributes. Noise scale,
			 * lacunarity and map cell have no such value: without a frequency
			 * there is no field, and a switch that quietly meant "back to the
			 * default" would look like a measurement and not be one.
			 */
			const using = {};

				for (const r of g.rows) {

						r.type === "spline"
							? r.value.map((point) => [...point])
							: r.value;
					if (r.off !== undefined) using[r.key] = true;
				}

			/**
			 * The whole draft, as a query string, and back again.
			 *
			 * **A link is how a setting travels.** Every knob is a parameter and
			 * every switch is one too, with an `x` prefix -- so a world found by
			 * dragging can be handed to somebody else, or written down, rather
			 * than described. The address bar is rewritten as the knobs move, so
			 * the link in it is always the picture on screen.
			 */
			function toParams() {
				const out = new URLSearchParams();
				for (const g of KNOBS)
					for (const r of g.rows) {
						const v = knobs[r.key];
						if (r.type === "spline") {
							const now = splineToText(v);
							if (now !== splineToText(r.value)) out.set(r.key, now);
							continue;
						}
						if (v === r.value) continue;
						out.set(r.key, r.type === "check" ? (v ? "1" : "0") : String(v));
					}
				for (const key of Object.keys(using))
					if (!using[key]) out.set("x" + key, "0");

			function fromParams(params) {
				for (const g of KNOBS)
					for (const r of g.rows) {
						const raw = params.get(r.key);
						if (raw === null) continue;
						if (r.type === "spline") {
							const points = splineFromText(raw);
							if (points) knobs[r.key] = points;
						} else if (r.type === "check") knobs[r.key] = raw !== "0";
						else if (r.type === "select")
							knobs[r.key] = r.options.includes(raw) ? raw : r.value;
						else if (r.type === "text") knobs[r.key] = raw;
						else {
							const n = Number(raw);
							// A hand-edited link can name anything, so a slider's
							// own ends are what the value is held inside.
							knobs[r.key] = Number.isFinite(n)
								? Math.min(r.high, Math.max(r.low, n))
								: r.value;
						}
					}
				for (const key of Object.keys(using))
					if (params.get("x" + key) === "0") using[key] = false;
			}

			/** Put the current draft in the address bar, without adding history. */
			function writeUrl() {
				const query = toParams().toString();
				history.replaceState(
					null,
					"",
					query ? `?${query}` : location.pathname,
				);
			}

			/**
			 * A knob's own ends, narrowed by the rest of the draft.
			 *
			 * **A slider that cannot be moved into a refusal beats a refusal
			 * that explains itself.** The world is the map, so an octave
			 * narrower than a map cell is ground the map cannot carry and the
			 * world would not build -- it is drawn here and nowhere else. Rather
			 * than let the slider reach that and then complain, the slider's own
			 * end moves: the octave count stops where the narrowest octave is
			 * still two cells wide. The warning stays as a backstop for a
			 * hand-edited link, which is the one way a value can arrive from
			 * outside the panel.
			 *
			 * The narrowing only ever moves an end inward.
			 */
			function liveRange(row) {
				if (row.key !== "octaves" && row.key !== "frequencyScale") return row;
				const k = derived();
				if (row.key === "frequencyScale") {
					// Even one octave has to be two map cells wide, and the fine
					// slider reaches 1, so the coarse one stops where their
					// product does. What is cut off is frequency the map could
					// not carry at any octave count.
					const most = k.radius / (2 * k.cellMetres);
					return {
						...row,
						high: Math.max(row.low, Math.min(row.high, Math.floor(most))),
					};
				}
				const widest = k.radius / Math.max(1e-6, k.frequency);
				const step = knobs.lacunarity;
				const room =
					1 + Math.floor(Math.log(widest / (2 * k.cellMetres)) / Math.log(step));
				return {
					...row,
					high: Math.max(row.low, Math.min(row.high, room)),
				};
			}

			/** Pull every knob inside its own narrowed ends, inward only. */
			function settle() {
				for (const g of KNOBS)
					for (const r of g.rows) {
						if (r.digits === undefined || r.type) continue;
						const live = liveRange(r);
						knobs[r.key] = Math.min(
							live.high,
							Math.max(live.low, knobs[r.key]),
						);
					}

			/** What a knob is worth right now, which is its neutral when it is off. */
			function value(key) {
				const row = rowOf(key);
				return using[key] === false ? row.off : knobs[key];

			const ROWS = new Map();
			for (const g of KNOBS) for (const r of g.rows) ROWS.set(r.key, r);
			function rowOf(key) {
				return ROWS.get(key);

			// ---------------------------------------------------------------
			// The field: one patch of the planet, in metres above sea level.
			// ---------------------------------------------------------------

			/** Directions spread evenly over the sphere, by the golden angle. */
			function sphereDirections(count) {
				const out = new Float64Array(count * 3);
				const golden = Math.PI * (3 - Math.sqrt(5));
				for (let n = 0; n < count; n++) {
					const z = 1 - (2 * n + 1) / count;
					const ring = Math.sqrt(Math.max(0, 1 - z * z));
					const around = n * golden;
					out[n * 3] = Math.cos(around) * ring;
					out[n * 3 + 1] = z;
					out[n * 3 + 2] = Math.sin(around) * ring;
				}
				return out;
			}
			const SPHERE = sphereDirections(SPHERE_SAMPLES);

			/** How many columns the histogram under a curve is drawn in. */
			const SPLINE_BINS = 48;

			/** What the knobs come to, in the units the engine states them in. */
			function derived() {
				const radius =
					(knobs.blockSize * 2 ** knobs.subdivisionDepth) / CELL_CONSTANT;
				// The map's level is chosen so its cell lands near the asked-for
				// spacing, then the cell is what that level actually gives.
				const level = Math.max(
					2,
					Math.min(
						knobs.subdivisionDepth,
						9,
						Math.max(
							0,
							Math.round(
								Math.log2((CELL_CONSTANT * radius) / knobs.coarseSpacing),
							),
						),
					),
				);
				const cellMetres = (CELL_CONSTANT * radius) / 2 ** level;
				return {
					radius,
					level,
					cellMetres,
					// **Frequency is stated as a frequency.** The sample point
					// is a unit direction, so this is how many times the widest
					// octave repeats across the planet -- 1 is one hump from
					// pole to pole, 40 is forty. A metre figure divided by the
					// radius reaches the same number, and it hides how small the
					// result gets: a scale of 29,400 m on a 6,801 m planet is a
					// frequency of 0.23, which is less than one whole feature
					// and is why so much of the ground came out muted. The
					// coarse slider carries the decade and the fine one picks
					// the value inside it.
					frequency: knobs.frequency * knobs.frequencyScale,
					warpFrequency: knobs.warpFrequency,
					octaves: value("octaves"),
					persistence: value("persistence"),
					lacunarity: knobs.lacunarity,
					ridge: value("ridge"),
					offsetX: value("offsetX"),
					offsetY: value("offsetY"),
					warpAmplitude: value("warpAmplitude"),
					stack: knobs.stack,
					normalise: knobs.octaveSum === "normalised",
					fit: knobs.metreScale === "fit",
					layers: knobs.layers,
					useContinent: knobs.useContinent,
					useMountain: knobs.useMountain,
					merge: knobs.merge,
					detail: knobs.detail,
					continentFrequency: knobs.continentFrequency,
					continentOctaves: knobs.continentOctaves,
					continentSpline: knobs.continentSpline,
					mountainFrequency: knobs.mountainFrequency,
					mountainOctaves: knobs.mountainOctaves,
					mountainSpline: knobs.mountainSpline,
				};
			}

			/** The three axes of the patch: out of the ground, east, and north. */
			function patchFrame(latitude, longitude) {
				const lat = (latitude * Math.PI) / 180;
				const lon = (longitude * Math.PI) / 180;
				const ring = Math.cos(lat);
				const up = [
					ring * Math.cos(lon),
					Math.sin(lat),
					ring * Math.sin(lon),
				];
				let east = [
					-Math.sin(lon),
					0,
					Math.cos(lon),
				];
				const north = [
					up[1] * east[2] - up[2] * east[1],
					up[2] * east[0] - up[0] * east[2],
					up[0] * east[1] - up[1] * east[0],
				];
				return { up, east, north };
			}

			let field = null;

			/** Generate the patch, and the sea level and scale it is measured on. */
			function generate(cells = knobs.cells) {
				const k = derived();
				const seed = seedFromString(knobs.seed);
				const s = settingsFor(k);

				// The whole sphere first, for the two numbers that must not
				// depend on where the patch is looking.
				const raw = new Float64Array(SPHERE_SAMPLES);
				// **Where the world actually lands on each curve.** Noise
				// clusters around its own middle, so equal widths of a curve
				// cover wildly unequal amounts of planet -- a small drag near
				// the middle repaints a fifth of the world and the same drag out
				// at the end reaches two percent of it. Counted over the sphere
				// rather than the patch, because the curve governs the planet.
				const tally = {
					continentSpline: new Float32Array(SPLINE_BINS),
					mountainSpline: new Float32Array(SPLINE_BINS),
				};
				const heard = [0.5, 1, 0, 0];
				const bin = (v) =>
					Math.max(
						0,
						Math.min(SPLINE_BINS - 1, Math.floor(((v + 1) / 2) * SPLINE_BINS)),
					);
				for (let n = 0; n < SPHERE_SAMPLES; n++) {
					raw[n] = fieldAt(
						SPHERE[n * 3],
						SPHERE[n * 3 + 1],
						SPHERE[n * 3 + 2],
						seed,
						k,
						s,
						heard,
					);
					if (k.layers) {
						tally.continentSpline[bin(heard[2])]++;
						tally.mountainSpline[bin(heard[3])]++;
					}
				}
				let tallest = 0;
				for (const counts of Object.values(tally))
					for (const v of counts) if (v > tallest) tallest = v;
				const sea = seaLevelFor(raw, value("landFraction"));
				let peak = 0;
				let trough = 0;
				for (const v of raw) {
					const d = v - sea;
					if (d > peak) peak = d;
					if (d < trough) trough = d;
				}
				// **Two ways to turn a unitless field into metres, and they are
				// what decides whether the octave sum above mattered.** `fit`
				// divides by the field's own peak, so the tallest mountain is
				// exactly Relief however the shape knobs are set -- and it
				// renormalises whatever the octave stack handed it, which makes
				// the divide up there redundant. `multiply` is the plain
				// reading, metres per unit of field, and under it every knob
				// that changes how far the field reaches changes how tall the
				// world is.
				const up = k.fit
					? peak > 0
						? value("relief") / peak
						: 0
					: value("relief");
				const down = k.fit
					? trough < 0
						? value("seaDepth") / -trough
						: 0
					: value("seaDepth");

				// Then the patch, laid out so a step across it is exactly one map
				// cell -- the same metres per cell the engine's own map has, which
				// is what makes the shape here the shape the world would build.
				const n = cells;
				const frame = patchFrame(knobs.latitude, knobs.longitude);
				const height = new Float32Array((n + 1) * (n + 1));
				// The unitless field as it fell, before sea level was taken off
				// it and before either scale turned it into metres. The Raw
				// picture and the graph's own x axis both read this.
				const field0 = new Float32Array((n + 1) * (n + 1));
				// What each control layer said here, so a picture can show one
				// layer on its own rather than only the ground they make
				// together.
				const contField = new Float32Array((n + 1) * (n + 1));
				const mountField = new Float32Array((n + 1) * (n + 1));
				const said = [0.5, 1];
				// A draft covers the same ground with fewer points, so the step
				// grows as the count falls and the patch keeps its width.
				const step = (knobs.cells / n) * k.cellMetres;
				const half = (n / 2) * step;
				let lowest = Infinity;
				let highest = -Infinity;
				let rawLow = Infinity;
				let rawHigh = -Infinity;
				let land = 0;
				for (let r = 0; r <= n; r++) {
					const dy = r * step - half;
					for (let q = 0; q <= n; q++) {
						const dx = q * step - half;
						// Metres out from the middle become radians of arc, so
						// the patch keeps its scale right out to the corners
						// rather than stretching the way a flat projection does.
						const u = dx / k.radius;
						const v = dy / k.radius;
						const a = Math.hypot(u, v);
						let x;
						let y;
						let z;
						if (a < 1e-12) {
							x = frame.up[0];
							y = frame.up[1];
							z = frame.up[2];
						} else {
							const c = Math.cos(a);
							const sn = Math.sin(a) / a;
							x = frame.up[0] * c + (frame.east[0] * u + frame.north[0] * v) * sn;
							y = frame.up[1] * c + (frame.east[1] * u + frame.north[1] * v) * sn;
							z = frame.up[2] * c + (frame.east[2] * u + frame.north[2] * v) * sn;
						}
						const len = Math.hypot(x, y, z);
						const unitless = fieldAt(
							x / len,
							y / len,
							z / len,
							seed,
							k,
							s,
							said,
						);
						const d = unitless - sea;
						const metres = d >= 0 ? d * up : d * down;
						height[r * (n + 1) + q] = metres;
						field0[r * (n + 1) + q] = unitless;
						contField[r * (n + 1) + q] = said[0];
						mountField[r * (n + 1) + q] = said[1];
						if (unitless < rawLow) rawLow = unitless;
						if (unitless > rawHigh) rawHigh = unitless;
						if (metres < lowest) lowest = metres;
						if (metres > highest) highest = metres;
						if (metres > 0) land++;
					}
				}
				field = {
					k,
					n,
					step,
					height,
					raw: field0,
					tally,
					tallest,
					continent: contField,
					mountain: mountField,
					// **The field never fills its own range.** A stack of
					// octaves divided by its summed amplitude is bounded by
					// [-1, 1] and reaches maybe half of it, so a Raw picture
					// drawn against the bounds is a flat grey wash. It is drawn
					// against what this patch actually holds instead, and the
					// axis says what that was.
					rawLow,
					rawHigh,
					sea,
					up,
					down,
					lowest,
					highest,
					landShare: land / ((n + 1) * (n + 1)),
					span: n * step,
					draft: n !== knobs.cells,
				};
			}

			/** Which of the four materials stands at a height. */
			function bandOf(metres) {
				if (metres <= 0) return 0;
				if (metres < GROUND_LINES.rock) return 1;
				if (metres < GROUND_LINES.snow) return 2;
				return 3;
			}

			// ---------------------------------------------------------------
			// The map, above the knobs.
			// ---------------------------------------------------------------

			const mapCanvas = document.getElementById("map");
			const mapCtx = mapCanvas.getContext("2d");

			function drawMap() {
				const n = field.n;
				if (mapCanvas.width !== n) {
					mapCanvas.width = n;
					mapCanvas.height = n;
				}
				const image = mapCtx.createImageData(n, n);
				const px = image.data;
				for (let r = 0; r < n; r++) {
					for (let q = 0; q < n; q++) {
						const metres = field.height[r * (n + 1) + q];
						const at = ((n - 1 - r) * n + q) * 4;
						if (
							knobs.picture === "continent" ||
							knobs.picture === "mountain"
						) {
							const v =
								(knobs.picture === "mountain"
									? field.mountain
									: field.continent)[r * (n + 1) + q];
							const t = Math.max(0, Math.min(1, v));
							px[at] = 255 * Math.pow(0.04 + 0.56 * t, 1 / 2.2);
							px[at + 1] = 255 * Math.pow(0.05 + 0.8 * t, 1 / 2.2);
							px[at + 2] = 255 * Math.pow(0.09 + 0.91 * t, 1 / 2.2);
							px[at + 3] = 255;
							continue;
						}
						if (knobs.picture !== "ground") {
							// Grey, and stopping at a different step of the
							// build: Height reads elevation everywhere rather
							// than naming a block, and Raw stops before sea
							// level has been taken off the field at all.
							const t =
								knobs.picture === "raw"
									? Math.max(
											0,
											Math.min(
												1,
												(field.raw[r * (n + 1) + q] - field.rawLow) /
													Math.max(1e-6, field.rawHigh - field.rawLow),
											),
										)
									: Math.max(0, Math.min(1, (metres + 400) / 800));
							const v = 255 * Math.pow(t, 1 / 2.2);
							px[at] = v;
							px[at + 1] = v;
							px[at + 2] = knobs.picture === "raw" ? v * 0.9 : v;
							px[at + 3] = 255;
							continue;
						}
						const band = BAND_COLORS[bandOf(metres)];
						// Land shades by how far it stands above the band it
						// started in, so a band is one material and still has
						// shape in it. Sea is the floor seen through water, so
						// it shades by how much water is over it -- which is
						// why a beach shows sand and a deep does not.
						const c = [0, 0, 0];
						let shade;
						if (metres <= 0) {
							const through = 1 - Math.exp(metres / SEA_CLARITY);
							for (let ch = 0; ch < 3; ch++)
								c[ch] = band[ch] + (SEA_COLOR[ch] - band[ch]) * through;
							shade = 1;
						} else {
							for (let ch = 0; ch < 3; ch++) c[ch] = band[ch];
							shade = 0.72 + 0.28 * Math.min(1, (metres % 100) / 100);
						}
						if (knobs.contours) {
							// A ring every hundred metres, on the same grid the
							// two material lines sit on.
							const into = ((metres % 100) + 100) % 100;
							if (into < 4) shade *= 0.6;
						}
						// The picture is written to a screen, so the linear block
						// colors are given the curve a screen expects.
						px[at] = 255 * Math.pow(Math.min(1, c[0] * shade), 1 / 2.2);
						px[at + 1] = 255 * Math.pow(Math.min(1, c[1] * shade), 1 / 2.2);
						px[at + 2] = 255 * Math.pow(Math.min(1, c[2] * shade), 1 / 2.2);
						px[at + 3] = 255;
					}
				}
				mapCtx.putImageData(image, 0, 0);
			}

			// ---------------------------------------------------------------
			// The graph: what a knob does to the shape of the ground, as a
			// curve rather than as a picture.
			// ---------------------------------------------------------------

			const graphCanvas = document.getElementById("graph");
			const graphCtx = graphCanvas.getContext("2d");
			const graphSays = document.getElementById("graphsays");

			/**
			 * Height against one other quantity, drawn from the patch itself.
			 *
			 * **Raw is the one that explains the metre knobs.** The generator
			 * produces a unitless field in `[-1, 1]`; sea level is a percentile
			 * cut through it, and land and sea are then scaled apart. Plotted
			 * against the raw value that whole step is two straight lines
			 * meeting at sea level, and every knob that moves them shows as a
			 * change of slope or a shift of the hinge -- Land slides the hinge
			 * along, Relief tilts the upper line, Sea depth tilts the lower one.
			 *
			 * **Distance** is the ground itself, a section straight across the
			 * middle of the patch, which is where ridges and octaves read.
			 * **Rank** sorts every cell by height, so the curve says what
			 * fraction of the patch stands below any elevation -- a flat middle
			 * is a world of plains, a straight climb is a world of slopes.
			 */
			function drawGraph() {
				// Drawn in a fixed logical box and scaled up to whatever the
				// canvas is, so the text keeps its size on screen rather than
				// shrinking with the panel.
				const scale = graphCanvas.width / 320;
				const width = 320;
				const height = graphCanvas.height / scale;
				const g0 = graphCtx;
				g0.setTransform(1, 0, 0, 1, 0, 0);
				g0.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
				g0.setTransform(scale, 0, 0, scale, 0, 0);
				const pad = { left: 40, right: 8, top: 10, bottom: 24 };
				const plotW = width - pad.left - pad.right;
				const plotH = height - pad.top - pad.bottom;
				const g = graphCtx;
				g.fillStyle = "#0b0e13";
				g.fillRect(0, 0, width, height);

				const n = field.n;
				const across = n + 1;
				// **Every line of the patch, over one another.** One section
				// says what one line of ground does; all of them together draw
				// the silhouette -- how high the whole patch stands, where its
				// ridges are, and how much of it sits at any height. Which way
				// the lines run does not matter, which is why the only choice
				// here is x or z.
				const alongX = knobs.graphX === "x";
				const xLow = 0;
				const xHigh = n * field.step;
				const xLabel = `${Math.round(xHigh).toLocaleString()} m across the patch, every line of it`;

				let yLow = Math.min(field.lowest, 0);
				let yHigh = Math.max(field.highest, 1);
				const room = (yHigh - yLow) * 0.06 || 1;
				yLow -= room;
				yHigh += room;
				const toX = (v) => pad.left + ((v - xLow) / (xHigh - xLow)) * plotW;
				const toY = (v) =>
					pad.top + plotH - ((v - yLow) / (yHigh - yLow)) * plotH;

				// Sea level and the two material lines, so a curve can be read
				// against the elevations that decide what the ground is made of.
				const marks = [
					[0, "#3b6ea8", "sea"],
					[GROUND_LINES.rock, "#5a5a62", "rock"],
					[GROUND_LINES.snow, "#8a8f98", "snow"],
				];
				g.font = "9.5px system-ui, sans-serif";
				for (const [metres, color, name] of marks) {
					if (metres < yLow || metres > yHigh) continue;
					const y = toY(metres);
					g.strokeStyle = color;
					g.setLineDash(metres === 0 ? [] : [3, 3]);
					g.beginPath();
					g.moveTo(pad.left, y);
					g.lineTo(width - pad.right, y);
					g.stroke();
					g.setLineDash([]);
					g.fillStyle = color;
					g.fillText(name, 4, y + 3);
				}

				// The axes, labelled in the units the knobs are stated in.
				g.strokeStyle = "#2b3542";
				g.beginPath();
				g.moveTo(pad.left, pad.top);
				g.lineTo(pad.left, pad.top + plotH);
				g.lineTo(width - pad.right, pad.top + plotH);
				g.stroke();
				g.fillStyle = "#8b95a4";
				g.fillText(`${Math.round(yHigh)} m`, 4, pad.top + 8);
				g.fillText(`${Math.round(yLow)} m`, 4, pad.top + plotH - 1);
				g.textAlign = "center";
				g.fillText(xLabel, pad.left + plotW / 2, height - 6);
				g.textAlign = "left";

				// Faint, and many: where the lines bunch is where most of the
				// ground stands, so the silhouette carries the distribution as
				// well as the shape.
				const stride = Math.max(1, Math.floor(across / 90));
				g.lineWidth = 0.4;
				g.strokeStyle = "rgba(111, 208, 255, 0.15)";
				for (let line = 0; line < across; line += stride) {
					g.beginPath();
					for (let at = 0; at <= n; at++) {
						const h = alongX
							? field.height[line * across + at]
							: field.height[at * across + line];
						const x = toX(at * field.step);
						const y = toY(h);
						if (at === 0) g.moveTo(x, y);
						else g.lineTo(x, y);
					}
					g.stroke();
				}
				// The middle line solid, so there is one section to read
				// against the elevations rather than only a mass.
				g.lineWidth = 1.1;
				g.strokeStyle = "#6fd0ff";
				g.beginPath();
				const mid = n >> 1;
				for (let at = 0; at <= n; at++) {
					const h = alongX
						? field.height[mid * across + at]
						: field.height[at * across + mid];
					const x = toX(at * field.step);
					const y = toY(h);
					if (at === 0) g.moveTo(x, y);
					else g.lineTo(x, y);
				}
				g.stroke();
				g.lineWidth = 1;

				const off = Object.keys(using).filter((k) => !using[k]);
				graphSays.textContent =
					`${Math.ceil(across / stride)} lines · ground ${Math.round(field.lowest)} to ${Math.round(field.highest)} m` +
					(off.length ? ` · ${off.length} knob${off.length > 1 ? "s" : ""} bypassed` : "");
			}

			// ---------------------------------------------------------------
			// The plane, which is the point of the demo.
			// ---------------------------------------------------------------

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in vec3 normal;
			layout(location = 2) in float metres;
			layout(location = 3) in float raw;
			layout(location = 4) in float layerValue;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out float vMetres;
			out float vRaw;
			out float vLayer;
			void main() {
				vNormal = normal;
				vMetres = metres;
				vRaw = raw;
				vLayer = layerValue;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in float vMetres;
			in float vRaw;
			in float vLayer;
			uniform vec3 sun;
			uniform float rockLine;
			uniform float snowLine;
			uniform float contours;
			uniform int picture;
			uniform int wire;
			uniform vec2 rawRange;
			out vec4 color;
			void main() {
				if (wire == 1) {
					color = vec4(0.42, 0.82, 1.0, 1.0);
					return;
				}
				// The grey pictures answer a different question from the bands:
				// they read elevation everywhere rather than saying which of the
				// four blocks stands there, and Raw stops before sea level has
				// been taken off the field at all.
				if (picture == 1) {
					float t = clamp((vMetres + 400.0) / 800.0, 0.0, 1.0);
					vec3 g = mix(vec3(0.03, 0.03, 0.04), vec3(1.0), t);
					vec3 n1 = normalize(vNormal);
					float l1 = 0.28 + 0.72 * max(0.0, dot(n1, normalize(sun)));
					color = vec4(pow(g * l1, vec3(1.0 / 2.2)), 1.0);
					return;
				}
				if (picture == 3) {
					// One control layer on its own, over its own full range:
					// dark where it says nothing, bright where it says most.
					vec3 g = mix(vec3(0.04, 0.05, 0.09), vec3(0.6, 0.85, 1.0), clamp(vLayer, 0.0, 1.0));
					vec3 n3 = normalize(vNormal);
					float l3 = 0.45 + 0.55 * max(0.0, dot(n3, normalize(sun)));
					color = vec4(pow(g * l3, vec3(1.0 / 2.2)), 1.0);
					return;
				}
				if (picture == 2) {
					float t = clamp(
						(vRaw - rawRange.x) / max(1e-6, rawRange.y - rawRange.x),
						0.0,
						1.0
					);
					vec3 g = mix(vec3(0.02, 0.04, 0.10), vec3(1.0, 0.98, 0.90), t);
					vec3 n2 = normalize(vNormal);
					float l2 = 0.35 + 0.65 * max(0.0, dot(n2, normalize(sun)));
					color = vec4(pow(g * l2, vec3(1.0 / 2.2)), 1.0);
					return;
				}
				vec3 tint;
				if (vMetres <= 0.0) {
					// Bare sand seen through water, because the ocean is a
					// surface and holds no blocks. What makes a deep blue is
					// how much water a look passes through to reach the floor.
					tint = mix(vec3(0.76, 0.70, 0.50), vec3(0.12, 0.32, 0.55),
						1.0 - exp(vMetres / 45.0));
				} else if (vMetres < rockLine) {
					tint = vec3(0.26, 0.44, 0.19);
				} else if (vMetres < snowLine) {
					tint = vec3(0.42, 0.42, 0.45);
				} else {
					tint = vec3(0.92, 0.94, 0.97);
				}
				if (contours > 0.5) {
					float into = fract(vMetres / 100.0) * 100.0;
					float edge = smoothstep(0.0, 3.0, into) * smoothstep(100.0, 97.0, into);
					tint *= mix(0.62, 1.0, edge);
				}
				vec3 n = normalize(vNormal);
				float lit = 0.28 + 0.72 * max(0.0, dot(n, normalize(sun)));
				color = vec4(pow(tint * lit, vec3(1.0 / 2.2)), 1.0);
			}`;

			function compile(kind, source) {
				const shader = gl.createShader(kind);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);
				if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
					throw new Error(gl.getShaderInfoLog(shader) ?? "shader");
				return shader;
			}
			const program = gl.createProgram();
			gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SOURCE));
			gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SOURCE));
			gl.linkProgram(program);
			if (!gl.getProgramParameter(program, gl.LINK_STATUS))
				throw new Error(gl.getProgramInfoLog(program) ?? "link");
			gl.useProgram(program);
			const uViewProj = gl.getUniformLocation(program, "viewProj");
			const uSun = gl.getUniformLocation(program, "sun");
			const uRock = gl.getUniformLocation(program, "rockLine");
			const uSnow = gl.getUniformLocation(program, "snowLine");
			const uContours = gl.getUniformLocation(program, "contours");
			const uPicture = gl.getUniformLocation(program, "picture");
			const uWire = gl.getUniformLocation(program, "wire");
			const uRawRange = gl.getUniformLocation(program, "rawRange");

			const vao = gl.createVertexArray();
			gl.bindVertexArray(vao);
			const positionBuffer = gl.createBuffer();
			const normalBuffer = gl.createBuffer();
			const metreBuffer = gl.createBuffer();
			const rawBuffer = gl.createBuffer();
			const layerBuffer = gl.createBuffer();
			const indexBuffer = gl.createBuffer();
			// WebGL has no polygon mode, so a wireframe is a second index list
			// over the same vertices -- one edge east and one north per point.
			const lineBuffer = gl.createBuffer();
			let indexCount = 0;
			let lineCount = 0;
			let meshCells = -1;

			gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
			gl.enableVertexAttribArray(0);
			gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
			gl.enableVertexAttribArray(1);
			gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, metreBuffer);
			gl.enableVertexAttribArray(2);
			gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, rawBuffer);
			gl.enableVertexAttribArray(3);
			gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, layerBuffer);
			gl.enableVertexAttribArray(4);
			gl.vertexAttribPointer(4, 1, gl.FLOAT, false, 0, 0);
			gl.enable(gl.DEPTH_TEST);
			gl.clearColor(0.027, 0.039, 0.055, 1);

			/**
			 * Lay the patch out as a plane.
			 *
			 * **A quad is one map cell.** The grid steps by the map's own metres
			 * per cell, so the ratio of how wide a cell is to how tall the ground
			 * gets is the engine's, and a ramp that reads as a hillside here reads
			 * as one in the world.
			 */
			function buildMesh() {
				const n = field.n;
				const across = n + 1;
				const count = across * across;
				const cell = field.step;
				const lift = knobs.exaggeration;
				const positions = new Float32Array(count * 3);
				const normals = new Float32Array(count * 3);
				const metres = new Float32Array(count);
				const raws = new Float32Array(count);
				const layerOf = new Float32Array(count);
				const shown =
					knobs.picture === "mountain" ? field.mountain : field.continent;
				const half = (n / 2) * cell;

				for (let r = 0; r <= n; r++) {
					for (let q = 0; q <= n; q++) {
						const at = r * across + q;
						const h = field.height[at];
						positions[at * 3] = q * cell - half;
						positions[at * 3 + 1] = h * lift;
						positions[at * 3 + 2] = r * cell - half;
						metres[at] = h;
						raws[at] = field.raw[at];
						layerOf[at] = shown[at];
					}
				}
				// A normal from the two neighbours each way, which is the slope
				// of the surface at that point rather than of one triangle.
				for (let r = 0; r <= n; r++) {
					for (let q = 0; q <= n; q++) {
						const at = r * across + q;
						const west = field.height[r * across + Math.max(0, q - 1)];
						const east = field.height[r * across + Math.min(n, q + 1)];
						const south = field.height[Math.max(0, r - 1) * across + q];
						const north = field.height[Math.min(n, r + 1) * across + q];
						const dx = ((east - west) * lift) / (2 * cell);
						const dz = ((north - south) * lift) / (2 * cell);
						const len = Math.hypot(dx, 1, dz);
						normals[at * 3] = -dx / len;
						normals[at * 3 + 1] = 1 / len;
						normals[at * 3 + 2] = -dz / len;
					}
				}

				gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, normals, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, metreBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, metres, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, rawBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, raws, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, layerBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, layerOf, gl.DYNAMIC_DRAW);

				// The index list only changes when the grid does.
				if (meshCells !== n) {
					const indices = new Uint32Array(n * n * 6);
					let at = 0;
					for (let r = 0; r < n; r++) {
						for (let q = 0; q < n; q++) {
							const a = r * across + q;
							indices[at++] = a;
							indices[at++] = a + across;
							indices[at++] = a + 1;
							indices[at++] = a + 1;
							indices[at++] = a + across;
							indices[at++] = a + across + 1;
						}
					}
					gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
					gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
					indexCount = indices.length;

					const lines = new Uint32Array(n * across * 4);
					let line = 0;
					for (let r = 0; r <= n; r++)
						for (let q = 0; q <= n; q++) {
							const a = r * across + q;
							if (q < n) {
								lines[line++] = a;
								lines[line++] = a + 1;
							}
							if (r < n) {
								lines[line++] = a;
								lines[line++] = a + across;
							}
						}
					gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineBuffer);
					gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, lines, gl.STATIC_DRAW);
					lineCount = line;
					meshCells = n;
				}
			}

			// ---- the camera ----
			const camera = { yaw: -0.7, pitch: 0.62, distance: 1.6, lift: 0 };

			function multiply(a, b) {
				const out = new Float32Array(16);
				for (let c = 0; c < 4; c++)
					for (let r = 0; r < 4; r++) {
						let s = 0;
						for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
						out[c * 4 + r] = s;
					}
				return out;
			}
			function perspective(fov, aspect, near, far) {
				const f = 1 / Math.tan(fov / 2);
				const out = new Float32Array(16);
				out[0] = f / aspect;
				out[5] = f;
				out[10] = (far + near) / (near - far);
				out[11] = -1;
				out[14] = (2 * far * near) / (near - far);
				return out;
			}
			function lookAt(eye, at, upHint) {
				const f = norm([at[0] - eye[0], at[1] - eye[1], at[2] - eye[2]]);
				const s = norm(cross(f, upHint));
				const u = cross(s, f);
				const out = new Float32Array(16);
				out[0] = s[0]; out[4] = s[1]; out[8] = s[2];
				out[1] = u[0]; out[5] = u[1]; out[9] = u[2];
				out[2] = -f[0]; out[6] = -f[1]; out[10] = -f[2];
				out[12] = -(s[0] * eye[0] + s[1] * eye[1] + s[2] * eye[2]);
				out[13] = -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]);
				out[14] = f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2];
				out[15] = 1;
				return out;
			}
			function cross(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],
				];
			}
			function norm(v) {
				const l = Math.hypot(v[0], v[1], v[2]) || 1;
				return [v[0] / l, v[1] / l, v[2] / l];
			}

			function render() {
				const dpr = Math.min(2, window.devicePixelRatio || 1);
				const width = Math.max(1, Math.round(view.clientWidth * dpr));
				const height = Math.max(1, Math.round(view.clientHeight * dpr));
				if (view.width !== width || view.height !== height) {
					view.width = width;
					view.height = height;
				}
				gl.viewport(0, 0, width, height);
				gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
				if (!field) return;

				const span = field.span;
				const away = span * camera.distance;
				const eye = [
					Math.sin(camera.yaw) * Math.cos(camera.pitch) * away,
					Math.sin(camera.pitch) * away + camera.lift * span,
					Math.cos(camera.yaw) * Math.cos(camera.pitch) * away,
				];
				const proj = perspective(
					0.9,
					width / height,
					span * 0.005,
					span * 12,
				);
				const viewMatrix = lookAt(eye, [0, 0, 0], [0, 1, 0]);
				gl.useProgram(program);
				gl.uniformMatrix4fv(uViewProj, false, multiply(proj, viewMatrix));
				gl.uniform3f(uSun, 0.42, 0.78, 0.46);
				gl.uniform1f(uRock, GROUND_LINES.rock);
				gl.uniform1f(uSnow, GROUND_LINES.snow);
				gl.uniform1f(uContours, knobs.contours ? 1 : 0);
				gl.uniform2f(uRawRange, field.rawLow, field.rawHigh);
				gl.uniform1i(
					uPicture,
					knobs.picture === "height"
						? 1
						: knobs.picture === "raw"
							? 2
							: knobs.picture === "continent" || knobs.picture === "mountain"
								? 3
								: 0,
				);
				gl.bindVertexArray(vao);
				if (knobs.surface !== "wire") {
					gl.uniform1i(uWire, 0);
					gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
					gl.drawElements(gl.TRIANGLES, indexCount, gl.UNSIGNED_INT, 0);
				}
				if (knobs.surface !== "solid") {
					// Over the solid surface the lines would fight the triangles
					// they sit on, so the depth test is loosened rather than the
					// geometry moved.
					gl.uniform1i(uWire, 1);
					if (knobs.surface === "both") gl.depthFunc(gl.LEQUAL);
					gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineBuffer);
					gl.drawElements(gl.LINES, lineCount, gl.UNSIGNED_INT, 0);
					gl.depthFunc(gl.LESS);
				}
			}

			// ---------------------------------------------------------------
			// The panel, and the loop that keeps it live.
			// ---------------------------------------------------------------

			const facts = document.getElementById("facts");
			const rows = new Map();

			/**
			 * A curve you drag, over one control field's range.
			 *
			 * Across is the raw control value, `-1` to `1`. Up is what it
			 * controls, `0` to `1`. Drag a point to move it, click the empty
			 * curve to add one, shift-click a point to take it away. The two
			 * ends keep their x so the curve always spans the whole range.
			 */
			function makeSpline(canvas, key, onChange) {
				const g = canvas.getContext("2d");
				const pad = 6;
				const toX = (v) => pad + ((v + 1) / 2) * (canvas.width - pad * 2);
				const toY = (v) => canvas.height - pad - v * (canvas.height - pad * 2);
				const fromX = (px) =>
					((px - pad) / (canvas.width - pad * 2)) * 2 - 1;
				const fromY = (py) =>
					(canvas.height - pad - py) / (canvas.height - pad * 2);

				function draw() {
					const points = knobs[key];
					g.clearRect(0, 0, canvas.width, canvas.height);
					g.fillStyle = "#0b0e13";
					g.fillRect(0, 0, canvas.width, canvas.height);
					// A line at the middle of the control's range, because that
					// is where half the world sits and it is the only landmark
					// on an otherwise featureless box.
					// The world's own distribution, behind everything: how much
					// planet sits under each slice of this curve. Dim, because
					// it is context for the curve rather than the thing being
					// edited.
					const counts = field && field.tally ? field.tally[key] : null;
					if (counts && field.tallest > 0) {
						g.fillStyle = "rgba(111, 208, 255, 0.16)";
						const wide = (canvas.width - pad * 2) / SPLINE_BINS;
						for (let n = 0; n < SPLINE_BINS; n++) {
							const tall =
								(counts[n] / field.tallest) * (canvas.height - pad * 2);
							if (tall <= 0) continue;
							g.fillRect(
								pad + n * wide,
								canvas.height - pad - tall,
								Math.max(1, wide - 0.5),
								tall,
							);
						}
					}
					g.strokeStyle = "#232b36";
					g.beginPath();
					g.moveTo(toX(0), pad);
					g.lineTo(toX(0), canvas.height - pad);
					g.stroke();
					g.strokeStyle = "#6fd0ff";
					g.lineWidth = 1.5;
					g.beginPath();
					for (let px = pad; px <= canvas.width - pad; px++) {
						const y = toY(splineAt(points, fromX(px)));
						if (px === pad) g.moveTo(px, y);
						else g.lineTo(px, y);
					}
					g.stroke();
					g.fillStyle = "#e8ecf2";
					for (const [x, y] of points) {
						g.beginPath();
						g.arc(toX(x), toY(y), 3, 0, Math.PI * 2);
						g.fill();
					}
				}

				let dragging = -1;
				const spot = (e) => {
					const box = canvas.getBoundingClientRect();
					return [
						((e.clientX - box.left) / box.width) * canvas.width,
						((e.clientY - box.top) / box.height) * canvas.height,
					];
				};
				const nearest = (px, py) => {
					const points = knobs[key];
					let best = -1;
					let far = 12;
					for (let n = 0; n < points.length; n++) {
						const d = Math.hypot(toX(points[n][0]) - px, toY(points[n][1]) - py);
						if (d < far) {
							far = d;
							best = n;
						}
					}
					return best;
				};
				canvas.addEventListener("pointerdown", (e) => {
					e.preventDefault();
					const [px, py] = spot(e);
					const at = nearest(px, py);
					const points = knobs[key];
					if (at >= 0 && e.shiftKey) {
						// Never below two, or the curve stops being a curve.
						if (points.length > 2 && at > 0 && at < points.length - 1) {
							points.splice(at, 1);
							draw();
							onChange();
						}
						return;
					}
					if (at >= 0) {
						dragging = at;
					} else {
						const x = Math.max(-1, Math.min(1, fromX(px)));
						const y = Math.max(0, Math.min(1, fromY(py)));
						points.push([x, y]);
						points.sort((a, b) => a[0] - b[0]);
						dragging = points.findIndex((p) => p[0] === x && p[1] === y);
						draw();
						onChange();
					}
					canvas.setPointerCapture(e.pointerId);
				});
				canvas.addEventListener("pointermove", (e) => {
					if (dragging < 0) return;
					const points = knobs[key];
					const [px, py] = spot(e);
					const first = dragging === 0;
					const last = dragging === points.length - 1;
					// The ends hold their x, so the curve always covers the whole
					// range and nothing has to guess what happens past it.
					if (!first && !last)
						points[dragging][0] = Math.max(
							points[dragging - 1][0] + 0.01,
							Math.min(points[dragging + 1][0] - 0.01, fromX(px)),
						);
					points[dragging][1] = Math.max(0, Math.min(1, fromY(py)));
					draw();
					onChange();
				});
				const drop = () => {
					dragging = -1;
				};
				canvas.addEventListener("pointerup", drop);
				canvas.addEventListener("pointercancel", drop);
				return draw;
			}

			function buildPanel() {
				const host = document.getElementById("knobs");
				for (const group of KNOBS) {
					const set = document.createElement("fieldset");
					const legend = document.createElement("legend");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						const wrap = document.createElement("div");
						wrap.className = "knob" + (row.type === "check" ? " check" : "");
						const label = document.createElement("label");
						label.textContent = row.label;
						let input;
						if (row.type === "spline") {
							input = document.createElement("canvas");
							input.width = 280;
							input.height = 84;
							input.className = "curve";
						} else if (row.type === "select") {
							input = document.createElement("select");
							for (const option of row.options) {
								const o = document.createElement("option");
								o.value = option;
								o.textContent = option;
								input.append(o);
							}
							input.value = knobs[row.key];
						} else if (row.type === "text") {
							input = document.createElement("input");
							input.type = "text";
							input.value = knobs[row.key];
						} else if (row.type === "check") {
							input = document.createElement("input");
							input.type = "checkbox";
							input.checked = knobs[row.key];
						} else {
							input = document.createElement("input");
							input.type = "range";
							input.min = row.low;
							input.max = row.high;
							input.step = row.step;
							input.value = knobs[row.key];
						}
						if (row.type === "spline") {
							wrap.classList.add("curved");
							wrap.append(label, input);
							set.append(wrap);
							const redraw = makeSpline(input, row.key, () =>
								askForRedraw(),
							);
							rows.set(row.key, { row, wrap, input, redraw });
							continue;
						}
						const readout = document.createElement("output");
						// A switch, where the knob has a value that removes its
						// own effect. Unticked, the knob is set to that value and
						// its slider greys: what is left on screen is the ground
						// this knob is not contributing to, which is the only way
						// to see what it was contributing.
						let bypass = null;
						if (row.off !== undefined) {
							bypass = document.createElement("input");
							bypass.type = "checkbox";
							bypass.checked = using[row.key] !== false;
							input.disabled = !bypass.checked;
							bypass.title = `off sets ${row.label} to ${row.off}`;
							bypass.addEventListener("input", () => {
								using[row.key] = bypass.checked;
								input.disabled = !bypass.checked;
								askForRedraw();
							});
						}
						if (row.type === "check") wrap.append(input, label);
						else if (bypass) {
							wrap.classList.add("switched");
							wrap.append(bypass, label, readout, input);
						} else wrap.append(label, readout, input);
						set.append(wrap);
						rows.set(row.key, { row, wrap, input, readout, bypass });
						// **Every move redraws.** `input` rather than `change`, so
						// the ground answers while the slider is still moving --
						// which is the only way to feel what a knob does.
						input.addEventListener("input", () => {
							if (row.type === "check") knobs[row.key] = input.checked;
							else if (row.type === "select" || row.type === "text")
								knobs[row.key] = input.value;
							else knobs[row.key] = Number(input.value);
							askForRedraw();
						});
					}
					host.append(set);
				}
			}

			/** Show a knob only where it means something, rather than greying it. */
			function refreshPanel() {
				for (const { row, wrap, readout, input, redraw } of rows.values()) {
					const shown = row.shownWhen ? row.shownWhen(knobs) : true;
					wrap.classList.toggle("hidden", !shown);
					if (row.type === "spline") {
						if (shown && redraw) redraw();
						continue;
					}
					// **A widget must show what the knob holds.** Anything that
					// changes a knob without going through its own input -- a
					// link, a settle, another knob's narrowing -- leaves the
					// panel describing a world that is not on screen.
					if (row.type === "select" || row.type === "text") {
						if (input.value !== String(knobs[row.key]))
							input.value = knobs[row.key];
					} else if (row.type === "check") {
						if (input.checked !== !!knobs[row.key])
							input.checked = !!knobs[row.key];
					}
					if (row.digits !== undefined && !row.type) {
						const live = liveRange(row);
						if (Number(input.min) !== live.low) input.min = live.low;
						if (Number(input.max) !== live.high) input.max = live.high;
						if (Number(input.value) !== knobs[row.key])
							input.value = knobs[row.key];
					}
					if (row.digits !== undefined) {
						let text =
							Number(knobs[row.key]).toFixed(row.digits) +
							(row.unit ? " " + row.unit : "");
						// **Say when a knob did not get what it asked for.** The
						// map's fineness is a level, so its cell is the planet
						// halved a whole number of times and stops at level 9:
						// below that the slider moves and the map does not.
						if (
							row.key === "coarseSpacing" &&
							Math.abs(field.k.cellMetres - knobs.coarseSpacing) >= 1
						)
							text += ` → ${field.k.cellMetres.toFixed(0)} m`;
						readout.textContent = text;
					} else readout.textContent = "";
				}
				const k = field.k;
				facts.innerHTML =
					`radius <b>${Math.round(k.radius).toLocaleString()} m</b> · ` +
					`map level <b>${k.level}</b> · cell <b>${k.cellMetres.toFixed(1)} m</b><br>` +
					`patch <b>${Math.round(field.span).toLocaleString()} m</b> across, ` +
					`${field.n}×${field.n} cells<br>` +
					`ground <b>${Math.round(field.lowest)}</b> to ` +
					`<b>${Math.round(field.highest)} m</b> · ` +
					`land here <b>${Math.round(field.landShare * 100)}%</b><br>` +
					`redrawn in <b>${cost.toFixed(0)} ms</b>` +
					(field.draft ? " · settling" : "") +
					"<br>" +
					(knobs.exaggeration === 1
						? `true scale · relief is <b>${(
								(100 * (field.highest - field.lowest)) /
								field.span
							).toFixed(1)}%</b> of the patch<br>`
						: `<span style="color:#ffb454">drawn <b>${knobs.exaggeration}x</b> taller than the world builds it</span><br>`) +
					// **The field and the metres are two different things, and
					// only one of them is noise.** Relief is what turns the
					// unitless field into metres of land and Sea depth does the
					// same for the floor, so at zero there is a perfectly good
					// field and no ground -- which reads as "noise but no
					// height" and looks like a broken generator. Say which knob
					// it is.
					(value("relief") === 0 || value("seaDepth") === 0
						? `<span style="color:#ffb454">` +
							(value("relief") === 0 && value("seaDepth") === 0
								? "Relief and Sea depth are both <b>0</b>, so the field has no metres at all"
								: value("relief") === 0
									? "Relief is <b>0</b>, so land has no height"
									: "Sea depth is <b>0</b>, so the floor is flat") +
							" — the noise is there, the scale that turns it into metres is not." +
							"</span><br>"
						: "") +
					// **Which of the two is carrying the height.** Under `fit`
					// the octave sum is renormalised downstream and the choice
					// up there reaches nothing; under `multiply` it decides the
					// whole vertical scale. Saying so is the only way the pair
					// reads as one decision rather than two switches.
					(knobs.metreScale === "fit"
						? `metres <b>fit</b> — the tallest point is Relief exactly, so the octave sum above changes nothing here<br>`
						: `metres <b>multiplied</b> — Relief is metres per unit of field, so octaves, persistence and ridge all move the height<br>`) +
					// Frequency in the units the engine's panel states, so a
					// setting found here can be carried across: the engine asks
					// for the widest feature in metres, which is the radius
					// divided by the frequency.
					`frequency <b>${k.frequency.toFixed(2)}</b> — the engine's ` +
					`Noise scale <b>${Math.round(
						k.radius / Math.max(1e-6, k.frequency),
					).toLocaleString()} m</b><br>` +
					`narrowest octave <b>${Math.round(
						k.radius /
							Math.max(1e-6, k.frequency) /
							knobs.lacunarity **
								(value("octaves") - 1),
					).toLocaleString()} m</b>` +
					(k.radius /
						Math.max(1e-6, k.frequency) /
						knobs.lacunarity **
							(value("octaves") - 1) <
					k.cellMetres
						? ' <span style="color:#ffb454">narrower than a cell</span>'
						: "");
			}

			/**
			 * Redraw, coarsely while a knob is moving and exactly once it stops.
			 *
			 * **A slider has to answer inside a frame or it cannot be felt.**
			 * The whole chain at full resolution is a few tens of milliseconds
			 * for the smooth bases and a few hundred for cellular, which reads
			 * as lag rather than as ground. So a move draws half the points --
			 * the same patch, sampled every other cell, which is a quarter of
			 * the work -- and a pause of a fifth of a second draws all of them.
			 * The draft is the same field, never a different one: the sea level
			 * and the metre scale are read off the sphere either way, so the
			 * coastline does not walk while the slider does.
			 */
			let pending = false;
			let settleTimer = 0;
			let cost = 0;
			function askForRedraw(draft = true) {
				clearTimeout(settleTimer);
				if (draft) settleTimer = setTimeout(() => askForRedraw(false), 200);
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					settle();
					generate(draft ? Math.max(24, knobs.cells >> 1) : knobs.cells);
					buildMesh();
					drawMap();
					drawGraph();
					cost = performance.now() - started;
					refreshPanel();
					if (!draft) writeUrl();
					render();
				});
			}

			// ---- turning and zooming ----
			let dragging = null;
			view.addEventListener("pointerdown", (e) => {
				dragging = { x: e.clientX, y: e.clientY, shift: e.shiftKey };
				view.setPointerCapture(e.pointerId);
			});
			view.addEventListener("pointermove", (e) => {
				if (!dragging) return;
				const dx = e.clientX - dragging.x;
				const dy = e.clientY - dragging.y;
				dragging.x = e.clientX;
				dragging.y = e.clientY;
				if (dragging.shift) camera.lift += dy * 0.002;
				else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(
						0.03,
						Math.min(1.5, camera.pitch + dy * 0.005),
					);
				}
				render();
			});
			const stop = () => {
				dragging = null;
			};
			view.addEventListener("pointerup", stop);
			view.addEventListener("pointercancel", stop);
			view.addEventListener(
				"wheel",
				(e) => {
					e.preventDefault();
					camera.distance = Math.max(
						0.15,
						Math.min(6, camera.distance * Math.exp(e.deltaY * 0.001)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", render);

			fromParams(new URLSearchParams(location.search));
			buildPanel();
			// The first draw goes through the same timed path every later one
			// does, so the cost on screen is a real number from the start.
			const booted = performance.now();
			settle();
			generate();
			buildMesh();
			drawMap();
			drawGraph();
			cost = performance.now() - booted;
			refreshPanel();
			render();
		</script>
	</body>
</html>
