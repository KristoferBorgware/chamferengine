<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Noise lab — a patch of the planet, and the knobs that shape it</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #e8ecf2;
				--dim: #8b95a4;
				--panel: #12161d;
				--edge: #232b36;
				--live: #6fd0ff;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #070a0e;
				color: var(--ink);
				font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			#view {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				touch-action: none;
				cursor: grab;
			}
			#view:active {
				cursor: grabbing;
			}
			/* **The picture is the reference; the knobs are the work.** Scrolling
			   to reach a knob used to carry the map off the top of the panel,
			   so the thing being judged left the screen exactly when it was
			   being changed. Two sections, and only the lower one moves. */
			#panel {
				position: fixed;
				top: 0;
				right: 0;
				bottom: 0;
				width: 320px;
				display: flex;
				flex-direction: column;
				background: rgba(18, 22, 29, 0.94);
				border-left: 1px solid var(--edge);
				backdrop-filter: blur(6px);
			}
			#head {
				flex: 0 0 auto;
				padding: 10px 14px 6px;
				border-bottom: 1px solid var(--edge);
			}
			#scroller {
				flex: 1 1 auto;
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: 0 14px 24px;
			}
			#panel h1 {
				font-size: 14px;
				margin: 0 0 2px;
				letter-spacing: 0.01em;
			}
			#panel p.blurb {
				margin: 0 0 10px;
				color: var(--dim);
				font-size: 11.5px;
			}
			#map {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 4px;
				image-rendering: pixelated;
				background: #0b0e13;
			}
			#profile {
				margin-top: 12px;
				border-top: 1px solid var(--edge);
				padding-top: 8px;
			}
			#profile > summary {
				cursor: pointer;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				list-style: none;
			}
			#profile > summary::before {
				content: "▾ ";
			}
			#profile:not([open]) > summary::before {
				content: "▸ ";
			}
			#graph {
				width: 100%;
				height: auto;
				display: block;
				margin-top: 8px;
				border: 1px solid var(--edge);
				border-radius: 4px;
				background: #0b0e13;
			}
			#graphsays {
				color: var(--dim);
				font-size: 10.5px;
				margin: 3px 0 0;
			}
			#legend {
				display: flex;
				gap: 2px;
				margin: 6px 0 4px;
				font-size: 10px;
				color: var(--dim);
			}
			#legend span {
				flex: 1;
				text-align: center;
				padding: 2px 0;
				border-radius: 2px;
				color: #0b0e13;
				font-weight: 600;
			}
			#facts {
				color: var(--dim);
				font-size: 11px;
				margin: 4px 0 2px;
			}
			#facts b {
				color: var(--ink);
				font-weight: 600;
			}
			.group {
				border-top: 1px solid var(--edge);
				margin: 10px 0 0;
				padding: 0 0 6px;
			}
			.group > summary {
				padding: 8px 0 4px;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				cursor: pointer;
				list-style: none;
				user-select: none;
			}
			.group > summary::-webkit-details-marker {
				display: none;
			}
			.group > summary::before {
				content: "▸ ";
				color: var(--edge);
			}
			.group[open] > summary::before {
				content: "▾ ";
			}
			.group > summary:hover {
				color: var(--live);
			}
			.knob {
				display: grid;
				grid-template-columns: 1fr auto;
				align-items: center;
				gap: 2px 8px;
				margin: 7px 0;
			}
			.knob label {
				font-size: 12px;
			}
			.knob output {
				font-variant-numeric: tabular-nums;
				color: var(--live);
				font-size: 11.5px;
			}
			.knob.off {
				opacity: 0.42;
			}
			.knob.off .curve {
				pointer-events: none;
			}
			.knob-note {
				grid-column: 1 / -1;
				font-size: 10.5px;
				color: var(--dim);
				margin: 1px 0 0;
			}
			.knob-note b {
				color: var(--live);
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			.knob input[type="range"],
			.knob select,
			.knob input[type="text"] {
				grid-column: 1 / -1;
				width: 100%;
				accent-color: var(--live);
			}
			.knob select,
			.knob input[type="text"] {
				background: #0b0e13;
				color: var(--ink);
				border: 1px solid var(--edge);
				border-radius: 3px;
				padding: 3px 5px;
				font: inherit;
			}
			.knob.switched {
				grid-template-columns: auto 1fr auto;
			}
			.knob.switched > input[type="checkbox"] {
				grid-column: auto;
				width: auto;
				margin: 0;
			}
			.knob input:disabled {
				opacity: 0.35;
			}
			.knob.curved {
				grid-template-columns: 1fr;
			}
			.curve {
				width: 100%;
				height: auto;
				display: block;
				border: 1px solid var(--edge);
				border-radius: 3px;
				touch-action: none;
				cursor: crosshair;
			}
			.curve-help {
				font-size: 10px;
				color: var(--dim);
				margin: 2px 0 0;
				line-height: 1.35;
			}
			.knob.check {
				grid-template-columns: auto 1fr;
			}
			.knob.check input {
				grid-column: auto;
				width: auto;
			}
			.hidden {
				display: none;
			}
			#hint {
				position: fixed;
				left: 12px;
				bottom: 10px;
				color: var(--dim);
				font-size: 11.5px;
				pointer-events: none;
			}
			@media (max-width: 720px) {
				#panel {
					width: 100%;
					top: auto;
					height: 52%;
					border-left: 0;
					border-top: 1px solid var(--edge);
				}
				#hint {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<canvas id="view"></canvas>
		<div id="hint">drag to turn · wheel to zoom · shift-drag to raise the eye</div>
		<div id="panel">
			<div id="head">
				<h1>Noise lab</h1>
				<canvas id="map" width="192" height="192"></canvas>
				<div id="legend">
					<span style="background: #2c5f96">sea over sand</span>
					<span style="background: #6b9553">grass</span>
					<span style="background: #a3a3ac">rock</span>
					<span style="background: #f3f6fa">snow</span>
				</div>
				<div id="facts"></div>
			</div>
			<div id="scroller">
				<div id="knobs"></div>
				<details id="profile" open>
					<summary>Contour</summary>
					<canvas id="graph" width="640" height="300"></canvas>
					<div id="graphsays"></div>
				</details>
			</div>
		</div>

		<script>
			"use strict";

			// ===== BEGIN engine noise kernel =====
			// A hand port of packages/engine/src/generation/noise and the height
			// chain above it. A demo here carries no imports and no build step,
			// so this is a copy -- and a copy that has drifted from the engine is
			// a lab that teaches the wrong lesson, which is why
			// packages/engine/tests/demos/noiseLab.test.ts digests this block
			// against the real functions over every basis.

			/** `2^32`, the divisor that turns a `uint32` into a fraction of one. */
			const U32 = 4294967296;

			/** Three integer coordinates and a seed, mixed into `[0, 1)`. */
			function hash3(x, y, z, seed) {
				let h =
					(Math.imul(x | 0, 374761393) +
						Math.imul(y | 0, 668265263) +
						Math.imul(z | 0, 1274126177) +
						Math.imul(seed | 0, 1013904223)) >>>
					0;
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				h = (h ^ (h >>> 16)) >>> 0;
				return h / U32;
			}

			/** A seed someone typed, reduced to the `uint32` the hash takes. */
			function seedFromString(text) {
				let h = 2166136261 >>> 0;
				for (let i = 0; i < text.length; i++) {
					h = (h ^ text.charCodeAt(i)) >>> 0;
					h = Math.imul(h, 16777619) >>> 0;
				}
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				return (h ^ (h >>> 16)) >>> 0;
			}

			/**
			 * The quintic curve, `6t^5 - 15t^4 + 10t^3`.
			 *
			 * Zero in the first and second derivative at both ends, so a normal
			 * has no crease where one lattice cell meets the next. Smoothstep is
			 * flat in the first derivative only and leaves a curvature jump at
			 * every lattice plane, which shading draws as a grid.
			 */
			function fade(t) {
				return t * t * t * (t * (t * 6 - 15) + 10);
			}

			/** Trilinear value noise, in `[-1, 1]`. */
			function valueNoise3(px, py, pz, seed) {
				const xi = Math.floor(px);
				const yi = Math.floor(py);
				const zi = Math.floor(pz);
				const u = fade(px - xi);
				const v = fade(py - yi);
				const w = fade(pz - zi);
				let s = 0;
				for (let c = 0; c < 8; c++) {
					const dx = c & 1;
					const dy = (c >> 1) & 1;
					const dz = (c >> 2) & 1;
					const wx = dx ? u : 1 - u;
					const wy = dy ? v : 1 - v;
					const wz = dz ? w : 1 - w;
					s += wx * wy * wz * hash3(xi + dx, yi + dy, zi + dz, seed);
				}
				return s * 2 - 1;
			}

			const OCTAVE_SPREAD = 1000;
			const RIDGE_GAIN = 2.2;

			/**
			 * Octaves of value noise with the panel's own parameters, in
			 * `[-1, 1]`.
			 *
			 * Every octave gets its own hashed offset, or two octaves of one
			 * seeded lattice share zero crossings wherever their frequencies land
			 * near a whole multiple and the ground grows a repeating grain.
			 * Octaves accumulate low frequency first, because floating-point
			 * addition is not associative -- the other order moves the result by
			 * `1.4e-17` at four and five octaves and by nothing at six and
			 * eight, which is the kind of error testing never finds. And the sum
			 * is divided by the total amplitude, so adding an octave adds detail
			 * without making the world taller.
			 *
			 * **`ridge` is in the engine and is not on this panel.** It folds
			 * each octave at its own zero crossing, which creases a whole world
			 * at once -- it moves the character of every place together, and
			 * what a second layer exists for is to make places differ. Both
			 * layers pass zero. The parameter stays because this block is the
			 * engine's function and a copy that has dropped an argument is a
			 * copy that has drifted.
			 */
			function octaveNoise(x, y, z, seed, s) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = s.frequency;
				let weight = 1;
				const ridge = s.ridge;
				for (let o = 0; o < s.octaves; o++) {
					const ox =
						(2 * hash3(o, 0, 0, seed) - 1) * OCTAVE_SPREAD + s.offsetX;
					const oy =
						(2 * hash3(o, 1, 0, seed) - 1) * OCTAVE_SPREAD + s.offsetY;
					const oz = (2 * hash3(o, 2, 0, seed) - 1) * OCTAVE_SPREAD;
					const n = valueNoise3(x * f + ox, y * f + oy, z * f + oz, seed);
					let signal = n;
					if (ridge > 0) {
						const fold = 1 - Math.abs(n);
						const crease = fold * fold;
						signal = n * (1 - ridge) + (crease * 2 - 1) * ridge;
						signal *= weight;
						weight = Math.min(
							1,
							Math.max(0, 1 - ridge + ridge * crease * RIDGE_GAIN),
						);
					}
					sum += amplitude * signal;
					total += amplitude;
					amplitude *= s.persistence;
					f *= s.lacunarity;
				}
				if (s.normalise === false) return sum;
				return total > 0 ? sum / total : 0;
			}

			/**
			 * The settings for one noise layer, read off that layer's own rows.
			 *
			 * **Every layer is a whole noise stack, not a frequency.** A layer
			 * that shared the octave count and the falloff with its neighbour
			 * could only ever say the same thing at a different size, and the
			 * reason there are layers at all is to say different things: broad
			 * smooth ground under one curve, narrow steep ranges under another.
			 */
			function layerSettings(k, which) {
				return {
					frequency: k[which + "Frequency"],
					octaves: k[which + "Octaves"],
					persistence: k[which + "Persistence"],
					lacunarity: k[which + "Lacunarity"],
					offsetX: k[which + "OffsetX"],
					offsetY: k[which + "OffsetY"],
					// **The stack is always the octave stack, always summed low
					// first, and always divided by the summed amplitude.** Both
					// of the other readings were on the panel as choices and
					// neither one changed a world under `fit`, which renormalises
					// whatever it is handed.
					ridge: 0,
					normalise: true,
				};
			}

			/** Build the settings object for each of the two layers. */
			function settingsFor(k) {
				return {
					terrain: layerSettings(k, "terrain"),
					mountain: layerSettings(k, "mountain"),
				};
			}

			/**
			 * The height that leaves `landFraction` of the surface above it.
			 *
			 * Rounded to a value `float32` holds exactly, because the engine's
			 * map is stored that way and "is this cell land" is asked of the
			 * stored height.
			 */
			function seaLevelFor(height, landFraction) {
				const sorted = Float64Array.from(height).sort();
				const at = Math.floor(sorted.length * (1 - landFraction));
				return Math.fround(sorted[Math.min(at, sorted.length - 1)]);
			}
			// ===== END engine noise kernel =====

			// ===== BEGIN engine coarse grid =====
			// A hand port of packages/engine/src/addressing and of the coarse
			// map's erosion pass. Same reason the noise above is a copy: a demo
			// here carries no imports and no build step, and
			// packages/engine/tests/demos/noiseLab.test.ts runs this block
			// against the real classes, so a copy that has drifted fails a test
			// rather than teaching a world the engine does not build.

			/** The golden ratio, which is what puts the twelve vertices where they are. */
			const PHI = (1 + Math.sqrt(5)) / 2;

			/** Three components divided by their own length. */
			function normalize3(v) {
				const l = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
				return [v[0] / l, v[1] / l, v[2] / l];
			}

			/**
			 * The twelve icosahedron vertices, as unit directions.
			 *
			 * A cell sits on a vertex of the subdivided icosahedron, so these
			 * twelve are the twelve pentagons at every depth and in every world.
			 * The order is fixed: vertices 0 and 3 carry the coordinate poles and
			 * vertex 11 carries the prime meridian.
			 */
			const VERTICES = [
				[-1, PHI, 0],
				[1, PHI, 0],
				[-1, -PHI, 0],
				[1, -PHI, 0],
				[0, -1, PHI],
				[0, 1, PHI],
				[0, -1, -PHI],
				[0, 1, -PHI],
				[PHI, 0, -1],
				[PHI, 0, 1],
				[-PHI, 0, -1],
				[-PHI, 0, 1],
			].map(normalize3);

			/**
			 * The twenty faces, each three indices into the vertex table.
			 *
			 * Every triple runs counter-clockwise seen from outside the sphere,
			 * so a direction table written in one face's frame means the same
			 * turn on all twenty.
			 */
			const FACES = [
				[0, 11, 5],
				[0, 5, 1],
				[0, 1, 7],
				[0, 7, 10],
				[0, 10, 11],
				[1, 5, 9],
				[5, 11, 4],
				[11, 10, 2],
				[10, 7, 6],
				[7, 1, 8],
				[3, 9, 4],
				[3, 4, 2],
				[3, 2, 6],
				[3, 6, 8],
				[3, 8, 9],
				[4, 9, 5],
				[2, 4, 11],
				[6, 2, 10],
				[8, 6, 7],
				[9, 8, 1],
			];

			/**
			 * The direction of each face's centroid.
			 *
			 * The perpendicular bisector between two adjacent centroids contains
			 * the edge those faces share, so the nearest centroid to a direction
			 * names the face that direction falls in, exactly.
			 */
			const FACE_CENTROIDS = FACES.map(([a, b, c]) =>
				normalize3([
					VERTICES[a][0] + VERTICES[b][0] + VERTICES[c][0],
					VERTICES[a][1] + VERTICES[b][1] + VERTICES[c][1],
					VERTICES[a][2] + VERTICES[b][2] + VERTICES[c][2],
				]),
			);

			/**
			 * The six lattice steps, counter-clockwise seen from outside.
			 *
			 * Index 0 is the step from the face's vertex `A` toward `B`, the
			 * offset `(+1, 0)`. That anchor is a property of the cell's own face,
			 * so it never depends on how the cell was reached.
			 */
			const DIRECTIONS = [
				[1, 0],
				[0, 1],
				[-1, 1],
				[-1, 0],
				[0, -1],
				[1, -1],
			];

			/** How many lattice points a triangle of side `m` holds. */
			function chunkSlots(m) {
				return ((m + 1) * (m + 2)) / 2;
			}

			/**
			 * The slot `(q, r)` occupies, laid out row after row.
			 *
			 * Row `r` starts after the rows above it and holds `m + 1 - r`
			 * points, which sums to this and is a bijection onto
			 * `0 .. (m+1)(m+2)/2 - 1`.
			 */
			function rank(q, r, m) {
				return q + (r * (2 * m + 3 - r)) / 2;
			}

			/**
			 * The barycentric weights of a lattice point on its face's vertices.
			 *
			 * Written this way a lattice point is a set of integer weights
			 * attached to global vertex numbers, and that description never
			 * mentions a face.
			 */
			function latticeWeights(n, i, j) {
				return [n - i - j, i, j];
			}

			/**
			 * The direction of lattice point `(i, j)` on `face`, at `n = 2^level`.
			 *
			 * One barycentric blend evaluated once at full depth, then one
			 * normalize. Building the same point by repeated arc-midpoint
			 * subdivision lands on a different sphere, 38.97 m out on a 1,700 m
			 * planet, and the error is fixed in metres rather than shrinking with
			 * depth.
			 */
			function latticePosition(face, n, i, j) {
				const [ia, ib, ic] = FACES[face];
				const [wa, wb, wc] = latticeWeights(n, i, j);
				const a = VERTICES[ia];
				const b = VERTICES[ib];
				const c = VERTICES[ic];
				return normalize3([
					a[0] * wa + b[0] * wb + c[0] * wc,
					a[1] * wa + b[1] * wb + c[1] * wc,
					a[2] * wa + b[2] * wb + c[2] * wc,
				]);
			}

			/**
			 * Every face-and-offset pair that names the same lattice point.
			 *
			 * A point strictly inside a face has one. A point on a face edge has
			 * two, and a point at an icosahedron vertex has five, since five
			 * faces meet there. The point is found by matching weights against
			 * global vertex numbers, so no geometry is involved.
			 */
			function cellRepresentations(face, n, i, j) {
				const w = latticeWeights(n, i, j);
				const ids = FACES[face];
				const carried = new Map();
				for (let x = 0; x < 3; x++) if (w[x] > 0) carried.set(ids[x], w[x]);
				const out = [];
				for (let g = 0; g < 20; g++) {
					const gv = FACES[g];
					let ok = true;
					for (const v of carried.keys()) if (!gv.includes(v)) ok = false;
					if (!ok) continue;
					out.push({
						face: g,
						i: carried.get(gv[1]) ?? 0,
						j: carried.get(gv[2]) ?? 0,
					});
				}
				return out;
			}

			/**
			 * The one representation a cell is numbered from: the lowest face.
			 *
			 * The same rule that awards a border cell to the lowest chunk
			 * containing it, applied one level up.
			 */
			function canonicalCell(face, n, i, j) {
				const all = cellRepresentations(face, n, i, j);
				let best = all[0];
				for (const c of all) if (c.face < best.face) best = c;
				return best;
			}

			/**
			 * Every cell of the planet at one subdivision level, with the ring of
			 * neighbours around each.
			 *
			 * Erosion compares a cell against its neighbours and nothing else, so
			 * it needs a dense index rather than the packed cell IDs the rest of
			 * the engine uses. Numbering runs face by face and, inside a face, by
			 * `rank(i, j)`, taking each shared cell the first time its own face
			 * claims it. That order depends on nothing but the level, so two
			 * machines number the planet identically.
			 *
			 * Every array here is typed and flat. At level 8 there are 655,362
			 * cells, and one object apiece is the layout that measures 15x slower.
			 */
			class CoarseGrid {
				constructor(level) {
					const n = 1 << level;
					this.level = level;
					this.n = n;
					this.count = 10 * 4 ** level + 2;
					this.slots = chunkSlots(n);
					this.faceIndex = new Int32Array(20 * this.slots).fill(-1);
					this.directions = new Float64Array(this.count * 3);

					// A cell strictly inside a face is named by that face alone. A
					// cell on an edge or at an icosahedron vertex has up to five
					// other names, and goes to the lowest face among them.
					let next = 0;
					for (let face = 0; face < 20; face++)
						for (let i = 0; i <= n; i++)
							for (let j = 0; i + j <= n; j++) {
								const w = latticeWeights(n, i, j);
								const shared = w[0] === 0 || w[1] === 0 || w[2] === 0;
								if (shared && canonicalCell(face, n, i, j).face !== face)
									continue;
								const cell = next++;
								this.faceIndex[face * this.slots + rank(i, j, n)] = cell;
								const p = latticePosition(face, n, i, j);
								this.directions[cell * 3] = p[0];
								this.directions[cell * 3 + 1] = p[1];
								this.directions[cell * 3 + 2] = p[2];
							}

					for (let face = 0; face < 20; face++)
						for (let i = 0; i <= n; i++)
							for (let j = 0; i + j <= n; j++) {
								const at = face * this.slots + rank(i, j, n);
								if (this.faceIndex[at] >= 0) continue;
								const c = canonicalCell(face, n, i, j);
								this.faceIndex[at] =
									this.faceIndex[c.face * this.slots + rank(c.i, c.j, n)];
							}

					// A cell's six lattice steps stay inside its own face unless
					// the cell sits on an edge, and there the faces on both sides
					// each contribute the steps on their side. Every cell
					// therefore ends up with a full ring without any face
					// crossing being computed here.
					this.ring = new Int32Array(this.count * 6).fill(-1);
					for (let face = 0; face < 20; face++)
						for (let i = 0; i <= n; i++)
							for (let j = 0; i + j <= n; j++) {
								const from =
									this.faceIndex[face * this.slots + rank(i, j, n)];
								for (const [di, dj] of DIRECTIONS) {
									const ni = i + di;
									const nj = j + dj;
									if (ni < 0 || nj < 0 || ni + nj > n) continue;
									this.link(
										from,
										this.faceIndex[
											face * this.slots + rank(ni, nj, n)
										],
									);
								}
							}
				}

				/** Record `to` in `from`'s ring, unless it is already there. */
				link(from, to) {
					const base = from * 6;
					for (let k = 0; k < 6; k++) {
						const at = this.ring[base + k];
						if (at === to) return;
						if (at < 0) {
							this.ring[base + k] = to;
							return;
						}
					}
				}

				/** The cell a face-and-offset names. */
				indexOf(face, i, j) {
					return this.faceIndex[face * this.slots + rank(i, j, this.n)];
				}

				/** How many neighbours a cell has: 5 on the twelve pentagons, 6 elsewhere. */
				degreeOf(cell) {
					return this.ring[cell * 6 + 5] < 0 ? 5 : 6;
				}
			}

			/**
			 * Which of the twenty faces a direction falls in.
			 *
			 * Twenty dot products, take the largest. Exact rather than an
			 * approximation: the perpendicular bisector plane between two
			 * adjacent face centroids contains the two vertices of the edge they
			 * share, so the face boundaries are the Voronoi boundaries of the
			 * centroids.
			 */
			function faceOf(x, y, z) {
				let best = 0;
				let bestDot = -Infinity;
				for (let f = 0; f < 20; f++) {
					const c = FACE_CENTROIDS[f];
					const d = x * c[0] + y * c[1] + z * c[2];
					if (d > bestDot) {
						bestDot = d;
						best = f;
					}
				}
				return best;
			}

			/**
			 * Where a direction sits inside a face, as three weights summing to 1.
			 *
			 * Cramer's rule on `[A B C] w = dir`, rescaled, which is the same
			 * blend `latticePosition` runs forwards. A negative weight means the
			 * direction is outside this face.
			 */
			function barycentricOf(face, x, y, z) {
				const [ia, ib, ic] = FACES[face];
				const a = VERTICES[ia];
				const b = VERTICES[ib];
				const c = VERTICES[ic];
				const bc = [
					b[1] * c[2] - b[2] * c[1],
					b[2] * c[0] - b[0] * c[2],
					b[0] * c[1] - b[1] * c[0],
				];
				const dc = [
					y * c[2] - z * c[1],
					z * c[0] - x * c[2],
					x * c[1] - y * c[0],
				];
				const bd = [
					b[1] * z - b[2] * y,
					b[2] * x - b[0] * z,
					b[0] * y - b[1] * x,
				];
				const det = a[0] * bc[0] + a[1] * bc[1] + a[2] * bc[2];
				const wa = (x * bc[0] + y * bc[1] + z * bc[2]) / det;
				const wb = (a[0] * dc[0] + a[1] * dc[1] + a[2] * dc[2]) / det;
				const wc = (a[0] * bd[0] + a[1] * bd[1] + a[2] * bd[2]) / det;
				const s = wa + wb + wc;
				return [wa / s, wb / s, wc / s];
			}

			/** How many droplets one unit of the knob runs, per cell of the map. */
			const DROPLETS_PER_CELL = 1.5;

			/** How many cells a droplet may cross before it is abandoned. */
			const MAX_STEPS = 48;

			/**
			 * How much a droplet may carry, as metres of height per unit of
			 * gradient.
			 *
			 * Capacity is a **gradient** times this, never a fall in metres times
			 * a cell width -- that made a droplet crossing flat ground on a 100 m
			 * map want to carry `15 m` of material, and cut it out. The gradient
			 * form means the same hillside erodes by the same amount whatever the
			 * map's cell size is.
			 */
			const CAPACITY = 8;

			/** A floor under the gradient, so a droplet on flat ground still carries. */
			const MIN_GRADIENT = 0.01;

			/** How much of the excess a slowing droplet puts down in one step. */
			const DEPOSIT_RATE = 0.1;

			/** How much of the shortfall a hungry droplet cuts out in one step. */
			const EROSION_RATE = 0.05;

			/**
			 * The most of one step's fall a single droplet may cut, as a fraction.
			 *
			 * A cell is crossed by dozens of droplets, so a tenth each is still a
			 * valley by the end, and the shapes come out graded rather than
			 * pocked.
			 */
			const MAX_CUT = 0.1;

			/** What a cell keeps of the material cut from it; the rest goes to the ring. */
			const CUT_SHARE = 0.5;

			/** How much speed a droplet gains per metre of fall. */
			const GRAVITY = 4;

			/** How much of a droplet's water is gone after one step. */
			const EVAPORATION = 0.02;

			/**
			 * Cut valleys into a height field by running water over it.
			 *
			 * A droplet starts on a hashed cell and walks downhill, cell to cell,
			 * taking the steepest step it can find. How much it can carry depends
			 * on how fast it is going and how steeply the ground falls; where it
			 * can carry more than it holds it cuts, and where it slows or runs
			 * onto flat ground it puts material back down. It looks only at the
			 * cell it stands on and the six around it -- no routing, no pit
			 * filling, no stored flow.
			 *
			 * **Heights are metres and the grid is metres**, so every constant
			 * above means something on the ground rather than in grid units: a
			 * knob set once holds its meaning on a planet of any size and a map
			 * drawn at any level.
			 *
			 * `over` carries what the panel changes and what a sliced run needs:
			 * `maxCut`, `cutShare`, and a `from` and `take` that run part of the
			 * droplets. Droplets run one after another, so a contiguous range is
			 * the same arithmetic in the same order as the whole run. Called with
			 * five arguments this is the engine's pass exactly.
			 *
			 * `maxCut` is the most of one step's fall a single droplet may take.
			 * Without it a droplet meeting a tall step takes the whole thing at
			 * once and leaves a pit for the next one to fall into. `cutShare` is
			 * how much of a cut stays on the cell the droplet stands on, the rest
			 * being divided over the ring: at `0.5` the centre drops six times as
			 * far as any neighbour, which is a spike, and at `0` the cut is flat
			 * across the seven.
			 *
			 * Every draw is hashed from the seed and the droplet's number rather
			 * than taken from a running generator, and droplets run one after
			 * another, so the result does not depend on anything but the seed.
			 */
			function erodeDroplets(grid, height, seed, strength, cellMetres, over = {}) {
				const maxCut = over.maxCut ?? MAX_CUT;
				const cutShare = over.cutShare ?? CUT_SHARE;
				const droplets = Math.round(strength * DROPLETS_PER_CELL * grid.count);
				if (droplets <= 0) return 0;
				const from = over.from ?? 0;
				const until = Math.min(droplets, from + (over.take ?? droplets));

				for (let drop = from; drop < until; drop++) {
					let cell = Math.min(
						grid.count - 1,
						Math.floor(
							hash3(drop & 0xffff, drop >>> 16, 0, seed) * grid.count,
						),
					);
					let sediment = 0;
					let speed = 1;
					let water = 1;

					for (let step = 0; step < MAX_STEPS; step++) {
						// The steepest of the six, which is where the water would
						// actually go. A pentagon has five and the ring says so.
						let next = -1;
						let fall = 0;
						for (let k = 0; k < 6; k++) {
							const other = grid.ring[cell * 6 + k];
							if (other < 0) continue;
							const down = height[cell] - height[other];
							if (down > fall) {
								fall = down;
								next = other;
							}
						}

						// Nowhere lower: the droplet has reached a floor or the
						// sea, and everything it was carrying settles here.
						if (next < 0) {
							height[cell] = height[cell] + sediment;
							break;
						}

						const gradient = Math.max(fall / cellMetres, MIN_GRADIENT);
						const capacity = gradient * speed * water * CAPACITY;

						if (sediment > capacity) {
							const put = (sediment - capacity) * DEPOSIT_RATE;
							sediment -= put;
							height[cell] = height[cell] + put;
						} else {
							const cut = Math.min(
								(capacity - sediment) * EROSION_RATE,
								fall * maxCut,
							);
							sediment += cut;
							// Spread most of it over the ring, so one cell does not
							// become a spike of its own. What the ring cannot take
							// stays here.
							let taken = 0;
							let degree = 0;
							for (let k = 0; k < 6; k++)
								if (grid.ring[cell * 6 + k] >= 0) degree++;
							const share =
								degree > 0 ? (cut * (1 - cutShare)) / degree : 0;
							for (let k = 0; k < 6; k++) {
								const other = grid.ring[cell * 6 + k];
								if (other < 0) continue;
								height[other] = height[other] - share;
								taken += share;
							}
							height[cell] = height[cell] - (cut - taken);
						}

						speed = Math.sqrt(Math.max(0, speed * speed + fall * GRAVITY));
						water *= 1 - EVAPORATION;
						cell = next;
					}
				}
				return droplets;
			}
			// ===== END engine coarse grid =====

			// ---------------------------------------------------------------
			// The second droplet walk, which is not in the engine yet.
			// ---------------------------------------------------------------

			/**
			 * The two lattice axes as metres on the plane of a face, 60 degrees
			 * apart. A step of one in `i` and a step of one in `j` are the same
			 * length and are not at a right angle, so a direction cannot be read
			 * off `(i, j)` without them.
			 */
			const LATTICE_I = [1, 0];
			const LATTICE_J = [0.5, Math.sqrt(3) / 2];
			const LATTICE_DET =
				LATTICE_I[0] * LATTICE_J[1] - LATTICE_I[1] * LATTICE_J[0];

			/**
			 * How many droplets of the last free run ended at a face edge.
			 *
			 * A count rather than a return value, because the pass is run in
			 * slices and the share is of the whole run.
			 */
			let strandedDroplets = 0;

			/**
			 * Cut valleys with a droplet that stands between cells rather than on
			 * one.
			 *
			 * The cell-to-cell walk picks the steepest of six, which is a choice
			 * between six fixed directions: on ground whose gradient is gentle
			 * and smooth the same direction keeps winning, and the walk marches
			 * along one axis of the lattice. Measured on the shipped map, 18.3%
			 * of its steps are part of a run of eight or more in one unchanged
			 * direction, against 1.4% for the walk here.
			 *
			 * This one carries a **position and a direction**. The position is a
			 * fractional `(i, j)` in one face; the height under it is the blend of
			 * the three lattice points around it, which is the same blend the
			 * terrain generator reads the map with. The direction is the downhill
			 * gradient of that blend, mixed with the direction the droplet already
			 * had, so it cannot turn instantly and it is never one of six.
			 *
			 * **The cut is spread over the same three points by the same
			 * weights.** A droplet standing on exactly one cell can only cut a
			 * spike into it, and a pass built out of spikes adds high-frequency
			 * roughness: the cell-to-cell walk takes the median hillslope from
			 * 0.427 to 0.602 at full strength, where this takes it to 0.472.
			 *
			 * A droplet that reaches the edge of its face settles there and
			 * stops. Crossing is the linear map on barycentric weights that the
			 * neighbour function already uses, and it is not written here, so 11%
			 * of droplets end early and the thirty face edges are cut a little
			 * less than their surroundings.
			 */
			function erodeFreeDroplets(grid, height, seed, strength, cellMetres, over = {}) {
				const maxCut = over.maxCut ?? MAX_CUT;
				const inertia = over.inertia ?? 0.3;
				const droplets = Math.round(strength * DROPLETS_PER_CELL * grid.count);
				if (droplets <= 0) return 0;
				const from = over.from ?? 0;
				const until = Math.min(droplets, from + (over.take ?? droplets));
				const n = grid.n;

				// The three lattice points under a fractional position, and the
				// weights to mix them with. Held outside the loop because this
				// runs a few tens of millions of times and allocating three
				// numbers each time is the whole cost.
				const cells = [0, 0, 0];
				const weights = [0, 0, 0];

				/** Fill `cells` and `weights`, or report that the point is off the face. */
				function corners(face, fi, fj) {
					const i0 = Math.floor(fi);
					const j0 = Math.floor(fj);
					const a = fi - i0;
					const b = fj - j0;
					// The remainders land in one of the two triangles the square
					// of steps is cut into, and which one decides the three
					// corners.
					const near = a + b <= 1;
					const oi = near ? [i0, i0 + 1, i0] : [i0 + 1, i0, i0 + 1];
					const oj = near ? [j0, j0, j0 + 1] : [j0, j0 + 1, j0 + 1];
					weights[0] = near ? 1 - a - b : 1 - b;
					weights[1] = near ? a : 1 - a;
					weights[2] = near ? b : a + b - 1;
					for (let t = 0; t < 3; t++) {
						const i = oi[t];
						const j = oj[t];
						if (i < 0 || j < 0 || i + j > n) return false;
						const cell = grid.faceIndex[face * grid.slots + rank(i, j, n)];
						if (cell < 0) return false;
						cells[t] = cell;
					}
					return true;
				}

				/** The ground under a fractional position, or `NaN` off the face. */
				function groundAt(face, fi, fj) {
					if (!corners(face, fi, fj)) return NaN;
					return (
						weights[0] * height[cells[0]] +
						weights[1] * height[cells[1]] +
						weights[2] * height[cells[2]]
					);
				}

				/** Add `amount` to the three points the droplet is standing over. */
				function spread(face, fi, fj, amount) {
					if (!corners(face, fi, fj)) return;
					for (let t = 0; t < 3; t++)
						height[cells[t]] += weights[t] * amount;
				}

				for (let drop = from; drop < until; drop++) {
					const start = Math.min(
						grid.count - 1,
						Math.floor(
							hash3(drop & 0xffff, drop >>> 16, 0, seed) * grid.count,
						),
					);
					// A cell's own face and offset, recovered from the direction
					// the grid stored for it. A droplet starts anywhere in the
					// cell rather than on its centre, or every droplet in a cell
					// walks the same line.
					const x = grid.directions[start * 3];
					const y = grid.directions[start * 3 + 1];
					const z = grid.directions[start * 3 + 2];
					const face = faceOf(x, y, z);
					const w = barycentricOf(face, x, y, z);
					let fi = w[1] * n + hash3(drop, 5, 0, seed) - 0.5;
					let fj = w[2] * n + hash3(drop, 9, 0, seed) - 0.5;
					let sediment = 0;
					let speed = 1;
					let water = 1;
					let vx = 0;
					let vy = 0;

					for (let step = 0; step < MAX_STEPS; step++) {
						const here = groundAt(face, fi, fj);
						if (!Number.isFinite(here)) break;
						// The gradient of the blend, read half a step out on each
						// axis. Half rather than one, because a whole step reaches
						// past the three points the height itself came from.
						const reach = 0.5;
						const alongI = groundAt(face, fi + reach, fj);
						const alongJ = groundAt(face, fi, fj + reach);
						if (!Number.isFinite(alongI) || !Number.isFinite(alongJ)) {
							spread(face, fi, fj, sediment);
							strandedDroplets++;
							break;
						}
						const gi = (alongI - here) / reach;
						const gj = (alongJ - here) / reach;
						// Downhill, on the plane the two axes span.
						const px = -(gi * LATTICE_I[0] + gj * LATTICE_J[0]);
						const py = -(gi * LATTICE_I[1] + gj * LATTICE_J[1]);
						vx = vx * inertia + px * (1 - inertia);
						vy = vy * inertia + py * (1 - inertia);
						const length = Math.sqrt(vx * vx + vy * vy);
						if (length < 1e-12) {
							spread(face, fi, fj, sediment);
							break;
						}
						const ux = vx / length;
						const uy = vy / length;
						// One cell of travel, turned back into a step in `(i, j)`.
						const di =
							(ux * LATTICE_J[1] - uy * LATTICE_J[0]) / LATTICE_DET;
						const dj =
							(LATTICE_I[0] * uy - LATTICE_I[1] * ux) / LATTICE_DET;
						const ni = fi + di;
						const nj = fj + dj;
						const there = groundAt(face, ni, nj);
						if (!Number.isFinite(there)) {
							spread(face, fi, fj, sediment);
							strandedDroplets++;
							break;
						}
						const fall = here - there;
						// Momentum can carry a droplet uphill. It has run into a
						// wall, and what it was carrying settles where it stands.
						if (fall <= 0) {
							spread(face, fi, fj, sediment);
							break;
						}

						const gradient = Math.max(fall / cellMetres, MIN_GRADIENT);
						const capacity = gradient * speed * water * CAPACITY;
						if (sediment > capacity) {
							const put = (sediment - capacity) * DEPOSIT_RATE;
							sediment -= put;
							spread(face, fi, fj, put);
						} else {
							const cut = Math.min(
								(capacity - sediment) * EROSION_RATE,
								fall * maxCut,
							);
							sediment += cut;
							spread(face, fi, fj, -cut);
						}

						speed = Math.sqrt(Math.max(0, speed * speed + fall * GRAVITY));
						water *= 1 - EVAPORATION;
						fi = ni;
						fj = nj;
					}
				}
				return droplets;
			}

			// ---------------------------------------------------------------
			// The world: two noise layers, each read through a curve.
			// ---------------------------------------------------------------

			/**
			 * A control field's value, bent through a curve of the reader's own.
			 *
			 * **The curve is what puts an edge on a region.** A control read
			 * straight is linear and mushy: half of it gives half of whatever it
			 * governs, everywhere, gradually. A curve can say "nothing at all
			 * until two thirds, then flatten hard", which is what makes a
			 * mountain front, a plateau rim and a coastal shelf rather than one
			 * long fade.
			 *
			 * Piecewise linear between the points, held flat past the ends.
			 * Straight segments rather than a smooth spline because a person
			 * dragging a point should be able to predict what happens, and
			 * because a curve that overshoots its own control points can send a
			 * quantity outside the range it was promised.
			 */
			function splineAt(points, at) {
				if (points.length === 0) return 0;
				if (at <= points[0][0]) return points[0][1];
				const last = points[points.length - 1];
				if (at >= last[0]) return last[1];
				for (let n = 1; n < points.length; n++) {
					const [x1, y1] = points[n];
					if (at > x1) continue;
					const [x0, y0] = points[n - 1];
					const span = x1 - x0;
					if (span <= 1e-9) return y1;
					return y0 + ((y1 - y0) * (at - x0)) / span;
				}
				return last[1];
			}

			/** A spline as a query-string value, and back. */
			function splineToText(points) {
				return points.map(([x, y]) => `${+x.toFixed(3)}:${+y.toFixed(3)}`).join(",");
			}
			function splineFromText(text) {
				const out = [];
				for (const pair of text.split(",")) {
					const [x, y] = pair.split(":").map(Number);
					if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
					out.push([Math.max(-1, Math.min(1, x)), Math.max(0, Math.min(1, y))]);
				}
				out.sort((a, b) => a[0] - b[0]);
				return out.length >= 2 ? out : null;
			}

			/** Offsets from the world seed, so the two layers are two fields. */
			const TERRAIN_SEED_OFFSET = 101;
			const MOUNTAIN_SEED_OFFSET = 211;

			/**
			 * The world, which is two noise layers and two curves.
			 *
			 * **A single octave stack makes one kind of landscape.** fBm is
			 * homogeneous -- every octave applies everywhere at one amplitude,
			 * so one statistic describes the whole planet and nothing in it can
			 * say *be different here*. Ridge did not help, because it folds
			 * every octave everywhere: it moved the character of the world
			 * rather than carving regions out of it. What draws a region is a
			 * second field, slower than the ground, read through a **curve** --
			 * across is that field's own value, up is what it controls -- and
			 * the curve is what puts an *edge* on the region where the field
			 * read straight is one long fade.
			 *
			 * **Terrain and continents are one layer**, because they are one
			 * question at two sizes: this layer's widest octaves are where the
			 * land is and its narrowest are what the ground does underfoot. Its
			 * curve decides the coast -- a shelf, a short steep rise, then land
			 * that keeps climbing.
			 *
			 * **Mountains are the second layer**, and the two ways it can reach
			 * the ground are on the panel rather than argued here, because
			 * which is right is easier to see than to reason about:
			 *
			 * **above the line** is `add` with the terrain layer holding the
			 * gate. The mountain layer is let through in proportion to how far
			 * the terrain already stands above **Mountain line** -- nothing at
			 * or below it, all of it at the top of the terrain's own range --
			 * so a range can only grow where the ground was already high. The
			 * terrain layer draws the land and says where it may become
			 * mountain; the mountain layer says what the mountain looks like.
			 * The gate is smoothed, because a hard cut draws a contour line
			 * across every hillside at exactly the same height.
			 *
			 * **roughen** keeps it a per-place multiplier on the terrain
			 * layer's own noise: mountains are rougher ground rather than
			 * taller ground, and because the bumps and the base come out of one
			 * field they line up instead of crossing.
			 */
			function fieldAt(x, y, z, seed, k, s, report) {
				const terrainRaw = octaveNoise(
					x,
					y,
					z,
					(seed + TERRAIN_SEED_OFFSET) | 0,
					s.terrain,
				);
				const mountainRaw = octaveNoise(
					x,
					y,
					z,
					(seed + MOUNTAIN_SEED_OFFSET) | 0,
					s.mountain,
				);
				const shaped = splineAt(k.terrainSpline, terrainRaw);
				// **A layer switched off means the value that removes it.** For
				// `add` that is no height at all; for `roughen` it is full
				// roughness everywhere, which is the world with no regions in
				// it. The curve is read either way, because the histogram under
				// it counts what the field said and a switched-off layer still
				// has a curve to look at.
				const read = splineAt(k.mountainSpline, mountainRaw);
				const mount = k.useMountain ? read : k.merge === "roughen" ? 1 : 0;
				// **A layer's own picture is the layer, never the layer after
				// something else has had a say.** What is reported is what this
				// curve returned, so Picture draws the mountain field where it
				// is loud whether or not the gate is letting it through there.
				if (report) {
					report[0] = shaped;
					report[1] = read;
					report[2] = terrainRaw;
					report[3] = mountainRaw;
				}
				const base = shaped * 2 - 1;
				// **The mountain layer's whole contribution, reported on its
				// own.** Peak scale multiplies it after the metre fit, which is
				// the only place a scale on it can do anything: applied before,
				// the fit divides it straight back out and the knob becomes
				// `Detail on top` under another name.
				let term;
				if (k.merge === "gated") {

						0,
						Math.min(
							1,

								Math.max(1e-6, k.terrainHigh - k.lineHeight),
						),
					);
					term = mount * (over * over * (3 - 2 * over)) * k.detail;
				} else term = terrainRaw * mount * k.detail;
				if (report) report[4] = term;
				return base + term;
