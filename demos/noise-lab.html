			 * the link in it is always the picture on screen.
			 */
			function toParams() {
				const out = new URLSearchParams();
				for (const g of KNOBS)
					for (const r of g.rows) {
						const v = knobs[r.key];
						if (r.type === "spline") {
							const now = splineToText(v);
							if (now !== splineToText(r.value)) out.set(r.key, now);
							continue;
						}
						if (v === r.value) continue;
						out.set(r.key, r.type === "check" ? (v ? "1" : "0") : String(v));
					}
				for (const key of Object.keys(using))
					if (!using[key]) out.set("x" + key, "0");
				return out;
			}

			function fromParams(params) {
				for (const g of KNOBS)
					for (const r of g.rows) {
						const raw = params.get(r.key);
						if (raw === null) continue;
						if (r.type === "spline") {
							const points = splineFromText(raw);
							if (points) knobs[r.key] = points;
						} else if (r.type === "check") knobs[r.key] = raw !== "0";
						else if (r.type === "select")
							knobs[r.key] = r.options.includes(raw) ? raw : r.value;
						else if (r.type === "text") knobs[r.key] = raw;
						else {
							const n = Number(raw);
							// A hand-edited link can name anything, so a slider's
							// own ends are what the value is held inside.
							knobs[r.key] = Number.isFinite(n)
								? Math.min(r.high, Math.max(r.low, n))
								: r.value;
						}
					}
				for (const key of Object.keys(using))
					if (params.get("x" + key) === "0") using[key] = false;
			}

			/** Put the current draft in the address bar, without adding history. */
			function writeUrl() {
				const query = toParams().toString();
				history.replaceState(
					null,
					"",
					query ? `?${query}` : location.pathname,
				);
			}

			/**
			 * A knob's own ends, narrowed by the rest of the draft.
			 *
			 * **A slider that cannot be moved into a refusal beats a refusal
			 * that explains itself.** The world is the map, so an octave
			 * narrower than a map cell is ground the map cannot carry and the
			 * world would not build -- it is drawn here and nowhere else. Rather
			 * than let the slider reach that and then complain, the slider's own
			 * end moves: the octave count stops where the narrowest octave is
			 * still two cells wide. The warning stays as a backstop for a
			 * hand-edited link, which is the one way a value can arrive from
			 * outside the panel.
			 *
			 * The narrowing only ever moves an end inward.
			 */
			function liveRange(row) {
				// **The sea can be drained and no further.** Under `fit` the
				// deepest point is exactly Sea depth below the water, so a
				// lower sea level than that is a planet with no ocean and a
				// slider position that means the same as the one beside it.
				if (row.key === "seaLevel")
					return { ...row, low: Math.max(row.low, -value("seaDepth")) };
				const layer = row.key.startsWith("terrain")
					? "terrain"
					: row.key.startsWith("mountain")
						? "mountain"
						: null;
				if (!layer) return row;
				const what = row.key.slice(layer.length);
				if (what !== "Octaves" && what !== "FrequencyScale") return row;
				const k = derived();
				if (what === "FrequencyScale") {
					// Even one octave has to be two map cells wide, and the fine
					// slider reaches 1, so the coarse one stops where their
					// product does. What is cut off is frequency the map could
					// not carry at any octave count.
					const most = k.radius / (2 * k.cellMetres);
					return {
						...row,
						high: Math.max(row.low, Math.min(row.high, Math.floor(most))),
					};
				}
				const widest = k.radius / Math.max(1e-6, k[layer + "Frequency"]);
				const step = knobs[layer + "Lacunarity"];
				const room =
					1 + Math.floor(Math.log(widest / (2 * k.cellMetres)) / Math.log(step));
				return {
					...row,
					high: Math.max(row.low, Math.min(row.high, room)),
				};
			}

			/** Pull every knob inside its own narrowed ends, inward only. */
			function settle() {
				for (const g of KNOBS)
					for (const r of g.rows) {
						if (r.digits === undefined || r.type) continue;
						const live = liveRange(r);
						knobs[r.key] = Math.min(
							live.high,
							Math.max(live.low, knobs[r.key]),
						);
					}
			}

			/** What a knob is worth right now, which is its neutral when it is off. */
			function value(key) {
				const row = rowOf(key);
				return using[key] === false ? row.off : knobs[key];
			}
			const ROWS = new Map();
			for (const g of KNOBS) for (const r of g.rows) ROWS.set(r.key, r);
			function rowOf(key) {
				return ROWS.get(key);
			}

			// ---------------------------------------------------------------
			// The field: one patch of the planet, in metres above sea level.
			// ---------------------------------------------------------------

			/** Directions spread evenly over the sphere, by the golden angle. */
			function sphereDirections(count) {
				const out = new Float64Array(count * 3);
				const golden = Math.PI * (3 - Math.sqrt(5));
				for (let n = 0; n < count; n++) {
					const z = 1 - (2 * n + 1) / count;
					const ring = Math.sqrt(Math.max(0, 1 - z * z));
					const around = n * golden;
					out[n * 3] = Math.cos(around) * ring;
					out[n * 3 + 1] = z;
					out[n * 3 + 2] = Math.sin(around) * ring;
				}
				return out;
			}
			const SPHERE = sphereDirections(SPHERE_SAMPLES);

			/** How many columns the histogram under a curve is drawn in. */
			const SPLINE_BINS = 48;

			/** What the knobs come to, in the units the engine states them in. */
			function derived() {
				const radius =
					(knobs.blockSize * 2 ** knobs.subdivisionDepth) / CELL_CONSTANT;
				// The map's level is chosen so its cell lands near the asked-for
				// spacing, then the cell is what that level actually gives.
				const level = Math.max(
					2,
					Math.min(
						knobs.subdivisionDepth,
						9,
						Math.max(
							0,
							Math.round(
								Math.log2((CELL_CONSTANT * radius) / knobs.coarseSpacing),
							),
						),
					),
				);
				const cellMetres = (CELL_CONSTANT * radius) / 2 ** level;
				let terrainLow = Infinity;
				let terrainHigh = -Infinity;
				for (const [, y] of knobs.terrainSpline) {
					if (y < terrainLow) terrainLow = y;
					if (y > terrainHigh) terrainHigh = y;
				}
				return {
					radius,
					level,
					cellMetres,
					// **Frequency is stated as a frequency.** The sample point
					// is a unit direction, so this is how many times the widest
					// octave repeats across the planet -- 1 is one hump from
					// pole to pole, 40 is forty. A metre figure divided by the
					// radius reaches the same number, and it hides how small the
					// result gets: a scale of 29,400 m on a 6,801 m planet is a
					// frequency of 0.23, which is less than one whole feature
					// and is why so much of the ground came out muted. The
					// coarse slider carries the decade and the fine one picks
					// the value inside it.
					terrainFrequency:
						knobs.terrainFrequency * knobs.terrainFrequencyScale,
					terrainOctaves: value("terrainOctaves"),
					terrainPersistence: value("terrainPersistence"),
					terrainLacunarity: knobs.terrainLacunarity,
					terrainOffsetX: value("terrainOffsetX"),
					terrainOffsetY: value("terrainOffsetY"),
					terrainSpline: knobs.terrainSpline,
					mountainFrequency:
						knobs.mountainFrequency * knobs.mountainFrequencyScale,
					mountainOctaves: value("mountainOctaves"),
					mountainPersistence: value("mountainPersistence"),
					mountainLacunarity: knobs.mountainLacunarity,
					mountainOffsetX: value("mountainOffsetX"),
					mountainOffsetY: value("mountainOffsetY"),
					mountainSpline: knobs.mountainSpline,
					useMountain: knobs.useMountain,
					merge: knobs.merge,
					mountainLine: knobs.mountainLine,
					peakScale: value("peakScale"),
					// **The line is a fraction of the terrain curve's own range,
					// not a height on a fixed axis.** Drag that curve's top down
					// and an absolute line would drift toward the summit until
					// the gate stopped opening at all -- so the line moves with
					// the curve, and the number keeps meaning the same thing.
					terrainHigh,
					lineHeight:
						terrainLow + knobs.mountainLine * (terrainHigh - terrainLow),
					detail: knobs.detail,
				};
			}

			/** The three axes of the patch: out of the ground, east, and north. */
			function patchFrame(latitude, longitude) {
				const lat = (latitude * Math.PI) / 180;
				const lon = (longitude * Math.PI) / 180;
				const ring = Math.cos(lat);
				const up = [
					ring * Math.cos(lon),
					Math.sin(lat),
					ring * Math.sin(lon),
				];
				let east = [
					-Math.sin(lon),
					0,
					Math.cos(lon),
				];
				const north = [
					up[1] * east[2] - up[2] * east[1],
					up[2] * east[0] - up[0] * east[2],
					up[0] * east[1] - up[1] * east[0],
				];
				return { up, east, north };
			}

			let field = null;

			/** Generate the patch, and the sea level and scale it is measured on. */
			function generate(cells = knobs.cells) {
				const k = derived();
				const seed = seedFromString(knobs.seed);
				const s = settingsFor(k);

				// The whole sphere first, for the two numbers that must not
				// depend on where the patch is looking.
				const raw = new Float64Array(SPHERE_SAMPLES);
				// **Where the world actually lands on each curve.** Noise
				// clusters around its own middle, so equal widths of a curve
				// cover wildly unequal amounts of planet -- a small drag near
				// the middle repaints a fifth of the world and the same drag out
				// at the end reaches two percent of it. Counted over the sphere
				// rather than the patch, because the curve governs the planet.
				const tally = {
					terrainSpline: new Float32Array(SPLINE_BINS),
					mountainSpline: new Float32Array(SPLINE_BINS),
				};
				const heard = [0.5, 1, 0, 0, 0];
				// What the mountain layer put in, kept apart so Peak scale can
				// multiply it after the fit rather than before it.
				const mountOf = new Float64Array(SPHERE_SAMPLES);
				// How much of the planet the gate is open over. Counted here
				// rather than off the patch, because the line is a property of
				// the world and a patch can be entirely on one side of it.
				let overLine = 0;
				const bin = (v) =>
					Math.max(
						0,
						Math.min(SPLINE_BINS - 1, Math.floor(((v + 1) / 2) * SPLINE_BINS)),
					);
				for (let n = 0; n < SPHERE_SAMPLES; n++) {
					raw[n] = fieldAt(
						SPHERE[n * 3],
						SPHERE[n * 3 + 1],
						SPHERE[n * 3 + 2],
						seed,
						k,
						s,
						heard,
					);
					tally.terrainSpline[bin(heard[2])]++;
					tally.mountainSpline[bin(heard[3])]++;
					mountOf[n] = heard[4];
					if (heard[0] > k.lineHeight) overLine++;
				}
				let tallest = 0;
				for (const counts of Object.values(tally))
					for (const v of counts) if (v > tallest) tallest = v;
				const sea = seaLevelFor(raw, value("landFraction"));
				let peak = 0;
				let trough = 0;
				for (const v of raw) {
					const d = v - sea;
					if (d > peak) peak = d;
					if (d < trough) trough = d;
				}
				// **Metres are fitted, always.** The field is divided by its own
				// peak, so the tallest mountain is exactly Relief however the
				// shape knobs are set. A plain multiplier was on the panel
				// beside it and it made Relief mean metres-per-unit instead,
				// which is a number nobody wants to read; the fit also
				// renormalises whatever the octave stack hands it, so no knob
				// upstream can change how tall the world is by accident.
				const up = peak > 0 ? value("relief") / peak : 0;
				const down = trough < 0 ? value("seaDepth") / -trough : 0;
				// **The water drops and the ground does not.** Every height is
				// measured from the level Land chose, and then the whole field
				// is lifted by however far Sea level was pulled down -- which is
				// the same picture as draining that much water and moves no
				// ground at all. What comes out from under it is the shallow
				// floor that was already there.
				const drained = -knobs.seaLevel;
				// **What the whole planet is made of, not what this patch is.**
				// The material lines are absolute metres and Relief is what
				// carries the ground up through them, so the share of each is a
				// property of the world -- and a patch is a place, which can be
				// all mountain or all sea whatever the planet is doing.
				// **Only what the mountain layer pushed UP is exaggerated**, so
				// the extra is continuous across the shoreline and a peak grows
				// where a hollow does not. At a scale of one it is exactly zero
				// and nothing here moves at all.
				const over = value("peakScale") - 1;
				const bands = [0, 0, 0, 0];
				let summit = -Infinity;
				for (let n = 0; n < raw.length; n++) {
					const d = raw[n] - sea;
					const m =
						(d >= 0 ? d * up : d * down) +
						Math.max(0, mountOf[n]) * up * over +
						drained +
						erosionAt(SPHERE[n * 3], SPHERE[n * 3 + 1], SPHERE[n * 3 + 2]);
					if (m > summit) summit = m;
					bands[bandOf(m)]++;
				}
				for (let n = 0; n < bands.length; n++) bands[n] /= SPHERE_SAMPLES;

				// Then the patch, laid out so a step across it is exactly one map
				// cell -- the same metres per cell the engine's own map has, which
				// is what makes the shape here the shape the world would build.
				const n = cells;
				const frame = patchFrame(knobs.latitude, knobs.longitude);
				const height = new Float32Array((n + 1) * (n + 1));
				// The unitless field as it fell, before sea level was taken off
				// it and before either scale turned it into metres. The Raw
				// picture and the graph's own x axis both read this.
				const field0 = new Float32Array((n + 1) * (n + 1));
				// What each control layer said here, so a picture can show one
				// layer on its own rather than only the ground they make
				// together.
				const terrainField = new Float32Array((n + 1) * (n + 1));
				const mountField = new Float32Array((n + 1) * (n + 1));
				// What erosion moved here, kept apart from the height so the
				// Erosion picture can draw the cut on its own.
				const cutField = new Float32Array((n + 1) * (n + 1));
				const said = [0.5, 1, 0, 0, 0];
				// A draft covers the same ground with fewer points, so the step
				// grows as the count falls and the patch keeps its width.
				const step = (knobs.cells / n) * k.cellMetres;
				const half = (n / 2) * step;
				let lowest = Infinity;
				let highest = -Infinity;
				let rawLow = Infinity;
				let rawHigh = -Infinity;
				let land = 0;
				let wasLand = 0;
				for (let r = 0; r <= n; r++) {
					const dy = r * step - half;
					for (let q = 0; q <= n; q++) {
						const dx = q * step - half;
						// Metres out from the middle become radians of arc, so
						// the patch keeps its scale right out to the corners
						// rather than stretching the way a flat projection does.
						const u = dx / k.radius;
						const v = dy / k.radius;
						const a = Math.hypot(u, v);
						let x;
						let y;
						let z;
						if (a < 1e-12) {
							x = frame.up[0];
							y = frame.up[1];
							z = frame.up[2];
						} else {
							const c = Math.cos(a);
							const sn = Math.sin(a) / a;
							x = frame.up[0] * c + (frame.east[0] * u + frame.north[0] * v) * sn;
							y = frame.up[1] * c + (frame.east[1] * u + frame.north[1] * v) * sn;
							z = frame.up[2] * c + (frame.east[2] * u + frame.north[2] * v) * sn;
						}
						const len = Math.hypot(x, y, z);
						const unitless = fieldAt(
							x / len,
							y / len,
							z / len,
							seed,
							k,
							s,
							said,
						);
						const d = unitless - sea;
						const wet = d >= 0 ? d * up : d * down;
						const cut = erosionAt(x / len, y / len, z / len);
						const metres =
							wet + Math.max(0, said[4]) * up * over + drained + cut;
						height[r * (n + 1) + q] = metres;
						cutField[r * (n + 1) + q] = cut;
						field0[r * (n + 1) + q] = unitless;
						terrainField[r * (n + 1) + q] = said[0];
						mountField[r * (n + 1) + q] = said[1];
						if (unitless < rawLow) rawLow = unitless;
						if (unitless > rawHigh) rawHigh = unitless;
						if (metres < lowest) lowest = metres;
						if (metres > highest) highest = metres;
						if (metres > 0) land++;
						if (wet > 0) wasLand++;
					}
				}
				field = {
					k,
					n,
					step,
					height,
					raw: field0,
					tally,
					tallest,
					terrain: terrainField,
					mountain: mountField,
					cut: cutField,
					// How much of the patch the drain handed back. The knob is
					// in metres and what a person wants to know is how much
					// beach it bought, which is a different number on every
					// world and on every part of one.
					exposedShare: (land - wasLand) / ((n + 1) * (n + 1)),
					drained,
					bands,
					summit,
					overLine: overLine / SPHERE_SAMPLES,
					// The planet map redraws from these without regenerating,
					// so the two pictures are always of one world.
					settings: s,
					seed,
					// **The field never fills its own range.** A stack of
					// octaves divided by its summed amplitude is bounded by
					// [-1, 1] and reaches maybe half of it, so a Raw picture
					// drawn against the bounds is a flat grey wash. It is drawn
					// against what this patch actually holds instead, and the
					// axis says what that was.
					rawLow,
					rawHigh,
					sea,
					up,
					down,
					lowest,
					highest,
					landShare: land / ((n + 1) * (n + 1)),
					span: n * step,
					draft: n !== knobs.cells,
				};
			}

			/** Which of the four materials stands at a height. */
			function bandOf(metres) {
				if (metres <= 0) return 0;
				if (metres < GROUND_LINES.rock) return 1;
				if (metres < GROUND_LINES.snow) return 2;
				return 3;
			}

			// ---------------------------------------------------------------
			// Erosion: the one pass that reads a neighbourhood.
			// ---------------------------------------------------------------

			/**
			 * The eroded planet, held between redraws and rebuilt in slices.
			 *
			 * **Every other picture on this page is a pure function of a
			 * direction.** Hand `fieldAt` a point and it hands back a height
			 * without looking at anything else, which is what lets the patch, the
			 * planet map and the contour graph each sample wherever they like.
			 * Water does not work that way: a droplet walks from cell to cell, so
			 * erosion needs the whole planet on one grid before it can say what
			 * any one place looks like.
			 *
			 * So the grid is built, the un-eroded ground is written onto it in
			 * metres, the droplets are run over that, and what the pictures read
			 * is the **difference** -- how far erosion moved the ground at each
			 * cell, blended between the three cells around wherever they are
			 * asking. At strength zero there is no grid, no difference and no
			 * lookup, and every height on the page is what it was.
			 *
			 * The three stages are held apart because they are rebuilt at
			 * different rates. The grid depends on the level alone. The ground
			 * depends on every knob above the metre scale. The cutting depends on
			 * the erosion rows, so dragging those re-runs the water and nothing
			 * else.
			 */
			const erosion = {
				grid: null,
				level: -1,
				/** The un-eroded ground in metres, one value per grid cell. */
				base: null,
				baseKey: "",
				/** Metres erosion moved the ground, one value per grid cell. */
				delta: null,
				cutKey: "",
				/** The key of the run in progress, so a redraw does not restart it. */
				buildingKey: "",
				/** Whether a build is running, and how far through it is. */
				busy: "",
				done: 0,
				/** What the last finished run did, for the readout. */
				report: null,
			};

			/** Which knobs each stage of the build depends on. */
			function erosionKeys(k) {
				const ground = JSON.stringify([
					knobs.seed,
					k.level,
					k.terrainFrequency,
					k.terrainOctaves,
					k.terrainPersistence,
					k.terrainLacunarity,
					k.terrainOffsetX,
					k.terrainOffsetY,
					knobs.terrainSpline,
					k.mountainFrequency,
					k.mountainOctaves,
					k.mountainPersistence,
					k.mountainLacunarity,
					k.mountainOffsetX,
					k.mountainOffsetY,
					knobs.mountainSpline,
					k.useMountain,
					k.merge,
					k.mountainLine,
					k.detail,
					k.peakScale,
					value("landFraction"),
					value("relief"),
					value("seaDepth"),
					knobs.seaLevel,
				]);
				return {
					ground,
					cut: JSON.stringify([
						ground,
						value("erosion"),
						knobs.erosionWalk,
						knobs.erosionInertia,
						knobs.erosionCutShare,
						knobs.erosionMaxCut,
					]),
				};
			}

			/** Give the page a frame to paint the status line before the next slice. */
			function breathe() {
				return new Promise((resume) => setTimeout(resume, 0));
			}

			/**
			 * How steep the ground is, as three percentiles of metres of fall per
			 * metre travelled.
			 *
			 * The steepest of a cell's six neighbours, over land cells only,
			 * because the number this answers is what a hillside does. **A pass
			 * that carves moves the tail and leaves the middle alone**; one whose
			 * median climbs with it is adding roughness everywhere instead.
			 */
			function slopeQuantiles(grid, height, cellMetres) {
				const out = [];
				for (let cell = 0; cell < grid.count; cell += 7) {
					if (height[cell] <= 0) continue;
					let worst = 0;
					for (let k = 0; k < 6; k++) {
						const other = grid.ring[cell * 6 + k];
						if (other < 0) continue;
						const fall = Math.abs(height[cell] - height[other]) / cellMetres;
						if (fall > worst) worst = fall;
					}
					out.push(worst);
				}
				out.sort((a, b) => a - b);
				const at = (p) =>
					out.length === 0
						? 0
						: out[Math.min(out.length - 1, Math.floor(out.length * p))];
				return { median: at(0.5), ninety: at(0.9), ninetyNine: at(0.99) };
			}

			/** A newer request abandons whatever build is running. */
			let erosionRun = 0;

			/**
			 * Bring the eroded planet up to date with the knobs.
			 *
			 * Runs in slices with a wait between them, so the panel stays live
			 * and the status line moves while a level-8 planet -- 655,362 cells
			 * and 983,043 droplets at full strength -- is being cut. The pictures
			 * keep drawing the previous difference until the new one lands, so
			 * nothing blinks.
			 */
			async function refreshErosion() {
				const k = derived();
				const strength = value("erosion");
				if (strength <= 0) {
					// Turning the knob to nothing abandons whatever is running
					// and puts the ground back where the noise left it.
					if (erosion.delta === null && erosion.busy === "") return;
					erosionRun++;
					erosion.delta = null;
					erosion.cutKey = "";
					erosion.buildingKey = "";
					erosion.busy = "";
					erosion.report = null;
					askForRedraw(false);
					return;
				}
				const keys = erosionKeys(k);
				if (keys.cut === erosion.cutKey) return;
				// A redraw that changed none of these must not restart a run
				// that is already cutting the same world.
				if (erosion.busy !== "" && keys.cut === erosion.buildingKey) return;
				const token = ++erosionRun;
				erosion.buildingKey = keys.cut;
				const started = performance.now();

				if (erosion.level !== k.level) {
					erosion.busy = "numbering the planet";
					refreshPanel();
					await breathe();
					if (token !== erosionRun) return;
					erosion.grid = new CoarseGrid(k.level);
					erosion.level = k.level;
					erosion.base = null;
					erosion.baseKey = "";
					// The difference is one value per cell of the grid it was cut
					// on, so it goes with the grid. A redraw between here and the
					// end of the run draws ground the water has not reached yet.
					erosion.delta = null;
					erosion.cutKey = "";
				}
				const grid = erosion.grid;

				if (keys.ground !== erosion.baseKey) {
					const base = new Float64Array(grid.count);
					const seed = seedFromString(knobs.seed);
					const s = settingsFor(k);
					const said = [0.5, 1, 0, 0, 0];
					const over = k.peakScale - 1;
					// The same two lines the patch runs, at the grid's own
					// directions: the field, then sea level off it and the two
					// scales onto it. Sea level and the metre fit come from the
					// sphere pass that has already run, so this grid is the same
					// world the rest of the page is drawing.
					const SLICE = 20000;
					for (let from = 0; from < grid.count; from += SLICE) {
						const until = Math.min(grid.count, from + SLICE);
						for (let cell = from; cell < until; cell++) {
							const unitless = fieldAt(
								grid.directions[cell * 3],
								grid.directions[cell * 3 + 1],
								grid.directions[cell * 3 + 2],
								seed,
								k,
								s,
								said,
							);
							const d = unitless - field.sea;
							base[cell] =
								(d >= 0 ? d * field.up : d * field.down) +
								Math.max(0, said[4]) * field.up * over +
								field.drained;
						}
						erosion.busy = "raising the ground";
						erosion.done = until / grid.count;
						refreshPanel();
						await breathe();
						if (token !== erosionRun) return;
					}
					erosion.base = base;
					erosion.baseKey = keys.ground;
				}

				const before = slopeQuantiles(grid, erosion.base, k.cellMetres);
				const height = Float64Array.from(erosion.base);
				const seed = seedFromString(knobs.seed);
				const free = knobs.erosionWalk === "free";
				strandedDroplets = 0;
				const shared = {
					maxCut: knobs.erosionMaxCut,
					cutShare: knobs.erosionCutShare,
					inertia: knobs.erosionInertia,
				};
				const cut = free ? erodeFreeDroplets : erodeDroplets;
				const droplets = Math.round(strength * DROPLETS_PER_CELL * grid.count);
				const SLICE = 40000;
				for (let from = 0; from < droplets; from += SLICE) {
					cut(grid, height, seed, strength, k.cellMetres, {
						...shared,
						from,
						take: SLICE,
					});
					erosion.busy = "cutting the valleys";
					erosion.done = Math.min(1, (from + SLICE) / droplets);
					refreshPanel();
					await breathe();
					if (token !== erosionRun) return;
				}

				const delta = new Float64Array(grid.count);
				let moved = 0;
				let deepest = 0;
				for (let cell = 0; cell < grid.count; cell++) {
					const d = height[cell] - erosion.base[cell];
					delta[cell] = d;
					moved += Math.abs(d);
					if (-d > deepest) deepest = -d;
				}
				// What the Erosion picture saturates at. The deepest single cut
				// is a spike and would leave the rest of the map grey, so this is
				// the reach of all but the loudest fiftieth.
				const sorted = Float64Array.from(delta, Math.abs).sort();
				const scale = Math.max(
					0.01,
					sorted[Math.floor(sorted.length * 0.98)],
				);
				erosion.delta = delta;
				erosion.cutKey = keys.cut;
				erosion.busy = "";
				erosion.report = {
					droplets,
					scale,
					before,
					after: slopeQuantiles(grid, height, k.cellMetres),
					moved: moved / grid.count,
					deepest,
					stranded: free ? strandedDroplets / droplets : 0,
					ms: performance.now() - started,
				};
				askForRedraw(false);
			}

			/**
			 * How far erosion moved the ground under one direction, in metres.
			 *
			 * The three grid cells around the point, blended by the weights that
			 * put it between them -- which is the lookup the terrain generator
			 * uses to read the map, so a height here is a height the world would
			 * build. Zero everywhere until a run has finished.
			 */
			function erosionAt(x, y, z) {
				const delta = erosion.delta;
				if (delta === null) return 0;
				const grid = erosion.grid;
				const n = grid.n;
				const face = faceOf(x, y, z);
				const w = barycentricOf(face, x, y, z);
				const fi = Math.max(0, w[1] * n);
				const fj = Math.max(0, w[2] * n);
				const i0 = Math.min(n - 1, Math.floor(fi));
				const j0 = Math.min(n - 1 - i0, Math.floor(fj));
				const a = fi - i0;
				const b = fj - j0;
				const at = (i, j) => {
					if (i < 0 || j < 0 || i + j > n) return 0;
					const cell = grid.faceIndex[face * grid.slots + rank(i, j, n)];
					return cell < 0 ? 0 : delta[cell];
				};
				if (a + b <= 1)
					return (
						(1 - a - b) * at(i0, j0) +
						a * at(i0 + 1, j0) +
						b * at(i0, j0 + 1)
					);
				return (
					(1 - b) * at(i0 + 1, j0) +
					(1 - a) * at(i0, j0 + 1) +
					(a + b - 1) * at(i0 + 1, j0 + 1)
				);
			}

			// ---------------------------------------------------------------
			// The map, above the knobs.
			// ---------------------------------------------------------------

			const mapCanvas = document.getElementById("map");
			const mapCtx = mapCanvas.getContext("2d");

			/**
			 * The whole planet, flat, at whatever the picture is asking for.
			 *
			 * Longitude across and latitude down, which stretches the poles and
			 * is the only projection where a pixel's direction is two cosines
			 * and no case analysis. It is a picture of where things are, not a
			 * map anything is measured off.
			 *
			 * **Sea level, the metre scale and the drain all come from the
			 * field that is already generated**, so this is the same world the
			 * plane is drawing rather than a second one that happens to agree.
			 */
			function planetHeights(wide, tall) {
				const out = new Float32Array(wide * tall);
				const said = [0.5, 1, 0, 0, 0];
				const layer = new Float32Array(wide * tall);
				const raw = new Float32Array(wide * tall);
				const cut = new Float32Array(wide * tall);
				for (let r = 0; r < tall; r++) {
					const lat = (0.5 - (r + 0.5) / tall) * Math.PI;
					const ring = Math.cos(lat);
					const y = Math.sin(lat);
					for (let q = 0; q < wide; q++) {
						const lon = ((q + 0.5) / wide) * 2 * Math.PI - Math.PI;
						const x = ring * Math.cos(lon);
						const z = ring * Math.sin(lon);
						const unitless = fieldAt(
							x,
							y,
							z,
							field.seed,
							field.k,
							field.settings,
							said,
						);
						const d = unitless - field.sea;
						const at = r * wide + q;
						cut[at] = erosionAt(x, y, z);
						out[at] =
							(d >= 0 ? d * field.up : d * field.down) +
							Math.max(0, said[4]) * field.up * (field.k.peakScale - 1) +
							field.drained +
							cut[at];
						raw[at] = unitless;
						layer[at] = knobs.picture === "mountain" ? said[1] : said[0];
					}
				}
				return { out, raw, layer, cut };
			}

			/** Where on the flat planet the patch is standing. */
			function patchBox(wide, tall) {
				const half = field.span / 2 / field.k.radius;
				const lat = (knobs.latitude * Math.PI) / 180;
				const across = half / Math.max(0.15, Math.cos(lat));
				const x = ((knobs.longitude + 180) / 360) * wide;
				const y = (0.5 - knobs.latitude / 180) * tall;
				return {
					x: x - (across / (2 * Math.PI)) * wide,
					y: y - (half / Math.PI) * tall,
					w: Math.max(2, ((across * 2) / (2 * Math.PI)) * wide),
					h: Math.max(2, ((half * 2) / Math.PI) * tall),
				};
			}

			function drawPlanet() {
				// Half the samples while a knob is moving, for the same reason
				// the plane draws half its points: a picture that arrives after
				// the finger has stopped is not a picture of the knob.
				const wide = field.draft ? 128 : 256;
				const tall = wide / 2;
				if (mapCanvas.width !== wide) {
					mapCanvas.width = wide;
					mapCanvas.height = tall;
				}
				const { out, raw, layer, cut } = planetHeights(wide, tall);
				let low = Infinity;
				let high = -Infinity;
				for (const v of raw) {
					if (v < low) low = v;
					if (v > high) high = v;
				}
				const image = mapCtx.createImageData(wide, tall);
				const px = image.data;
				for (let n = 0; n < out.length; n++)
					paintGround(px, n * 4, out[n], raw[n], layer[n], low, high, cut[n]);
				mapCtx.putImageData(image, 0, 0);
				// The patch, outlined where it stands, so the plane and the map
				// are one place rather than two pictures.
				const box = patchBox(wide, tall);
				mapCtx.strokeStyle = "rgba(255, 180, 84, 0.9)";
				mapCtx.lineWidth = 1;
				mapCtx.strokeRect(box.x - 0.5, box.y - 0.5, box.w + 1, box.h + 1);
			}

			/**
			 * One pixel of ground, in whichever picture is selected.
			 *
			 * Shared by the patch and the planet, so the two never drift into
			 * describing the same height with two different colors.
			 */
			function paintGround(px, at, metres, raw, layerValue, rawLow, rawHigh, cut) {
				if (knobs.picture === "erosion") {
					// **What the water did, on its own.** Cut is red and fill is
					// blue, both against how many metres moved rather than
					// against the height they moved from, so a valley floor a
					// metre lower reads the same wherever it stands. Ground
					// nothing touched is the grey in the middle.
					//
					// The scale is what this run reached rather than a fixed
					// number of metres: how far erosion moves the ground depends
					// on the relief, the cell and the strength, and a picture
					// drawn against a constant is a flat wash on most worlds and
					// saturated on the rest. The Erosion row says what the scale
					// was.
					const scale = erosion.report ? erosion.report.scale : 1;
					const t = Math.max(-1, Math.min(1, (cut || 0) / scale));
					const grey = 0.18;
					px[at] = 255 * Math.pow(grey + Math.max(0, -t) * 0.75, 1 / 2.2);
					px[at + 1] = 255 * Math.pow(grey, 1 / 2.2);
					px[at + 2] = 255 * Math.pow(grey + Math.max(0, t) * 0.75, 1 / 2.2);
					px[at + 3] = 255;
					return;
				}
				if (knobs.picture === "terrain" || knobs.picture === "mountain") {
					const t = Math.max(0, Math.min(1, layerValue));
					px[at] = 255 * Math.pow(0.04 + 0.56 * t, 1 / 2.2);
					px[at + 1] = 255 * Math.pow(0.05 + 0.8 * t, 1 / 2.2);
					px[at + 2] = 255 * Math.pow(0.09 + 0.91 * t, 1 / 2.2);
					px[at + 3] = 255;
					return;
				}
				if (knobs.picture !== "ground") {
					// Grey, and stopping at a different step of the build:
					// Height reads elevation everywhere rather than naming a
					// block, and Raw stops before sea level has been taken off
					// the field at all.
					const t =
						knobs.picture === "raw"
							? Math.max(
									0,
									Math.min(
										1,
										(raw - rawLow) / Math.max(1e-6, rawHigh - rawLow),
									),
								)
							: Math.max(0, Math.min(1, (metres + 400) / 800));
					const v = 255 * Math.pow(t, 1 / 2.2);
					px[at] = v;
					px[at + 1] = v;
					px[at + 2] = knobs.picture === "raw" ? v * 0.9 : v;
					px[at + 3] = 255;
					return;
				}
				const band = BAND_COLORS[bandOf(metres)];
				// Land shades by how far it stands above the band it started in,
				// so a band is one material and still has shape in it. Sea is the
				// floor seen through water, so it shades by how much water is
				// over it -- which is why a beach shows sand and a deep does not.
				const c = [0, 0, 0];
				let shade;
				if (metres <= 0) {
					const through = 1 - Math.exp(metres / SEA_CLARITY);
					for (let ch = 0; ch < 3; ch++)
						c[ch] = band[ch] + (SEA_COLOR[ch] - band[ch]) * through;
					shade = 1;
				} else {
					for (let ch = 0; ch < 3; ch++) c[ch] = band[ch];
					shade = 0.72 + 0.28 * Math.min(1, (metres % 100) / 100);
				}
				if (knobs.contours) {
					// A ring every hundred metres, on the same grid the two
					// material lines sit on.
					const into = ((metres % 100) + 100) % 100;
					if (into < 4) shade *= 0.6;
				}
				// The picture is written to a screen, so the linear block colors
				// are given the curve a screen expects.
				px[at] = 255 * Math.pow(Math.min(1, c[0] * shade), 1 / 2.2);
				px[at + 1] = 255 * Math.pow(Math.min(1, c[1] * shade), 1 / 2.2);
				px[at + 2] = 255 * Math.pow(Math.min(1, c[2] * shade), 1 / 2.2);
				px[at + 3] = 255;
			}

			function drawMap() {
				if (knobs.mapView === "planet") return drawPlanet();
				const n = field.n;
				if (mapCanvas.width !== n) {
					mapCanvas.width = n;
					mapCanvas.height = n;
				}
				const image = mapCtx.createImageData(n, n);
				const px = image.data;
				for (let r = 0; r < n; r++)
					for (let q = 0; q < n; q++) {
						const from = r * (n + 1) + q;
						paintGround(
							px,
							((n - 1 - r) * n + q) * 4,
							field.height[from],
							field.raw[from],
							(knobs.picture === "mountain" ? field.mountain : field.terrain)[
								from
							],
							field.rawLow,
							field.rawHigh,
							field.cut[from],
						);
					}
				mapCtx.putImageData(image, 0, 0);
			}

			/**
			 * Click the planet to stand somewhere on it.
			 *
			 * **A latitude and a longitude are a place, and two sliders are
			 * not.** Finding a range by dragging them is a search with the
			 * answer already on screen, so the answer is what you click. The
			 * projection is longitude across and latitude down, which inverts
			 * to two divisions; the latitude is held inside its own slider's
			 * ends, because the patch is a tangent square and the poles are
			 * where that stops being one.
			 */
			mapCanvas.style.cursor = "crosshair";
			mapCanvas.addEventListener("click", (e) => {
				if (knobs.mapView !== "planet") return;
				const box = mapCanvas.getBoundingClientRect();
				const across = (e.clientX - box.left) / box.width;
				const down = (e.clientY - box.top) / box.height;
				const row = rowOf("latitude");
				knobs.longitude = Math.round(across * 360 - 180);
				knobs.latitude = Math.max(
					row.low,
					Math.min(row.high, Math.round((0.5 - down) * 180)),
				);
				askForRedraw(false);
			});

			// ---------------------------------------------------------------
			// The graph: what a knob does to the shape of the ground, as a
			// curve rather than as a picture.
			// ---------------------------------------------------------------

			const graphCanvas = document.getElementById("graph");
			const graphCtx = graphCanvas.getContext("2d");
			const graphSays = document.getElementById("graphsays");

			/**
			 * Height against one other quantity, drawn from the patch itself.
			 *
			 * **Raw is the one that explains the metre knobs.** The generator
			 * produces a unitless field in `[-1, 1]`; sea level is a percentile
			 * cut through it, and land and sea are then scaled apart. Plotted
			 * against the raw value that whole step is two straight lines
			 * meeting at sea level, and every knob that moves them shows as a
			 * change of slope or a shift of the hinge -- Land slides the hinge
			 * along, Relief tilts the upper line, Sea depth tilts the lower one.
			 *
			 * **Distance** is the ground itself, a section straight across the
			 * middle of the patch, which is where ridges and octaves read.
			 * **Rank** sorts every cell by height, so the curve says what
			 * fraction of the patch stands below any elevation -- a flat middle
			 * is a world of plains, a straight climb is a world of slopes.
			 */
			function drawGraph() {
				// Drawn in a fixed logical box and scaled up to whatever the
				// canvas is, so the text keeps its size on screen rather than
				// shrinking with the panel.
				const scale = graphCanvas.width / 320;
				const width = 320;
				const height = graphCanvas.height / scale;
				const g0 = graphCtx;
				g0.setTransform(1, 0, 0, 1, 0, 0);
				g0.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
				g0.setTransform(scale, 0, 0, scale, 0, 0);
				const pad = { left: 40, right: 8, top: 10, bottom: 24 };
				const plotW = width - pad.left - pad.right;
				const plotH = height - pad.top - pad.bottom;
				const g = graphCtx;
				g.fillStyle = "#0b0e13";
				g.fillRect(0, 0, width, height);

				const n = field.n;
				const across = n + 1;
				// **Every line of the patch, over one another.** One section
				// says what one line of ground does; all of them together draw
				// the silhouette -- how high the whole patch stands, where its
				// ridges are, and how much of it sits at any height. Which way
				// the lines run does not matter, which is why the only choice
				// here is x or z.
				const alongX = knobs.graphX === "x";
				const xLow = 0;
				const xHigh = n * field.step;
				const xLabel = `${Math.round(xHigh).toLocaleString()} m across the patch, every line of it`;

				let yLow = Math.min(field.lowest, 0);
				let yHigh = Math.max(field.highest, 1);
				const room = (yHigh - yLow) * 0.06 || 1;
				yLow -= room;
				yHigh += room;
				const toX = (v) => pad.left + ((v - xLow) / (xHigh - xLow)) * plotW;
				const toY = (v) =>
					pad.top + plotH - ((v - yLow) / (yHigh - yLow)) * plotH;

				// Sea level and the two material lines, so a curve can be read
				// against the elevations that decide what the ground is made of.
				const marks = [
					[0, "#3b6ea8", "sea"],
					[GROUND_LINES.rock, "#5a5a62", "rock"],
					[GROUND_LINES.snow, "#8a8f98", "snow"],
				];
				g.font = "9.5px system-ui, sans-serif";
				for (const [metres, color, name] of marks) {
					if (metres < yLow || metres > yHigh) continue;
					const y = toY(metres);
					g.strokeStyle = color;
					g.setLineDash(metres === 0 ? [] : [3, 3]);
					g.beginPath();
					g.moveTo(pad.left, y);
					g.lineTo(width - pad.right, y);
					g.stroke();
					g.setLineDash([]);
					g.fillStyle = color;
					g.fillText(name, 4, y + 3);
				}

				// The axes, labelled in the units the knobs are stated in.
				g.strokeStyle = "#2b3542";
				g.beginPath();
				g.moveTo(pad.left, pad.top);
				g.lineTo(pad.left, pad.top + plotH);
				g.lineTo(width - pad.right, pad.top + plotH);
				g.stroke();
				g.fillStyle = "#8b95a4";
				g.fillText(`${Math.round(yHigh)} m`, 4, pad.top + 8);
				g.fillText(`${Math.round(yLow)} m`, 4, pad.top + plotH - 1);
				g.textAlign = "center";
				g.fillText(xLabel, pad.left + plotW / 2, height - 6);
				g.textAlign = "left";

				// Faint, and many: where the lines bunch is where most of the
				// ground stands, so the silhouette carries the distribution as
				// well as the shape.
				const stride = Math.max(1, Math.floor(across / 90));
				g.lineWidth = 0.4;
				g.strokeStyle = "rgba(111, 208, 255, 0.15)";
				for (let line = 0; line < across; line += stride) {
					g.beginPath();
					for (let at = 0; at <= n; at++) {
						const h = alongX
							? field.height[line * across + at]
							: field.height[at * across + line];
						const x = toX(at * field.step);
						const y = toY(h);
						if (at === 0) g.moveTo(x, y);
						else g.lineTo(x, y);
					}
					g.stroke();
				}
				// The middle line solid, so there is one section to read
				// against the elevations rather than only a mass.
				g.lineWidth = 1.1;
				g.strokeStyle = "#6fd0ff";
				g.beginPath();
				const mid = n >> 1;
				for (let at = 0; at <= n; at++) {
					const h = alongX
						? field.height[mid * across + at]
						: field.height[at * across + mid];
					const x = toX(at * field.step);
					const y = toY(h);
					if (at === 0) g.moveTo(x, y);
					else g.lineTo(x, y);
				}
				g.stroke();
				g.lineWidth = 1;

				const off = Object.keys(using).filter((k) => !using[k]);
				graphSays.textContent =
					`${Math.ceil(across / stride)} lines · ground ${Math.round(field.lowest)} to ${Math.round(field.highest)} m` +
					(off.length ? ` · ${off.length} knob${off.length > 1 ? "s" : ""} bypassed` : "");
			}

			// ---------------------------------------------------------------
			// The plane, which is the point of the demo.
			// ---------------------------------------------------------------

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in vec3 normal;
			layout(location = 2) in float metres;
			layout(location = 3) in float raw;
			layout(location = 4) in float layerValue;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out float vMetres;
			out float vRaw;
			out float vLayer;
			void main() {
				vNormal = normal;
				vMetres = metres;
				vRaw = raw;
				vLayer = layerValue;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in float vMetres;
			in float vRaw;
			in float vLayer;
			uniform vec3 sun;
			uniform float rockLine;
			uniform float snowLine;
			uniform float contours;
			uniform int picture;
			uniform int wire;
			uniform vec2 rawRange;

			void main() {

				}

				// they read elevation everywhere rather than saying which of the
				// four blocks stands there, and Raw stops before sea level has
				// been taken off the field at all.
				if (picture == 1) {
					float t = clamp((vMetres + 400.0) / 800.0, 0.0, 1.0);
					vec3 g = mix(vec3(0.03, 0.03, 0.04), vec3(1.0), t);
					vec3 n1 = normalize(vNormal);
					float l1 = 0.28 + 0.72 * max(0.0, dot(n1, normalize(sun)));

				if (picture == 3) {
					// One control layer on its own, over its own full range:
					// dark where it says nothing, bright where it says most.
					vec3 g = mix(vec3(0.04, 0.05, 0.09), vec3(0.6, 0.85, 1.0), clamp(vLayer, 0.0, 1.0));
					vec3 n3 = normalize(vNormal);
					float l3 = 0.45 + 0.55 * max(0.0, dot(n3, normalize(sun)));

				}
				if (picture == 2) {
					float t = clamp(
						(vRaw - rawRange.x) / max(1e-6, rawRange.y - rawRange.x),
						0.0,
						1.0
					);
					vec3 g = mix(vec3(0.02, 0.04, 0.10), vec3(1.0, 0.98, 0.90), t);
					vec3 n2 = normalize(vNormal);
					float l2 = 0.35 + 0.65 * max(0.0, dot(n2, normalize(sun)));

				}

				if (vMetres <= 0.0) {
					// Bare sand seen through water, because the ocean is a
					// surface and holds no blocks. What makes a deep blue is
					// how much water a look passes through to reach the floor.
					tint = mix(vec3(0.76, 0.70, 0.50), vec3(0.12, 0.32, 0.55),
						1.0 - exp(vMetres / 45.0));

					tint = vec3(0.26, 0.44, 0.19);
				} else if (vMetres < snowLine) {
					tint = vec3(0.42, 0.42, 0.45);
				} else {
					tint = vec3(0.92, 0.94, 0.97);
				}
				if (contours > 0.5) {
					float into = fract(vMetres / 100.0) * 100.0;
					float edge = smoothstep(0.0, 3.0, into) * smoothstep(100.0, 97.0, into);
					tint *= mix(0.62, 1.0, edge);
				}
				vec3 n = normalize(vNormal);
				float lit = 0.28 + 0.72 * max(0.0, dot(n, normalize(sun)));

			function compile(kind, source) {

			const uViewProj = gl.getUniformLocation(program, "viewProj");
			const uSun = gl.getUniformLocation(program, "sun");
			const uRock = gl.getUniformLocation(program, "rockLine");
			const uSnow = gl.getUniformLocation(program, "snowLine");
			const uContours = gl.getUniformLocation(program, "contours");
			const uPicture = gl.getUniformLocation(program, "picture");
			const uWire = gl.getUniformLocation(program, "wire");
			const uRawRange = gl.getUniformLocation(program, "rawRange");

			gl.bindVertexArray(vao);

			const normalBuffer = gl.createBuffer();
			const metreBuffer = gl.createBuffer();
			const rawBuffer = gl.createBuffer();
			const layerBuffer = gl.createBuffer();
			const indexBuffer = gl.createBuffer();

			// over the same vertices -- one edge east and one north per point.
			const lineBuffer = gl.createBuffer();
			let indexCount = 0;
			let lineCount = 0;
			let meshCells = -1;

			gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
			gl.enableVertexAttribArray(0);
			gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
			gl.enableVertexAttribArray(1);
			gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, metreBuffer);
			gl.enableVertexAttribArray(2);
			gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
			gl.bindBuffer(gl.ARRAY_BUFFER, rawBuffer);

			gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 0, 0);

			 * per cell, so the ratio of how wide a cell is to how tall the ground
			 * gets is the engine's, and a ramp that reads as a hillside here reads
			 * as one in the world.
			 */
			function buildMesh() {
				const n = field.n;
				const across = n + 1;
				const count = across * across;
				const cell = field.step;
				const lift = knobs.exaggeration;
				const positions = new Float32Array(count * 3);
				const normals = new Float32Array(count * 3);
				const metres = new Float32Array(count);
				const raws = new Float32Array(count);
				const layerOf = new Float32Array(count);
				const shown =
					knobs.picture === "mountain" ? field.mountain : field.terrain;
				const half = (n / 2) * cell;

				for (let r = 0; r <= n; r++) {
					for (let q = 0; q <= n; q++) {
						const at = r * across + q;
						const h = field.height[at];
						positions[at * 3] = q * cell - half;
						positions[at * 3 + 1] = h * lift;
						positions[at * 3 + 2] = r * cell - half;
						metres[at] = h;
						raws[at] = field.raw[at];
						layerOf[at] = shown[at];
					}
				}
				// A normal from the two neighbours each way, which is the slope
				// of the surface at that point rather than of one triangle.
				for (let r = 0; r <= n; r++) {
					for (let q = 0; q <= n; q++) {
						const at = r * across + q;
						const west = field.height[r * across + Math.max(0, q - 1)];
						const east = field.height[r * across + Math.min(n, q + 1)];
						const south = field.height[Math.max(0, r - 1) * across + q];
						const north = field.height[Math.min(n, r + 1) * across + q];
						const dx = ((east - west) * lift) / (2 * cell);
						const dz = ((north - south) * lift) / (2 * cell);
						const len = Math.hypot(dx, 1, dz);
						normals[at * 3] = -dx / len;
						normals[at * 3 + 1] = 1 / len;
						normals[at * 3 + 2] = -dz / len;

				}

				gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, normals, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, metreBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, metres, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, rawBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, raws, gl.DYNAMIC_DRAW);
				gl.bindBuffer(gl.ARRAY_BUFFER, layerBuffer);
				gl.bufferData(gl.ARRAY_BUFFER, layerOf, gl.DYNAMIC_DRAW);

				// The index list only changes when the grid does.
				if (meshCells !== n) {
					const indices = new Uint32Array(n * n * 6);
					let at = 0;
					for (let r = 0; r < n; r++) {
						for (let q = 0; q < n; q++) {
							const a = r * across + q;
							indices[at++] = a;
							indices[at++] = a + across;
							indices[at++] = a + 1;
							indices[at++] = a + 1;
							indices[at++] = a + across;
							indices[at++] = a + across + 1;
						}
					}
					gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
					gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
					indexCount = indices.length;

					const lines = new Uint32Array(n * across * 4);
					let line = 0;
					for (let r = 0; r <= n; r++)
						for (let q = 0; q <= n; q++) {
							const a = r * across + q;
							if (q < n) {
								lines[line++] = a;
								lines[line++] = a + 1;
							}
							if (r < n) {
								lines[line++] = a;
								lines[line++] = a + across;
							}
						}
					gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineBuffer);
					gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, lines, gl.STATIC_DRAW);
					lineCount = line;
					meshCells = n;
				}
			}

			// ---- the camera ----
			const camera = { yaw: -0.7, pitch: 0.62, distance: 1.6, lift: 0 };

			function multiply(a, b) {
				const out = new Float32Array(16);
				for (let c = 0; c < 4; c++)
					for (let r = 0; r < 4; r++) {
						let s = 0;
						for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
						out[c * 4 + r] = s;
					}
				return out;
			}
			function perspective(fov, aspect, near, far) {
				const f = 1 / Math.tan(fov / 2);
				const out = new Float32Array(16);
				out[0] = f / aspect;
				out[5] = f;
				out[10] = (far + near) / (near - far);
				out[11] = -1;
				out[14] = (2 * far * near) / (near - far);
				return out;
			}
			function lookAt(eye, at, upHint) {
				const f = norm([at[0] - eye[0], at[1] - eye[1], at[2] - eye[2]]);
				const s = norm(cross(f, upHint));
				const u = cross(s, f);
				const out = new Float32Array(16);
				out[0] = s[0]; out[4] = s[1]; out[8] = s[2];
				out[1] = u[0]; out[5] = u[1]; out[9] = u[2];
				out[2] = -f[0]; out[6] = -f[1]; out[10] = -f[2];
				out[12] = -(s[0] * eye[0] + s[1] * eye[1] + s[2] * eye[2]);
				out[13] = -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]);
				out[14] = f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2];
				out[15] = 1;
				return out;
			}
			function cross(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],

			function render() {
				const dpr = Math.min(2, window.devicePixelRatio || 1);

				const height = Math.max(1, Math.round(view.clientHeight * dpr));

					view.width = width;
					view.height = height;

				if (!field) return;

				const span = field.span;
				const away = span * camera.distance;
				const eye = [
					Math.sin(camera.yaw) * Math.cos(camera.pitch) * away,
					Math.sin(camera.pitch) * away + camera.lift * span,
					Math.cos(camera.yaw) * Math.cos(camera.pitch) * away,
				];
				const proj = perspective(
					0.9,
					width / height,
					span * 0.005,
					span * 12,

			// ---------------------------------------------------------------
			// The panel, and the loop that keeps it live.
			// ---------------------------------------------------------------

			const facts = document.getElementById("facts");
			const rows = new Map();

			/**
			 * A curve you drag, over one control field's range.
			 *
			 * Across is the raw control value, `-1` to `1`. Up is what it
			 * controls, `0` to `1`. Drag a point to move it, click the empty
			 * curve to add one, shift-click a point to take it away. The two
			 * ends keep their x so the curve always spans the whole range.
			 */
			function makeSpline(canvas, key, onChange) {
				const g = canvas.getContext("2d");
				const pad = 6;
				const toX = (v) => pad + ((v + 1) / 2) * (canvas.width - pad * 2);
				const toY = (v) => canvas.height - pad - v * (canvas.height - pad * 2);
				const fromX = (px) =>
					((px - pad) / (canvas.width - pad * 2)) * 2 - 1;
				const fromY = (py) =>
					(canvas.height - pad - py) / (canvas.height - pad * 2);

				function draw() {
					const points = knobs[key];
					g.clearRect(0, 0, canvas.width, canvas.height);
					g.fillStyle = "#0b0e13";
					g.fillRect(0, 0, canvas.width, canvas.height);
					// A line at the middle of the control's range, because that
					// is where half the world sits and it is the only landmark
					// on an otherwise featureless box.
					// The world's own distribution, behind everything: how much
					// planet sits under each slice of this curve. Dim, because
					// it is context for the curve rather than the thing being
					// edited.
					const counts = field && field.tally ? field.tally[key] : null;
					if (counts && field.tallest > 0) {
						g.fillStyle = "rgba(111, 208, 255, 0.16)";
						const wide = (canvas.width - pad * 2) / SPLINE_BINS;
						for (let n = 0; n < SPLINE_BINS; n++) {
							const tall =
								(counts[n] / field.tallest) * (canvas.height - pad * 2);
							if (tall <= 0) continue;
							g.fillRect(
								pad + n * wide,
								canvas.height - pad - tall,

					g.moveTo(toX(0), pad);
					g.lineTo(toX(0), canvas.height - pad);
					g.stroke();
					// **The gate is drawn on the curve it cuts.** Mountain line
					// is a height on this curve's own vertical axis, so saying it
					// as a number in another group would make the reader hold two
					// pictures at once. Above the amber line the mountain layer
					// is let through; below it, nothing is.
					if (key === "terrainSpline" && knobs.merge === "gated") {
						let lo = Infinity;
						let hi = -Infinity;
						for (const [, y] of points) {
							if (y < lo) lo = y;
							if (y > hi) hi = y;
						}
						const at = toY(lo + knobs.mountainLine * (hi - lo));
						g.strokeStyle = "rgba(255, 180, 84, 0.55)";
						g.setLineDash([3, 3]);
						g.beginPath();
						g.moveTo(pad, at);
						g.lineTo(canvas.width - pad, at);
						g.stroke();
						g.setLineDash([]);
					}
					g.strokeStyle = "#6fd0ff";
					g.lineWidth = 1.5;
					g.beginPath();
					for (let px = pad; px <= canvas.width - pad; px++) {
						const y = toY(splineAt(points, fromX(px)));
						if (px === pad) g.moveTo(px, y);
						else g.lineTo(px, y);
					}
					g.stroke();
					g.fillStyle = "#e8ecf2";
					for (const [x, y] of points) {
						g.beginPath();
						g.arc(toX(x), toY(y), 3, 0, Math.PI * 2);
						g.fill();
					}
				}

				let dragging = -1;
				const spot = (e) => {
					const box = canvas.getBoundingClientRect();
					return [
						((e.clientX - box.left) / box.width) * canvas.width,
						((e.clientY - box.top) / box.height) * canvas.height,
					];
				};
				const nearest = (px, py) => {
					const points = knobs[key];
					let best = -1;
					let far = 12;
					for (let n = 0; n < points.length; n++) {
						const d = Math.hypot(toX(points[n][0]) - px, toY(points[n][1]) - py);
						if (d < far) {
							far = d;
							best = n;
						}
					}
					return best;
				};
				canvas.addEventListener("pointerdown", (e) => {
					e.preventDefault();
					const [px, py] = spot(e);
					const at = nearest(px, py);
					const points = knobs[key];
					if (at >= 0 && e.shiftKey) {
						// Never below two, or the curve stops being a curve.
						if (points.length > 2 && at > 0 && at < points.length - 1) {
							points.splice(at, 1);
							draw();
							onChange();
						}
						return;
					}
					if (at >= 0) {
						dragging = at;
					} else {
						const x = Math.max(-1, Math.min(1, fromX(px)));
						const y = Math.max(0, Math.min(1, fromY(py)));
						points.push([x, y]);
						points.sort((a, b) => a[0] - b[0]);
						dragging = points.findIndex((p) => p[0] === x && p[1] === y);
						draw();
						onChange();
					}
					canvas.setPointerCapture(e.pointerId);
				});
				canvas.addEventListener("pointermove", (e) => {
					if (dragging < 0) return;
					const points = knobs[key];
					const [px, py] = spot(e);
					const first = dragging === 0;
					const last = dragging === points.length - 1;
					// The ends hold their x, so the curve always covers the whole
					// range and nothing has to guess what happens past it.
					if (!first && !last)
						points[dragging][0] = Math.max(
							points[dragging - 1][0] + 0.01,
							Math.min(points[dragging + 1][0] - 0.01, fromX(px)),
						);
					points[dragging][1] = Math.max(0, Math.min(1, fromY(py)));
					draw();
					onChange();
				});
				const drop = () => {
					dragging = -1;
				};
				canvas.addEventListener("pointerup", drop);
				canvas.addEventListener("pointercancel", drop);
				return draw;
			}

			function buildPanel() {
				const host = document.getElementById("knobs");
				for (const group of KNOBS) {
					// **A section folds, because two whole noise layers do not
					// fit on one screen.** Each layer carries its own frequency,
					// octave count, falloff and offsets, so the panel is long by
					// construction rather than by neglect, and the one being
					// tuned is the one that needs to be visible.
					const set = document.createElement("details");
					set.className = "group";
					set.open = group.open !== false;
					const legend = document.createElement("summary");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						const wrap = document.createElement("div");
						wrap.className = "knob" + (row.type === "check" ? " check" : "");
						const label = document.createElement("label");
						label.textContent = row.label;
						let input;
						if (row.type === "spline") {
							input = document.createElement("canvas");
							input.width = 280;
							input.height = 84;
							input.className = "curve";
						} else if (row.type === "select") {
							input = document.createElement("select");
							for (const option of row.options) {
								const o = document.createElement("option");
								o.value = option;
								o.textContent = option;
								input.append(o);
							}
							input.value = knobs[row.key];
						} else if (row.type === "text") {
							input = document.createElement("input");
							input.type = "text";
							input.value = knobs[row.key];
						} else if (row.type === "check") {
							input = document.createElement("input");
							input.type = "checkbox";
							input.checked = knobs[row.key];
						} else {
							input = document.createElement("input");
							input.type = "range";
							input.min = row.low;
							input.max = row.high;
							input.step = row.step;
							input.value = knobs[row.key];
						}
						if (row.type === "spline") {
							wrap.classList.add("curved");
							// **The curve takes as many points as you give it**,
							// and nothing on screen said so -- the rule lived in
							// a source comment, so the shipped four read as the
							// four you get. The ends hold their x and nothing
							// else is fixed.
							const help = document.createElement("p");
							help.className = "curve-help";
							help.textContent =
								"drag a point · click the curve to add one · " +
								"shift-click a point to remove it · " +
								"the two ends keep their left/right position, everything else is free";
							wrap.append(label, input, help);
							set.append(wrap);
							const redraw = makeSpline(input, row.key, () =>
								askForRedraw(),
							);
							rows.set(row.key, { row, wrap, redraw });
							continue;
						}
						const readout = document.createElement("output");
						// A switch, where the knob has a value that removes its
						// own effect. Unticked, the knob is set to that value and
						// its slider greys: what is left on screen is the ground
						// this knob is not contributing to, which is the only way
						// to see what it was contributing.
						let bypass = null;
						if (row.off !== undefined) {
							bypass = document.createElement("input");
							bypass.type = "checkbox";
							bypass.checked = using[row.key] !== false;
							input.disabled = !bypass.checked;
							bypass.title = `off sets ${row.label} to ${row.off}`;
							bypass.addEventListener("input", () => {
								using[row.key] = bypass.checked;
								input.disabled = !bypass.checked;
								askForRedraw();
							});
						}
						if (row.type === "check") wrap.append(input, label);
						else if (bypass) {
							wrap.classList.add("switched");
							wrap.append(bypass, label, readout, input);
						} else wrap.append(label, readout, input);
						// **A knob whose number is a ratio says what the ratio
						// is worth.** The readout can only repeat the slider;
						// what the world did with it is a second line.
						let note = null;
						if (row.note) {
							note = document.createElement("p");
							note.className = "knob-note";
							wrap.append(note);
						}
						set.append(wrap);
						rows.set(row.key, { row, wrap, input, readout, bypass, note });
						// **Every move redraws.** `input` rather than `change`, so
						// the ground answers while the slider is still moving --
						// which is the only way to feel what a knob does.
						input.addEventListener("input", () => {
							if (row.type === "check") knobs[row.key] = input.checked;
							else if (row.type === "select" || row.type === "text")
								knobs[row.key] = input.value;
							else knobs[row.key] = Number(input.value);
							askForRedraw();
						});
					}
					host.append(set);
				}
			}

			/**
			 * Put the panel back in step with the knobs.
			 *
			 * **A row with no meaning comes off; a row that cannot reach the
			 * world goes grey.** Those are different states. `shownWhen` hides a
			 * question that does not apply -- Mountain line under a merge that
			 * has no gate -- because a disabled row is a question the reader has
			 * to answer before dismissing. `enabledWhen` greys a row that still
			 * means something and is turned off elsewhere, which is every row of
			 * a layer whose switch is up.
			 */
			function refreshPanel() {
				for (const {
					row,
					wrap,
					readout,
					input,
					redraw,
					note,
					bypass,
				} of rows.values()) {
					const shown = row.shownWhen ? row.shownWhen(knobs) : true;
					wrap.classList.toggle("hidden", !shown);
					// **A row that cannot reach the world goes grey.** Switching
					// a layer off leaves eight sliders that still move and still
					// write themselves into the link, describing a layer nothing
					// is reading -- so they say so, and the switch that turned
					// them off stays live beside them.
					const live = row.enabledWhen ? row.enabledWhen(knobs) : true;
					wrap.classList.toggle("off", !live);
					if (input) input.disabled = !live || (bypass && !bypass.checked);
					if (bypass) bypass.disabled = !live;
					if (note) note.innerHTML = shown ? row.note() : "";
					if (row.type === "spline") {
						if (shown && redraw) redraw();
						continue;
					}

					// **A widget must show what the knob holds.** Anything that
					// changes a knob without going through its own input -- a
					// link, a settle, another knob's narrowing -- leaves the
					// panel describing a world that is not on screen.
					if (row.type === "select" || row.type === "text") {
						if (input.value !== String(knobs[row.key]))
							input.value = knobs[row.key];
					} else if (row.type === "check") {
						if (input.checked !== !!knobs[row.key])
							input.checked = !!knobs[row.key];
					}
					if (row.digits !== undefined && !row.type) {
						const live = liveRange(row);
						if (Number(input.min) !== live.low) input.min = live.low;
						if (Number(input.max) !== live.high) input.max = live.high;
						if (Number(input.value) !== knobs[row.key])
							input.value = knobs[row.key];
					}
					if (row.digits !== undefined) {
						// **A switched-off knob shows the value in use, not the
						// one its slider is parked at.** The slider greys, which
						// says the knob is off; it does not say what off is
						// worth, and a readout of 1790 beside a world built from
						// 50 is a readout that lies.
						const inUse = value(row.key);
						let text =
							Number(inUse).toFixed(row.digits) +
							(row.unit ? " " + row.unit : "");
						if (using[row.key] === false)
							text = `${text} · off`;
						// **Say when a knob did not get what it asked for.** The
						// map's fineness is a level, so its cell is the planet
						// halved a whole number of times and stops at level 9:
						// below that the slider moves and the map does not.
						if (
							row.key === "coarseSpacing" &&
							Math.abs(field.k.cellMetres - knobs.coarseSpacing) >= 1
						)
							text += ` → ${field.k.cellMetres.toFixed(0)} m`;
						readout.textContent = text;
					} else readout.textContent = "";
				}
				const k = field.k;
				facts.innerHTML =
					`radius <b>${Math.round(k.radius).toLocaleString()} m</b> · ` +
					`map level <b>${k.level}</b> · cell <b>${k.cellMetres.toFixed(1)} m</b><br>` +
					`patch <b>${Math.round(field.span).toLocaleString()} m</b> across, ` +
					`${field.n}×${field.n} cells<br>` +
					`ground <b>${Math.round(field.lowest)}</b> to ` +
					`<b>${Math.round(field.highest)} m</b> · ` +
					`land here <b>${Math.round(field.landShare * 100)}%</b><br>` +
					// **The whole planet, not this patch.** The material lines
					// are absolute metres and a patch is a place, so a patch can
					// be all snow on a world that is mostly grass. This is the
					// number to tune Relief against.
					`planet: <b>${(field.bands[0] * 100).toFixed(0)}%</b> sea · ` +
					`<b>${(field.bands[1] * 100).toFixed(0)}%</b> grass · ` +
					`<b>${(field.bands[2] * 100).toFixed(0)}%</b> rock · ` +
					`<b>${(field.bands[3] * 100).toFixed(0)}%</b> snow<br>` +
					`redrawn in <b>${cost.toFixed(0)} ms</b>` +
					(field.draft ? " · settling" : "") +
					"<br>" +
					(knobs.exaggeration === 1
						? `true scale · relief is <b>${(
								(100 * (field.highest - field.lowest)) /
								field.span
							).toFixed(1)}%</b> of the patch<br>`
						: `<span style="color:#ffb454">drawn <b>${knobs.exaggeration}x</b> taller than the world builds it</span><br>`) +
					// **The field and the metres are two different things, and
					// only one of them is noise.** Relief is what turns the
					// unitless field into metres of land and Sea depth does the
					// same for the floor, so at zero there is a perfectly good
					// field and no ground -- which reads as "noise but no
					// height" and looks like a broken generator. Say which knob
					// it is.
					(value("relief") === 0 || value("seaDepth") === 0
						? `<span style="color:#ffb454">` +
							(value("relief") === 0 && value("seaDepth") === 0
								? "Relief and Sea depth are both <b>0</b>, so the field has no metres at all"
								: value("relief") === 0
									? "Relief is <b>0</b>, so land has no height"
									: "Sea depth is <b>0</b>, so the floor is flat") +
							" — the noise is there, the scale that turns it into metres is not." +
							"</span><br>"
						: "") +
					(field.drained > 0
						? `sea drained <b>${field.drained.toLocaleString()} m</b> — ` +
							`the tallest point is <b>${Math.round(
								value("relief") + field.drained,
							).toLocaleString()} m</b> above the water<br>`
						: "") +
					// Each layer's frequency in the units the engine's panel
					// states, so a setting found here can be carried across: the
					// engine asks for the widest feature in metres, which is the
					// radius divided by the frequency. And the narrowest octave,
					// because ground the map cannot draw is ground the world
					// does not have.
					["terrain", "mountain"]
						.map((which) => {
							const frequency = Math.max(1e-6, k[which + "Frequency"]);
							const widest = k.radius / frequency;
							const narrowest =
								widest /
								knobs[which + "Lacunarity"] **
									(value(which + "Octaves") - 1);
							return (
								`${which} <b>${k[which + "Frequency"].toFixed(2)}</b> — ` +
								`widest <b>${Math.round(widest).toLocaleString()} m</b>, ` +
								`narrowest <b>${Math.round(narrowest).toLocaleString()} m</b>` +
								(narrowest < k.cellMetres
									? ' <span style="color:#ffb454">narrower than a cell</span>'
									: "")
							);
						})
						.join("<br>");
			}

			/**
			 * Redraw, coarsely while a knob is moving and exactly once it stops.
			 *
			 * **A slider has to answer inside a frame or it cannot be felt.**
			 * The whole chain at full resolution is a few tens of milliseconds
			 * for the smooth bases and a few hundred for cellular, which reads
			 * as lag rather than as ground. So a move draws half the points --
			 * the same patch, sampled every other cell, which is a quarter of
			 * the work -- and a pause of a fifth of a second draws all of them.
			 * The draft is the same field, never a different one: the sea level
			 * and the metre scale are read off the sphere either way, so the
			 * coastline does not walk while the slider does.
			 */
			let pending = false;
			let settleTimer = 0;
			let cost = 0;
			function askForRedraw(draft = true) {
				clearTimeout(settleTimer);
				if (draft) settleTimer = setTimeout(() => askForRedraw(false), 200);
				if (pending) return;
				pending = true;
				requestAnimationFrame(() => {
					pending = false;
					const started = performance.now();
					settle();
					generate(draft ? Math.max(24, knobs.cells >> 1) : knobs.cells);
					buildMesh();
					drawMap();
					drawGraph();
					cost = performance.now() - started;
					refreshPanel();
					if (!draft) {
						writeUrl();
						// **Water runs on the settled world, never on the
						// draft.** A drag redraws the ground every frame and
						// erosion is a pass over the whole planet, so it waits
						// for the finger to stop -- and until it lands, the
						// pictures keep the cut from the last run.
						refreshErosion();
					}
					render();
				});
			}

			// ---- turning and zooming ----
			let dragging = null;
			view.addEventListener("pointerdown", (e) => {
				dragging = { x: e.clientX, y: e.clientY, shift: e.shiftKey };
				view.setPointerCapture(e.pointerId);
			});
			view.addEventListener("pointermove", (e) => {
				if (!dragging) return;
				const dx = e.clientX - dragging.x;
				const dy = e.clientY - dragging.y;
				dragging.x = e.clientX;
				dragging.y = e.clientY;
				if (dragging.shift) camera.lift += dy * 0.002;
				else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(
						0.03,
						Math.min(1.5, camera.pitch + dy * 0.005),
					);
				}
				render();
			});
			const stop = () => {
				dragging = null;
			};
			view.addEventListener("pointerup", stop);
			view.addEventListener("pointercancel", stop);
			view.addEventListener(
				"wheel",
				(e) => {
					e.preventDefault();
					camera.distance = Math.max(
						0.15,
						Math.min(6, camera.distance * Math.exp(e.deltaY * 0.001)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", render);

			fromParams(new URLSearchParams(location.search));
			buildPanel();
			// The first draw goes through the same timed path every later one
			// does, so the cost on screen is a real number from the start.
			const booted = performance.now();
			settle();
			generate();
			buildMesh();
			drawMap();
			drawGraph();
			cost = performance.now() - booted;
			refreshPanel();
			render();
			refreshErosion();
		</script>
	</body>
</html>
