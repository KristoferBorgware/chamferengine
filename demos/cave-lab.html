			}

				<p class="sub">
					Two ways to carve a cave, on one patch of hexagon columns: a
					<b>plan</b> drawn in 2D and extruded, or the <b>sheet</b> the
					engine carves today. The same seed, the same ground, the same
					measurements.
				</p>

			</div>
			<div id="knobs"></div>
		</div>
		<script>
			// =============================================================
			// The noise, copied from the engine so the picture is the world's.
			// =============================================================

			/** `2^32`, the divisor that turns a `uint32` into a fraction of one. */
			const U32 = 4294967296;

			/**
			 * Three integer coordinates and a seed, mixed into a value in `[0, 1)`.
			 *
			 * Every step is `uint32`: a wrapping multiply, an xor, a logical shift.
			 * No product runs past `2^53`, so there is nothing here for one language
			 * to round differently from another.
			 */
			function hash3(x, y, z, seed) {
				let h =
					(Math.imul(x | 0, 374761393) +
						Math.imul(y | 0, 668265263) +
						Math.imul(z | 0, 1274126177) +
						Math.imul(seed | 0, 1013904223)) >>>
				0;
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				h = (h ^ (h >>> 16)) >>> 0;
				return h / U32;
			}

			function seedFromString(text) {
				let h = 2166136261 >>> 0;
				for (let i = 0; i < text.length; i++) {
					h = (h ^ text.charCodeAt(i)) >>> 0;
					h = Math.imul(h, 16777619) >>> 0;
				}
				// The hash's own finaliser, or two seeds a character apart start on
				// near-identical planets.
				h = (h ^ (h >>> 13)) >>> 0;
				h = Math.imul(h, 1274126177) >>> 0;
				return (h ^ (h >>> 16)) >>> 0;
			}

			/** Quintic. Smoothstep jumps curvature by 12 at every lattice plane. */
			function fade(t) {
				return t * t * t * (t * (t * 6 - 15) + 10);
			}

			/**
			 * How many lattice lookups the last build took.
			 *
			 * The unit the two carves differ in. A plan reads its field once a
			 * column and fills the slab it decided; a sheet reads once a **layer**,
			 * because a passage may be at any depth and asking is the only way to
			 * find out. Counted rather than reasoned about, because both carves also
			 * pay for the ground over them and it is the total that is the bill.
			 */
			let noiseLookups = 0;

			function valueNoise3(px, py, pz, seed) {
				noiseLookups++;
				const x0 = Math.floor(px);
				const y0 = Math.floor(py);
				const z0 = Math.floor(pz);
				const fx = fade(px - x0);
				const fy = fade(py - y0);
				const fz = fade(pz - z0);
				const c000 = hash3(x0, y0, z0, seed);
				const c100 = hash3(x0 + 1, y0, z0, seed);
				const c010 = hash3(x0, y0 + 1, z0, seed);
				const c110 = hash3(x0 + 1, y0 + 1, z0, seed);
				const c001 = hash3(x0, y0, z0 + 1, seed);
				const c101 = hash3(x0 + 1, y0, z0 + 1, seed);
				const c011 = hash3(x0, y0 + 1, z0 + 1, seed);
				const c111 = hash3(x0 + 1, y0 + 1, z0 + 1, seed);
				const x00 = c000 + (c100 - c000) * fx;
				const x10 = c010 + (c110 - c010) * fx;
				const x01 = c001 + (c101 - c001) * fx;
				const x11 = c011 + (c111 - c011) * fx;
				const y0v = x00 + (x10 - x00) * fy;
				const y1v = x01 + (x11 - x01) * fy;
				return (y0v + (y1v - y0v) * fz) * 2 - 1;
			}

			/**
			 * How far an octave's own offset may reach, in lattice units.
			 */
			const OCTAVE_SPREAD = 1000;

			/**
			 * Octaves at lacunarity 2 and gain 0.5, low octave first, divided by the
			 * summed amplitude.
			 *
			 * **Every octave gets its own offset, hashed from the seed**, exactly as
			 * the engine's `octaveNoise` does it. Without one, two octaves of the
			 * same seeded lattice share their zero crossings wherever their
			 * frequencies land near a whole multiple, and a field read for its zero
			 * set -- which is the whole of this page -- grows straight passages on a
			 * grain that has nothing to do with the ground.
			 */
			function fbm(x, y, z, octaves, seed) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = 1;
				for (let o = 0; o < octaves; o++) {
					const ox = (2 * hash3(o, 0, 0, seed) - 1) * OCTAVE_SPREAD;
					const oy = (2 * hash3(o, 1, 0, seed) - 1) * OCTAVE_SPREAD;
					const oz = (2 * hash3(o, 2, 0, seed) - 1) * OCTAVE_SPREAD;
					sum +=
						amplitude *
						valueNoise3(x * f + ox, y * f + oy, z * f + oz, seed);
					total += amplitude;
					amplitude *= 0.5;
					f *= 2;
				}
				return sum / total;
			}

			/**
			 * The engine's own `fbm`, which is **not** its `octaveNoise`.
			 *
			 * `caveDensity` reaches for this one, and this one gives every octave
			 * the same seed and no offset. That is the grain hazard `octaveNoise`
			 * exists to avoid: two octaves of one seeded lattice share their zero
			 * crossings wherever their frequencies land near a whole multiple. It is
			 * kept faithful here rather than fixed, because the point of having both
			 * carves on one page is to compare what the engine actually runs.
			 */
			function fbmPlain(x, y, z, octaves, seed) {
				let sum = 0;
				let amplitude = 1;
				let total = 0;
				let f = 1;
				for (let o = 0; o < octaves; o++) {
					sum += amplitude * valueNoise3(x * f, y * f, z * f, seed);
					total += amplitude;
					amplitude *= 0.5;
					f *= 2;
				}
				return sum / total;
			}

			// =============================================================
			// The lattice.
			//
			// Cells are the vertices of a triangular lattice and each one owns
			// the hexagon around it, which is what the engine's cells are --
			// invariant 3, at a radius where nothing is curved. Axial `(i, j)`
			// here is the engine's `(q, r)` inside a chunk, so moving this to
			// the planet swaps `cellCenter` for `latticePosition` and changes
			// nothing else about the carve.
			// =============================================================

			const ROOT3 = Math.sqrt(3);

			/** The six neighbours, counter-clockwise from the `+i` step. */
			const STEPS = [
				[1, 0],
				[0, 1],
				[-1, 1],
				[-1, 0],
				[0, -1],
				[1, -1],
			];

			/**
			 * Where the cell in storage column `i` of row `j` stands, in metres.
			 *
			 * The lattice's own `(i, j)` walks a rhombus, and a rhombic patch leaves
			 * half of any picture of it empty. Each row is shifted back half a row
			 * on the way in, so the same lattice fills a **rectangle** of ground
			 * instead: the axial coordinate is `i - (j >> 1)` and nothing else
			 * changes -- the cells, their spacing and their six neighbours are the
			 * lattice's, and only which of them the patch holds is different.
			 */
			function cellCenter(i, j, d) {
				const axial = i - (j >> 1);
				return [(axial + j * 0.5) * d, j * ROOT3 * 0.5 * d];
			}

			/**
			 * The neighbour in direction `k`, in storage coordinates.
			 *
			 * A step is the lattice's own step; the row shift means the column moves
			 * by a different amount on odd and even rows, which is the one price the
			 * rectangle costs.
			 */
			function stepFrom(i, j, k) {
				const [di, dj] = STEPS[k];
				const shift = dj > 0 ? j & 1 : dj < 0 ? (j & 1) - 1 : 0;
				return [i + di + shift, j + dj];
			}

			/**
			 * The six corners of a cell's hexagon, as offsets from its centre.
			 *
			 * A lattice point's Voronoi region is the regular hexagon with
			 * inradius `d / 2`, so its circumradius is `d / sqrt(3)` and its
			 * corners sit at 30 degrees plus multiples of 60. Edge `k` spans
			 * corners `k - 1` and `k`, which puts its outward normal on
			 * neighbour `k` -- the same ring order `STEPS` lists.
			 */
			function hexCorners(d) {
				const r = d / ROOT3;
				const out = [];
				for (let k = 0; k < 6; k++) {
					const a = Math.PI / 6 + (k * Math.PI) / 3;
					out.push([r * Math.cos(a), r * Math.sin(a)]);
				}
				return out;
			}

			// =============================================================
			// The knobs.
			// =============================================================

			const knobs = {
				method: "plan",
				seed: "cave",
				cells: 96,
				blockSize: 1,
				layers: 28,

				corridorScale: 20,

				floorDepth: 9,

				sheetScale: 24,

				show: "rock",

				cutI: 0.62,

			const KNOBS = [

			// =============================================================
			// The plan, and the volume under it.
			// =============================================================

			/**
			 * One family's plan field at a point on the ground.
			 *
			 * A passage is where this sits near zero. **The zero set of a smooth
			 * field on a plane is a set of closed loops**, so one family on its
			 * own carves rings -- passages that come back to where they started
			 * and never reach the next ring, because two contours of one field
			 * cannot cross. A second family, seeded independently, has loops that
			 * cross the first family's, and the union of the two is a network.
			 *
			 * **Wander** bends the sample point before the lookup rather than
			 * adding a term to the result, so it moves a passage sideways
			 * without changing how wide it is.
			 */
			function planValue(x, z, k, seed, family) {
				const own = (seed + Math.imul(family, 0x85ebca6b)) | 0;
				let sx = x;
				let sz = z;
				if (k.branchWarp > 0) {
					const s = k.corridorScale * 2;
					sx += k.branchWarp * fbm(x / s, 3.1, z / s, 2, (own + 7) | 0);
					sz += k.branchWarp * fbm(x / s, 8.7, z / s, 2, (own + 11) | 0);
				}
				const s = k.corridorScale;
				return fbm(sx / s, 17.3, sz / s, k.corridorOctaves, own);
			}

			/**
			 * How far inside a passage a point is: 1 at the spine, 0 at the rim
			 * and outside. Several families take the largest, so where two cross
			 * the passage is as tall as the taller of the two rather than the sum.
			 */
			/**
			 * The same quantity unclamped, so it is negative outside a passage.
			 *
			 * The blocks only ever ask whether this is positive; a surface needs to
			 * know how far past zero it is, on both sides.
			 *
			 * **It is `1 - (v/width)^2` and not `(width - |v|)/width`, because an
			 * absolute value has a corner and the roof is read off this.** The two
			 * agree at the spine and at the rim and differ in between; the fold makes
			 * a crease along the middle of every passage, and sampled one point to a
			 * cell that crease is a row of spikes down the roof -- the same fold
			 * `ridge` uses on purpose to put an edge on a mountain, arriving here
			 * where nobody wanted one. The square is flat at its own top.
			 */
			function opennessRaw(values, k) {
				let best = -Infinity;
				for (const v of values) {
					const at = v / k.corridorWidth;
					const o = 1 - at * at;
					if (o > best) best = o;
				}
				return best;
			}

			function opennessOf(values, k) {
				return Math.max(0, opennessRaw(values, k));
			}

			/** The engine's own offset from the world seed, so caves differ from ground. */
			const CAVE_SEED_OFFSET = 2;

			/**
			 * The engine's `caveDensity`, transposed to flat ground.
			 *
			 * The engine samples the point's **direction times its own radius**,
			 * which is the world position of that block; here the world position is
			 * the position, and nothing else about the function moves. Three octaves
			 * of `fbmPlain` at a feature size of `sheetScale`, hollow inside a band
			 * of `sheetThreshold` either side of zero, refused inside `sheetCeiling`
			 * metres of the surface.
			 *
			 * **It is the plan carve's band rule taken in three dimensions rather
			 * than two.** The zero set of a field on a plane is a set of curves and
			 * the band round it is a passage; the zero set of a field in space is a
			 * set of **surfaces**, and the band round it is a slab. That one
			 * difference is what the two halves of this page are for.
			 */
			function sheetValue(x, y, z, k, seed) {
				const f = 1 / k.sheetScale;
				return fbmPlain(x * f, y * f, z * f, 3, (seed + CAVE_SEED_OFFSET) | 0);
			}

			/**
			 * How far below the surface this column's sheet is forbidden to reach.
			 *
			 * **A constant here is why the engine's caves have no way in.** The gate
			 * is a yes or a no on one number, so at 6 m nothing ever breaks the
			 * ground and at 0 m the sheet is near the surface everywhere and opens it
			 * everywhere: there is no setting between the two. Letting the depth
			 * itself wander over the ground puts the decision somewhere -- a mouth
			 * opens where the ground says it may **and** the sheet happens to be
			 * there, which is two conditions rather than one.
			 */
			function sheetCeilingAt(x, z, k, seed) {
				if (k.mouths !== "dipping") return k.sheetCeiling;
				const s = k.mouthScale;
				// **One-sided and squared**, so the ceiling only ever comes down and
				// almost never by much. A field that moves it both ways pushes the
				// caves deeper over half the map and takes a third of the void away
				// to buy a handful of mouths, which is paying for the wrong thing.
				// **Only the top of the field does anything, and where its top starts
				// has to be set rather than assumed.** Anything reading the whole range
				// dips the ceiling over half the ground and opens it everywhere again,
				// which is the failure the constant ceiling already had. A borrowed
				// figure does not work either: the standard deviation of noise depends
				// on how many octaves it has, and over a patch this size the field never
				// sees its own full range -- at a 60 m feature over 95 m of ground the
				// median reading is `0.461` and **46.5%** of it clears `0.5`.
				const n = fbm(x / s, 41.3, z / s, 2, (seed + 13) | 0);
				const dip = Math.max(0, (n - k.mouthRare) / (1 - k.mouthRare));
				return k.sheetCeiling - k.mouthVary * dip;
			}

			/**
			 * The band's half-width at one depth: the whole gate, in one number.
			 *
			 * **Taper** is the other way out of the same problem, and it needs no
			 * second field: the band narrows toward the ground instead of stopping
			 * dead at it, so only the part of the sheet nearest its own middle is
			 * still wide enough to be a cave when it gets there. A mouth is then
			 * where the **cave** is strongest rather than where the ground allows it,
			 * and `mouthWidth` is how much of the band survives the trip: at 0 the
			 * band closes at the surface and nothing breaks through, at 1 there is no
			 * gate at all.
			 */
			function sheetBandAt(below, ceiling, k) {
				if (k.mouths === "taper") {
					// Squared for the same reason the dip is: a straight ramp is already
					// a fifth of the way open one block under the ground, and a sheet
					// that wide meets the surface everywhere.
					const reached = Math.min(1, Math.max(0, below / k.sheetCeiling));
					return (
						k.sheetThreshold *
						(k.mouthWidth + (1 - k.mouthWidth) * reached * reached)
					);
				}
				return below >= ceiling ? k.sheetThreshold : 0;
			}

			/** How far inside the sheet's band a point is: 1 in the middle, 0 outside. */
			function sheetOpenness(v, k) {
				return Math.max(0, (k.sheetThreshold - Math.abs(v)) / k.sheetThreshold);
			}

			/**
			 * How tall the passage is where a column sits this far inside the band.
			 *
			 * **The roof is read off the same field that decided the passage, and a
			 * marginal reading must not buy a full one.** At `roofShape` 0.5 a column
			 * only 68% of the way in still takes 82% of the height, so a cell that
			 * barely clears the band -- with both its neighbours well outside it --
			 * becomes a one-cell chimney several metres tall. In blocks that is a
			 * thin pillar among thousands; the isosurface draws it as a spike, which
			 * is what made it visible.
			 *
			 * **A passage that tapers to nothing at its rim has no width where it
			 * matters, and nothing can sample a zero thickness.** The blocks hide
			 * that -- a wedge under half a block rounds to no block, so the block
			 * counts barely move -- and the isosurface draws it as the sawtooth it
			 * is. `minHeight` is a floor rather than a taper: a roof lower than one
			 * block is no passage at all, and every passage edge is then a step of
			 * at least a block, which a lattice can carry exactly.
			 *
			 * **It moves the roof and never the plan** -- which columns are passage
			 * is still `open > 0` -- so the network the contour draws is the network
			 * the blocks build, and only what was too low to stand up in drops out.
			 */
			function roofHeightAt(open, k) {
				if (open <= 0) return 0;
				const height = k.roofHeight * Math.pow(open, k.roofShape);
				return height < k.minHeight ? 0 : height;
			}

			/** How far below the surface this column's cave floor sits, in metres. */
			function floorAt(x, z, k, seed) {
				if (k.depthVary === 0) return k.floorDepth;
				const s = k.depthScale;
				return (
					k.floorDepth +
					k.depthVary * fbm(x / s, 91.7, z / s, 2, (seed + 3) | 0)
				);
			}

			/** The ground's own height above zero, in metres. */
			function surfaceAt(x, z, k, seed) {
				if (k.relief === 0) return 0;
				const s = k.reliefScale;
				return k.relief * fbm(x / s, 5.1, z / s, 4, (seed + 5) | 0);
			}

			const AIR = 0;
			const ROCK = 1;
			const VOID = 2;

			/**
			 * Build the whole patch: the plan, the surface over it, and the
			 * blocks.
			 *
			 * `kind` is one byte a block -- open air above the ground, rock, or
			 * a cave. Air and cave are both empty and are kept apart because the
			 * two views draw opposite halves of the world, and because a cave
			 * that has broken through to the sky is a mouth and worth counting.
			 */
			function build(k) {
				const started = performance.now();
				const seed = seedFromString(k.seed);
				const n = k.cells;
				const d = k.blockSize;
				const layers = k.layers;
				const columns = n * n;

				const plan = k.method === "plan";
				// The picture contours one scalar field per family for the plan carve,
				// and one horizontal slice of the sheet's field for the other.
				const fields = plan ? k.families : 1;
				const raw = new Float32Array(columns * fields);
				const openness = new Float32Array(columns);
				const surface = new Float32Array(columns);
				const floor = new Float32Array(columns);
				const ground = new Int32Array(columns);
				const kind = new Uint8Array(columns * layers);

				let highest = -Infinity;
				for (let j = 0; j < n; j++) {
					for (let i = 0; i < n; i++) {
						const c = j * n + i;
						const [x, z] = cellCenter(i, j, d);
						surface[c] = surfaceAt(x, z, k, seed);
						if (plan) {
							const values = [];
							for (let f = 0; f < fields; f++) {
								const v = planValue(x, z, k, seed, f);
								raw[c * fields + f] = v;
								values.push(v);
							}
							openness[c] = opennessOf(values, k);
							floor[c] = floorAt(x, z, k, seed);
						} else {
							// One depth, named on the panel, because a sheet has no plan of
							// its own: what it carves 6 m down is a different picture from
							// what it carves 20 m down, and that is the whole difference.
							const v = sheetValue(x, surface[c] - k.sliceDepth, z, k, seed);
							raw[c] = v;
							const band = sheetBandAt(
								k.sliceDepth,
								sheetCeilingAt(x, z, k, seed),
								k,
							);
							openness[c] = band > 0 ? Math.max(0, (band - Math.abs(v)) / band) : 0;
						}
						if (surface[c] > highest) highest = surface[c];
					}
				}
				// One block of empty sky over the tallest ground, so layer 0 is
				// air everywhere and a mouth has somewhere to open into.
				const top = Math.ceil(highest / d) * d + d;

				for (let c = 0; c < columns; c++) {
					const i = c % n;
					const j = (c - i) / n;
					const surfaceY = surface[c];
					const first = Math.max(0, Math.ceil((top - surfaceY) / d));
					ground[c] = first;

					const base = c * layers;
					if (plan) {
						const open = openness[c];
						// The cross-section falls out of the same field as the plan:
						// how far inside the band a column is says how tall the
						// passage is there, so one lookup gives both the shape on
						// the ground and the shape across it.
						const height = roofHeightAt(open, k);
						const floorDepth = floor[c];
						const roofDepth = floorDepth - height;
						for (let L = first; L < layers; L++) {
							const centre = top - (L + 0.5) * d;
							const below = surfaceY - centre;
							const hollow =
								height > 0 &&
								below > roofDepth &&
								below <= floorDepth &&
								below >= k.roofUnder;
							kind[base + L] = hollow ? VOID : ROCK;
						}
					} else {
						// Every layer is a fresh lookup. The plan carve reads its field
						// once a column and fills the slab it decided; this one cannot,
						// which is what a passage free to be at any depth costs.
						const [cx, cz] = cellCenter(i, j, d);
						const ceiling = sheetCeilingAt(cx, cz, k, seed);
						for (let L = first; L < layers; L++) {
							const centre = top - (L + 0.5) * d;
							const below = surfaceY - centre;
							const hollow =
								Math.abs(sheetValue(cx, centre, cz, k, seed)) <
								sheetBandAt(below, ceiling, k);
							kind[base + L] = hollow ? VOID : ROCK;
						}
					}
				}

				return {
					n,
					d,
					layers,
					top,
					seed,
					fields,
					raw,
					openness,
					surface,
					floor,
					ground,
					kind,
					lookups: noiseLookups,
					millis: performance.now() - started,
				};
			}

			// =============================================================
			// What the volume is worth: the numbers that decide the concept.
			// =============================================================

			/**
			 * A cave you cannot walk down is a texture, not a cave, so the
			 * measurements are about **reach**: how much of the patch a passage
			 * touches, how many separate systems it breaks into, and how many
			 * cells wide the narrowest way through one is.
			 *
			 * The width is the number that carries to the planet. A cell is one
			 * block, so a passage two cells wide at a 1 m block is a passage two
			 * blocks wide however big the world is; the same plan at a 4 m block
			 * is the same passage drawn with a quarter of the cells and may not
			 * survive being drawn at all.
			 */
			function measure(world, k) {
				const { n, layers, kind, ground } = world;
				const columns = n * n;

				let caveCells = 0;
				let caveColumns = 0;
				let mouths = 0;
				let multiSpan = 0;
				const hasCave = new Uint8Array(columns);

				for (let c = 0; c < columns; c++) {
					const base = c * layers;
					let cave = 0;
					let topCave = -1;
					let spans = 0;
					let wasRock = false;
					for (let L = 0; L < layers; L++) {
						const v = kind[base + L];
						if (v === VOID) {
							cave++;
							if (topCave < 0) topCave = L;
						}
						const rock = v === ROCK;
						if (rock && !wasRock) spans++;
						wasRock = rock;
					}
					caveCells += cave;
					if (cave > 0) {
						caveColumns++;
						hasCave[c] = 1;
						if (topCave === ground[c]) mouths++;
					}
					if (spans > 1) multiSpan++;
				}

				// Connected systems, over the six lateral neighbours plus up and
				// down. A plan that reads as one network on paper can still
				// rasterise into a hundred disconnected pockets, and that is
				// exactly the failure a picture hides and a count does not.
				const seen = new Uint8Array(columns * layers);
				const stack = new Int32Array(columns * layers);
				const sizes = [];
				for (let start = 0; start < columns * layers; start++) {
					if (kind[start] !== VOID || seen[start]) continue;
					let size = 0;
					let head = 0;
					stack[head++] = start;
					seen[start] = 1;
					while (head > 0) {
						const at = stack[--head];
						size++;
						const L = at % layers;
						const c = (at - L) / layers;
						const i = c % n;
						const j = (c - i) / n;
						if (L > 0 && kind[at - 1] === VOID && !seen[at - 1]) {
							seen[at - 1] = 1;
							stack[head++] = at - 1;
						}
						if (
							L < layers - 1 &&
							kind[at + 1] === VOID &&
							!seen[at + 1]
						) {
							seen[at + 1] = 1;
							stack[head++] = at + 1;
						}
						for (let k = 0; k < 6; k++) {
							const [ni, nj] = stepFrom(i, j, k);
							if (ni < 0 || nj < 0 || ni >= n || nj >= n) continue;
							const to = (nj * n + ni) * layers + L;
							if (kind[to] === VOID && !seen[to]) {
								seen[to] = 1;
								stack[head++] = to;
							}
						}
					}
					sizes.push(size);
				}

				// The narrowest way through a passage, in cells. Three lattice
				// axes, the run of cave columns through this one along each, and
				// the smallest of the three -- so a column in a wide chamber
				// reports the chamber and a column in a slot reports the slot.
				const widths = [];
				for (let j = 0; j < n; j++) {
					for (let i = 0; i < n; i++) {
						if (!hasCave[j * n + i]) continue;
						let narrowest = Infinity;
						// The three lattice axes, walked with the lattice's own step so
						// the row shift cannot bend a straight line.
						for (let axis = 0; axis < 3; axis++) {
							let run = 1;
							for (const k of [axis, axis + 3]) {
								let a = i;
								let b = j;
								for (;;) {
									[a, b] = stepFrom(a, b, k);
									if (a < 0 || b < 0 || a >= n || b >= n) break;
									if (!hasCave[b * n + a]) break;
									run++;
								}
							}
							if (run < narrowest) narrowest = run;
						}
						widths.push(narrowest);
					}
				}

				// One count is not enough: a plan that reads as a network on paper
				// can rasterise into a few real passages and a hundred specks, and a
				// raw count says the same thing about both. How many of the biggest
				// systems it takes to hold half the void separates them.
				sizes.sort((a, b) => b - a);
				let running = 0;
				let half = 0;
				while (half < sizes.length && running * 2 < caveCells) {
					running += sizes[half];
					half++;
				}

				widths.sort((a, b) => a - b);
				const median = widths.length
					? widths[widths.length >> 1]
					: 0;
				const thin = widths.filter((w) => w < 2).length;

				// Faces, counted inside the patch only, so the rim the patch was
				// cut at is not charged to the caves.
				function faces(wanted) {
					let total = 0;
					const solid = (c, L) => {
						// Outside the crust counts as filled for the rock, so the patch's
						// own rim is not charged to the caves, and as empty for the void,
						// because a passage cut off by the patch really does end there.
						if (L < 0 || L >= layers) return wanted !== "void";
						const v = kind[c * layers + L];
						if (wanted === "void") return v === VOID;
						if (v === AIR) return false;
						return wanted === "rock" ? v === ROCK : true;
					};
					for (let j = 0; j < n; j++) {
						for (let i = 0; i < n; i++) {
							const c = j * n + i;
							for (let L = 0; L < layers; L++) {
								if (!solid(c, L)) continue;
								if (!solid(c, L - 1)) total++;
								if (L < layers - 1 && !solid(c, L + 1)) total++;
								for (let k = 0; k < 6; k++) {
									const [a, b] = stepFrom(i, j, k);
									if (a < 0 || b < 0 || a >= n || b >= n) continue;
									if (!solid(b * n + a, L)) total++;
								}
							}
						}
					}
					return total;
				}

				const withCaves = faces("rock");
				const without = faces("bare");
				const voidFaces = faces("void");

				return {
					caveCells,
					caveColumns,
					columns,
					mouths,
					multiSpan,
					systems: sizes.length,
					largest: sizes[0] ?? 0,
					half,
					medianWidth: median,
					thinShare: widths.length ? thin / widths.length : 0,
					withCaves,
					voidFaces,
					without,
				};
			}

			// =============================================================
			// Marching squares, and the lattice's own version of it.
			// =============================================================

			/**
			 * Marching squares over a regular sample grid.
			 *
			 * Sixteen cases, of which two are saddles where the same four
			 * corners admit two different curves. They are settled here by the
			 * average of the four, which is the cheapest rule that at least
			 * decides the two the same way.
			 */
			function marchingSquares(grid, w, h, level, emit) {
				const point = (ax, ay, av, bx, by, bv) => {
					const t = (level - av) / (bv - av || 1e-9);
					return [ax + (bx - ax) * t, ay + (by - ay) * t];
				};
				for (let y = 0; y < h - 1; y++) {
					for (let x = 0; x < w - 1; x++) {
						const a = grid[y * w + x];
						const b = grid[y * w + x + 1];
						const c = grid[(y + 1) * w + x + 1];
						const d = grid[(y + 1) * w + x];
						let code = 0;
						if (a > level) code |= 1;
						if (b > level) code |= 2;
						if (c > level) code |= 4;
						if (d > level) code |= 8;
						if (code === 0 || code === 15) continue;
						const e0 = () => point(x, y, a, x + 1, y, b);
						const e1 = () => point(x + 1, y, b, x + 1, y + 1, c);
						const e2 = () => point(x + 1, y + 1, c, x, y + 1, d);
						const e3 = () => point(x, y + 1, d, x, y, a);
						const middle = (a + b + c + d) / 4 > level;
						switch (code) {
							case 1:
							case 14:
								emit(e3(), e0());
								break;
							case 2:
							case 13:
								emit(e0(), e1());
								break;
							case 3:
							case 12:
								emit(e3(), e1());
								break;
							case 4:
							case 11:
								emit(e1(), e2());
								break;
							case 6:
							case 9:
								emit(e0(), e2());
								break;
							case 7:
							case 8:
								emit(e2(), e3());
								break;
							case 5:
								if (middle) {
									emit(e3(), e0());
									emit(e1(), e2());
								} else {
									emit(e0(), e1());
									emit(e2(), e3());
								}
								break;
							case 10:
								if (middle) {
									emit(e0(), e1());
									emit(e2(), e3());
								} else {
									emit(e3(), e0());
									emit(e1(), e2());
								}
								break;
						}
					}
				}
			}

			/**
			 * The same contour over the lattice the world is actually built on.
			 *
			 * Three adjacent cells make a triangle, so the cases are eight
			 * rather than sixteen, and **none of them is ambiguous**: whenever a
			 * triangle is cut at all, exactly one of its three corners is on its
			 * own side and the segment joins the two edges that touch it. The
			 * saddle marching squares has to guess at cannot arise on a
			 * triangle, because three points have no saddle.
			 */
			function marchingTriangles(valueAt, n, level, emit) {
				const cut = (p, q) => {
					const t = (level - p[2]) / (q[2] - p[2] || 1e-9);
					return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
				};
				const one = (p, q, r) => {
					const pi = p[2] > level;
					const qi = q[2] > level;
					const ri = r[2] > level;
					if (pi === qi && qi === ri) return;
					// Whichever corner disagrees with the other two is the one
					// the segment cuts off.
					const alone = pi === qi ? r : qi === ri ? p : q;
					const rest = pi === qi ? [p, q] : qi === ri ? [q, r] : [p, r];
					emit(cut(alone, rest[0]), cut(alone, rest[1]));
				};
				for (let j = 0; j < n - 1; j++) {
					for (let i = 0; i < n - 1; i++) {
						const a = valueAt(i, j);
						const b = valueAt(i + 1, j);
						const c = valueAt(i, j + 1);
						const e = valueAt(i + 1, j + 1);
						one(a, b, c);
						one(b, c, e);
					}
				}
			}

			// =============================================================
			// The plan picture.
			// =============================================================

			const plan = document.getElementById("plan");
			const planSays = document.getElementById("planSays");
			const planCtx = plan.getContext("2d");
			const scratch = document.createElement("canvas");

			/** How many field samples across the plan image is contoured on. */
			const PLAN_GRID = 200;

			function drawPlan(world, k) {
				const n = world.n;
				const d = world.d;
				const span = (n - 1) * d;
				// The row shift makes the patch a rectangle, give or take the half
				// cell each odd row is offset by, so the extent is read off the cells
				// rather than assumed from the corners.
				const corners = hexCorners(d);
				let minX = Infinity;
				let maxX = -Infinity;
				let minZ = Infinity;
				let maxZ = -Infinity;
				for (let j = 0; j < n; j++)
					for (const i of [0, n - 1]) {
						const [x, z] = cellCenter(i, j, d);
						if (x < minX) minX = x;
						if (x > maxX) maxX = x;
						if (z < minZ) minZ = z;
						if (z > maxZ) maxZ = z;
					}
				const inset = d / ROOT3;
				minX -= inset;
				maxX += inset;
				minZ -= inset;
				maxZ += inset;
				const width = maxX - minX;
				const height = maxZ - minZ;
				// One scale for both axes, or the hexagons stop being hexagons; the
				// canvas takes the patch's own shape rather than a square with the
				// picture stranded across the middle of it.
				const size = plan.width;
				const scale = size / width;
				plan.height = Math.round((size * height) / width);
				const toPixel = (x, z) => [(x - minX) * scale, (z - minZ) * scale];

				planCtx.setTransform(1, 0, 0, 1, 0, 0);
				planCtx.fillStyle = "#05070a";
				planCtx.fillRect(0, 0, plan.width, plan.height);

				/** Whether a world point is a point the lattice actually covers. */
				const onPatch = (x, z) => {
					const j = z / (d * ROOT3 * 0.5);
					const i = x / d - j / 2 + (j >> 1);
					return i >= -0.5 && j >= -0.5 && i <= n - 0.5 && j <= n - 0.5;
				};

				// The field, on its own square grid. This is the raster marching
				// squares is meant for, and it is a picture rather than a world:
				// nothing here decides which block is which.
				// The picture samples whichever field the carve contours: a plan
				// family, or the sheet's field at the depth the panel names.
				const fieldAt = (x, z, f) =>
					k.method === "plan"
						? planValue(x, z, k, world.seed, f)
						: sheetValue(x, surfaceAt(x, z, k, world.seed) - k.sliceDepth, z, k, world.seed);
				const openOf = (values) =>
					k.method === "plan"
						? opennessOf(values, k)
						: k.sliceDepth < k.sheetCeiling
							? 0
							: sheetOpenness(values[0], k);
				const band =
					k.method === "plan" ? k.corridorWidth : k.sheetThreshold;
				const bandEdges = [-band, band];
				const grids = [];
				for (let f = 0; f < world.fields; f++)
					grids.push(new Float32Array(PLAN_GRID * PLAN_GRID));
				const openGrid = new Float32Array(PLAN_GRID * PLAN_GRID);
				const sample = new Array(world.fields);
				for (let y = 0; y < PLAN_GRID; y++) {
					for (let x = 0; x < PLAN_GRID; x++) {
						const wx = minX + (x / (PLAN_GRID - 1)) * width;
						const wz = minZ + (y / (PLAN_GRID - 1)) * height;
						for (let f = 0; f < world.fields; f++) {
							const v = fieldAt(wx, wz, f);
							grids[f][y * PLAN_GRID + x] = v;
							sample[f] = v;
						}
						openGrid[y * PLAN_GRID + x] = openOf(sample);
					}
				}

				if (k.picture !== "hexes") {
					scratch.width = PLAN_GRID;
					scratch.height = PLAN_GRID;
					const g = scratch.getContext("2d");
					const image = g.createImageData(PLAN_GRID, PLAN_GRID);
					for (let p = 0; p < openGrid.length; p++) {
						const t = openGrid[p];
						let r;
						let gr;
						let b;
						if (t > 0) {
							// Bright at the spine and falling off to the rim,
							// which is the same quantity the roof height is taken
							// from, so the picture reads as a passage with a shape
							// rather than as a stencil.
							r = 40 + 200 * t;
							gr = 60 + 170 * t;
							b = 80 + 90 * t;
						} else {
							const away = Math.min(1, Math.abs(grids[0][p]));
							r = 10 + 14 * away;
							gr = 14 + 18 * away;
							b = 20 + 26 * away;
						}
						image.data[p * 4] = r;
						image.data[p * 4 + 1] = gr;
						image.data[p * 4 + 2] = b;
						image.data[p * 4 + 3] = 255;
					}
					g.putImageData(image, 0, 0);
					planCtx.imageSmoothingEnabled = true;
					planCtx.drawImage(scratch, 0, 0, plan.width, plan.height);
				}

				// The hexagons, which is what the world is actually built out of.
				if (k.picture === "hexes" || k.picture === "both") {
					for (let j = 0; j < n; j++) {
						for (let i = 0; i < n; i++) {
							const c = j * n + i;
							const open = world.openness[c];
							if (open <= 0) continue;
							const [cx, cz] = cellCenter(i, j, d);
							planCtx.beginPath();
							for (let e = 0; e < 6; e++) {
								const [px, py] = toPixel(
									cx + corners[e][0],
									cz + corners[e][1],
								);
								if (e === 0) planCtx.moveTo(px, py);
								else planCtx.lineTo(px, py);
							}
							planCtx.closePath();
							const t = Math.min(1, open);
							planCtx.fillStyle = `rgb(${Math.round(40 + 200 * t)},${Math.round(60 + 170 * t)},${Math.round(80 + 90 * t)})`;
							planCtx.fill();
						}
					}
				}

				// The contour itself: the two edges of the band, at plus and
				// minus the width.
				let segments = 0;
				if (k.picture !== "hexes") {
					planCtx.strokeStyle = "#6fd0ff";
					planCtx.lineWidth = 1.6;
					planCtx.beginPath();
					for (const grid of grids)
						for (const level of bandEdges)
							marchingSquares(grid, PLAN_GRID, PLAN_GRID, level, (a, b) => {
							const mx =
								minX + ((a[0] + b[0]) / 2 / (PLAN_GRID - 1)) * width;
							const mz =
								minZ + ((a[1] + b[1]) / 2 / (PLAN_GRID - 1)) * height;
							if (!onPatch(mx, mz)) return;
							segments++;
							planCtx.moveTo(
								(a[0] / (PLAN_GRID - 1)) * plan.width,
								(a[1] / (PLAN_GRID - 1)) * plan.height,
							);
							planCtx.lineTo(
								(b[0] / (PLAN_GRID - 1)) * plan.width,
								(b[1] / (PLAN_GRID - 1)) * plan.height,
							);
							});
					planCtx.stroke();
				}

				// And the same contour taken on the lattice, for comparison.
				let latticeSegments = 0;
				if (k.lattice) {
					planCtx.strokeStyle = "#ffb56b";
					planCtx.lineWidth = 1.2;
					planCtx.beginPath();
					for (let f = 0; f < world.fields; f++) {
						const valueAt = (i, j) => {
							const [x, z] = cellCenter(i, j, d);
							return [x, z, world.raw[(j * n + i) * world.fields + f]];
						};
						for (const level of bandEdges)
							marchingTriangles(valueAt, n, level, (a, b) => {
							latticeSegments++;
							const [ax, ay] = toPixel(a[0], a[1]);
							const [bx, by] = toPixel(b[0], b[1]);
							planCtx.moveTo(ax, ay);
							planCtx.lineTo(bx, by);
						});
					}
					planCtx.stroke();
				}

				planSays.textContent =
					`${Math.round(span)} m across · ` +
					(k.method === "plan"
						? "the whole plan"
						: `one slice, ${k.sliceDepth} m down`) +
					` · ${segments} square segments` +
					(k.lattice ? ` · ${latticeSegments} lattice segments` : "");
			}

			// =============================================================
			// The isosurface, and why it is tetrahedra rather than cubes.
			// =============================================================

			/**
			 * The carve's own field as one signed number: positive inside a cave.
			 *
			 * Both carves already answer *is this block hollow* with a comparison,
			 * and a comparison throws away how close the answer was. This gives back
			 * the quantity the comparison was made on, so a surface can be put where
			 * it actually falls rather than on the nearest block boundary. The zero
			 * set is exactly the cave the blocks are a sampling of.
			 *
			 * The plan carve's cave is an **intersection** -- inside the passage,
			 * under the roof, over the floor, under the ground -- so its field is the
			 * smallest of those four. A `min` of positive multiples leaves the zero
			 * set where it was, so the terms may be scaled into the same units
			 * without moving the surface.
			 */
			function caveFieldAt(x, z, surfaceY, k, seed) {
				if (k.method === "sheet") {
					const ceiling = sheetCeilingAt(x, z, k, seed);
					return (y) => {
						const below = surfaceY - y;
						const reach = k.sheetThreshold - Math.abs(sheetValue(x, y, z, k, seed));
						// The taper is the gate, so there is no second term to take the
						// smaller of; the other two keep a hard floor under the ground.
						if (k.mouths === "taper")
							return Math.min(
								sheetBandAt(below, ceiling, k) -
									Math.abs(sheetValue(x, y, z, k, seed)),
								below * 0.02,
							);
						return Math.min(reach, (below - ceiling) * 0.02);
					};
				}
				// Everything the plan carve decides from the ground is decided once
				// for the column, which is why this surface is nearly free there and
				// costs a lookup a level for the sheet.
				const values = [];
				for (let f = 0; f < k.families; f++)
					values.push(planValue(x, z, k, seed, f));
				const open = opennessRaw(values, k);
				const height = roofHeightAt(open, k);
				const floorDepth = floorAt(x, z, k, seed);
				const roofDepth = floorDepth - height;
				return (y) => {
					const below = surfaceY - y;
					// **Three terms and not four.** An openness term looks needed and is
						// not: where a column is outside the band its roof height is zero, so
						// its roof and its floor are the same depth and the two depth terms
						// cannot both be positive. Adding it puts a crease along the top edge
						// of every passage where an openness in band units crosses a depth in
						// metres -- two quantities with no common scale, so where they cross
						// is arbitrary, and the surface picks a different one from tetrahedron
						// to tetrahedron.
					return Math.min(
						below - roofDepth,
						floorDepth - below,
						below - k.roofUnder,
					);
				};
			}

			/**
			 * Marching tetrahedra: sixteen cases, and **not one of them ambiguous**.
			 *
			 * Marching cubes is the square grid's tool, and this lattice is not one.
			 * Three adjacent columns and two adjacent layers make a **triangular
			 * prism**, a prism splits into three tetrahedra, and a tetrahedron cut by
			 * a surface always has either one corner on its own side or two -- one
			 * triangle or a quad, decided and never guessed. Marching cubes' 256
			 * cases carry six faces where the four corners admit two different
			 * surfaces, and picking wrong holes the mesh. The same argument as
			 * marching squares against marching triangles, one dimension up.
			 */
			function marchTetrahedron(p, v, emit) {
				const inside = [];
				const outside = [];
				for (let i = 0; i < 4; i++) (v[i] > 0 ? inside : outside).push(i);
				if (!inside.length || !outside.length) return;
				const cut = (a, b) => {
					const t = v[a] / (v[a] - v[b] || 1e-9);
					return [
						p[a][0] + (p[b][0] - p[a][0]) * t,
						p[a][1] + (p[b][1] - p[a][1]) * t,
						p[a][2] + (p[b][2] - p[a][2]) * t,
					];
				};
				// The surface is oriented outward by the corners it cut off, which is
				// the one thing the case tables cannot supply and the winding must not
				// be trusted for.
				const middle = [0, 0, 0];
				for (const i of inside)
					for (let a = 0; a < 3; a++) middle[a] += p[i][a] / inside.length;
				if (inside.length === 1 || outside.length === 1) {
					const lone = inside.length === 1 ? inside[0] : outside[0];
					const rest = inside.length === 1 ? outside : inside;
					emit(
						cut(lone, rest[0]),
						cut(lone, rest[1]),
						cut(lone, rest[2]),
						middle,
					);
					return;
				}
				const [a, b] = inside;
				const [c, e] = outside;
				const q0 = cut(a, c);
				const q1 = cut(a, e);
				const q2 = cut(b, e);
				const q3 = cut(b, c);
				emit(q0, q1, q2, middle);
				emit(q0, q2, q3, middle);
			}

			// =============================================================
			// The volume, drawn.
			// =============================================================

			/** A Float32Array that grows, so the mesher does not size itself twice. */
			function growable(initial) {
				return {
					data: new Float32Array(initial),
					used: 0,
					room(k) {
						if (this.used + k <= this.data.length) return;
						let size = this.data.length;
						while (size < this.used + k) size *= 2;
						const next = new Float32Array(size);
						next.set(this.data.subarray(0, this.used));
						this.data = next;
					},
					vertex(p, nrm, color) {
						this.room(9);
						const a = this.data;
						let at = this.used;
						a[at++] = p[0];
						a[at++] = p[1];
						a[at++] = p[2];
						a[at++] = nrm[0];
						a[at++] = nrm[1];
						a[at++] = nrm[2];
						a[at++] = color[0];
						a[at++] = color[1];
						a[at++] = color[2];
						this.used = at;
					},
					quad(a, b, c, d, nrm, color) {
						this.vertex(a, nrm, color);
						this.vertex(b, nrm, color);
						this.vertex(c, nrm, color);
						this.vertex(a, nrm, color);
						this.vertex(c, nrm, color);
						this.vertex(d, nrm, color);
					},
				};
			}

			const SOIL = [0.30, 0.24, 0.16];
			const GRASS = [0.26, 0.44, 0.19];
			const STONE = [0.40, 0.40, 0.44];
			const CUT = [0.62, 0.55, 0.40];

			function mix(a, b, t) {
				return [
					a[0] + (b[0] - a[0]) * t,
					a[1] + (b[1] - a[1]) * t,
					a[2] + (b[2] - a[2]) * t,
				];
			}

			/**
			 * Every face where what is drawn meets what is not.
			 *
			 * The same mesher serves both views: **rock** draws the stone and
			 * **void** draws the caves, and all that changes is which byte
			 * counts as filled. Drawing the cave as a solid is the only way to
			 * see the shape of a network from outside it, because the thing
			 * being judged is a hole.
			 *
			 * A cell removed by the cut is removed from the world rather than
			 * hidden, so faces are emitted against it and the cut reads as a
			 * cross-section. Those faces are tinted, or a cut through solid rock
			 * looks like a wall somebody built.
			 */
			function buildMesh(world, k) {
				const { n, d, layers, top, kind, ground, surface } = world;
				const corners = hexCorners(d);
				const mesh = growable(1 << 16);
				const filled = k.show === "void" ? VOID : ROCK;
				const keepI = Math.round((n - 1) * k.cutI);
				const keepJ = Math.round((n - 1) * k.cutJ);

				const cut = (i, j) => i > keepI || j > keepJ;
				const at = (i, j, L) => {
					if (i < 0 || j < 0 || i >= n || j >= n) return -1;
					if (cut(i, j)) return -1;
					if (L < 0 || L >= layers) return -1;
					return kind[(j * n + i) * layers + L];
				};

				for (let j = 0; j <= keepJ; j++) {
					for (let i = 0; i <= keepI; i++) {
						const c = j * n + i;
						const [cx, cz] = cellCenter(i, j, d);
						const base = c * layers;
						for (let L = 0; L < layers; L++) {
							if (kind[base + L] !== filled) continue;
							const yTop = top - L * d;
							const yBottom = yTop - d;
							const centre = yTop - d * 0.5;
							const below = surface[c] - centre;
							// Deeper rock is darker, which is the only cue a
							// picture with one light has for how far down a
							// passage runs.
							const deep = Math.min(1, Math.max(0, below / 40));
							const soil =
								filled === ROCK
									? mix(SOIL, STONE, Math.min(1, below / (d * 4)))
									: mix(
											[0.85, 0.62, 0.36],
											[0.32, 0.20, 0.26],
											deep,
										);
							const body = mix(soil, [0.06, 0.06, 0.09], deep * 0.55);

							// Up and down. A hexagon is a fan of four triangles from
							// one corner, which is two of the mesher's quads and no
							// centre vertex -- the same 2-verts-4-tris a cap costs in
							// the engine.
							const cap = (y, nrm, color) => {
								const p = (e) => [cx + corners[e][0], y, cz + corners[e][1]];
								mesh.quad(p(0), p(1), p(2), p(3), nrm, color);
								mesh.quad(p(0), p(3), p(4), p(5), nrm, color);
							};

							const above = at(i, j, L - 1);
							if (above !== filled) {
								let color = body;
								if (filled === ROCK && above === AIR)
									color = L === ground[c] ? GRASS : mix(GRASS, SOIL, 0.5);
								else if (filled === ROCK && above === VOID)
									color = mix(STONE, [0.1, 0.1, 0.12], 0.35);
								else if (above === -1 && L > 0) color = mix(CUT, body, 0.45);
								cap(yTop, [0, 1, 0], color);
							}

							const under = at(i, j, L + 1);
							if (under !== filled && L < layers - 1)
								cap(yBottom, [0, -1, 0], mix(body, [0.04, 0.04, 0.06], 0.4));

							// The six sides. Edge `k` spans corners `k - 1` and
							// `k`, so its outward normal is neighbour `k`'s own
							// direction.
							for (let e = 0; e < 6; e++) {
								const [ni, nj] = stepFrom(i, j, e);
								const other = at(ni, nj, L);
								if (other === filled) continue;
								const outside =
									ni < 0 || nj < 0 || ni >= n || nj >= n;
								const removed = !outside && cut(ni, nj);
								const a = corners[(e + 5) % 6];
								const b = corners[e];
								const nx = Math.cos((e * Math.PI) / 3);
								const nz = Math.sin((e * Math.PI) / 3);
								let color = body;
								if (removed) color = mix(CUT, body, 0.45);
								else if (filled === ROCK && other === VOID)
									color = mix(STONE, [0.08, 0.07, 0.09], 0.45);
								mesh.quad(
									[cx + a[0], yTop, cz + a[1]],
									[cx + b[0], yTop, cz + b[1]],
									[cx + b[0], yBottom, cz + b[1]],
									[cx + a[0], yBottom, cz + a[1]],
									[nx, 0, nz],
									color,
								);
							}
						}
					}
				}
				return mesh;
			}

			/**
			 * The isosurface of the carve's own field, over the lattice's own prisms.
			 *
			 * Three adjacent columns and two adjacent layer boundaries make a
			 * triangular prism, which splits into three tetrahedra. **The split has
			 * to be the same on both sides of every quad face** or the two sides cut
			 * it along different diagonals and the surface tears; ordering the three
			 * columns by their storage key before splitting is what guarantees it,
			 * because two prisms sharing a face share those two columns and order
			 * them the same way.
			 *
			 * This draws no blocks and is not a world: nothing here can be broken,
			 * stored or stood on. It is what the carve says before the block grid
			 * rounds it off.
			 */
			function buildSmooth(world, k) {
				const { n, d, layers, top, surface, seed } = world;
				const mesh = growable(1 << 16);
				const keepI = Math.round((n - 1) * k.cutI);
				const keepJ = Math.round((n - 1) * k.cutJ);
				const levels = layers + 1;
				const value = new Float32Array(n * n * levels);
				const atX = new Float32Array(n * n);
				const atZ = new Float32Array(n * n);

				for (let j = 0; j <= keepJ; j++)
					for (let i = 0; i <= keepI; i++) {
						const c = j * n + i;
						const [x, z] = cellCenter(i, j, d);
						atX[c] = x;
						atZ[c] = z;
						const field = caveFieldAt(x, z, surface[c], k, seed);
						for (let L = 0; L < levels; L++)
							value[c * levels + L] = field(top - L * d);
					}

				const inPatch = ([i, j]) => i >= 0 && j >= 0 && i <= keepI && j <= keepJ;
				const key = ([i, j]) => j * n + i;

				const emit = (p0, p1, p2, middle) => {
					const ux = p1[0] - p0[0];
					const uy = p1[1] - p0[1];
					const uz = p1[2] - p0[2];
					const vx = p2[0] - p0[0];
					const vy = p2[1] - p0[1];
					const vz = p2[2] - p0[2];
					let nx = uy * vz - uz * vy;
					let ny = uz * vx - ux * vz;
					let nz = ux * vy - uy * vx;
					const length = Math.hypot(nx, ny, nz);
					if (!length) return;
					nx /= length;
					ny /= length;
					nz /= length;
					// Away from the corners the surface cut off, which is the one thing
					// the case tables cannot supply.
					const ax = (p0[0] + p1[0] + p2[0]) / 3 - middle[0];
					const ay = (p0[1] + p1[1] + p2[1]) / 3 - middle[1];
					const az = (p0[2] + p1[2] + p2[2]) / 3 - middle[2];
					if (nx * ax + ny * ay + nz * az < 0) {
						nx = -nx;
						ny = -ny;
						nz = -nz;
					}
					const deep = Math.min(1, Math.max(0, (top - p0[1]) / (layers * d)));
					const color = mix([0.85, 0.62, 0.36], [0.32, 0.2, 0.26], deep);
					const nrm = [nx, ny, nz];
					mesh.vertex(p0, nrm, color);
					mesh.vertex(p1, nrm, color);
					mesh.vertex(p2, nrm, color);
				};

				const prism = (cells) => {
					if (!cells.every(inPatch)) return;
					const [A, B, C] = [...cells].sort((u, w) => key(u) - key(w));
					const ca = key(A);
					const cb = key(B);
					const cc = key(C);
					for (let L = 0; L < levels - 1; L++) {
						const yUpper = top - L * d;
						const yLower = top - (L + 1) * d;
						const a0 = [atX[ca], yUpper, atZ[ca]];
						const a1 = [atX[ca], yLower, atZ[ca]];
						const b0 = [atX[cb], yUpper, atZ[cb]];
						const b1 = [atX[cb], yLower, atZ[cb]];
						const c0 = [atX[cc], yUpper, atZ[cc]];
						const c1 = [atX[cc], yLower, atZ[cc]];
						const va0 = value[ca * levels + L];
						const va1 = value[ca * levels + L + 1];
						const vb0 = value[cb * levels + L];
						const vb1 = value[cb * levels + L + 1];
						const vc0 = value[cc * levels + L];
						const vc1 = value[cc * levels + L + 1];
						// Every layer of every prism, and nothing in it is drawn unless the
						// field changes sign inside it.
						if (
							(va0 > 0) === (va1 > 0) &&
							(va0 > 0) === (vb0 > 0) &&
							(va0 > 0) === (vb1 > 0) &&
							(va0 > 0) === (vc0 > 0) &&
							(va0 > 0) === (vc1 > 0)
						)
							continue;
						marchTetrahedron([a0, b0, c0, c1], [va0, vb0, vc0, vc1], emit);
						marchTetrahedron([a0, b0, c1, b1], [va0, vb0, vc1, vb1], emit);
						marchTetrahedron([a0, b1, c1, a1], [va0, vb1, vc1, va1], emit);
					}
				};

				for (let j = 0; j <= keepJ; j++)
					for (let i = 0; i <= keepI; i++) {
						const b = stepFrom(i, j, 0);
						const c = stepFrom(i, j, 1);
						prism([[i, j], b, c]);
						prism([b, c, stepFrom(c[0], c[1], 0)]);
					}
				return mesh;
			}

			// =============================================================
			// WebGL.
			// =============================================================

			const view = document.getElementById("view");
			const gl = view.getContext("webgl2", { antialias: true });

			const VERTEX_SOURCE = `#version 300 es
			precision highp float;
			layout(location = 0) in vec3 position;
			layout(location = 1) in vec3 normal;
			layout(location = 2) in vec3 tint;
			uniform mat4 viewProj;
			out vec3 vNormal;
			out vec3 vTint;
			void main() {
				vNormal = normal;
				vTint = tint;
				gl_Position = viewProj * vec4(position, 1.0);
			}`;

			const FRAGMENT_SOURCE = `#version 300 es
			precision highp float;
			in vec3 vNormal;
			in vec3 vTint;
			uniform vec3 sun;
			out vec4 color;
			void main() {
				vec3 n = normalize(vNormal);
				// One sun and a sky that is brighter overhead than underfoot,
				// which is doc 16's two terms with nothing else in them.
				float direct = max(0.0, dot(n, normalize(sun)));
				float sky = 0.5 + 0.5 * n.y;
				vec3 lit = vTint * (0.30 * sky + 0.75 * direct) + vec3(0.02, 0.025, 0.04) * sky;
				color = vec4(pow(max(lit, vec3(0.0)), vec3(1.0 / 2.2)), 1.0);
			}`;

			function compile(kind, source) {
				const shader = gl.createShader(kind);
				gl.shaderSource(shader, source);
				gl.compileShader(shader);
				if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
					throw new Error(gl.getShaderInfoLog(shader));
				return shader;
			}

			const program = gl.createProgram();
			gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SOURCE));
			gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SOURCE));
			gl.linkProgram(program);
			if (!gl.getProgramParameter(program, gl.LINK_STATUS))
				throw new Error(gl.getProgramInfoLog(program));

			const uViewProj = gl.getUniformLocation(program, "viewProj");
			const uSun = gl.getUniformLocation(program, "sun");

			const vao = gl.createVertexArray();
			const buffer = gl.createBuffer();
			gl.bindVertexArray(vao);
			gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
			const STRIDE = 9 * 4;
			gl.enableVertexAttribArray(0);
			gl.vertexAttribPointer(0, 3, gl.FLOAT, false, STRIDE, 0);
			gl.enableVertexAttribArray(1);
			gl.vertexAttribPointer(1, 3, gl.FLOAT, false, STRIDE, 12);
			gl.enableVertexAttribArray(2);
			gl.vertexAttribPointer(2, 3, gl.FLOAT, false, STRIDE, 24);
			gl.bindVertexArray(null);

			// The mesh carries correct outward normals on every face, so the
			// lighting does not depend on winding and nothing is culled -- which
			// also means the inside of a passage is lit rather than invisible.
			gl.disable(gl.CULL_FACE);
			gl.enable(gl.DEPTH_TEST);
			gl.clearColor(0.027, 0.039, 0.055, 1);

			let vertexCount = 0;
			let span = 40;
			const focus = [0, 0, 0];

			function upload(world, k) {
				const mesh =
					k.show === "smooth" ? buildSmooth(world, k) : buildMesh(world, k);
				gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
				gl.bufferData(
					gl.ARRAY_BUFFER,
					mesh.data.subarray(0, mesh.used),
					gl.DYNAMIC_DRAW,
				);
				vertexCount = mesh.used / 9;
				// The eye is put on the caves rather than on the middle of the
				// crust, which is mostly rock nobody is looking at.
				const middle = cellCenter(world.n >> 1, world.n >> 1, world.d);
				let sum = 0;
				for (let c = 0; c < world.n * world.n; c++) sum += world.surface[c];
				focus[0] = middle[0];
				focus[1] = sum / (world.n * world.n) - k.floorDepth;
				focus[2] = middle[1];
				span = (world.n - 1) * world.d * 1.2;
				return vertexCount;
			}

			// ---- the camera ----
			const camera = { yaw: 0.9, pitch: 0.38, distance: 1.25, lift: 0 };

			function multiply(a, b) {
				const out = new Float32Array(16);
				for (let c = 0; c < 4; c++)
					for (let r = 0; r < 4; r++) {
						let s = 0;
						for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
						out[c * 4 + r] = s;
					}
				return out;
			}
			function perspective(fov, aspect, near, far) {
				const f = 1 / Math.tan(fov / 2);
				const out = new Float32Array(16);
				out[0] = f / aspect;
				out[5] = f;
				out[10] = (far + near) / (near - far);
				out[11] = -1;
				out[14] = (2 * far * near) / (near - far);
				return out;
			}
			function cross(a, b) {
				return [
					a[1] * b[2] - a[2] * b[1],
					a[2] * b[0] - a[0] * b[2],
					a[0] * b[1] - a[1] * b[0],
				];
			}
			function norm(v) {
				const l = Math.hypot(v[0], v[1], v[2]) || 1;
				return [v[0] / l, v[1] / l, v[2] / l];
			}
			function lookAt(eye, at, upHint) {
				const f = norm([at[0] - eye[0], at[1] - eye[1], at[2] - eye[2]]);
				const s = norm(cross(f, upHint));
				const u = cross(s, f);
				const out = new Float32Array(16);
				out[0] = s[0]; out[4] = s[1]; out[8] = s[2];
				out[1] = u[0]; out[5] = u[1]; out[9] = u[2];
				out[2] = -f[0]; out[6] = -f[1]; out[10] = -f[2];
				out[12] = -(s[0] * eye[0] + s[1] * eye[1] + s[2] * eye[2]);
				out[13] = -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]);
				out[14] = f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2];
				out[15] = 1;
				return out;
			}

			function render() {
				const dpr = Math.min(2, window.devicePixelRatio || 1);
				const width = Math.max(1, Math.round(view.clientWidth * dpr));
				const height = Math.max(1, Math.round(view.clientHeight * dpr));
				if (view.width !== width || view.height !== height) {
					view.width = width;
					view.height = height;
				}
				gl.viewport(0, 0, width, height);
				gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
				if (!vertexCount) return;

				const away = span * camera.distance;
				const eye = [
					focus[0] + Math.sin(camera.yaw) * Math.cos(camera.pitch) * away,
					focus[1] +
						Math.sin(camera.pitch) * away +
						camera.lift * span,
					focus[2] + Math.cos(camera.yaw) * Math.cos(camera.pitch) * away,
				];
				const proj = perspective(0.9, width / height, span * 0.004, span * 14);
				gl.useProgram(program);
				gl.uniformMatrix4fv(
					uViewProj,
					false,
					multiply(proj, lookAt(eye, focus, [0, 1, 0])),
				);
				gl.uniform3f(uSun, 0.45, 0.74, 0.5);
				gl.bindVertexArray(vao);
				gl.drawArrays(gl.TRIANGLES, 0, vertexCount);
			}

			// ---- turning it ----
			let dragging = null;
			view.addEventListener("pointerdown", (event) => {
				dragging = {
					x: event.clientX,
					y: event.clientY,
					shift: event.shiftKey,
				};
				view.setPointerCapture(event.pointerId);
			});
			view.addEventListener("pointermove", (event) => {
				if (!dragging) return;
				const dx = event.clientX - dragging.x;
				const dy = event.clientY - dragging.y;
				dragging.x = event.clientX;
				dragging.y = event.clientY;
				if (dragging.shift) {
					camera.lift = Math.max(-2, Math.min(2, camera.lift + dy * 0.004));
				} else {
					camera.yaw -= dx * 0.006;
					camera.pitch = Math.max(
						-1.4,
						Math.min(1.4, camera.pitch + dy * 0.005),
					);
				}
				render();
			});
			for (const done of ["pointerup", "pointercancel"])
				view.addEventListener(done, () => {
					dragging = null;
				});
			view.addEventListener(
				"wheel",
				(event) => {
					event.preventDefault();
					camera.distance = Math.max(
						0.25,
						Math.min(6, camera.distance * Math.exp(event.deltaY * 0.0012)),
					);
					render();
				},
				{ passive: false },
			);
			window.addEventListener("resize", () => render());

			// =============================================================
			// The panel, the readout, and the loop that keeps them live.
			// =============================================================

			const facts = document.getElementById("facts");
			const rows = new Map();
			let showRows = () => {};

			function buildPanel() {
				const host = document.getElementById("knobs");
				const groups = [];
				for (const group of KNOBS) {
					const set = document.createElement("details");
					set.className = "group";
					set.open = group.open !== false;
					const legend = document.createElement("summary");
					legend.textContent = group.group;
					set.append(legend);
					for (const row of group.rows) {
						const wrap = document.createElement("div");
						wrap.className =
							"knob" + (row.type === "check" ? " check" : "");
						const label = document.createElement("label");
						label.textContent = row.label;
						let input;
						if (row.type === "select") {
							input = document.createElement("select");
							for (const option of row.options) {
								const o = document.createElement("option");
								o.value = option;
								o.textContent = option;
								input.append(o);
							}
							input.value = knobs[row.key];
						} else if (row.type === "text") {
							input = document.createElement("input");
							input.type = "text";
							input.value = knobs[row.key];
						} else if (row.type === "check") {
							input = document.createElement("input");
							input.type = "checkbox";
							input.checked = knobs[row.key];
						} else {
							input = document.createElement("input");
							input.type = "range";
							input.min = row.low;
							input.max = row.high;
							input.step = row.step;
							input.value = knobs[row.key];
						}

						const readout = document.createElement("output");
						if (row.type === "check") wrap.append(input, label);
						else if (row.type === "select" || row.type === "text")
							wrap.append(label, readout, input);
						else wrap.append(label, readout, input);

						const commit = () => {
							if (row.type === "check") knobs[row.key] = input.checked;
							else if (row.type === "select" || row.type === "text")
								knobs[row.key] = input.value;
							else knobs[row.key] = Number(input.value);
							show();
							showRows();
							askForRedraw();
						};
						const show = () => {
							if (row.type === "check" || row.type === "text") {
								readout.textContent = "";
								return;
							}
							if (row.type === "select") {
								readout.textContent = "";
								return;
							}
							const v = knobs[row.key];
							readout.textContent =
								(row.decimals ? v.toFixed(row.decimals) : String(v)) +
								(row.unit || "");
						};
						input.addEventListener("input", commit);
						input.addEventListener("change", commit);
						show();
						set.append(wrap);
						rows.set(row.key, { row, input, show, wrap });
					}
					groups.push({ group, set });
					host.append(set);
				}

				/**
				 * A row with no meaning comes off the panel; it is not greyed out.
				 *
				 * The two carves share the seed, the ground and the volume and share
				 * nothing else, so half of this panel means nothing at any moment. A
				 * disabled row is a question the reader has to answer before
				 * dismissing it.
				 */
				showRows = () => {
					for (const entry of groups)
						entry.set.style.display =
							entry.group.shownWhen && !entry.group.shownWhen(knobs)
								? "none"
								: "";
					for (const entry of rows.values())
						entry.wrap.style.display =
							entry.row.shownWhen && !entry.row.shownWhen(knobs) ? "none" : "";
				};
				showRows();

				const note = document.createElement("p");
				note.className = "note";
				note.textContent =
					"Cut across and Cut along take the far corner off the block " +
					"so the passages can be looked into. Draw · void turns the " +
					"world inside out and draws the caves as the solid, which is " +
					"the only view that shows a network from outside it. Draw · " +
					"smooth is the same cave as an isosurface, drawn where the " +
					"carve actually puts it rather than on the nearest block " +
					"boundary — a picture of what the block grid rounds off, and " +
					"not a world: nothing in it can be broken or stood on.";
				host.append(note);
			}

			let pending = 0;
			function askForRedraw() {
				if (pending) return;
				pending = requestAnimationFrame(() => {
					pending = 0;
					redraw();
				});
			}

			function percent(part, whole) {
				return whole ? ((100 * part) / whole).toFixed(1) + "%" : "0%";
			}

			function redraw() {
				const k = knobs;
				const world = build(k);
				const m = measure(world, k);
				const meshStarted = performance.now();
				const verts = upload(world, k);
				const meshMillis = performance.now() - meshStarted;

				drawPlan(world, k);
				render();
				writeUrl();

				const across = (world.n - 1) * world.d;
				const deep = world.layers * world.d;
				const perColumn = m.withCaves / m.columns;
				const bare = m.without / m.columns;
				const narrow = m.medianWidth < 2;
				facts.innerHTML =
					`<div><b>${Math.round(across)} × ${Math.round(across)} m</b> of ground, ` +
					`<b>${Math.round(deep)} m</b> of crust, ${m.columns.toLocaleString()} columns</div>` +
					`<div>passage in <b>${percent(m.caveColumns, m.columns)}</b> of columns · ` +
					`${m.caveCells.toLocaleString()} cave blocks</div>` +
					`<div class="${narrow ? "warn" : ""}">narrowest way through, median ` +
					`<b>${m.medianWidth} cell${m.medianWidth === 1 ? "" : "s"}</b>` +
					` · ${percent(Math.round(m.thinShare * m.caveColumns), m.caveColumns)} of it one cell</div>` +
					`<div>separate systems <b>${m.systems.toLocaleString()}</b> · ` +
					`largest holds <b>${percent(m.largest, m.caveCells)}</b> · ` +
					`half the void is in the biggest <b>${m.half}</b></div>` +
					`<div>mouths at the surface <b>${m.mouths}</b> · ` +
					`columns with more than one span <b>${percent(m.multiSpan, m.columns)}</b></div>` +
					`<div>faces per column <b>${perColumn.toFixed(1)}</b> against ` +
					`<b>${bare.toFixed(1)}</b> with no caves — <b>×${(perColumn / (bare || 1)).toFixed(2)}</b></div>` +
					`<div>${(verts / 3).toLocaleString()} triangles` +
					(k.show === "smooth"
						? ` against <b>${(2 * m.voidFaces).toLocaleString()}</b> for the same cave in blocks`
						: "") +
					" · " +
					`<b>${(world.lookups / m.columns).toFixed(1)}</b> noise lookups a column · ` +
					`generate ${world.millis.toFixed(0)} ms · mesh ${meshMillis.toFixed(0)} ms</div>`;
			}

			// ---- the link, so a world that looked right can be handed over ----
			function writeUrl() {
				const params = new URLSearchParams();
				for (const group of KNOBS)
					for (const row of group.rows) {
						const v = knobs[row.key];
						params.set(row.key, typeof v === "boolean" ? (v ? "1" : "0") : v);
					}
				history.replaceState(null, "", "?" + params.toString());
			}

			function fromUrl() {
				const params = new URLSearchParams(location.search);
				if (![...params.keys()].length) return;
				for (const group of KNOBS)
					for (const row of group.rows) {
						if (!params.has(row.key)) continue;
						const raw = params.get(row.key);
						if (row.type === "check") knobs[row.key] = raw === "1";
						else if (row.type === "select" || row.type === "text")
							knobs[row.key] = raw;
						else if (Number.isFinite(Number(raw)))
							knobs[row.key] = Number(raw);
					}
			}

			fromUrl();
			buildPanel();
			redraw();
		</script>
	</body>
</html>
