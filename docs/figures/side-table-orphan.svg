<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300">
<style>
  .cf-l{stroke:#9aa3b2;fill:none;stroke-width:1}
  .cf-m{stroke:#48505f;fill:none;stroke-width:1.5}
  .cf-fill{fill:#eceff5;stroke:#48505f;stroke-width:1.5}
  .cf-a{stroke:#2f6fd0;fill:none;stroke-width:2}
  .cf-af{fill:#dbe5f5;stroke:#2f6fd0;stroke-width:2}
  .cf-g{stroke:#b0800f;fill:none;stroke-width:2}
  .cf-gf{fill:#f5ead0;stroke:#b0800f;stroke-width:2}
  .cf-void{fill:#ffffff;stroke:#48505f;stroke-width:1.5}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;font-size:12px;fill:#39404d}
  text.cf-d{fill:#77808f;font-size:11.5px}
  text.cf-c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#2f6fd0}
  text.cf-gd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#b0800f}
  text.cf-big{font-size:14px;font-weight:600}
  @media (prefers-color-scheme:dark){
    .cf-l{stroke:#5c6577} .cf-m{stroke:#aeb6c4} .cf-fill{fill:#1b2333;stroke:#aeb6c4}
    .cf-a{stroke:#6aa2f0} .cf-af{fill:#1a2942;stroke:#6aa2f0}
    .cf-g{stroke:#e0b355} .cf-gf{fill:#2a2210;stroke:#e0b355}
    .cf-void{fill:#0f141d;stroke:#aeb6c4}
    text{fill:#d3d9e4} text.cf-d{fill:#98a1b2} text.cf-c{fill:#6aa2f0} text.cf-gd{fill:#e0b355}
  }
</style>

  <text class="cf-big" x="22" y="26">the same four moves, under two rules</text>
  <text class="cf-d" x="74" y="46" text-anchor="middle">1. place a chest</text><rect class="cf-af" x="22" y="54" width="104" height="30" rx="4"/><text class="cf-c" x="74" y="73" text-anchor="middle">chest</text><text class="cf-d" x="186" y="46" text-anchor="middle">2. fill it with ore</text><rect class="cf-af" x="134" y="54" width="104" height="30" rx="4"/><text class="cf-c" x="186" y="73" text-anchor="middle">chest</text><text class="cf-d" x="298" y="46" text-anchor="middle">3. break it</text><rect class="cf-void" x="246" y="54" width="104" height="30" rx="4"/><text class="cf-c" x="298" y="73" text-anchor="middle">air</text><text class="cf-d" x="410" y="46" text-anchor="middle">4. place stone</text><rect class="cf-fill" x="358" y="54" width="104" height="30" rx="4"/><text class="cf-c" x="410" y="73" text-anchor="middle">stone</text>
  <text class="cf-d" x="22" y="112">A &#8212; the TYPE decides whether an entry may exist</text>
  <rect class="cf-fill" x="22" y="120" width="104" height="26" rx="4"/><text class="cf-c" x="74" y="137" text-anchor="middle">[CHEST]</text><rect class="cf-fill" x="134" y="120" width="104" height="26" rx="4"/><text class="cf-c" x="186" y="137" text-anchor="middle">[CHEST 108B]</text><rect class="cf-gf" x="246" y="120" width="104" height="26" rx="4"/><text class="cf-gd" x="298" y="137" text-anchor="middle">[CHEST 108B]</text><rect class="cf-gf" x="358" y="120" width="104" height="26" rx="4"/><text class="cf-gd" x="410" y="137" text-anchor="middle">[CHEST 108B]</text>
  <path class="cf-g" d="M246 152 L462 152"/>
  <text class="cf-gd" x="246" y="168">orphaned</text>
  <text class="cf-d" x="22" y="192">Stone says "no side data", so nothing reads the blob and nothing</text>
  <text class="cf-d" x="22" y="208">frees it. A chest placed here later inherits someone else's ore.</text>
  <text class="cf-d" x="22" y="240">C &#8212; the TABLE decides, and writing a block clears its side data</text>
  <rect class="cf-fill" x="22" y="248" width="104" height="26" rx="4"/><text class="cf-c" x="74" y="265" text-anchor="middle">[CHEST]</text><rect class="cf-fill" x="134" y="248" width="104" height="26" rx="4"/><text class="cf-c" x="186" y="265" text-anchor="middle">[CHEST 108B]</text><rect class="cf-void" x="246" y="248" width="104" height="26" rx="4"/><text class="cf-c" x="298" y="265" text-anchor="middle">not in the map</text><rect class="cf-void" x="358" y="248" width="104" height="26" rx="4"/><text class="cf-c" x="410" y="265" text-anchor="middle">not in the map</text>
  <text class="cf-d" x="22" y="296">One rule, no cases, nothing left behind.</text>
</svg>
