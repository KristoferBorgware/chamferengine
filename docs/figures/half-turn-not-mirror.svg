    text{fill:#d3d9e4} text.cf-d{fill:#98a1b2} text.cf-c{fill:#6aa2f0} text.cf-gd{fill:#e0b355}
  }
</style>

  <text class="cf-d" x="82" y="26" text-anchor="middle">the parent&#8217;s frame</text>
  <polygon class="cf-af" points="82.0,78.0 108.0,93.0 108.0,123.0 82.0,138.0 56.0,123.0 56.0,93.0"/><path class="cf-l" d="M93.0 88.9L100.0 76.8"/><text class="cf-c" x="110.0" y="75.6" text-anchor="middle">0</text><path class="cf-l" d="M104.0 108.0L118.0 108.0"/><text class="cf-c" x="131.0" y="112.0" text-anchor="middle">1</text><path class="cf-l" d="M93.0 127.1L100.0 139.2"/><text class="cf-c" x="110.0" y="148.4" text-anchor="middle">2</text><path class="cf-l" d="M71.0 127.1L64.0 139.2"/><text class="cf-c" x="54.0" y="148.4" text-anchor="middle">3</text><path class="cf-l" d="M60.0 108.0L46.0 108.0"/><text class="cf-c" x="33.0" y="112.0" text-anchor="middle">4</text><path class="cf-l" d="M71.0 88.9L64.0 76.8"/><text class="cf-c" x="54.0" y="75.6" text-anchor="middle">5</text>
