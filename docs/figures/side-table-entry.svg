  <text class="cf-big" x="22" y="26">one entry in the side table</text>
  <rect class="cf-gf" x="22" y="40" width="118" height="22" rx="4"/>
  <text class="cf-c" x="30" y="55">cell 0x2B07&#8230;</text>
  <path class="cf-l" d="M146 51 L172 51" marker-end="url(#st)"/>
  <defs><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#9aa3b2"/></marker>
  <marker id="st2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#b0800f"/></marker></defs>
  <text class="cf-d" x="180" y="55">a blob: one or more of these, back to back</text>
  <rect class="cf-af" x="22" y="78" width="44" height="34" rx="3"/><text x="44" y="93" text-anchor="middle">tag</text><text class="cf-c" x="44" y="107" text-anchor="middle">CHEST</text><rect class="cf-af" x="69" y="78" width="44" height="34" rx="3"/><text x="91" y="93" text-anchor="middle">length</text><text class="cf-c" x="91" y="107" text-anchor="middle">108</text><rect class="cf-af" x="116" y="78" width="148" height="34" rx="3"/><text x="190" y="93" text-anchor="middle">payload</text><text class="cf-c" x="190" y="107" text-anchor="middle">27 slots x 4 B</text><rect class="cf-gf" x="267" y="78" width="44" height="34" rx="3"/><text x="289" y="93" text-anchor="middle">tag</text><text class="cf-c" x="289" y="107" text-anchor="middle">NAME</text><rect class="cf-gf" x="314" y="78" width="44" height="34" rx="3"/><text x="336" y="93" text-anchor="middle">length</text><text class="cf-c" x="336" y="107" text-anchor="middle">14</text><rect class="cf-gf" x="361" y="78" width="100" height="34" rx="3"/><text x="411" y="93" text-anchor="middle">payload</text><text class="cf-c" x="411" y="107" text-anchor="middle">"Ore stash"</text>
  <path class="cf-g" d="M361 120 C387 148 435 148 461 122" marker-end="url(#st2)"/>
  <text class="cf-gd" x="411" y="168" text-anchor="middle">jump 14 bytes</text>
  <text class="cf-d" x="22" y="152">an older build,</text>
  <text class="cf-d" x="22" y="168">reading this:</text>
  <text class="cf-d" x="22" y="192">It has never heard of NAME. It does not crash and it does not guess &#8212; it</text>
  <text class="cf-d" x="22" y="208">reads the tag, does not know it, reads the length, and steps over the</text>
  <text class="cf-d" x="22" y="224">payload to whatever comes next. That is the only reason a length is stored.</text>
</svg>
