<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
<style>
  .cf-l{stroke:#9aa3b2;fill:none;stroke-width:1}
  .cf-m{stroke:#48505f;fill:none;stroke-width:1.5}
  .cf-fill{fill:#eceff5;stroke:#48505f;stroke-width:1.5}
  .cf-a{stroke:#2f6fd0;fill:none;stroke-width:2}
  .cf-af{fill:#dbe5f5;stroke:#2f6fd0;stroke-width:2}
  .cf-g{stroke:#b0800f;fill:none;stroke-width:2}
  .cf-gf{fill:#f5ead0;stroke:#b0800f;stroke-width:2}
  .cf-void{fill:#ffffff;stroke:#48505f;stroke-width:1.5}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;font-size:12px;fill:#39404d}
  text.cf-d{fill:#77808f;font-size:11.5px}
  text.cf-c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#2f6fd0}
  text.cf-gd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#b0800f}
  text.cf-big{font-size:14px;font-weight:600}
  @media (prefers-color-scheme:dark){
    .cf-l{stroke:#5c6577} .cf-m{stroke:#aeb6c4} .cf-fill{fill:#1b2333;stroke:#aeb6c4}
    .cf-a{stroke:#6aa2f0} .cf-af{fill:#1a2942;stroke:#6aa2f0}
    .cf-g{stroke:#e0b355} .cf-gf{fill:#2a2210;stroke:#e0b355}
    .cf-void{fill:#0f141d;stroke:#aeb6c4}
    text{fill:#d3d9e4} text.cf-d{fill:#98a1b2} text.cf-c{fill:#6aa2f0} text.cf-gd{fill:#e0b355}
  }
</style>

  <text class="cf-big" x="20" y="24">server</text>
  <text class="cf-big" x="310" y="24">client</text>
  <text class="cf-d" x="20" y="44">one per world</text>
  <text class="cf-d" x="310" y="44">native, or the same code as wasm</text>

  <text class="cf-c" x="20" y="70">the core &#8212; bit-identical, both sides</text>
  <rect class="cf-af" x="20" y="78" width="190" height="20" rx="3"/><text class="cf-c" x="28" y="92">ID &#183; position &#8596; cell</text><rect class="cf-af" x="20" y="102" width="190" height="20" rx="3"/><text class="cf-c" x="28" y="116">neighbour &#183; rank</text><rect class="cf-af" x="20" y="126" width="190" height="20" rx="3"/><text class="cf-c" x="28" y="140">noise &#183; terrain</text><rect class="cf-af" x="20" y="150" width="190" height="20" rx="3"/><text class="cf-c" x="28" y="164">the coarse map</text>
  <rect class="cf-af" x="310" y="78" width="190" height="20" rx="3"/><text class="cf-c" x="318" y="92">ID &#183; position &#8596; cell</text><rect class="cf-af" x="310" y="102" width="190" height="20" rx="3"/><text class="cf-c" x="318" y="116">neighbour &#183; rank</text><rect class="cf-af" x="310" y="126" width="190" height="20" rx="3"/><text class="cf-c" x="318" y="140">noise &#183; terrain</text><rect class="cf-af" x="310" y="150" width="190" height="20" rx="3"/><text class="cf-c" x="318" y="164">the coarse map</text>

  <text class="cf-gd" x="20" y="196">only here</text>
  <rect class="cf-gf" x="20" y="204" width="190" height="20" rx="3"/><text class="cf-c" x="28" y="218">the delta store</text><rect class="cf-gf" x="20" y="228" width="190" height="20" rx="3"/><text class="cf-c" x="28" y="242">interest &#183; authority</text>
  <text class="cf-d" x="310" y="196">only here</text>
  <rect class="cf-fill" x="310" y="204" width="190" height="20" rx="3"/><text class="cf-c" x="318" y="218">mesh &#183; light &#183; LOD</text><rect class="cf-fill" x="310" y="228" width="190" height="20" rx="3"/><text class="cf-c" x="318" y="242">render &#183; input</text>

  <path class="cf-a" d="M216 110 L304 110" marker-end="url(#wr)"/>
  <path class="cf-a" d="M304 132 L216 132" marker-end="url(#wr)"/>
  <defs><marker id="wr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#2f6fd0"/></marker></defs>
  <text class="cf-c" x="260" y="104" text-anchor="middle">edits</text>
  <text class="cf-c" x="260" y="148" text-anchor="middle">position</text>
  <text class="cf-d" x="260" y="172" text-anchor="middle">and</text>
  <text class="cf-d" x="260" y="186" text-anchor="middle">nothing</text>
  <text class="cf-d" x="260" y="200" text-anchor="middle">else</text>

  <path class="cf-l" d="M20 280L500 280"/>
  <text class="cf-d" x="20" y="302">The terrain never crosses the wire, and neither does the 2.5 MB coarse map:</text>
  <text class="cf-d" x="20" y="318">both sides run the same core on the same seed and get the same bits. That is</text>
  <text class="cf-d" x="20" y="334">the whole return on doc 23, and single player is this picture in one process.</text>
</svg>
