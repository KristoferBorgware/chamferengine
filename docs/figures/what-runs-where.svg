<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" width="520" height="396">
<style>
  .cf-l{stroke:#9aa3b2;fill:none;stroke-width:1}
  .cf-m{stroke:#48505f;fill:none;stroke-width:1.5}
  .cf-fill{fill:#eceff5;stroke:#48505f;stroke-width:1.5}
  .cf-a{stroke:#2f6fd0;fill:none;stroke-width:2}
  .cf-af{fill:#dbe5f5;stroke:#2f6fd0;stroke-width:2}
  .cf-g{stroke:#b0800f;fill:none;stroke-width:2}
  .cf-gf{fill:#f5ead0;stroke:#b0800f;stroke-width:2}
  .cf-void{fill:#ffffff;stroke:#48505f;stroke-width:1.5}
  text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;font-size:12px;fill:#39404d}
  text.cf-d{fill:#77808f;font-size:11.5px}
  text.cf-c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#2f6fd0}
  text.cf-gd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#b0800f}
  text.cf-big{font-size:14px;font-weight:600}
  @media (prefers-color-scheme:dark){
    .cf-l{stroke:#5c6577} .cf-m{stroke:#aeb6c4} .cf-fill{fill:#1b2333;stroke:#aeb6c4}
    .cf-a{stroke:#6aa2f0} .cf-af{fill:#1a2942;stroke:#6aa2f0}
    .cf-g{stroke:#e0b355} .cf-gf{fill:#2a2210;stroke:#e0b355}
    .cf-void{fill:#0f141d;stroke:#aeb6c4}
    text{fill:#d3d9e4} text.cf-d{fill:#98a1b2} text.cf-c{fill:#6aa2f0} text.cf-gd{fill:#e0b355}
  }
</style>

  <defs><marker id="wr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#2f6fd0"/></marker>
  <marker id="wg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#b0800f"/></marker></defs>

  <text class="cf-big" x="110" y="26">server &#8212; stores and routes</text>
  <text class="cf-d" x="110" y="42">no terrain, ever</text>
  <rect class="cf-af" x="110" y="48" width="300" height="20" rx="3"/><text class="cf-c" x="118" y="62">addressing</text><rect class="cf-fill" x="110" y="72" width="300" height="20" rx="3"/><text class="cf-c" x="118" y="86">the delta store</text><rect class="cf-fill" x="110" y="96" width="300" height="20" rx="3"/><text class="cf-c" x="118" y="110">interest</text>

  <path class="cf-a" d="M160 126 L119 190" marker-end="url(#wr)"/>
  <path class="cf-a" d="M360 126 L401 190" marker-end="url(#wr)"/>
  <text class="cf-c" x="260" y="148" text-anchor="middle">edits &#183; positions</text>
  <text class="cf-d" x="260" y="164" text-anchor="middle">and nothing else</text>

  <text class="cf-big" x="20" y="192">client A</text>
  <text class="cf-big" x="302" y="192">client B</text>
  <rect class="cf-af" x="20" y="200" width="198" height="20" rx="3"/><text class="cf-c" x="28" y="214">addressing</text><rect class="cf-gf" x="20" y="224" width="198" height="20" rx="3"/><text class="cf-c" x="28" y="238">generation &#8212; the terrain</text><rect class="cf-fill" x="20" y="248" width="198" height="20" rx="3"/><text class="cf-c" x="28" y="262">mesh &#183; light &#183; render</text>
  <rect class="cf-af" x="302" y="200" width="198" height="20" rx="3"/><text class="cf-c" x="310" y="214">addressing</text><rect class="cf-gf" x="302" y="224" width="198" height="20" rx="3"/><text class="cf-c" x="310" y="238">generation &#8212; the terrain</text><rect class="cf-fill" x="302" y="248" width="198" height="20" rx="3"/><text class="cf-c" x="310" y="262">mesh &#183; light &#183; render</text>

  <path class="cf-g" d="M222 234 L298 234" marker-end="url(#wg)"/>
  <path class="cf-g" d="M298 234 L222 234" marker-end="url(#wg)"/>
  <text class="cf-gd" x="260" y="222" text-anchor="middle">same bits</text>

  <path class="cf-l" d="M20 330L500 330"/>
  <text class="cf-d" x="20" y="352">The gold arrow is the one that matters, and no data flows along it. Two</text>
  <text class="cf-d" x="20" y="368">clients must agree about terrain to the bit and never exchange a byte about</text>
  <text class="cf-d" x="20" y="384">it &#8212; so determinism is a client-to-client rule, not a client-to-server one.</text>
</svg>
