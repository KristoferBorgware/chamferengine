  <path class="cf-l" d="M104.0 118.0L112.0 14.8M104.0 118.0L33.0 151.6M104.0 118.0L191.0 151.6"/>
  <circle cx="104.0" cy="118.0" r="4" fill="#48505f"/>
  <text class="cf-d" x="112.0" y="6.8" text-anchor="middle">A</text>
  <text class="cf-d" x="23.0" y="157.6" text-anchor="middle">B</text>
  <text class="cf-d" x="201.0" y="157.6" text-anchor="middle">C</text>
