  <text class="cf-c" x="396.0" y="88">10</text>
  <text class="cf-d" x="14" y="34">the route really crosses 10 cells, because these are wide ones</text>
  <path class="cf-g" d="M40.0 128L40.0 152"/><path class="cf-g" d="M71.8 128L71.8 152"/><path class="cf-g" d="M103.6 128L103.6 152"/><path class="cf-g" d="M135.5 128L135.5 152"/><path class="cf-g" d="M167.3 128L167.3 152"/><path class="cf-g" d="M199.1 128L199.1 152"/><path class="cf-g" d="M230.9 128L230.9 152"/><path class="cf-g" d="M262.7 128L262.7 152"/><path class="cf-g" d="M294.5 128L294.5 152"/><path class="cf-g" d="M326.4 128L326.4 152"/><path class="cf-g" d="M358.2 128L358.2 152"/><path class="cf-g" d="M390.0 128L390.0 152"/>
  <path class="cf-l" d="M40 140L390.0 140"/>
  <text class="cf-gd" x="396.0" y="144">11</text>
  <text class="cf-gd" x="14" y="178">divide the distance by the AVERAGE cell and you predict 11</text>
  <text class="cf-d" x="14" y="196">an estimate that is too high makes A* miss the shortest path &#8212;</text>
  <text class="cf-c" x="14" y="214">so divide by the LARGEST cell, 1.098 &#215; nominal, and never by the average</text>
