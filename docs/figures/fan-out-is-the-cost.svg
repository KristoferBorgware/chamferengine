  <text class="cf-c" x="398" y="212">storage</text>
  <text class="cf-d" x="398" y="228">76 MB, flat</text>
  <text class="cf-d" x="227.0" y="274" text-anchor="middle">players</text>
  <path class="cf-l" d="M14 296L506 296"/>
  <text class="cf-d" x="14" y="318">Storage is the number everyone watches, and it never moves. Fan-out is the</text>
  <text class="cf-d" x="14" y="334">one that bills, because interest management IS fan-out &#8212; so count</text>
  <text class="cf-d" x="14" y="350">messages per second from the first day.</text>
