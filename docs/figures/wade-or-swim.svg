  <text class="cf-c" x="14" y="26">one block of water and you stand &#8212; two and your feet leave the floor</text>
  <text class="cf-d" x="14" y="206.0">85.3% of the water&#8217;s edge is one block deep, 14.7% is two or more. At 1 m</text>
  <text class="cf-d" x="14" y="224.0">blocks a 1.8 m player has no chest-deep state, so the walking/swimming</text>
  <text class="cf-d" x="14" y="242.0">threshold is exactly one cell wide &#8212; and the bank out is a single step</text>
