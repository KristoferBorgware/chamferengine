<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chamfer — planet</title>
		<link rel="stylesheet" href="./src/planet.css" />
	</head>
	<body>
		<canvas id="viewport"></canvas>
		<div id="readout" class="readout">
			<button
				id="readout-open"
				class="readout-open"
				type="button"
				aria-expanded="false"
				aria-controls="status"
				title="What the world is doing"
			>
				i
			</button>
			<div id="status" class="status">
				<div id="status-body" class="status-body"></div>
				<!-- A row of its own, always here, so what the world is busy
				     doing cannot resize the box it is written in. -->
				<div id="status-work" class="status-work"></div>
			</div>
		</div>
		<div id="crosshair" class="crosshair" aria-hidden="true"></div>
		<script type="module" src="./src/planet.ts"></script>
	</body>
</html>
