name: Publish the engine and the documentation

# Builds both halves of the site and publishes them to GitHub Pages.
#
#   /             the client: a seed entry page, and the planet it opens
#   /docs/        the specification, its diagrams, its demos and its proofs
#
# Three things gate a publish, and each fails the deploy on its own:
# make-reference.js runs every verification script, check-style.js holds the
# documents to the writing rules, and the workspace has to typecheck and pass
# its tests. The site does not go out unless the maths, the prose and the
# engine all still hold.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the workspace
        # tools/ and verification/ are still zero-dependency plain Node. This
        # installs what the engine build needs: Vite, TypeScript and Vitest.
        run: npm ci

      - name: Typecheck the workspace
        run: npm run typecheck

      - name: Run the engine tests
        run: npm test

      - name: Regenerate the diagrams
        run: node tools/make-figures.js

      - name: Run every proof, and rebuild the reference from its output
        run: node tools/make-reference.js

      - name: Hold the documents to the writing rules
        run: node tools/check-style.js

      - name: Build the client
        # Pages serves from a subdirectory named after the repository, so every
        # asset URL needs that prefix or the page loads and draws nothing.
        env:
          CHAMFER_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Assemble the documentation under /docs/
        run: node tools/build-docs.js --pages _site/docs

      - name: Put the client at the root
        run: cp -r packages/client/dist/. _site/

      - name: Report what was published, and any drift from the committed files
        if: always()
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| documents | $(ls docs/*.md | wc -l) |"
            echo "| diagrams | $(ls docs/figures/*.svg | wc -l) |"
            echo "| demos | $(ls demos/*.html | wc -l) |"
            echo "| verification scripts | $(ls verification/*.js | wc -l) |"
            echo "| engine packages | $(ls -d packages/*/ | wc -l) |"
            echo "| files in the artifact | $(find _site -type f | wc -l) |"
            echo ""
            if git diff --quiet -- docs/figures docs/REFERENCE.md; then
              echo "Generated files in the repository are up to date."
            else
              echo "> **Note:** the published site was rebuilt from source and differs from"
              echo "> the committed generated files. The site is correct; the repository is"
              echo "> stale. Run \`node tools/make-figures.js && node tools/make-reference.js\`"
              echo "> and commit."
              echo ""
              echo '```'
              git diff --stat -- docs/figures docs/REFERENCE.md
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
